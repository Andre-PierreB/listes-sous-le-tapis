<script>
// ---- 9.2 : porte unique vers le stockage ----
// Toutes les lectures / écritures des données passent par Store (et plus
// jamais directement par localStorage). Ce qui arrive d'ailleurs (autre
// onglet, et demain autre appareil) passe par applyExternalChange() (plus bas).
// ---- 10.0 : nouveau rangement des données (préparation synchro / partage) ----
// Les données ne vivent plus dans ~19 clés communes « fauconnerie-v2-… » où une
// tâche est repérée par sa position (« idListe:index »), mais dans des FICHES :
//   sltapis:list:<id>  une fiche par liste : titre, couleur, sens, ordre,
//                      membres, et ses tâches, chacune avec un identifiant
//                      stable (id) — sa coche, sa date de coche et ses
//                      modifications voyagent avec elle ;
//   sltapis:user:moi   la fiche « moi » : ordre de mes listes, ordre des cases
//                      urgente / en cours, corbeille, journal « en cours »,
//                      date de la dernière purge ;
//   sltapis:local      réglages de CET appareil (trèfle du jour, détails
//                      dépliés, switch du graphique, rappel de sauvegarde) ;
//   sltapis:residue    tenue de compte interne, propre à cet appareil (voir
//                      plus bas) ; sltapis:meta (version), sltapis:rev (jeton
//                      qui change à chaque écriture, pour les autres onglets).
// Demain (synchro), seules les fiches « list » et « user » partiront en ligne.
//
// Le reste du code n'a PAS changé : il continue de lire / écrire les anciennes
// clés via Store.get / Store.set / Store.remove. Store traduit au vol : une
// ancienne clé n'est plus qu'une « vue » calculée à partir des fiches (et une
// écriture est répartie dans les fiches concernées). Chaque ancienne clé garde
// exactement son sens d'avant, y compris le repérage par position : c'est ce
// qui garantit que l'écran ne change pas. Les vraies anciennes clés, elles,
// ne sont plus jamais ni modifiées ni supprimées : elles restent telles
// qu'elles étaient au passage en 10.0, comme copie de secours.
//
// Migration : au premier chargement, les anciennes clés sont lues et rangées
// dans les fiches, en mémoire, puis on vérifie que chaque ancienne clé se
// recalcule à l'identique. Seulement alors les fiches sont écrites (et
// sltapis:meta en dernier). Si la vérification échoue, rien n'est écrit et
// l'appli tourne comme en 9.4, directement sur les anciennes clés (Store.mode
// = "legacy") — rien n'est perdu.
// 10.1 : la page d'essai (essai.html) a ses propres données, à part : tout ce
// qu'elle range dans le navigateur porte le préfixe « essai: », et en ligne ses
// fiches vont dans des collections « essai_… ». L'appli elle-même n'y touche jamais.
const ESSAI = /essai/i.test(location.pathname);
const Store = (()=>{
  const LS = localStorage;
  const LP = ESSAI ? "essai:" : "";   // préfixe réel des anciennes clés dans le navigateur
  const P = "fauconnerie-v2-";
  // anciennes clés gérées par les fiches (nom court → clé complète)
  const K = {
    customcats: P+"customcats", cattitles: P+"cattitles", deletedcats: P+"deletedcats",
    catreverse: P+"catreverse", custom: P+"custom", todo: P+"todo",
    overrides: P+"overrides", checkedat: P+"checkedat", order: P+"order",
    trash: P+"trash", waitlog: P+"waitlog", lastpurge: P+"lastpurge",
    purgefix: P+"purge-waiting-fix", lucky: P+"lucky", luckyopen: P+"luckyopen",
    notesopen: P+"notesopen", trashchart: P+"trashchart",
    lastbackup: P+"lastbackup", backupwatch: P+"backupwatch",
  };
  const ASPECTS = Object.keys(K); // aussi l'ordre de la migration
  const BY_KEY = {}; ASPECTS.forEach(a => BY_KEY[K[a]] = a);
  // valeurs simples (texte), pas du JSON — et où elles sont rangées
  const PLAIN = { lastpurge:"user", purgefix:"local", luckyopen:"local",
                  trashchart:"local", lastbackup:"local", backupwatch:"local" };
  const PLAIN_FIELD = { lastpurge:"lastPurge", purgefix:"purgeWaitingFix", luckyopen:"luckyOpen",
                        trashchart:"trashChart", lastbackup:"lastBackup", backupwatch:"backupWatch" };
  // ce qui part dans une sauvegarde (= les anciennes BACKUP_KEYS)
  const BACKUP_ASPECTS = ["todo","order","overrides","custom","customcats","deletedcats",
    "cattitles","checkedat","trash","lastpurge","catreverse","waitlog"];
  // champ d'une tâche qui porte chaque clé « par tâche »
  const SLOT_FIELD = { todo:"done", overrides:"edits", checkedat:"checkedAt" };

  const NS = (ESSAI ? "essai:" : "") + "sltapis:";
  const META = NS+"meta", REV = NS+"rev", USER = NS+"user:moi", LOCAL = NS+"local",
        RESIDUE = NS+"residue", LISTP = NS+"list:";

  const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
  const isObj = v => !!v && typeof v === "object" && !Array.isArray(v);
  const isRef = x => Array.isArray(x) && x.length === 2 && typeof x[0] === "string" && typeof x[1] === "string";
  // forme canonique (clés triées) : deux valeurs « pareilles » à l'ordre des clés près
  function canon(v){
    if(Array.isArray(v)) return "[" + v.map(canon).join(",") + "]";
    if(isObj(v)) return "{" + Object.keys(v).sort().filter(k => v[k] !== undefined)
      .map(k => JSON.stringify(k) + ":" + canon(v[k])).join(",") + "}";
    return v === undefined ? "null" : JSON.stringify(v);
  }
  // (crypto plutôt que Math.random : les tirages de l'appli — phrases, trèfle —
  // gardent exactement la même suite qu'avant)
  function rand36(n){
    const a = new Uint8Array(n);
    crypto.getRandomValues(a);
    return Array.from(a, b => (b % 36).toString(36)).join("");
  }
  function newId(){
    return "t" + Date.now().toString(36).slice(-5) + rand36(6);
  }

  let mode = "doc";
  let lists = new Map();        // id → fiche de liste
  let user = {}, local = {}, residue = {};
  let docStr = new Map();       // clé de stockage → dernier texte lu / écrit
  let knownRev = null;
  let ver = 0;                  // change à chaque modification du modèle en mémoire
  const memo = {};              // aspect → { ver, str }
  const lastGood = {};          // aspect → dernier texte calculé sans erreur
  let extBase = {};             // aspect → texte déjà signalé à l'appli (autres onglets)
  let noAnomaly = false;        // tests : ignorer le garde-fou (vérifier les vues seules)
  let localHook = null;         // 10.1 : prévenu après chaque écriture faite ici (synchro)
  function notifyLocal(){ if(localHook){ try{ localHook(); }catch(e){ console.error("[Store] synchro", e); } } }

  function freshResidue(){
    return { present:{}, anomalies:{}, orphans:{ todo:{}, overrides:{}, checkedat:{}, cattitles:{},
             catreverse:{}, deletedcats:[], order:{} } };
  }
  function fixResidue(){
    if(!isObj(residue)) residue = {};
    const f = freshResidue();
    if(!isObj(residue.present)) residue.present = {};
    if(!isObj(residue.anomalies)) residue.anomalies = {};
    if(!isObj(residue.orphans)) residue.orphans = f.orphans;
    Object.keys(f.orphans).forEach(k=>{
      const ok = k === "deletedcats" ? Array.isArray(residue.orphans[k]) : isObj(residue.orphans[k]);
      if(!ok) residue.orphans[k] = f.orphans[k];
    });
  }
  function newList(id){
    return { v:1, id, members:["moi"], rank:null, items:[] };
  }

  // ---------- lecture / écriture des fiches ----------
  function parseOr(raw, fb){ try{ const v = JSON.parse(raw); return v == null ? fb : v; }catch(e){ return fb; } }
  function loadDocs(){
    const nl = new Map(), ns = new Map();
    let u = {}, l = {}, r = {};
    for(let i = 0; i < LS.length; i++){
      const k = LS.key(i);
      if(!k || k.indexOf(NS) !== 0) continue;
      const raw = LS.getItem(k);
      if(k.indexOf(LISTP) === 0){
        const id = k.slice(LISTP.length);
        const prev = docStr.get(k) === raw ? lists.get(id) : null;
        const d = prev || parseOr(raw, null);
        if(isObj(d)){
          if(!Array.isArray(d.items)) d.items = [];
          d.id = id; nl.set(id, d); ns.set(k, raw);
        }
      }else if(k === USER){ u = docStr.get(k) === raw ? user : parseOr(raw, {}); ns.set(k, raw); }
      else if(k === LOCAL){ l = docStr.get(k) === raw ? local : parseOr(raw, {}); ns.set(k, raw); }
      else if(k === RESIDUE){ r = docStr.get(k) === raw ? residue : parseOr(raw, {}); ns.set(k, raw); }
    }
    lists = nl; user = isObj(u) ? u : {}; local = isObj(l) ? l : {}; residue = r;
    fixResidue();
    docStr = ns;
    knownRev = LS.getItem(REV);
    ver++;
  }
  function syncRev(){
    if(mode !== "doc") return;
    if(LS.getItem(REV) !== knownRev) loadDocs();
  }
  function allDocs(){
    const out = new Map();
    lists.forEach((d, id) => out.set(LISTP + id, JSON.stringify(d)));
    out.set(USER, JSON.stringify(user));
    out.set(LOCAL, JSON.stringify(local));
    out.set(RESIDUE, JSON.stringify(residue));
    return out;
  }
  // Écrit seulement les fiches qui ont changé. En cas d'échec (stockage
  // plein…), on remet ce qui avait déjà été écrit et on relit tout : comme
  // avant, l'écriture échoue en entier, sans état à moitié écrit.
  function commit(){
    const next = allDocs();
    const done = [];
    try{
      next.forEach((str, k)=>{
        if(docStr.get(k) === str) return;
        done.push([k, docStr.has(k) ? docStr.get(k) : null]);
        LS.setItem(k, str);
      });
      docStr.forEach((str, k)=>{
        if(next.has(k)) return;
        done.push([k, str]);
        LS.removeItem(k);
      });
    }catch(err){
      done.reverse().forEach(([k, old])=>{ try{ if(old === null) LS.removeItem(k); else LS.setItem(k, old); }catch(e){} });
      loadDocs();
      throw err;
    }
    next.forEach((str, k) => docStr.set(k, str));
    Array.from(docStr.keys()).forEach(k => { if(!next.has(k)) docStr.delete(k); });
    if(done.length){
      knownRev = Date.now().toString(36) + rand36(5);
      try{ LS.setItem(REV, knownRev); }catch(e){}
    }
  }

  // ---------- repérage des tâches ----------
  const slotsOf = L => L.ghosts ? L.items.concat(L.ghosts) : L.items;
  function sortedLists(){
    return Array.from(lists.values()).sort((a, b)=>{
      const ra = a.rank == null ? Infinity : a.rank, rb = b.rank == null ? Infinity : b.rank;
      if(ra !== rb) return ra - rb;
      return a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
    });
  }
  const rankedLists = () => sortedLists().filter(L => L.rank != null);
  // « idListe:index » → { L, s, idx } si la tâche existe (ou a existé à cette place)
  function resolveKey(k){
    if(typeof k !== "string") return null;
    const i = k.lastIndexOf(":");
    if(i < 0) return null;
    const n = k.slice(i + 1);
    if(!/^(0|[1-9]\d*)$/.test(n)) return null;
    const L = lists.get(k.slice(0, i));
    if(!L) return null;
    const s = slotsOf(L)[+n];
    return s ? { L, s, idx:+n } : null;
  }
  // une référence de tâche est rangée [idListe, idTâche] ; à défaut (tâche
  // inconnue à ce moment), l'ancienne clé telle quelle
  function toRef(k){ const r = resolveKey(k); return r ? [r.L.id, r.s.id] : k; }
  function fromRef(x){
    if(!isRef(x)) return x;
    const L = lists.get(x[0]);
    const idx = L ? slotsOf(L).findIndex(s => s.id === x[1]) : -1;
    return x[0] + ":" + (idx > -1 ? idx : x[1]);
  }
  function renameField(o, from, to, conv){
    if(!isObj(o) || !own(o, from)) return o;
    const out = {};
    Object.keys(o).forEach(k => { if(k === from) out[to] = conv(o[k]); else out[k] = o[k]; });
    return out;
  }
  function ensureList(id){
    let L = lists.get(id);
    if(!L){ L = newList(id); lists.set(id, L); }
    return L;
  }

  // ---------- vues : chaque ancienne clé recalculée depuis les fiches ----------
  const PROJECT = {
    customcats(){
      return rankedLists().map(L=>{
        const o = { id:L.id, title: L.renamed ? L.titleOriginal : L.title, color:L.color };
        if(isObj(L.catExtra)) Object.keys(L.catExtra).forEach(k => { if(!own(o, k)) o[k] = L.catExtra[k]; });
        return o;
      });
    },
    cattitles(){
      const o = {};
      sortedLists().forEach(L => { if(L.renamed) o[L.id] = L.title; });
      return Object.assign(o, residue.orphans.cattitles);
    },
    deletedcats(){
      const e = [];
      sortedLists().forEach(L => { if(L.deleted != null) e.push({ id:L.id, seq:L.deleted }); });
      residue.orphans.deletedcats.forEach(x => e.push(x));
      return e.sort((a, b) => a.seq - b.seq).map(x => x.id);
    },
    catreverse(){
      const o = {};
      sortedLists().forEach(L => { if(own(L, "reversed")) o[L.id] = L.reversed; });
      return Object.assign(o, residue.orphans.catreverse);
    },
    custom(){
      const o = {};
      sortedLists().forEach(L => { if(L.hasItems) o[L.id] = L.items.map(s => s.base); });
      return o;
    },
    order(){
      const o = {};
      sortedLists().forEach(L=>{
        if(!Array.isArray(L.order)) return;
        const slots = slotsOf(L);
        o[L.id] = L.order.map(x=>{
          if(typeof x !== "string") return x;
          const i = slots.findIndex(s => s.id === x);
          return i > -1 ? i : x;
        });
      });
      if(Array.isArray(user.listOrder)){
        const ranked = rankedLists();
        o.__categories__ = user.listOrder.map(x=>{
          if(typeof x !== "string") return x;
          const i = ranked.findIndex(L => L.id === x);
          return i > -1 ? i : x;
        });
      }
      if(Array.isArray(user.urgentOrder)) o.__urgent__ = user.urgentOrder.map(fromRef);
      if(Array.isArray(user.urgentDue)) o.__urgentDue__ = user.urgentDue.map(fromRef);
      if(Array.isArray(user.waitingOrder)) o.__waiting__ = user.waitingOrder.map(fromRef);
      return Object.assign(o, residue.orphans.order);
    },
    trash(){ return Array.isArray(user.trash) ? user.trash.map(e => renameField(e, "item", "key", fromRef)) : user.trash; },
    waitlog(){ return Array.isArray(user.waitLog) ? user.waitLog.map(e => renameField(e, "item", "key", fromRef)) : user.waitLog; },
    lucky(){
      const v = local.lucky;
      if(!isObj(v)) return v;
      const o = Object.assign({}, v);
      if(Array.isArray(o.keys)) o.keys = o.keys.map(fromRef);
      if(isRef(o.chosen)) o.chosen = fromRef(o.chosen);
      return o;
    },
    notesopen(){
      const o = {};
      (Array.isArray(local.notesOpen) ? local.notesOpen : []).forEach(([r, v]) => { o[fromRef(r)] = v; });
      return o;
    },
  };
  ["todo","overrides","checkedat"].forEach(a=>{
    const f = SLOT_FIELD[a];
    PROJECT[a] = ()=>{
      const o = {};
      sortedLists().forEach(L => slotsOf(L).forEach((s, i) => { if(own(s, f)) o[L.id + ":" + i] = s[f]; }));
      return Object.assign(o, residue.orphans[a]);
    };
  });

  function projectStr(a){
    if(memo[a] && memo[a].ver === ver) return memo[a].str;
    let str;
    if(!residue.present[a]) str = null;
    else if(PLAIN[a]){
      const doc = PLAIN[a] === "user" ? user : local;
      const v = doc[PLAIN_FIELD[a]];
      str = v === undefined ? null : String(v);
    }else{
      const v = PROJECT[a]();
      str = v === undefined ? null : JSON.stringify(v);
    }
    memo[a] = { ver, str };
    return str;
  }
  // empreinte d'une vue, insensible à l'ordre des clés
  const shadowMemo = {};
  function shadowOf(a, str){
    if(shadowMemo[a] && shadowMemo[a].ver === ver && shadowMemo[a].str === str) return shadowMemo[a].sh;
    let sh;
    try{ sh = str === null ? null : canon(JSON.parse(str)); }catch(e){ sh = str; }
    shadowMemo[a] = { ver, str, sh };
    return sh;
  }
  function viewStr(a){
    const str = projectStr(a);
    const an = residue.anomalies[a];
    if(an && !noAnomaly && an.shadow === shadowOf(a, str)) return an.raw;
    return str;
  }

  // ---------- écritures : une ancienne clé est répartie dans les fiches ----------
  // Chaque écriture REMPLACE entièrement ce que représente l'ancienne clé
  // (comme un setItem le faisait), sans toucher à ce que portent les autres.
  const WRITE = {
    customcats(v){
      // __categories__ repère les listes par position dans customcats : on
      // garde ces positions telles quelles, comme avant (fixup ci-dessous).
      const fix = Array.isArray(user.listOrder) ? PROJECT.order().__categories__ : null;
      lists.forEach(L => { L.rank = null; });
      if(Array.isArray(v)){
        const seen = new Set();
        v.forEach((c, p)=>{
          if(!isObj(c) || typeof c.id !== "string" || !c.id || seen.has(c.id)) return;
          seen.add(c.id);
          const L = ensureList(c.id);
          L.rank = p;
          if(L.renamed) L.titleOriginal = c.title; else L.title = c.title;
          L.color = c.color;
          const extra = {};
          Object.keys(c).forEach(k => { if(k !== "id" && k !== "title" && k !== "color") extra[k] = c[k]; });
          if(Object.keys(extra).length) L.catExtra = extra; else delete L.catExtra;
        });
      }
      if(fix){
        const ranked = rankedLists();
        user.listOrder = fix.map(i => (Number.isInteger(i) && i >= 0 && ranked[i]) ? ranked[i].id : i);
      }
    },
    cattitles(v){
      const o = isObj(v) ? v : {};
      lists.forEach(L=>{
        if(own(o, L.id)){
          if(!L.renamed){ L.renamed = true; L.titleOriginal = L.title; }
          L.title = o[L.id];
        }else if(L.renamed){
          L.title = L.titleOriginal; delete L.renamed; delete L.titleOriginal;
        }
      });
      residue.orphans.cattitles = {};
      Object.keys(o).forEach(k => { if(!lists.has(k)) residue.orphans.cattitles[k] = o[k]; });
    },
    deletedcats(v){
      lists.forEach(L => { delete L.deleted; });
      residue.orphans.deletedcats = [];
      (Array.isArray(v) ? v : []).forEach((id, seq)=>{
        const L = typeof id === "string" ? lists.get(id) : null;
        if(L && L.deleted == null) L.deleted = seq;
        else residue.orphans.deletedcats.push({ id, seq });
      });
    },
    catreverse(v){
      const o = isObj(v) ? v : {};
      lists.forEach(L => { if(own(o, L.id)) L.reversed = o[L.id]; else delete L.reversed; });
      residue.orphans.catreverse = {};
      Object.keys(o).forEach(k => { if(!lists.has(k)) residue.orphans.catreverse[k] = o[k]; });
    },
    custom(v){
      const o = isObj(v) ? v : {};
      Object.keys(o).forEach(id => ensureList(id));
      lists.forEach(L=>{
        if(own(o, L.id)){ L.hasItems = true; applyItems(L, Array.isArray(o[L.id]) ? o[L.id] : []); }
        else{ delete L.hasItems; if(L.items.length) applyItems(L, []); }
      });
    },
    order(v){
      const o = isObj(v) ? v : {};
      lists.forEach(L => { delete L.order; });
      delete user.listOrder; delete user.urgentOrder; delete user.urgentDue; delete user.waitingOrder;
      residue.orphans.order = {};
      const SPECIAL = { __urgent__:"urgentOrder", __urgentDue__:"urgentDue", __waiting__:"waitingOrder" };
      Object.keys(o).forEach(k=>{
        const val = o[k];
        if(k === "__categories__" && Array.isArray(val)){
          const ranked = rankedLists();
          user.listOrder = val.map(i => (Number.isInteger(i) && i >= 0 && ranked[i]) ? ranked[i].id : i);
        }else if(SPECIAL[k] && Array.isArray(val)){
          user[SPECIAL[k]] = val.map(x => typeof x === "string" ? toRef(x) : x);
        }else if(!SPECIAL[k] && k !== "__categories__" && lists.has(k) && Array.isArray(val)){
          const slots = slotsOf(lists.get(k));
          lists.get(k).order = val.map(i => (Number.isInteger(i) && i >= 0 && slots[i]) ? slots[i].id : i);
        }else residue.orphans.order[k] = val;
      });
    },
    trash(v){ user.trash = Array.isArray(v) ? v.map(e => renameField(e, "key", "item", x => typeof x === "string" ? toRef(x) : x)) : v; },
    waitlog(v){ user.waitLog = Array.isArray(v) ? v.map(e => renameField(e, "key", "item", x => typeof x === "string" ? toRef(x) : x)) : v; },
    lucky(v){
      if(!isObj(v)){ local.lucky = v; return; }
      const o = Object.assign({}, v);
      if(Array.isArray(o.keys)) o.keys = o.keys.map(x => typeof x === "string" ? toRef(x) : x);
      if(typeof o.chosen === "string") o.chosen = toRef(o.chosen);
      local.lucky = o;
    },
    notesopen(v){
      const o = isObj(v) ? v : {};
      local.notesOpen = Object.keys(o).map(k => [toRef(k), o[k]]);
    },
  };
  ["todo","overrides","checkedat"].forEach(a=>{
    const f = SLOT_FIELD[a];
    WRITE[a] = (v)=>{
      const o = isObj(v) ? v : {};
      lists.forEach(L => slotsOf(L).forEach(s => { delete s[f]; }));
      residue.orphans[a] = {};
      Object.keys(o).forEach(k=>{
        const r = resolveKey(k);
        if(r) r.s[f] = o[k]; else residue.orphans[a][k] = o[k];
      });
    };
  });
  // Les tâches d'une liste, dans l'ordre de leur position (= l'ancien index).
  // Une place qui disparaît (⌘Z d'un ajout, restauration plus courte) est
  // gardée de côté (« ghosts ») avec sa coche éventuelle : si une tâche
  // revient à cette place, elle la retrouve, exactement comme avant.
  function applyItems(L, arr){
    const slots = slotsOf(L);
    L.items = arr.map((b, i)=>{
      const s = slots[i] || { id: uniqueId(L) };
      s.base = b;
      return s;
    });
    const ghosts = slots.slice(arr.length);
    ghosts.forEach(s => { delete s.base; });
    if(ghosts.length) L.ghosts = ghosts; else delete L.ghosts;
  }
  function uniqueId(L){
    const used = new Set(slotsOf(L).map(s => s.id));
    let id; do{ id = newId(); }while(used.has(id));
    return id;
  }
  // ce qui ne trouvait pas sa place (liste ou tâche pas encore là) la retrouve
  function rehome(){
    const O = residue.orphans;
    ["todo","overrides","checkedat"].forEach(a=>{
      Object.keys(O[a]).forEach(k=>{
        const r = resolveKey(k);
        if(r && !own(r.s, SLOT_FIELD[a])){ r.s[SLOT_FIELD[a]] = O[a][k]; delete O[a][k]; }
      });
    });
    Object.keys(O.cattitles).forEach(id=>{
      const L = lists.get(id);
      if(!L || L.renamed) return;
      L.renamed = true; L.titleOriginal = L.title; L.title = O.cattitles[id];
      delete O.cattitles[id];
    });
    Object.keys(O.catreverse).forEach(id=>{
      const L = lists.get(id);
      if(!L || own(L, "reversed")) return;
      L.reversed = O.catreverse[id]; delete O.catreverse[id];
    });
    O.deletedcats = O.deletedcats.filter(x=>{
      const L = typeof x.id === "string" ? lists.get(x.id) : null;
      if(!L || L.deleted != null) return true;
      L.deleted = x.seq; return false;
    });
    Object.keys(O.order).forEach(k=>{
      if(k.indexOf("__") === 0) return;
      const L = lists.get(k), val = O.order[k];
      if(!L || Array.isArray(L.order) || !Array.isArray(val)) return;
      const slots = slotsOf(L);
      L.order = val.map(i => (Number.isInteger(i) && i >= 0 && slots[i]) ? slots[i].id : i);
      delete O.order[k];
    });
  }
  // une liste qui ne porte plus rien du tout disparaît
  function cleanup(){
    lists.forEach((L, id)=>{
      if(L.rank == null && !L.hasItems && !L.items.length && !L.ghosts && !Array.isArray(L.order)
         && L.deleted == null && !L.renamed && !own(L, "reversed")) lists.delete(id);
    });
  }

  function writeAspect(a, raw){
    if(PLAIN[a]){
      (PLAIN[a] === "user" ? user : local)[PLAIN_FIELD[a]] = String(raw);
      residue.present[a] = true;
      delete residue.anomalies[a];
      ver++;
      return;
    }
    let v, parsed = true;
    try{ v = JSON.parse(raw); }catch(e){ parsed = false; v = undefined; }
    WRITE[a](v);
    rehome();
    cleanup();
    residue.present[a] = true;
    ver++;
    // garde-fou : si la valeur écrite ne se recalcule pas à l'identique (à
    // l'ordre des clés près), on garde le texte exact tant que rien d'autre
    // n'y touche.
    const str = projectStr(a);
    let same = false;
    try{ same = parsed && canon(v) === canon(JSON.parse(str)); }catch(e){}
    if(same) delete residue.anomalies[a];
    else residue.anomalies[a] = { raw:String(raw), shadow:shadowOf(a, str) };
  }
  function removeAspect(a){
    if(PLAIN[a]) delete (PLAIN[a] === "user" ? user : local)[PLAIN_FIELD[a]];
    else{
      const EMPTY_ARR = { customcats:1, deletedcats:1 };
      if(a === "trash") delete user.trash;
      else if(a === "waitlog") delete user.waitLog;
      else if(a === "lucky") delete local.lucky;
      else if(a === "notesopen") delete local.notesOpen;
      else WRITE[a](EMPTY_ARR[a] ? [] : {});
      rehome(); cleanup();
    }
    delete residue.present[a];
    delete residue.anomalies[a];
    ver++;
  }
  function allViews(){ const o = {}; ASPECTS.forEach(a => { o[a] = viewStr(a); }); return o; }

  // ---------- migration depuis les anciennes clés ----------
  function migrate(){
    // départ propre : un éventuel essai interrompu est effacé (les anciennes
    // clés, elles, ne sont jamais touchées)
    const stale = [];
    for(let i = 0; i < LS.length; i++){ const k = LS.key(i); if(k && k.indexOf(NS) === 0) stale.push(k); }
    stale.forEach(k => LS.removeItem(k));
    lists = new Map(); user = {}; local = {}; residue = freshResidue(); docStr = new Map();
    ver++;
    ASPECTS.forEach(a=>{
      const raw = LS.getItem(LP + K[a]);
      if(raw !== null) writeAspect(a, raw);
    });
    // vérification : chaque ancienne clé doit se recalculer à l'identique
    const bad = ASPECTS.filter(a=>{
      const raw = LS.getItem(LP + K[a]), got = viewStr(a);
      if(raw === got) return false;
      if(raw === null || got === null) return true;
      if(PLAIN[a]) return true;
      try{ return canon(JSON.parse(raw)) !== canon(JSON.parse(got)); }catch(e){ return true; }
    });
    if(bad.length) throw new Error("vérification de la migration : " + bad.join(", "));
    commit();
    LS.setItem(META, JSON.stringify({ format:10, migratedAt:new Date().toISOString(), from:"fauconnerie-v2" }));
  }

  function init(){
    try{
      if(LS.getItem(META)) loadDocs();
      else migrate();
      extBase = allViews();
    }catch(err){
      console.error("[Sous le tapis 10.0] nouveau rangement indisponible, l'appli tourne sur les anciennes clés :", err);
      mode = "legacy";
    }
  }
  init();

  // 10.2 : empreinte de ce qui touche au partage (membres, noms, carnet,
  // prénom) — pour redessiner quand ça change ailleurs (autre onglet, en ligne)
  const SHARING_KEY = NS + "partage";
  function sharingPrint(){
    const o = { u:[user.contacts, user.myName] };
    lists.forEach((L, id) => { o[id] = [L.owner, L.members, L.names, L.type]; });   // 10.15 : + le type (courses)
    return canon(o);
  }
  let sharingSeen = mode === "doc" ? sharingPrint() : "";
  const meCache = {};
  const LIST_FIELDS = ["type", "history"];   // 10.15

  const api = {
    get mode(){ return mode; },
    get(k){
      if(mode !== "doc" || !own(BY_KEY, k)) return LS.getItem(LP + k);
      const a = BY_KEY[k];
      try{
        syncRev();
        const s = viewStr(a);
        lastGood[a] = s;
        return s;
      }catch(err){
        console.error("[Store] lecture", k, err);
        if(own(lastGood, a)) return lastGood[a];
        throw err;
      }
    },
    set(k, v){
      if(mode !== "doc" || !own(BY_KEY, k)){ LS.setItem(LP + k, v); return; }
      const a = BY_KEY[k];
      syncRev();
      const before = allViews();
      try{ writeAspect(a, String(v)); commit(); }
      catch(err){ loadDocs(); throw err; }
      const after = allViews();
      ASPECTS.forEach(x => { if(before[x] !== after[x]) extBase[x] = after[x]; });
      notifyLocal();
    },
    remove(k){
      if(mode !== "doc" || !own(BY_KEY, k)){ LS.removeItem(LP + k); return; }
      const a = BY_KEY[k];
      syncRev();
      const before = allViews();
      try{ removeAspect(a); commit(); }
      catch(err){ loadDocs(); throw err; }
      const after = allViews();
      ASPECTS.forEach(x => { if(before[x] !== after[x]) extBase[x] = after[x]; });
      notifyLocal();
    },
    // Un autre onglet a écrit (événement « storage ») : on relit les fiches et
    // on renvoie les anciennes clés dont la vue a changé depuis la dernière fois.
    receive(storageKey){
      if(mode !== "doc") return storageKey == null ? [] : [storageKey];
      if(storageKey != null && storageKey.indexOf(NS) !== 0) return [];
      loadDocs();
      const now = allViews();
      const changed = ASPECTS.filter(a => now[a] !== extBase[a]).map(a => K[a]);
      extBase = now;
      // 10.2 : membres, noms et carnet ne sont dans aucune ancienne clé
      const sh = sharingPrint();
      if(sh !== sharingSeen){ sharingSeen = sh; changed.push(SHARING_KEY); }
      return changed;
    },
    // ---- 10.2 : partage des listes (lu / écrit directement dans les fiches) ----
    // Une liste : owner (créateur, compte en ligne), members (comptes qui la
    // voient), names ({ compte: prénom } posé par son créateur).
    listInfo(id){
      if(mode !== "doc") return null;
      syncRev();
      const L = lists.get(id);
      if(!L) return null;
      return {
        owner: typeof L.owner === "string" ? L.owner : null,
        members: Array.isArray(L.members) ? L.members.filter(m => typeof m === "string") : [],
        names: isObj(L.names) ? Object.assign({}, L.names) : {},
      };
    },
    setListSharing(id, members, names){
      if(mode !== "doc") return false;
      syncRev();
      const L = lists.get(id);
      if(!L) return false;
      L.members = members.slice();
      if(names && Object.keys(names).length) L.names = Object.assign({}, names); else delete L.names;
      ver++;
      commit();
      sharingSeen = sharingPrint();
      notifyLocal();
      return true;
    },
    // ---- 10.15 : listes de courses (lu / écrit directement dans la fiche) ----
    // type : "courses" (absent = liste normale, comme toutes les listes d'avant) ;
    // history : les articles déjà saisis dans cette liste (suggestions), partagés
    // avec la liste. Aucune ancienne clé ne les porte.
    listField(id, name){
      if(mode !== "doc" || !LIST_FIELDS.includes(name)) return undefined;
      syncRev();
      const L = lists.get(id);
      return (L && L[name] !== undefined) ? JSON.parse(JSON.stringify(L[name])) : undefined;
    },
    setListField(id, name, v){
      if(mode !== "doc" || !LIST_FIELDS.includes(name)) return false;
      syncRev();
      const L = lists.get(id);
      if(!L) return false;
      if(v === undefined) delete L[name]; else L[name] = JSON.parse(JSON.stringify(v));
      ver++;
      commit();
      sharingSeen = sharingPrint();
      notifyLocal();
      return true;
    },
    // champs de la fiche « moi » que les anciennes clés ignorent (carnet, prénom)
    userField(name){
      if(mode !== "doc") return undefined;
      syncRev();
      return user[name] === undefined ? undefined : JSON.parse(JSON.stringify(user[name]));
    },
    setUserField(name, v){
      if(mode !== "doc") return;
      syncRev();
      if(v === undefined) delete user[name]; else user[name] = JSON.parse(JSON.stringify(v));
      ver++;
      commit();
      sharingSeen = sharingPrint();
      notifyLocal();
    },
    // compte en ligne de cet appareil (gardé après déconnexion), sans attendre Firebase
    myUid(){
      const raw = LS.getItem(NS + "me");
      if(raw) return raw;
      if(meCache.raw === undefined){
        const s = parseOr(LS.getItem(NS + "sync"), null);
        meCache.raw = (s && typeof s.uid === "string") ? s.uid : null;
      }
      return meCache.raw;
    },
    get sharingKey(){ return SHARING_KEY; },
    // Sauvegarde au nouveau format : les fiches telles quelles.
    exportModel(){
      syncRev();
      const pick = (o, keys) => { const r = {}; keys.forEach(k => { if(own(o, k)) r[k] = o[k]; }); return r; };
      const userCopy = JSON.parse(JSON.stringify(user));
      const O = residue.orphans;
      return {
        lists: sortedLists().map(L => JSON.parse(JSON.stringify(L))),
        user: userCopy,
        residue: JSON.parse(JSON.stringify({
          present: pick(residue.present, BACKUP_ASPECTS),
          anomalies: pick(residue.anomalies, BACKUP_ASPECTS),
          orphans: { todo:O.todo, overrides:O.overrides, checkedat:O.checkedat, cattitles:O.cattitles,
                     catreverse:O.catreverse, deletedcats:O.deletedcats, order:O.order },
        })),
      };
    },
    // Restauration d'une sauvegarde au nouveau format : remplace les fiches
    // (listes + « moi ») ; les réglages de cet appareil restent.
    isModelDump(d){ return isObj(d) && d.format === 10 && Array.isArray(d.lists) && isObj(d.user); },
    importModel(d){
      if(mode !== "doc" || !api.isModelDump(d)) return false;
      syncRev();
      // trèfle et détails dépliés repèrent les tâches par position : on les
      // retraduit après coup, comme une ancienne restauration le faisait
      const keepLucky = residue.present.lucky ? projectStr("lucky") : null;
      const keepNotes = residue.present.notesopen ? projectStr("notesopen") : null;
      const nl = new Map();
      d.lists.forEach(L=>{
        if(!isObj(L) || typeof L.id !== "string" || !L.id) return;
        const c = JSON.parse(JSON.stringify(L));
        if(!Array.isArray(c.items)) c.items = [];
        nl.set(c.id, c);
      });
      lists = nl;
      user = JSON.parse(JSON.stringify(d.user));
      const r = isObj(d.residue) ? d.residue : {};
      const present = isObj(r.present) ? r.present : null;
      BACKUP_ASPECTS.forEach(a=>{
        if(present) { if(present[a]) residue.present[a] = true; else delete residue.present[a]; }
        else residue.present[a] = true;
        delete residue.anomalies[a];
        if(isObj(r.anomalies) && isObj(r.anomalies[a])) residue.anomalies[a] = r.anomalies[a];
      });
      const fresh = freshResidue().orphans;
      const ro = isObj(r.orphans) ? r.orphans : {};
      Object.keys(fresh).forEach(k=>{
        const ok = k === "deletedcats" ? Array.isArray(ro[k]) : isObj(ro[k]);
        residue.orphans[k] = ok ? JSON.parse(JSON.stringify(ro[k])) : fresh[k];
      });
      if(!residue.present.lastpurge) delete user.lastPurge;
      ver++;
      if(keepLucky !== null) writeAspect("lucky", keepLucky);
      if(keepNotes !== null) writeAspect("notesopen", keepNotes);
      rehome(); cleanup(); ver++;
      commit();
      extBase = allViews();
      notifyLocal();
      return true;
    },
    isDocKey(k){ return typeof k === "string" && k.indexOf(NS) === 0; },
    // ---- 10.1 : accès aux fiches pour la synchro en ligne (Sync, plus bas) ----
    // Les fiches telles quelles (copies) : listes et « moi ».
    readDocs(){
      syncRev();
      const out = { lists:{}, user: JSON.parse(JSON.stringify(user)) };
      lists.forEach((L, id) => { out.lists[id] = JSON.parse(JSON.stringify(L)); });
      return out;
    },
    // Pose des fiches venues d'ailleurs (null = fiche supprimée) ; replaceAll :
    // les fiches absentes disparaissent (premier branchement d'un appareil).
    // L'appli est prévenue comme pour un autre onglet (Store.receive).
    writeDocs(d, replaceAll){
      if(mode !== "doc") return;
      syncRev();
      if(replaceAll){
        lists = new Map(); user = {};
        const O = freshResidue().orphans;
        residue.orphans = O; residue.anomalies = {};
      }
      Object.keys(d.lists || {}).forEach(id=>{
        const L = d.lists[id];
        if(L == null){ lists.delete(id); return; }
        const c = JSON.parse(JSON.stringify(L));
        c.id = id;
        if(!Array.isArray(c.items)) c.items = [];
        lists.set(id, c);
      });
      if(isObj(d.user)) user = JSON.parse(JSON.stringify(d.user));
      // ce qui arrive doit se lire : les clés concernées sont « présentes »
      if(lists.size) ["customcats","cattitles","deletedcats","catreverse","custom","todo","overrides","checkedat","order"]
        .forEach(a => { residue.present[a] = true; });
      if(own(user, "trash")) residue.present.trash = true;
      if(own(user, "waitLog")) residue.present.waitlog = true;
      if(own(user, "lastPurge")) residue.present.lastpurge = true;
      if(Array.isArray(user.listOrder) || Array.isArray(user.urgentOrder) || Array.isArray(user.waitingOrder)) residue.present.order = true;
      ver++;
      commit();
    },
    get ns(){ return NS; },
    set onLocalChange(fn){ localHook = fn; },
    // pour les tests
    _views: allViews,
    _projectStr: projectStr,
    get _noAnomaly(){ return noAnomaly; },
    set _noAnomaly(v){ noAnomaly = !!v; ver++; },
  };
  return api;
})();

const DATA = [];  // édition autonome : aucune base en dur, tout vient des sauvegardes;

// Catégories ajoutées via le petit "+" en bas de la liste des cases : elles
// sont persistées à part, puis fusionnées dans DATA dès le chargement pour
// que tout le reste du code (qui ne connaît que DATA) les traite exactement
// comme les catégories d'origine, sans rien avoir à changer ailleurs.
const CUSTOM_CATS_KEY = "fauconnerie-v2-customcats";
function loadCustomCategories(){
  try{
    const raw = Store.get(CUSTOM_CATS_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveCustomCategories(list){
  try{ Store.set(CUSTOM_CATS_KEY, JSON.stringify(list)); }catch(e){}
}
let customCategories = loadCustomCategories();
function mergeCustomCategories(){
  customCategories.forEach(c=>{
    if(!c || !c.id) return;
    const d = DATA.find(x => x.id === c.id);
    if(d) d.color = c.color; // 8.36 : la couleur peut changer (pastilles, ⌘Z, autre onglet)
    else DATA.push({ id:c.id, title:c.title, color:c.color, items: [] });
  });
}
mergeCustomCategories();

// Renommer une case : comme pour le titre d'une tâche, un simple "override"
// persisté à part et réappliqué au chargement — la catégorie, qu'elle soit
// d'origine ou ajoutée par l'utilisateur, n'a pas besoin d'un traitement
// différent.
const CAT_TITLE_OVERRIDES_KEY = "fauconnerie-v2-cattitles";
function loadCatTitleOverrides(){
  try{
    const raw = Store.get(CAT_TITLE_OVERRIDES_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveCatTitleOverrides(o){
  try{ Store.set(CAT_TITLE_OVERRIDES_KEY, JSON.stringify(o)); }catch(e){}
}
let catTitleOverrides = loadCatTitleOverrides();
function applyCatTitleOverrides(){
  Object.keys(catTitleOverrides).forEach(id=>{
    const c = DATA.find(d => d.id === id);
    if(c) c.title = catTitleOverrides[id];
  });
}
applyCatTitleOverrides();

const NEW_CATEGORY_PALETTE = ["#4993A2","#D9A63A","#5E9C86","#C24F6E","#D9774A","#6A9FB9","#B06A92","#8A7DB8","#8C9A4C","#6B728E"];
// Ancienne gamme (v6.1 et avant) : les listes existantes gardent leur couleur
// enregistrée, mais on l'affiche dans la nouvelle gamme, case pour case.
// Rien n'est réécrit dans les données.
const OLD_CATEGORY_PALETTE = ["#4B7BA6","#7A5C3E","#5C8A6B","#9C5A8C","#A87F3F","#3F7A7A","#8A5A5A","#5A6B8A","#6B7A3F","#7A3F5C"];
function displayCatColor(col){
  const c = String(col || "").toUpperCase();
  if(NEW_CATEGORY_PALETTE.includes(c)) return c;
  const i = OLD_CATEGORY_PALETTE.indexOf(c);
  if(i > -1) return NEW_CATEGORY_PALETTE[i];
  let h = 0; for(const ch of c) h = (h*31 + ch.charCodeAt(0)) >>> 0;
  return NEW_CATEGORY_PALETTE[h % NEW_CATEGORY_PALETTE.length];
}
function nextCategoryColor(){
  const used = new Set(DATA.map(c=>displayCatColor(c.color)));
  const free = NEW_CATEGORY_PALETTE.find(c=>!used.has(c));
  return free || NEW_CATEGORY_PALETTE[DATA.length % NEW_CATEGORY_PALETTE.length];
}
function slugifyCategoryTitle(title){
  const base = title.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  return base || "categorie";
}
function addCategory(title){
  const t = title.trim();
  if(!t) return null;
  // Copie fraîche avant tout (même logique que pour les tâches) : on
  // fusionne d'abord ce qu'un autre onglet aurait déjà ajouté, pour ne
  // jamais créer deux catégories avec le même identifiant.
  customCategories = loadCustomCategories();
  mergeCustomCategories();
  let id = slugifyCategoryTitle(t);
  const existingIds = new Set(DATA.map(c=>c.id));
  if(existingIds.has(id)){
    let n = 2;
    while(existingIds.has(id + "-" + n)) n++;
    id = id + "-" + n;
  }
  const newCat = { id, title:t, color: nextCategoryColor(), items: [] };
  DATA.push(newCat);
  customCategories.push({ id:newCat.id, title:newCat.title, color:newCat.color });
  saveCustomCategories(customCategories);
  return newCat;
}

// Suppression d'une case (catégorie) : comme pour les tâches, on ne touche
// jamais à sa position dans DATA (ça déstabiliserait tout ce qui s'appuie
// sur des index — ordre des catégories, etc.) — on se contente de la
// masquer partout où les catégories sont proposées à l'utilisateur. Un
// garde-fou empêche de toute façon de supprimer une case qui contient
// encore quelque chose (voir isCategoryEmpty et le bouton dans l'UI).
const DELETED_CATS_KEY = "fauconnerie-v2-deletedcats";
function loadDeletedCategoryIds(){
  try{
    const raw = Store.get(DELETED_CATS_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveDeletedCategoryIds(list){
  try{ Store.set(DELETED_CATS_KEY, JSON.stringify(list)); }catch(e){}
}
let deletedCategoryIds = loadDeletedCategoryIds();
function isCategoryDeleted(catId){
  return deletedCategoryIds.includes(catId);
}
function isCategoryEmpty(cat){
  const items = getEffectiveItems(cat);
  return items.every((base,i)=> isDeleted(itemKey(cat.id, i)));
}
function deleteCategory(catId){
  // On relit tout juste avant, et on revérifie que la case est bien toujours
  // vide au moment précis de la suppression (pas seulement quand le bouton
  // a été dessiné) — la meilleure protection contre une suppression par
  // mégarde reste de toute façon qu'une case avec ne fût-ce qu'une tâche
  // dedans n'a jamais ce bouton.
  overrides = loadOverrides();
  customItems = loadCustom();
  const cat = DATA.find(c => c.id === catId);
  if(!cat || !isCategoryEmpty(cat)) return false;
  // 10.2 : une liste partagée que je supprime n'est plus partagée (elle
  // disparaît aussi de chez les autres)
  if(iOwnList(catId) && isSharedList(catId) && myUid()) Store.setListSharing(catId, [myUid()], null);
  deletedCategoryIds = loadDeletedCategoryIds();
  if(!deletedCategoryIds.includes(catId)) deletedCategoryIds.push(catId);
  saveDeletedCategoryIds(deletedCategoryIds);
  return true;
}

// 8.36 : nouvelle couleur choisie dans les pastilles du renommage, écrite
// dans la liste elle-même (toutes les listes sont des listes ajoutées).
function recolorCategory(catId, color){
  customCategories = loadCustomCategories();
  const c = customCategories.find(x => x && x.id === catId);
  if(!c) return false;
  c.color = color;
  saveCustomCategories(customCategories);
  const d = DATA.find(x => x.id === catId);
  if(d) d.color = color;
  return true;
}
function renameCategory(catId, newTitle){
  const t = newTitle.trim();
  if(!t) return false;
  catTitleOverrides = loadCatTitleOverrides();
  catTitleOverrides[catId] = t;
  saveCatTitleOverrides(catTitleOverrides);
  const c = DATA.find(d => d.id === catId);
  if(c) c.title = t;
  return true;
}

// ---- Corbeille hebdomadaire ----
// Chaque lundi (à la première ouverture de la semaine), les tâches cochées
// AVANT ce lundi quittent la liste et partent dans la corbeille. Rien n'est
// jamais effacé : une tâche purgée est simplement masquée dans la liste
// (même mécanisme que la suppression) et recopiée en entier dans la
// corbeille, d'où elle peut être remise dans sa case d'un clic.
// La date de chaque coche est notée à part (CHECKED_AT_KEY). Les tâches
// cochées avant cette version n'ont pas de date : elles sont gardées telles
// quelles et rangées dans la corbeille sous « non datées ».
const CHECKED_AT_KEY = "fauconnerie-v2-checkedat";
const TRASH_KEY = "fauconnerie-v2-trash";
const LAST_PURGE_KEY = "fauconnerie-v2-lastpurge";
// 8.1 : chaque envoi dans « En cours » est noté (date) et compte comme une
// tâche accomplie dans le compteur de la semaine et le graphique — un aller-
// retour liste → en cours → liste → en cours compte donc deux fois. Le
// report d'une relance (tâche déjà en cours) ne compte pas.
const WAIT_LOG_KEY = "fauconnerie-v2-waitlog";
function waitLog(){ const l = loadJSONKey(WAIT_LOG_KEY, []); return Array.isArray(l) ? l : []; }
function loadJSONKey(k, fallback){
  try{
    const raw = Store.get(k);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
function saveJSONKey(k, v){
  try{ Store.set(k, JSON.stringify(v)); }catch(e){}
}
let checkedAt = loadJSONKey(CHECKED_AT_KEY, {});
let trash = loadJSONKey(TRASH_KEY, []);
if(!Array.isArray(trash)) trash = [];
function markChecked(key, isChecked){
  checkedAt = loadJSONKey(CHECKED_AT_KEY, {});
  if(isChecked) checkedAt[key] = todayISO();
  else delete checkedAt[key];
  saveJSONKey(CHECKED_AT_KEY, checkedAt);
}
function mondayOf(iso){
  const d = new Date(iso + "T00:00:00");
  return addDaysISO(iso, -((d.getDay() + 6) % 7));
}
// Renvoie le nombre de tâches envoyées à la corbeille (0 la plupart du temps).
// Tâches cochées (n'importe quelle case, « en cours » compris) avant ce lundi
// → corbeille. `onlyWaiting` sert au rattrapage unique ci-dessous.
function purgeCheckedBefore(thisMonday, onlyWaiting){
  state = loadState();
  overrides = loadOverrides();
  customItems = loadCustom();
  checkedAt = loadJSONKey(CHECKED_AT_KEY, {});
  trash = loadJSONKey(TRASH_KEY, []);
  if(!Array.isArray(trash)) trash = [];
  const today = todayISO();
  const purgedKeys = [];
  DATA.forEach(cat=>{
    if(isCoursesList(cat.id)) return;   // 10.15 : les articles rayés restent dans leur liste de courses
    getEffectiveItems(cat).forEach((base, i)=>{
      const key = itemKey(cat.id, i);
      if(isDeleted(key) || !state[key]) return;
      if(!checkedByMe(cat.id, key)) return; // 10.2 : cochée par quelqu'un d'autre : sa purge à lui
      const eff = getEffective(key, base);
      if(onlyWaiting && !eff.waiting) return;
      const doneOn = checkedAt[key] || "";
      if(doneOn && doneOn >= thisMonday) return; // cochée cette semaine : elle reste
      trash.push({
        t: eff.t, note: eff.note || "", who: eff.who || "", due: eff.due || "",
        catId: cat.id, catTitle: cat.title, doneOn, purgedOn: today, kind: "done",
        key, // 10.0 : la tâche d'origine (rangée par son identifiant stable)
      });
      purgedKeys.push(key);
    });
  });
  if(!purgedKeys.length) return 0;
  // La corbeille est écrite AVANT de masquer les tâches : en cas de pépin
  // au milieu, on risque au pire un doublon, jamais une perte.
  saveJSONKey(TRASH_KEY, trash);
  purgedKeys.forEach(key=>{
    overrides[key] = overrides[key] || {};
    overrides[key].deleted = true;
    delete checkedAt[key];
  });
  saveOverrides(overrides);
  saveJSONKey(CHECKED_AT_KEY, checkedAt);
  return purgedKeys.length;
}
// Rattrapage, une seule fois : jusqu'à la v5.3, la purge du lundi oubliait
// les tâches cochées de la case « en cours ». On les envoie à la corbeille
// selon la même règle (cochées avant ce lundi).
const WAITING_PURGE_FIX_KEY = "fauconnerie-v2-purge-waiting-fix";
function runWaitingPurgeFix(){
  let done = null;
  try{ done = Store.get(WAITING_PURGE_FIX_KEY); }catch(e){ return 0; }
  if(done) return 0;
  let last = null;
  try{ last = Store.get(LAST_PURGE_KEY); }catch(e){}
  // Pas encore de purge du tout : rien à rattraper, la purge normale s'en chargera.
  const n = last ? purgeCheckedBefore(mondayOf(todayISO()), true) : 0;
  try{ Store.set(WAITING_PURGE_FIX_KEY, todayISO()); }catch(e){}
  return n;
}
function runWeeklyPurge(){
  const thisMonday = mondayOf(todayISO());
  let last = null;
  try{ last = Store.get(LAST_PURGE_KEY); }catch(e){ return 0; }
  if(!last){
    // Toute première ouverture de cette version : on ne purge rien, on
    // note juste la semaine en cours. La première purge aura lieu lundi.
    try{ Store.set(LAST_PURGE_KEY, thisMonday); }catch(e){}
    return 0;
  }
  if(last >= thisMonday) return runWaitingPurgeFix();
  const n = purgeCheckedBefore(thisMonday, false);
  try{ Store.set(LAST_PURGE_KEY, thisMonday); }catch(e){}
  try{ Store.set(WAITING_PURGE_FIX_KEY, todayISO()); }catch(e){}
  return n;
}

// ---- 7.1 : ordre d'affichage inversé par liste ----
// Simple préférence d'affichage : ▲ (par défaut) = la plus récente en haut,
// ▼ = la plus récente en bas. L'ordre enregistré n'est jamais retourné : on
// l'affiche à l'envers et on retraduit au moment d'un glisser-déposer.
// Les œufs restent en queue dans les deux sens.
const CAT_REVERSE_KEY = "fauconnerie-v2-catreverse";
// 10.15 : une liste de courses s'affiche toujours dans l'ordre enregistré
// (nouveaux articles en bas) ; le réglage du sens est gardé pour le retour
// en liste normale
function isCatReversed(catId){ return !!loadJSONKey(CAT_REVERSE_KEY, {})[catId] && !isCoursesList(catId); }
function toggleCatReversed(catId){
  const o = loadJSONKey(CAT_REVERSE_KEY, {});
  if(o[catId]) delete o[catId]; else o[catId] = true;
  saveJSONKey(CAT_REVERSE_KEY, o);
}
function isEggIdx(cat, i){
  const items = getEffectiveItems(cat);
  const k = itemKey(cat.id, i);
  return !!items[i] && getEffective(k, items[i]).egg && !state[k];
}
// ordre enregistré → ordre affiché (lignes)
function catDisplayRows(cat, rows){
  if(!isCatReversed(cat.id)) return rows;
  const egg = r => isEggIdx(cat, r.idx);
  return rows.filter(r => !egg(r)).reverse().concat(rows.filter(egg));
}
// ordre affiché (index) → ordre enregistré, reporté dans l'ordre complet
// (tâches masquées, en cours ou effacées gardent leur place)
function applyCatDisplayOrder(cat, displayIdxs){
  let stored = displayIdxs;
  if(isCatReversed(cat.id)){
    const egg = i => isEggIdx(cat, i);
    stored = displayIdxs.filter(i => !egg(i)).reverse().concat(displayIdxs.filter(egg));
  }
  const set = new Set(stored);
  const full = getCatOrder(cat).slice();
  let j = 0;
  order[cat.id] = full.map(i => set.has(i) ? stored[j++] : i);
}
// Ajoute une tâche à une liste : en tête de l'ordre enregistré, ou en queue
// si elle est en couvaison. Copie fraîche avant tout, et index recalculé à
// partir d'elle : un ajout fait entre-temps dans un autre onglet ne peut pas
// atterrir sur le même index. Renvoie l'index de la nouvelle tâche.
function insertItem(cat, item){
  customItems = loadCustom();
  order = loadOrder();
  const newIdx = getEffectiveItems(cat).length;
  // 10.2 : qui a créé la tâche (avec un compte seulement)
  if(!item.by && myUid()) item = Object.assign({}, item, { by: myUid() });
  customItems[cat.id] = customItems[cat.id] || [];
  customItems[cat.id].push(item);
  saveCustom(customItems);
  const ord = getCatOrder(cat);
  const pos = ord.indexOf(newIdx);
  if(pos > -1) ord.splice(pos, 1);
  if(item.egg || isCoursesList(cat.id)) ord.push(newIdx); else ord.unshift(newIdx);   // 10.15 : un article arrive en bas
  saveOrder(order);
  return newIdx;
}
// Ajout express (champ à côté du titre d'une liste) : titre seul, en tête.
function addQuickTask(cat, title){
  const t = String(title || "").trim();
  if(!t) return false;
  insertItem(cat, { t });
  return true;
}
// 10.22 : collage de plusieurs lignes dans une liste normale : une tâche par
// ligne, dans l'ordre du texte collé (lu de haut en bas dans la carte).
function splitPastedTasks(txt){
  return String(txt || "").split(/\r?\n/)
    .map(l => l.replace(/^\s*(?:[-*•–]\s+|\[[ xX]?\]\s*|\d+[.)]\s+)/, "").trim())
    .filter(Boolean)
    .slice(0, 100);
}
function addPastedTasks(cat, lines){
  if(!lines.length) return 0;
  // insertItem met chaque tâche en tête : on insère à rebours pour garder
  // l'ordre collé (liste « récentes en bas » : affichage inversé, donc à l'endroit)
  const seq = isCatReversed(cat.id) ? lines : lines.slice().reverse();
  let n = 0;
  seq.forEach(t => { try{ insertItem(cat, { t }); n++; }catch(err){ console.error("[collage] échec", err); } });
  return n;
}
// Glisser une tâche dans une autre liste : même principe que le changement
// de catégorie du formulaire — la tâche est recopiée en entier (avec sa
// coche) dans la nouvelle liste AVANT d'être masquée dans l'ancienne.
function moveItemToCategory(cat, idx, destCat){
  const key = itemKey(cat.id, idx);
  const base = getEffectiveItems(cat)[idx];
  if(!base || !destCat) return null;
  overrides = loadOverrides();
  customItems = loadCustom();
  state = loadState();
  const eff = getEffective(key, base);
  const moved = { t: eff.t };
  if(eff.note) moved.note = eff.note;
  if(eff.due) moved.due = eff.due;
  if(eff.who) moved.who = eff.who;
  if(eff.urgent) moved.urgent = true;
  if(eff.egg) moved.egg = true;
  if(eff.person) moved.person = eff.person;
  if(eff.tier) moved.tier = eff.tier;
  if(!canRemoveTask(cat, base)) return null;   // 10.2 : pas la mienne, dans la liste de quelqu'un d'autre
  const by = taskCreator(cat, base);
  if(by && myUid()) moved.by = by;
  const newIdx = getEffectiveItems(destCat).length;
  customItems[destCat.id] = customItems[destCat.id] || [];
  customItems[destCat.id].push(moved);
  saveCustom(customItems);
  if(state[key]){
    const newKey = itemKey(destCat.id, newIdx);
    state[newKey] = true;
    saveState(state);
    checkedAt = loadJSONKey(CHECKED_AT_KEY, {});
    checkedAt[newKey] = checkedAt[key] || todayISO();
    delete checkedAt[key];
    saveJSONKey(CHECKED_AT_KEY, checkedAt);
  }
  overrides = loadOverrides();
  if(state[key] && overrides[key] && overrides[key].doneBy){   // 10.2 : qui a coché suit la tâche
    const nk = itemKey(destCat.id, newIdx);
    overrides[nk] = Object.assign({}, overrides[nk] || {}, { doneBy: overrides[key].doneBy });
  }
  overrides[key] = overrides[key] || {};
  overrides[key].deleted = true;
  saveOverrides(overrides);
  return newIdx;
}
// ---- 7.3 : envoi « en cours » avec relance ----
function effByKey(key){
  const sep = key.lastIndexOf(":");
  const cat = DATA.find(c => c.id === key.slice(0, sep));
  if(!cat) return null;
  const base = getEffectiveItems(cat)[parseInt(key.slice(sep + 1), 10)];
  return base ? getEffective(key, base) : null;
}
// relanceDue : "AAAA-MM-JJ" ou "" (pas de relance). L'échéance d'origine est
// mise de côté pour revenir quand la tâche rentre dans sa liste.
function sendToWaiting(key, relanceDue){
  overrides = loadOverrides();
  const o = overrides[key] = overrides[key] || {};
  const eff = effByKey(key);
  const wasWaiting = !!(eff && eff.waiting);
  if(eff) o.due = eff.due || "";   // échéance gardée telle quelle (masquée en cours)
  delete o.dueBeforeWaiting;
  o.waiting = true;
  o.relance = relanceDue || "";
  saveOverrides(overrides);
  if(!wasWaiting) saveJSONKey(WAIT_LOG_KEY, waitLog().concat([{ key, on: todayISO() }]));
  actionToast(wasWaiting ? "relancePush" : "waitingOn");
  currentProgressMsg = null;
  renderAll();
}
// Retour dans la liste : si la tâche avait une échéance, on demande quoi en
// faire (garder / effacer / nouvelle date) ; sinon retour direct.
function askBringBack(anchor, key){
  const eff = effByKey(key);
  if(!eff || !eff.due){ bringBackFromWaiting(key); return; }
  closeRelancePop();
  const today = todayISO();
  const d = splitDue(eff.due).date;
  const pop = document.createElement("div");
  pop.className = "relance-pop";
  pop.setAttribute("role", "dialog");
  pop.innerHTML = `
    <div class="rp-title">L'échéance du ${shortDateFR(d)}${d < today ? " (dépassée)" : ""} ?</div>
    <div class="rp-opts"><button type="button" data-a="keep">La garder</button><button type="button" data-a="erase" class="rp-none">L'effacer</button></div>
    <div class="rp-date"><input type="date" min="${today}" aria-label="Nouvelle échéance"><button type="button" class="rp-ok">OK</button></div>
  `;
  const done = v => { closeRelancePop(); bringBackFromWaiting(key, v); };
  pop.querySelector('[data-a="keep"]').addEventListener("click", e => { e.stopPropagation(); done(undefined); });
  pop.querySelector('[data-a="erase"]').addEventListener("click", e => { e.stopPropagation(); done(""); });
  const inp = pop.querySelector(".rp-date input");
  pop.querySelector(".rp-ok").addEventListener("click", e => { e.stopPropagation(); if(inp.value) done(inp.value); });
  inp.addEventListener("keydown", e => { if(e.key === "Enter" && inp.value){ e.preventDefault(); done(inp.value); } });
  openPopAt(pop, anchor);
}
// Pose une petite fenêtre (relance, retour) sous son bouton, ou au-dessus
// s'il n'y a pas la place, sans jamais déborder de l'écran.
function openPopAt(pop, anchor){
  pop.addEventListener("click", e => e.stopPropagation());
  document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect();
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  const left = Math.max(16, Math.min(r.right - pw, document.documentElement.clientWidth - pw - 16));
  let top = r.bottom + 6;
  if(top + ph > window.innerHeight - 8 && r.top - ph - 6 > 8) top = r.top - ph - 6;
  pop.style.left = (left + window.scrollX) + "px";
  pop.style.top = (top + window.scrollY) + "px";
  relancePop = pop;
  document.addEventListener("pointerdown", relanceOutside, true);
  document.addEventListener("keydown", relanceEsc, true);
}
// newDue : undefined = garder l'échéance, "" = l'effacer, date = la remplacer
function bringBackFromWaiting(key, newDue){
  overrides = loadOverrides();
  const o = overrides[key] = overrides[key] || {};
  const eff = effByKey(key);
  if(eff) o.due = newDue !== undefined ? newDue : (eff.due || "");
  delete o.dueBeforeWaiting;
  o.waiting = false;
  o.relance = "";                  // la relance disparaît
  saveOverrides(overrides);
  actionToast("waitingOff");
  currentProgressMsg = null;
  renderAll();
}
function addMonthISO(iso){
  const d = new Date(iso + "T00:00:00"), day = d.getDate();
  d.setMonth(d.getMonth() + 1);
  if(d.getDate() !== day) d.setDate(0);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function shortDateFR(iso){ const [y,m,d] = iso.split("-"); return parseInt(d,10) + "/" + parseInt(m,10); }
let relancePop = null;
function relanceOutside(e){
  if(!relancePop || relancePop.contains(e.target)) return;
  // 10.26 : page zoomée (pincement sur tablette) : on laisse dézoomer sans fermer
  if(e.pointerType !== "mouse" && window.visualViewport && window.visualViewport.scale > 1.01) return;
  // 10.26 : fenêtre de la plume avec un champ rempli : un toucher à côté range
  // juste le clavier (la plume ou Échap la ferment)
  if(relancePop.classList.contains("sync-pop") && [...relancePop.querySelectorAll("input")].some(i => i.value)){
    const a = document.activeElement;
    if(a && relancePop.contains(a)) a.blur();
    return;
  }
  closeRelancePop();
}
function relanceEsc(e){ if(e.key === "Escape" && relancePop){ e.stopPropagation(); closeRelancePop(); } }
function closeRelancePop(){
  if(!relancePop) return;
  relancePop.remove(); relancePop = null;
  document.removeEventListener("pointerdown", relanceOutside, true);
  document.removeEventListener("keydown", relanceEsc, true);
  // 10.8 : ce qui est arrivé d'ailleurs pendant que la fenêtre était ouverte
  // (ex. les listes en ligne, à la connexion) s'affiche maintenant
  if(externalPending && !hasActiveEdit()) renderAll();
}
function askRelance(anchor, key){
  closeRelancePop();
  const eff = effByKey(key);
  if(!eff) return;
  const today = todayISO();
  const postpone = !!eff.waiting;
  const opts = [
    [addDaysISO(today, 7), "1 sem."],
    [addDaysISO(today, 14), "2 sem."],
    [addMonthISO(today), "1 mois"],
  ];
  const dueDate = eff.due ? splitDue(eff.due).date : "";
  if(!postpone && dueDate > today) opts.push([dueDate, "Garder le " + shortDateFR(dueDate)]);
  const pop = document.createElement("div");
  pop.className = "relance-pop";
  pop.setAttribute("role", "dialog");
  // 8.2 : « Pas de relance » tout en haut, en un clic ; une date choisie dans
  // le calendrier est prise directement (plus de bouton OK).
  pop.innerHTML = `
    <button type="button" class="rp-skip" data-v="">Pas de relance</button>
    <div class="rp-title">${postpone ? "Ou la reporter ?" : "Ou un petit rappel de relance ?"}</div>
    <div class="rp-opts">${opts.map(([v,l]) => `<button type="button" data-v="${v}">${l}</button>`).join("")}</div>
    <div class="rp-date"><input type="date" min="${today}" aria-label="Date de relance précise"></div>
  `;
  const choose = v => { closeRelancePop(); sendToWaiting(key, v); };
  pop.querySelectorAll(".rp-skip, .rp-opts button").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); choose(b.dataset.v); }));
  const dateInp = pop.querySelector(".rp-date input");
  // une date complète et à venir : prise tout de suite (pendant la frappe au
  // clavier, l'année incomplète donne une date passée, qu'on ignore)
  dateInp.addEventListener("change", ()=>{ if(dateInp.value && dateInp.value >= today) choose(dateInp.value); });
  dateInp.addEventListener("keydown", e => { if(e.key === "Enter" && dateInp.value){ e.preventDefault(); choose(dateInp.value); } });
  openPopAt(pop, anchor);
}

// ---- 7.3 : passage à la nouvelle semaine, même onglet ouvert ----
// Avant, le compteur repartait à zéro à minuit le lundi, mais la purge
// n'avait lieu qu'au rechargement ou au retour sur l'onglet.
let weekSeen = null, daySeen = null;
function maybeRollover(){
  const today = todayISO(), monday = mondayOf(today);
  if(weekSeen === null){ weekSeen = monday; daySeen = today; return false; }
  if(monday === weekSeen && today === daySeen) return false;
  if(hasActiveEdit()) return false; // on réessaiera au prochain passage
  if(monday !== weekSeen){
    try{ runWeeklyPurge(); }catch(err){ console.error("[corbeille] purge du lundi", err); }
    currentProgressMsg = null;
  }
  weekSeen = monday; daySeen = today;
  return true;
}

function isQuickTyping(){
  const a = document.activeElement;
  return !!(a && a.classList && (a.classList.contains("cat-quick") || a.classList.contains("courses-input")) && a.value);
}
let refocusQuickCat = null;
// ---- 10.7 : volets (listes repliées), par appareil ----
const FOLD_KEY = "sltapis-volets";
function loadFolded(){ try{ const a = JSON.parse(localStorage.getItem(FOLD_KEY) || "[]"); return Array.isArray(a) ? a : []; }catch(e){ return []; } }
function isFolded(catId){ return loadFolded().includes(catId); }
function setFolded(catId, on){
  try{
    const a = loadFolded().filter(id => id !== catId);
    if(on) a.push(catId);
    localStorage.setItem(FOLD_KEY, JSON.stringify(a));
  }catch(e){}
}
function toggleFold(catId){
  const card = document.getElementById("cat-" + catId);
  const ul = card && card.querySelector(":scope > ul.items");
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const closing = !isFolded(catId);
  const ease = { duration:220, easing:"cubic-bezier(.4,0,.2,1)" };
  if(closing){
    if(reduce || !ul || !ul.animate){ setFolded(catId, true); renderAll(); return; }
    const h = ul.offsetHeight;
    ul.style.overflow = "hidden";
    const a = ul.animate([{ height:h + "px", opacity:1, marginTop:"0px" }, { height:"0px", opacity:0, marginTop:"-0.65rem" }], ease);
    a.onfinish = ()=>{ setFolded(catId, true); renderAll(); };
    return;
  }
  setFolded(catId, false);
  renderAll();
  if(reduce) return;
  const card2 = document.getElementById("cat-" + catId);
  const ul2 = card2 && card2.querySelector(":scope > ul.items");
  if(!ul2 || !ul2.animate) return;
  const h2 = ul2.offsetHeight;
  ul2.style.overflow = "hidden";
  const a2 = ul2.animate([{ height:"0px", opacity:0, marginTop:"-0.65rem" }, { height:h2 + "px", opacity:1, marginTop:"0px" }], ease);
  a2.onfinish = ()=>{ ul2.style.overflow = ""; };
}

// ---- Sauvegarde / restauration du contenu (export / import) ----
// La synchro multi-appareils (capacité "db" de Claude) a été retirée :
// cette liste vit désormais entièrement en local, dans ce navigateur. Le
// bouton "Sauvegarder" ci-dessous écrit un fichier .json contenant toutes
// tes tâches ; "Restaurer" relit un tel fichier. C'est le filet de sécurité
// qui remplace la synchro : tant que tu as une sauvegarde à jour, tu ne peux
// rien perdre, même si le chemin du fichier change.

// Vrai tant qu'un formulaire (édition, ajout, glisser-déposer...) est ouvert :
// on ne rafraîchit jamais l'affichage par-dessus une saisie en cours.
function hasActiveEdit(){
  return !!editingKey || !!addingCat || !!addingCategory || !!editingCategoryTitle || !!dragState || isQuickTyping() || !!relancePop || !!editingCoursesKey;
}

// ---- 7.43 : rappel de sauvegarde, au rythme de la purge du lundi ----
// La date de la dernière sauvegarde est notée à part (hors des fichiers de
// sauvegarde eux-mêmes). Un lundi, si rien n'a été sauvegardé depuis le
// lundi de la semaine d'avant, une petite ligne apparaît à côté du bouton
// « Sauvegarder », jusqu'à la prochaine sauvegarde. Jamais en cours de semaine.
const LAST_BACKUP_KEY = "fauconnerie-v2-lastbackup";
const BACKUP_WATCH_KEY = "fauconnerie-v2-backupwatch"; // 1re ouverture avec ce rappel
function noteBackupDone(){
  try{ Store.set(LAST_BACKUP_KEY, todayISO()); }catch(e){}
  renderBackupNudge();
}
function backupNudgeText(){
  let last = null, watch = null;
  try{ last = Store.get(LAST_BACKUP_KEY); watch = Store.get(BACKUP_WATCH_KEY); }catch(e){ return ""; }
  if(!last && !watch){
    try{ Store.set(BACKUP_WATCH_KEY, todayISO()); }catch(e){}
    return "";
  }
  const ref = last || watch;
  if(ref >= addDaysISO(mondayOf(todayISO()), -7)) return "";
  if(!last) return "Pas encore de sauvegarde";
  const days = Math.round((new Date(todayISO() + "T00:00:00") - new Date(last + "T00:00:00")) / 86400000);
  return "Dernière sauvegarde il y a " + days + " jours";
}
function renderBackupNudge(){
  const el = document.getElementById("backupNudge");
  if(!el) return;
  // 10.6 : quand on peut se connecter, le rappel invite à se connecter (et se
  // tait une fois connecté) ; la copie de secours est dans la plume
  // (Sync est déclaré plus bas : au tout premier rendu il n'existe pas encore)
  let cloud = false, logged = false;
  try{ cloud = !!Sync.available; logged = !!(Sync.user && ((Sync.status && Sync.status.state) || "off") !== "off"); }catch(e){}
  let text;
  if(cloud){
    text = (hasAnyList() && !logged) ? "Connecte-toi pour ne jamais perdre tes listes" : "";
  }else text = hasAnyList() ? backupNudgeText() : "";
  el.textContent = text;
  el.hidden = !text;
  el.classList.toggle("as-link", cloud && !!text);
  if(cloud && !el.dataset.wired){
    el.dataset.wired = "1";
    el.setAttribute("role", "button");
    el.tabIndex = 0;
    const go = e=>{ e.stopPropagation(); const p = document.getElementById("plume"); if(p && !p.hidden) p.click(); };
    el.addEventListener("click", go);
    el.addEventListener("keydown", e=>{ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); go(e); } });
  }
}

// Toutes les clés du navigateur où vivent tes tâches et leur agencement.
const BACKUP_KEYS = [STORAGE_KEY, ORDER_KEY, OVERRIDES_KEY, CUSTOM_KEY, CUSTOM_CATS_KEY, DELETED_CATS_KEY, CAT_TITLE_OVERRIDES_KEY, CHECKED_AT_KEY, TRASH_KEY, LAST_PURGE_KEY, CAT_REVERSE_KEY, WAIT_LOG_KEY];

// Construit une "photo" autonome de la liste : chaque tâche avec tous ses
// champs (titre, note, échéance, personne, urgent, en cours, cochée), dans
// l'ordre d'affichage. Cette photo ne dépend PAS de la base "en dur" du
// fichier : elle peut donc être reconstruite dans n'importe quelle version,
// même à base vide. C'est ce qui rend les sauvegardes vraiment transportables.
function buildSnapshot(){
  const snap = { format:2, exportedAt:new Date().toISOString(), categories:[] };
  getCategoryOrder().forEach(catIdx=>{
    const cat = DATA[catIdx];
    if(!cat || isCategoryDeleted(cat.id)) return;
    const items = getEffectiveItems(cat);
    const catOut = { id:cat.id, title:cat.title, color:cat.color, reversed:isCatReversed(cat.id), items:[] };
    getCatOrder(cat).forEach(idx=>{
      const base = items[idx];
      if(!base) return;
      const key = itemKey(cat.id, idx);
      if(isDeleted(key)) return;
      const eff = getEffective(key, base);
      catOut.items.push({
        t: eff.t, note: eff.note || "", urgent: !!eff.urgent, waiting: !!eff.waiting,
        due: eff.due || "", relance: eff.relance || "", who: eff.who || "", person: eff.person || "",
        tier: eff.tier || "", egg: !!eff.egg, done: !!state[key],
        doneOn: state[key] ? (checkedAt[key] || "") : "",
      });
    });
    snap.categories.push(catOut);
  });
  snap.trash = loadJSONKey(TRASH_KEY, []);
  try{ snap.lastPurge = Store.get(LAST_PURGE_KEY) || ""; }catch(e){ snap.lastPurge = ""; }
  snap.waitLog = waitLog();
  return snap;
}

// Mémorise le dernier fichier de sauvegarde (son handle) pour rouvrir son
// dossier la fois suivante. L'option "id" de showSaveFilePicker ne persiste
// pas toujours en file://, alors on garde le handle nous-mêmes.
function idbOpen(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open("fauconnerie-fs", 1);
    r.onupgradeneeded = ()=> r.result.createObjectStore("handles");
    r.onsuccess = ()=> res(r.result);
    r.onerror = ()=> rej(r.error);
  });
}
async function idbSetHandle(h){
  const db = await idbOpen();
  await new Promise((res,rej)=>{
    const tx = db.transaction("handles","readwrite");
    tx.objectStore("handles").put(h, "lastBackup");
    tx.oncomplete = res; tx.onerror = ()=> rej(tx.error);
  });
  db.close();
}
async function idbGetHandle(){
  const db = await idbOpen();
  const h = await new Promise((res,rej)=>{
    const tx = db.transaction("handles","readonly");
    const rq = tx.objectStore("handles").get("lastBackup");
    rq.onsuccess = ()=> res(rq.result || null);
    rq.onerror = ()=> rej(rq.error);
  });
  db.close();
  return h;
}

async function exportData(){
  // 10.0 : nouveau format = les fiches (listes + « moi ») telles quelles.
  // La photo autonome reste jointe : une version d'avant la 10.0 sait la relire.
  let dump;
  if(Store.mode === "doc"){
    dump = Object.assign({ app:"sous-le-tapis", version:2, format:10, exportedAt:new Date().toISOString() }, Store.exportModel());
  }else{
    dump = { app:"sous-le-tapis", version:1, exportedAt:new Date().toISOString(), data:{} };
    BACKUP_KEYS.forEach(k=>{
      const raw = Store.get(k);
      if(raw !== null) dump.data[k] = raw;
    });
  }
  dump.snapshot = buildSnapshot(); // photo autonome, relisible partout
  const text = JSON.stringify(dump, null, 2);
  const stamp = new Date().toISOString().slice(0,10);
  const suggestedName = "sous-le-tapis-sauvegarde-" + stamp + ".json";

  // Chrome / Edge : vraie fenêtre « Enregistrer sous » où tu choisis le
  // dossier. L'option id fait que le navigateur rouvre le même dossier la
  // fois suivante. Les navigateurs qui ne connaissent pas cette API
  // (Firefox, Safari) retombent sur le téléchargement classique plus bas.
  if(window.showSaveFilePicker){
    try{
      const opts = {
        id: "fauconnerie-v2-backup",
        suggestedName,
        types: [{ description:"Sauvegarde Sous le tapis (JSON)", accept:{ "application/json":[".json"] } }],
      };
      // Point de départ = dossier du dernier enregistrement, s'il est connu.
      try{ const last = await idbGetHandle(); if(last) opts.startIn = last; }catch(e){}
      const handle = await window.showSaveFilePicker(opts);
      const writable = await handle.createWritable();
      await writable.write(text);
      await writable.close();
      try{ await idbSetHandle(handle); }catch(e){}
      noteBackupDone();
      celebrate("Sauvegarde enregistrée");
      return;
    }catch(err){
      if(err && err.name === "AbortError") return; // fenêtre fermée volontairement : on ne fait rien
      // toute autre erreur : on retombe sur le téléchargement classique ci-dessous
    }
  }

  // 8.17 : iPhone / iPad — la feuille de partage permet de ranger le fichier
  // dans Fichiers ou iCloud (ou de l'envoyer par AirDrop / Mail), là où un
  // téléchargement classique finit dans un coin peu visible.
  const isTouchApple = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
    (/Macintosh/.test(navigator.userAgent) && (navigator.maxTouchPoints || 0) > 1);
  if(isTouchApple && navigator.share && window.File && navigator.canShare){
    try{
      const file = new File([text], suggestedName, {type:"application/json"});
      if(navigator.canShare({ files:[file] })){
        await navigator.share({ files:[file], title:"Sauvegarde — Sous le tapis" });
        noteBackupDone();
        celebrate("Sauvegarde enregistrée");
        return;
      }
    }catch(err){
      if(err && err.name === "AbortError") return; // feuille fermée : rien n'est noté
      // toute autre erreur : téléchargement classique ci-dessous
    }
  }

  const blob = new Blob([text], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = suggestedName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
  noteBackupDone();
  celebrate("Sauvegarde enregistrée");
}

function importSnapshot(snap){
  const cats=[], custom={}, newState={}, ord={}, catIdxList=[], newCheckedAt={}, reversed={};
  // 7.43 : les sauvegardes d'avant ne notaient pas le sens des listes ; on
  // ne touche alors pas à celui de ce navigateur.
  const hasReversed = (snap.categories||[]).some(c => c && c.reversed !== undefined);
  (snap.categories||[]).forEach((c, ci)=>{
    if(!c || !c.id) return;
    cats.push({ id:c.id, title:c.title || "(sans titre)", color:c.color || "#7a8a80" });
    if(c.reversed) reversed[c.id] = true;
    const arr=[], idxOrder=[];
    (c.items||[]).forEach((it, idx)=>{
      const item={ t:(it && it.t) || "" };
      if(it.note) item.note=it.note;
      if(it.urgent) item.urgent=true;
      if(it.waiting) item.waiting=true;
      if(it.due) item.due=it.due;
      if(it.waiting && it.relance !== undefined) item.relance=it.relance;
      if(it.who) item.who=it.who;
      if(it.person) item.person=it.person;
      if(it.tier) item.tier=it.tier;
      if(it.egg) item.egg=true;
      arr.push(item);
      if(it.done) newState[c.id+":"+idx]=true;
      if(it.done && it.doneOn) newCheckedAt[c.id+":"+idx]=it.doneOn;
      idxOrder.push(idx);
    });
    custom[c.id]=arr;
    ord[c.id]=idxOrder;
    catIdxList.push(ci);
  });
  ord["__categories__"]=catIdxList;
  try{
    Store.set(CUSTOM_CATS_KEY, JSON.stringify(cats));
    Store.set(CUSTOM_KEY, JSON.stringify(custom));
    Store.set(STORAGE_KEY, JSON.stringify(newState));
    Store.set(ORDER_KEY, JSON.stringify(ord));
    Store.set(OVERRIDES_KEY, JSON.stringify({}));
    Store.set(DELETED_CATS_KEY, JSON.stringify([]));
    Store.set(CAT_TITLE_OVERRIDES_KEY, JSON.stringify({}));
    Store.set(CHECKED_AT_KEY, JSON.stringify(newCheckedAt));
    // Une sauvegarde plus ancienne, sans corbeille, ne vide pas celle qui existe.
    if(Array.isArray(snap.trash)) Store.set(TRASH_KEY, JSON.stringify(snap.trash));
    if(snap.lastPurge) Store.set(LAST_PURGE_KEY, snap.lastPurge);
    if(Array.isArray(snap.waitLog)) Store.set(WAIT_LOG_KEY, JSON.stringify(snap.waitLog));
    if(hasReversed) Store.set(CAT_REVERSE_KEY, JSON.stringify(reversed));
  }catch(e){}
  DATA.length = 0; // la liste est entièrement remplacée
  reloadAllFromStorage();
  renderAll();
}

// 10.6 : restauration en étant connecté — les listes partagées actuelles
// (les miennes partagées et celles qu'on me partage) et le carnet / prénom
// restent tels qu'ils sont ; seules mes listes non partagées viennent du
// fichier. Une liste partagée qui n'existe plus ici n'est pas ressuscitée.
function keepSharedOnImport(dump){
  const cur = Store.exportModel();
  const keep = new Set(cur.lists.filter(L => L && isSharedList(L.id)).map(L => L.id));
  const out = JSON.parse(JSON.stringify(dump));
  out.lists = out.lists.filter(L => L && !keep.has(L.id) && !(L.owner && L.owner !== myUid()) && !(Array.isArray(L.members) && L.members.some(m => m !== "moi" && m !== L.owner && m !== myUid())))
    .concat(cur.lists.filter(L => L && keep.has(L.id)));
  ["contacts", "myName"].forEach(k=>{ if(cur.user && k in cur.user) out.user[k] = cur.user[k]; else if(out.user) delete out.user[k]; });
  return out;
}
function importData(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    let dump;
    try{ dump = JSON.parse(reader.result); }
    catch(err){ alert("Ce fichier n'est pas une sauvegarde lisible."); return; }
    // 10.0 : sauvegarde au nouveau format (fiches) : remise telle quelle.
    const online = typeof myUid === "function" && !!myUid();
    if(Store.mode === "doc" && Store.isModelDump(dump)){
      if(online){
        // 10.6 : connecté, on ne touche ni aux listes partagées (dans un sens
        // ou dans l'autre) ni au carnet : ils gardent leur état actuel
        if(!confirm("Importer cette sauvegarde ? Elle remplacera tes listes non partagées. Les listes partagées et ton carnet restent tels qu'ils sont.")) return;
        dump = keepSharedOnImport(dump);
      }else if(!confirm("Importer cette sauvegarde ? Elle remplacera la liste actuelle de ce fichier.")) return;
      Store.importModel(dump);
      DATA.length = 0; // la liste est entièrement remplacée
      reloadAllFromStorage();
      renderAll();
      celebrate("Sauvegarde importée");
      return;
    }
    if(online){ alert("Cette sauvegarde vient d'une version plus ancienne : elle ne peut pas être restaurée pendant que tu es connecté."); return; }
    // Sauvegarde autonome (photo) : reconstruit toute la liste, quelle que soit
    // la version d'origine. C'est le chemin normal ici.
    if(dump && dump.snapshot && Array.isArray(dump.snapshot.categories)){
      if(!confirm("Importer cette sauvegarde ? Elle remplacera la liste actuelle de ce fichier.")) return;
      importSnapshot(dump.snapshot);
      celebrate("Sauvegarde importée");
      return;
    }
    const data = (dump && dump.data && typeof dump.data === "object") ? dump.data : dump;
    if(!data || typeof data !== "object"){ alert("Ce fichier ne contient pas de sauvegarde reconnaissable."); return; }
    const hasSomething = BACKUP_KEYS.some(k => typeof data[k] === "string");
    if(!hasSomething){ alert("Ce fichier ne ressemble pas à une sauvegarde de cette liste."); return; }
    const ok = confirm("Importer cette sauvegarde ? Elle remplacera les tâches actuellement affichées dans ce navigateur.");
    if(!ok) return;
    BACKUP_KEYS.forEach(k=>{
      if(typeof data[k] === "string"){
        try{ Store.set(k, data[k]); }catch(e){}
      }
    });
    reloadAllFromStorage(); // on recharge tout depuis ce qu'on vient d'écrire
    renderAll();
    celebrate("Sauvegarde importée");
  };
  reader.readAsText(file);
}

/* ---------- page ---------- */
*{box-sizing:border-box;}
html{background:var(--bg);}
body{
  margin:0;
  min-height:100vh;
  /* fond : dégradé frais en haut, crème en bas */
  background:linear-gradient(180deg, var(--bg-top) 0, var(--bg) 900px, var(--bg) 100%);
  color:var(--ink);
  font-family:'Public Sans', system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent-soft); color:var(--ink);}
.wrap{
  max-width:920px;
  margin:0 auto;
  padding:2.75rem 1.5rem 6rem;
  position:relative;
  isolation:isolate;
}
/* le titre et le numéro de version restent au-dessus du tapis déroulé */
header{
  display:flex;
  flex-direction:column;
  gap:1.1rem;
  margin-top:0.35rem;
  margin-bottom:0.7rem;
  position:relative;
  z-index:41;
}
.eyebrow{
  display:block;
  text-align:right;
  /* 10.4 : reculé pour laisser la plume, dont la pointe s'aligne sur le bout
     droit de la barre de comptage ; 10.14 : en marge (et plus en padding) et
     à la largeur du texte : seul le texte déroule le tapis, plus l'espace
     autour de la plume (un doigt qui ratait la plume déroulait le tapis) */
  width:fit-content;
  margin-left:auto;
  margin-right:69px;
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.8rem;
  font-weight:600;
  letter-spacing:0.11em;
  text-transform:uppercase;
  color:var(--logo-green);
  cursor:pointer;
  transition:color .15s ease;
  -webkit-user-select:none;
  user-select:none;
}
.eyebrow:hover{ color:var(--logo-green-strong); }
.eyebrow:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:4px; }
.ap-nod{ position:relative; }
.ap-nod::after{
  content:"";
  position:absolute;
  left:0;
  right:0.11em; /* retranche l'espacement de fin : le trait s'arrête au bord du P */
  bottom:-1px;
  height:1px;
  background:currentColor;
}
/* 10.3-10.4 : plume de connexion, à droite du titre ; pointe calée sur le bout
   droit de la barre de comptage ; tomate claire (--plume-off) = déconnecté, vert du logo = connecté (10.19) */
.plume{
  position:absolute; right:14.8px; top:-6px; width:28px; height:28px;
  appearance:none; border:0; background:none; padding:0; cursor:pointer;
  color:var(--plume-off); transform-origin:50% 50%;
  filter:drop-shadow(0 0 1px color-mix(in srgb, currentColor 20%, transparent));   /* 10.19 : halo adouci (avant 1.5px, 35 %) */
  transition:color .25s ease, opacity .25s ease, transform .18s ease, filter .25s ease;
}
.plume svg{ display:block; width:100%; height:100%; }
/* 10.23 : « Hors ligne » sous la plume */
.plume-tag{
  position:absolute; right:12px; top:33px; pointer-events:none; white-space:nowrap;
  font-family:'Courier Prime', 'Courier New', monospace; font-size:0.6rem; font-weight:700;
  letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-faint);
}
.plume-tag[hidden]{ display:none; }
/* 10.14 : zone de toucher agrandie (invisible), sans déborder sur le titre */
.plume::before{ content:""; position:absolute; inset:-11px -11px -11px -10px; }
.plume.on{ color:var(--logo-green); }
.plume.waiting{ opacity:.55; }
.plume:hover{ transform:rotate(9deg); }
.plume:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:8px; }
.lucky-line[hidden], .urgent-banner[hidden], #waitingSection[hidden], .backup-nudge[hidden], .plume[hidden]{display:none;}

/* ---------- compteur « tableau de bord » (8.10) ----------
   Ligne du haut : à gauche le chiffre de la semaine, au milieu la phrase ;
   la barre court en dessous sur toute la largeur, le total en petit
   juste au-dessus de son extrémité droite (8.13 ; chiffre seul en 8.32).
   Compteur en bloc (8.37) : « 7 ACCOMPLIES » sur la 1re ligne, « CETTE
   SEMAINE » dessous, les deux de même largeur — voir fitCountBlock().
   Sur téléphone : chiffre et total côte à côte, la barre, puis la phrase. */
.progress-card{
  background:var(--surface);
  border-radius:16px;
  padding:1.3rem 1.5rem 1.4rem;
  box-shadow:var(--shadow);
  display:grid;
  grid-template-columns:auto 1fr auto;
  row-gap:1rem;
  align-items:center;
}
.progress-top{ display:contents; }
.progress-count{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-self:start; /* le bloc garde sa largeur, même dans une colonne 1fr */
}
.progress-count, .progress-total{
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.7rem;
  font-weight:700;
  letter-spacing:0.09em;
  line-height:1.35;
  text-transform:uppercase;
  white-space:pre-line;
  font-variant-numeric:tabular-nums;
  color:var(--count-ink);
}
.progress-count b{
  font-size:4.2em;
  letter-spacing:-0.03em;
  line-height:0.85;
}
/* 1re ligne à la largeur du bloc : un éventuel surplus va avant « accomplies » */
.count-line{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:0.85em;
  align-self:stretch;
}
.count-week{ margin-top:-0.1rem; line-height:1.1; }
.progress-count{ grid-column:1; grid-row:1; padding-right:1.6rem; margin-bottom:-0.28rem; /* plus près de la barre (8.38, un chouïa remonté en 9.1) */ }
.progress-count b{ color:var(--urgent); } /* 10.19 : améthyste, la teinte des urgences (avant : framboise --relance) */
.progress-total{
  grid-column:3; grid-row:1;  /* tout au bout, juste au-dessus de la barre (8.13) */
  align-self:end;
  margin-bottom:-0.72rem;
  padding-left:1.2rem;
  white-space:nowrap;
  line-height:1;
  font-size:0.68rem;
  /* 10.13 : ce qui reste à faire = la partie vide de la barre : sa couleur
     (--accent-soft), foncée juste assez pour se lire sur le blanc */
  color:color-mix(in srgb, var(--accent-soft) 40%, var(--accent-strong));
}
.progress-msg{
  grid-column:2;
  grid-row:1;
  align-self:stretch;
  display:flex;
  align-items:center;
  padding:0 1.6rem;
  border-left:1px solid var(--line);
  min-height:1.3em;
  font-family:'Public Sans', system-ui, sans-serif;
  font-size:0.95rem;
  font-weight:600;
  line-height:1.4;
  color:var(--phrase);
  text-wrap:pretty;
  transition:opacity .25s ease;
}
.bar-track{
  grid-column:1 / -1;
  grid-row:2;
  height:3px;
  background:var(--accent-soft);
  border-radius:999px;
  overflow:hidden;
}
.bar-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg, var(--accent-strong), var(--accent) 60%, color-mix(in srgb, var(--accent) 55%, #9FD8F5));
  border-radius:999px;
  transition:width .5s cubic-bezier(.4,0,.2,1);
}
@media (max-width:560px){
  .progress-card{ grid-template-columns:1fr auto; row-gap:0.9rem; }
  .progress-count{ padding-right:0; }
  .progress-total{ grid-column:2; }
  .progress-msg{ grid-column:1 / -1; grid-row:3; padding:0; border-left:none; }
}

/* ---------- case urgente ---------- */
.urgent-banner{
  margin-top:1.5rem;
  background:color-mix(in srgb, color-mix(in srgb, var(--urgent-soft) 50%, var(--accent-soft)) 70%, var(--surface));   /* 10.25 : fond pâli, tiré vers le bleu (--accent-soft) pour moins de rouge */
  border-radius:14px;
  padding:1rem 1.25rem;
  box-shadow:0 6px 18px -10px color-mix(in srgb, var(--urgent) 55%, transparent);
  display:flex;
  gap:0.9rem;
  align-items:flex-start;
}
.urgent-banner svg{flex:none; margin-top:-0.15rem; color:color-mix(in srgb, var(--urgent-ink) 50%, var(--urgent-soft));}   /* 10.25 : pâli comme le titre */ /* centre du picto = centre du titre (8.13) ; 10.19 : triangle, comme les boutons urgents */
.urgent-banner-title{
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.74rem;
  font-weight:700;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:color-mix(in srgb, var(--urgent-ink) 50%, var(--urgent-soft));   /* 10.25 : titre pâli */
  margin-bottom:0.2rem;
}
.urgent-banner-body{flex:1; min-width:0;}
/* rien d'urgent : la case reste, au calme */
.urgent-banner.calm{ align-items:center; }
.urgent-banner.calm svg{ margin-top:0; color:color-mix(in srgb, var(--urgent) 55%, var(--urgent-soft)); stroke-width:2.2; }
.urgent-banner.calm .urgent-banner-title{ margin:0; color:color-mix(in srgb, var(--urgent) 55%, var(--urgent-soft)); font-weight:700; } /* la couleur de l'urgent, éteinte (8.15) */
.urgent-list{
  list-style:none;
  margin:0;
  padding:0;
  display:flex;
  flex-direction:column;
  gap:0.15rem;
}
.urgent-list li{
  display:flex;
  align-items:flex-start;
  gap:0.35rem;
  /* zone de survol élargie à gauche jusqu'au bord du rond « ! » : poignée et
     case à cocher y tiennent, le texte reste à sa place (8.30) */
  margin-left:-2rem;
  padding-left:0.3rem;
  border-radius:8px;
  position:relative;
  transition:background .12s ease;
}
/* un seul survol par ligne (7.40) ; 14 % dès que le thème n'est pas forcé en clair */
.urgent-list li:hover{ background:color-mix(in srgb, var(--urgent) 8%, transparent); }
:root:not([data-theme="light"]) .urgent-list li:hover{ background:color-mix(in srgb, var(--urgent) 14%, transparent); }
.urgent-list li.dragging{opacity:0.4;}
.urgent-list .drag-handle{
  /* dans la ligne, comme dans les listes, visible au survol (8.30) */
  color:var(--urgent-ink);
  opacity:0;
  transition:opacity .15s ease;
}
.urgent-list li:hover .drag-handle{ opacity:0.5; }
.urgent-check{
  appearance:none;
  -webkit-appearance:none;
  box-sizing:border-box;
  padding:0;
  flex:none;
  margin:calc(0.3rem + 0.6175rem - 7px) 0 0; /* centrée sur la 1re ligne (8.30) */
  width:14px;
  height:14px;
  border:1.5px solid color-mix(in srgb, var(--urgent-ink) 45%, transparent);
  border-radius:4px;
  background:var(--surface);
  cursor:pointer;
  opacity:0;
  transition:opacity .12s ease, border-color .12s ease, background .12s ease;
}
/* dévoilement : au survol avec une souris ; au toucher, par la classe
   « revealed » (8.38, voir la section des écrans tactiles) */
@media (hover:hover){ .urgent-list li:hover .urgent-check{ opacity:1; } }
.urgent-check:hover{ border-color:var(--urgent-ink); background:color-mix(in srgb, var(--urgent-ink) 12%, var(--surface)); }
.urgent-actions{
  margin-left:auto;
  flex:none;
  align-self:center;
  display:flex;
  align-items:center;
  gap:0.1rem;
  padding-right:0.15rem;
  opacity:0;
  pointer-events:none;
  transition:opacity .12s ease;
}
@media (hover:hover){
  .urgent-list li:hover .urgent-actions,
  .urgent-list li:focus-within .urgent-actions{ opacity:1; pointer-events:auto; }
}
.urgent-actions button{ transition:color .12s ease, opacity .12s ease; }
.urgent-actions .waiting-btn,
.urgent-actions .waiting-btn:hover,
.urgent-actions .urgent-btn.active,
.urgent-actions .urgent-btn.active:hover{ background:transparent; }
.urgent-actions .waiting-btn{ color:color-mix(in srgb, var(--urgent-ink) 55%, transparent); }
.urgent-actions .waiting-btn:hover{ color:var(--urgent-ink); }
.urgent-actions .urgent-btn.active{ opacity:0.7; }
.urgent-actions .urgent-btn.active:hover{ opacity:1; }
.urgent-actions .urgent-btn.auto, .urgent-actions .urgent-btn.auto:hover{ cursor:default; opacity:0.7; }   /* 10.29 : triangle inerte */
.urgent-jump{
  appearance:none;
  border:none;
  background:transparent;
  flex:1;
  min-width:0;
  text-align:left;
  font-family:inherit;
  font-size:0.95rem;
  line-height:1.3;
  color:var(--urgent-ink);   /* 10.25 : les tâches urgentes dans l'encre de l'urgence (avant : noir) */
  font-weight:500;
  padding:0.3rem 0.4rem 0.3rem 1.65rem; /* place de la puce ; texte à la même place qu'avant (8.30) */
  border-radius:8px;
  cursor:default;
  -webkit-tap-highlight-color:transparent; /* pas de voile gris au toucher (8.34) */
  position:relative;
}
[data-note-key] .urgent-jump{ cursor:pointer; }
/* puce : un rond plein dans le rouge du titre, centré sur la 1re ligne (8.29) */
.urgent-bullet{
  position:absolute;
  left:0.45rem;
  top:calc(0.3rem + 0.6175rem); /* moitié de la 1re ligne : 0.95rem × 1.3 / 2 */
  transform:translateY(-50%);
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--urgent-ink); /* 10.25 : même encre que le texte (avant : améthyste à 80 %) */
  font-size:0;
}
.urgent-jump-cat{
  display:inline-block;
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.7rem;
  font-weight:600;
  letter-spacing:0.04em;
  text-transform:uppercase;
  color:var(--cat-color, var(--ink-faint)); /* le nom de la liste, en gris (8.14) ; 10.25 : dans la couleur de sa liste */
  margin:0 0.5rem;
}
/* détail de la tâche sous son titre, aligné sur le titre (8.28, plus clair en 8.29) ;
   replié derrière le sigle (8.31, voir .note-fold) */
.urgent-note{
  display:block;
  font-size:0.8rem;
  color:color-mix(in srgb, var(--ink-soft) 70%, transparent);
  padding-top:0.1rem;
  line-height:1.4;
}
.urgent-list .note-toggle{ color:color-mix(in srgb, var(--urgent-ink) 45%, transparent); }
.urgent-list .note-toggle:hover{ color:var(--urgent-ink); }
.urgent-list li.note-open .note-toggle{ color:var(--urgent-ink); background:var(--urgent-soft); }
/* relance arrivée (tâche en cours dont la date est là) — 10.23 : dans la
   case urgente, plus de couleur à part (avant : framboise --relance) : elle
   prend le style commun des urgences ; seul son badge « Relance » la signale.
   Dans « En cours », son titre est en améthyste, comme une tâche urgente. */
.item.item-relance .item-title{ color:var(--urgent-ink); font-weight:600; }

/* ---------- trèfle : deux petites tâches piochées chaque jour ---------- */
.lucky-line{
  margin-top:0.8rem;
  border-radius:12px;
  background:var(--lucky-bg);
  box-shadow:var(--shadow);
  padding:0.7rem 0.9rem 0.85rem;
  transition:opacity .4s ease, filter .4s ease;
}
.lucky-head{
  display:flex;
  align-items:center;
  gap:0.9rem;               /* même écart icône/titre que la case urgente */
  margin:0 0 0.6rem 0.35rem; /* 0.9 + 0.35 = 1.25rem : trèfle à l'aplomb du « ! » */
}
.lucky-clover{flex:none; width:18px; height:18px; color:var(--phrase);   /* 10.25 : bleu de la phrase (avant : --wait pâli) */ overflow:visible; transform-origin:50% 48%; transition:transform .45s cubic-bezier(.34,1.4,.64,1);}
/* 8.25 : case fermée chaque matin — un gros bouton ; le trèfle sert de
   manivelle, la case se déploie et les deux tâches tournent comme une
   machine à sous avant de s'arrêter sur celles du jour. */
.lucky-line.closed{ cursor:pointer; padding-bottom:0.7rem; transition:opacity .4s ease, filter .4s ease, box-shadow .2s ease, transform .2s ease; }
.lucky-line.closed .lucky-head{ margin-bottom:0; }
.lucky-line.closed:not(.rest):hover, .lucky-line.closed:focus-visible{
  outline:none;
  box-shadow:var(--shadow), 0 0 0 3px color-mix(in srgb, var(--lucky-lemon) 40%, transparent), 0 6px 20px -4px color-mix(in srgb, var(--lucky-lemon) 70%, transparent);
  transform:translateY(-1px);
}
.lucky-line.closed:not(.rest):hover .lucky-clover, .lucky-line.closed:focus-visible .lucky-clover{ transform:rotate(-30deg); }
.lucky-line.closed:active{ transform:translateY(0); }
.lucky-crank{
  margin-left:auto; flex:none; line-height:0; padding:4px;
  color:color-mix(in srgb, var(--lucky-lemon) 55%, var(--ink)); opacity:.75;
  transition:transform .3s ease, opacity .2s ease;
}
.lucky-line.closed:not(.rest):hover .lucky-crank{ opacity:1; transform:translateY(2px); }
.lucky-clover-btn{
  appearance:none; border:none; background:transparent; padding:3px; margin:-3px;
  border-radius:50%; line-height:0; cursor:pointer; color:inherit; flex:none;
  transition:background .15s ease;
}
.lucky-clover-btn:hover{ background:color-mix(in srgb, var(--lucky-lemon) 22%, var(--surface)); }
.lucky-clover-btn:hover .lucky-clover{ transform:rotate(30deg); }
.lucky-clover-btn:focus-visible{ outline:2px solid var(--lucky-lemon); outline-offset:1px; }
.lucky-line.closing{ pointer-events:none; }
.lucky-pick.spinning{ position:relative; }
.lucky-pick.spinning .lucky-pick-text{ visibility:hidden; }
.lucky-reel{ position:absolute; overflow:hidden; pointer-events:none; }
.lucky-reel-strip{ display:block; will-change:transform, filter; }
.lucky-reel-item{
  display:flex; align-items:center; justify-content:center;
  overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
}
.lucky-reel-item > span{ min-width:0; overflow:hidden; text-overflow:ellipsis; }
.lucky-reel-item.final > span{ white-space:inherit; overflow:visible; flex:none; max-width:100%; }
.lucky-lead{
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-style:normal;
  font-size:0.74rem;
  font-weight:600;
  letter-spacing:0.07em;
  text-transform:uppercase;
  color:var(--phrase);   /* 10.25 : bleu de la phrase, comme le trèfle (avant : olive citron + encre) */
  margin-right:auto; /* pousse ⟳ à droite, même enveloppé (8.33) */
}
.lucky-reroll{
  appearance:none;
  border:none;
  background:transparent;
  color:color-mix(in srgb, var(--lucky-lemon) 55%, var(--ink));
  opacity:0.8;
  padding:4px;
  border-radius:50%;
  cursor:pointer;
  line-height:0;
  transition:opacity .15s ease, background .15s ease, transform .35s ease;
}
.lucky-reroll:hover{ opacity:1; background:color-mix(in srgb, var(--lucky-lemon) 25%, var(--surface)); transform:rotate(180deg); }
.lucky-opts{display:flex; align-items:center; gap:0.9rem;}
.lucky-or{
  flex:none;
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-style:normal;
  font-weight:700;
  font-size:0.75rem;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:color-mix(in srgb, var(--lucky-lemon) 55%, var(--ink));
  opacity:.7;
}
.lucky-pick{
  appearance:none;
  flex:1 1 0;
  min-width:0;
  border:1px solid transparent;
  border-radius:8px;
  background:var(--surface);
  font-family:'Public Sans', system-ui, sans-serif;
  font-style:normal;
  font-size:0.9rem;
  color:var(--ink);
  padding:0.5rem 0.9rem;
  box-shadow:0 1px 2px rgba(30,40,45,0.06);
  text-align:center;
  cursor:pointer;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  transition:box-shadow .2s ease, transform .2s ease;
}
.lucky-pick.chosen{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:0.5rem;
  cursor:default;
  border-color:var(--lucky-lemon);
  box-shadow:0 0 0 1px var(--lucky-lemon);
}
/* survol : la petite case reste blanche, elle s'illumine par l'arrière.
   (!important : le liseré citron de la proposition retenue s'efface aussi.) */
.lucky-pick:hover{
  background:var(--surface);
  border-color:transparent !important;
  box-shadow:0 0 0 3px color-mix(in srgb, var(--lucky-lemon) 35%, transparent), 0 4px 16px -2px color-mix(in srgb, var(--lucky-lemon) 70%, transparent);
  transform:translateY(-1px);
}
.lucky-pick-text{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.lucky-check{flex:none; width:15px; height:15px; margin:0; accent-color:var(--wait); cursor:pointer;}
.lucky-line.can-reset{cursor:pointer;}
.lucky-pick.dim{opacity:0.45; filter:grayscale(1);}
.lucky-pick.dim:hover{opacity:0.75;}
/* une des deux est faite : tout se grise, seul le liseré jaune reste, atténué */
.lucky-line.done{background:color-mix(in srgb, var(--surface) 45%, var(--bg));}
.lucky-line.done .lucky-head{filter:grayscale(1); opacity:0.68;}
.lucky-line.done .lucky-pick{color:var(--ink-faint);}
.lucky-line.done .lucky-pick.dim{opacity:0.4;}
.lucky-line.done .lucky-pick.dim:hover{opacity:0.4; cursor:default;}
.lucky-line.done .lucky-pick.chosen{
  border-color:color-mix(in srgb, var(--lucky-lemon) 50%, var(--line));
  box-shadow:none;
}
.lucky-line.done .lucky-check{accent-color:var(--ink-faint);}
.lucky-pick.won .lucky-pick-text{text-decoration:line-through; text-decoration-thickness:1px;}
@media (max-width:560px){
  .lucky-opts{gap:0.5rem;}
  .lucky-pick{ white-space:normal; padding:0.45rem 0.6rem; } /* sur deux lignes plutôt que coupées */
  .lucky-pick-text{ white-space:normal; }
}

/* ---------- listes ---------- */
.categories{
  margin-top:2.25rem;
  display:grid;
  grid-template-columns:minmax(0, 1fr) minmax(0, 1fr);   /* 10.20 : colonnes égales quel que soit le contenu */
  gap:1.1rem;
}
@media (max-width:720px){
  .categories{grid-template-columns:minmax(0, 1fr);}
}
/* liste : fond blanc, seul le liseré coloré à gauche */
.category{
  background:var(--surface);
  /* liseré à la couleur de la liste, adouci (8.14) */
  border-left:3px solid color-mix(in srgb, var(--cat-color, var(--accent)) 40%, var(--surface));
  border-radius:14px;
  padding:1.15rem 1.25rem 1.3rem;
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  gap:0.65rem;
  min-width:0;   /* 10.20 : un contenu large ne pousse plus la carte */
}
.category.done{ opacity:0.62; }
/* 10.15 : liste de courses — hauteur bornée (--courses-max, posé par
   fitCoursesCards) ; au-delà, seule la zone des articles défile, le titre,
   la saisie et les boutons restent visibles.
   10.17 : feuille de cahier — papier, sans le liseré coloré de gauche (son
   épaisseur rendue au padding, rien ne bouge), marge verticale juste
   à gauche des ronds (--margin-x : bord gauche de la carte → marge), qui
   part du premier article (--rule-top, posé par fitCoursesCards).
   10.18 : marge à la couleur de la liste, pile entre la poignée et le rond ;
   liseré très fin à la couleur de la liste (ombre intérieure d'un
   demi-pixel : rien ne bouge) et ombre un peu plus nette, pour se détacher
   du fond ; repliée, un clic n'importe où sur la carte la déplie */
.category.courses{
  max-height:var(--courses-max, 28rem);
  --margin-x:3.19rem;
  --margin-ink:color-mix(in srgb, var(--cat-color, var(--accent)) 70%, var(--paper));
  border-left:0;
  padding-left:calc(1.25rem + 3px);
  box-shadow:inset 0 0 0 0.5px var(--memo-line),
    inset 0 1px 0 var(--gloss), var(--paper-shadow);   /* 10.23 : liseré de lumière en haut ; 10.25 : liseré neutre bleuté */
  background:
    linear-gradient(var(--gloss-a, 115deg), transparent var(--gloss-p, 18%), var(--gloss) calc(var(--gloss-p, 18%) + 9%), transparent calc(var(--gloss-p, 18%) + 26%)),
    linear-gradient(var(--gloss-a, 115deg), transparent calc(var(--gloss-p, 18%) + 34%), color-mix(in srgb, var(--gloss) 60%, transparent) calc(var(--gloss-p, 18%) + 38%), transparent calc(var(--gloss-p, 18%) + 44%)),   /* 10.25 : second reflet, fin */   /* 10.23 : papier glacé — bande de lumière en biais */
    linear-gradient(90deg, transparent var(--margin-x), var(--margin-ink) var(--margin-x),
      var(--margin-ink) calc(var(--margin-x) + 1.5px), transparent calc(var(--margin-x) + 1.5px))
      0 var(--rule-top, 0) / 100% 100% no-repeat,
    linear-gradient(160deg, var(--memo-a) 10%, var(--memo-b) 60%, var(--memo-c) 100%);   /* 10.25 : nacre légère */
}
.category.courses > ul.items{
  flex:0 1 auto; min-height:0;
  overflow-y:auto; overscroll-behavior:contain;
  scrollbar-width:none;   /* 10.18 : barre maison .courses-scroll, toujours visible (iPhone compris) */
}
.category.courses > ul.items::-webkit-scrollbar{ display:none; }
/* 10.18 : barre de défilement toujours visible quand la liste dépasse (les
   barres du système disparaissent au repos, surtout sur iPhone) ; placée par
   placeCoursesScroll, dans la marge droite de la carte, sans capter le doigt */
.courses-scroll{
  position:absolute; right:0.5rem; width:3px; border-radius:2px;
  background:var(--paper-rule); pointer-events:none;
}
.courses-scroll[hidden]{ display:none; }
.courses-scroll > span{
  position:absolute; left:0; right:0; border-radius:2px;
  background:color-mix(in srgb, var(--cat-color, var(--accent)) 70%, var(--paper));
}
/* 10.7 : volet — la flèche en bas à droite replie la liste sur son bandeau */
.category{ position:relative; }
.cat-fold{
  position:absolute; right:0.55rem; bottom:0.3rem; width:24px; height:18px;
  display:grid; place-items:center; appearance:none; border:0; background:none; padding:0;
  border-radius:6px; cursor:pointer; color:var(--ink-faint); opacity:0.55;
  transition:opacity .15s ease, color .15s ease, background .15s ease;
}
.cat-fold:hover, .cat-fold:focus-visible{ opacity:1; color:var(--cat-color, var(--accent)); background:color-mix(in srgb, var(--cat-color, var(--accent)) 10%, transparent); }
.cat-fold:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
.cat-fold svg{ display:block; transition:transform .25s ease; }
.category.collapsed{ align-self:start; padding-bottom:1.5rem; }
.category.collapsed > ul.items, .category.courses.collapsed .courses-actions{ display:none; }
/* 10.19 : repliée, une liste de courses garde sa saisie ; le reste de la carte la déplie */
.category.courses.collapsed .courses-foot{ cursor:auto; }
.category.collapsed .cat-fold svg{ transform:rotate(180deg); }
.category.courses.collapsed{ cursor:pointer; } /* 10.18 : toute la carte repliée se déplie d'un clic */
.category.courses .cat-head{ cursor:pointer; } /* 10.19 : ouverte, un clic sur le bandeau (hors titre) la replie */
.category.courses .cat-title{ cursor:auto; }
.cat-count{ font-family:'Courier Prime', 'Courier New', Courier, monospace; font-size:0.7rem; font-weight:700; color:var(--ink-faint); flex:none; }
@media (prefers-reduced-motion: reduce){ .cat-fold svg{ transition:none; } }
.cat-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:0.75rem;
}
.cat-title-group{
  display:flex;
  align-items:center;
  gap:0.5rem;
  flex:1;
  min-width:0;
}
.cat-head-right{
  display:flex;
  align-items:center;
  gap:0.5rem;
}
.cat-title{
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.74rem;
  font-weight:700;
  letter-spacing:0.09em;
  text-transform:uppercase;
  /* dans la couleur de la liste, un peu foncée pour rester lisible (8.36) */
  color:color-mix(in srgb, var(--cat-color, var(--accent)) 78%, var(--ink));
  cursor:text;
  border-radius:4px;
}
.cat-title:hover{
  color:var(--cat-color, var(--accent));
  background:var(--surface-2);
}
/* 10.15 : petit panier devant le titre d'une liste de courses */
.cat-basket{
  display:block; flex:none; margin-right:-0.2rem;
  color:color-mix(in srgb, var(--cat-color, var(--accent)) 78%, var(--ink));
  opacity:0.75;
}
.cat-title-input{
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.7rem;
  font-weight:600;
  letter-spacing:0.09em;
  text-transform:uppercase;
  color:var(--ink);
  background:var(--surface-2);
  border:1px solid var(--accent);
  border-radius:4px;
  padding:0.15rem 0.4rem;
  min-width:6ch;
}
.cat-title-input:focus{
  outline:2px solid var(--accent);
  outline-offset:1px;
}
/* pastilles de couleur sous le titre en cours de renommage (8.36) */
.cat-swatches{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:-0.15rem;
}
.cat-swatch{
  appearance:none;
  -webkit-appearance:none;
  width:18px;
  height:18px;
  padding:0;
  border:none;
  border-radius:5px;
  background:var(--sw);
  cursor:pointer;
  transition:transform .12s ease;
}
.cat-swatch:hover{ transform:scale(1.12); }
.cat-swatch.selected{ outline:2px solid var(--sw); outline-offset:2px; }
/* 10.2 : pastilles des personnes avec qui la liste est partagée (à côté du titre) */
.share-chips{ display:inline-flex; flex:none; }
.share-chip{
  display:inline-flex; align-items:center; justify-content:center;
  width:1.15rem; height:1.15rem;
  border-radius:50%;
  background:color-mix(in srgb, var(--cat-color, var(--accent)) 20%, var(--surface));
  color:color-mix(in srgb, var(--cat-color, var(--accent)) 75%, var(--ink));
  box-shadow:0 0 0 2px var(--surface);
  font-size:0.62rem; font-weight:700; line-height:1;
}
.share-chip + .share-chip{ margin-left:-0.3rem; }
/* 10.31 : nouveautés venues d'autres personnes */
.item{ position:relative; }
.new-tag{
  position:absolute; right:0.5rem; top:0.55rem; pointer-events:none; transition:opacity .12s ease;
  font-family:'Courier Prime', 'Courier New', Courier, monospace; font-size:0.62rem; font-weight:700; letter-spacing:0.05em; text-transform:uppercase;
  padding:0.05rem 0.4rem; border-radius:999px;
  background:color-mix(in srgb, var(--cat-color, var(--accent)) 18%, var(--surface));
  color:color-mix(in srgb, var(--cat-color, var(--accent)) 80%, var(--ink));
}
.item.is-new{ background:color-mix(in srgb, var(--cat-color, var(--accent)) 8%, var(--surface)); }   /* surlignée sur toute la largeur */
@media (hover:hover){ .item:hover .new-tag{ opacity:0; } }   /* laisse la place aux boutons de la ligne */
.item.revealed .new-tag, .item.editing .new-tag{ opacity:0; }
/* titre : le + suit le dernier mot ; le champ express reste à côté s'il
   tient en entier (12rem), sinon il passe à la ligne */
.cat-title-group{ flex-wrap:wrap; row-gap:0.4rem; }
.cat-title-line{ flex:0 1 auto; min-width:0; line-height:1.4; }
.cat-title-line .cat-title{ display:inline; }
.cat-title-line .add-btn{ display:inline-flex; vertical-align:middle; margin-left:0.45rem; margin-right:-1.7rem; position:relative; top:-1px; }
.cat-title-line:has(.add-btn){ margin-right:1.7rem; }
/* initiales des personnes, en bas à droite de la carte (à gauche du repli) */
.category > .share-chips{ position:absolute; right:2.3rem; bottom:0.35rem; }
.category.has-people{ padding-bottom:1.7rem; }
.share-more{ font-size:0.55rem; }
/* 10.2 : « Partagée avec » sous les couleurs, dans le renommage d'une liste */
.cat-share{ display:flex; flex-wrap:wrap; align-items:center; gap:0.35rem 0.5rem; margin-top:0.55rem; font-size:0.8rem; color:var(--ink-soft); }
.cat-share-label{ font-family:'Courier Prime', 'Courier New', Courier, monospace; font-size:0.66rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-faint); margin-right:0.15rem; }
.cat-share-person{
  appearance:none; display:inline-flex; align-items:center; gap:0.35rem;
  border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
  border-radius:999px; padding:0.2rem 0.6rem 0.2rem 0.35rem;
  font:inherit; font-size:0.8rem; cursor:pointer;
  transition:border-color .15s ease, background .15s ease, color .15s ease;
}
.cat-share-person .box{
  width:0.9rem; height:0.9rem; border-radius:4px; border:1.5px solid var(--ink-faint);
  display:inline-flex; align-items:center; justify-content:center; flex:none;
}
.cat-share-person .box svg{ width:0.65rem; height:0.65rem; display:none; }
.cat-share-person[aria-checked="true"]{ border-color:var(--cat-color, var(--accent)); color:var(--ink); background:color-mix(in srgb, var(--cat-color, var(--accent)) 10%, var(--surface)); }
.cat-share-person[aria-checked="true"] .box{ background:var(--cat-color, var(--accent)); border-color:var(--cat-color, var(--accent)); color:var(--surface); }
.cat-share-person[aria-checked="true"] .box svg{ display:block; }
.cat-share-person:hover{ border-color:var(--cat-color, var(--accent)); }
.cat-share-person:disabled{ opacity:.5; cursor:default; }
.cat-share-link{ appearance:none; border:0; background:none; padding:0; font:inherit; font-size:0.8rem; color:var(--accent); cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
/* 10.15 : « Convertir en liste de courses / normale », sous « Partagée avec » */
.cat-convert{ margin-top:0.4rem; font-size:0.8rem; }
.add-btn{
  appearance:none;
  border:1px solid var(--line);
  background:var(--surface-2);
  color:var(--ink-soft);
  width:20px;
  height:20px;
  border-radius:6px;
  font-size:0.86rem;
  line-height:1;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:none;
}
.add-btn:hover{
  background:var(--accent-soft);
  color:var(--accent-strong);
  border-color:var(--accent);
}
/* ajout express (7.1) : champ discret à côté du titre */
.cat-quick-wrap{ position:relative; flex:1 0 8rem; max-width:20rem; min-width:0; display:flex; align-items:center; cursor:text; }   /* 10.31 : à côté du titre s'il tient en entier, sinon à la ligne */
.cat-quick-pen{
  position:absolute; left:0.3rem; top:50%; transform:translateY(-50%);
  color:var(--ink-faint); opacity:.55; pointer-events:none;
  transition:opacity .15s ease, color .15s ease;
}
.cat-quick-wrap:hover .cat-quick-pen{ opacity:1; color:var(--ink-soft); }
.cat-quick-wrap:focus-within .cat-quick-pen{ opacity:0; }
.cat-quick{
  flex:1; min-width:4ch; width:100%;
  font-family:inherit; font-size:0.86rem; color:var(--ink);
  background:transparent; border:none; border-bottom:1px dashed transparent; border-radius:0;
  padding:0.15rem 0.2rem 0.15rem 1.4rem; margin-left:0;   /* 10.31 : place pour le crayon, sous l'invite */
  transition:border-color .15s ease;
}
.cat-quick::placeholder{ color:var(--ink-faint); opacity:.7; }
.category:hover .cat-quick{ border-bottom-color:var(--line); }
.cat-quick:focus{ outline:none; border-bottom:1px solid var(--cat-color, var(--accent)); }
/* sens d'affichage (7.1) : ▲ la plus récente en haut, ▼ en bas */
.cat-order{
  appearance:none; border:none; background:transparent; color:var(--ink-faint);
  padding:5px 6px; border-radius:6px; cursor:pointer; line-height:0;
  display:inline-flex; align-items:center;
  opacity:0.45; /* discrète (8.6) ; pleine au survol */
  transition:color .15s ease, background .15s ease, opacity .15s ease;
}
.cat-order svg{ display:block; transition:transform .25s cubic-bezier(.34,1.56,.64,1); }
.cat-order.reversed svg{ transform:rotate(180deg); }
.cat-order:hover{ background:var(--surface-2); color:var(--ink-soft); opacity:1; }
.cat-order.reversed{ color:var(--cat-color, var(--accent)); }
.cat-grip{
  display:flex;
  align-items:center;
  padding:4px 3px;
  border-radius:6px;
  color:var(--ink-faint);
  opacity:0.5;
  cursor:grab;
  touch-action:none;
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
  transition:opacity .15s ease, background .15s ease, color .15s ease;
}
.category:hover .cat-grip{ opacity:1; }
.cat-grip:hover{ background:var(--surface-2); color:var(--ink-soft); }
/* Volontairement distincte du × discret d'une tâche (.delete-btn) : cette
   croix supprime toute une case, pas une simple ligne — elle doit se voir
   sans avoir à survoler la carte, et ne pas se confondre avec le langage
   visuel réservé aux tâches. */
.cat-delete-btn{
  appearance:none;
  border:1px solid var(--line);
  background:var(--surface-2);
  color:var(--ink-soft);
  width:22px;
  height:22px;
  border-radius:6px;
  font-size:0.95rem;
  line-height:1;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:none;
}
.cat-delete-btn:hover{
  background:var(--urgent-soft);
  color:var(--urgent-ink);
  border-color:var(--urgent);
}
.add-category-row{
  margin-top:0.85rem;
  display:flex;
  justify-content:center;
}
.add-category-btn{
  appearance:none;
  border:1px dashed var(--line);
  background:var(--surface); /* fond blanc, pointillés gardés (9.0) */
  color:var(--ink-faint);
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.7rem;
  font-weight:600;
  letter-spacing:0.04em;
  text-transform:uppercase;
  padding:0.5rem 1rem;
  border-radius:999px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:0.4rem;
}
.add-category-btn:hover{
  color:var(--accent-strong);
  border-color:var(--accent);
  background:var(--accent-soft);
}

/* ---------- tâches ---------- */
ul.items{
  list-style:none;
  margin:0;
  padding:0;
  display:flex;
  flex-direction:column;
  gap:0.15rem;
}
.item{
  display:flex;
  align-items:flex-start;
  gap:0.65rem;
  padding:0.42rem 0.3rem;
  border-radius:8px;
  cursor:pointer;
}
.item:hover{background:var(--surface-2);}
/* dévoilés au survol de la souris ou au focus clavier ; au toucher, par la
   classe « revealed » (8.39, voir la section des écrans tactiles) */
@media (hover:hover){ .item:hover .item-controls{opacity:1;} }
.item:has(:focus-visible) .item-controls{opacity:1;}
.item .drag-handle{ opacity:0; transition:opacity .15s ease; }
.item:hover .drag-handle{ opacity:1; }
.item.dragging{opacity:0.4;}
.item-text{
  flex:1;
  font-size:0.95rem;
  line-height:1.4;
  color:var(--ink);
  cursor:text;
}
.item-text .note{
  display:block;
  font-size:0.86rem;
  color:var(--ink-soft);
  padding-top:0.15rem;
  line-height:1.4;
}
/* détail replié (8.31) : la rangée de la grille passe de 0 à la hauteur du
   texte, ce qui anime le dépliage sans connaître cette hauteur */
.note-fold{
  display:grid;
  grid-template-rows:0fr;
  transition:grid-template-rows .24s cubic-bezier(0.22, 1, 0.36, 1);
}
.note-fold > *{ overflow:hidden; min-height:0; }
.note-open .note-fold{ grid-template-rows:1fr; }
/* le sigle qui signale un détail, à côté du titre */
.note-toggle{
  appearance:none;
  -webkit-appearance:none;
  border:none;
  background:transparent;
  display:inline-flex;
  align-items:center;
  vertical-align:-2px;
  margin-left:0.35rem;
  padding:1px 4px;
  border-radius:5px;
  color:var(--ink-faint);
  cursor:pointer;
  transition:color .15s ease, background .15s ease;
}
.note-toggle svg{ display:block; }
.note-tail{ white-space:nowrap; } /* dernier mot + sigle (8.39) */
.item[data-note-key], .note-toggle{ -webkit-tap-highlight-color:transparent; }
.note-toggle:hover{ color:var(--ink-soft); }
.note-open .note-toggle{ color:var(--accent-strong); background:var(--accent-soft); }
.item.is-checked .note-toggle{ opacity:0.6; }
.item input[type="checkbox"]{
  appearance:none;
  -webkit-appearance:none;
  width:18px;
  height:18px;
  flex:none;
  margin-top:0.15rem;
  border:1.5px solid var(--ink-faint);
  border-radius:5px;
  cursor:pointer;
  position:relative;
  background:var(--surface);
  transition:background .15s ease, border-color .15s ease;
}
.item input[type="checkbox"]:checked{
  background:var(--accent);
  border-color:var(--accent);
}
.item input[type="checkbox"]:checked::after{
  content:"";
  position:absolute;
  left:5px; top:1.5px;
  width:5px; height:9px;
  border:solid white;
  border-width:0 2px 2px 0;
  transform:rotate(40deg);
}
.item.is-checked .item-text{
  color:var(--ink-faint);
  text-decoration:line-through;
  text-decoration-color:var(--ink-faint);
  text-decoration-thickness:1px;
}
/* .who-tag et .person-tag sont en inline-block (badges à fond coloré) : un
   inline-block n'hérite jamais du trait barré de son parent (spec CSS), donc
   sans cette règle explicite la tâche a l'air "pas tout à fait finie" une
   fois cochée. On barre le badge lui-même, avec sa propre couleur. */
.item.is-checked .item-text .who-tag,
.item.is-checked .item-text .person-tag{
  text-decoration:line-through;
  text-decoration-color:currentColor;
  text-decoration-thickness:1px;
}
/* Petite animation de "coup de crayon" au moment où on coche une tâche :
   le trait se dessine de gauche à droite au lieu d'apparaître d'un coup.
   Ne joue qu'une fois, sur l'élément qui vient d'être coché (voir
   justCheckedKey en JS) — les autres re-rendus retombent sur le simple
   text-decoration ci-dessus. */
.item.just-checked.is-checked .item-text .item-title,
.item.just-checked.is-checked .item-text .who-tag,
.item.just-checked.is-checked .item-text .person-tag{
  text-decoration:none;
  background-image:linear-gradient(currentColor, currentColor);
  background-repeat:no-repeat;
  background-position:left center;
  background-size:0% 2px;
  animation:item-strike 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
.item.just-checked.is-checked .item-text .who-tag,
.item.just-checked.is-checked .item-text .person-tag{
  animation-delay:0.12s;
}
.item.just-checked.is-checked .item-text{
  animation:item-fade-in 0.4s ease forwards;
}
/* tâche urgente (marquée, ou échéance proche) */
.item.item-urgent .item-text{
  color:var(--urgent-ink);
  font-weight:600;
}
.item.item-urgent .item-text .note{ font-weight:400; }
.item.item-urgent.is-checked .item-text{
  color:var(--ink-faint);
  font-weight:400;
  text-decoration:line-through;
}
/* boutons d'une ligne : en cours, urgent, effacer */
.item-controls{
  display:flex;
  flex-direction:row;
  align-items:center;
  gap:2px;
  flex:none;
  opacity:0;               /* au repos : rien ; elles apparaissent au survol de la ligne (8.12) */
  transition:opacity .15s ease;
}
.waiting-btn{
  appearance:none;
  border:none;
  background:transparent;
  color:var(--ink-faint);
  font-size:0.95rem;
  line-height:1;
  padding:4px 6px;
  cursor:pointer;
  border-radius:4px;
}
.waiting-btn:hover{   /* 10.31 : aux couleurs de la case « En cours » (avant : bleu --accent) */
  background:var(--wait-soft);
  color:color-mix(in srgb, var(--wait) 75%, var(--ink));
}
#waitingSection .waiting-btn:hover{ background:color-mix(in srgb, var(--wait) 18%, var(--wait-soft)); }   /* sinon invisible sur le fond de la case */
.waiting-btn.active{
  color:var(--accent-strong);
}
.waiting-btn svg{ display:block; }
.urgent-btn, .delete-btn{
  appearance:none;
  border:none;
  background:transparent;
  color:var(--ink-faint);
  font-size:0.86rem;
  line-height:1;
  padding:4px 6px;
  cursor:pointer;
  border-radius:4px;
}
.delete-btn{ font-size:0.95rem; }
/* 10.2 : à la place de l'effacement, dans une liste partagée (tâche d'un autre) */
.delete-spacer{ display:block; flex:none; width:26px; height:1px; }
.urgent-btn svg, .delete-btn svg{ display:block; }
.urgent-btn svg{ transition:transform .3s cubic-bezier(.34,1.4,.64,1); transform-origin:50% 60%; }
/* 10.31 : survol du triangle — jaune orangé (--lucky-gold), il se remplit
   légèrement et grossit un peu, comme une alerte qui s'allume */
.urgent-btn:not(.active):hover{
  background:color-mix(in srgb, var(--lucky-gold) 22%, transparent);
  color:color-mix(in srgb, var(--lucky-gold) 55%, var(--late));   /* jaune orangé : or tiré vers la terre cuite */
}
.urgent-btn:hover svg{ transform:scale(1.18); }
/* même petit zoom sur la flèche « En cours » et la croix (ou la corbeille) */
.waiting-btn svg, .delete-btn svg, .delete-btn .x{ transition:transform .3s cubic-bezier(.34,1.4,.64,1); }
.delete-btn .x{ display:inline-block; }
.waiting-btn:hover svg, .delete-btn:hover svg, .delete-btn:hover .x{ transform:scale(1.18); }
.urgent-btn:not(.active):hover svg .tri{ fill:color-mix(in srgb, var(--lucky-gold) 60%, transparent); }
.urgent-btn.auto:hover svg{ transform:none; }
@media (prefers-reduced-motion:reduce){ .urgent-btn svg, .waiting-btn svg, .delete-btn svg, .delete-btn .x{ transition:none; } .urgent-btn:hover svg, .waiting-btn:hover svg, .delete-btn:hover svg, .delete-btn:hover .x{ transform:none; } }
.delete-btn:hover{   /* 10.31 : le bleu qu'avait la flèche « En cours » (avant : améthyste) */
  background:var(--accent-soft);
  color:var(--accent-strong);
}
.urgent-btn.active{
  background:var(--urgent-soft);
  color:var(--urgent-ink);
  font-weight:700;
}
.urgent-btn.active svg .tri{ fill:color-mix(in srgb, currentColor 20%, transparent); }
/* Une tâche cochée est faite : plus de sens à la marquer urgente ni « en cours ». Les boutons
   sont masqués mais gardent leur place, pour que les icônes ne bougent pas. */
.item.is-checked .urgent-btn,
.item.is-checked .waiting-btn{ visibility:hidden; pointer-events:none; }
.drag-handle{
  flex:none;
  align-self:stretch;
  display:flex;
  align-items:center;
  color:var(--ink-faint);
  font-size:0.86rem;
  letter-spacing:-2px;
  cursor:grab;
  padding:0 6px 0 2px;
  touch-action:none;
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
}
.drag-handle:active{cursor:grabbing;}
/* œuf « en couvaison » : grisé, pas de case à cocher, juste l'éclosion */
.item.is-egg .item-text{ opacity:0.45; }
.item.is-egg:hover .item-text{ opacity:0.7; }
.item.is-egg .waiting-btn{ visibility:hidden; pointer-events:none; }
.egg-dot{
  width:18px;
  height:18px;
  flex:none;
  margin:0.15rem 3px 0 4px; /* mêmes marges que la case à cocher, pour l'alignement */
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--ink-faint);
  opacity:0.8;
}
.egg-dot svg{ display:block; flex:none; }
/* 10.15 : article d'une liste de courses — rond creux à la place de la case ;
   toute la ligne raye / dé-raye. 10.16 : 14 px au lieu de 18 ; 10.17 : 11 px,
   toujours centré dans la place de la case (18 px) pour que le texte reste
   aligné */
.strike-dot{
  appearance:none;
  -webkit-appearance:none;
  width:11px;
  height:11px;
  flex:none;
  margin:calc(0.15rem + 3.5px) 6.5px 3.5px 11.5px; /* 10.18 : +4 px à gauche, de l'air après la marge */
  padding:0;
  border:1.5px solid var(--ink-faint);
  border-radius:50%;
  background:var(--surface);
  cursor:pointer;
  transition:border-color .15s ease;
}
.strike-dot:hover{ border-color:var(--cat-color, var(--accent)); }
.strike-dot:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.item.is-checked .strike-dot{ border-color:var(--line); }
/* 10.17 : chaque article posé sur une ligne de cahier */
.courses-item{ border-radius:0; border-bottom:1px solid var(--paper-rule); padding:0.76rem 0.3rem 0; } /* 10.18 : texte posé sur sa ligne (plus d'air au-dessus, moins en dessous) */
.courses-item:hover{ background:color-mix(in srgb, var(--paper-rule) 30%, transparent); } /* voile léger : la marge rouge reste visible */
.courses-item .item-text{ cursor:pointer; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
/* quantité : après le nom (en ligne, pour être barrée avec lui) ; 10.17 : à
   l'encre rose (le rouge reste aux urgences), bien visible, plus de badge gris */
.courses-qty{
  margin-left:0.45rem;
  font-size:0.86rem; font-weight:700; color:var(--qty-ink);
  white-space:nowrap;
}
.item.is-checked .courses-qty{ color:var(--ink-faint); }
.courses-edit-btn{
  appearance:none; border:none; background:transparent; color:var(--ink-faint);
  line-height:1; padding:4px 6px; cursor:pointer; border-radius:4px;
}
.courses-edit-btn svg{ display:block; }
.courses-edit-btn:hover{ background:var(--surface-2); color:var(--ink-soft); }
/* modifier un article : nom, puis quantité avec − / + */
.courses-item.editing{ align-items:center; }
.courses-item.editing .drag-handle, .courses-item.editing .strike-dot{ visibility:hidden; }
.courses-edit{ flex:1; min-width:0; display:flex; flex-wrap:wrap; align-items:center; gap:0.4rem; } /* 10.19 : le détail passe dessous */
.courses-edit input{
  font-family:inherit; font-size:0.95rem; line-height:1.4; color:var(--ink);
  background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
  padding:0.3rem 0.5rem; min-width:0;
}
.courses-edit input:focus{ outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent); }
.courses-edit-name{ flex:1 1 0; width:0; } /* largeur prise sur la ligne, jamais au-delà (téléphone) */
.courses-qty-edit{ flex:none; display:flex; align-items:center; gap:2px; }
.courses-edit .courses-edit-qty{ width:3.4rem; text-align:center; padding-left:0.25rem; padding-right:0.25rem; }
.courses-edit .courses-edit-note{ flex:1 0 100%; font-size:0.86rem; } /* 10.19 : détail, comme dans les autres listes */
.qty-step{
  appearance:none; flex:none; width:26px; height:26px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
  border-radius:6px; font-size:0.95rem; line-height:1; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center;
}
.qty-step:hover{ background:var(--accent-soft); color:var(--accent-strong); border-color:var(--accent); }
/* bas de la carte : saisie (alignée sur les articles), puis Trier / Vider les rayés */
.courses-foot{ flex:none; display:flex; flex-direction:column; gap:0.55rem; }
.courses-add{ display:flex; align-items:flex-start; gap:0.65rem; padding:0 0.3rem; }
.courses-add .drag-handle{ visibility:hidden; }
.courses-plus{
  width:18px; height:18px; flex:none;
  margin:0.15rem 3px 0 8px; /* 10.18 : +4 px, comme le rond */
  display:flex; align-items:center; justify-content:center;
  color:var(--ink-faint); font-size:1.05rem; line-height:1;
}
.courses-field{ position:relative; flex:1; min-width:0; display:flex; }
.courses-input{
  flex:1; width:100%; margin:0;
  resize:none; overflow:hidden;
  font-family:inherit; font-size:0.95rem; line-height:1.4; color:var(--ink);
  background:transparent;
  border:none; border-bottom:1px dashed var(--line); border-radius:0;
  padding:0 0.1rem 0.15rem;
  transition:border-color .15s ease;
}
.courses-input::placeholder{ color:var(--ink-faint); opacity:.8; }
.courses-input:focus{ outline:none; border-bottom:1px solid var(--cat-color, var(--accent)); }
.courses-suggest{
  position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:30;
  display:flex; flex-direction:column;
  padding:4px;
  background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow);
}
.courses-suggest[hidden]{ display:none; }
.courses-sugg{
  appearance:none; border:0; background:transparent;
  display:flex; align-items:baseline; justify-content:space-between; gap:0.5rem;
  text-align:left; font:inherit; font-size:0.92rem; color:var(--ink);
  padding:0.4rem 0.55rem; border-radius:7px; cursor:pointer;
}
.courses-sugg:hover, .courses-sugg.active{ background:var(--surface-2); }
.courses-sugg-note{
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.62rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-faint);
}
.courses-actions{ display:flex; flex-wrap:wrap; gap:0.4rem; margin-top:0.55rem; padding:0 2rem 0 4.37rem; } /* à droite : la flèche du volet ; à gauche (10.17) : sous le texte des articles */
.courses-btn{
  appearance:none;
  border:1px solid var(--line);
  background:var(--surface-2);
  color:var(--ink-soft);
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.68rem;
  font-weight:700;
  letter-spacing:0.06em;
  text-transform:uppercase;
  min-height:26px;
  padding:0.25rem 0.75rem;
  border-radius:999px;
  cursor:pointer;
  transition:background .12s ease, border-color .12s ease, color .12s ease, opacity .12s ease;
}
.courses-btn:not(:disabled):hover{ color:var(--accent-strong); border-color:var(--accent); background:var(--accent-soft); }
.courses-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
.courses-btn:disabled{ opacity:.45; cursor:default; }
.hatch-btn{
  appearance:none;
  border:none;
  background:transparent;
  color:var(--ink-faint);
  line-height:1;
  padding:2px 4px;
  cursor:pointer;
  border-radius:4px;
  transition:background .12s ease, color .12s ease;
}
.hatch-btn svg{ display:block; }
.hatch-btn:hover{ background:var(--surface-2); color:#8A7A4E; }
.hatch-btn:hover .chick{ fill:#F4D35E; stroke:#B8901F; }
.hatch-btn:hover .beak{ stroke:#D9822B; }
.hatch-btn:hover .shell{ fill:var(--eggshell); }
/* 10.2 : initiale de qui a coché, dans une liste partagée */
.checker-tag{
  display:inline-flex; align-items:center; justify-content:center;
  width:1.2rem; height:1.2rem; margin-right:0.45rem; vertical-align:middle;
  border-radius:50%;
  background:color-mix(in srgb, var(--cat-color, var(--accent)) 18%, var(--surface));
  color:color-mix(in srgb, var(--cat-color, var(--accent)) 70%, var(--ink));
  font-size:0.66rem; font-weight:700; line-height:1;
  text-decoration:none;
}
/* badges : interlocuteur, personne (anciennes données), échéance */
.who-tag{
  display:inline-block;
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.7rem;
  font-weight:600;
  letter-spacing:0.04em;
  text-transform:uppercase;
  color:var(--ink-soft);
  background:var(--surface-2);
  border:1px solid var(--line);
  padding:0.1rem 0.45rem;
  border-radius:999px;
  margin-right:0.5rem;
  vertical-align:middle;
}
.person-tag{
  display:inline-block;
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.7rem;
  font-weight:600;
  letter-spacing:0.04em;
  text-transform:uppercase;
  color:var(--accent-strong);
  background:var(--accent-soft);
  padding:0.1rem 0.45rem;
  border-radius:999px;
  margin-right:0.45rem;
  vertical-align:middle;
}
.person-tag.tier-urgent{color:var(--urgent-ink); background:var(--urgent-soft);}
.person-tag.tier-normal{color:var(--accent-strong); background:var(--accent-soft);}
.person-tag.tier-later{color:var(--ink-faint); background:var(--surface-2);}
.due-badge{
  display:inline-block;
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.7rem;
  font-weight:600;
  letter-spacing:0.02em;
  padding:0.05rem 0.42rem;
  border-radius:999px;
  margin-left:0.45rem;
  vertical-align:middle;
  white-space:nowrap;
}
.due-badge.status-overdue, .due-badge.status-today{
  background:var(--urgent-soft);
  color:var(--urgent-ink);
}
.due-badge.status-overdue{ background:var(--late-soft); color:var(--late); }   /* 10.25 : le retard en terre cuite */
/* deux familles seulement (8.14) : rouge pour ce qui presse (ci-dessus, et
   la relance), simple contour gris pour le reste */
.due-badge.status-tomorrow,
.due-badge.status-future,
.due-badge.status-rdv{
  background:transparent;
  color:var(--ink-soft);
  border:1px solid var(--line);
}
.due-badge.status-relance{ background:var(--urgent-soft); color:var(--urgent-ink); }   /* 10.23 : comme « En retard » */
.empty-note{
  font-size:0.86rem;
  color:var(--ink-faint);
  padding:0.4rem;
}

/* ---------- formulaires (modifier, ajouter, nouvelle liste) ---------- */
.edit-form{
  display:flex;
  flex-direction:column;
  gap:0.4rem;
  width:100%;
  padding:0.3rem 0.2rem;
}
.edit-form input[type="text"], .edit-form textarea{
  font-family:inherit;
  font-size:0.95rem;
  line-height:1.4;
  resize:none;
  padding:0.45rem 0.6rem;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--surface-2);
  color:var(--ink);
}
.edit-form select.edit-cat{
  font-family:inherit;
  font-size:0.95rem;
  padding:0.45rem 0.6rem;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--surface-2);
  color:var(--ink);
  width:100%;
}
/* champs : bleu au survol, bleu qui reste une fois cliqué (7.26) */
.edit-form input, .edit-form select, .edit-form textarea{ transition:border-color .15s ease, opacity .15s ease; }
.edit-form input:not(:disabled):hover, .edit-form select:hover, .edit-form textarea:hover{ border-color:var(--accent); }
.edit-form input:focus, .edit-form input[type="text"]:focus, .edit-form select:focus, .edit-form textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent); }
.edit-form input:disabled{ opacity:.4; cursor:not-allowed; }
.edit-label{
  display:flex;
  flex-direction:column;
  gap:0.25rem;
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.7rem;
  font-weight:600;
  letter-spacing:0.05em;
  text-transform:uppercase;
  color:var(--ink-soft);
}
.edit-label:has(input:disabled){ color:var(--ink-faint); }
.edit-label-row{
  display:flex;
  gap:0.5rem;
}
.edit-label-row .edit-label{flex:1;}
.edit-label-row .edit-label-cat{flex:1.4;}
.edit-label-row .edit-label-who{flex:1;}
.edit-label input[type="date"],
.edit-label input[type="time"]{
  font-family:'Public Sans', system-ui, sans-serif;
  text-transform:none;
  letter-spacing:normal;
  font-size:0.86rem;
  padding:0.4rem 0.55rem;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--surface-2);
  color:var(--ink);
}
.edit-clear-due{
  align-self:flex-end;
  flex:none;
  appearance:none;
  border:1px solid var(--line);
  background:var(--surface-2);
  color:var(--ink-faint);
  width:2.15rem;
  height:2.15rem;
  border-radius:8px;
  font-size:0.95rem;
  line-height:1;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.edit-clear-due:hover{
  background:var(--urgent-soft);
  color:var(--urgent-ink);
  border-color:var(--urgent);
}
.edit-actions{
  display:flex;
  gap:0.5rem;
}
.edit-actions button{
  font-size:0.86rem;
  font-weight:600;
  padding:0.4rem 0.8rem;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink-soft);
  cursor:pointer;
}
.edit-actions .edit-save,
.edit-actions .add-save,
.edit-actions .edit-cancel,
.edit-actions .add-cancel{ transition:background .12s ease, border-color .12s ease, color .12s ease; }
.edit-actions .edit-save:hover,
.edit-actions .add-save:hover{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}
.edit-actions .edit-cancel:hover,
.edit-actions .add-cancel:hover{
  background:var(--surface-2);
  border-color:var(--ink-faint);
  color:var(--ink);
}
/* œuf et triangle à gauche ; Annuler puis le bouton qui valide, à droite (8.33) */
.edit-actions .edit-egg,
.edit-actions .edit-urgent{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0.35rem 0.5rem;
  border-color:transparent;
  background:transparent;
  color:var(--ink-faint);
  transition:color .12s ease, background .12s ease;
}
.edit-actions .edit-cancel,
.edit-actions .add-cancel{ margin-left:auto; }
.edit-actions .edit-egg::after,
.edit-actions .edit-urgent::after{ right:auto; left:0; } /* infobulle vers la droite */
.edit-actions .edit-egg .speck{ opacity:0.7; transition:opacity .12s ease; }
.edit-actions .edit-egg:hover,
.edit-actions .edit-urgent:hover{ background:var(--surface-2); color:var(--ink-soft); }
.edit-actions .edit-egg.active{ background:var(--eggshell); color:#8A7A4E; }
.edit-actions .edit-egg.active .egg{ fill:color-mix(in srgb, #E9DDB5 70%, transparent); }
.edit-actions .edit-egg.active .speck{ opacity:1; }
.edit-actions .edit-egg.active:hover{ background:color-mix(in srgb, #E9DDB5 45%, var(--surface)); }
.edit-actions .edit-urgent.active{
  background:var(--urgent-soft);
  color:var(--urgent-ink);
}
.edit-actions .edit-urgent.active:hover{ background:color-mix(in srgb, var(--urgent) 22%, var(--surface)); color:var(--urgent-ink); }
.edit-actions .edit-urgent.active svg .tri{ fill:color-mix(in srgb, currentColor 20%, transparent); }
.item.editing{cursor:default;}
.item.editing:hover{background:transparent;}
.add-form-row{cursor:default;}
.add-form-row:hover{background:transparent;}
/* un formulaire ouvert : tout le reste s'estompe */
.progress-card, .urgent-banner, .lucky-line, .category, .section-block, footer, .add-category-row{
  transition:opacity .2s ease, filter .2s ease;
}
body.has-editing .progress-card,
body.has-editing .urgent-banner,
body.has-editing .lucky-line,
body.has-editing .category,
body.has-editing .section-block,
body.has-editing footer,
body.has-editing .add-category-row{
  opacity:0.32;
  filter:grayscale(0.7);
  pointer-events:none;
}
body.has-editing .category:has(.item.editing),
body.has-editing .section-block:has(.item.editing),
body.has-editing .category:has(.add-form-row),
body.has-editing .category:has(.cat-title-input),
body.has-editing .add-category-row.active{
  opacity:1;
  filter:none;
  pointer-events:auto;
}
body.has-editing .category:has(.item.editing) ul.items > li.item:not(.editing),
body.has-editing .category:has(.add-form-row) ul.items > li.item:not(.add-form-row),
body.has-editing .section-block:has(.item.editing) ul.items > li.item:not(.editing),
body.has-editing .category:has(.cat-title-input) > *:not(.cat-head):not(.cat-swatches):not(.cat-share):not(.cat-convert),   /* 10.21 : « Convertir » reste cliquable */
body.has-editing .category:has(.cat-title-input) .cat-head .add-btn,
body.has-editing .category:has(.cat-title-input) .cat-head-right{
  opacity:0.32;
  filter:grayscale(0.7);
  pointer-events:none;
  transition:opacity .2s ease, filter .2s ease;
}

/* ---------- « En cours » et autres grandes cases ---------- */
.section-block{
  margin-top:2.25rem;
  background:var(--wait-soft);
  border-radius:16px;
  padding:1.4rem 1.5rem 1.6rem;
  box-shadow:var(--shadow);
}
.section-title{
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.74rem;
  font-weight:600;
  letter-spacing:0.09em;
  text-transform:uppercase;
  color:var(--ink-soft);
  margin:0 0 1.1rem;
}
#waitingList .empty-note{ color:color-mix(in srgb, var(--ink-faint) 72%, var(--wait-soft)); }
/* choix de la relance (7.3) */
.relance-pop{
  position:absolute; z-index:80; width:min(270px, calc(100vw - 32px));
  background:var(--wait-soft); border:1px solid color-mix(in srgb, var(--wait) 35%, var(--line)); border-radius:12px;
  box-shadow:0 2px 6px rgba(30,40,45,0.06), 0 18px 36px -14px rgba(30,40,45,0.35);
  padding:0.7rem 0.75rem 0.75rem; font-family:'Public Sans', system-ui, sans-serif;
  animation:rp-in .14s ease;
}
.rp-title{ font-family:'Courier Prime', 'Courier New', Courier, monospace; font-size:0.7rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:color-mix(in srgb, var(--wait) 65%, var(--ink)); margin:0 0 0.55rem; }
.rp-opts{ display:flex; flex-wrap:wrap; gap:0.35rem; }
.rp-opts button, .rp-ok{
  appearance:none; border:1px solid color-mix(in srgb, var(--wait) 30%, var(--line)); background:var(--surface); color:var(--ink);
  font-family:inherit; font-size:0.86rem; padding:0.3rem 0.65rem; border-radius:999px; cursor:pointer;
  transition:background .12s ease, border-color .12s ease, color .12s ease;
}
.rp-opts button:hover, .rp-ok:hover{ background:var(--wait); border-color:var(--wait); color:var(--surface); }
.rp-opts .rp-none{ color:var(--ink-soft); }
.rp-skip{
  display:block; width:100%; margin:0 0 0.7rem;
  appearance:none; border:1px solid color-mix(in srgb, var(--wait) 30%, var(--line)); background:var(--surface); color:var(--ink);
  font-family:inherit; font-size:0.86rem; font-weight:600; padding:0.4rem 0.65rem; border-radius:999px; cursor:pointer;
  transition:background .12s ease, border-color .12s ease, color .12s ease;
}
.rp-skip:hover{ background:var(--wait); border-color:var(--wait); color:var(--surface); }
.rp-date{ display:flex; gap:0.4rem; margin-top:0.55rem; }
.rp-date input{ flex:1; min-width:0; font-family:inherit; font-size:0.86rem; padding:0.3rem 0.5rem; border:1px solid color-mix(in srgb, var(--wait) 30%, var(--line)); border-radius:8px; background:var(--surface); color:var(--ink); }
/* 10.1 : fenêtre de la plume (connexion), même forme, aux couleurs de l'accent */
.sync-pop{ width:min(290px, calc(100vw - 32px)); background:var(--surface); border-color:color-mix(in srgb, var(--accent) 30%, var(--line)); }
.sync-pop .rp-title{ color:var(--accent); }
.sync-pop .rp-opts button:hover{ background:var(--accent); border-color:var(--accent); }
.sp-google{
  display:block; width:100%; appearance:none; cursor:pointer; font-family:inherit; font-size:0.86rem; font-weight:600;
  padding:0.45rem 0.65rem; border-radius:999px; border:1px solid color-mix(in srgb, var(--accent) 30%, var(--line));
  background:var(--surface); color:var(--ink); transition:background .12s ease, color .12s ease;
}
.sp-google:hover{ background:var(--accent); color:var(--surface); }
.sp-or{ text-align:center; font-family:'Courier Prime', 'Courier New', Courier, monospace; font-size:0.7rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-faint); margin:0.5rem 0; }
.sp-email, .sp-pw{
  display:block; width:100%; margin:0 0 0.4rem; font-family:inherit; font-size:0.86rem; padding:0.35rem 0.55rem;
  border:1px solid color-mix(in srgb, var(--accent) 25%, var(--line)); border-radius:8px; background:var(--surface); color:var(--ink);
}
.sp-email:focus, .sp-pw:focus{ outline:none; border-color:var(--accent); }
/* 10.26 : 16 px sur tactile, sinon Safari iOS zoome au toucher du champ */
@media (pointer:coarse){ .sp-email, .sp-pw, .rp-date input{ font-size:16px; } }
.sp-hint{ font-size:0.8rem; color:var(--ink-soft); margin:-0.15rem 0 0.45rem; }
.sp-hint:empty{ display:none; }
.sp-hint button, .sp-confirm .sp-fix{ appearance:none; border:0; background:none; padding:0; font:inherit; font-weight:600; color:var(--accent); cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
.sp-confirm{ margin-top:0.55rem; padding:0.55rem 0.6rem; border:1px solid color-mix(in srgb, var(--accent) 30%, var(--line)); border-radius:10px; font-size:0.8rem; color:var(--ink-soft); text-align:center; }
.sp-confirm[hidden]{ display:none; }
.sp-confirm .sp-addr{ display:block; margin:0.25rem 0 0.5rem; font-size:1rem; font-weight:600; color:var(--ink); word-break:break-all; }
.sp-confirm .rp-opts{ display:grid; grid-template-columns:1fr 1fr; }
.sp-confirm .rp-opts button{ text-align:center; padding-inline:0.3rem; font-size:0.82rem; }
.sp-forgot{ appearance:none; border:0; background:none; padding:0; margin-top:0.55rem; font-family:inherit; font-size:0.78rem; color:var(--ink-soft); cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
.sync-pop .rp-title{ text-align:center; }
.sync-pop .rp-opts:has(.sp-login){ display:grid; grid-template-columns:1fr 1fr; }
.sync-pop .rp-opts:has(.sp-login) button{ text-align:center; white-space:nowrap; padding-inline:0.3rem; font-size:0.82rem; }
.sync-pop .sp-forgot{ display:block; margin-inline:auto; }
body.cloud #exportBtn, body.cloud #importBtn{ display:none; }
.backup-nudge.as-link{ cursor:pointer; color:var(--accent); text-decoration:underline; text-decoration-color:color-mix(in srgb, var(--accent) 40%, transparent); text-underline-offset:3px; }
.backup-nudge.as-link:hover{ text-decoration-color:currentColor; }
.sp-backup{ display:flex; justify-content:center; align-items:center; gap:0.4rem; margin-top:0.7rem; padding-top:0.55rem; border-top:1px solid var(--line); font-size:0.74rem; color:var(--ink-faint); }
.sp-backup button{ appearance:none; border:0; background:none; padding:0; font:inherit; color:var(--ink-soft); cursor:pointer; text-decoration:underline; text-underline-offset:3px; text-decoration-color:color-mix(in srgb, currentColor 35%, transparent); }
.sp-backup button:hover{ color:var(--accent); text-decoration-color:currentColor; }
.sp-msg{ font-size:0.8rem; color:var(--urgent-ink); margin-top:0.45rem; }
.sp-msg:empty{ display:none; }
.sp-who{ font-size:0.9rem; font-weight:600; color:var(--ink); margin:-0.2rem 0 0.25rem; word-break:break-all; }
.sp-state{ font-size:0.8rem; color:var(--ink-soft); margin:0 0 0.6rem; }
/* 10.9 : diagnostic de synchro, discret, sous « Se déconnecter » */
.sp-diag{ font-family:'Courier Prime', 'Courier New', Courier, monospace; font-size:0.66rem; line-height:1.35; color:var(--ink-faint); margin-top:0.6rem; word-break:break-word; }

/* ---------- petit message flottant ---------- */
#toast{
  position:fixed;
  left:50%;
  bottom:1.75rem;
  transform:translate(-50%, 12px);
  background:var(--ink);
  color:var(--bg);
  padding:0.7rem 1.15rem;
  border-radius:999px;
  font-size:0.86rem;
  font-weight:500;
  box-shadow:0 12px 32px -8px rgba(0,0,0,0.35);
  opacity:0;
  pointer-events:none;
  transition:opacity .3s ease, transform .3s ease;
  white-space:nowrap;
  z-index:20;
}
#toast.show{
  opacity:1;
  transform:translate(-50%, 0);
}
#toast.milestone{
  background:var(--accent-strong);
  color:var(--surface);
  font-weight:700;
  padding:0.85rem 1.4rem;
  font-size:0.95rem;
}

/* ---------- bas de page : corbeille, sauvegardes, version ---------- */
footer{
  margin-top:2.5rem;
  padding-top:1.25rem;
  border-top:1px solid var(--line);
  font-size:0.86rem;
  color:var(--ink-faint);
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:1rem;
  flex-wrap:wrap;
}
.backup-bar{
  display:flex;
  gap:0.5rem;
  flex-wrap:wrap;
  align-items:center;
}
/* rappel de sauvegarde (7.43) */
.backup-nudge{ font-family:'Public Sans', system-ui, sans-serif; font-size:0.8rem; color:var(--relance); margin-right:0.35rem; }
/* boutons du bas : même forme ; seule « Sauvegarder » est en couleur */
.trash-link, .backup-btn{
  --btn:var(--btn-ink);
  appearance:none;
  display:inline-flex;
  align-items:center;
  gap:0.5rem;
  padding:0.5rem 0.95rem;
  border:none;
  border-radius:999px;
  /* fond blanc (8.41) ; liseré pour Corbeille seulement (8.42) ;
     Sauvegarder garde sa teinte, plus bas */
  background:var(--surface);
  color:var(--btn);
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.7rem;
  font-weight:600;
  letter-spacing:0.08em;
  text-transform:uppercase;
  cursor:pointer;
  transition:background .15s ease, color .15s ease, transform .15s ease;
}
.backup-btn-primary{ --btn:var(--accent); background:color-mix(in srgb, var(--accent) 15%, var(--surface)); }
.trash-link:hover, .trash-link.open, .backup-btn:hover{ background:var(--btn); color:var(--surface); transform:translateY(-1px); }
.backup-btn svg{ width:14px; height:14px; display:block; }
/* 9.0 : Restaurer aussi large que Sauvegarder — « restaurer » a deux lettres
   de moins ; police à chasse fixe, donc une lettre (1ch + espacement) de
   marge en plus de chaque côté */
#importBtn{ padding-inline:calc(0.95rem + 1ch + 0.08em); }
.trash-link{ margin-right:auto; box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--btn) 28%, transparent); }
/* 10.2 : Partage juste à droite de Corbeille, c'est lui qui pousse le reste à droite */
footer:has(#shareLink:not([hidden])) #trashLink{ margin-right:0; }
/* 10.5-10.6 : Partage en jaune citron clair au survol (texte foncé dans les deux thèmes) ;
   Restaurer reprend le survol bleu de Sauvegarder */
.share-link:hover, .share-link.open{ background:var(--share-hover); color:#2A2725; box-shadow:inset 0 0 0 1px var(--share-hover); }
#importBtn:hover{ background:var(--accent); color:var(--surface); }
.share-link svg{ width:16px; height:16px; display:block; flex:none; }
.trash-link svg{ width:15px; height:15px; display:block; flex:none; transition:transform .25s cubic-bezier(.34,1.56,.64,1); }
.trash-link svg .lid{ transform-box:fill-box; transform-origin:right bottom; transition:transform .25s cubic-bezier(.34,1.56,.64,1); }
.trash-link:hover svg .lid, .trash-link.open svg .lid{ transform:rotate(-18deg) translateY(-1px); }
.trash-link-badge{
  min-width:1.7rem;
  padding:0.18rem 0.5rem;
  border-radius:999px;
  background:color-mix(in srgb, var(--btn) 16%, transparent);
  color:inherit;
  font-variant-numeric:tabular-nums;
  font-size:0.7rem;
  letter-spacing:0.02em;
  text-align:center;
}
.trash-link:hover .trash-link-badge, .trash-link.open .trash-link-badge{ background:color-mix(in srgb, var(--surface) 25%, transparent); }
.version-tag{
  width:100%;
  text-align:right;
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.7rem;
  letter-spacing:0.08em;
  color:var(--ink-faint);
  opacity:0.7;
  position:relative;
  z-index:41;
}

/* ---------- 10.2 : panneau « Partage » (carnet, invitations) ---------- */
.share-block{ background:var(--surface); color:var(--ink-soft); margin-top:1.25rem; }
.share-head{ display:flex; justify-content:space-between; align-items:baseline; gap:1rem; }
.share-title{ font-family:'Courier Prime', 'Courier New', Courier, monospace; font-size:0.78rem; font-weight:700; letter-spacing:0.09em; text-transform:uppercase; color:var(--accent); }
.share-help{ font-size:0.86rem; color:var(--ink-soft); margin:0.45rem 0 0.8rem; max-width:60ch; }
.sh-me{ display:flex; flex-wrap:wrap; align-items:center; gap:0.4rem 0.7rem; font-size:0.8rem; color:var(--ink-faint); margin-bottom:0.9rem; }
.sh-name{ font:inherit; font-size:0.9rem; color:var(--ink); background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:0.35rem 0.6rem; width:12rem; max-width:100%; }
.sh-name:focus{ outline:none; border-color:var(--accent); }
.sh-sub{ font-family:'Courier Prime', 'Courier New', Courier, monospace; font-size:0.66rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:0.35rem; }
.sh-people{ list-style:none; margin:0 0 0.8rem; padding:0; border-top:1px solid var(--line); }
.sh-person{ display:flex; align-items:center; gap:0.6rem; padding:0.5rem 0.1rem; border-bottom:1px solid var(--line); font-size:0.9rem; }
.sh-person .share-chip{ --cat-color:var(--accent); box-shadow:none; width:1.5rem; height:1.5rem; font-size:0.75rem; }
.sh-pending .share-chip{ background:var(--surface-2); color:var(--ink-faint); }
.sh-pname{ color:var(--ink); font-weight:600; }
.sh-pending .sh-pname{ font-weight:400; color:var(--ink-soft); }
.sh-state{ font-size:0.78rem; color:var(--ink-faint); margin-right:auto; }
.sh-x{ appearance:none; border:none; background:transparent; color:var(--ink-faint); font-size:1rem; line-height:1; padding:4px 7px; border-radius:4px; cursor:pointer; }
.sh-x:hover{ background:var(--urgent-soft); color:var(--urgent-ink); }
.sh-copy-old{ appearance:none; border:none; background:none; padding:0; font:inherit; font-size:0.78rem; color:var(--accent); cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
.sh-empty{ font-style:italic; }
.sh-actions{ display:flex; flex-wrap:wrap; gap:0.5rem; align-items:center; }
.sh-btn{
  appearance:none; display:inline-flex; align-items:center; gap:0.4rem;
  border:1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); background:var(--surface); color:var(--accent);
  border-radius:999px; padding:0.45rem 0.95rem;
  font-family:'Courier Prime', 'Courier New', Courier, monospace; font-size:0.7rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase;
  text-decoration:none; cursor:pointer; transition:background .15s ease, color .15s ease;
}
.sh-btn-primary{ background:color-mix(in srgb, var(--accent) 15%, var(--surface)); }
.sh-btn:hover{ background:var(--accent); color:var(--surface); }
.sh-btn:disabled{ opacity:.55; cursor:default; }
.sh-newlink{ margin-top:0.8rem; padding:0.75rem; border:1px dashed color-mix(in srgb, var(--accent) 40%, var(--line)); border-radius:12px; }
.sh-url{ width:100%; box-sizing:border-box; font-family:'Courier Prime', 'Courier New', Courier, monospace; font-size:0.78rem; color:var(--ink); background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:0.4rem 0.55rem; margin-bottom:0.55rem; }
.sh-msg{ font-size:0.8rem; color:var(--ink-soft); margin-top:0.6rem; }
.sh-msg:empty{ display:none; }

/* ---------- corbeille : archive neutre, machine à écrire (7.5) ---------- */
.trash-block{
  background:var(--surface);
  color:var(--ink-soft);
  margin-top:1.25rem;
}
/* toute la corbeille en Courier : passe avant les polices des éléments du dedans */
.trash-block, .trash-block *{ font-family:'Courier Prime', 'Courier New', Courier, monospace !important; }
.trash-head{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:1rem;
  flex-wrap:wrap;
}
.trash-total{
  font-size:1.6rem;
  font-weight:700;
  letter-spacing:0;
  color:var(--ink);
}
.trash-total small{
  font-size:0.95rem;
  font-weight:400;
  color:var(--ink-faint);
  margin-left:0.35rem;
}
.trash-close{
  appearance:none;
  border:1px solid var(--line);
  background:transparent;
  color:var(--ink-soft);
  border-radius:8px;
  font-size:0.86rem;
  font-weight:400;
  padding:0.35rem 0.75rem;
  cursor:pointer;
}
.trash-close:hover{ color:var(--ink); border-color:var(--ink-faint); }
.trash-msg{
  color:var(--ink-faint);
  font-size:0.86rem;
  font-style:normal;
  margin:0.35rem 0 0.6rem;
}
/* graphique des tâches accomplies (6.1) */
.trash-chart{ margin:0.9rem 0 0.2rem; padding:0.75rem 0.9rem 0.6rem; border:1px solid var(--line); border-radius:12px; background:transparent; }
.tc-head{ display:flex; justify-content:space-between; align-items:center; gap:0.6rem; flex-wrap:wrap; margin-bottom:0.3rem; }
.tc-switch{ display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:2px; background:var(--surface); }
.tc-switch button{ appearance:none; border:none; background:transparent; font-size:0.64rem; font-weight:400; letter-spacing:0.04em; text-transform:uppercase; color:var(--ink-faint); padding:0.28rem 0.7rem; border-radius:999px; cursor:pointer; transition:color .15s ease, background .15s ease; }

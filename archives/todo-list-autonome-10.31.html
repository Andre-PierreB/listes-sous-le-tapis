// ---------- tapis décoratif (5.22) ----------
// Dessin du tapis en SVG, aux dimensions voulues. Purement décoratif : ne lit
// ni n'écrit aucune donnée de l'appli.
function isDarkTheme(){
  const t = document.documentElement.getAttribute("data-theme");
  if(t === "dark") return true;
  if(t === "light") return false;
  return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
}
const TAPIS = (()=>{
  // 7.38 : deux gammes propres et peu contrastées (plutôt qu'un filtre gris)
  const LIGHT = { edge:'#5E7680', guard:'#E6E6DE', guardDot:'#7F959D', border:'#EEEDE6', vine:'#9FB1B8', b1:'#B8A57E', b2:'#7FA0AA', leaf:'#B9C5C8',
    field:'#7E9AA3', fieldA:'#EEEDE5', fieldB:'#C2AE80', spand:'#6A838C', spandLine:'#C9B385', spandA:'#E3E3DA', spandDot:'#5F7880',
    med1:'#F0EFE8', med2:'#9DAFB4', med2Dot:'#87999F', med3:'#6F8E98', med3Dot:'#5D7B85', medLine:'#5E7680', center:'#C9B385', fringe:'#D6D4CB' };
  const DARK = { edge:'#0F1518', guard:'#26313A', guardDot:'#3F5260', border:'#222C33', vine:'#3E525C', b1:'#6E6248', b2:'#3E5F69', leaf:'#33434A',
    field:'#1E2D33', fieldA:'#4A5A60', fieldB:'#5E5440', spand:'#18242A', spandLine:'#6E6248', spandA:'#3A4950', spandDot:'#2A3A42',
    med1:'#34434A', med2:'#2A3A41', med2Dot:'#22323A', med3:'#1F3D46', med3Dot:'#18323A', medLine:'#0F1518', center:'#7A6C4C', fringe:'#3A4650' };
  let C = LIGHT;
  const rnd = n => { const x=Math.sin(n*127.1+311.7)*43758.5453; return x-Math.floor(x); };
  const f1 = v => (Math.round(v*10)/10).toString();

  function leaf(x,y,len,ang,col,w=0.32){
    return `<path transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(ang)})" d="M0 0Q${f1(len*.5)} ${f1(-len*w)} ${f1(len)} 0Q${f1(len*.5)} ${f1(len*w)} 0 0Z" fill="${col}"/>`;
  }
  function blossom(x,y,r,rot,petal,center,n=5){
    let s=`<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(rot)})">`;
    for(let i=0;i<n;i++) s+=`<ellipse cx="0" cy="${f1(-r*.55)}" rx="${f1(r*.36)}" ry="${f1(r*.55)}" fill="${petal}" transform="rotate(${i*360/n})"/>`;
    return s+`<circle r="${f1(r*.3)}" fill="${center}"/></g>`;
  }
  function rosette(x,y,r,c1,c2,c3){
    let s=`<g transform="translate(${f1(x)} ${f1(y)})">`;
    for(let i=0;i<8;i++) s+=`<ellipse cx="0" cy="${f1(-r*.6)}" rx="${f1(r*.32)}" ry="${f1(r*.48)}" fill="${c1}" transform="rotate(${i*45})"/>`;
    for(let i=0;i<8;i++) s+=`<ellipse cx="0" cy="${f1(-r*.38)}" rx="${f1(r*.17)}" ry="${f1(r*.3)}" fill="${c2}" transform="rotate(${i*45+22.5})"/>`;
    return s+`<circle r="${f1(r*.26)}" fill="${c3}"/><circle r="${f1(r*.1)}" fill="${c1}"/></g>`;
  }
  function palmette(x,y,s,rot,c1,c2,c3){
    let g=`<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(rot)}) scale(${s})">`;
    [-60,-30,0,30,60].forEach(a=>{ g+=`<ellipse cx="0" cy="-9" rx="3.6" ry="8" fill="${c1}" transform="rotate(${a} 0 -2)"/>`; });
    [-34,0,34].forEach(a=>{ g+=`<ellipse cx="0" cy="-6" rx="2.2" ry="5" fill="${c2}" transform="rotate(${a} 0 -1)"/>`; });
    g+=`<path d="M-7 -1Q0 7 7 -1Q0 3 -7 -1Z" fill="${c3}"/><circle cy="-2" r="2" fill="${c3}"/>`;
    return g+'</g>';
  }
  function arcScallop(cx,cy,a,b,n,bulge,rot=0){
    const P=[];
    for(let i=0;i<n;i++){ const t=rot+i*2*Math.PI/n; P.push([cx+a*Math.cos(t),cy+b*Math.sin(t)]); }
    let d=`M${f1(P[0][0])} ${f1(P[0][1])}`;
    for(let i=0;i<n;i++){
      const A=P[i], B=P[(i+1)%n], r=Math.hypot(B[0]-A[0],B[1]-A[1])*bulge;
      d+=`A${f1(r)} ${f1(r)} 0 0 1 ${f1(B[0])} ${f1(B[1])}`;
    }
    return d+'Z';
  }
  function dotGrid(x0,y0,x1,y1,step,r,col,op){
    let s='';
    for(let y=y0, j=0; y<=y1; y+=step, j++) for(let x=x0+(j%2?step/2:0); x<=x1; x+=step)
      s+=`<circle cx="${f1(x)}" cy="${f1(y)}" r="${r}" fill="${col}" opacity="${op}"/>`;
    return s;
  }
  function borderSide(x1,y1,x2,y2,amp){
    const L=Math.hypot(x2-x1,y2-y1), waves=Math.max(2,Math.round(L/48));
    const ux=(x2-x1)/L, uy=(y2-y1)/L, nx=-uy, ny=ux;
    let d='', s='';
    const N=waves*24;
    for(let i=0;i<=N;i++){
      const t=i/N, o=Math.sin(t*waves*2*Math.PI)*amp;
      d+=(i?'L':'M')+f1(x1+ux*L*t+nx*o)+','+f1(y1+uy*L*t+ny*o);
    }
    s+=`<path d="${d}" fill="none" stroke="${C.vine}" stroke-width="2.2" stroke-linecap="round"/>`;
    const ang=Math.atan2(uy,ux)*180/Math.PI;
    for(let k=0;k<waves*2;k++){
      const t=(k+.5)/(waves*2), side=(k%2?-1:1);
      const px=x1+ux*L*t+nx*amp*side*1.05, py=y1+uy*L*t+ny*amp*side*1.05;
      if(k%2) s+=rosette(px,py,5.8,C.b2,C.border,C.b1);
      else s+=palmette(px,py,.72,ang+(side>0?90:-90),C.b1,C.b2,C.leaf);
      const lt=(k+1)/(waves*2); if(lt>=1) continue;
      const lx=x1+ux*L*lt, ly=y1+uy*L*lt;
      s+=leaf(lx,ly,11,ang+40,C.leaf)+leaf(lx,ly,11,ang+220,C.leaf);
    }
    return s;
  }

  // médaillon, dessiné autour de (200,300) puis placé/agrandi par transformation
  function medallion(cid){
    const CX=200, CY=300, c=C;
    let s='';
    const outer=arcScallop(CX,CY,106,160,16,.78);
    const orange=arcScallop(CX,CY,68,102,12,.7,Math.PI/12);
    const green=arcScallop(CX,CY,40,58,12,.7,Math.PI/12);
    s+=`<defs><clipPath id="${cid}-o"><path d="${orange}"/></clipPath><clipPath id="${cid}-g"><path d="${green}"/></clipPath></defs>`;
    [-1,1].forEach(dir=>{
      const py=CY+dir*188;
      s+=`<path d="M${CX} ${CY+dir*160}L${CX} ${py-dir*8}" stroke="${c.medLine}" stroke-width="1.6"/>`;
      s+=`<path d="${arcScallop(CX,py,17,13,8,.7)}" fill="${c.med3}" stroke="${c.medLine}" stroke-width="1.2"/>`;
      s+=blossom(CX,py,8,0,c.med1,c.center,6);
      s+=palmette(CX,py+dir*16,1.05,dir>0?180:0,c.med3,c.med1,c.center);
    });
    s+=`<path d="${outer}" fill="${c.med1}" stroke="${c.medLine}" stroke-width="1.6"/>`;
    s+=`<path d="${arcScallop(CX,CY,97,147,16,.78)}" fill="none" stroke="${c.medLine}" stroke-width=".7" opacity=".45"/>`;
    for(let i=0;i<16;i++){
      const t=(i+.5)/16*2*Math.PI;
      s+=blossom(CX+90*Math.cos(t),CY+136*Math.sin(t),4.6,i*22.5,c.med3,c.center);
      const t2=i/16*2*Math.PI;
      s+=`<circle cx="${f1(CX+86*Math.cos(t2))}" cy="${f1(CY+128*Math.sin(t2))}" r="1.8" fill="${c.med2}"/><circle cx="${f1(CX+80*Math.cos(t2))}" cy="${f1(CY+120*Math.sin(t2))}" r=".9" fill="${c.med2}" opacity=".8"/>`;
    }
    s+=`<path d="${orange}" fill="${c.med2}" stroke="${c.medLine}" stroke-width="1.2"/>`;
    s+=`<g clip-path="url(#${cid}-o)">${dotGrid(CX-70,CY-104,CX+70,CY+104,6.5,.75,c.med2Dot,.55)}</g>`;
    s+=`<path d="${arcScallop(CX,CY,61,92,12,.7,Math.PI/12)}" fill="none" stroke="${c.med2Dot}" stroke-width=".7" opacity=".7"/>`;
    for(let i=0;i<12;i++){
      const t=i/12*2*Math.PI, a=52, b=78, len=15;
      const x=CX+a*Math.cos(t), y=CY+b*Math.sin(t), ang=Math.atan2(b*Math.cos(t),-a*Math.sin(t));
      s+=leaf(x-Math.cos(ang)*len/2,y-Math.sin(ang)*len/2,len,ang*180/Math.PI,c.med1,.28);
      const t2=(i+.5)/12*2*Math.PI;
      s+=`<circle cx="${f1(CX+56*Math.cos(t2))}" cy="${f1(CY+84*Math.sin(t2))}" r="1.5" fill="${c.med1}"/>`;
    }
    s+=`<path d="${green}" fill="${c.med3}" stroke="${c.medLine}" stroke-width="1"/>`;
    s+=`<g clip-path="url(#${cid}-g)">${dotGrid(CX-42,CY-60,CX+42,CY+60,5.5,.6,c.med3Dot,.7)}</g>`;
    s+=`<path d="${arcScallop(CX,CY,34,50,12,.7,Math.PI/12)}" fill="none" stroke="${c.med1}" stroke-width=".6" opacity=".55"/>`;
    for(let i=0;i<12;i++){ const t=i/12*2*Math.PI; s+=`<circle cx="${f1(CX+28*Math.cos(t))}" cy="${f1(CY+40*Math.sin(t))}" r="1.3" fill="${c.center}"/>`; }
    s+=rosette(CX,CY,20,c.med1,c.med3,c.center);
    return s;
  }

  // écoinçon : un quart de médaillon, dessiné avec le coin en (0,0), vers +x/+y
  function corner(id){
    const c=C;
    const outer=arcScallop(0,0,80,98,12,.78);
    const orange=arcScallop(0,0,44,54,8,.7);
    let s='';
    s+=`<path d="${outer}" fill="${c.spand}"/>`;
    s+=`<g clip-path="url(#${id}-co)">${dotGrid(0,0,84,102,6,.7,c.spandDot,.9)}</g>`;
    s+=`<path d="${outer}" fill="none" stroke="${c.spandLine}" stroke-width="1.2" stroke-linejoin="round"/>`;
    s+=`<path d="${arcScallop(0,0,72,88,12,.78)}" fill="none" stroke="${c.spandA}" stroke-width=".6" opacity=".5"/>`;
    [15,45,75].forEach(dg=>{ const t=dg*Math.PI/180; s+=blossom(63*Math.cos(t),78*Math.sin(t),4.4,dg,c.spandA,c.spandLine); });
    [30,60].forEach(dg=>{ const t=dg*Math.PI/180; s+=`<circle cx="${f1(64*Math.cos(t))}" cy="${f1(79*Math.sin(t))}" r="1.3" fill="${c.spandA}"/>`; });
    s+=`<path d="${orange}" fill="${c.med2}" stroke="${c.medLine}" stroke-width="1"/>`;
    s+=`<g clip-path="url(#${id}-cq)">${dotGrid(0,0,48,58,6,.7,c.med2Dot,.55)}</g>`;
    [22.5,67.5].forEach(dg=>{
      const t=dg*Math.PI/180, a=35, b=43, len=11;
      const x=a*Math.cos(t), y=b*Math.sin(t), ang=Math.atan2(b*Math.cos(t),-a*Math.sin(t));
      s+=leaf(x-Math.cos(ang)*len/2,y-Math.sin(ang)*len/2,len,ang*180/Math.PI,c.med1,.28);
    });
    s+=`<circle cx="${f1(38*Math.cos(Math.PI/4))}" cy="${f1(46*Math.sin(Math.PI/4))}" r="1.3" fill="${c.med1}"/>`;
    s+=`<path d="${arcScallop(0,0,25,31,8,.7)}" fill="${c.med3}" stroke="${c.medLine}" stroke-width=".9"/>`;
    s+=rosette(0,0,15,c.med1,c.med3,c.center);
    return s;
  }

  function build(VW, VH, dark){
    C = dark ? DARK : LIGHT;
    const id='tps';
    const X0=0, Y0=18, W=VW, H=VH-36, CX=VW/2;
    const bw=44, g1=6, g2=7;
    const bx=X0+g1+4, by=Y0+g1+4, bW=W-2*(g1+4), bH=H-2*(g1+4);
    const fx=bx+bw+g2, fy=by+bw+g2, fw=bW-2*(bw+g2), fh=bH-2*(bw+g2);
    const sS=Math.min(1.7, fw/262*0.92);
    // un médaillon par tronçon de champ, pour qu'un tapis très long reste habité
    const k=Math.max(1, Math.round(fh/(fw*1.55)));
    const segH=fh/k;
    const sM=Math.max(.5, Math.min(fw/262*0.95, (segH-110)/(2*215)));
    const centers=[]; for(let i=0;i<k;i++) centers.push(fy+segH*(i+.5));

    let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${VW}" height="${VH}" viewBox="0 0 ${VW} ${VH}"><defs>
    <filter id="${id}-wool" x="-2%" y="-2%" width="104%" height="104%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7" result="wob"/>
      <feDisplacementMap in="SourceGraphic" in2="wob" scale="1" xChannelSelector="R" yChannelSelector="G" result="base"/>
      <feGaussianBlur in="base" stdDeviation="0.32" result="soft"/>
      <feTurbulence type="fractalNoise" baseFrequency="1.5 0.95" numOctaves="1" seed="3" result="kn"/>
      <feColorMatrix in="kn" type="saturate" values="0" result="kng"/>
      <feComponentTransfer in="kng" result="knr">
        <feFuncR type="linear" slope="0.28" intercept="0.8"/><feFuncG type="linear" slope="0.28" intercept="0.8"/><feFuncB type="linear" slope="0.28" intercept="0.8"/>
      </feComponentTransfer>
      <feBlend in="soft" in2="knr" mode="multiply" result="knotted"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.045" numOctaves="2" seed="11" result="ab"/>
      <feColorMatrix in="ab" type="saturate" values="0" result="abg"/>
      <feComponentTransfer in="abg" result="abr">
        <feFuncR type="linear" slope="0.1" intercept="0.92"/><feFuncG type="linear" slope="0.1" intercept="0.92"/><feFuncB type="linear" slope="0.1" intercept="0.92"/>
      </feComponentTransfer>
      <feBlend in="knotted" in2="abr" mode="multiply" result="aged"/>
      <feComponentTransfer in="aged" result="lift">
        <feFuncR type="linear" slope="1.1" intercept="0.01"/><feFuncG type="linear" slope="1.1" intercept="0.01"/><feFuncB type="linear" slope="1.1" intercept="0.01"/>
      </feComponentTransfer>
      <feComposite in="lift" in2="soft" operator="in"/>
    </filter>
    <filter id="${id}-fr" x="-2%" y="-20%" width="104%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="1" seed="5" result="w"/>
      <feDisplacementMap in="SourceGraphic" in2="w" scale="3"/>
    </filter>
    <linearGradient id="${id}-sheen" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".05"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".03"/>
    </linearGradient>
    <clipPath id="${id}-field"><rect x="${fx}" y="${fy}" width="${fw}" height="${fh}"/></clipPath>
    <clipPath id="${id}-co"><path d="${arcScallop(0,0,80,98,12,.78)}"/></clipPath>
    <clipPath id="${id}-cq"><path d="${arcScallop(0,0,44,54,8,.7)}"/></clipPath>
    </defs>`;

    // franges : fils droits, réguliers, nets
    s+=`<g stroke-linecap="round" fill="none" stroke="${C.fringe}" stroke-width="1.1">`;
    for(let x=X0+4, i=0; x<=X0+W-4; x+=4, i++){
      const lt=12+(rnd(i+3)-.5)*1.6, lb=12+(rnd(i+9)-.5)*1.6;
      s+=`<path d="M${f1(x)} ${Y0}V${f1(Y0-lt)}M${f1(x)} ${Y0+H}V${f1(Y0+H+lb)}"/>`;
    }
    s+=`</g><g filter="url(#${id}-wool)">`;
    // cadre, filet extérieur
    s+=`<rect x="${X0}" y="${Y0}" width="${W}" height="${H}" fill="${C.edge}"/>`;
    s+=`<rect x="${X0+3}" y="${Y0+3}" width="${W-6}" height="${H-6}" fill="${C.guard}"/>`;
    for(let x=X0+8;x<X0+W-4;x+=7) s+=`<circle cx="${x}" cy="${Y0+6.5}" r="1.4" fill="${C.guardDot}"/><circle cx="${x}" cy="${Y0+H-6.5}" r="1.4" fill="${C.guardDot}"/>`;
    for(let y=Y0+12;y<Y0+H-8;y+=7) s+=`<circle cx="${X0+6.5}" cy="${y}" r="1.4" fill="${C.guardDot}"/><circle cx="${X0+W-6.5}" cy="${y}" r="1.4" fill="${C.guardDot}"/>`;
    s+=`<rect x="${bx-1.2}" y="${by-1.2}" width="${bW+2.4}" height="${bH+2.4}" fill="${C.edge}"/>`;
    // bordure
    s+=`<rect x="${bx}" y="${by}" width="${bW}" height="${bH}" fill="${C.border}"/>`;
    const m=bw/2;
    s+=borderSide(bx+m+18, by+m, bx+bW-m-18, by+m, 8);
    s+=borderSide(bx+m+18, by+bH-m, bx+bW-m-18, by+bH-m, 8);
    s+=borderSide(bx+m, by+m+18, bx+m, by+bH-m-18, 8);
    s+=borderSide(bx+bW-m, by+m+18, bx+bW-m, by+bH-m-18, 8);
    [[bx+m,by+m],[bx+bW-m,by+m],[bx+m,by+bH-m],[bx+bW-m,by+bH-m]].forEach(([x,y])=>{ s+=rosette(x,y,13,C.b1,C.border,C.b2); });
    // filet intérieur
    s+=`<rect x="${fx-g2}" y="${fy-g2}" width="${fw+2*g2}" height="${fh+2*g2}" fill="${C.edge}"/>`;
    s+=`<rect x="${fx-g2+1.5}" y="${fy-g2+1.5}" width="${fw+2*g2-3}" height="${fh+2*g2-3}" fill="${C.guard}"/>`;
    for(let x=fx;x<fx+fw;x+=9) s+=`<path d="M${x} ${fy-3.5}l2.2 -2.2 2.2 2.2 -2.2 2.2Z M${x} ${fy+fh+3.5}l2.2 -2.2 2.2 2.2 -2.2 2.2Z" fill="${C.guardDot}"/>`;
    for(let y=fy+4;y<fy+fh;y+=9) s+=`<path d="M${fx-5.7} ${y}l2.2 -2.2 2.2 2.2 -2.2 2.2Z M${fx+fw+1.3} ${y}l2.2 -2.2 2.2 2.2 -2.2 2.2Z" fill="${C.guardDot}"/>`;
    // champ
    s+=`<rect x="${fx}" y="${fy}" width="${fw}" height="${fh}" fill="${C.field}"/><g clip-path="url(#${id}-field)">`;
    const inMed=(x,y)=>centers.some(cy=>((x-CX)/(114*sM))**2+((y-cy)/(170*sM))**2<1.05 || (Math.abs(x-CX)<26*sM && Math.abs(y-cy)<218*sM));
    const inCorner=(x,y)=>{ const dx=Math.min(x-fx,fx+fw-x), dy=Math.min(y-fy,fy+fh-y); return (dx/(88*sS))**2+(dy/(108*sS))**2<1.06; };
    const inLink=(x,y)=>centers.slice(1).some((cy,i)=>{ const my=(cy+centers[i])/2; return Math.hypot(x-CX,y-my)<18*sM; });
    let half='';
    const n=Math.round((fw/2)*fh/160);
    for(let i=0;i<n;i++){
      const x=fx+rnd(i*3.1)*(CX-fx), y=fy+rnd(i*7.7+1)*fh;
      if(inMed(x,y)||inCorner(x,y)||inMed(2*CX-x,y)||inLink(x,y)) continue;
      const kk=rnd(i*5.3);
      if(kk<.45) half+=blossom(x,y,2.6+rnd(i)*1.6,rnd(i+2)*72,C.fieldA,C.fieldB);
      else if(kk<.8) half+=leaf(x,y,5+rnd(i+4)*3,rnd(i+6)*360,C.fieldB);
      else half+=`<circle cx="${f1(x)}" cy="${f1(y)}" r="1.1" fill="${C.fieldA}"/>`;
    }
    s+=half+`<g transform="translate(${2*CX} 0) scale(-1 1)">${half}</g>`;
    [[fx,fy,1,1],[fx+fw,fy,-1,1],[fx,fy+fh,1,-1],[fx+fw,fy+fh,-1,-1]].forEach(([x,y,sx,sy])=>{
      s+=`<g transform="translate(${f1(x)} ${f1(y)}) scale(${f1(sx*sS*100)/100} ${f1(sy*sS*100)/100})">${corner(id)}</g>`;
    });
    s+=`</g>`;
    // liens entre médaillons
    centers.slice(1).forEach((cy,i)=>{
      const my=(cy+centers[i])/2, top=centers[i]+218*sM, bot=cy-218*sM;
      if(bot>top) s+=`<path d="M${f1(CX)} ${f1(top)}V${f1(bot)}" stroke="${C.medLine}" stroke-width="${f1(1.6*sM)}"/>`;
      s+=`<g transform="translate(${f1(CX)} ${f1(my)}) scale(${f1(sM*100)/100})">`+
        leaf(0,0,13,-90,C.fieldA,.3)+leaf(0,0,13,90,C.fieldA,.3)+leaf(0,0,11,0,C.fieldA,.3)+leaf(0,0,11,180,C.fieldA,.3)+
        rosette(0,0,9,C.med1,C.med3,C.center)+`</g>`;
    });
    centers.forEach((cy,i)=>{
      s+=`<g transform="translate(${f1(CX)} ${f1(cy)}) scale(${f1(sM*1000)/1000}) translate(-200 -300)">${medallion(id+'-m'+i)}</g>`;
    });
    s+=`<rect x="${X0}" y="${Y0}" width="${W}" height="${H}" fill="url(#${id}-sheen)"/></g></svg>`;
    return s;
  }
  return { build };
})();

// ---------- tapis : déroulé / enroulé au clic sur le titre (5.22) ----------
// Purement décoratif : le tapis se pose par-dessus l'appli (du titre jusqu'au
// numéro de version), sans rien lire ni écrire dans les tâches. Reclic sur le
// titre, clic sur le tapis ou Échap : il s'enroule.
(function(){
  const title = document.querySelector("header .eyebrow");
  const wrap = document.querySelector(".wrap");
  const version = document.querySelector(".version-tag");
  if(!title || !wrap || !version || typeof TAPIS === "undefined") return;
  title.setAttribute("role", "button");
  title.setAttribute("tabindex", "0");
  title.setAttribute("aria-label", "Dérouler le tapis");

  const box = document.createElement("div");
  box.className = "tapis-box";
  box.setAttribute("aria-hidden", "true");
  const cv = document.createElement("canvas");
  const roll = document.createElement("div");
  roll.className = "tapis-roll";
  box.appendChild(cv);
  wrap.appendChild(box);
  wrap.appendChild(roll);

  let p = 0, anim = 0, built = null, building = null, target = 0;
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const easeInOut = k => k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3)/2;       // ré-enroulé à la main

  // Emplacement : largeur des cases, du bas du titre jusqu'au-dessus de la version.
  function measure(){
    const ref = document.querySelector(".progress-card") || wrap;
    const wr = wrap.getBoundingClientRect(), rr = ref.getBoundingClientRect();
    const hr = title.closest("header").getBoundingClientRect();
    const vr = version.getBoundingClientRect();
    const left = rr.left - wr.left, width = rr.width;
    const VW = width >= 600 ? 560 : 400;
    const scale = width / VW;
    const fringe = 18 * scale;
    const bodyTop = hr.bottom - wr.top + 4;
    const bodyBottom = vr.top - wr.top - 8;
    const bodyH = Math.max(200, bodyBottom - bodyTop);
    return { left, width, top: bodyTop - fringe, height: bodyH + 2*fringe, VW, VH: Math.round(bodyH/scale) + 36 };
  }

  function build(m){
    const dark = isDarkTheme();
    const key = [Math.round(m.width), Math.round(m.height), dark ? "d" : "l"].join("x");
    if(built && built.key === key) return Promise.resolve();
    if(building && building.key === key) return building.promise;
    const svg = TAPIS.build(m.VW, m.VH, dark);
    const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
    const img = new Image();
    const promise = new Promise((resolve) => {
      img.onload = () => {
        let dpr = Math.min(window.devicePixelRatio || 1, 2);
        while(dpr > 1 && m.width*m.height*dpr*dpr > 14e6) dpr -= 0.25;   // reste raisonnable en mémoire
        cv.width = Math.round(m.width*dpr);
        cv.height = Math.round(m.height*dpr);
        cv.style.width = m.width + "px";
        cv.style.height = m.height + "px";
        const ctx = cv.getContext("2d");
        ctx.clearRect(0, 0, cv.width, cv.height);
        ctx.drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        built = { key };
        building = null;
        resolve();
      };
      img.onerror = () => { URL.revokeObjectURL(url); building = null; resolve(); };
    });
    building = { key, promise };
    img.src = url;
    return promise;
  }

  function place(m){
    box.style.left = m.left + "px";
    box.style.top = m.top + "px";
    box.style.width = m.width + "px";
    box.style.height = m.height + "px";
    roll.style.left = (m.left - 6) + "px";
    roll.style.width = (m.width + 12) + "px";
  }

  function apply(){
    const h = box.offsetHeight;
    box.style.display = p > 0.0005 ? "block" : "none";
    box.style.clipPath = `inset(0 0 ${((1-p)*100).toFixed(3)}% 0)`;
    if(p > 0.0005 && p < 0.9995){
      const th = 8 + 34*Math.sqrt(1-p);
      roll.style.display = "block";
      roll.style.height = th + "px";
      roll.style.top = (box.offsetTop + p*h - th/2) + "px";
    }else roll.style.display = "none";
    title.setAttribute("aria-label", target ? "Enrouler le tapis" : "Dérouler le tapis");
    document.body.classList.toggle("tapis-down", target === 1);
  }

  // ---- son : un froissement de laine qui suit le mouvement, puis un « flop » feutré ----
  // Synthétisé sur place (Web Audio), aucun fichier externe.
  let actx = null, noiseBuf = null;
  function audio(){
    try{
      if(!actx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return null;
        actx = new AC();
        // bruit rose doux, normalisé (pas d'écrêtage)
        const len = actx.sampleRate*3;
        noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0, peak=0;
        for(let i=0;i<len;i++){
          const w=Math.random()*2-1;
          b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759; b2=0.96900*b2+w*0.1538520;
          b3=0.86650*b3+w*0.3104856; b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
          d[i]=b0+b1+b2+b3+b4+b5+b6+w*0.5362; b6=w*0.115926;
          peak=Math.max(peak,Math.abs(d[i]));
        }
        for(let i=0;i<len;i++) d[i]=d[i]/peak*0.6;
      }
      if(actx.state === "suspended") actx.resume();
      return actx;
    }catch(e){ return null; }
  }
  // « flop » feutré : un souffle grave et très court, pas un coup
  function thud(ctx, at, vol, cutoff){
    const n = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    n.buffer = noiseBuf; f.type = "lowpass"; f.frequency.value = cutoff; f.Q.value = 0.5;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.linearRampToValueAtTime(vol, at + 0.025);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.32);
    n.connect(f).connect(g).connect(ctx.destination);
    n.start(at, Math.random()*2); n.stop(at + 0.36);
  }
  // froissement de tissu : bruit rose filtré dans le médium, enveloppe lisse
  function rustle(unroll, dur){
    const ctx = audio(); if(!ctx) return;
    const t0 = ctx.currentTime + 0.01, D = dur/1000;
    const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 350; hp.Q.value = 0.5;
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.Q.value = 0.4;
    const grain = ctx.createGain(); grain.gain.value = 1;       // légère irrégularité du tissu, toujours positive
    const lfo = ctx.createOscillator(), depth = ctx.createGain();
    lfo.type = "triangle"; depth.gain.value = 0.12;
    lfo.connect(depth).connect(grain.gain);
    const g = ctx.createGain();
    src.connect(hp).connect(lp).connect(grain).connect(g).connect(ctx.destination);
    const peak = unroll ? 0.11 : 0.08;
    g.gain.setValueAtTime(0, t0);
    if(unroll){
      g.gain.linearRampToValueAtTime(peak, t0 + 0.08);
      g.gain.linearRampToValueAtTime(peak*0.45, t0 + D*0.65);
      g.gain.linearRampToValueAtTime(0, t0 + D);
      lp.frequency.setValueAtTime(2600, t0); lp.frequency.exponentialRampToValueAtTime(900, t0 + D);
      lfo.frequency.setValueAtTime(9, t0); lfo.frequency.exponentialRampToValueAtTime(3, t0 + D);
    }else{
      g.gain.linearRampToValueAtTime(peak, t0 + D*0.5);
      g.gain.linearRampToValueAtTime(peak*0.5, t0 + D*0.85);
      g.gain.linearRampToValueAtTime(0, t0 + D);
      lp.frequency.setValueAtTime(1000, t0); lp.frequency.exponentialRampToValueAtTime(2200, t0 + D*0.5); lp.frequency.exponentialRampToValueAtTime(1400, t0 + D);
      lfo.frequency.setValueAtTime(3, t0); lfo.frequency.exponentialRampToValueAtTime(7, t0 + D*0.5);
    }
    src.start(t0, Math.random()*2); src.stop(t0 + D + 0.05);
    lfo.start(t0); lfo.stop(t0 + D + 0.05);
    if(unroll) thud(ctx, t0 + D - 0.06, 0.14, 260);
    else thud(ctx, t0 + D - 0.04, 0.08, 420);
  }

  // Déroulé : le rouleau part vite puis ralentit, à une vitesse qu'on voit à l'écran ;
  // la partie du tapis qui dépasse en bas de la fenêtre finit en douceur sans traîner.
  function unrollCurve(){
    const H = box.offsetHeight || 1000;
    const r = box.getBoundingClientRect();
    const visible = Math.max(120, Math.min(H, window.innerHeight - r.top));
    if(reduce) return { dur: 250, f: k => k };
    if(visible >= H - 40){
      const dur = Math.min(1900, 1250 + H*0.35);
      return { dur, f: k => 1 - Math.pow(1-k, 2.6) };
    }
    // phase visible (glisse décroissante qui sort de l'écran encore en mouvement), puis le reste
    const fv = visible / H, tA = 1500, tB = Math.min(700, 250 + (H - visible)*0.25);
    const partial = k => (1 - Math.pow(1 - k*0.55, 2)) / (1 - Math.pow(0.45, 2));
    const dur = tA + tB, kA = tA/dur;
    return { dur, f: k => k <= kA ? fv*partial(k/kA) : fv + (1-fv)*(1 - Math.pow(1 - (k-kA)/(1-kA), 2)) };
  }

  function run(to){
    target = to;
    cancelAnimationFrame(anim);
    const from = p, t0 = performance.now();
    const H = box.offsetHeight || 1000;
    let dur, f;
    if(to){ const c = unrollCurve(); dur = c.dur*(1-from); f = c.f; }
    else{ dur = reduce ? 250 : Math.min(1900, 1200 + H*0.12)*Math.max(.35, from); f = easeInOut; }
    if(!reduce) rustle(!!to, dur);
    const step = (t) => {
      const k = Math.min(1, (t - t0)/dur);
      p = to ? from + (1-from)*f(k) : from*(1 - f(k));
      apply();
      if(k < 1) anim = requestAnimationFrame(step);
    };
    anim = requestAnimationFrame(step);
  }

  async function toggle(){
    if(target === 1){ run(0); return; }
    if(trashOpen){ trashOpen = false; renderAll(); }   // la corbeille dépliée sous la version : on la replie d'abord
    const m = measure();
    place(m);
    target = 1;
    await build(m);
    if(target === 1) run(1);
  }

  title.addEventListener("click", (e)=>{ e.stopPropagation(); toggle(); });
  title.addEventListener("keydown", (e)=>{ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(); } });
  box.addEventListener("click", (e)=>{ e.stopPropagation(); if(target === 1) run(0); });
  document.addEventListener("keydown", (e)=>{ if(e.key === "Escape" && target === 1) run(0); });

  // Fenêtre redimensionnée tapis posé : on retaille le tapis.
  let rt = 0;
  window.addEventListener("resize", ()=>{
    clearTimeout(rt);
    rt = setTimeout(async ()=>{
      if(target !== 1) { built = null; return; }
      const m = measure(); place(m); await build(m); apply();
    }, 200);
  });

  // Préparé en douce après l'ouverture, pour que le premier clic parte tout de suite.
  const warm = ()=>{ try{ if(target === 0){ const m = measure(); place(m); build(m); } }catch(e){} };
  if("requestIdleCallback" in window) requestIdleCallback(warm, { timeout: 3000 }); else setTimeout(warm, 1200);
})();

// ---- 10.1 : synchro en ligne (Firebase : connexion + Firestore) ----
// Principe : l'appli travaille toujours d'abord dans ce navigateur (les fiches
// de Store) ; Sync recopie en ligne les fiches « list » et « user », et pose
// ici celles qui arrivent d'ailleurs. Rien ne change pour l'appli : ce qui
// arrive d'en ligne suit le même chemin qu'un changement fait dans un autre
// onglet (storeChangedElsewhere).
//
// En ligne (Firestore) :
//   lists/<cloudId>   une liste : les champs de sa fiche + owner (son
//                     créateur), members (les comptes qui la voient),
//                     updatedAt. cloudId = <uid du créateur>_<id de la liste>.
//   users/<uid>       la fiche « moi » de chaque compte (privée).
//   (page d'essai : collections essai_lists / essai_users)
//
// Modifications faites en même temps sur deux appareils : chaque appareil
// garde la dernière version vue en ligne (« base ») ; on fusionne alors
// champ par champ et tâche par tâche (identifiants stables) : chacun garde
// ce que l'autre n'a pas touché ; en cas de conflit sur le même champ, la
// modification faite ici l'emporte. Corbeille et journal « en cours » :
// les ajouts des deux côtés sont gardés (sans doublon), les retraits aussi.
//
// Un seul onglet parle à Firebase (verrou navigator.locks) : les autres
// suivent par le stockage du navigateur, comme d'habitude.

const SyncMerge = (()=>{
  const isObj = v => !!v && typeof v === "object" && !Array.isArray(v);
  function canon(v){
    if(Array.isArray(v)) return "[" + v.map(canon).join(",") + "]";
    if(isObj(v)) return "{" + Object.keys(v).sort().filter(k => v[k] !== undefined)
      .map(k => JSON.stringify(k) + ":" + canon(v[k])).join(",") + "}";
    return v === undefined ? "~" : JSON.stringify(v);
  }
  const eq = (a, b) => canon(a) === canon(b);
  const clone = v => v === undefined ? undefined : JSON.parse(JSON.stringify(v));
  // un champ : celui qui a changé depuis la base l'emporte ; les deux → ici
  function pick(b, l, r){ if(eq(l, b)) return clone(r); if(eq(r, b)) return clone(l); return clone(l); }
  function fields(b, l, r, skip){
    b = isObj(b) ? b : {}; l = isObj(l) ? l : {}; r = isObj(r) ? r : {};
    const out = {};
    const keys = [];
    [l, r, b].forEach(o => Object.keys(o).forEach(k => { if(!keys.includes(k)) keys.push(k); }));
    keys.forEach(k=>{
      if(skip && skip.includes(k)) return;
      const v = pick(b[k], l[k], r[k]);
      if(v !== undefined) out[k] = v;
    });
    return out;
  }
  // tâches (par identifiant) : ordre d'en ligne, puis les nouvelles d'ici
  function slots(b, l, r){
    b = Array.isArray(b) ? b : []; l = Array.isArray(l) ? l : []; r = Array.isArray(r) ? r : [];
    const B = new Map(b.map(s => [s.id, s])), L = new Map(l.map(s => [s.id, s])), R = new Map(r.map(s => [s.id, s]));
    const out = [];
    const one = id=>{
      const bs = B.get(id), ls = L.get(id), rs = R.get(id);
      if(ls && rs){
        // 10.2 : les modifications d'une tâche aussi, champ par champ (deux
        // personnes : l'une coche, l'autre renomme — chacun garde le sien)
        const m = fields(bs, ls, rs, ["edits"]);
        if(ls.edits !== undefined || rs.edits !== undefined){
          const e = (isObj(ls.edits) && isObj(rs.edits)) ? fields(bs && bs.edits, ls.edits, rs.edits) : pick(bs && bs.edits, ls.edits, rs.edits);
          if(e !== undefined) m.edits = e;
        }
        return m;
      }
      if(ls && !rs){ if(bs && eq(ls, bs)) return null; return clone(ls); }      // retirée en ligne
      if(rs && !ls){ if(bs && eq(rs, bs)) return null; return clone(rs); }      // retirée ici
      return null;
    };
    r.forEach(s => { const m = one(s.id); if(m) out.push(m); });
    l.forEach(s => { if(R.has(s.id)) return; const m = one(s.id); if(m) out.push(m); });
    return out;
  }
  function idOrder(b, l, r){
    if(eq(l, b)) return clone(r);
    if(eq(r, b) || !Array.isArray(r)) return clone(l);
    if(!Array.isArray(l)) return clone(r);
    const out = l.slice();
    r.forEach(x => { if(!out.some(y => eq(x, y))) out.push(x); });
    return clone(out);
  }
  // corbeille, journal : ajouts et retraits de chaque côté (sans doublon)
  function multiset(b, l, r){
    if(!Array.isArray(l) || !Array.isArray(r)) return pick(b, l, r);
    b = Array.isArray(b) ? b : [];
    const count = a => { const m = new Map(); a.forEach(x => { const k = canon(x); m.set(k, (m.get(k) || 0) + 1); }); return m; };
    const cb = count(b), cl = count(l), cr = count(r);
    const out = [];
    const used = new Map();
    // ce qui est en ligne, moins ce qui a été retiré ici
    r.forEach(x=>{
      const k = canon(x);
      const n = (used.get(k) || 0) + 1;
      const removedHere = Math.max(0, (cb.get(k) || 0) - (cl.get(k) || 0));
      const keepMax = (cr.get(k) || 0) - removedHere;
      if(n <= keepMax){ out.push(clone(x)); used.set(k, n); }
    });
    // + ce qui a été ajouté ici et pas déjà ajouté en ligne
    const addedThere = k => Math.max(0, (cr.get(k) || 0) - (cb.get(k) || 0));
    const seenL = new Map();
    l.forEach(x=>{
      const k = canon(x);
      const n = (seenL.get(k) || 0) + 1; seenL.set(k, n);
      const addedHere = (cl.get(k) || 0) - (cb.get(k) || 0);
      if(n > (cb.get(k) || 0) && n - (cb.get(k) || 0) <= addedHere && n - (cb.get(k) || 0) > addedThere(k)) out.push(clone(x));
    });
    return out;
  }
  // 10.15 : historique des articles d'une liste de courses — ce que chacun a
  // saisi est gardé (ordre d'en ligne, puis les nouveaux d'ici), sans doublon
  const HISTORY_MAX = 300;
  function history(b, l, r){
    if(!Array.isArray(l) && !Array.isArray(r)) return pick(b, l, r);
    const out = [];
    const seen = new Set();
    [r, l].forEach(a => (Array.isArray(a) ? a : []).forEach(x=>{
      if(typeof x !== "string") return;
      const k = x.normalize("NFD").replace(/[̀-ͯ]/g, "").toLocaleLowerCase("fr").replace(/\s+/g, " ").trim();   // comme coursesNorm
      if(seen.has(k)) return;
      seen.add(k); out.push(x);
    }));
    return out.slice(-HISTORY_MAX);
  }
  function list(b, l, r){
    b = isObj(b) ? b : {};
    const out = fields(b, l, r, ["items", "ghosts", "order", "history"]);
    const hist = history(b.history, l.history, r.history);
    if(hist !== undefined) out.history = hist;
    out.items = slots(b.items, l.items, r.items);
    const ghosts = slots(b.ghosts, l.ghosts, r.ghosts).filter(g => !out.items.some(s => s.id === g.id));
    if(ghosts.length) out.ghosts = ghosts;
    const ord = idOrder(b.order, l.order, r.order);
    if(ord !== undefined) out.order = ord;
    return out;
  }
  function user(b, l, r){
    b = isObj(b) ? b : {};
    const out = fields(b, l, r, ["trash", "waitLog", "lastPurge"]);
    ["trash", "waitLog"].forEach(k=>{
      const v = multiset(b[k], l[k], r[k]);
      if(v !== undefined) out[k] = v;
    });
    const lp = (!eq(l.lastPurge, b.lastPurge) && !eq(r.lastPurge, b.lastPurge))
      ? [l.lastPurge, r.lastPurge].filter(x => typeof x === "string").sort().pop()
      : pick(b.lastPurge, l.lastPurge, r.lastPurge);
    if(lp !== undefined) out.lastPurge = lp;
    return out;
  }
  // Firestore n'accepte pas un tableau dans un tableau : on l'emballe
  function toCloud(v){
    if(Array.isArray(v)) return v.map(x => Array.isArray(x) ? { __arr: toCloud(x) } : toCloud(x));
    if(isObj(v)){ const o = {}; Object.keys(v).forEach(k => { if(v[k] !== undefined) o[k] = toCloud(v[k]); }); return o; }
    return v;
  }
  function fromCloud(v){
    if(Array.isArray(v)) return v.map(fromCloud);
    if(isObj(v)){
      const ks = Object.keys(v);
      if(ks.length === 1 && ks[0] === "__arr" && Array.isArray(v.__arr)) return fromCloud(v.__arr);
      if(typeof v.toMillis === "function") return v.toMillis();
      const o = {}; ks.forEach(k => { o[k] = fromCloud(v[k]); }); return o;
    }
    return v;
  }
  return { canon, eq, list, user, toCloud, fromCloud, multiset, HISTORY_MAX };
})();

const Sync = (()=>{
  const COL = ESSAI ? "essai_" : "";
  const LISTS = COL + "lists", USERS = COL + "users";
  const INVITES = COL + "invites";            // 10.2 : invitations (une par lien)
  const STATE_KEY = Store.ns + "sync";        // { uid, email, bases:{ "list:<cloudId>"|"user": texte } }
  const STATUS_KEY = Store.ns + "syncstatus"; // { state, email } — partagé entre onglets

  let linked = false;
  let pushTimer = 0, pushing = false, pushAgain = false, retryTimer = 0;
  let onStatusChange = null;
  let lastErr = "";            // 10.9 : dernière erreur de synchro (fenêtre de la plume)
  let invites = [];            // 10.2 : mes invitations pas encore ouvertes { code, createdAt }
  let onInvitesFn = null, onInviteUsedFn = null, onLinkedFn = null, onAuthFn = null;

  const readJSON = (k, fb) => { try{ const v = JSON.parse(localStorage.getItem(k)); return v == null ? fb : v; }catch(e){ return fb; } };
  const writeJSON = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ console.error("[Sync]", e); } };
  function saveState(){
    writeJSON(STATE_KEY, state);
    // 10.2 : le compte de cet appareil, lisible tout de suite au chargement (Store.myUid)
    try{ if(state && state.uid && localStorage.getItem(Store.ns + "me") !== state.uid) localStorage.setItem(Store.ns + "me", state.uid); }catch(e){}
  }
  function status(st){
    // l'état affiché est écrit par l'onglet « chef » (ou par tous à la déconnexion)
    if(user && !leader){ if(onStatusChange) onStatusChange(); return; }
    const cur = readJSON(STATUS_KEY, {});
    const next = { state: st, email: user ? (user.email || "") : "" };
    if(cur.state !== next.state || cur.email !== next.email) writeJSON(STATUS_KEY, next);
    if(onStatusChange) onStatusChange();
  }
  function getStatus(){
    const s = readJSON(STATUS_KEY, {});
    // 10.8 : connecté mais pas encore chef depuis peu : l'état écrit est peut-être ancien
    if(user && !leader && askedAt && Date.now() - askedAt < LEAD_WAIT + 2000) return { state:"connecting", email: user.email || "" };
    if(!user && s.state !== "off") return { state: auth ? "off" : (readJSON(STATE_KEY, {}).uid ? "connecting" : "off"), email: "" };
    return s.state ? s : { state: "off", email: "" };
  }

  async function loadFirebase(){
    if(fb) return fb;
    if(!fbLoading){
      const url = n => `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-${n}.js`;
      fbLoading = Promise.all([import(url("app")), import(url("auth")), import(url("firestore"))]).then(([a, au, fs])=>{
        fb = Object.assign({}, a, au, fs);
        app = fb.initializeApp(FIREBASE_CONFIG);
        auth = fb.getAuth(app);
        auth.languageCode = "fr";
        db = fb.getFirestore(app);
        fb.onAuthStateChanged(auth, onAuth);
        return fb;
      }).catch(err=>{ fbLoading = null; throw err; });
    }
    return fbLoading;
  }

  // ---------- connexion / déconnexion ----------
  async function onAuth(u){
    user = u || null;
    if(onAuthFn){ try{ onAuthFn(user); }catch(e){ console.error("[Sync]", e); } }
    if(!user){ stopListening(); linked = false; invites = []; status("off"); return; }
    status("connecting");
    if(!leaderAsked){
      leaderAsked = true;
      if(navigator.locks && navigator.locks.request){
        askLead(false);
        askedAt = Date.now();
        setTimeout(stealIfStuck, LEAD_WAIT + 50);
        return;
      }
      leader = true;
    }
    if(leader) link();
  }
  // 10.8 : sur iPhone, l'icône d'écran d'accueil pouvait attendre le verrou
  // indéfiniment (tenu par un onglet fantôme) : jamais branchée, ses listes
  // restaient celles d'avant. Si le verrou n'arrive pas en quelques secondes
  // et que la page est à l'écran, on le reprend ; l'onglet qui le tenait
  // (s'il existe) lui laisse la synchro et se remet dans la file.
  const LOCK = (ESSAI ? "essai-" : "") + "sltapis-sync";
  const LEAD_WAIT = 4000;
  let askedAt = 0;
  function askLead(steal){
    navigator.locks.request(LOCK, steal ? { steal:true } : {}, ()=> new Promise(()=>{ leader = true; if(user) link(); }))
      .catch(()=>{
        if(leader){ leader = false; linked = false; stopListening(); }
        askLead(false);
      });
  }
  function stealIfStuck(){
    if(leader || !user || !askedAt || Date.now() - askedAt < LEAD_WAIT) return;
    if(document.visibilityState !== "visible") return;   // repris quand la page revient à l'écran
    console.warn("[Sync] verrou de synchro introuvable : repris par cet onglet");
    askLead(true);
  }
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "visible") stealIfStuck(); });
  function stopListening(){ unsubs.forEach(f => { try{ f(); }catch(e){} }); unsubs = []; }

  async function link(){
    if(!user || !leader || Store.mode !== "doc") return;
    const uid = user.uid;
    state = readJSON(STATE_KEY, null);
    try{
      if(!state || state.uid !== uid || !state.bases){
        // premier branchement de ce compte sur cet appareil
        const [uSnap, lSnap] = await Promise.all([
          fb.getDoc(fb.doc(db, USERS, uid)),
          fb.getDocs(fb.query(fb.collection(db, LISTS), fb.where("members", "array-contains", uid))),
        ]);
        if(!user || user.uid !== uid) return;
        const local = Store.readDocs();
        const localHas = Object.keys(local.lists).length > 0;
        if(!uSnap.exists() && lSnap.empty){
          if(localHas && !confirm("Premier branchement de ce compte : envoyer les listes de cet appareil dans ton compte en ligne ?")){
            await fb.signOut(auth); return;
          }
          state = { uid, email: user.email || "", bases: {} };
        }else{
          if(localHas && !confirm("Ce compte a déjà des listes en ligne : elles vont remplacer celles de cet appareil (une copie de celles-ci est gardée sur cet appareil). On y va ?")){
            await fb.signOut(auth); return;
          }
          if(localHas) writeJSON(BACKUP_KEY, Object.assign({ app:"sous-le-tapis", version:2, format:10, savedAt:new Date().toISOString() }, Store.exportModel()));
          const docs = { lists: {}, user: uSnap.exists() ? cleanUser(SyncMerge.fromCloud(uSnap.data())) : {} };
          const bases = {};
          lSnap.forEach(d=>{
            const L = cleanList(d.id, SyncMerge.fromCloud(d.data()));
            docs.lists[localIdOf(L, uid)] = L;
            bases["list:" + d.id] = canon(L);
          });
          if(uSnap.exists()) bases.user = canon(docs.user);
          Store.writeDocs(docs, true);
          forgetUndo(); // ⌘Z ne doit pas ramener les anciennes listes de cet appareil
          state = { uid, email: user.email || "", bases };
          saveState();
          storeChangedElsewhere(Store.ns + "remote");
          if(localHas) celebrate("Tes listes en ligne sont arrivées. Celles de cet appareil sont gardées de côté.");
        }
        saveState();
      }
      linked = true;
      listen(uid);
      listenInvites(uid);
      ensureMyName();
      schedulePush(0);
      if(onLinkedFn){ try{ onLinkedFn(); }catch(e){ console.error("[Sync]", e); } }
    }catch(err){
      console.error("[Sync] branchement", err);
      lastErr = "branchement : " + ((err && (err.code || err.message)) || err);
      status("error");
      retryLater(link);
    }
  }
  const cleanList = (cloudId, d)=>{ const L = Object.assign({}, d); delete L.updatedAt; L.cloudId = cloudId; if(!Array.isArray(L.items)) L.items = []; return L; };
  const cleanUser = d => { const u = Object.assign({}, d); delete u.updatedAt; return u; };
  // id local d'une liste : le sien pour mes listes, l'id en ligne pour celles des autres
  const localIdOf = (L, uid) => (L.owner === uid && typeof L.id === "string" && L.id) ? L.id : L.cloudId;

  function listen(uid){
    stopListening();
    unsubs.push(fb.onSnapshot(fb.doc(db, USERS, uid), snap=>{
      if(snap.metadata.hasPendingWrites) return;
      incoming("user", null, snap.exists() ? cleanUser(SyncMerge.fromCloud(snap.data())) : null);
    }, onListenError));
    unsubs.push(fb.onSnapshot(fb.query(fb.collection(db, LISTS), fb.where("members", "array-contains", uid)), qs=>{
      if(qs.metadata.hasPendingWrites) return;
      qs.docChanges().forEach(ch=>{
        incoming("list:" + ch.doc.id, ch.doc.id, ch.type === "removed" ? null : cleanList(ch.doc.id, SyncMerge.fromCloud(ch.doc.data())));
      });
      if(!pushing) status(dirty() ? "pending" : "ok");
    }, onListenError));
  }
  // ---------- 10.2 : invitations ----------
  // invites/<code> : { from, fromName, createdAt } ; la personne invitée y
  // ajoute usedBy / usedByName / usedAt. Ici, on écoute mes invitations :
  // une invitation ouverte fait entrer la personne dans mon carnet, puis
  // l'invitation est effacée (elle a servi).
  function listenInvites(uid){
    unsubs.push(fb.onSnapshot(fb.query(fb.collection(db, INVITES), fb.where("from", "==", uid)), qs=>{
      const list = [];
      qs.forEach(d=>{
        const v = d.data() || {};
        if(v.usedBy){
          if(onInviteUsedFn){ try{ onInviteUsedFn({ code:d.id, usedBy:v.usedBy, usedByName:v.usedByName || "" }); }catch(e){ console.error("[Sync]", e); } }
          fb.deleteDoc(fb.doc(db, INVITES, d.id)).catch(err => console.error("[Sync] invitation servie", err));
        }else{
          const c = v.createdAt;
          list.push({ code:d.id, createdAt: c && typeof c.toMillis === "function" ? c.toMillis() : (typeof c === "number" ? c : Date.now()) });
        }
      });
      list.sort((a, b) => a.createdAt - b.createdAt);
      invites = list;
      if(onInvitesFn) onInvitesFn();
    }, err => console.error("[Sync] invitations", err)));   // règles pas à jour : rien de plus
  }
  // prénom par défaut, la première fois : celui du compte Google, sinon le début de l'adresse
  function ensureMyName(){
    try{
      if(Store.userField("myName")) return;
      const g = String(user.displayName || "").trim().split(/\s+/)[0];
      const e = String(user.email || "").split("@")[0].split(/[._+-]/)[0];
      const n = (g || e || "").slice(0, 30);
      if(n) Store.setUserField("myName", n.charAt(0).toLocaleUpperCase("fr") + n.slice(1));
    }catch(err){ console.error("[Sync] prénom", err); }
  }
  function inviteCode(){
    const A = "abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    const a = new Uint8Array(20);
    crypto.getRandomValues(a);
    return Array.from(a, b => A[b % A.length]).join("");
  }
  function onListenError(err){
    console.error("[Sync] écoute", err);
    lastErr = "écoute : " + ((err && (err.code || err.message)) || err);
    status("error");
    retryLater(()=>{ if(user) listen(user.uid); });
  }

  // ---------- ce qui arrive d'en ligne ----------
  function localDocFor(key, docs){
    if(key === "user") return { id:null, doc: docs.user };
    const cloudId = key.slice(5);
    for(const id of Object.keys(docs.lists)){
      const L = docs.lists[id];
      if(cloudIdOf(L) === cloudId) return { id, doc: L };
    }
    return { id:null, doc:null };
  }
  function cloudIdOf(L){ return L.cloudId || (user.uid + "_" + L.id); }
  function incoming(key, cloudId, remote){
    if(!state) return;
    const docs = Store.readDocs();
    const { id, doc: rawLocal } = localDocFor(key, docs);
    const local = (rawLocal && key !== "user") ? normalizeOne(rawLocal) : rawLocal;
    const base = state.bases[key];
    const remoteC = remote ? canon(remote) : undefined;
    if(remoteC === base) return;                       // déjà connu (notre propre écriture)
    const localC = local ? canon(local) : undefined;
    let next;
    if(localC === base || (base === undefined && !local)) next = remote;
    else if(!remote) next = (local && local.owner && local.owner !== user.uid) ? null  // 10.2 : liste d'un autre qu'on ne voit plus
                          : local;                      // supprimée en ligne mais changée ici : on la garde
    else next = merge(key, base, local, remote);
    if(remote) state.bases[key] = remoteC; else delete state.bases[key];
    saveState();
    if(canon(next) !== (rawLocal ? canon(rawLocal) : undefined)){
      if(key === "user") Store.writeDocs({ lists:{}, user: next || {} });
      else if(next || id) Store.writeDocs({ lists: { [id || localIdOf(next, user.uid)]: next } });
      storeChangedElsewhere(Store.ns + (isSharedDoc(next) || isSharedDoc(rawLocal) ? "remote-shared" : "remote"));
    }
    if(next && canon(next) !== (state.bases[key])) schedulePush();
  }
  // 10.2 : une liste vue par plusieurs comptes
  function isSharedDoc(L){ return !!(L && Array.isArray(L.members) && L.members.filter(m => m !== "moi").length > 1); }
  function merge(key, base, local, remote){
    const b = base === undefined ? undefined : JSON.parse(base);
    return key === "user" ? SyncMerge.user(b, local, remote) : SyncMerge.list(b, local, remote);
  }

  // ---------- ce qui part en ligne ----------
  // mes listes portent mon compte (et plus « moi »), leur créateur et leur id en ligne
  function normalizeOne(L){
    const n = Object.assign({}, L);
    const mem = Array.isArray(L.members) ? L.members.filter(m => m !== "moi") : [];
    if(!L.owner) n.owner = user.uid;
    if(!mem.includes(user.uid) && n.owner === user.uid) mem.unshift(user.uid);
    n.members = mem;
    n.cloudId = cloudIdOf(L);
    return n;
  }
  function normalized(docs){
    return Object.keys(docs.lists).map(id=>{
      const L = docs.lists[id], n = normalizeOne(L);
      return { key: "list:" + n.cloudId, id, doc: n, raw: L };
    });
  }
  function dirty(){
    if(!state || !user) return false;
    const docs = Store.readDocs();
    const norm = normalized(docs);
    if(norm.some(x => canon(x.doc) !== state.bases[x.key] || canon(x.raw) !== canon(x.doc))) return true;
    if(Object.keys(state.bases).some(k => k.startsWith("list:") && !norm.some(x => x.key === k))) return true;
    if(Object.keys(docs.user).length && canon(docs.user) !== state.bases.user) return true;
    return false;
  }
  function schedulePush(delay){
    if(!leader || !linked) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(pushAll, delay == null ? 400 : delay);
  }
  async function pushAll(){
    if(!user || !leader || !linked || !state) return;
    if(pushing){ pushAgain = true; return; }
    pushing = true; pushAgain = false;
    let ok = true;
    try{
      const docs = Store.readDocs();
      const norm = normalized(docs);
      for(const x of norm){
        if(canon(x.doc) === state.bases[x.key] && canon(x.raw) === canon(x.doc)) continue;
        status("pending");
        try{ await pushOne(x.key, LISTS, x.key.slice(5), x.id, x.doc, x.raw); }
        catch(err){ if(err && err.code === "permission-denied" && await refused(x)) continue; throw err; }
      }
      for(const k of Object.keys(state.bases)){
        if(!k.startsWith("list:") || norm.some(x => x.key === k)) continue;
        status("pending");
        await pushDelete(k);
      }
      if(Object.keys(docs.user).length && canon(docs.user) !== state.bases.user){
        status("pending");
        await pushOne("user", USERS, user.uid, null, docs.user, docs.user);
      }
    }catch(err){
      ok = false;
      console.error("[Sync] envoi", err);
      lastErr = "envoi : " + ((err && (err.code || err.message)) || err);
      status(err && err.code === "permission-denied" ? "error" : "pending");
      retryLater(()=> schedulePush(0));
    }finally{
      pushing = false;
    }
    if(pushAgain) schedulePush(0);
    else if(ok) status(dirty() ? "pending" : "ok");
  }
  async function pushOne(key, coll, docId, localId, doc, raw){
    const ref = fb.doc(db, coll, docId);
    const base = state.bases[key];
    const out = await fb.runTransaction(db, async tx=>{
      const snap = await tx.get(ref);
      const remote = snap.exists() ? (key === "user" ? cleanUser(SyncMerge.fromCloud(snap.data())) : cleanList(docId, SyncMerge.fromCloud(snap.data()))) : null;
      const merged = (!remote || canon(remote) === base) ? doc : merge(key, base, doc, remote);
      if(!remote || canon(merged) !== canon(remote)){
        tx.set(ref, Object.assign(SyncMerge.toCloud(merged), { updatedAt: fb.serverTimestamp() }));
      }
      return merged;
    });
    state.bases[key] = canon(out);
    saveState();
    // ici, la fiche a peut-être encore bougé pendant l'envoi
    const now = Store.readDocs();
    const cur = key === "user" ? now.user : (localId != null ? now.lists[localId] : null);
    let next = out;
    if(cur && canon(cur) !== canon(raw)) next = merge(key, canon(raw), cur, out);
    if(!cur && key !== "user") return;                       // supprimée entre-temps
    if(canon(next) !== canon(cur)){
      if(key === "user") Store.writeDocs({ lists:{}, user: next });
      else Store.writeDocs({ lists: { [localId]: next } });
      storeChangedElsewhere(Store.ns + "remote");
    }
  }
  // 10.2 : la base en ligne refuse d'enregistrer une liste qui n'est pas à moi
  // (on m'en a retiré, ou le geste dépasse ce qu'un invité peut faire) : on
  // reprend la version en ligne telle quelle, ou on la retire si je ne la
  // vois plus. Plutôt que de réessayer indéfiniment.
  async function refused(x){
    if(!x.doc.owner || x.doc.owner === user.uid) return false;
    const cloudId = x.key.slice(5);
    let remote = null;
    try{
      const snap = await fb.getDoc(fb.doc(db, LISTS, cloudId));
      remote = snap.exists() ? cleanList(cloudId, SyncMerge.fromCloud(snap.data())) : null;
    }catch(e){
      if(!(e && e.code === "permission-denied")) return false;   // réseau : on réessaiera
    }
    if(remote) state.bases[x.key] = canon(remote); else delete state.bases[x.key];
    saveState();
    Store.writeDocs({ lists: { [x.id]: remote } });
    storeChangedElsewhere(Store.ns + "remote-shared");
    celebrate(remote ? "Ce geste n'est pas permis dans la liste de quelqu'un d'autre : elle revient comme en ligne."
                     : "Une liste partagée avec toi ne l'est plus : elle disparaît d'ici.", true);
    return true;
  }
  async function pushDelete(key){
    const cloudId = key.slice(5);
    const base = state.bases[key];
    const b = JSON.parse(base);
    if(b.owner !== user.uid){ delete state.bases[key]; saveState(); return; }   // pas à moi : on la quitte seulement
    const ref = fb.doc(db, LISTS, cloudId);
    const restored = await fb.runTransaction(db, async tx=>{
      const snap = await tx.get(ref);
      if(!snap.exists()) return null;
      const remote = cleanList(cloudId, SyncMerge.fromCloud(snap.data()));
      if(canon(remote) === base){ tx.delete(ref); return null; }
      return remote;                                          // changée en ligne entre-temps : on la garde
    });
    delete state.bases[key];
    if(restored){
      state.bases[key] = canon(restored);
      Store.writeDocs({ lists: { [localIdOf(restored, user.uid)]: restored } });
      storeChangedElsewhere(Store.ns + "remote");
    }
    saveState();
  }
  function forgetUndo(){
    try{ undoStack.length = 0; saveUndoStack(); undoCurrent = null; }catch(e){}
  }
  function retryLater(fn){
    clearTimeout(retryTimer);
    retryTimer = setTimeout(()=>{ if(user) fn(); }, 15000);
  }
  window.addEventListener("online", ()=>{ if(user && leader && linked) schedulePush(0); });

  // ---------- pour l'appli ----------
  return {
    start(){
      if(Store.mode !== "doc") return;
      Store.onLocalChange = ()=> schedulePush();
      // déjà connecté sur cet appareil (ou une invitation attend) : Firebase est chargé tout de suite
      let waiting = null;
      try{ waiting = localStorage.getItem(Store.ns + "invitation"); }catch(e){}
      if(readJSON(STATE_KEY, {}).uid || waiting) loadFirebase().catch(err => { console.error("[Sync] chargement", err); status("off"); });
    },
    // ---- 10.2 : partage ----
    get invites(){ return invites.slice(); },
    set onInvites(fn){ onInvitesFn = fn; },
    set onInviteUsed(fn){ onInviteUsedFn = fn; },
    set onLinked(fn){ onLinkedFn = fn; },
    set onAuthChange(fn){ onAuthFn = fn; },
    get linked(){ return linked; },
    // 10.9 : petit diagnostic, affiché dans la fenêtre de la plume
    get diag(){
      const st = readJSON(STATE_KEY, {}) || {};
      const bases = st.bases ? Object.keys(st.bases).filter(k => k.startsWith("list:")) : [];
      return {
        acct: user ? user.uid.slice(-4) : "—",
        device: st.uid ? st.uid.slice(-4) : "—",
        leader, linked, locks: !!(navigator.locks && navigator.locks.request),
        online: bases.length,
        others: user ? bases.filter(k => !k.startsWith("list:" + user.uid + "_")).length : 0,
        err: lastErr,
      };
    },
    async createInvite(fromName){
      await loadFirebase();
      if(!user) throw new Error("pas connecté");
      const code = inviteCode();
      await fb.setDoc(fb.doc(db, INVITES, code), { from: user.uid, fromName: String(fromName || "").slice(0, 30), createdAt: fb.serverTimestamp() });
      if(!invites.some(i => i.code === code)) invites = invites.concat([{ code, createdAt: Date.now() }]);
      return code;
    },
    async deleteInvite(code){
      await loadFirebase();
      await fb.deleteDoc(fb.doc(db, INVITES, code));
      invites = invites.filter(i => i.code !== code);
      if(onInvitesFn) onInvitesFn();
    },
    async acceptInvite(code, name){
      await loadFirebase();
      if(!user) throw new Error("pas connecté");
      const uid = user.uid;
      const ref = fb.doc(db, INVITES, code);
      return fb.runTransaction(db, async tx=>{
        const snap = await tx.get(ref);
        if(!snap.exists()) return { status:"gone" };
        const v = snap.data() || {};
        if(v.from === uid) return { status:"self" };
        if(v.usedBy && v.usedBy !== uid) return { status:"used" };
        if(!v.usedBy) tx.update(ref, { usedBy: uid, usedByName: String(name || "").slice(0, 30), usedAt: fb.serverTimestamp() });
        return { status:"ok", from: v.from, fromName: v.fromName || "" };
      });
    },
    async loadNow(){ return loadFirebase(); },
    storageEvent(key){
      if(key === STATUS_KEY){ if(onStatusChange) onStatusChange(); return; }
      if(leader && linked && key && key.indexOf(Store.ns) === 0 && key !== STATE_KEY) schedulePush();
    },
    get status(){ return getStatus(); },
    set onStatus(fn){ onStatusChange = fn; },
    get user(){ return user; },
    // 10.13 : la fenêtre Google doit s'ouvrir DANS le geste (le toucher) ;
    // si on attend d'abord le chargement de Firebase, l'iPhone la bloque sans
    // rien dire (d'où « rien ne se passe » au premier essai). Firebase est donc
    // préchargé dès l'ouverture de la fenêtre de la plume (preload / ready), et
    // ici on ouvre la fenêtre Google tout de suite, sans rien attendre avant.
    get ready(){ return !!fb; },
    preload(){ return loadFirebase(); },
    signInGoogle(){
      if(!fb) return loadFirebase().then(()=> this.signInGoogle());
      // 10.10 : Google demande toujours quel compte utiliser (sinon il reprend
      // d'office celui déjà ouvert dans le navigateur)
      const provider = new fb.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: "select_account" });
      return fb.signInWithPopup(auth, provider);
    },
    async signInEmail(email, pw){ await loadFirebase(); return fb.signInWithEmailAndPassword(auth, email, pw); },
    async createEmail(email, pw){ await loadFirebase(); return fb.createUserWithEmailAndPassword(auth, email, pw); },
    async resetPassword(email){ await loadFirebase(); return fb.sendPasswordResetEmail(auth, email); },
    async signOut(){ await loadFirebase(); stopListening(); linked = false; return fb.signOut(auth); },
    get available(){ return Store.mode === "doc"; },
  };
})();

// ---- 10.1 : la plume (indicateur de connexion) et sa petite fenêtre ----
// À droite du titre. Bleu (--accent) : connecté ; --plume-off : déconnecté ; bleu
// pâle : connecté, des changements attendent le réseau.
(()=>{
  const plume = document.getElementById("plume");
  if(!plume) return;
  if(!Sync.available){ plume.hidden = true; return; }
  plume.hidden = false;
  document.body.classList.add("cloud"); // 10.6 : Sauvegarder / Restaurer passent dans la plume
  const LABEL = {
    off: "Déconnecté — se connecter pour retrouver ses listes partout",
    connecting: "Connexion en cours…",
    ok: "Connecté — tout est à jour",
    pending: "Connecté — des changements attendent le réseau",
    error: "La synchro a un souci — clic pour voir",
  };
  const tag = document.getElementById("plumeTag");
  function paint(){
    const st = Sync.status.state || "off";
    const offline = navigator.onLine === false;   // 10.23
    plume.dataset.state = st;
    plume.classList.toggle("on", !offline && (st === "ok" || st === "pending"));
    if(tag){
      const txt = (st === "off" || offline) ? "Hors ligne" : st === "error" ? "Souci de synchro" : "";
      tag.textContent = txt; tag.hidden = !txt;
    }
    plume.classList.toggle("waiting", st === "pending" || st === "connecting");
    const who = Sync.status.email ? " (" + Sync.status.email + ")" : "";
    plume.setAttribute("aria-label", LABEL[st] || LABEL.off);
    plume.title = (LABEL[st] || LABEL.off) + (st === "ok" || st === "pending" ? who : "");
  }
  Sync.onStatus = ()=>{ paint(); if(shareOpen) renderShare(); renderBackupNudge(); };   // 10.2 : le panneau Partage suit la connexion
  window.addEventListener("online", paint); window.addEventListener("offline", paint);   // 10.23
  paint();

  // 10.26 : domaines courants ; une adresse à 1–2 lettres de l'un d'eux est
  // probablement une faute de frappe (gmial.com, hotmail.con…)
  const KNOWN_DOMAINS = ["gmail.com","hotmail.com","hotmail.be","hotmail.fr","outlook.com","outlook.be","outlook.fr","live.be","live.com","live.fr","msn.com","yahoo.com","yahoo.fr","icloud.com","me.com","skynet.be","telenet.be","proximus.be","voo.be","scarlet.be","orange.fr","free.fr","laposte.net"];
  function editDist(a, b){
    const d = Array.from({length:a.length+1}, (_, i)=> [i]);
    for(let j = 1; j <= b.length; j++) d[0][j] = j;
    for(let i = 1; i <= a.length; i++) for(let j = 1; j <= b.length; j++){
      d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
      if(i > 1 && j > 1 && a[i-1] === b[j-2] && a[i-2] === b[j-1]) d[i][j] = Math.min(d[i][j], d[i-2][j-2]+1);   // lettres inversées
    }
    return d[a.length][b.length];
  }
  function emailSuggest(addr){
    const at = addr.lastIndexOf("@");
    if(at < 1) return "";
    const local = addr.slice(0, at), dom = addr.slice(at + 1).toLowerCase();
    if(!dom || KNOWN_DOMAINS.includes(dom)) return "";
    let best = "", bestD = 3;
    for(const k of KNOWN_DOMAINS){ const dd = editDist(dom, k); if(dd < bestD){ bestD = dd; best = k; } }
    return best && bestD <= (dom.length > 6 ? 2 : 1) ? local + "@" + best : "";
  }
  const ERR = {
    "auth/invalid-credential": "E-mail ou mot de passe incorrect.",
    "auth/wrong-password": "E-mail ou mot de passe incorrect.",
    "auth/user-not-found": "Pas de compte avec cette adresse : « Créer un compte » ?",
    "auth/email-already-in-use": "Un compte existe déjà avec cette adresse : « Se connecter ».",
    "auth/weak-password": "Mot de passe trop court (6 caractères minimum).",
    "auth/invalid-email": "Cette adresse e-mail ne ressemble pas à une adresse.",
    "auth/missing-password": "Il manque le mot de passe.",
    "auth/popup-blocked": "Le navigateur a bloqué la fenêtre Google : autorise les fenêtres pour ce site.",
    "auth/network-request-failed": "Pas de réseau pour l'instant.",
    "auth/too-many-requests": "Trop d'essais : le faisan monte la garde, réessaie dans un moment.",
  };
  const errText = e => ERR[e && e.code] || "Ça n'a pas marché (" + ((e && (e.code || e.message)) || "erreur inconnue") + ").";

  function open(){
    closeRelancePop();
    const st = Sync.status.state || "off";
    const pop = document.createElement("div");
    pop.className = "relance-pop sync-pop";
    pop.setAttribute("role", "dialog");
    if(Sync.user && st !== "off"){
      const stateText = { ok:"Tout est à jour.", pending:"Des changements attendent le réseau ; ils partiront tout seuls.", connecting:"Connexion en cours…", error:"La synchro a un souci : elle réessaie toute seule." }[st] || "";
      pop.innerHTML = `
        <div class="rp-title">Connecté</div>
        <div class="sp-who">${escapeAttr(Sync.user.email || "")}</div>
        <div class="sp-state">${escapeAttr(stateText)}</div>
        <div class="rp-opts"><button type="button" class="sp-logout rp-none">Se déconnecter</button></div>
        ${(()=>{ const d = Sync.diag; return `<div class="sp-diag">compte ·${escapeAttr(d.acct)} · appareil ·${escapeAttr(d.device)} · ${d.linked ? "branché" : (d.leader ? "chef, pas branché" : "en attente")}${d.locks ? "" : " · sans verrou"} · ${d.online} liste${d.online > 1 ? "s" : ""} en ligne dont ${d.others} d'autres${d.err ? " · " + escapeAttr(d.err) : ""}</div>`; })()}`;
      pop.querySelector(".sp-logout").addEventListener("click", async e=>{
        e.stopPropagation();
        closeRelancePop();
        try{ await Sync.signOut(); }catch(err){ console.error(err); }
      });
    }else{
      pop.innerHTML = `
        <div class="rp-title">${pendingInvite() ? "Une invitation t'attend" : "Retrouver ses listes partout"}</div>
        ${pendingInvite() ? `<div class="sp-state">Connecte-toi (ou crée un compte) pour l'accepter : les listes qu'on partagera avec toi apparaîtront ici.</div>` : ""}
        <button type="button" class="sp-google">Continuer avec Google</button>
        <div class="sp-or">ou</div>
        <input type="email" class="sp-email" placeholder="Adresse e-mail" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false">
        <div class="sp-hint" role="status"></div>
        <input type="password" class="sp-pw" placeholder="Mot de passe" autocomplete="current-password">
        <div class="rp-opts"><button type="button" class="sp-login">Se connecter</button><button type="button" class="sp-create rp-none">Créer un compte</button></div>
        <div class="sp-confirm" hidden></div>
        <button type="button" class="sp-forgot">Mot de passe oublié ?</button>
        <div class="sp-msg" role="status"></div>`;
      const msg = pop.querySelector(".sp-msg");
      const email = pop.querySelector(".sp-email"), pw = pop.querySelector(".sp-pw");
      const busy = on => pop.querySelectorAll("button, input").forEach(b => { b.disabled = on; });
      const run = async (fn, okText)=>{
        msg.textContent = ""; busy(true);
        try{ await fn(); if(okText) msg.textContent = okText; else closeRelancePop(); }
        catch(err){ if(!(err && (err.code === "auth/popup-closed-by-user" || err.code === "auth/cancelled-popup-request"))) msg.textContent = errText(err); }
        finally{ busy(false); }
      };
      pop.querySelector(".sp-google").addEventListener("click", e=>{ e.stopPropagation(); run(()=> Sync.signInGoogle()); });
      // 10.13 : Firebase chargé pendant qu'on lit la fenêtre ; le bouton Google
      // attend ce chargement (quelques dixièmes de seconde) pour s'ouvrir du premier coup
      const gBtn = pop.querySelector(".sp-google");
      if(!Sync.ready){
        gBtn.disabled = true;
        gBtn.textContent = "Un instant…";
        Sync.preload().then(()=>{
          gBtn.textContent = "Continuer avec Google";
          if(!pop.querySelector(".sp-login").disabled) gBtn.disabled = false;
        }).catch(err=>{
          console.error("[Sync] chargement", err);
          gBtn.textContent = "Continuer avec Google";
          gBtn.disabled = false;
          msg.textContent = "Pas de réseau pour l'instant.";
        });
      }
      pop.querySelector(".sp-login").addEventListener("click", e=>{ e.stopPropagation(); run(()=> Sync.signInEmail(email.value.trim(), pw.value)); });
      // 10.26 : faute de frappe probable dans le domaine, signalée en quittant le champ
      const hint = pop.querySelector(".sp-hint");
      const showHint = ()=>{
        hint.textContent = "";
        const sug = emailSuggest(email.value.trim());
        if(!sug) return;
        hint.append("Tu voulais dire ");
        const b = document.createElement("button"); b.type = "button"; b.textContent = sug;
        b.addEventListener("click", ev=>{ ev.stopPropagation(); email.value = sug; hint.textContent = ""; hideConfirm(); });
        hint.append(b, " ?");
      };
      email.addEventListener("blur", showHint);
      email.addEventListener("input", ()=>{ hint.textContent = ""; hideConfirm(); });
      // 10.26 : avant de créer le compte, l'adresse est réaffichée en grand
      const confirmBox = pop.querySelector(".sp-confirm");
      const hideConfirm = ()=>{ confirmBox.hidden = true; confirmBox.textContent = ""; };
      pop.querySelector(".sp-create").addEventListener("click", e=>{
        e.stopPropagation();
        const addr = email.value.trim();
        msg.textContent = "";
        if(!addr){ msg.textContent = "Écris d'abord ton adresse e-mail."; email.focus(); return; }
        if(!pw.value){ msg.textContent = "Il manque le mot de passe."; pw.focus(); return; }
        const sug = emailSuggest(addr);
        confirmBox.innerHTML = `Le compte sera créé pour :<span class="sp-addr">${escapeAttr(addr)}</span>`
          + (sug ? `<div class="sp-hint" style="margin:0 0 0.5rem">Tu voulais dire <button type="button" class="sp-fix">${escapeAttr(sug)}</button> ?</div>` : "")
          + `<div class="rp-opts"><button type="button" class="sp-yes">Oui, c'est ça</button><button type="button" class="sp-no rp-none">Corriger</button></div>`;
        confirmBox.hidden = false;
        if(document.activeElement) document.activeElement.blur();
        const fix = confirmBox.querySelector(".sp-fix");
        if(fix) fix.addEventListener("click", ev=>{ ev.stopPropagation(); email.value = sug; hint.textContent = ""; pop.querySelector(".sp-create").click(); });
        confirmBox.querySelector(".sp-yes").addEventListener("click", ev=>{ ev.stopPropagation(); hideConfirm(); run(()=> Sync.createEmail(addr, pw.value)); });
        confirmBox.querySelector(".sp-no").addEventListener("click", ev=>{ ev.stopPropagation(); hideConfirm(); email.focus(); });
      });
      pop.querySelector(".sp-forgot").addEventListener("click", e=>{
        e.stopPropagation();
        if(!email.value.trim()){ msg.textContent = "Écris d'abord ton adresse e-mail juste au-dessus."; email.focus(); return; }
        run(()=> Sync.resetPassword(email.value.trim()), "Un e-mail est parti pour choisir un nouveau mot de passe.");
      });
      pw.addEventListener("keydown", e=>{ if(e.key === "Enter"){ e.preventDefault(); pop.querySelector(".sp-login").click(); } });
    }
    // 10.6 : copie de secours (fichier), discrète, dans les deux états
    const bk = document.createElement("div");
    bk.className = "sp-backup";
    bk.innerHTML = `<button type="button" class="sp-export">Copie de secours</button><span aria-hidden="true">·</span><button type="button" class="sp-import">Restaurer</button>`;
    bk.querySelector(".sp-export").addEventListener("click", e=>{ e.stopPropagation(); closeRelancePop(); document.getElementById("exportBtn").click(); });
    bk.querySelector(".sp-import").addEventListener("click", e=>{ e.stopPropagation(); closeRelancePop(); document.getElementById("importFile").click(); });
    pop.appendChild(bk);
    openPopAt(pop, plume);
  }
  plume.addEventListener("click", e=>{ e.stopPropagation(); if(relancePop && relancePop.classList.contains("sync-pop")) closeRelancePop(); else open(); });
  // 10.2 : arrivé par un lien d'invitation sans être connecté : la fenêtre s'ouvre d'elle-même
  let invitePrompted = false;
  Sync.onAuthChange = u=>{
    if(u || invitePrompted || !pendingInvite()) return;
    invitePrompted = true;
    setTimeout(()=>{ if(!Sync.user && !(relancePop && relancePop.classList.contains("sync-pop"))) open(); }, 300);
  };
  // à la connexion réussie, la fenêtre se referme d'elle-même (open() la recrée au besoin)
})();
// ---- 10.2 : partage — branchements avec la synchro ----
Sync.onInvites = ()=>{ if(shareOpen) renderShare(); };
Sync.onInviteUsed = inv=>{
  if(shareNewLink && shareNewLink.code === inv.code) shareNewLink = null;   // le lien affiché a servi
  if(noteInviteUsed(inv)) renderAll();
};
Sync.onLinked = ()=>{ acceptPendingInvite(); renderAll(); };
Sync.start();
</script>

// ---- 7.8 : tapis en filigrane sur l'accueil sans liste ----
let watermarkEl = null, watermarkKey = "";
function updateWatermark(show){
  try{
    const wrap = document.querySelector(".wrap");
    const row = document.getElementById("addCategoryRow");
    const ref = document.querySelector(".progress-card");
    if(!show || !wrap || !row || !ref || typeof TAPIS === "undefined"){
      if(row) row.style.marginTop = "";
      if(watermarkEl){
        const el = watermarkEl; watermarkEl = null; watermarkKey = "";
        el.classList.add("leaving");                 // fondu de sortie
        setTimeout(()=> el.remove(), 750);
      }
      return;
    }
    // largeur des cases, de sous la case compteur jusqu'au bas de la fenêtre
    const wr = wrap.getBoundingClientRect(), rr = ref.getBoundingClientRect();
    const width = rr.width;
    const VW = width >= 600 ? 560 : 400, scale = width / VW;
    const top = rr.bottom - wr.top + 18;
    const height = Math.max(240, window.innerHeight - rr.bottom - 18 - 12);
    const VH = Math.round(height / scale);
    // le bouton d'accueil se pose au centre du tapis (sur le médaillon)
    // … et le champ du nom, plus haut, comme un commencement
    // (marge mesurée au même instant que la position, pour rester juste
    // même pendant le glissement en cours)
    const btn = row.querySelector(".onboarding") || row;
    const brr = btn.getBoundingClientRect();
    const aim = 0.5; // bouton et champ du nom : même centre
    const baseM = 0.85 * parseFloat(getComputedStyle(document.documentElement).fontSize);
    const curM = parseFloat(getComputedStyle(row).marginTop) || baseM;
    const naturalCenter = brr.top - (curM - baseM) + brr.height / 2;
    const shift = Math.max(0, (rr.bottom + 18 + height * aim) - naturalCenter);
    row.style.marginTop = Math.round(baseM + shift) + "px";
    if(!watermarkEl){
      watermarkEl = document.createElement("div");
      watermarkEl.className = "tapis-watermark";
      watermarkEl.setAttribute("aria-hidden", "true");
      wrap.insertBefore(watermarkEl, wrap.firstChild);
    }
    watermarkEl.style.left = (rr.left - wr.left) + "px";
    watermarkEl.style.top = top + "px";
    watermarkEl.style.width = width + "px";
    watermarkEl.style.height = height + "px";
    const key = VW + "x" + VH;
    if(key !== watermarkKey){
      watermarkKey = key;
      const svg = TAPIS.build(VW, VH);
      const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
      const old = watermarkEl.dataset.url;
      watermarkEl.style.backgroundImage = `url("${url}")`;
      watermarkEl.dataset.url = url;
      if(old) setTimeout(()=> URL.revokeObjectURL(old), 1000);
    }
  }catch(err){ console.error("[filigrane]", err); }
}

// 7.24 : l'heure n'a de sens qu'avec une échéance
function linkTimeToDate(dateInp, timeInp){
  if(!dateInp || !timeInp) return ()=>{};
  const sync = ()=>{
    const off = !dateInp.value;
    if(off) timeInp.value = "";
    timeInp.disabled = off;
  };
  dateInp.addEventListener("input", sync);
  dateInp.addEventListener("change", sync);
  sync();
  return sync;
}

// Tout texte saisi (titre, note, nom…) passe par ici avant d'entrer dans le
// HTML : un « < » dans une tâche s'affiche tel quel au lieu d'être lu comme
// une balise (et une sauvegarde reçue de quelqu'un ne peut rien exécuter).
function escapeAttr(s){
  return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function getEffectiveItems(cat){
  return cat.items.concat(customItems[cat.id] || []);
}

// 9.1 : majuscule à la première lettre d'un titre (à l'affichage seulement)
function capFirst(t){
  const str = String(t == null ? "" : t);
  const i = str.search(/\S/);
  return i < 0 ? str : str.slice(0, i) + str.charAt(i).toLocaleUpperCase("fr") + str.slice(i + 1);
}
function getEffective(key, base){
  const o = overrides[key] || {};
  const waiting = o.waiting !== undefined ? !!o.waiting : !!base.waiting;
  let due = o.due !== undefined ? o.due : (base.due || "");
  let relance = o.relance !== undefined ? o.relance : base.relance;
  if(waiting && relance === undefined){
    // ancien format (≤ 7.5) : la date de relance vivait dans « due »
    relance = due;
    due = o.dueBeforeWaiting !== undefined ? o.dueBeforeWaiting : "";
  }
  return {
    t: capFirst(o.t !== undefined ? o.t : base.t),
    note: o.note !== undefined ? o.note : base.note,
    urgent: o.urgent !== undefined ? !!o.urgent : !!base.urgent,
    due,                       // échéance (masquée tant que la tâche est en cours)
    relance: waiting ? (relance || "") : "", // relance (n'existe qu'en cours)
    who: o.who !== undefined ? o.who : (base.who || ""),
    waiting,
    egg: o.egg !== undefined ? !!o.egg : !!base.egg,
    person: base.person,
    tier: base.tier,
    q: o.q !== undefined ? o.q : (base.q || ""),   // 10.15 : quantité d'un article de courses
  };
}

function todayISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function addDaysISO(iso, n){
  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function splitDue(due){
  if(!due) return {date:"", time:""};
  const [date, time] = due.split("T");
  return {date: date || "", time: time || ""};
}

function periodOfDay(time){
  if(!time) return "";
  const hh = parseInt(time.split(":")[0], 10);
  if(hh < 12) return "matin";
  if(hh < 18) return "aprèm";
  return "soir";
}

function dueStatus(due){
  if(!due) return null;
  const {date} = splitDue(due);
  const today = todayISO();
  if(date < today) return "overdue";
  if(date === today) return "today";
  if(date === addDaysISO(today, 1)) return "tomorrow";
  return "future";
}

// Seuil d'urgence par l'échéance (5.11) : J-2, veille, jour J ou retard.
// Le badge garde son libellé habituel (« Mercredi », « Demain »…).
const DUE_URGENT_DAYS = 2;
function isDueUrgent(due){
  if(!due) return false;
  const {date} = splitDue(due);
  return date <= addDaysISO(todayISO(), DUE_URGENT_DAYS);
}

// « Relance » (5.21) : une tâche en cours dont la date est arrivée (jour J
// ou dépassée). Rien n'est modifié dans les données : c'est un état calculé.
// Elle revient alors dans la case urgente et dans le compteur, avec sa
// couleur propre ; la sortir d'« En cours » à la main lui ôte ce statut.
function isRelance(eff){
  return !!(eff && eff.waiting && eff.relance && splitDue(eff.relance).date <= todayISO());
}

const WEEKDAYS_FR = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];

function weekdayNameFR(dateISO){
  const d = new Date(dateISO + "T00:00:00");
  return WEEKDAYS_FR[d.getDay()];
}

function formatDueLabel(due, isRdv){
  const status = dueStatus(due);
  const {date, time} = splitDue(due);
  const [y,m,d] = date.split("-");
  const short = `${parseInt(d,10)}/${parseInt(m,10)}`;
  const timeSuffix = time ? ` ${periodOfDay(time)}` : "";
  let label;
  if(status === "overdue") label = "En retard — " + short + timeSuffix;
  else if(status === "today") label = "Aujourd'hui" + timeSuffix;
  else if(status === "tomorrow") label = "Demain" + timeSuffix;
  else{
    const daysDiff = Math.round((new Date(date + "T00:00:00") - new Date(todayISO() + "T00:00:00")) / 86400000);
    if(daysDiff >= 0 && daysDiff <= 6){
      const wd = weekdayNameFR(date);
      label = wd.charAt(0).toUpperCase() + wd.slice(1) + timeSuffix;
    }else{
      label = "Éch. " + short + timeSuffix;
    }
  }

function isRdvTitle(t){

function isDeleted(key){

// ---- 10.2 : listes partagées ----
// Une tâche garde qui l'a créée (base.by) et qui l'a cochée (override
// doneBy) ; sans ces champs (tâches d'avant), c'est le créateur de la liste.
// Sans compte (ou appareil jamais connecté) : tout est à moi, comme avant.
function myUid(){ try{ return Store.myUid(); }catch(e){ return null; } }
function listInfo(catId){ try{ return Store.listInfo(catId); }catch(e){ return null; } }
function isSharedList(catId){
  const i = listInfo(catId);
  if(!i) return false;
  const me = myUid();
  if(i.owner && me && i.owner !== me) return true;
  return i.members.some(m => m !== "moi" && m !== i.owner && m !== me);
}
function iOwnList(catId){
  const i = listInfo(catId), me = myUid();
  return !i || !i.owner || !me || i.owner === me;
}
function listOwnerUid(catId){ const i = listInfo(catId); return (i && i.owner) || myUid() || null; }
// qui a créé la tâche (pour la recopier telle quelle d'une liste à l'autre)
function taskCreator(cat, base){ return (base && typeof base.by === "string" && base.by) || listOwnerUid(cat.id); }
// effacer, mettre à la corbeille, emporter dans une autre liste : le créateur
// de la liste peut tout ; un invité, seulement les tâches qu'il a créées
function canRemoveTask(cat, base){
  if(iOwnList(cat.id)) return true;
  if(isCoursesList(cat.id)) return true;   // 10.15 : dans une liste de courses, chacun efface tout article
  const me = myUid();

function checkerOf(catId, key){

}
// la coche compte pour moi (compteur, purge du lundi, graphique) ?
function checkedByMe(catId, key){

  const c = checkerOf(catId, key);

}
function myName(){

  return (typeof n === "string" && n.trim()) ? n.trim() : "Moi";
}
function contactsMap(){

  return (c && typeof c === "object" && !Array.isArray(c)) ? c : {};

function personName(uid, catId){
  if(!uid) return "?";
  if(uid === myUid()) return myName();
  const i = catId ? listInfo(catId) : null;
  if(i && i.owner === uid && i.names[uid]) return i.names[uid];   // le prénom que le créateur s'est choisi

// ---- 10.31 : nouveautés dans les listes partagées (voir NOTE, 10.31) ----
// Mémoire locale (propre à l'appareil) : { c: { idListe: index à partir
// duquel une tâche peut être nouvelle }, s: { cléTâche: date où je l'ai vue
// à l'écran pour la première fois } }. Une tâche ajoutée par quelqu'un
// d'autre reste « new » au moins 24 h après cette première vue.
const SEEN_KEY = "sous-le-tapis-vu";
const NEW_FOR_MS = 24 * 3600 * 1000;
let seenMap = (()=>{ try{ const o = JSON.parse(localStorage.getItem(SEEN_KEY) || "{}"); return { c: (o && o.c) || {}, s: (o && o.s) || {} }; }catch(e){ return { c:{}, s:{} }; } })();
function saveSeen(){ try{ localStorage.setItem(SEEN_KEY, JSON.stringify(seenMap)); }catch(e){} }
// index des tâches ajoutées par d'autres, encore « new » (ni effacées, ni cochées)
function newFromOthers(cat){
  try{
    if(!isSharedList(cat.id)) return [];
    const me = myUid();
    if(!me) return [];
    const items = getEffectiveItems(cat);
    if(typeof seenMap.c[cat.id] !== "number"){ seenMap.c[cat.id] = items.length; saveSeen(); return []; }   // première rencontre : rien de nouveau
    const now = Date.now(), out = [];
    for(let i = seenMap.c[cat.id]; i < items.length; i++){
      const b = items[i], key = itemKey(cat.id, i);
      if(!b || !b.by || b.by === me || isDeleted(key) || state[key]) continue;
      const t = seenMap.s[key];
      if(t && now - t >= NEW_FOR_MS) continue;
      out.push(i);
    }
    return out;
  }catch(e){ return []; }
}
// première vue à l'écran : le compte à rebours des 24 h démarre ;
// ménage : les tâches dont les 24 h sont passées sortent de la mémoire
function noteShown(){
  if(document.visibilityState !== "visible") return;
  const now = Date.now();
  let changed = false;
  DATA.forEach(c => {
    if(isCategoryDeleted(c.id) || typeof seenMap.c[c.id] !== "number") return;
    newFromOthers(c).forEach(i => { const k = itemKey(c.id, i); if(!seenMap.s[k]){ seenMap.s[k] = now; changed = true; } });
    // avance le seuil tant que les premières tâches ne peuvent plus être nouvelles
    const items = getEffectiveItems(c), me = myUid();
    let i = seenMap.c[c.id];
    while(i < items.length){
      const b = items[i], k = itemKey(c.id, i), t = seenMap.s[k];
      const stillNew = b && b.by && b.by !== me && !isDeleted(k) && !state[k] && !(t && now - t >= NEW_FOR_MS);
      if(stillNew) break;
      delete seenMap.s[k]; i++;
    }
    if(i !== seenMap.c[c.id]){ seenMap.c[c.id] = i; changed = true; }
  });
  if(changed) saveSeen();
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "visible") noteShown(); });
// message quand une tâche d'un autre arrive pendant qu'on regarde
let prevNewKeys = null;

}

// ---- 10.15 : listes de courses ----
// Une liste dont la fiche porte type: "courses" (sans ce champ : liste
// normale, comme toutes celles d'avant). Un article rayé est une tâche
// « cochée » (même champ), mais une liste de courses reste hors du compteur,
// du graphique, de la purge du lundi, de la corbeille, de la case urgente et
// du trèfle : rayer le lait ne fait jamais tourner le compteur.
function isCoursesList(catId){ try{ return Store.listField(catId, "type") === "courses"; }catch(e){ return false; } }
// passer une liste en liste de courses (on) ou la rendre normale (off) : seul
// le champ type change, aucune tâche n'est touchée (retour possible à l'identique)
function setCoursesList(catId, on){
  try{ return Store.setListField(catId, "type", on ? "courses" : undefined); }catch(e){ return false; }
}
// « Pâtes  fraîches » ≈ « pates fraiches » : pour repérer un article déjà là
function coursesNorm(t){
  return String(t == null ? "" : t).normalize("NFD").replace(/[̀-ͯ]/g, "")
    .toLocaleLowerCase("fr").replace(/\s+/g, " ").trim();
}
// une ligne collée depuis une note : puce, case ou numéro en tête retirés
function coursesCleanLine(s){
  return String(s || "").replace(/^\s*(?:[-–—•*·▪◦●○☐☑✓✔]\s*|\[[ xX]?\]\s*|\d+[.)]\s+)/, "").replace(/\s+/g, " ").trim();
}
// Quantité d'un article : « 2 lait », « 2x lait », « lait x2 », « 500 g de
// farine », « 1,5 kg pommes », « 3 pots de yaourt »… → { t:"lait", q:"2" }.
// Rangée à part (champ q de la tâche), pour que « 2 lait » et « lait »
// restent le même article (doublons, suggestions).
const COURSES_UNITS = "kg|kilos?|g|gr|grammes?|mg|l|litres?|cl|dl|ml|pcs?|pi[eè]ces?|paquets?|bo[iî]tes?|bouteilles?|sachets?|tranches?|pots?|briques?|bottes?|barquettes?|filets?|douzaines?|boules?|t[eê]tes?";
const COURSES_UNIT_CANON = { kilo:"kg", kilos:"kg", gr:"g", gramme:"g", grammes:"g", litre:"l", litres:"l" };
const COURSES_LEAD_RE = new RegExp(`^(?:[x×]\\s*)?(\\d+(?:[.,]\\d+)?)(?:\\s*(${COURSES_UNITS})\\.?(?=\\s)|\\s*[x×](?=\\s)|(?=\\s))\\s+(?:de\\s+|d['’]\\s*)?(\\S.*)$`, "i");
const COURSES_TAIL_RE = new RegExp(`^(.*\\S)\\s+(?:[x×]\\s*(\\d+)|(\\d+(?:[.,]\\d+)?)\\s*(kg|g|gr|l|cl|ml)\\.?)$`, "i");
const COURSES_QTY_RE = new RegExp(`^(?:[x×]\\s*)?(\\d+(?:[.,]\\d+)?)\\s*(?:(${COURSES_UNITS})\\.?|[x×])?$`, "i");
function coursesQty(num, unit){
  const u = unit ? unit.toLocaleLowerCase("fr") : "";
  return num.replace(".", ",") + (u ? " " + (COURSES_UNIT_CANON[u] || u) : "");
}
function parseCoursesLine(line){
  const s = coursesCleanLine(line);
  let m = s.match(COURSES_LEAD_RE);
  if(m) return { t: m[3].trim(), q: coursesQty(m[1], m[2]) };
  m = s.match(COURSES_TAIL_RE);
  if(m) return { t: m[1].trim(), q: m[2] ? m[2] : coursesQty(m[3], m[4]) };
  return { t: s, q: "" };
}
// ce qu'on tape dans le champ « quantité » : « 2 », « x2 », « 500g » remis en
// forme ; autre chose (« un peu ») gardé tel quel
function normCoursesQty(v){
  const s = String(v || "").replace(/\s+/g, " ").trim();
  const m = s.match(COURSES_QTY_RE);
  return m ? coursesQty(m[1], m[2]) : s;
}
// affichage : un nombre seul se lit « ×2 », sinon tel quel (« 500 g »)
function coursesQtyLabel(q){ return /^\d+(?:,\d+)?$/.test(q) ? "×" + q : q; }
// les articles affichés d'une liste de courses, dans l'ordre enregistré
function coursesRows(cat){
  const items = getEffectiveItems(cat);
  return getCatOrder(cat)
    .map(idx => ({ idx, key: itemKey(cat.id, idx), base: items[idx] }))
    .filter(r => r.base && !isDeleted(r.key) && !getEffective(r.key, r.base).waiting);
}
// Rayer / dé-rayer : la coche de la tâche (et qui l'a posée, pour l'initiale
// d'une liste partagée), sans date de coche — rien ne compte au compteur.
function writeStruck(key, on){
  state = loadState();
  state[key] = on;
  saveState(state);
  checkedAt = loadJSONKey(CHECKED_AT_KEY, {});
  if(checkedAt[key]){ delete checkedAt[key]; saveJSONKey(CHECKED_AT_KEY, checkedAt); }
  const me = myUid();
  overrides = loadOverrides();
  const o = overrides[key];
  if(on && me && !(o && o.doneBy === me)){
    overrides[key] = Object.assign({}, o || {}, { doneBy: me });
    saveOverrides(overrides);
  }else if(!on && o && o.doneBy !== undefined){
    const rest = Object.assign({}, o);
    delete rest.doneBy;
    if(Object.keys(rest).length) overrides[key] = rest; else delete overrides[key];
    saveOverrides(overrides);
  }
}
function setStruck(key, on){
  writeStruck(key, on);
  if(on){ haptic.tap(); justCheckedKey = key; }
  renderAll();
  justCheckedKey = null;
}
// retirer un article : effacé comme une tâche (il reste dans la fiche, marqué
// effacé), jamais envoyé à la corbeille
function removeCoursesItem(key){
  overrides = loadOverrides();
  overrides[key] = overrides[key] || {};
  overrides[key].deleted = true;
  saveOverrides(overrides);
  checkedAt = loadJSONKey(CHECKED_AT_KEY, {});
  if(checkedAt[key]){ delete checkedAt[key]; saveJSONKey(CHECKED_AT_KEY, checkedAt); }
}
// historique des articles (suggestions) : le plus récent en dernier, sans doublon
const COURSES_HISTORY_MAX = 300;
function coursesHistory(catId){
  const h = (()=>{ try{ return Store.listField(catId, "history"); }catch(e){ return undefined; } })();
  return Array.isArray(h) ? h.filter(x => typeof x === "string") : [];
}
function coursesHistoryAdd(catId, titles){
  let h = coursesHistory(catId);
  titles.forEach(t=>{
    const n = coursesNorm(t);
    h = h.filter(x => coursesNorm(x) !== n);
    h.push(t);
  });
  try{ Store.setListField(catId, "history", h.slice(-COURSES_HISTORY_MAX)); }catch(e){ console.error("[courses] historique", e); }
}
// quantité d'un article déjà là (dans ses modifications, comme un titre)
function writeCoursesQty(key, q){
  overrides = loadOverrides();
  overrides[key] = Object.assign({}, overrides[key] || {}, { q });
  saveOverrides(overrides);
}
// Une ou plusieurs lignes (collées ou tapées) : un article par ligne, en bas
// de la liste, avec sa quantité s'il y en a une. Un article déjà là et rayé
// est dé-rayé au lieu d'être doublé (avec la nouvelle quantité, ou sans) ;
// déjà là et pas rayé : seule la quantité change, si on en a donné une.
function addCoursesLines(cat, text){
  const res = { added:0, revived:0, already:0, qty:0, lastKey:null };
  const lines = String(text || "").split(/\r?\n/).map(parseCoursesLine).filter(p => p.t);
  const seen = new Set(), hist = [];
  lines.forEach(({ t, q })=>{
    const n = coursesNorm(t);
    if(!n || seen.has(n)) return;
    seen.add(n);
    hist.push(capFirst(t));
    // copie fraîche à chaque ligne : la précédente vient peut-être d'arriver
    state = loadState(); overrides = loadOverrides(); customItems = loadCustom(); order = loadOrder();
    const hit = coursesRows(cat).find(r => coursesNorm(getEffective(r.key, r.base).t) === n);
    if(hit){
      const oldQ = getEffective(hit.key, hit.base).q;
      if(state[hit.key]){
        writeStruck(hit.key, false);
        if(q !== oldQ) writeCoursesQty(hit.key, q);   // nouvelles courses, nouvelle quantité
        res.revived++;
      }else if(q && q !== oldQ){ writeCoursesQty(hit.key, q); res.qty++; }
      else res.already++;
      res.lastKey = hit.key;
      return;
    }
    const item = { t };
    if(q) item.q = q;
    const idx = insertItem(cat, item);
    res.added++;
    res.lastKey = itemKey(cat.id, idx);
  });
  if(hist.length) coursesHistoryAdd(cat.id, hist);
  return res;
}
// « Trier » : les articles pas rayés remontent, chacun gardant son ordre
function sortCourses(cat){
  state = loadState(); overrides = loadOverrides(); customItems = loadCustom(); order = loadOrder();
  const rows = coursesRows(cat);
  const idxs = rows.filter(r => !state[r.key]).concat(rows.filter(r => state[r.key])).map(r => r.idx);
  applyCatDisplayOrder(cat, idxs);
  saveOrder(order);
}
function coursesSorted(cat){
  let seenStruck = false;
  return coursesRows(cat).every(r => { if(state[r.key]){ seenStruck = true; return true; } return !seenStruck; });
}
// « Vider les rayés » : tous les articles rayés sont retirés, qui que soit leur auteur
function clearStruckCourses(cat){
  state = loadState(); overrides = loadOverrides(); customItems = loadCustom(); order = loadOrder();
  const keys = coursesRows(cat).filter(r => state[r.key]).map(r => r.key);
  if(!keys.length) return 0;
  checkedAt = loadJSONKey(CHECKED_AT_KEY, {});
  keys.forEach(k=>{
    overrides[k] = overrides[k] || {};
    overrides[k].deleted = true;
    delete checkedAt[k];
  });
  saveOverrides(overrides);
  saveJSONKey(CHECKED_AT_KEY, checkedAt);
  return keys.length;
}
// suggestions dès 2 lettres : l'historique de la liste (plus récents d'abord)
// et ses articles rayés ; pas ceux déjà dans la liste et pas rayés
function coursesSuggestions(cat, q){
  const n = coursesNorm(q);
  if(n.length < 2) return [];
  const live = new Map();
  coursesRows(cat).forEach(r => live.set(coursesNorm(getEffective(r.key, r.base).t), !!state[r.key]));
  const cands = coursesHistory(cat.id).slice().reverse();
  coursesRows(cat).forEach(r => { if(state[r.key]) cands.push(getEffective(r.key, r.base).t); });
  const out = [], seen = new Set();
  cands.forEach(t=>{
    const k = coursesNorm(t);
    if(seen.has(k) || live.get(k) === false) return;
    seen.add(k);
    const pos = k.indexOf(n);
    if(pos < 0) return;
    out.push({ t: capFirst(t), struck: live.get(k) === true, rank: pos === 0 ? 0 : (k[pos - 1] === " " ? 1 : 2) });
  });
  return out.sort((a, b) => a.rank - b.rank).slice(0, 6);
}
const BASKET_SVG = `<svg class="cat-basket" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 9.5h17l-1.6 9.1a1.8 1.8 0 0 1-1.8 1.4H6.9a1.8 1.8 0 0 1-1.8-1.4z"/><path d="M8.5 9.5 11 4M15.5 9.5 13 4"/><path d="M9.5 13.5v3M14.5 13.5v3"/></svg>`;

// les autres personnes qui voient cette liste (créateur compris, moi exclu)
function listPeople(catId){
  const i = listInfo(catId), me = myUid();
  if(!i) return [];
  const all = [];
  if(i.owner) all.push(i.owner);
  i.members.forEach(m => { if(m !== "moi" && !all.includes(m)) all.push(m); });
  return all.filter(u => u !== me);
}

// Le glisser-déposer manuel est prioritaire : on ne repartitionne que
// coché/non-coché, sans jamais retrier par échéance — l'ordre manuel
// (déjà appliqué en amont via getCatOrder/getWaitingOrder) est respecté tel quel.
function sortByUrgencyThenChecked(rows){
  const unchecked = rows.filter(r => !state[r.key]);
  const checked = rows.filter(r => state[r.key]);
  return unchecked.concat(checked);
}

function getTotalItems(){
  // Le total inclut les tâches "en attente" : elles restent dans le décompte
  // et comptent comme faites (voir getDoneCount). Envoyer une tâche "dans leur
  // camp", c'est avoir fait sa part — elle ne disparaît donc plus du compteur.
  return DATA.reduce((n,c)=>{
    if(isCoursesList(c.id)) return n;   // 10.15 : hors compteur
    const items = getEffectiveItems(c);
    let count = 0;
    items.forEach((base,i)=>{
      const key = itemKey(c.id,i);
      if(isDeleted(key)) return;
      if(getEffective(key, base).egg && !state[key]) return; // en couvaison : hors compteur
      count++;
    });
    return n + count;
  }, 0);
}

function getWeekDoneCount(){
  const monday = mondayOf(todayISO());
  checkedAt = loadJSONKey(CHECKED_AT_KEY, {});
  let n = 0;
  DATA.forEach(cat=>{
    if(isCoursesList(cat.id)) return;   // 10.15
    getEffectiveItems(cat).forEach((base,i)=>{
      const key = itemKey(cat.id,i);
      if(isDeleted(key) || !state[key]) return;
      if(!checkedByMe(cat.id, key)) return; // 10.2 : seul le compteur de qui a coché bouge
      if((checkedAt[key] || "") >= monday) n++;
    });
  });
  // + celles cochées cette semaine puis déjà parties à la corbeille
  loadJSONKey(TRASH_KEY, []).forEach(e=>{
    if(e && e.kind !== "deleted" && (e.doneOn || "") >= monday) n++;
  });
  // + les envois dans « En cours » de la semaine (8.1)
  waitLog().forEach(e=>{ if(e && (e.on || "") >= monday) n++; });
  return n;
}

function getDoneCount(){
  // Une tâche est "faite" si elle est cochée OU si elle est "en attente"
  // (dans leur camp). Renvoyer une tâche dans sa liste la retire donc du
  // décompte — c'est automatiquement réversible.
  let count = 0;
  DATA.forEach(cat=>{
    if(isCoursesList(cat.id)) return;   // 10.15
    const items = getEffectiveItems(cat);
    items.forEach((base,i)=>{
      const key = itemKey(cat.id,i);
      if(isDeleted(key)) return;
      const eff = getEffective(key, base);
      if(eff.egg && !state[key]) return;
      if((eff.waiting && !isRelance(eff)) || state[key]) count++;
    });
  });
  return count;
}

function getCatOrder(cat){
  const items = getEffectiveItems(cat);
  const n = items.length;
  const existing = order[cat.id] || [];
  const seen = new Set();
  const kept = [];
  existing.forEach(i=>{
    if(i < n && !seen.has(i)){ kept.push(i); seen.add(i); }
  });
  for(let i=0;i<n;i++){
    if(!seen.has(i)) kept.push(i);
  }
  order[cat.id] = kept;
  return order[cat.id];
}

function hasAnyList(){
  return getCategoryOrder().some(i => DATA[i] && !isCategoryDeleted(DATA[i].id));
}

function getCategoryOrder(){
  // Comme pour l'ordre des tâches d'une catégorie (getCatOrder) : on garde
  // les positions déjà connues et on ajoute les nouvelles à la fin, plutôt
  // que de tout réinitialiser dès que le nombre de catégories change — sinon
  // ajouter une catégorie remettrait tout l'ordre existant à zéro.
  const n = DATA.length;
  const existing = order.__categories__ || [];
  const seen = new Set();
  const kept = [];
  existing.forEach(i=>{
    if(typeof i === "number" && i >= 0 && i < n && !seen.has(i)){
      kept.push(i);
      seen.add(i);
    }
  });
  for(let i=0;i<n;i++){
    if(!seen.has(i)) kept.push(i);
  }
  order.__categories__ = kept;
  return order.__categories__;
}

function urgentEntryRank(entry){
  const rank = { overdue:0, today:1, tomorrow:2 };
  return entry.status && rank[entry.status] !== undefined ? rank[entry.status] : 3;
}

function compareUrgentEntries(a, b){
  const ra = urgentEntryRank(a), rb = urgentEntryRank(b);
  if(ra !== rb) return ra - rb;
  if(a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1;
  if(a.due && !b.due) return -1;
  if(!a.due && b.due) return 1;
  return 0;
}

// Toute entrée déjà connue garde exactement sa position manuelle
// (glisser-déposer), sans jamais être retriée ensuite. Une entrée qui
// vient d'apparaître arrive tout en haut de la liste (avant toutes les
// entrées déjà connues), triée avec les autres nouveautés du même
// passage selon leur urgence/échéance.
function getUrgentOrder(entries){
  const byKey = new Map(entries.map(e => [e.key, e]));
  // L'ordre de la case urgente est relu sur le disque et réenregistré : avant
  // la 5.9 il ne vivait qu'en mémoire et se perdait dès qu'une autre action
  // relisait l'ordre (ajout, déplacement…), si bien qu'une nouvelle tâche
  // urgente atterrissait n'importe où au lieu d'en haut.
  const disk = loadOrder();
  const existing = disk.__urgent__ || order.__urgent__ || [];
  // 5.10 : une tâche déjà présente dans la case qui ARRIVE à l'échéance
  // (veille, jour J ou retard) remonte une fois en tête, comme une nouvelle.
  // __urgentDue__ retient celles déjà remontées pour ne pas les remonter à
  // chaque rendu. Premier passage : on note l'existant sans rien bouger.
  const isDueNow = e => isDueUrgent(e.due);
  const firstRun = !Array.isArray(disk.__urgentDue__);
  const promoted = new Set(firstRun ? [] : disk.__urgentDue__);
  const dueNow = entries.filter(isDueNow).map(e => e.key);
  const toPromote = firstRun ? new Set() : new Set(dueNow.filter(k => !promoted.has(k)));
  const seen = new Set();
  const kept = [];
  existing.forEach(k=>{
    if(byKey.has(k) && !seen.has(k) && !toPromote.has(k)){ kept.push(k); seen.add(k); }
  });
  const fresh = [];
  entries.forEach(e=>{
    if(seen.has(e.key)) return;
    fresh.push(e);
    seen.add(e.key);
  });
  fresh.sort(compareUrgentEntries);
  const result = fresh.map(e => e.key).concat(kept);
  order.__urgent__ = result;
  order.__urgentDue__ = dueNow;
  const changed = JSON.stringify(disk.__urgent__ || []) !== JSON.stringify(result)
    || JSON.stringify(disk.__urgentDue__ || null) !== JSON.stringify(dueNow);
  if(changed){
    disk.__urgent__ = result;
    disk.__urgentDue__ = dueNow;
    saveOrder(disk);
  }
  return result;
}

// Même principe que getUrgentOrder, mais pour la section « En cours ».
function getWaitingOrder(rows){
  // 5.18 : ordre enregistré (comme la case urgente) ; une tâche qui arrive
  // en cours se place en haut, les autres gardent leur place manuelle.
  const byKey = new Map(rows.map(r => [r.key, r.eff]));
  const disk = loadOrder();
  const existing = disk.__waiting__ || order.__waiting__ || [];
  const seen = new Set();
  const kept = [];
  existing.forEach(k=>{
    if(byKey.has(k) && !seen.has(k)){ kept.push(k); seen.add(k); }
  });
  const fresh = rows.filter(r => !seen.has(r.key)).map(r => r.key);
  const result = fresh.concat(kept);
  order.__waiting__ = result;
  if(JSON.stringify(disk.__waiting__ || []) !== JSON.stringify(result)){
    disk.__waiting__ = result;
    saveOrder(disk);
  }
  return result;
}

function collectUrgentItems(){
  const out = [];
  DATA.forEach(cat=>{
    if(isCoursesList(cat.id)) return;   // 10.15 : un article n'est jamais urgent
    const items = getEffectiveItems(cat);
    items.forEach((base,i)=>{
      const key = itemKey(cat.id, i);
      if(isDeleted(key)) return;
      if(state[key]) return;
      const eff = getEffective(key, base);
      if(eff.egg) return;
      const relance = isRelance(eff);
      if(eff.waiting && !relance) return;
      const shown = eff.waiting ? eff.relance : eff.due; // en cours : seule la relance compte
      const status = dueStatus(shown);
      const dueUrgent = !eff.waiting && isDueUrgent(eff.due);
      if(relance || eff.urgent || dueUrgent){
        out.push({ key, catId: cat.id, catTitle: cat.title, text: eff.t, note: eff.note || "", due: shown, status, isRdv: isRdvTitle(eff.t), manual: !!eff.urgent, relance });
      }
    });
  });
  const manualOrder = getUrgentOrder(out);
  out.sort((a,b)=> manualOrder.indexOf(a.key) - manualOrder.indexOf(b.key));
  return out;
}

// ---------- glisser-déposer avec prévisualisation en direct ----------
let dragState = null; // { el, value, dragMode, cat }

// ---------- petites vibrations (8.31, revues en 8.32) ----------
// Deux mécanismes, selon le téléphone :
// - Android : navigator.vibrate. haptic.tick() (léger : emplacement qui
//   s'aimante, ligne soulevée, tâche qui défile dans un rouleau) et
//   haptic.tap() (net) et haptic.strong() (tâche cochée), appelables n'importe
//   quand. Les tics trop rapprochés (< 30 ms) sont fondus en un seul.
// - iPhone : pas de navigator.vibrate. Le seul tic possible est celui de
//   l'interrupteur système (<input type="checkbox" switch>, Safari 17.4+),
//   et depuis iOS 26.5 il faut un VRAI toucher dessus ou sur son label :
//   un clic déclenché par le code reste muet. haptic.attach(el) pose donc
//   sur el un label transparent relié à un interrupteur caché ; le toucher
//   bascule l'interrupteur (tic), puis le clic est rejoué sur el. tick() et
//   tap() n'y font rien : pas de tic pendant un glisser ni sur les rouleaux.
//   C'est une astuce, pas une API prévue pour ça : si Apple la ferme, il ne
//   se passe simplement rien.
const haptic = (()=>{
  const canVibrate = typeof navigator.vibrate === "function";
  // iPhone / iPad : écran tactile et pas de vibrate (tous les navigateurs y sont des Safari)
  const useSwitch = !canVibrate && window.matchMedia("(pointer: coarse)").matches;
  let lastBuzz = 0;
  const buzz = ms => {
    if(!canVibrate) return;
    const now = performance.now();
    if(now - lastBuzz < 30) return;
    lastBuzz = now;
    try{ navigator.vibrate(ms); }catch(e){}
  };
  let ready = false;
  const ensureSwitch = ()=>{
    if(ready) return;
    ready = true;
    const box = document.createElement("span");
    box.hidden = true;
    box.innerHTML = `<input type="checkbox" switch id="hapticSwitch" tabindex="-1" aria-hidden="true">`;
    // la bascule de l'interrupteur ne doit atteindre aucun écouteur de la page
    ["click", "input", "change"].forEach(t => box.addEventListener(t, e => e.stopPropagation()));
    document.body.appendChild(box);
  };
  // el : un contrôle (case, bouton : le label est posé dans une enveloppe)
  // ou un conteneur (le label le recouvre). Le clic d'origine est arrêté
  // puis rejoué sur el juste après, une fois l'interrupteur basculé — el
  // peut alors être redessiné sans couper le tic.
  const attach = el => {
    if(!useSwitch || !el) return;
    ensureSwitch();
    const label = document.createElement("label");
    label.className = "haptic-tap";
    label.htmlFor = "hapticSwitch";
    label.addEventListener("click", e=>{
      e.stopPropagation();
      setTimeout(()=> el.click(), 0);
    });
    if(el.matches("input, button")){
      const wrap = document.createElement("span");
      wrap.className = "haptic-host haptic-wrap";
      el.replaceWith(wrap);
      wrap.append(el, label);
    }else{
      el.classList.add("haptic-host");
      el.append(label);
    }
  };
  // tick : léger ; tap : net (ligne posée, ⟳, fermeture) ; strong : tâche cochée
  return { tick: ()=> buzz(8), tap: ()=> buzz(18), strong: ()=> buzz(35), attach };
})();

function flipMoveMulti(parents, moveFn){
  const children = [];
  new Set(parents).forEach(p=>{ if(p) children.push(...p.children); });
  const firstRects = new Map();
  children.forEach(el => firstRects.set(el, el.getBoundingClientRect()));
  moveFn();
  children.forEach(el=>{
    const firstRect = firstRects.get(el);
    if(!firstRect || !el.isConnected) return;
    const lastRect = el.getBoundingClientRect();
    const dy = firstRect.top - lastRect.top;
    const dx = firstRect.left - lastRect.left; // 0 pour les lignes ; utile pour la grille des listes
    if(Math.abs(dy) < 0.5 && Math.abs(dx) < 0.5) return;
    el.style.transition = "none";
    el.style.transform = `translate(${dx}px, ${dy}px)`;
    void el.offsetHeight; // force reflow avant de relâcher la transition
    requestAnimationFrame(()=>{
      el.style.transition = "transform 240ms cubic-bezier(0.22, 1, 0.36, 1)";
      el.style.transform = "";
    });
  });
}

// Pendant un glisser, l'emplacement change de place : animation + petit tic.
function moveDragSlot(parents, moveFn){
  flipMoveMulti(parents, moveFn);
  haptic.tick();
}

// Glisser-déposer via Pointer Events (souris ET tactile unifiés) : l'API
// HTML5 drag-and-drop native ne se déclenche pas au doigt sur iOS/Android,
// donc on déplace la ligne nous-mêmes en suivant le pointeur.
//
// La capture du pointeur est posée sur <html> (un nœud stable qui ne bouge
// jamais), PAS sur la poignée elle-même : la poignée est réinsérée ailleurs
// dans le DOM à chaque fois que la ligne change de position pendant le
// glissement, et poser la capture sur un élément qu'on déplace ainsi peut la
// rendre instable selon les navigateurs — la capture pouvait alors se perdre
// après le tout premier déplacement, ce qui limitait le geste à une seule
// ligne à la fois et cassait la fluidité de l'animation. Avec la capture
// fixée sur <html>, un seul jeu d'écouteurs globaux (posés une fois plus bas)
// suit tout le geste, quel que soit le nombre de lignes franchies.
function wireDragRow(li, value, dragMode, cat){
  li.dataset.dragId = value;
  li.dataset.dragMode = dragMode;
  const grip = li.querySelector(".drag-handle");

  grip.addEventListener("pointerdown", (e)=>{
    if(e.pointerType === "mouse" && e.button !== 0) return;
    if(dragState || editingKey || addingCat || addingCategory || editingCategoryTitle || editingCoursesKey) return;
    e.preventDefault();
    try{ document.documentElement.setPointerCapture(e.pointerId); }catch(err){}
    if(dragMode === "category"){
      // 7.1 : comme pour les listes, un fantôme suit le pointeur et la ligne
      // devient l'emplacement en pointillés, qui peut changer de liste.
      const r = li.getBoundingClientRect();
      const ghost = li.cloneNode(true);
      ghost.classList.remove("just-checked");
      ghost.classList.add("row-ghost");
      ghost.querySelectorAll("[id]").forEach(n => n.removeAttribute("id"));
      ghost.style.width = r.width + "px";
      ghost.style.height = r.height + "px";
      ghost.style.left = r.left + "px";
      ghost.style.top = r.top + "px";
      document.body.appendChild(ghost);
      dragState = { el: li, value, dragMode, cat, pointerId: e.pointerId,
        ghost, startX: e.clientX, startY: e.clientY, ghostLeft: r.left, ghostTop: r.top };
      li.classList.add("dragging-row");
      document.body.classList.add("dragging-lists");
      haptic.tick();
      return;
    }
    dragState = { el: li, value, dragMode, cat, pointerId: e.pointerId };
    li.classList.add("dragging");
    haptic.tick();
  });
}

// Le déplacement réel (mesure + réinsertion + animation FLIP) est coalescé
// sur requestAnimationFrame : des pointermove peuvent arriver plusieurs fois
// par frame, et enchaîner plusieurs réinsertions/animations dans la même
// frame les fait se marcher dessus (transform pas encore retombé à zéro
// quand la mesure suivante démarre) — d'où une animation saccadée. Un seul
// passage par frame, avec la position la plus récente, règle les deux soucis.
let dragMovePos = null;
let dragMoveScheduled = false;

function scheduleDragPointerMove(x, y){
  dragMovePos = { x, y };
  if(dragMoveScheduled) return;
  dragMoveScheduled = true;
  requestAnimationFrame(()=>{
    dragMoveScheduled = false;
    if(!dragState || !dragMovePos) return;
    handleDragPointerMove(dragMovePos.x, dragMovePos.y);
  });
}

// Glisser une liste entière (5.16) : même mécanique que pour les tâches
// (capture du pointeur, réinsertion + animation FLIP), mais sur les cartes,
// en deux dimensions (grille). Seul l'ordre des cartes change à l'arrivée,
// jamais leur contenu.
function wireDragCard(card, grip, catIdx){
  card.dataset.dragId = String(catIdx);
  card.dataset.dragMode = "lists";
  if(!grip) return;
  grip.addEventListener("pointerdown", (e)=>{
    if(e.pointerType === "mouse" && e.button !== 0) return;
    if(editingKey || addingCat || editingCategoryTitle || dragState) return;
    e.preventDefault();
    try{ document.documentElement.setPointerCapture(e.pointerId); }catch(err){}
    // 5.17 : un « fantôme » de la carte suit le pointeur, et la carte
    // elle-même devient l'emplacement en pointillés qui se déplace dans la
    // grille (c'est lui qui « aimante » la place d'arrivée).
    const r = card.getBoundingClientRect();
    const ghost = card.cloneNode(true);
    ghost.removeAttribute("id");
    ghost.querySelectorAll("[id]").forEach(n => n.removeAttribute("id"));
    ghost.classList.add("card-ghost");
    ghost.style.width = r.width + "px";
    ghost.style.height = r.height + "px";
    ghost.style.left = r.left + "px";
    ghost.style.top = r.top + "px";
    document.body.appendChild(ghost);
    dragState = { el: card, value: String(catIdx), dragMode: "lists", cat: null, pointerId: e.pointerId,
      ghost, startX: e.clientX, startY: e.clientY, ghostLeft: r.left, ghostTop: r.top, w: r.width, h: r.height };
    card.classList.add("dragging-card");
    document.body.classList.add("dragging-lists");
    haptic.tick();
  });
}

// Grille des listes : on cherche la carte dont le centre est le plus proche
// du centre du fantôme, et l'emplacement va s'y loger dès que le fantôme en
// est assez près — avant que la carte soit exactement dessus (effet aimant).
// Position « de mise en page » d'une carte, sans l'animation en cours :
// mesurer pendant une transition donnerait une carte encore à son ancienne
// place, et l'emplacement ferait des allers-retours.
function layoutRect(c){
  const op = c.offsetParent;
  const pr = op ? op.getBoundingClientRect() : { left:0, top:0 };
  // 10.15 : une ligne dans une zone qui défile (liste de courses) : on retire le défilement
  let sx = 0, sy = 0;
  for(let p = c.parentElement; p && p !== op; p = p.parentElement){ sx += p.scrollLeft; sy += p.scrollTop; }
  const left = pr.left + (op ? op.clientLeft : 0) + c.offsetLeft - sx;
  const top = pr.top + (op ? op.clientTop : 0) + c.offsetTop - sy;
  return { left, top, width:c.offsetWidth, height:c.offsetHeight };
}
function handleListDragMove(x, y){
  const d = dragState;
  const dx = x - d.startX, dy = y - d.startY;
  d.ghost.style.transform = `translate(${dx}px, ${dy}px) rotate(-1deg) scale(1.02)`;
  const gx = d.ghostLeft + dx + d.w / 2, gy = d.ghostTop + dy + d.h / 2;
  // petit défilement automatique près des bords de la fenêtre
  dragPageScroll(x, y);   // 10.24
  const parent = d.el.parentElement;
  const cards = Array.from(parent.children).filter(n => n.dataset && n.dataset.dragMode === "lists");
  let best = null, bestDist = Infinity;
  cards.forEach(c=>{
    const r = layoutRect(c);
    const dist = Math.hypot(gx - (r.left + r.width/2), gy - (r.top + r.height/2));
    if(dist < bestDist){ bestDist = dist; best = c; }
  });
  if(!best || best === d.el) return;
  const r = layoutRect(best);
  if(bestDist > Math.max(r.width, r.height) * 0.7) return; // trop loin : pas encore aimanté
  // 10.24 : pas de retour immédiat vers la carte qu'on vient d'échanger
  // (c'était le va-et-vient qui faisait vibrer l'emplacement)
  const ls = d.lastSwap;
  if(ls && ls.card === best && Math.hypot(gx - ls.gx, gy - ls.gy) < 48) return;
  const idxBest = cards.indexOf(best), idxEl = cards.indexOf(d.el);
  d.lastSwap = { card: best, gx, gy };
  moveDragSlot([parent], ()=>{
    parent.insertBefore(d.el, idxEl < idxBest ? best.nextSibling : best);
  });
}

function handleRowDragMove(x, y){
  const d = dragState;
  d.ghost.style.transform = `translate(${x - d.startX}px, ${y - d.startY}px) rotate(-0.6deg)`;
  dragPageScroll(x, y);   // 10.24
  dragInnerScroll(x, y);
  const target = document.elementFromPoint(x, y);
  if(!target) return;
  const card = target.closest(".category");
  if(!card) return;
  // 10.15 : un article reste dans sa liste de courses, et une tâche n'entre
  // pas dans une liste de courses
  if((card.classList.contains("courses") || isCoursesList(d.cat.id)) && card.id !== "cat-" + d.cat.id) return;
  if(card.classList.contains("collapsed")){ // 10.7 : le volet s'ouvre sous la tâche
    card.classList.remove("collapsed");
    const fid = card.id.replace(/^cat-/, "");
    if(fid) setFolded(fid, false);
  }
  const ul = card.querySelector("ul.items");
  if(!ul) return;
  const rows = Array.from(ul.children).filter(n => n.dataset && n.dataset.dragMode === "category" && n !== d.el);
  let before = null;
  for(const r of rows){
    const lr = layoutRect(r);
    if(y < lr.top + lr.height / 2){ before = r; break; }
  }
  const ref = before || (rows.length ? rows[rows.length - 1].nextSibling : null);
  if(d.el.parentElement === ul && (d.el === ref || d.el.nextSibling === ref)) return;
  moveDragSlot([d.el.parentElement, ul], ()=>{ ul.insertBefore(d.el, ref); });
}

// 10.24 : défilement de la page pendant un glisser : zone large, vitesse
// progressive, et il continue tant que le pointeur reste dans la zone
let dragPageRaf = 0;
function dragPageSpeed(y){
  const H = window.innerHeight, zone = Math.max(120, H * 0.18), MIN = 2, MAX = 34;
  const f = v => Math.round(MIN + (MAX - MIN) * Math.min(1, v) * Math.min(1, v));
  if(y < zone) return -f((zone - y) / zone);
  if(y > H - zone) return f((y - (H - zone)) / zone);
  return 0;
}
function dragPageScroll(x, y){
  const d = dragState;
  if(!d) return;
  d.pageX = x; d.pageY = y;
  if(dragPageSpeed(y) && !dragPageRaf) dragPageRaf = requestAnimationFrame(dragPageStep);
}
function dragPageStep(){
  dragPageRaf = 0;
  const d = dragState;
  if(!d || d.dropping) return;
  const v = dragPageSpeed(d.pageY);
  if(!v) return;
  const before = window.scrollY;
  window.scrollBy(0, v);
  if(window.scrollY === before) return;   // en haut ou en bas de la page
  // l'emplacement suit le contenu qui a défilé (et relance la boucle)
  if(d.ghost){ if(d.dragMode === "lists") handleListDragMove(d.pageX, d.pageY); else handleRowDragMove(d.pageX, d.pageY); }
  else dragPageRaf = requestAnimationFrame(dragPageStep);
}

// 10.15 : glisser un article près du haut ou du bas de la zone qui défile
// (liste de courses) la fait défiler, et continue tant que le doigt y reste
let dragScrollRaf = 0;
function dragInnerScroll(x, y){
  const d = dragState;
  if(!d) return;
  const ul = d.el.closest("ul.items");
  d.innerScroll = 0;
  if(!ul || ul.scrollHeight <= ul.clientHeight + 1) return;
  const r = ul.getBoundingClientRect(), EDGE = 36;
  if(x < r.left - 40 || x > r.right + 40) return;
  if(y < r.top + EDGE) d.innerScroll = -Math.min(16, Math.ceil((r.top + EDGE - y) / 3));
  else if(y > r.bottom - EDGE) d.innerScroll = Math.min(16, Math.ceil((y - (r.bottom - EDGE)) / 3));
  d.lastX = x; d.lastY = y;
  if(d.innerScroll && !dragScrollRaf) dragScrollRaf = requestAnimationFrame(dragInnerScrollStep);
}
function dragInnerScrollStep(){
  dragScrollRaf = 0;
  const d = dragState;
  if(!d || d.dropping || !d.innerScroll) return;
  const ul = d.el.closest("ul.items");
  if(!ul) return;
  const before = ul.scrollTop;
  ul.scrollTop += d.innerScroll;
  if(ul.scrollTop === before) return;   // au bout
  handleRowDragMove(d.lastX, d.lastY);    // l'emplacement suit, et relance le défilement
}

function endDragGesture(){
  if(!dragState || dragState.dropping) return;
  if(dragState.ghost){
    // le fantôme vient se poser dans son emplacement, puis on enregistre
    const d = dragState;
    d.dropping = true;
    const r = layoutRect(d.el);
    d.ghost.style.transition = "transform 200ms cubic-bezier(0.22, 1, 0.36, 1), opacity 200ms ease";
    d.ghost.style.transform = `translate(${r.left - d.ghostLeft}px, ${r.top - d.ghostTop}px)`;
    setTimeout(()=>{
      d.ghost.remove();
      d.el.classList.remove("dragging-card", "dragging-row");
      document.body.classList.remove("dragging-lists");
      haptic.tap(); // le fantôme touche sa place
      commitDragOrder();
    }, 200);
    return;
  }
  haptic.tap();
  dragState.el.classList.remove("dragging", "dragging-card");
  document.body.classList.remove("dragging-lists");
  commitDragOrder();
}

function cancelDragGesture(){
  if(!dragState) return;
  if(dragState.ghost) dragState.ghost.remove();
  dragState.el.classList.remove("dragging", "dragging-card", "dragging-row");
  document.body.classList.remove("dragging-lists");
  dragState = null;
  renderAll();
}

function handleDragPointerMove(x, y){
  if(!dragState || dragState.dropping) return;
  if(dragState.ghost){ if(dragState.dragMode === "lists") handleListDragMove(x, y); else handleRowDragMove(x, y); return; }
  const target = document.elementFromPoint(x, y);
  if(!target) return;
  const li = dragState.dragMode === "lists"
    ? target.closest('[data-drag-mode="lists"]')
    : target.closest("[data-drag-id]");
  if(!li || li.dataset.dragMode !== dragState.dragMode) return;
  const parent = li.parentElement;
  if(dragState.el.parentElement !== parent) return;
  if(dragState.el === li) return;
  const rect = li.getBoundingClientRect();
  let after = (y - rect.top) > rect.height / 2;
  if(dragState.dragMode === "lists"){
    // grille : sur une même rangée, c'est la position gauche/droite qui compte
    const elRect = dragState.el.getBoundingClientRect();
    const sameRow = Math.abs(elRect.top - rect.top) < 8;
    if(sameRow) after = (x - rect.left) > rect.width / 2;
  }
  const alreadyThere = after ? (li.nextSibling === dragState.el) : (li.previousSibling === dragState.el);
  if(alreadyThere) return;
  moveDragSlot([parent], ()=>{
    parent.insertBefore(dragState.el, after ? li.nextSibling : li);
  });
}

function commitDragOrder(){
  if(!dragState) return;
  // Copie fraîche de l'ordre avant d'écrire, pour ne pas écraser un
  // réordonnancement fait entre-temps dans une autre catégorie (même
  // logique que pour les cases à cocher : voir plus haut).
  order = loadOrder();
  const { el, value, dragMode, cat } = dragState;
  if(dragMode === "lists"){
    // Ordre visible des cartes, reporté dans l'ordre complet (les listes
    // supprimées gardent leur place, on n'y touche pas).
    const domOrder = Array.from(el.parentElement.children)
      .filter(node => node.dataset && node.dataset.dragMode === "lists")
      .map(node => parseInt(node.dataset.dragId, 10));
    const visible = new Set(domOrder);
    const full = getCategoryOrder().slice();
    let j = 0;
    order.__categories__ = full.map(i => visible.has(i) ? domOrder[j++] : i);
  }else if(dragMode === "category"){
    // 7.1 : ordre relu dans le DOM (affiché), puis retraduit en ordre
    // enregistré (voir applyCatDisplayOrder) ; si la ligne a atterri dans une
    // autre liste, la tâche y est d'abord recopiée.
    const destCard = el.closest(".category");
    const destCat = destCard ? DATA.find(c => "cat-" + c.id === destCard.id) : null;
    const domRows = Array.from(el.parentElement.children)
      .filter(node => node.dataset && node.dataset.dragMode === "category");
    if(!destCat || destCat.id === cat.id){
      applyCatDisplayOrder(cat, domRows.map(node => parseInt(node.dataset.dragId, 10)));
    }else{
      const newIdx = moveItemToCategory(cat, parseInt(value, 10), destCat);
      if(newIdx !== null){
        applyCatDisplayOrder(destCat, domRows.map(node => node === el ? newIdx : parseInt(node.dataset.dragId, 10)));
        actionToast("moveCat");
      }else if(!canRemoveTask(cat, getEffectiveItems(cat)[parseInt(value, 10)])){
        celebrate("Cette tâche reste dans sa liste : seule la personne qui l'a créée peut l'emporter ailleurs.", true);
      }
    }
  }else{
    // Urgents et « En cours » : on reconstruit l'ordre complet directement
    // depuis le DOM (l'ordre visible juste après le glissement), au lieu
    // d'insérer une seule valeur dans le tableau stocké. Ce dernier pouvait
    // être incomplet — il n'enregistrait que les lignes déjà déplacées une
    // fois — si bien que déplacer une ligne renvoyait les autres à leur tri
    // automatique et le déplacement « sautait ». C'était ça, le bug.
    const orderKey = dragMode === "waiting" ? "__waiting__" : "__urgent__";
    order[orderKey] = Array.from(el.parentElement.children)
      .filter(node => node.dataset && node.dataset.dragId && node.dataset.dragMode === dragMode)
      .map(node => node.dataset.dragId);
  }
  saveOrder(order);
  dragState = null;
  renderAll();
}

// ---------- trèfle : deux petites tâches proposées chaque jour ----------
// Rien n'est stocké : le choix est recalculé à partir de la date du jour.
// Chaque tâche reçoit une note tirée d'un hachage (date + identifiant) ; les
// deux meilleures gagnent, avec un avantage aux plus anciennes de chaque case.
// La note d'une tâche ne dépend que d'elle : en cocher une ne change pas
// l'autre, la suivante prend simplement sa place.
// Écartées : urgentes, échéance proche, RDV, « en cours », cochées.
const LUCKY_LEAD = "Une petite en passant ?";
function hashStr(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
// Le tirage du jour est mémorisé (clé à part, sans lien avec les tâches
// elles-mêmes) : une proposition cochée reste affichée, grisée, au lieu
// d'être remplacée — c'est le petit trophée de la journée.
const LUCKY_KEY = "fauconnerie-v2-lucky";
function drawLuckyKeys(reroll, exclude){
  const today = todayISO();
  const salt = reroll ? today + "#" + reroll : today;
  const skip = new Set(exclude || []);
  const pool = [];
  getCategoryOrder().forEach(catIdx=>{
    const cat = DATA[catIdx];
    if(!cat || isCategoryDeleted(cat.id) || isCoursesList(cat.id)) return;   // 10.15 : pas d'article au trèfle
    const items = getEffectiveItems(cat);
    const n = items.length;
    items.forEach((base, i)=>{
      const key = itemKey(cat.id, i);
      if(isDeleted(key) || state[key]) return;
      const eff = getEffective(key, base);
      if(eff.waiting || eff.urgent || eff.egg || isRdvTitle(eff.t)) return;
      if(isDueUrgent(eff.due)) return;
      const age = n > 1 ? i / (n - 1) : 0; // 0 = la plus ancienne de sa case
      const score = (hashStr(salt + "|" + key) / 4294967296) * (0.5 + age);
      pool.push({ key, score, skip: skip.has(key) });
    });
  });
  pool.sort((a,b)=> a.score - b.score);
  // nouveau tirage : on évite les deux d'avant, sauf s'il n'y a pas assez de tâches
  const fresh = pool.filter(p => !p.skip);
  const pick = fresh.length >= 2 ? fresh : fresh.concat(pool.filter(p => p.skip));
  return pick.slice(0, 2).map(p => p.key);
}
function rerollLucky(){
  haptic.tap();
  const saved = loadJSONKey(LUCKY_KEY, null);
  const today = todayISO();
  const prev = (saved && saved.date === today && Array.isArray(saved.keys)) ? saved.keys : [];
  const reroll = ((saved && saved.date === today && saved.reroll) || 0) + 1;
  const keys = drawLuckyKeys(reroll, prev);
  saveJSONKey(LUCKY_KEY, { date: today, keys, reroll, chosen: null });
  luckySpinNext = "reroll";
  renderLuckyLine();
  noteUndoPoint();
}
function luckyEntry(key){
  const sep = key.lastIndexOf(":");
  const cat = DATA.find(c => c.id === key.slice(0, sep));
  const idx = parseInt(key.slice(sep + 1), 10);
  if(!cat || isCategoryDeleted(cat.id) || isDeleted(key) || isCoursesList(cat.id)) return null;
  const base = getEffectiveItems(cat)[idx];
  if(!base) return null;
  const eff = getEffective(key, base);
  return { key, cat, text: eff.t, done: !!state[key] };
}
// Une proposition encore valable ? (existe toujours, et n'est pas devenue
// urgente, en cours, en couvaison, un RDV ou proche de l'échéance)
function luckyStillEligible(key){
  const sep = key.lastIndexOf(":");
  const cat = DATA.find(c => c.id === key.slice(0, sep));
  if(!cat || isCategoryDeleted(cat.id) || isDeleted(key)) return false;
  const base = getEffectiveItems(cat)[parseInt(key.slice(sep + 1), 10)];
  if(!base) return false;
  const eff = getEffective(key, base);
  return !(eff.waiting || eff.urgent || eff.egg || isRdvTitle(eff.t) || isDueUrgent(eff.due));
}
function collectLuckyPicks(){
  const today = todayISO();
  const saved = loadJSONKey(LUCKY_KEY, null);
  if(saved && saved.date === today && Array.isArray(saved.keys)){
    // 5.16 : avant, si une des deux tâches du jour disparaissait (effacée,
    // déplacée de case, purgée, passée urgente…), le trèfle restait boiteux
    // avec une seule proposition jusqu'au lendemain. On complète désormais.
    let keys = saved.keys.filter(k => luckyEntry(k) && (state[k] || luckyStillEligible(k)));
    const dayDone = keys.some(k => state[k]);
    if(!dayDone && keys.length < 2){
      const extra = drawLuckyKeys(saved.reroll || 0, keys).filter(k => !keys.includes(k));
      keys = keys.concat(extra).slice(0, 2);
    }
    if(JSON.stringify(keys) !== JSON.stringify(saved.keys)){
      saved.keys = keys;
      if(saved.chosen && !keys.includes(saved.chosen)) saved.chosen = null;
      saveJSONKey(LUCKY_KEY, saved);
    }
    if(keys.length) return keys.map(luckyEntry).filter(Boolean);
  }
  const keys = drawLuckyKeys();
  saveJSONKey(LUCKY_KEY, { date: today, keys });
  return keys.map(luckyEntry).filter(Boolean);
}
function getLuckyChosen(){
  const saved = loadJSONKey(LUCKY_KEY, null);
  return saved && saved.date === todayISO() ? (saved.chosen || null) : null;
}
function setLuckyChosen(key){
  const saved = loadJSONKey(LUCKY_KEY, null);
  if(!saved || saved.date !== todayISO()) return;
  saved.chosen = key;
  saveJSONKey(LUCKY_KEY, saved);
}
let luckyWasShown = null; // null : premier affichage de la page, sans animation
// 8.25 : la case est fermée chaque matin ; on l'ouvre d'un clic (manivelle).
// Clé à part, hors annulation et sauvegardes : elle ne retient que la date
// du jour où la case a été ouverte. Aucune autre donnée touchée.
const LUCKY_OPEN_KEY = "fauconnerie-v2-luckyopen";

// 8.26 : reclic sur le trèfle — la manivelle tourne à l'envers, les deux
// tâches s'effacent (sans tourner : le défilement sert à piquer la curiosité,
// pas à la refermer) et la case se replie. Le tirage et le choix sont gardés.
function closeLucky(){
  haptic.tap();
  const el = document.getElementById("luckyLine");
  const wasDone = !!(el && el.classList.contains("done"));
  const finish = ()=>{
    try{ if(wasDone) Store.set(LUCKY_DONE_CLOSED_KEY, todayISO()); else Store.remove(LUCKY_OPEN_KEY); }catch(e){}   // 10.25
    el.classList.remove("closing");

    // que le pointeur ne l'a pas quittée
    el.classList.add("rest");
    el.addEventListener("pointerleave", ()=> el.classList.remove("rest"), { once:true });
  };
  if(!el || luckyReduceMotion()){ finish(); return; }
  el.classList.add("closing");
  const cl = el.querySelector(".lucky-clover");
  if(cl) cl.animate([{ transform:"rotate(0deg)" }, { transform:"rotate(-360deg)" }],
    { duration:420, easing:"cubic-bezier(.3,.6,.4,1)" });
  const head = el.querySelector(".lucky-head");
  const opts = el.querySelector(".lucky-opts");
  const cs = getComputedStyle(el);
  // hauteur visée : celle de la case fermée (tête + marges intérieures)
  const target = head.offsetHeight + parseFloat(cs.paddingTop) + parseFloat(getComputedStyle(head).marginTop) + parseFloat(cs.paddingTop);
  const from = el.offsetHeight;
  el.style.overflow = "hidden";
  if(opts) opts.animate([{ opacity:1, transform:"none" }, { opacity:0, transform:"translateY(-6px)" }], { duration:200, fill:"forwards", easing:"ease-out" });
  const shrink = el.animate([{ height: from + "px" }, { height: target + "px" }],
    { duration:420, easing:"cubic-bezier(.3,.6,.4,1)", fill:"forwards" });
  shrink.onfinish = ()=>{ shrink.cancel(); finish(); };
  shrink.oncancel = null;
}
const luckyReduceMotion = () => !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
// Textes de remplissage pour les rouleaux : d'autres tâches de la liste.
function luckyFillerTexts(excludeKeys){
  const out = [];
  DATA.forEach(cat=>{
    if(isCategoryDeleted(cat.id)) return;
    getEffectiveItems(cat).forEach((base, i)=>{
      const k = itemKey(cat.id, i);
      if(isDeleted(k) || state[k] || excludeKeys.includes(k)) return;
      const t = getEffective(k, base).t;
      if(t) out.push(t);
    });
  });
  for(let i = out.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; }
  return out;
}
// Machine à sous : chaque proposition défile, floue, puis se pose sur la
// tâche du jour. Purement visuel : le texte réel reste dans la case.
// 8.32 : pendant que le rouleau tourne, un tic à chaque tâche qui passe la
// fenêtre, lu sur la position réelle de la bande : les tics suivent donc le
// ralenti de l'animation, comme une roue de sélection, jusqu'à l'arrêt.
function tickAlongReel(anim, strip, H){
  let passed = 0;
  const step = ()=>{
    if(anim.playState !== "running" || !strip.isConnected) return;
    const y = new DOMMatrixReadOnly(getComputedStyle(strip).transform).m42;
    const n = Math.floor(-y / H + 0.02);
    if(n > passed){ passed = n; haptic.tick(); }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function spinLuckyReels(el, mode){
  if(luckyReduceMotion()) return;
  const picks = [...el.querySelectorAll(".lucky-pick")];
  const keys = picks.map(p => p.dataset.key);
  let fillers = luckyFillerTexts(keys);
  if(!fillers.length) fillers = ["…"];
  const startDelay = mode === "open" ? 220 : (mode === "close" ? 0 : 60);
  const rewind = mode === "close";
  picks.forEach((pick, n)=>{
    const span = pick.querySelector(".lucky-pick-text");
    if(!span) return;
    pick.classList.add("spinning"); // position:relative : mesures prises par rapport à la case
    // mesures au sous-pixel près, par rapport au bord intérieur de la case,
    // pour que le rouleau s'arrête exactement là où est le vrai texte
    const pr = pick.getBoundingClientRect(), sr = span.getBoundingClientRect();
    const pcs = getComputedStyle(pick);
    const left = sr.left - pr.left - parseFloat(pcs.borderLeftWidth);
    const top = sr.top - pr.top - parseFloat(pcs.borderTopWidth);
    const H = sr.height, W = sr.width;
    if(!H || !W){ pick.classList.remove("spinning"); return; }
    const count = 9 + n * 4;
    const reel = document.createElement("span");
    reel.className = "lucky-reel";
    reel.style.cssText = `left:${left}px; top:${top}px; width:${W}px; height:${H}px;`;
    const strip = document.createElement("span");
    strip.className = "lucky-reel-strip";
    const cs = getComputedStyle(span);
    const item = (t, final) => {
      const it = document.createElement("span");
      it.className = "lucky-reel-item" + (final ? " final" : "");
      it.style.height = H + "px";
      if(final) it.style.whiteSpace = cs.whiteSpace;
      const inner = document.createElement("span");
      inner.textContent = t;
      it.appendChild(inner);
      return it;
    };
    for(let i = 0; i < count; i++) strip.appendChild(item(fillers[(i + n * 5) % fillers.length], false));
    strip.appendChild(item(span.textContent, true));
    reel.appendChild(strip);
    pick.appendChild(reel);
    const dist = count * H;
    if(rewind){
      // rebobinage : les rouleaux repartent en arrière, de plus en plus flous
      strip.animate([
        { transform:`translateY(${-dist}px)`, filter:"blur(0)", opacity:1 },
        { transform:"translateY(0)", filter:"blur(3px)", opacity:.35 }
      ], { duration:560 + n * 80, easing:"cubic-bezier(.55,0,.8,.4)", fill:"forwards" });
      return;
    }
    const dur = (mode === "open" ? 1150 : 900) + n * 380;
    const anim = strip.animate([
      { transform:"translateY(0)", filter:"blur(2.5px)", easing:"cubic-bezier(.18,.6,.3,1)" },
      { transform:`translateY(${-(dist + H * 0.14)}px)`, filter:"blur(0)", offset:.9, easing:"ease-out" },
      { transform:`translateY(${-dist}px)`, filter:"blur(0)" }
    ], { duration:dur, delay:startDelay, fill:"both" });
    tickAlongReel(anim, strip, H);
    const cleanup = ()=>{ reel.remove(); pick.classList.remove("spinning"); };
    anim.onfinish = ()=>{
      cleanup();
      pick.animate([{ transform:"scale(1)" }, { transform:"scale(1.025)" }, { transform:"scale(1)" }], { duration:260, easing:"ease-out" });
    };
    anim.oncancel = cleanup;
  });
}

const eggSvg = size => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="egg" d="M12 2.8c-3.7 0-6.6 5.6-6.6 10.6A6.6 6.6 0 0 0 12 21.2a6.6 6.6 0 0 0 6.6-7.8C18.6 8.4 15.7 2.8 12 2.8z"/><circle class="speck" cx="10" cy="11" r=".8" fill="currentColor" stroke="none"/><circle class="speck" cx="14" cy="14.5" r=".8" fill="currentColor" stroke="none"/><circle class="speck" cx="10.8" cy="16.6" r=".6" fill="currentColor" stroke="none"/></svg>`;

const EGG_TIP = { on:"En couvaison — cliquer pour retirer", off:"Mettre en couvaison" };
const URGENT_TIP = { on:"Urgent — cliquer pour retirer", off:"Marquer comme urgent" };
// L'œuf et le triangle en bas à droite des formulaires (création, modification, nouvelle liste).
function formToggles(egg, urgent){
  return `<button type="button" class="edit-egg${egg ? " active" : ""}" aria-pressed="${egg ? "true" : "false"}" aria-label="En couvaison" data-tip="${egg ? EGG_TIP.on : EGG_TIP.off}">${eggSvg(16)}</button>
          <button type="button" class="edit-urgent${urgent ? " active" : ""}" aria-pressed="${urgent ? "true" : "false"}" aria-label="Urgent" data-tip="${urgent ? URGENT_TIP.on : URGENT_TIP.off}">${triangleSvg(16)}</button>`;

// Triangle « urgent » dans les formulaires de création / modification :
// un simple interrupteur, lu au moment d'enregistrer.
function wireEditUrgent(li){
  // Triangle « urgent » et œuf « en couvaison » : deux interrupteurs qui
  // s'excluent (allumer l'un éteint l'autre), lus au moment d'enregistrer.
  const make = (sel, tipOn, tipOff)=>{
    const b = li.querySelector(sel);
    const st = { b, on: b.classList.contains("active") };
    st.set = (v)=>{
      st.on = v;
      b.classList.toggle("active", v);
      b.setAttribute("aria-pressed", v ? "true" : "false");
      b.dataset.tip = v ? tipOn : tipOff;
    };
    return st;
  };
  const urg = make(".edit-urgent", URGENT_TIP.on, URGENT_TIP.off);
  const egg = make(".edit-egg", EGG_TIP.on, EGG_TIP.off);
  urg.b.addEventListener("click", (e)=>{ e.preventDefault(); urg.set(!urg.on); if(urg.on) egg.set(false); });
  egg.b.addEventListener("click", (e)=>{ e.preventDefault(); egg.set(!egg.on); if(egg.on) urg.set(false); });
  // 7.25 : le clic garde le curseur dans le champ en cours, et Entrée sur
  // un des deux boutons enregistre au lieu de re-basculer le bouton.
  [urg.b, egg.b].forEach(b=>{
    b.addEventListener("mousedown", e=> e.preventDefault());
    b.addEventListener("keydown", e=>{
      if(e.key !== "Enter") return;
      e.preventDefault(); e.stopPropagation();
      const saveBtn = li.querySelector(".edit-save, .add-save, .nl-save");
      if(saveBtn) saveBtn.click();
    });
  });
  return { value: ()=> urg.on, egg: ()=> egg.on };
}

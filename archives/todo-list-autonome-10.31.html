  - Changer le numéro à DEUX endroits : le commentaire ci-dessus et la

    todo-list-autonome-X.Y.html.
  - EN LIGNE (depuis la 8.17) : l'appli est publiée sur GitHub Pages
    (dépôt Andre-PierreB/listes-sous-le-tapis), où ce fichier s'appelle

    (jusqu'à la synchro en ligne, prévue après la 10.0 — voir FICHES).

  RÈGLES DE LA MAISON
  - Ne jamais abîmer l'appli ni perdre d'anciennes tâches. Depuis la 10.0,
    les données vivent dans des FICHES (clés « sltapis:… », voir plus bas) ;
    les anciennes clés « fauconnerie-v2-… » sont gelées telles qu'au passage
    en 10.0 (copie de secours) : on ne les modifie ni ne les supprime jamais,
    et on ne renomme ni ne supprime une fiche existante. Le préfixe « fauconnerie » est
    un vestige interne invisible : l'appli s'appelle « Sous le tapis »
    partout ailleurs (depuis la 8.19) ; ne pas réintroduire ce nom à l'écran.
  - Fichier autonome : un seul .html, rien d'autre que les polices Google
    en externe — SAUF, depuis la 10.1, le code de Firebase (connexion et
    synchro), chargé depuis www.gstatic.com seulement quand on se connecte
    (ou si on l'était déjà) ; sans réseau, l'appli marche comme avant.
  - Ton des messages : humour, faisan, folklore plutôt belge ; rien de
    trop perso (l'appli peut être partagée).
  - Tout texte saisi (titre, note, nom…) passe par escapeAttr() avant
    d'entrer dans le HTML.

  RANGEMENT (depuis la 8.0)
  - CSS : un seul endroit par élément, dans l'ordre de la page (couleurs →
    compteur → case urgente → trèfle → listes → tâches → formulaires → « En
    cours » → bas de page → corbeille → accueil → tapis → glisser-déposer →
    infobulles → mode sombre → animations). Pour retoucher un élément, on
    MODIFIE SA RÈGLE là où elle est ; on n'ajoute pas de bloc « 7.x » en fin
    de feuille qui l'écrase (c'est ce qui avait été démêlé en 8.0).
  - Mode sombre : les couleurs sont des variables (--bg, --ink…) redéfinies
    deux fois (réglage du système, thème forcé par data-theme) ; les rares
    retouches propres au sombre sont regroupées dans la section du même nom.
  - JS : un seul chemin pour chaque geste — setDone() (cocher, d'où que ce
    soit), insertItem() (ajouter une tâche à une liste), reloadAllFromStorage()
    (tout relire), hasAnyList(), formToggles() / eggSvg() / triangleSvg()
    (œuf et triangle des formulaires), openPopAt() (petites fenêtres).
  - Stockage (depuis la 9.2) : on ne touche JAMAIS directement à
    localStorage ; on passe par Store.get / Store.set / Store.remove (début
    du script). Ce qui arrive d'ailleurs (autre onglet, et demain autre
    appareil) passe par applyExternalChange(clé). C'est le point de
    branchement prévu pour la synchro en ligne (Firebase).
  - Annuler (⌘Z / Ctrl+Z) : après chaque renderAll(), noteUndoPoint() compare
    les clés du stockage (UNDO_KEYS) à leur état précédent. Toute nouvelle
    clé de données doit donc entrer dans BACKUP_KEYS pour être annulable et
    sauvegardée — ET avoir sa place dans les fiches (Store : K, PROJECT,
    WRITE), sinon elle ne serait lue / écrite nulle part.

  FICHES (depuis la 10.0) — préparation de la synchro et du partage
  - sltapis:list:<id> : une fiche par liste (id = l'ancien identifiant de la
    liste) : title, color, reversed (sens), rank (place de création), order
    (ordre des tâches, par identifiant), members (["moi"] au départ ;
    comptes en ligne depuis la 10.1), owner / names (10.2, partage),
    deleted, et items : chaque tâche { id stable, base (champs à la
    création), edits (modifications), done (coche), checkedAt (date) }.
    « ghosts » : places de tâches disparues (⌘Z d'un ajout…), gardées pour
    qu'une tâche qui revient à cette place retrouve sa coche, comme avant.
  - sltapis:user:moi : listOrder (ordre de mes listes), urgentOrder /
    urgentDue / waitingOrder, trash (corbeille ; « item » = la tâche
    d'origine, catId = la liste), waitLog (journal « en cours »), lastPurge.
    Une référence de tâche s'écrit [idListe, idTâche].
  - sltapis:local : réglages de cet appareil (trèfle du jour, détails
    dépliés, graphique, rappel de sauvegarde) ; ne partira jamais en ligne.
  - sltapis:residue : tenue de compte interne de cet appareil (clés
    présentes, restes sans liste, garde-fou « anomalies ») ; sltapis:meta
    (format 10, date de migration) ; sltapis:rev (change à chaque écriture).
  - Le code de l'appli lit / écrit encore les anciennes clés : Store les
    calcule à la volée depuis les fiches et répartit chaque écriture dans
    les fiches (même sens qu'avant, repérage par position compris). Étapes
    suivantes : brancher Firebase dans Store (fiches list + user), puis
    faire lire les fiches directement au code, morceau par morceau.
  - Migration au 1er chargement, en mémoire, vérifiée clé par clé avant
    d'écrire quoi que ce soit ; en cas d'écart : aucune fiche écrite, l'appli
    tourne sur les anciennes clés comme en 9.4 (Store.mode === "legacy").
  - Sauvegarde : format 10 (fiches + « snapshot », la photo autonome que les
    versions d'avant savent relire). Restauration : format 10, et toujours
    les anciennes sauvegardes (photo, ou clés brutes).
  - Tests (hors fichier) : comparaison Playwright 9.4 / 10.0 sur les mêmes
    gestes, et fuzz du Store (écritures, effacements, ⌘Z, deux onglets,
    rechargement, export / import).

  SYNCHRO EN LIGNE (depuis la 10.1) — Firebase, projet « sous-le-tapis »
  - Plan Spark (gratuit), Firestore europe-west1 en mode production,
    connexion Google ou e-mail + mot de passe ; domaine autorisé :

  - En ligne : lists/<cloudId> (champs de la fiche + owner, members,

    tâche par tâche, à partir de la dernière version vue en ligne

  - Premier branchement d'un compte : compte vide → on envoie les listes de

<style>

/* ---------- couleurs (clair, puis sombre deux fois : réglage du système, ou

:root{
  /* fond uni (8.39), sauge très pâle (8.40, plus claire en 8.41, plus froide en 8.42) */

  --memo-line:rgba(150,160,200,.28);
  /* 10.19 : vert du logo (le faisan) pour le titre et la plume connectée ;
     --logo-green-strong au survol du titre */
  --logo-green:#7DB536;   /* un cran sous le vert du logo #8DC63F, trop pâle pour un petit titre */
  --logo-green-strong:#64992A;
  /* 10.19 : urgences en améthyste, cousine du mauve du logo (avant : tomate
     #DD5236 / #FBE3DA / #93301C) */
  --urgent:#9558D0;
  --urgent-soft:#ECDFF8;
  --urgent-ink:#562F96;   /* 10.25 : un rien moins rouge et plus clair (avant #4A2580) */
  --late:#A9472A; --late-soft:#FBE7DE;   /* 10.25 : « En retard » en terre cuite */

  --lucky-lemon:#E6D63C;  /* 10.18 : accents du bandeau trèfle (surbrillance, liserés, textes) ;
                            --lucky-gold reste au bouton « Nouvelle liste » du premier lancement */
  --lucky-gold:#E3B53C;

  --shadow: 0 1px 2px rgba(30,40,45,0.04), 0 8px 24px -12px rgba(30,40,45,0.12);

  --phrase:#3F6A8C; /* bleu acier : phrase du compteur (8.4) */

  --paper:#FDFDFA;   /* 10.18 : perle très claire, un soupçon de jaune (avant #FFFDF7, crème) */
  --paper-rule:#DCE7F1;
  --paper-shadow: 0 1px 3px rgba(30,40,45,0.07), 0 10px 26px -12px rgba(30,40,45,0.2);
  --qty-ink:#CE4F8A;

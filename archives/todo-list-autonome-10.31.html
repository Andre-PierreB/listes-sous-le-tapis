          const becameEgg = urgentToggle.egg() && !eff.egg;
          overrides[key].egg = urgentToggle.egg();
          saveOverrides(overrides);
          if(becameEgg){
            // mise en couvaison : la tâche file en queue de sa liste
            order = loadOrder();
            const arr = getCatOrder(cat).slice();
            const pos = arr.indexOf(idx);
            if(pos > -1){ arr.splice(pos, 1); arr.push(idx); order[cat.id] = arr; saveOrder(order); }
          }
        }
      }catch(err){
        // Même en cas de souci d'enregistrement/synchro, on ne laisse jamais
        // le formulaire bloqué : la modification reste en mémoire et l'écran
        // se referme normalement.
        console.error("[edit] échec de l'enregistrement", err);
      }
      editingKey = null;
      renderAll();
    };
    li.querySelector(".edit-save").addEventListener("click", save);
    li.querySelector(".edit-cancel").addEventListener("click", ()=>{ editingKey = null; renderAll(); });
    [titleInput, noteInput, catSelect, dueInput, dueTimeInput, whoInput].forEach(inp=>{
      inp.addEventListener("keydown", e=>{
        if(e.key === "Enter"){ e.preventDefault(); save(); }
        if(e.key === "Escape"){ editingKey = null; renderAll(); }
      });
    });
    return { el: li, focus: ()=>{ titleInput.focus(); titleInput.select(); } };
  }

  // 10.15 : article d'une liste de courses — un rond creux à la place de la
  // case ; un clic sur l'article ou le rond le raye (il reste à sa place),
  // un nouveau clic le dé-raye. Poignée et croix comme une tâche.
  if(opts.courses && editingCoursesKey === key){
    // modifier un article : nom, quantité (− / + pour un simple nombre)
    li.className = "item courses-item editing";
    li.dataset.key = key;
    li.innerHTML = `
      <span class="drag-handle" aria-hidden="true">&#8942;&#8942;</span>
      <span class="strike-dot" aria-hidden="true"></span>
      <span class="courses-edit">
        <input type="text" class="courses-edit-name" value="${escapeAttr(eff.t)}" aria-label="Article" autocomplete="off" enterkeyhint="done">
        <span class="courses-qty-edit">
          <button type="button" class="qty-step" data-d="-1" aria-label="Un de moins">&minus;</button>
          <input type="text" class="courses-edit-qty" value="${escapeAttr(eff.q)}" placeholder="Qté" aria-label="Quantité" autocomplete="off" enterkeyhint="done">
          <button type="button" class="qty-step" data-d="1" aria-label="Un de plus">+</button>
        </span>
        <input type="text" class="courses-edit-note" value="${escapeAttr(eff.note || "")}" placeholder="Détail (optionnel)" aria-label="Détail" autocomplete="off" enterkeyhint="done">
      </span>
    `;
    const nameInp = li.querySelector(".courses-edit-name"), qtyInp = li.querySelector(".courses-edit-qty");
    const noteInp = li.querySelector(".courses-edit-note");
    li.querySelectorAll(".qty-step").forEach(b=>{
      b.addEventListener("mousedown", e => e.preventDefault());   // le curseur reste où il est
      b.addEventListener("click", e=>{
        e.stopPropagation();
        const cur = qtyInp.value.trim();
        if(cur && !/^\d+$/.test(cur)) return;   // « 500 g » : à corriger à la main
        const n = Math.max(1, (cur ? parseInt(cur, 10) : 1) + parseInt(b.dataset.d, 10));
        qtyInp.value = n > 1 ? String(n) : "";
        haptic.tick();
      });
    });
    [nameInp, qtyInp, noteInp].forEach(inp => inp.addEventListener("keydown", e=>{
      if(e.isComposing) return;
      if(e.key === "Enter"){ e.preventDefault(); commitCoursesEdit(); }
      if(e.key === "Escape"){ e.preventDefault(); editingCoursesKey = null; renderAll(); }
    }));
    li.addEventListener("click", e => e.stopPropagation());
    return { el: li, focus: ()=>{ nameInp.focus(); nameInp.select(); } };
  }
  if(opts.courses){
    const struck = !!state[key];
    const isNewCourse = !struck && newFromOthers(cat).includes(idx);   // 10.31
    li.className = "item courses-item" + (isNewCourse ? " is-new" : "") + (struck ? " is-checked" : "") + (struck && key === justCheckedKey ? " just-checked" : "");
    li.dataset.key = key;
    const qtyTag = eff.q ? ` <span class="courses-qty">${escapeAttr(coursesQtyLabel(eff.q))}</span>` : "";
    let strikerTag = "";
    if(struck && isSharedList(cat.id)){
      const who = personName(checkerOf(cat.id, key), cat.id);
      strikerTag = `<span class="checker-tag" data-tip="Rayé par ${escapeAttr(who)}" aria-label="Rayé par ${escapeAttr(who)}">${escapeAttr(initialOf(who))}</span>`;
    }
    li.innerHTML = `
      <span class="drag-handle" aria-label="Glisser pour réordonner" title="Glisser pour déplacer">&#8942;&#8942;</span>
      <button type="button" class="strike-dot" role="checkbox" aria-checked="${struck}" aria-label="${escapeAttr((struck ? "Dé-rayer " : "Rayer ") + eff.t)}"></button>
      ${isNewCourse ? newTagHtml(cat, base) : ""}<span class="item-text">${strikerTag}<span class="item-title">${eff.note ? titleWithToggle(eff.t, noteToggleHtml(true, isNoteOpen(key))) : escapeAttr(eff.t)}</span>${qtyTag}${eff.note ? noteFoldHtml(eff.note, "note") : ""}</span>
      <span class="item-controls">
        <button type="button" class="courses-edit-btn" aria-label="Modifier l'article" data-tip="Modifier"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/><path d="M14.5 5.5l3 3"/></svg></button>
        <button type="button" class="delete-btn" aria-label="Retirer l'article" data-tip="Retirer l'article"><span class="x">&times;</span></button>
      </span>
    `;
    const dot = li.querySelector(".strike-dot");
    dot.addEventListener("click", e=>{ e.stopPropagation(); setStruck(key, !struck); });
    haptic.attach(dot);
    // pas de « dévoilement » au toucher ici : toucher la ligne raye l'article,
    // crayon et croix restent donc visibles sur écran tactile (voir le CSS)
    li.addEventListener("click", e=>{
      if(e.target.closest(".drag-handle, .item-controls, .strike-dot, .haptic-tap, .note-toggle")) return;
      setStruck(key, !struck);
    });
    // 10.19 : détail (comme dans les autres listes) — ici toucher la ligne
    // raye l'article, seul le sigle déplie / replie le détail
    if(eff.note){
      markNoteHolder(li, key);
      li.querySelector(".note-toggle").addEventListener("click", e=>{ e.stopPropagation(); toggleNoteOpen(key); });
    }
    li.querySelector(".courses-edit-btn").addEventListener("click", e=>{
      e.stopPropagation();
      editingCoursesKey = key;
      renderAll();
    });
    li.querySelector(".delete-btn").addEventListener("click", e=>{
      e.stopPropagation();
      removeCoursesItem(key);
      actionToast("coursesErase");
      renderAll();
    });
    wireDragRow(li, String(idx), "category", cat);
    return { el: li, focus: null };
  }

  const checked = !!state[key];
  // Une échéance proche (en retard, aujourd'hui, demain) rend la tâche
  // urgente au même titre qu'un marquage manuel — c'est déjà ce qui la fait
  // apparaître dans le bandeau urgent tout en haut (voir collectUrgentItems),
  // donc elle doit avoir le même style ici, dans sa case, pour rester cohérente.
  const dueStatusNow = (eff.due && !checked && !eff.waiting) ? dueStatus(eff.due) : null;
  const isDueUrgentNow = !!dueStatusNow && isDueUrgent(eff.due);
  // « En cours » : l'échéance ne rend plus urgent (on attend les autres) ;
  // seul un marquage manuel donne l'aspect urgent.
  const isUrgent = !eff.egg && (eff.urgent || (!eff.waiting && isDueUrgentNow));
  // N'anime que la tâche qu'on vient tout juste de cocher (voir justCheckedKey),
  // et une seule fois : les re-rendus suivants retombent sur le trait fixe.
  const justChecked = checked && key === justCheckedKey;
  const isNewHere = !checked && newFromOthers(cat).includes(idx);   // 10.31
  li.className = "item" + (isNewHere ? " is-new" : "") + (isRelance(eff) && !checked ? " item-relance" : "") + (isUrgent ? " item-urgent" : "") + (eff.egg && !checked ? " is-egg" : "") + (justChecked ? " just-checked" : "") + (checked ? " is-checked" : "");
  li.dataset.key = key;
  const personTag = eff.person ? `<span class="person-tag${eff.tier ? " tier-" + escapeAttr(eff.tier) : ""}">${escapeAttr(eff.person)}</span>` : "";
  const originTag = showOrigin ? `<span class="urgent-jump-cat">${escapeAttr(cat.title)}</span>` : "";
  const whoTag = eff.who ? `<span class="who-tag">${escapeAttr(eff.who)}</span>` : "";
  const dragHandleHtml = `<span class="drag-handle" aria-label="Glisser pour réordonner" title="Glisser pour déplacer">&#8942;&#8942;</span>`;
  const waitingBtnTitle = eff.waiting ? `Faire revenir dans ${escapeAttr(cat.title)}` : "Classé, suivi en cours";
  const waitingBtnIcon = hookArrowSvg(15, eff.waiting);
  const isRdv = isRdvTitle(eff.t);
  // une fois cochée, la tâche est faite : plus de sens à afficher un badge d'échéance (encore moins "en retard")
  const dueBadgeHtml = checked ? ""
    : eff.waiting
      ? (eff.relance ? `<span class="due-badge status-${isRelance(eff) ? "relance" : "future"}">Relance ${shortDateFR(splitDue(eff.relance).date)}</span>` : "")
      : (eff.due ? `<span class="due-badge status-${isRdv ? "rdv" : dueStatusNow}">${formatDueLabel(eff.due, isRdv)}</span>` : "");
  const isEgg = eff.egg && !checked; // en couvaison : pas de case, pas d'urgence, juste l'éclosion
  // 10.2 : liste partagée — initiale de qui a coché ; pas d'effacement des
  // tâches des autres quand la liste n'est pas à moi
  const canRemove = canRemoveTask(cat, base);
  let checkerTag = "";
  if(checked && isSharedList(cat.id)){
    const who = personName(checkerOf(cat.id, key), cat.id);
    checkerTag = `<span class="checker-tag" data-tip="Cochée par ${escapeAttr(who)}" aria-label="Cochée par ${escapeAttr(who)}">${escapeAttr(initialOf(who))}</span>`;
  }
  li.innerHTML = `
    ${dragHandleHtml}
    ${isEgg ? `<span class="egg-dot" title="En couvaison">${eggSvg(20)}</span>` : `<input type="checkbox" ${checked ? "checked" : ""} aria-label="${escapeAttr(eff.t)}">`}
    ${isNewHere ? newTagHtml(cat, base) : ""}<span class="item-text">${checkerTag}${whoTag}${personTag}<span class="item-title">${eff.note ? titleWithToggle(eff.t, noteToggleHtml(true, isNoteOpen(key))) : escapeAttr(eff.t)}</span>${originTag}${dueBadgeHtml}${eff.note ? noteFoldHtml(eff.note, "note") : ""}</span>
    <span class="item-controls">
      <button type="button" class="waiting-btn${eff.waiting ? " active" : ""}" ${checked ? 'disabled tabindex="-1" aria-hidden="true"' : ""} aria-label="${waitingBtnTitle}" data-tip="${waitingBtnTitle}">${waitingBtnIcon}</button>
      ${isEgg ? `<button type="button" class="hatch-btn" aria-label="Faire éclore" data-tip="Faire éclore"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle class="chick" cx="12" cy="8.2" r="3.6"/><path class="beak" d="M15.5 8.1l2 .7-2 .7"/><circle cx="13.1" cy="7.3" r=".55" fill="currentColor" stroke="none"/><path class="shell" d="M5.2 13.6c0 4.3 3 7.6 6.8 7.6s6.8-3.3 6.8-7.6l-2.3 1.5-2.2-1.7-2.3 1.7-2.3-1.7-2.2 1.7z"/></svg></button>` : `<button type="button" class="urgent-btn${eff.urgent ? " active" : ""}" ${checked ? 'disabled tabindex="-1" aria-hidden="true"' : ""} aria-label="${eff.urgent ? "Ne plus marquer urgent" : "Marquer comme urgent"}" data-tip="${eff.urgent ? "Ne plus marquer urgent" : "Marquer comme urgent"}">${triangleSvg(15)}</button>`}
      ${!canRemove ? `<span class="delete-spacer" aria-hidden="true"></span>` : checked
        ? `<button type="button" class="delete-btn" aria-label="Mettre à la corbeille des tâches accomplies" data-tip="Mettre à la corbeille"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>`
        : `<button type="button" class="delete-btn" aria-label="Effacer la tâche" data-tip="Effacer la tâche"><span class="x">&times;</span></button>`}
    </span>
  `;
  const checkbox = li.querySelector("input");
  if(checkbox) checkbox.addEventListener("change", ()=> setDone(key, checkbox.checked));
  haptic.attach(checkbox);
  // 8.39 : sur écran tactile, toucher la ligne dévoile ses boutons (une
  // ligne à la fois) ; sans effet visible à la souris
  li.addEventListener("click", ()=>{
    document.querySelectorAll(".item.revealed").forEach(o=>{ if(o !== li) o.classList.remove("revealed"); });
    li.classList.add("revealed");
  });
  if(eff.note){
    // 8.31 : un clic sur la ligne (hors case, poignée et boutons de droite)
    // déplie / replie le détail. Le 2e clic d'un double-clic est ignoré.
    markNoteHolder(li, key);
    li.addEventListener("click", (e)=>{
      if(e.detail > 1 || e.target.closest("input, .drag-handle, .item-controls")) return;
      toggleNoteOpen(key);
    });
  }
  li.querySelector(".item-text").addEventListener("dblclick", ()=>{
    if(eff.note) toggleNoteOpen(key); // rend l'état d'avant le 1er clic du double-clic
    editingKey = key;
    renderAll();
  });
  wireDragRow(li, dragMode === "waiting" ? key : String(idx), dragMode, cat);
  const hatchBtn = li.querySelector(".hatch-btn");
  if(hatchBtn) hatchBtn.addEventListener("click",(e)=>{
    e.stopPropagation();
    overrides = loadOverrides();
    overrides[key] = overrides[key] || {};
    overrides[key].egg = false;
    saveOverrides(overrides);
    actionToast("hatch");
    currentProgressMsg = null;
    renderAll();
  });
  const urgentBtnEl = li.querySelector(".urgent-btn");
  if(urgentBtnEl) urgentBtnEl.addEventListener("click",(e)=>{
    e.stopPropagation();
    overrides = loadOverrides(); // toujours repartir d'une copie fraîche, voir le commentaire sur la case à cocher
    overrides[key] = overrides[key] || {};
    const nowUrgent = !eff.urgent;
    overrides[key].urgent = nowUrgent;
    if(nowUrgent) overrides[key].egg = false; // urgent et en couvaison s'excluent
    saveOverrides(overrides);
    // 8.7 : marquer urgent ne déplace plus la tâche dans sa liste : elle
    // reste où elle est (elle apparaît en plus dans la case urgente).
    actionToast(nowUrgent ? "urgentOn" : "urgentOff");
    renderAll();
  });
  const deleteBtnEl = li.querySelector(".delete-btn");
  if(deleteBtnEl) deleteBtnEl.addEventListener("click",(e)=>{
    e.stopPropagation();
    // Tâche cochée (poubelle) : elle part dans la corbeille des tâches
    // accomplies. Tâche pas encore faite (croix) : elle est simplement effacée.
    state = loadState();
    checkedAt = loadJSONKey(CHECKED_AT_KEY, {});
    trash = loadJSONKey(TRASH_KEY, []);
    if(!Array.isArray(trash)) trash = [];
    overrides = loadOverrides();
    // 10.2 : cochée par quelqu'un d'autre : elle ne va pas dans MA corbeille
    // (elle ne compterait pas pour moi), elle est seulement retirée
    const wasDone = !!state[key] && checkedByMe(cat.id, key);
    if(wasDone) trash.push({
      t: eff.t, note: eff.note || "", who: eff.who || "", due: eff.due || "",
      catId: cat.id, catTitle: cat.title,
      doneOn: wasDone ? (checkedAt[key] || "") : "",
      purgedOn: todayISO(), kind: wasDone ? "done" : "deleted",
      key, // 10.0 : la tâche d'origine (rangée par son identifiant stable)
    });
    if(wasDone) saveJSONKey(TRASH_KEY, trash);
    if(checkedAt[key]){ delete checkedAt[key]; saveJSONKey(CHECKED_AT_KEY, checkedAt); }
    overrides = loadOverrides();
    overrides[key] = overrides[key] || {};
    overrides[key].deleted = true;
    saveOverrides(overrides);
    actionToast(wasDone ? "trash" : "erase");
    renderAll();
  });
  const waitBtn = li.querySelector(".waiting-btn");
  waitBtn.addEventListener("click",(e)=>{
    e.stopPropagation();
    if(eff.waiting) askBringBack(waitBtn, key);
    else askRelance(waitBtn, key);
  });
  return { el: li, focus: null };
}

function renderWaitingSection(){
  const ul = document.getElementById("waitingList");
  if(!ul) return;
  ul.innerHTML = "";
  const rows = [];
  DATA.forEach(cat=>{
    const items = getEffectiveItems(cat);
    items.forEach((base,i)=>{
      const key = itemKey(cat.id, i);
      if(isDeleted(key)) return;
      const eff = getEffective(key, base);
      if(!eff.waiting) return;
      rows.push({cat, idx:i, base, key, eff});
    });
  });
  if(rows.length === 0){
    const li = document.createElement("li");
    li.className = "empty-note";
    li.textContent = "Encore rien ici";
    ul.appendChild(li);
    return;
  }
  const manualOrder = getWaitingOrder(rows);
  rows.sort((a,b)=> manualOrder.indexOf(a.key) - manualOrder.indexOf(b.key));
  // marquées urgentes à la main : en haut de la case (sans aller dans la case urgente)
  const top = r => r.eff.urgent || isRelance(r.eff);
  const urgentFirst = rows.filter(top).concat(rows.filter(r => !top(r)));
  sortByUrgencyThenChecked(urgentFirst).forEach(row=>{
    const built = buildItemLi(row.cat, row.idx, row.base, row.key, {
      showOrigin:true,
      dragMode:"waiting",
    });
    ul.appendChild(built.el);
    if(built.focus) built.focus();
  });
}

// Tout ce qui se redessine, dans l'ordre.
const RENDERERS = [render, renderWaitingSection, renderAddCategoryRow, updateProgress, renderTrash, renderShare, renderBackupNudge, renderNewNotice];   // 10.31 : renderNewNotice
// 10.8 : un changement venu d'ailleurs (autre onglet, en ligne) arrivé
// pendant une édition ou une petite fenêtre n'est plus perdu : il est
// appliqué au rendu suivant (avant, il n'apparaissait qu'au rechargement)
let externalPending = false;
function renderAll(){
  if(externalPending && !hasActiveEdit()){
    externalPending = false;
    DATA.length = 0;
    reloadAllFromStorage();
    undoCurrent = null;
  }
  try{ maybeRollover(); }catch(err){ console.error("[semaine]", err); }
  try{
    document.body.classList.toggle("has-editing", !!editingKey || !!addingCat || !!addingCategory || !!editingCategoryTitle || !!editingCoursesKey);
    RENDERERS.forEach(fn => fn());
  }catch(err){
    // Filet de sécurité : une erreur de rendu (ex : donnée mal formée dans
    // une sauvegarde) ne doit jamais laisser un formulaire (édition, ajout…)
    // bloqué à l'écran sans réaction possible.
    console.error("[render] échec du rendu, réinitialisation des états en cours", err);
    editingKey = null;
    addingCat = null;
    addingCategory = false;
    editingCategoryTitle = null;
    editingCoursesKey = null;
    try{
      document.body.classList.remove("has-editing");
      RENDERERS.forEach(fn => fn());
    }catch(err2){
      console.error("[render] échec du filet de sécurité", err2);
    }
  }
  try{ noteUndoPoint(); }catch(err){ console.error("[annuler]", err); }
}

// ---- 10.15 : bas d'une liste de courses (saisie, Trier, Vider les rayés) ----
let editingCoursesKey = null;   // l'article en cours de modification (crayon)
// Enregistre la modification d'un article (Entrée, ou clic ailleurs) : nom et
// quantité, dans ses modifications comme pour une tâche. Un nom vide garde
// l'ancien ; une quantité tapée dans le nom (« 2 lait ») est reconnue.
function commitCoursesEdit(){
  const li = document.querySelector(".courses-item.editing");
  const key = editingCoursesKey;
  editingCoursesKey = null;
  if(li && key){
    try{
      const sep = key.lastIndexOf(":");
      const cat = DATA.find(c => c.id === key.slice(0, sep));
      overrides = loadOverrides();
      const base = cat && getEffectiveItems(cat)[parseInt(key.slice(sep + 1), 10)];
      if(cat && base){
        const eff = getEffective(key, base);
        const raw = coursesCleanLine(li.querySelector(".courses-edit-name").value);
        let t = raw, q = normCoursesQty(li.querySelector(".courses-edit-qty").value);
        const note = li.querySelector(".courses-edit-note").value.trim();
        if(!q){ const p = parseCoursesLine(raw); if(p.q){ t = p.t; q = p.q; } }
        if(!t) t = eff.t;
        if(t !== eff.t || q !== eff.q || note !== (eff.note || "")){
          overrides[key] = Object.assign({}, overrides[key] || {}, { t, q, note });
          saveOverrides(overrides);
          if(coursesNorm(t) !== coursesNorm(eff.t)) coursesHistoryAdd(cat.id, [capFirst(t)]);
        }
      }
    }catch(err){ console.error("[courses] modification", err); }
  }
  renderAll();
}
let refocusCoursesCat = null;   // la saisie garde le curseur après un ajout
let coursesScrollTo = null;     // { catId, key } ou { catId, top } : à montrer au rendu suivant
function buildCoursesFoot(cat){
  const foot = document.createElement("div");
  foot.className = "courses-foot";
  const struckN = coursesRows(cat).filter(r => state[r.key]).length;
  foot.innerHTML = `
    <div class="courses-add">
      <span class="drag-handle" aria-hidden="true">&#8942;&#8942;</span>
      <span class="courses-plus" aria-hidden="true">+</span>

        <textarea class="courses-input" rows="1" placeholder="Ajouter un article" aria-label="Ajouter un article à ${escapeAttr(cat.title)}" enterkeyhint="done" autocomplete="off"></textarea>
        <span class="courses-suggest" role="listbox" hidden></span>
      </span>
    </div>
    <div class="courses-actions">
      <button type="button" class="courses-btn courses-sort"${coursesSorted(cat) ? " disabled" : ""}>Trier</button>
      <button type="button" class="courses-btn courses-clear"${struckN ? "" : " disabled"}>Vider les rayés${struckN ? ` (${struckN})` : ""}</button>
    </div>`;
  foot.addEventListener("click", e => e.stopPropagation());   // ni repli ni dépli (10.19 : repliée, la saisie reste)
  const ta = foot.querySelector(".courses-input");
  const box = foot.querySelector(".courses-suggest");
  let sugg = [], active = -1, typedQty = "";
  const grow = ()=>{ ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; };
  const close = ()=>{ sugg = []; active = -1; box.hidden = true; box.innerHTML = ""; };
  // « 2 to » : suggestions pour « to », la quantité tapée suit l'article choisi
  const pickText = s => typedQty ? typedQty + " " + s.t : s.t;
  const paint = ()=>{
    const p = parseCoursesLine(ta.value);
    typedQty = p.q;
    sugg = /\n/.test(ta.value) ? [] : coursesSuggestions(cat, p.t);
    if(!sugg.length){ close(); return; }
    if(active >= sugg.length) active = sugg.length - 1;
    box.innerHTML = sugg.map((s, i) =>
      `<button type="button" class="courses-sugg${i === active ? " active" : ""}" role="option" aria-selected="${i === active}" data-i="${i}" tabindex="-1">${escapeAttr(s.t)}${s.struck ? `<span class="courses-sugg-note">rayé</span>` : ""}</button>`).join("");
    box.hidden = false;
  };
  const submit = text=>{
    if(!String(text || "").trim()) return;
    let res;
    try{ res = addCoursesLines(cat, text); }
    catch(err){ console.error("[courses] ajout", err); return; }
    ta.value = "";
    close();
    // 10.19 : ajouté depuis la carte repliée, la liste reste repliée (son
    // compteur grandit)
    if(res.already && !res.added && !res.revived && !res.qty) actionToast("coursesAlready");
    else if(res.qty && !res.added && !res.revived) actionToast("coursesQty");
    refocusCoursesCat = cat.id;
    if(res.lastKey) coursesScrollTo = { catId: cat.id, key: res.lastKey };
    renderAll();
  };
  ta.addEventListener("input", ()=>{ grow(); active = -1; paint(); });
  ta.addEventListener("keydown", e=>{
    if(e.isComposing) return;
    if(e.key === "ArrowDown" && sugg.length){ e.preventDefault(); active = (active + 1) % sugg.length; paint(); return; }
    if(e.key === "ArrowUp" && sugg.length){ e.preventDefault(); active = active <= 0 ? sugg.length - 1 : active - 1; paint(); return; }
    if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); submit(active > -1 && sugg[active] ? pickText(sugg[active]) : ta.value); return; }
    if(e.key === "Escape"){ e.preventDefault(); if(sugg.length) close(); else { ta.value = ""; grow(); ta.blur(); } }
  });
  // plusieurs lignes collées : un article par ligne, tout de suite
  ta.addEventListener("paste", e=>{
    const txt = e.clipboardData ? e.clipboardData.getData("text") : "";
    if(!txt || !/\n/.test(txt.trim())) return;
    e.preventDefault();
    submit(ta.value.slice(0, ta.selectionStart) + txt + ta.value.slice(ta.selectionEnd));
  });
  ta.addEventListener("blur", ()=> setTimeout(()=>{ if(document.activeElement !== ta) close(); }, 150));
  box.addEventListener("mousedown", e => e.preventDefault());   // le curseur reste dans la saisie
  box.addEventListener("click", e=>{
    const b = e.target.closest(".courses-sugg");
    if(b && sugg[+b.dataset.i]) submit(pickText(sugg[+b.dataset.i]));
  });
  foot.querySelector(".courses-sort").addEventListener("click", ()=>{
    try{ sortCourses(cat); }catch(err){ console.error("[courses] tri", err); }
    coursesScrollTo = { catId: cat.id, top: true };
    renderAll();
  });
  foot.querySelector(".courses-clear").addEventListener("click", ()=>{
    let n = 0;
    try{ n = clearStruckCourses(cat); }catch(err){ console.error("[courses] vider", err); }
    if(n) actionToast("coursesClear");
    renderAll();
  });
  if(refocusCoursesCat === cat.id) requestAnimationFrame(()=> ta.focus());
  return foot;
}
// dans le renommage d'une liste (double-clic sur le titre) : la convertir

// 10.27 : copier les tâches pas encore cochées d'une liste, une par ligne
function catTasksText(cat){
  state = loadState();
  const items = getEffectiveItems(cat);
  const courses = isCoursesList(cat.id);
  return getCatOrder(cat)
    .map(idx => ({ key: itemKey(cat.id, idx), base: items[idx] }))
    .filter(r => r.base && !isDeleted(r.key) && !state[r.key])
    .map(r => {
      const e = getEffective(r.key, r.base);
      let line = "- " + (e.t || "").trim();
      if(courses && e.q) line += " " + coursesQtyLabel(e.q);
      if(e.note && String(e.note).trim()) line += " (" + String(e.note).trim().replace(/\s*\n\s*/g, " ; ") + ")";
      if(e.urgent) line += " [urgent]";
      if(e.waiting) line += " [en cours]";
      return line;
    })
    .filter(l => l !== "- ");
}
function buildCatCopyRow(cat){
  const row = document.createElement("div");
  row.className = "cat-convert cat-copy";
  row.innerHTML = `<button type="button" class="cat-share-link">Copier (toutes les tâches de la liste)</button>`;
  row.addEventListener("mousedown", e => { if(e.target.closest("button")) e.preventDefault(); }); // le curseur reste dans le titre
  row.addEventListener("click", e => e.stopPropagation());
  const b = row.querySelector("button");
  b.addEventListener("click", async ()=>{
    const lines = catTasksText(cat);
    if(!lines.length){ b.textContent = "Rien à copier"; setTimeout(()=>{ b.textContent = "Copier (toutes les tâches de la liste)"; }, 1600); return; }
    const ok = await copyText(cat.title + "\n" + lines.join("\n"));
    b.textContent = ok ? `Copié (${lines.length})` : "La copie n'a pas marché";
    setTimeout(()=>{ b.textContent = "Copier (toutes les tâches de la liste)"; }, 1800);
  });
  return row;
}
// Hauteur d'une liste de courses : au plus celle de la plus haute des autres
// listes affichées (au moins ~24 lignes de texte, au plus 3/4 de l'écran) ;
// au-delà, seule la zone des articles défile. Position de défilement gardée,
// et l'article qu'on vient d'ajouter est montré.
function fitCoursesCards(saved){
  const cards = Array.from(categoriesEl.querySelectorAll(".category.courses"));
  if(!cards.length){ coursesScrollTo = null; return; }
  const rem = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
  let tallest = 0;
  categoriesEl.querySelectorAll(".category:not(.courses):not(.collapsed)").forEach(c=>{
    const ul = c.querySelector(":scope > ul.items");
    if(!ul) return;
    const h = ul.getBoundingClientRect().bottom - c.getBoundingClientRect().top + (parseFloat(getComputedStyle(c).paddingBottom) || 0);
    if(h > tallest) tallest = h;
  });
  const max = Math.round(Math.min(Math.max(tallest, 24 * rem), window.innerHeight * 0.75));
  cards.forEach(c=>{
    c.style.setProperty("--courses-max", max + "px");
    const ul = c.querySelector(":scope > ul.items");
    if(!ul) return;
    // 10.17 : la marge part du premier article, sous le titre (10.19 : repliée,
    // de la saisie)
    const first = ul.offsetParent ? ul : c.querySelector(":scope > .courses-foot");
    c.style.setProperty("--rule-top", (first ? first.offsetTop : c.offsetHeight) + "px");
    // 10.18 : barre de défilement maison, toujours visible
    let bar = c.querySelector(":scope > .courses-scroll");
    if(!bar){
      bar = document.createElement("div");
      bar.className = "courses-scroll";
      bar.setAttribute("aria-hidden", "true");
      bar.innerHTML = "<span></span>";
      c.appendChild(bar);
      ul.addEventListener("scroll", ()=> placeCoursesScroll(c), { passive:true });
    }
    placeCoursesScroll(c);
    if(saved && saved[c.id] != null) ul.scrollTop = saved[c.id];
    const go = coursesScrollTo && "cat-" + coursesScrollTo.catId === c.id ? coursesScrollTo : null;
    if(!go) return;
    if(go.top){ ul.scrollTop = 0; return; }
    const li = ul.querySelector(`[data-key="${CSS.escape(go.key)}"]`);
    if(!li) return;
    const ur = ul.getBoundingClientRect(), lr = li.getBoundingClientRect();
    if(lr.bottom > ur.bottom) ul.scrollTop += lr.bottom - ur.bottom + 4;
    else if(lr.top < ur.top) ul.scrollTop -= ur.top - lr.top + 4;
  });
  coursesScrollTo = null;
}
window.addEventListener("resize", ()=> fitCoursesCards());
// 10.18 : barre de défilement d'une liste de courses — cachée si tout tient,
// sinon à la hauteur de la zone des articles, curseur proportionnel
function placeCoursesScroll(card){
  const ul = card.querySelector(":scope > ul.items");
  const bar = card.querySelector(":scope > .courses-scroll");
  if(!ul || !bar) return;
  const view = ul.clientHeight, full = ul.scrollHeight;
  bar.hidden = !ul.offsetParent || full <= view + 1;
  if(bar.hidden) return;
  const thumbH = Math.max(24, Math.round(view * view / full));
  const top = Math.round(ul.scrollTop / (full - view) * (view - thumbH));
  bar.style.top = ul.offsetTop + "px";
  bar.style.height = view + "px";
  const thumb = bar.firstElementChild;
  thumb.style.height = thumbH + "px";
  thumb.style.top = top + "px";
}

function render(){
  // 10.15 : la zone des articles d'une liste de courses défile ; on garde sa
  // position d'un rendu à l'autre (rayer un article ne la ramène pas en haut)
  const coursesScroll = {};
  categoriesEl.querySelectorAll(".category.courses > ul.items").forEach(u => { coursesScroll[u.parentElement.id] = u.scrollTop; });
  categoriesEl.innerHTML = "";
  const catDisplayOrder = getCategoryOrder().filter(catIdx => !isCategoryDeleted(DATA[catIdx].id));
  let memoRank = 0;   // 10.23 : rang des mémos, pour varier leur reflet
  catDisplayOrder.forEach(catIdx=>{
    const cat = DATA[catIdx];
    const items = getEffectiveItems(cat);
    const courses = isCoursesList(cat.id);
    const card = document.createElement("div");
    card.className = "category" + (courses ? " courses" : "");
    card.id = "cat-" + cat.id;
    card.style.setProperty("--cat-color", displayCatColor(cat.color));
    if(courses){   // 10.23 : reflet propre à chaque mémo : 5 réglages bien distincts,
      // pris dans l'ordre d'affichage des mémos → deux voisins n'ont jamais le même
      const GLOSS = [[108, 14], [124, 28], [114, 21], [130, 11], [104, 32]];
      const g = GLOSS[memoRank++ % GLOSS.length];
      card.style.setProperty("--gloss-a", g[0] + "deg");
      card.style.setProperty("--gloss-p", g[1] + "%");
    }

    let visibleCount = 0, doneInCat = 0;
    if(courses) coursesRows(cat).forEach(r => { visibleCount++; if(state[r.key]) doneInCat++; });
    else items.forEach((base,i)=>{
      const k = itemKey(cat.id, i);
      if(isDeleted(k)) return;
      const eff = getEffective(k, base);
      if(eff.waiting) return;
      if(eff.egg && !state[k]) return;
      visibleCount++;
      if(state[k]) doneInCat++;
    });
    if(!courses && visibleCount && doneInCat === visibleCount) card.classList.add("done");
    const folded = isFolded(cat.id);
    if(folded) card.classList.add("collapsed");
    // 10.18 : une liste de courses repliée se déplie d'un clic n'importe où
    // (sauf sur un bouton, la poignée ou un champ)
    if(folded && courses) card.addEventListener("click", e=>{
      if(e.target.closest("button, a, input, textarea, .cat-grip")) return;
      toggleFold(cat.id);
    });
    const leftCount = visibleCount - doneInCat;
    // Une case vide (aucune tâche vivante dedans, cochée ou non) peut être
    // supprimée d'un petit clic ; sinon, pas de bouton du tout — la
    // meilleure façon d'éviter d'effacer une liste pleine par mégarde.
    // 10.2 : une liste partagée par quelqu'un d'autre ne se supprime pas d'ici
    const canDeleteCat = isCategoryEmpty(cat) && iOwnList(cat.id);
    // 10.2 : pastilles des personnes qui voient aussi cette liste
    const people = listPeople(cat.id);
    let shareChips = "";
    if(people.length){
      const ownerUid = (listInfo(cat.id) || {}).owner;
      const names = people.map(u => personName(u, cat.id));
      const tip = iOwnList(cat.id)
        ? "Partagée avec " + names.join(", ")
        : "Liste " + deName(personName(ownerUid, cat.id)) + ", partagée avec toi";
      shareChips = `<span class="share-chips" data-tip="${escapeAttr(tip)}" aria-label="${escapeAttr(tip)}">` +
        names.slice(0, 3).map(n => `<span class="share-chip">${escapeAttr(initialOf(n))}</span>`).join("") +
        (names.length > 3 ? `<span class="share-chip share-more">+${names.length - 3}</span>` : "") + `</span>`;
    }

    const renamingThisCat = editingCategoryTitle === cat.id;
    const reversed = isCatReversed(cat.id);
    const head = document.createElement("div");
    head.className = "cat-head";
    head.innerHTML = `
      <span class="cat-title-group">
        ${renamingThisCat
          ? `<input type="text" class="cat-title-input" value="${escapeAttr(cat.title)}">`
          : `${courses ? BASKET_SVG : ""}<span class="cat-title-line"><span class="cat-title">${escapeAttr(cat.title)}</span>${courses ? "" : `<button type="button" class="add-btn" aria-label="Ajouter une tâche">+</button>`}</span>${folded && leftCount ? `<span class="cat-count" aria-label="${leftCount} ${courses ? "à prendre" : "à faire"}">${leftCount}</span>` : ""}`}
        ${renamingThisCat && !courses ? `<button type="button" class="add-btn" aria-label="Ajouter une tâche">+</button>` : ""}
        ${renamingThisCat || courses ? "" : `<label class="cat-quick-wrap" title="Ajouter une tâche"><svg class="cat-quick-pen" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/><path d="M14.5 5.5l3 3"/></svg><input type="text" class="cat-quick" placeholder="Nouvelle tâche…" aria-label="Ajouter une tâche à ${escapeAttr(cat.title)}" enterkeyhint="done" autocomplete="off"></label>`}
      </span>
      <span class="cat-head-right">
        ${courses ? "" : `<button type="button" class="cat-order${reversed ? " reversed" : ""}" aria-label="${reversed ? "Mettre les récentes en haut" : "Mettre les récentes en bas"}" data-tip="${reversed ? "Récentes en haut ?" : "Récentes en bas ?"}"><svg viewBox="0 0 10 10" width="9" height="9" aria-hidden="true"><path d="M5 1.8 9 8.2H1z" fill="currentColor"/></svg></button>`}
        <span class="cat-grip" aria-label="Réorganiser les listes" data-tip="Réorganiser"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></span>
        ${canDeleteCat ? `<button type="button" class="cat-delete-btn" aria-label="Supprimer cette case vide" title="Supprimer cette case vide">&times;</button>` : ""}

    if(shareChips){ card.insertAdjacentHTML("beforeend", shareChips); card.classList.add("has-people"); }   // 10.31 : initiales en bas à droite

    // 10.19 : liste de courses ouverte : un clic sur le bandeau, à côté du

    if(quickInp){

    (courses ? rows : sortByUrgencyThenChecked(catDisplayRows(cat, rows))).forEach(r=>{

const TRASH_MESSAGES = [
  "Un ossuaire de victoires, classé avec la minutie d'un archiviste communal.",
  "Ici reposent des tâches accomplies. Le faisan n'a pas été convié aux funérailles.",

function formatTrashWeek(monday){
  if(!monday) return "Accomplies avant la corbeille (non datées)";
  const [y,m,d] = monday.split("-");
  const thisMonday = mondayOf(todayISO());
  if(monday === thisMonday) return "Cette semaine";
  if(monday === addDaysISO(thisMonday, -7)) return "Semaine dernière";
  return "Semaine du " + parseInt(d,10) + "/" + parseInt(m,10) + "/" + y;
}
function restoreFromTrash(idx){
  trash = loadJSONKey(TRASH_KEY, []);
  const entry = trash[idx];
  if(!entry) return false;
  let cat = DATA.find(c => c.id === entry.catId);
  if(cat && isCategoryDeleted(cat.id)){
    deletedCategoryIds = loadDeletedCategoryIds().filter(id => id !== cat.id);
    saveDeletedCategoryIds(deletedCategoryIds);
  }
  if(!cat) cat = addCategory(entry.catTitle || "Récupérées");
  if(!cat) return false;
  const item = { t: entry.t || "(sans titre)" };
  if(entry.note) item.note = entry.note;
  if(entry.who) item.who = entry.who;
  if(entry.due) item.due = entry.due;
  const newKey = itemKey(cat.id, insertItem(cat, item));
  state = loadState();
  if(state[newKey]){ delete state[newKey]; saveState(state); }
  // On retire l'entrée de la corbeille seulement une fois la tâche remise.
  trash.splice(idx, 1);
  saveJSONKey(TRASH_KEY, trash);
  return true;
}
// ---------- 6.1 : graphique des tâches accomplies (corbeille) ----------
// Rien de nouveau n'est stocké sur les tâches : on relit les dates de coche
// déjà enregistrées (corbeille + tâches cochées pas encore purgées). Seul le
// choix du switch Jour / Semaine / Mois est mémorisé, sous une clé à part.
const TRASH_CHART_KEY = "fauconnerie-v2-trashchart";
const TC_MODES = { jour:"Jour", semaine:"Semaine", mois:"Mois" };
const MONTHS_FR_SHORT = ["janv","févr","mars","avr","mai","juin","juil","août","sept","oct","nov","déc"];
function getTrashChartMode(){
  try{ const m = Store.get(TRASH_CHART_KEY); return TC_MODES[m] ? m : "semaine"; }catch(e){ return "semaine"; }
}
function setTrashChartMode(m){ try{ Store.set(TRASH_CHART_KEY, m); }catch(e){} }
function collectDoneDates(){
  const dates = []; let undated = 0;
  const tr = loadJSONKey(TRASH_KEY, []);
  (Array.isArray(tr) ? tr : []).forEach(e=>{
    if(!e || e.kind === "deleted") return;
    if(e.doneOn) dates.push(e.doneOn); else undated++;
  });
  const st = loadState(), ca = loadJSONKey(CHECKED_AT_KEY, {});
  DATA.forEach(cat=>{
    if(isCoursesList(cat.id)) return;   // 10.15
    getEffectiveItems(cat).forEach((base, i)=>{
      const key = itemKey(cat.id, i);
      if(isDeleted(key) || !st[key]) return;
      if(!checkedByMe(cat.id, key)) return;
      if(ca[key]) dates.push(ca[key]); else undated++;
    });
  });
  waitLog().forEach(e=>{ if(e && e.on) dates.push(e.on); }); // envois en cours (8.1)
  return { dates, undated };
}
function trashChartBuckets(mode, dates){
  const today = todayISO();
  const keyOf = mode === "jour" ? (d => d) : mode === "semaine" ? mondayOf : (d => d.slice(0, 7));
  const counts = {};
  dates.forEach(d=>{ const k = keyOf(d); counts[k] = (counts[k] || 0) + 1; });
  const buckets = [];
  if(mode === "jour"){
    for(let i = 13; i >= 0; i--){
      const d = addDaysISO(today, -i);
      buckets.push({ key:d, label:String(parseInt(d.slice(8), 10)), sub:weekdayNameFR(d).charAt(0).toUpperCase() });
    }
  }else if(mode === "semaine"){
    const m0 = mondayOf(today);
    for(let i = 11; i >= 0; i--){
      const d = addDaysISO(m0, -7*i);
      buckets.push({ key:d, label:parseInt(d.slice(8), 10) + "/" + parseInt(d.slice(5, 7), 10), sub:"" });
    }
  }else{
    let y = +today.slice(0, 4), m = +today.slice(5, 7);
    for(let i = 0; i < 12; i++){
      buckets.unshift({ key:y + "-" + String(m).padStart(2, "0"), label:MONTHS_FR_SHORT[m-1], sub:(m === 1 ? String(y) : "") });
      m--; if(m === 0){ m = 12; y--; }
    }
  }
  buckets.forEach(b => b.v = counts[b.key] || 0);
  const curKey = buckets[buckets.length - 1].key;
  let record = 0, recordPrev = 0;
  Object.keys(counts).forEach(k=>{
    record = Math.max(record, counts[k]);
    if(k !== curKey) recordPrev = Math.max(recordPrev, counts[k]);
  });
  return { buckets, record, recordPrev };
}
function doneStreak(dates){
  const set = new Set(dates);
  let d = todayISO();
  if(!set.has(d)) d = addDaysISO(d, -1); // la journée n'est pas finie : la série tient encore
  let n = 0;
  while(set.has(d)){ n++; d = addDaysISO(d, -1); }
  return n;
}
function trashChartMessage(mode, cur, prev, recordPrev){
  const W = { jour:["aujourd'hui","hier"], semaine:["cette semaine","la semaine dernière"], mois:["ce mois-ci","le mois passé"] }[mode];
  const Cap = W[0].charAt(0).toUpperCase() + W[0].slice(1);
  if(cur > 0 && cur > recordPrev && recordPrev > 0) return "Record battu " + W[0] + " ! Le bourgmestre fait déjà poser une plaque.";
  if(cur > 0 && cur === recordPrev) return "Record égalé " + W[0] + ". Une de plus et il tombe.";
  if(cur > prev) return Cap + ", déjà " + (cur - prev) + " de plus que " + W[1] + ". Le faisan fulmine.";
  if(cur === prev && cur > 0) return "À égalité avec " + W[1] + ". Une de plus et tu passes devant.";
  if(cur < prev) return (cur > 0 ? "Plus que " : "Encore ") + (prev - cur) + " pour égaler " + W[1] + ".";
  return "Une seule tâche et la barre décolle.";
}
function renderTrashChart(el){
  if(!el) return;
  const mode = getTrashChartMode();
  const { dates, undated } = collectDoneDates();
  const { buckets, record, recordPrev } = trashChartBuckets(mode, dates);
  const n = buckets.length, cur = buckets[n-1].v, prev = buckets[n-2].v;
  const streak = doneStreak(dates);
  const words = { jour:["auj.","hier"], semaine:["cette sem.","sem. dernière"], mois:["ce mois","mois passé"] }[mode];
  el.innerHTML = `
    <div class="tc-head">
      <div class="tc-switch" role="group" aria-label="Période du graphique">
        ${Object.keys(TC_MODES).map(m => `<button type="button" data-mode="${m}" class="${m === mode ? "on" : ""}" aria-pressed="${m === mode}">${TC_MODES[m]}</button>`).join("")}
      </div>
      <span class="tc-stats"><b>${cur}</b> ${words[0]} · ${prev} ${words[1]} · record ${record}${streak >= 2 ? " · série " + streak + " j" : ""}</span>
    </div>
    <div class="tc-svg"></div>
    <p class="tc-msg">${escapeAttr(trashChartMessage(mode, cur, prev, recordPrev))}</p>
    ${undated ? `<p class="tc-note">+ ${undated} ${undated > 1 ? "tâches accomplies sans date, hors graphique" : "tâche accomplie sans date, hors graphique"}</p>` : ""}
  `;
  const holder = el.querySelector(".tc-svg");
  const W = Math.max(260, Math.round(holder.clientWidth || 560));
  const hasSub = buckets.some(b => b.sub);
  const H = hasSub ? 140 : 128, padX = 2, top = 16, base = H - (hasSub ? 32 : 20);
  const slot = (W - 2*padX) / n, bw = Math.min(34, slot * 0.62);
  const maxV = Math.max(1, ...buckets.map(b => b.v));
  let g = `<line x1="0" x2="${W}" y1="${base + 0.5}" y2="${base + 0.5}" stroke="var(--line)"/>`;
  buckets.forEach((b, i)=>{
    const cx = padX + slot*(i + 0.5), isNow = i === n - 1;
    const h = b.v ? Math.max(3, (base - top) * b.v / maxV) : 0;
    const x = (cx - bw/2).toFixed(1);
    if(h){
      const cls = "tc-bar" + (isNow ? " now" : "") + (b.v === record ? " best" : "");
      g += `<rect class="${cls}" x="${x}" y="${(base - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3"><title>${b.v} accomplie${b.v > 1 ? "s" : ""}</title></rect>`;
      g += `<text class="tc-val" x="${cx.toFixed(1)}" y="${(base - h - 4).toFixed(1)}" text-anchor="middle">${b.v}</text>`;
    }else{
      g += `<rect class="tc-bar empty" x="${x}" y="${base - 2}" width="${bw.toFixed(1)}" height="2" rx="1"/>`;
    }
    // écran étroit : une étiquette sur deux (en gardant toujours la période en cours)
    const showLbl = slot >= 32 || (n - 1 - i) % 2 === 0;
    if(showLbl) g += `<text class="tc-lbl${isNow ? " now" : ""}" x="${cx.toFixed(1)}" y="${base + 13}" text-anchor="middle">${b.label}</text>`;
    if(b.sub) g += `<text class="tc-lbl${isNow ? " now" : ""}" x="${cx.toFixed(1)}" y="${base + 25}" text-anchor="middle">${b.sub}</text>`;
  });
  holder.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Tâches accomplies par ${TC_MODES[mode].toLowerCase()}">${g}</svg>`;
  el.querySelectorAll(".tc-switch button").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      setTrashChartMode(btn.dataset.mode);
      renderTrashChart(el); // seul le graphique se redessine : la liste garde sa position
    });
  });
}
function renderTrash(){
  const link = document.getElementById("trashLink");
  const panel = document.getElementById("trashPanel");
  if(!link || !panel) return;
  trash = loadJSONKey(TRASH_KEY, []);
  if(!Array.isArray(trash)) trash = [];
  const isDoneEntry = e => !e || e.kind !== "deleted";
  const doneTotal = trash.filter(isDoneEntry).length;
  link.classList.toggle("open", trashOpen);
  link.title = doneTotal + (doneTotal > 1 ? " tâches accomplies, classées par jour" : " tâche accomplie, classée par jour");
  link.setAttribute("aria-label", "Corbeille des tâches accomplies : " + doneTotal);
  link.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="lid"><path d="M3 6h18"/><path d="M9 6V4h6v2"/></g><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/></svg><span>Corbeille</span><span class="trash-link-badge">${doneTotal}</span>`;
  panel.hidden = !trashOpen;
  if(!trashOpen){ panel.innerHTML = ""; return; }
  if(!trashMsg) trashMsg = TRASH_MESSAGES[Math.floor(Math.random()*TRASH_MESSAGES.length)];
  const n = doneTotal;
  panel.innerHTML = `
    <div class="trash-head">
      <div class="trash-total">${n}<small>${n > 1 ? "tâches accomplies au compteur" : "tâche accomplie au compteur"}</small></div>
      <button type="button" class="trash-close">Fermer</button>
    </div>
    <p class="trash-msg">${n ? escapeAttr(trashMsg) : trash.length ? "Rien d'accompli au compteur pour l'instant. Première récolte lundi." : "Corbeille vide pour l'instant. Première récolte lundi : les tâches cochées avant ce jour-là y descendront d'elles-mêmes."}</p>
    <div class="trash-chart"></div>
    <div class="trash-groups"></div>
  `;
  panel.querySelector(".trash-close").addEventListener("click", ()=>{ trashOpen = false; renderAll(); });
  try{ renderTrashChart(panel.querySelector(".trash-chart")); }catch(err){ console.error("[graphique corbeille]", err); }
  const groups = new Map();
  trash.forEach((entry, idx)=>{
    const day = !isDoneEntry(entry) ? "__deleted__" : ((entry && entry.doneOn) ? mondayOf(entry.doneOn) : "");
    if(!groups.has(day)) groups.set(day, []);
    groups.get(day).push({ entry, idx });
  });
  const days = Array.from(groups.keys()).sort((a,b)=>{
    if(a === b) return 0;
    if(a === "__deleted__") return 1;   // supprimées sans être faites : tout en bas
    if(b === "__deleted__") return -1;
    if(!a) return 1;   // puis les non datées
    if(!b) return -1;
    return a < b ? 1 : -1; // le plus récent en haut
  });
  const wrap = panel.querySelector(".trash-groups");
  days.forEach(day=>{
    const rows = groups.get(day).sort((x,y)=>
      String(y.entry.doneOn||"").localeCompare(String(x.entry.doneOn||"")) ||
      String(x.entry.t||"").localeCompare(String(y.entry.t||""), "fr"));
    const head = document.createElement("div");
    head.className = "trash-day";
    head.innerHTML = `<span>${escapeAttr(day === "__deleted__" ? "Effacées sans avoir été faites (hors compteur)" : formatTrashWeek(day))}</span><span>${rows.length}</span>`;
    wrap.appendChild(head);
    const ul = document.createElement("ul");
    ul.className = "items";
    rows.forEach(({entry, idx})=>{
      const li = document.createElement("li");
      li.className = "trash-item";
      const who = entry.who ? `<span class="who-tag">${escapeAttr(entry.who)}</span>` : "";
      li.innerHTML = `
        <span class="trash-tick" aria-hidden="true">${isDoneEntry(entry) ? "&#10003;" : "&ndash;"}</span>
        <span class="item-text">${who}${escapeAttr(capFirst(entry.t))}${entry.note ? `<span class="note">${escapeAttr(entry.note)}</span>` : ""}</span><span class="trash-date">${entry.doneOn ? shortDateFR(entry.doneOn) : ""}</span>
        <span class="item-controls"><button type="button" class="waiting-btn" aria-label="Remettre dans la liste" data-tip="Remettre dans la liste">${hookArrowSvg(15, true)}</button><button type="button" class="delete-btn" aria-label="Supprimer de la corbeille" data-tip="Supprimer de la corbeille">&times;</button></span>
      `;
      li.querySelector(".waiting-btn").addEventListener("click", (e)=>{
        e.stopPropagation();
        if(restoreFromTrash(idx)) actionToast("restore");
        renderAll();
      });
      li.querySelector(".delete-btn").addEventListener("click", (e)=>{
        e.stopPropagation();
        trash = loadJSONKey(TRASH_KEY, []);
        if(trash[idx]){ trash.splice(idx, 1); saveJSONKey(TRASH_KEY, trash); actionToast("trashDelete"); }
        renderAll();
      });
      ul.appendChild(li);
    });
    wrap.appendChild(ul);
  });
}

// Cocher (ou décocher) une tâche, d'où que vienne le geste : la case de la
// liste, la case urgente ou le trèfle. On repart toujours d'une copie
// fraîche de ce qui est vraiment sur le disque : si un autre onglet a
// sauvegardé entre-temps, on ne l'écrase pas avec une copie périmée (c'est
// ce qui faisait jadis « réapparaître » une tâche pourtant cochée).
function setDone(key, checked){
  state = loadState();
  const prevPct = pctFromState();
  state[key] = checked;
  saveState(state);
  markChecked(key, checked);
  // 10.2 : qui a coché (seulement avec un compte : sans compte, tout est à moi)
  const me = myUid();
  overrides = loadOverrides();
  const o = overrides[key];
  if(checked && me && !(o && o.doneBy === me)){
    overrides[key] = Object.assign({}, o || {}, { doneBy: me });
    saveOverrides(overrides);
  }else if(!checked && o && o.doneBy !== undefined){
    const rest = Object.assign({}, o);
    delete rest.doneBy;
    if(Object.keys(rest).length) overrides[key] = rest; else delete overrides[key];
    saveOverrides(overrides);
  }
  currentProgressMsg = null;
  if(checked){
    haptic.strong();
    justCheckedKey = key;
    const newPct = pctFromState();
    const crossed = MILESTONES.find(m => prevPct < m.p && newPct >= m.p);
    celebrate(crossed ? crossed.msg : undefined);
  }
  renderAll();
  justCheckedKey = null;
}

// 8.37 : compteur en bloc, les deux lignes à la largeur de « cette semaine ».
// Plus étroite, la 1re ligne s'étire en CSS (espace avant « accomplies »).
// Plus large (deux chiffres), le chiffre rapetisse juste assez pour tenir,
// sans descendre sous 62 % ; s'il ne tient toujours pas, « cette semaine »
// s'espace lettre par lettre pour le reste.
const COUNT_NUMBER_EM = 4.2, COUNT_NUMBER_MIN = 0.62;
function fitCountBlock(){
  const line = document.querySelector(".count-line");
  const week = document.querySelector(".count-week");
  if(!line || !week) return;
  const num = line.firstElementChild, word = line.lastElementChild;
  num.style.fontSize = "";
  week.style.letterSpacing = "";
  const weekW = week.getBoundingClientRect().width;
  if(!weekW) return; // pas affiché : on réessaiera au prochain rendu
  const gap = parseFloat(getComputedStyle(line).columnGap) || 0;
  const numW = num.getBoundingClientRect().width;
  const room = weekW - gap - word.getBoundingClientRect().width;
  if(numW <= room) return;
  // un seul chiffre garde toujours sa taille (0 et 7 pareils) ; seuls les
  // nombres à deux chiffres rapetissent, tous de la même façon
  const ratio = num.textContent.length > 1 ? Math.max(COUNT_NUMBER_MIN, room / numW) : 1;
  if(ratio < 1) num.style.fontSize = (COUNT_NUMBER_EM * ratio) + "em";
  const over = numW * ratio - room;
  if(over > 0.5){
    const base = parseFloat(getComputedStyle(week).letterSpacing) || 0;
    week.style.letterSpacing = (base + over / week.textContent.length) + "px";
  }
}

function updateProgress(){
  const total = getTotalItems();
  const done = getDoneCount();
  // Compteur affiché : tâches cochées depuis lundi (repart de zéro chaque
  // semaine). La barre et les messages gardent le calcul faites / total.
  const weekDone = getWeekDoneCount();
  document.getElementById("doneCount").textContent = weekDone;
  document.getElementById("doneWord").textContent = weekDone > 1 ? "accomplies" : "accomplie";
  fitCountBlock();
  // 8.10 : à droite, un chiffre seul (8.32) ; 10.12 : les tâches qui restent
  // à faire (ni cochées, ni envoyées « en cours » sauf relance du jour,
  // œufs exclus) — le même calcul que la barre : total - faites
  const left = Math.max(0, total - done);
  const totalEl = document.getElementById("totalCount");
  totalEl.textContent = left;
  totalEl.title = left > 1 ? left + " tâches encore à faire" : left + " tâche encore à faire";
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById("barFill").style.width = pct + "%";

  if(pct === 0){
    // pioche un message de départ si on n'en a pas déjà un de ce lot
    if(!START_MESSAGES.includes(currentProgressMsg))
      currentProgressMsg = START_MESSAGES[Math.floor(Math.random()*START_MESSAGES.length)];
  }else if(pct >= 100){
    if(!DONE_MESSAGES.includes(currentProgressMsg))
      currentProgressMsg = DONE_MESSAGES[Math.floor(Math.random()*DONE_MESSAGES.length)];
  }else if(!currentProgressMsg){
    currentProgressMsg = pickAmbientMessage();
  }
  document.getElementById("progressMsg").textContent = currentProgressMsg;
}

// Écouteurs globaux pour tout le geste de glisser-déposer, posés une seule
// fois : la capture du pointeur vit sur <html> (voir wireDragRow), donc
// pointermove/pointerup/pointercancel/lostpointercapture arrivent tous ici
// plutôt que sur chaque poignée individuellement — un seul jeu de suivi,
// qui continue à fonctionner peu importe combien de lignes sont franchies
// pendant le geste.
document.addEventListener("pointermove", (e)=>{
  if(!dragState || dragState.pointerId !== e.pointerId) return;
  scheduleDragPointerMove(e.clientX, e.clientY);
});
document.addEventListener("pointerup", (e)=>{
  if(!dragState || dragState.pointerId !== e.pointerId) return;
  try{ document.documentElement.releasePointerCapture(e.pointerId); }catch(err){}
  endDragGesture();
});
document.addEventListener("pointercancel", (e)=>{
  if(!dragState || dragState.pointerId !== e.pointerId) return;
  try{ document.documentElement.releasePointerCapture(e.pointerId); }catch(err){}
  // Annulé (ex : interruption système) : on revient à l'ordre sauvegardé.
  cancelDragGesture();
});
// Filet de sécurité : "lostpointercapture" se déclenche TOUJOURS quand la
// capture se termine, quelle qu'en soit la raison (y compris un pointerup
// qui, pour une raison ou une autre, ne serait pas arrivé jusqu'ici) — ça
// évite qu'une ligne reste bloquée estompée si le cycle normal ne s'est
// pas déroulé comme prévu.
document.addEventListener("lostpointercapture", (e)=>{
  if(!dragState || dragState.pointerId !== e.pointerId) return;
  endDragGesture();
});

// Si ce stockage change depuis un AUTRE onglet ou une autre fenêtre de
// cette même page (par ex. la page rouverte ailleurs, ou un onglet resté
// ouvert depuis une mise à jour précédente), on rafraîchit l'affichage
// tout de suite plutôt que d'attendre — et surtout, ça évite qu'une action
// faite ici ensuite n'écrase par erreur ce qui vient d'être fait ailleurs.
// (L'événement "storage" ne se déclenche jamais dans l'onglet qui a
// lui-même écrit — pas de risque de boucle.)
// 9.2 : le traitement est une fonction à part, applyExternalChange(clé),
// pour que la future synchro en ligne (autre appareil) emprunte exactement le
// même chemin qu'un autre onglet. Comportement inchangé.
function applyExternalChange(key){
  if(key === LAST_BACKUP_KEY){ renderBackupNudge(); return; }
  if(!BACKUP_KEYS.includes(key)) return;
  if(hasActiveEdit()){ externalPending = true; return; } // on ne casse jamais un formulaire ouvert ici (10.8 : appliqué ensuite)
  DATA.length = 0; // 10.1 : une liste peut aussi disparaître (synchro, restauration ailleurs)
  reloadAllFromStorage();
  undoCurrent = null; // un autre onglet a écrit : son changement n'est pas un geste d'ici à annuler
  renderAll();
}
// 10.0 : un autre onglet écrit dans les fiches (sltapis:…) ; Store relit et
// dit quelles anciennes clés ont changé de contenu.
// 10.1 : même chemin pour ce qui arrive d'en ligne (Sync, en fin de script).
function storeChangedElsewhere(storageKey){
  // 10.2 : quelqu'un d'autre a changé une liste partagée : ⌘Z remettrait des
  // clés entières (et défairait son geste à lui) — on repart d'une pile vide
  if(storageKey === Store.ns + "remote-shared"){ undoStack.length = 0; saveUndoStack(); }
  const changed = Store.receive(storageKey);
  if(changed.includes(LAST_BACKUP_KEY)) applyExternalChange(LAST_BACKUP_KEY);
  const k = changed.find(x => BACKUP_KEYS.includes(x));
  if(k) applyExternalChange(k);
  else if(changed.includes(Store.sharingKey)){ if(hasActiveEdit()) externalPending = true; else renderAll(); } // 10.2 : membres, noms, carnet
}
window.addEventListener("storage", (e)=>{
  storeChangedElsewhere(e.key);
  if(typeof Sync !== "undefined") Sync.storageEvent(e.key);
});

// ---- 8.1 : annuler le dernier geste (⌘Z / Ctrl+Z) ----
// Toutes les tâches vivent dans quelques clés du stockage : après chaque
// rendu, on compare ces clés à leur état précédent ; si quelque chose a
// changé, les anciennes valeurs (seulement les clés touchées) partent sur une
// pile (40 crans). ⌘Z les remet en place.
// 8.5 : la pile est gardée dans le stockage de l'onglet (sessionStorage) :
// elle survit à un rechargement, et n'est plus vidée quand un autre onglet
// de l'appli écrit quelque chose (ce qui arrivait dès qu'un 2e onglet était ouvert).
const UNDO_KEYS = BACKUP_KEYS.concat([LUCKY_KEY]);
const UNDO_MAX = 40;
const UNDO_SESSION_KEY = "fauconnerie-v2-undo";
let undoStack = (()=>{ try{ const a = JSON.parse(sessionStorage.getItem(UNDO_SESSION_KEY) || "[]"); return Array.isArray(a) ? a : []; }catch(e){ return []; } })();
let undoCurrent = null;
function saveUndoStack(){
  while(true){
    try{ sessionStorage.setItem(UNDO_SESSION_KEY, JSON.stringify(undoStack)); return; }
    catch(e){ if(!undoStack.length) return; undoStack.shift(); } // trop lourd : on oublie les plus anciens
  }
}
function storageSnapshot(){
  const o = {};
  UNDO_KEYS.forEach(k=>{ try{ o[k] = Store.get(k); }catch(e){ o[k] = null; } });
  return o;
}
function noteUndoPoint(){
  const now = storageSnapshot();
  if(undoCurrent !== null){
    const before = {};
    let changed = false;
    UNDO_KEYS.forEach(k=>{ if(now[k] !== undoCurrent[k]){ before[k] = undoCurrent[k]; changed = true; } });
    if(changed){
      undoStack.push(before);
      if(undoStack.length > UNDO_MAX) undoStack.shift();
      saveUndoStack();
    }
  }
  undoCurrent = now;
}
function undoLast(){
  if(!undoStack.length){ celebrate("Rien à annuler.", true); return; }
  const prev = undoStack.pop();
  saveUndoStack();
  Object.keys(prev).forEach(k=>{
    try{ if(prev[k] === null) Store.remove(k); else Store.set(k, prev[k]); }catch(e){}
  });
  undoCurrent = null; // le rendu qui suit repart de cet état-là
  DATA.length = 0;
  reloadAllFromStorage();
  currentProgressMsg = null;
  renderAll();
  celebrate("Retour en arrière.", true);
}

  const typing = a && (a.isContentEditable || a.tagName === "TEXTAREA" || a.tagName === "SELECT" ||

  if(typing || hasActiveEdit()) return; // dans un champ : l'annulation du texte reste celle du navigateur
  e.preventDefault();
  undoLast();
});

  trashOpen = !trashOpen;
  if(trashOpen){ shareOpen = false; shareNewLink = null; shareMsg = ""; }
  trashMsg = null;
  renderAll();
  if(trashOpen){
    const p = document.getElementById("trashPanel");
    if(p) p.scrollIntoView({ behavior:"smooth", block:"start" });
  }
});

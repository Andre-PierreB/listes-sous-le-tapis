// objets lancés, dessinés autour de (0, 0), à peu près 30 px de long
function heartPath(c, k = 1){
  c.beginPath(); c.moveTo(0, 10 * k);
  c.bezierCurveTo(-5 * k, 6 * k, -14 * k, 0, -13 * k, -6.5 * k);
  c.bezierCurveTo(-12 * k, -13 * k, -3 * k, -14 * k, 0, -7 * k);
  c.bezierCurveTo(3 * k, -14 * k, 12 * k, -13 * k, 13 * k, -6.5 * k);
  c.bezierCurveTo(14 * k, 0, 5 * k, 6 * k, 0, 10 * k);
  c.closePath();
}
function drawObjet(c, type, x, y, rot = 0, sc = 1){
  // objets en aplats, aux couleurs de l'appli (mauve des urgences, ardoise des boutons, bleu-vert, rose,
  // or du trèfle) — pas de dégradés ni de reflets : on reste loin des émoticônes
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(sc, sc);
  c.lineJoin = "round"; c.lineCap = "round";
  if(type === "roue"){
    c.strokeStyle = "#A39C94"; c.lineWidth = 0.5;                                            // rayons croisés
    for(let i = 0; i < 16; i++){ const a0 = i / 16 * Math.PI * 2, a1 = a0 + (i % 2 ? 0.5 : -0.5);
      c.beginPath(); c.moveTo(Math.cos(a0) * 1.6, Math.sin(a0) * 1.6); c.lineTo(Math.cos(a1) * 10, Math.sin(a1) * 10); c.stroke(); }
    c.strokeStyle = "#C9C2B8"; c.lineWidth = 1.3; c.beginPath(); c.arc(0, 0, 10.2, 0, 7); c.stroke();   // jante
    c.strokeStyle = "#4A5E6E"; c.lineWidth = 2.8; c.beginPath(); c.arc(0, 0, 12, 0, 7); c.stroke();     // pneu ardoise
    c.fillStyle = "#2F6F7C"; c.beginPath(); c.arc(0, 0, 2.1, 0, 7); c.fill();                           // moyeu bleu-vert
    c.fillStyle = "#E3B53C"; c.fillRect(-0.7, -10.6, 1.4, 2.3);                                         // valve
  }else if(type === "coeur"){
    c.fillStyle = "#D98DA1"; heartPath(c); c.fill();
    c.strokeStyle = "#C24F6E"; c.lineWidth = 1.2; heartPath(c); c.stroke();
    c.fillStyle = "rgba(255,255,255,0.55)"; c.beginPath(); c.ellipse(-6.2, -6.6, 2.4, 1.3, -0.6, 0, 7); c.fill();
  }else if(type === "stylo"){
    c.rotate(-0.75);
    c.fillStyle = "#9558D0"; roundRect(c, -16, -3, 15, 6, 3); c.fill();                    // corps mauve
    c.fillStyle = "#562F96"; c.fillRect(-16, 0.8, 15, 2.2);                                  // ombre plate du corps
    c.fillStyle = "#E3B53C"; c.fillRect(-4.2, -3.1, 1.4, 6.2); c.fillRect(-14, -4.6, 9, 1.3);   // bague et agrafe
    c.fillStyle = "#4A5E6E"; c.beginPath(); c.moveTo(-1, -2.6); c.lineTo(2.5, -2.1); c.lineTo(2.5, 2.1); c.lineTo(-1, 2.6); c.closePath(); c.fill();
    c.fillStyle = "#E3B53C"; c.beginPath(); c.moveTo(2.2, -3.6);                              // plume en fer de lance
    c.bezierCurveTo(7, -4.6, 12, -2.6, 16.5, 0); c.bezierCurveTo(12, 2.6, 7, 4.6, 2.2, 3.6); c.closePath(); c.fill();
    c.strokeStyle = "#2A2725"; c.lineWidth = 0.7; c.beginPath(); c.moveTo(8.6, 0); c.lineTo(16.5, 0); c.stroke();
    c.fillStyle = "#2A2725"; c.beginPath(); c.arc(8, 0, 1, 0, 7); c.fill();
  }else if(type === "reveil"){
    c.strokeStyle = "#4A5E6E"; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(-5, 6.5); c.lineTo(-7.5, 10); c.moveTo(5, 6.5); c.lineTo(7.5, 10); c.stroke();   // pieds
    c.beginPath(); c.moveTo(0, -9.5); c.lineTo(0, -12.5); c.stroke();                                         // marteau
    c.fillStyle = "#4A5E6E"; c.beginPath(); c.arc(0, -12.8, 1.2, 0, 7); c.fill();
    for(const sx of [-1, 1]){                                                                               // cloches en dôme
      c.save(); c.rotate(sx * 0.62); c.translate(0, -9.6);
      c.fillStyle = "#E3B53C"; c.beginPath(); c.arc(0, 0, 4, Math.PI, 0); c.closePath(); c.fill();
      c.fillStyle = "#C9962A"; c.fillRect(-4.3, -0.4, 8.6, 1.2);
      c.beginPath(); c.arc(0, -4.3, 0.9, 0, 7); c.fill();
      c.restore();
    }
    c.fillStyle = "#4993A2"; c.beginPath(); c.arc(0, 0, 9, 0, 7); c.fill();                                  // boîtier bleu-vert
    c.fillStyle = "#FDFDFA"; c.beginPath(); c.arc(0, 0, 6.6, 0, 7); c.fill();                                // cadran
    c.fillStyle = "#A39C94"; for(let i = 0; i < 4; i++){ const a = i * Math.PI / 2; c.fillRect(Math.cos(a) * 5.4 - 0.5, Math.sin(a) * 5.4 - 0.5, 1, 1); }
    c.strokeStyle = "#2A2725"; c.lineWidth = 1; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -4.4); c.moveTo(0, 0); c.lineTo(3.2, 1.4); c.stroke();
    c.fillStyle = "#C24F6E"; c.beginPath(); c.arc(0, 0, 0.9, 0, 7); c.fill();
  }
  c.restore();
}
// objets d'une seule couleur (le bleu de l'appli, quel que soit le joueur) : le dessin est fait une fois
// dans un canevas 4× plus fin, ramené à deux tons de ce bleu + blanc pour les détails, puis réduit avec
// lissage (pas d'effet pixel)
const spriteCache = new Map();
function hexRgb(h){ h = h.replace("#", ""); if(h.length === 3) h = [...h].map(c => c + c).join(""); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); }
function sprite(type, color){
  const key = type + color; if(spriteCache.has(key)) return spriteCache.get(key);
  const N = 160, c = document.createElement("canvas"); c.width = c.height = N;
  const x = c.getContext("2d"); x.scale(4, 4); drawObjet(x, type, 20, 20, 0, OBJ_SIZE[type]);
  const img = x.getImageData(0, 0, N, N), d = img.data, [r, g, b] = hexRgb(color), mid = [r, g, b].map(v => Math.round(v + (255 - v) * 0.5));
  for(let i = 0; i < d.length; i += 4){
    if(d[i + 3] === 0) continue;
    const L = (0.3 * d[i] + 0.59 * d[i + 1] + 0.11 * d[i + 2]) / 255;
    const t = L < 0.5 ? [r, g, b] : L < 0.8 ? mid : [253, 253, 250];
    d[i] = t[0]; d[i + 1] = t[1]; d[i + 2] = t[2];   // on garde la transparence des bords (lisses)
  }
  x.putImageData(img, 0, 0); spriteCache.set(key, c); return c;
}
function drawObjetMono(c, type, color, x, y, rot = 0, sc = 1){
  const sp = sprite(type, color);
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(sc / 4, sc / 4); c.imageSmoothingEnabled = true; c.imageSmoothingQuality = "high";
  c.drawImage(sp, -sp.width / 2, -sp.height / 2); c.restore();
}
// couronne du vainqueur
function drawCrown(c, x, y, s = 1){
  c.save(); c.translate(x, y); c.scale(s, s);
  const g = c.createLinearGradient(0, -9, 0, 0); g.addColorStop(0, "#F3D46A"); g.addColorStop(1, "#C99A2E");
  c.fillStyle = g;
  c.beginPath(); c.moveTo(-7, 0); c.lineTo(-7.5, -7); c.lineTo(-3.8, -3.6); c.lineTo(0, -9.5); c.lineTo(3.8, -3.6); c.lineTo(7.5, -7); c.lineTo(7, 0); c.closePath(); c.fill();
  c.fillStyle = "#9558D0"; c.beginPath(); c.arc(0, -2.2, 1.4, 0, 7); c.fill();
  c.fillStyle = "#7DB536"; c.beginPath(); c.arc(-4.4, -1.8, 1, 0, 7); c.arc(4.4, -1.8, 1, 0, 7); c.fill();
  c.fillStyle = "#FFF6D0"; for(const [a, b] of [[-7.5,-7],[0,-9.5],[7.5,-7]]){ c.beginPath(); c.arc(a, b, 1, 0, 7); c.fill(); }
  c.restore();
}

// =====================================================================
//  Animation : nuages, coup en vol, éclats, plumes
// =====================================================================
let world = null;
let anim = null, particles = [], flashes = [], tumble = null, banner = null, busy = false, wingT = [0, 0], shake = 0, dance = null, finale = 0, bandMode = null, hideLast = false;
const clouds = Array.from({ length: 5 }, (_, i) => ({ x: i * 220 + Math.random() * 100, y: 40 + Math.random() * 110, s: 0.7 + Math.random() * 0.6 }));

function burst(type, x, y, big, color){
  // éclats propres à l'objet : verre et mousse, bisous, écriture
  const n = big ? 34 : 22, LETTRES = "aébdçfgèhlmnpqrstuvz&?!~";
  const kinds = { roue:["spoke","spoke","rubber"], coeur:["lips","lips","miniheart"], stylo:["letter","letter","letter","ink"], reveil:["gear","gear","spring","digit"] }[type];
  const colors = { gear:["#E3B53C","#4993A2"], spring:["#4A5E6E"], digit:["#2A2725","#2F6F7C"], spoke:["#A39C94","#C9C2B8"], rubber:["#4A5E6E"], lips:["#C24F6E","#D98DA1"], miniheart:["#D98DA1","#C24F6E"],
                   letter:["#562F96","#4A5E6E","#9558D0"], ink:["#562F96","#9558D0"] };
  for(let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * (big ? 260 : 170), k = kinds[i % kinds.length];
    const col = color ? [color, "rgb(" + hexRgb(color).map(v => Math.round(v + (255 - v) * 0.5)).join(",") + ")"] : colors[k];
    const soft = k === "lips" || k === "miniheart" || k === "letter" || k === "digit";   // bisous et lettres flottent plus longtemps
    particles.push({ x, y, vx: Math.cos(a) * sp * (soft ? 0.7 : 1), vy: Math.sin(a) * sp - 80, life: soft ? 1.3 : 1, decay: 0.5 + Math.random() * 0.5,
      rot: soft ? (Math.random() - 0.5) * 0.8 : Math.random() * 6, vr: (Math.random() - 0.5) * (soft ? 2 : 12), kind: k,
      color: col[i % col.length], s: (soft ? 0.9 : 0.6) + Math.random() * 0.8, ch: k === "digit" ? ["12","3","6","9","1","7"][Math.floor(Math.random() * 6)] : LETTRES[Math.floor(Math.random() * LETTRES.length)], float: soft });
  }
  // morceaux de façade (couleur de la maison touchée) et fenêtres
  const b = world.city.bs.find(b => x >= b.x && x <= b.x + b.w);
  if(b && y > b.top - 50){
    const fac = facade(b.c), lit = "#E6D63C";
    for(let i = 0; i < (big ? 26 : 18); i++){
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.6, sp = 110 + Math.random() * 230;
      particles.push({ x: x + (Math.random() - 0.5) * 10, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1.4, decay: 0.55 + Math.random() * 0.4,
        rot: Math.random() * 6, vr: (Math.random() - 0.5) * 14, kind: "chunk", color: i % 6 ? fac : lit, s: 0.7 + Math.random() * 1.3 });
    }
  }
  // fumée qui monte doucement
  for(let i = 0; i < (big ? 10 : 7); i++) particles.push({ x: x + (Math.random() - 0.5) * 18, y: y + (Math.random() - 0.5) * 10,
    vx: (Math.random() - 0.5) * 30 + world.wind * 3, vy: -20 - Math.random() * 30, life: 1, decay: 0.5 + Math.random() * 0.3,
    kind: "smoke", s: 5 + Math.random() * 5, rot: 0, vr: 0 });
  const r = big ? R().trou * 1.6 : R().trou;
  flashes.push({ x, y, t: 0, r });
  shake = Math.max(shake, big ? 12 : 7);
}
function feathers(x, y, kind){
  const P = PLUMES[kind || 0];
  for(let i = 0; i < 22; i++){ const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 150;
    particles.push({ x, y: y - 18, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, life: 1, decay: 0.35 + Math.random() * 0.3,
      kind: "feather", color: [P.body, P.tail, P.neck, P.wing][i % 4], rot: Math.random() * 6, vr: (Math.random() - 0.5) * 5, s: 1, sway: Math.random() * 6 }); }
}
function puffFeathers(x, y, kind, n){
  const P = PLUMES[kind || 0];
  for(let i = 0; i < n; i++){ const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4, sp = 50 + Math.random() * 70;
    particles.push({ x: x + (Math.random() - 0.5) * 14, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, decay: 0.45 + Math.random() * 0.3,
      kind: "feather", color: [P.body, P.tail, P.neck, P.wing][Math.floor(Math.random() * 4)], rot: Math.random() * 6, vr: (Math.random() - 0.5) * 5, s: 0.8, sway: Math.random() * 6 }); }
}
function drawParticle(p){
  ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, p.life)); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(p.s, p.s);
  ctx.fillStyle = p.color;
  switch(p.kind){
    case "smoke": ctx.globalAlpha *= 0.11; ctx.fillStyle = css("--ink-faint"); ctx.beginPath(); ctx.arc(0, 0, 1, 0, 7); ctx.fill(); break;
    case "chunk": ctx.fillRect(-2.2, -1.6, 4.4, 3.2); break;
    case "spoke": ctx.strokeStyle = p.color; ctx.lineWidth = 0.7; ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(5, 0); ctx.stroke(); break;
    case "rubber": ctx.beginPath(); ctx.ellipse(0, 0, 2.6, 1.1, 0, 0, 7); ctx.fill(); break;
    case "lips":   // petite bouche en bisou
      ctx.beginPath(); ctx.moveTo(-4, 0); ctx.quadraticCurveTo(-2, -2.6, 0, -1.1); ctx.quadraticCurveTo(2, -2.6, 4, 0);
      ctx.quadraticCurveTo(0, 3.4, -4, 0); ctx.fill();
      ctx.strokeStyle = "rgba(120,20,50,0.5)"; ctx.lineWidth = 0.5; ctx.beginPath(); ctx.moveTo(-3.4, 0); ctx.quadraticCurveTo(0, 0.8, 3.4, 0); ctx.stroke(); break;
    case "miniheart": ctx.beginPath(); ctx.moveTo(0, 2.4); ctx.bezierCurveTo(-4, -0.4, -2.6, -4, 0, -1.8); ctx.bezierCurveTo(2.6, -4, 4, -0.4, 0, 2.4); ctx.fill(); break;
    case "letter": ctx.font = "italic 700 11px Georgia, 'Times New Roman', serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(p.ch, 0, 0); break;
    case "gear": ctx.beginPath(); for(let i = 0; i < 16; i++){ const r = i % 2 ? 2.2 : 3.2, a = i / 16 * Math.PI * 2; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
                 ctx.closePath(); ctx.fill(); ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.beginPath(); ctx.arc(0, 0, 0.8, 0, 7); ctx.fill(); break;
    case "spring": ctx.strokeStyle = p.color; ctx.lineWidth = 0.7; ctx.beginPath(); ctx.moveTo(-4, 0);
                   for(let i = 0; i < 8; i++) ctx.lineTo(-3 + i, i % 2 ? -1.6 : 1.6); ctx.lineTo(5, 0); ctx.stroke(); break;
    case "digit": ctx.font = "700 8px 'Courier Prime', monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(p.ch, 0, 0); break;
    case "ink": ctx.beginPath(); ctx.arc(0, 0, 1.6, 0, 7); ctx.arc(1.8, 1, 0.8, 0, 7); ctx.fill(); break;
    case "confetti": ctx.fillRect(-2.4, -1.2, 4.8, 2.4); break;
    case "feather": ctx.beginPath(); ctx.ellipse(0, 0, 5, 1.6, 0, 0, 7); ctx.fill(); break;
    default: ctx.fillRect(-1.3, -1.3, 2.6, 2.6);
  }
  ctx.restore();
}

let cvW = W;   // largeur affichée du canevas, lue une fois par image
// temps réel : l'animation avance selon l'horloge, pas d'un pas fixe par image —
// si le navigateur ne tient que 30 images/s (économie d'énergie…), rien ne passe au ralenti
let lastNow = 0, pathAcc = 0, dt = 1 / 60;
function frame(now){
  if(!ROOT || !ROOT.isConnected || !world || !cv){ lastNow = 0; requestAnimationFrame(frame); return; }
  dt = lastNow ? Math.min(0.05, (now - lastNow) / 1000) : 1 / 60; lastNow = now;
  const k60 = dt * 60;   // nombre d'« images à 60/s » écoulées
  const live = busy || !!dance || bandMode === "decouverte";   // comme un message non lu au chat : l'écran sort de sa discrétion
  if(live !== ROOT._live){ ROOT._live = live; ROOT.classList.toggle("duel-live", live); }
  cssCache.clear(); cvW = cv.clientWidth || W;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if(shake > 0.3){ ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake); shake *= 0.86 ** k60; } else shake = 0;
  // ciel
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  // fin de partie : le ciel vire au mauve et au citron, les fenêtres s'allument, confettis
  if(world.over){
    const before = Math.floor(finale * 10); finale = Math.min(1, finale + dt / 2.2);
    if(Math.floor(finale * 10) !== before) renderCity(world, finale);
    if(dance && dance.t > 0 && dance.t < 3.5 && Math.random() < 0.55 * k60) particles.push({ x: Math.random() * W, y: -6, vx: (Math.random() - 0.5) * 30 + world.wind * 2,
      vy: 20 + Math.random() * 40, life: 3, decay: 0.45, kind: "confetti", color: ["#9558D0","#E6D63C","#7DB536","#D98DA1"][Math.floor(Math.random() * 4)],
      rot: Math.random() * 6, vr: (Math.random() - 0.5) * 8, s: 0.8 + Math.random() * 0.6, sway: Math.random() * 6 });
  }else finale = 0;
  sky.addColorStop(0, lerpHex(css("--sky-top"), css("--sky-end-top"), finale));
  sky.addColorStop(1, lerpHex(css("--sky-bottom"), css("--sky-end-bottom"), finale));
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  // nuages poussés par le vent
  ctx.fillStyle = css("--cloud");
  for(const cl of clouds){
    cl.x += (world.wind * 0.09 + 0.05) * cl.s * k60; if(cl.x > W + 80) cl.x = -80; if(cl.x < -80) cl.x = W + 80;
    ctx.beginPath();
    for(const [dx, dy, r] of [[0,0,16],[18,-6,20],[38,0,15],[20,5,15]]) { ctx.moveTo(cl.x + dx * cl.s + r * cl.s, cl.y + dy * cl.s); ctx.arc(cl.x + dx * cl.s, cl.y + dy * cl.s, r * cl.s, 0, 7); }
    ctx.fill();
  }
  ctx.drawImage(city, 0, 0, W, H);
  // trace du coup précédent du joueur dont c'est le tour
  // coups précédents des deux joueurs (manche en cours) : le sien plus marqué
  if(S.trace && !world.over) for(let k = 0; k < 2; k++){
    const pth = world.lastPath[k];
    if(!pth || (anim && anim.shot.p === k)) continue;
    ctx.fillStyle = css(PLAYERS[k].color); ctx.globalAlpha = turn() === k ? 0.42 : 0.2;
    for(let i = 0; i < pth.length; i += 6){ ctx.beginPath(); ctx.arc(pth[i], pth[i + 1], turn() === k ? 1.6 : 1.2, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  // faisans
  for(let k = 0; k < 2; k++){
    if(tumble && tumble.k === k) continue;
    if(world.over && world.fallen === k && !tumble) continue;
    wingT[k] = Math.max(0, wingT[k] - dt * 2.5);
    let hop = 0;
    if(world.over && world.winner === k){
      // le vainqueur se met de face et danse : une aile en haut, l'autre en bas,
      // inversées à chaque temps, petits bonds, plumes qui volent
      const f = { kind: persoOf(k), wingL: -1, wingR: -1, crown: true };
      if(dance){
        dance.t += dt;
        const beat = Math.floor(dance.t / DANCE_BEAT), ph = dance.t / DANCE_BEAT - beat;
        if(dance.t >= 0 && beat < DANCE_BEATS){
          const up = beat % 2 === 0; f.wingL = up ? 1 : -0.7; f.wingR = up ? -0.7 : 1;
          hop = Math.sin(ph * Math.PI) * 8;
          if(beat !== dance.beat){ dance.beat = beat; puffFeathers(world.ph[k].x, world.ph[k].y - 26, persoOf(k), 3); if(beat % 2 === 0) haptic("tic"); }
        }
      }
      drawPheasantFront(ctx, world.ph[k].x, world.ph[k].y - hop, f);
    }else drawPheasant(ctx, world.ph[k].x, world.ph[k].y, k === 0 ? 1 : -1, { kind: persoOf(k), wing: Math.sin(Math.min(1, wingT[k]) * Math.PI) });
    // initiales au-dessus, couleurs de l'écran de chat
    ctx.font = `700 ${F(13)}px 'Courier Prime', monospace`; ctx.textAlign = "center";
    ctx.fillStyle = css(PLAYERS[k].color); ctx.globalAlpha = turn() === k && !world.over ? 1 : 0.55;
    const champion = world.over && world.winner === k;
    ctx.fillText(champion ? PLAYERS[k].nom : PLAYERS[k].ini, world.ph[k].x, world.ph[k].y - (champion ? 80 : 64) - hop); ctx.globalAlpha = 1;
  }
  if(tumble){
    tumble.t += dt; tumble.vy += 500 * dt; tumble.x += tumble.vx * dt; tumble.y += tumble.vy * dt; tumble.rot += tumble.vr * dt;
    drawPheasant(ctx, tumble.x, tumble.y, tumble.dir, { kind: persoOf(tumble.k), rot: tumble.rot, alpha: Math.max(0, 1 - tumble.t / 1.3) });
  }
  // objet en vol
  if(anim){
    pathAcc += k60; const steps = Math.floor(pathAcc); pathAcc -= steps;   // un point de trajectoire = 1/60 s
    for(let s = 0; s < steps && anim; s++){
      anim.i += 2;
      if(anim.i >= anim.res.path.length - 2){ endShot(); break; }
    }
    if(anim){
      const p = anim.res.path;
      ctx.fillStyle = css(PLAYERS[anim.shot.p].color); ctx.globalAlpha = 0.35;
      for(let i = Math.max(0, anim.i - 40); i < anim.i; i += 6){ ctx.beginPath(); ctx.arc(p[i], p[i + 1], 1.2, 0, 7); ctx.fill(); }
      ctx.globalAlpha = 1;
      const x = p[anim.i], y = p[anim.i + 1];
      if(y < -8){   // au-dessus de l'écran : petit repère
        ctx.fillStyle = css(PLAYERS[anim.shot.p].color);
        ctx.beginPath(); ctx.moveTo(x, 4); ctx.lineTo(x - 5, 12); ctx.lineTo(x + 5, 12); ctx.fill();
      }else{
        drawObjetMono(ctx, anim.shot.o, css("--objet"), x, y, anim.i * 0.09 * (anim.shot.p ? -1 : 1));
        if(anim.shot.o === "stylo" && anim.i % 8 === 0) particles.push({ x, y, vx: 0, vy: 10, life: 0.8, decay: 0.9, kind: "ink", color: "#562F96", rot: 0, vr: 0, s: 0.6 });   // gouttes d'encre
      }
    }
  }
  // éclats
  for(const f of flashes){ f.t += dt * 2.2;
    const k = Math.min(1, f.t * 4), fade = Math.max(0, 1 - f.t);
    // boule de feu : blanc au cœur, citron, orangé, puis rien
    const R0 = f.r * (0.5 + 0.9 * k);
    const gr = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, R0);
    gr.addColorStop(0, `rgba(255,255,245,${0.95 * fade})`);
    gr.addColorStop(0.35, `rgba(246,226,90,${0.85 * fade})`);
    gr.addColorStop(0.7, `rgba(233,137,60,${0.55 * fade})`);
    gr.addColorStop(1, "rgba(233,137,60,0)");
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(f.x, f.y, R0, 0, 7); ctx.fill();
    // onde de choc
    ctx.strokeStyle = css("--lucky-lemon"); ctx.globalAlpha = fade * 0.9; ctx.lineWidth = 4 * fade + 1;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.8 + f.t * 2.2), 0, 7); ctx.stroke(); ctx.globalAlpha = 1; }
  flashes = flashes.filter(f => f.t < 1);
  for(const p of particles){
    if(p.kind === "feather"){ p.vy = Math.min(p.vy + 120 * dt, 45); p.vx *= 0.97 ** k60; p.x += Math.sin(p.life * 8 + p.sway) * 0.6 * k60; }
    else if(p.float){ p.vy += 90 * dt; p.vx *= 0.985 ** k60; p.vy *= 0.985 ** k60; }
    else if(p.kind === "confetti"){ p.vy = Math.min(p.vy + 60 * dt, 70); p.x += Math.sin(p.life * 9 + p.sway) * 0.7 * k60; }
    else if(p.kind === "smoke"){ p.s += 0.35 * k60; p.vx *= 0.97 ** k60; p.vy *= 0.98 ** k60; }
    else p.vy += 420 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= p.decay * dt;
    drawParticle(p);
  }
  particles = particles.filter(p => p.life > 0 && p.y < H + 30);
  hud();
  requestAnimationFrame(frame);
}

const F = px => Math.round(px * Math.max(1, 700 / cvW));   // texte du canevas lisible sur téléphone
function hud(){
  ctx.textBaseline = "alphabetic";
  // dernier coup de chacun (pas de score : une partie = une touche)
  for(let k = 0; k < 2; k++){
    const x = k ? W - 22 : 22, ls = lastShotOf(k); ctx.textAlign = k ? "right" : "left";
    ctx.font = `700 ${F(15)}px 'Courier Prime', monospace`; ctx.fillStyle = css(PLAYERS[k].color);
    if(PLAYERS[k].ini) ctx.fillText(ls ? `${PLAYERS[k].ini}> ${ls.a}° · ${ls.v}` : `${PLAYERS[k].ini}>`, x, 14 + F(18));
  }
  // vent
  ctx.textAlign = "center"; ctx.font = `700 ${F(12)}px 'Courier Prime', monospace`; ctx.fillStyle = css("--ink-soft");
  ctx.fillText(world.wind ? `vent ${Math.abs(world.wind)}` : "pas de vent", W / 2, 12 + F(14));
  if(world.wind){
    const len = (10 + Math.abs(world.wind) * 6) * F(10) / 10, d = Math.sign(world.wind), ay = 24 + F(14);
    ctx.strokeStyle = css("--accent"); ctx.fillStyle = css("--accent"); ctx.lineWidth = 2.5; ctx.lineCap = "round";
    ctx.lineWidth = 2.5 * F(10) / 10;
    ctx.beginPath(); ctx.moveTo(W / 2 - d * len / 2, ay); ctx.lineTo(W / 2 + d * len / 2, ay); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W / 2 + d * (len / 2 + 6), ay); ctx.lineTo(W / 2 + d * len / 2 - d, ay - 5); ctx.lineTo(W / 2 + d * len / 2 - d, ay + 5); ctx.fill();
  }
  // bandeau de fin
  if(banner){
    banner.t += dt; const a = Math.min(1, banner.t * 3, (banner.d - banner.t) * 2);
    if(a <= 0 && banner.t > banner.d) banner = null;
    else{ ctx.globalAlpha = Math.max(0, a); ctx.font = `700 ${F(30)}px 'Courier Prime', monospace`;
      const by = H * 0.38;
      ctx.lineJoin = "round"; ctx.strokeStyle = css("--surface"); ctx.lineWidth = 6;
      ctx.strokeText(banner.text, W / 2, by);
      ctx.fillStyle = banner.color || css("--ink"); ctx.fillText(banner.text, W / 2, by);
      if(banner.sub){ ctx.font = `${F(15)}px 'Courier Prime', monospace`; ctx.lineWidth = 4;
        ctx.strokeText(banner.sub, W / 2, H * 0.38 + F(26));
        ctx.fillStyle = css("--ink-soft"); ctx.fillText(banner.sub, W / 2, H * 0.38 + F(26)); }
      ctx.globalAlpha = 1; }
  }
}

// =====================================================================
//  Jouer un coup
// =====================================================================
function play(shot, res, done){
  haptic("lance");
  busy = true; refreshUI();
  wingT[shot.p] = 1;
  anim = { shot, res, i: 0, done };
  sound("lancer");
}
function endShot(){
  const { shot, res, done } = anim; anim = null;
  const e = res.end;
  if(e.kind === "miss"){
    sound("rate");
    setTimeout(()=>{ world = applyResult(world, shot, res); finish(done); }, 350);
    return;
  }
  burst(shot.o, e.x, e.y, e.kind === "hit", css("--objet"));
  haptic(e.kind === "hit" ? "touche" : "impact");
  sound("boum"); sound({ roue:"roulibre", coeur:"bisous", stylo:"plume", reveil:"reveil" }[shot.o]);
  if(e.kind === "city"){
    world = applyResult(world, shot, res); renderCity(world);
    setTimeout(()=> finish(done), 450);
    return;
  }
  // un faisan touché
  const v = e.victim, q = world.ph[v];
  feathers(q.x, q.y, persoOf(v));
  tumble = { k: v, x: q.x, y: q.y, vx: (v ? 1 : -1) * 90, vy: -220, rot: 0, vr: (v ? 1 : -1) * 7, dir: v ? -1 : 1, t: 0 };
  const winner = v === shot.p ? 1 - shot.p : shot.p;
  const before = world;
  const crater = { x:e.x, y:e.y, r:R().trou * 1.6, shape: shot.o === "coeur" ? "coeur" : undefined };
  before.craters.push(crater); renderCity(before); before.craters.pop();
  setTimeout(()=>{
    tumble = null;
    world = applyResult(before, shot, res);
    renderCity(world);
    if(world.over){
      dance = { k: winner, t: -0.25, beat: -1 }; sound("cri"); setTimeout(()=> sound("musique"), 650);
      banner = { text: `${PLAYERS[winner].nom} gagne !`, sub: v === shot.p ? `${PLAYERS[v].nom} s'est eu tout seul` : "", color: css(PLAYERS[winner].color), t: 0, d: 5 };
    }
    finish(done);
  }, 1500);
}
function finish(done){
  busy = false;
  if(done) done();
  refreshUI();
}


// sons (synthétisés, sans fichier)
let AC = null;
function noise(len){
  const buf = AC.createBuffer(1, Math.max(1, AC.sampleRate * len | 0), AC.sampleRate), d = buf.getChannelData(0);
  for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource(); src.buffer = buf; return src;

function env(t, a, peak, dur){ const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t);

function sound(kind){
  if(!S.son) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === "suspended") AC.resume();
    const t = AC.currentTime, out = AC.createGain(); out.gain.value = 0.22; out.connect(AC.destination);
    if(kind === "lancer" || kind === "rate"){

      const f = AC.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 1.2;
      f.frequency.setValueAtTime(kind === "lancer" ? 500 : 900, t); f.frequency.exponentialRampToValueAtTime(kind === "lancer" ? 1800 : 300, t + len);
      const g = env(t, 0.05, 0.8, len); src.connect(f); f.connect(g); g.connect(out); src.start(t);
    }else if(kind === "boum"){
      // grondement (bruit qui s'assourdit) + coup sourd
      const n = noise(0.7), lp = AC.createBiquadFilter(); lp.type = "lowpass";
      lp.frequency.setValueAtTime(1600, t); lp.frequency.exponentialRampToValueAtTime(120, t + 0.6);
      const gn = env(t, 0.005, 1.4, 0.7); n.connect(lp); lp.connect(gn); gn.connect(out); n.start(t);

    }else if(kind === "reveil"){
      // réveil qui sonne par paquets « drrrin… drrrin… drrrrrin ! » (le marteau entre deux cloches),
      // chaque paquet un peu plus aigu et plus long, puis le ressort qui lâche : « boïng »
      let d = 0.03;
      [[0.22, 1], [0.22, 1.06], [0.36, 1.12]].forEach(([len, up]) => {
        for(let x = 0; x < len; x += 0.024){
          const o = AC.createOscillator(); o.type = "triangle"; o.frequency.value = (Math.round(x / 0.024) % 2 ? 1650 : 1980) * up;
          const g = env(t + d + x, 0.002, 0.26, 0.04); o.connect(g); g.connect(out); o.start(t + d + x); o.stop(t + d + x + 0.05);
        }

      });
      const o = AC.createOscillator(); o.type = "sine"; const lfo = AC.createOscillator(), lg = AC.createGain();
      lfo.frequency.value = 18; lg.gain.value = 70; lfo.connect(lg); lg.connect(o.frequency);
      o.frequency.setValueAtTime(420, t + d); o.frequency.exponentialRampToValueAtTime(160, t + d + 0.5);
      const gb = env(t + d, 0.005, 0.45, 0.55); o.connect(gb); gb.connect(out); o.start(t + d); o.stop(t + d + 0.6); lfo.start(t + d); lfo.stop(t + d + 0.6);
    }else if(kind === "attente"){
      // le bandeau arrive : deux notes douces
      for(const [d, f] of [[0, 660], [0.11, 990]]){
        const o = AC.createOscillator(); o.type = "sine"; o.frequency.value = f;
        const g = env(t + d, 0.01, 0.35, 0.5); o.connect(g); g.connect(out); o.start(t + d); o.stop(t + d + 0.55);
      }
    }else if(kind === "bisous"){
      // « smack » : petit claquement puis glissé qui monte, trois fois
      for(const d of [0.04, 0.2, 0.33]){
        const n = noise(0.03), bp = AC.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 2400; bp.Q.value = 1.5;
        const gn = env(t + d, 0.002, 0.9, 0.035); n.connect(bp); bp.connect(gn); gn.connect(out); n.start(t + d);
        const o = AC.createOscillator(); o.type = "sine";
        o.frequency.setValueAtTime(520, t + d); o.frequency.exponentialRampToValueAtTime(1500, t + d + 0.09);
        const g = env(t + d, 0.004, 0.45, 0.11); o.connect(g); g.connect(out); o.start(t + d); o.stop(t + d + 0.13);
      }
    }else if(kind === "plume"){
      // stylo qui griffonne : « scratch-scratch, scratch-scratch, scratch-scratch-scratch »
      // chaque trait = un frottement court au grain irrégulier ; l'aller un peu plus aigu que le retour
      const sr = AC.sampleRate;
      const trait = (d, len, f, amp) => {
        const buf = AC.createBuffer(1, sr * len | 0, sr), dd = buf.getChannelData(0); let gr = 0;
        for(let i = 0; i < dd.length; i++){ gr += (Math.random() - 0.5) * 0.7; gr *= 0.9;
          dd[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / dd.length) ** 0.5 * (0.6 + gr); }
        const src = AC.createBufferSource(); src.buffer = buf;
        const bp = AC.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = f; bp.Q.value = 2.5;
        const g = AC.createGain(); g.gain.value = amp; src.connect(bp); bp.connect(g); g.connect(out); src.start(t + d);
      };

        .forEach(([d, f], i) => trait(d, i === 6 ? 0.075 : 0.055, f + Math.random() * 300, 1.1));
    }else if(kind === "roulibre"){
      // roue de vélo : la roue libre cliquette en ralentissant… puis « dring dring ! » qui tombe en rythme
      let d = 0.03, gap = 0.034;
      for(let i = 0; i < 12; i++){
        const n = noise(0.012), bp = AC.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 3400 + (i % 2) * 700; bp.Q.value = 5;
        const g = env(t + d, 0.001, 0.8 - i * 0.03, 0.02); n.connect(bp); bp.connect(g); g.connect(out); n.start(t + d);
        d += gap; gap *= 1.12;
      }
      const timbre = (dd, amp, len) => {
        for(const [ratio, a] of [[1, 1], [2.76, 0.55], [5.4, 0.28], [8.9, 0.12]]){
          const o = AC.createOscillator(); o.type = "sine"; o.frequency.value = 2150 * ratio;
          const g = env(t + dd, 0.002, amp * a, len / ratio ** 0.4); o.connect(g); g.connect(out); o.start(t + dd); o.stop(t + dd + len + 0.05);
        }

      const d1 = d + 0.32, d2 = d1 + 0.2;   // un vrai temps de silence, puis « dring-dring ! » bien vif
      for(const st of [d1, d2]) for(let i = 0; i < 6; i++) timbre(st + i * 0.022, i === 5 ? 0.32 : 0.2, i === 5 ? 0.45 : 0.06);
    }else if(kind === "cri"){
      // « kôk-kôk » du faisan : deux appels rauques, puis un battement d'ailes
      for(const [d, f0] of [[0, 1050], [0.2, 980]]){
        const o = AC.createOscillator(); o.type = "sawtooth";
        o.frequency.setValueAtTime(f0, t + d); o.frequency.exponentialRampToValueAtTime(f0 * 0.62, t + d + 0.14);

        const g = env(t + d, 0.01, 1.1, 0.16); o.connect(bp); bp.connect(g); g.connect(out); o.start(t + d); o.stop(t + d + 0.2);

      const st = DANCE_BEAT / 2, M = [0,4,7,12, 7,4,7,12, 9,5,9,14, 12,null,7,null, 5,9,12,9, 4,7,12,7, 2,7,11,14, 12,null,null,null];

      });
    }
  }catch(e){}
}

const SEEN_KEY = "sous-le-tapis-duel-vu";   // { idListe: nombre de lignes déjà vues } — propre à l'appareil
let seen = (()=>{ try{ const o = JSON.parse(localStorage.getItem(SEEN_KEY) || "{}"); return o && typeof o === "object" ? o : {}; }catch(e){ return {}; } })();
function saveSeen(){ try{ localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); }catch(e){} }
let monObjet = (()=>{ try{ const o = localStorage.getItem("sous-le-tapis-duel-objet"); return o in OBJETS ? o : "roue"; }catch(e){ return "roue"; } })();
let persoChoix = 0;      // faisan choisi par celui qui lance la partie, avant son premier coup
// entraînement : rien n'est écrit dans la liste (ni synchro ni place prise) — les coups vivent ici, le temps de la page
let soloShots = [], soloSeed = null, soloPerso = 0;
let lastSig = null, ownShot = false;
const hashStr = s => { let h = 2166136261; for(const ch of String(s)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; };
function readGame(cat){
  const items = getEffectiveItems(cat), live = [];
  items.forEach((b, i)=>{ if(b && !isDeleted(itemKey(cat.id, i))) live.push({ b, i }); });
  let start = -1;
  live.forEach((x, j)=>{ if(x.b.duel === "partie") start = j; });
  const head = start > -1 ? live[start].b : null;
  // entraînement = personne d'autre dans le duel en ce moment : tous les coups partent du faisan de gauche,
  // l'autre ne renvoie rien, et rien n'est enregistré (soloShots, en mémoire). Dès qu'on partage, la partie à
  // deux part de ce qui est dans la liste, sans devoir finir l'entraînement
  const solo = !listPeople(cat.id).some(u => u !== myUid());
  const rows = solo ? [] : live.slice(start + 1).filter(x => typeof x.b.a === "number" && typeof x.b.v === "number" && !x.b.solo);
  const shots = solo ? soloShots.slice() : rows.map((x, k)=>({ p: k % 2, a: x.b.a, v: x.b.v, o: x.b.o in OBJETS ? x.b.o : "roue", at: x.b.at, by: taskCreator(cat, x.b) }));
  const p0 = solo ? (soloShots.length ? soloPerso : persoChoix) : rows.length ? (rows[0].b.perso === 1 ? 1 : 0) : persoChoix;
  const g = {
    seed: solo && soloSeed != null ? soloSeed : head && typeof head.seed === "number" ? head.seed : hashStr(cat.id),
    regles: { g: head && head.g || REGLES.g, vent: head && head.vent != null ? head.vent : REGLES.vent, trou: head && head.trou || REGLES.trou, decor: head && head.decor || REGLES.decor },
    shots, solo, perso: p0 === 1 ? [1, 0] : [0, 1], total: items.length, start: start > -1 ? live[start].i : -1
  };
  // les deux joueurs : celui du 1er coup, puis l'autre personne de la liste
  const me = myUid();
  const people = [listOwnerUid(cat.id)].concat(listPeople(cat.id), [me]).filter((u, j, a) => u && a.indexOf(u) === j);   // moi compris
  const u0 = shots.length ? shots[0].by : (me || people[0] || null);
  const u1 = people.find(u => u !== u0) || null;
  const who = (u, p) => u ? { uid:u, ini: personInitials(u, cat.id), nom: personName(u, cat.id) }
                         : p === 0 ? { uid:null, ini: initialOf(myName()), nom: myName() } : { uid:null, ini:"?", nom:"l'autre" };
  PLAYERS = [u0, u1].map((u, p)=> Object.assign(who(u, p), { color: "--objet" }));   // un seul bleu : on se reconnaît à sa place et à ses initiales
  if(solo) PLAYERS[1] = { uid:null, ini:"", nom:"le faisan d'entraînement", color:"--objet" };
  const lastOf = p => { for(let k = shots.length - 1; k >= 0; k--) if(shots[k].p === p) return shots[k].o; return null; };
  g.objets = [0, 1].map(p => PLAYERS[p].uid === me && me || (!me && p === turnOf(g)) ? monObjet : (lastOf(p) || "roue"));
  return g;
}
const turnOf = g => g.shots.length % 2;
const myTurn = ()=>{ const me = myUid(); if(!me || game.solo) return true; if(!game.shots.length) return true; return PLAYERS[turn()].uid === me; };

// à chaque rendu de l'appli : la carte (construite une fois, gardée telle quelle
// pour ne pas couper une animation) et la partie relue dans la liste
function sync(cat, force){
  CAT = cat;
  const g = readGame(cat), sig = (g.solo ? "solo:" : "") + g.start + ":" + g.seed + ":" + g.shots.length;
  if(sig === lastSig && !force){ game.objets = g.objets; game.total = g.total; refreshUI(); return; }
  lastSig = sig;
  if(ownShot){ game = g; return; }   // mon coup est déjà en train de voler
  game = g;
  anim = null; busy = false; tumble = null; dance = null; banner = null; hideLast = false; particles = []; flashes = [];
  world = worldAfter(game.shots.length);
  finale = world.over ? 1 : 0;
  sizeCanvas(); renderCity(world, finale);
  decideBand();
  refreshUI();
}
// bandeaux : « … a joué ! » si le dernier coup est d'un autre et pas encore vu sur cet appareil ;
// « En attente de … » si le dernier coup est le mien et que la partie continue
function decideBand(){
  const me = myUid(), last = game.shots[game.shots.length - 1];
  $(".attente").classList.remove("on");
  bandMode = null;
  if(!last || !me || game.solo) return;   // entraînement : ni attente ni découverte
  if(last.by !== me && (seen[CAT.id] || 0) < game.total) showBand("decouverte");
  else if(last.by === me && !world.over) showBand("attente");

function showBand(mode){

  const last = game.shots[game.shots.length - 1], p = mode === "attente" ? turn() : last.p;
  $(".d-qui").textContent = mode === "attente" ? `En attente ${de(PLAYERS[p].nom)}…` : `${PLAYERS[p].nom} a joué !`;
  $(".attente").style.setProperty("--pc", css(PLAYERS[p].color));
  $(".attente").classList.toggle("decouverte", mode === "decouverte");

function replayLast(decouverte){
  const n = game.shots.length;
  if(!n || busy) return;
  dance = null; banner = null; hideLast = false;
  world = worldAfter(n - 1); finale = 0; renderCity(world);

function lancer(){
  if(busy || world.over || !myTurn()) return;
  const p = turn();
  const a = clamp(Math.round(Number($(".d-angle").value)), 0, 90);
  const v = clamp(Math.round(Number($(".d-vitesse").value)), 1, 200);
  if(!isFinite(a) || !isFinite(v)) return;
  const o = monObjet;
  const shot = { p, a, v, o, at: Date.now(), by: myUid() };
  const res = simulate(world, shot);
  ownShot = true;
  if(game.solo){   // entraînement : en mémoire seulement
    if(!soloShots.length) soloPerso = persoChoix;
    soloShots.push(shot);
  }else{
    const item = { t: `${a} ${v} ${o}`, a, v, o, at: shot.at };
    if(!game.shots.length) item.perso = persoChoix;
    try{ insertItem(CAT, item); }catch(err){ console.error("[duel] coup non enregistré", err); ownShot = false; return; }
    seen[CAT.id] = (game.total || 0) + 1; saveSeen();
  }
  game.shots.push(shot);
  play(shot, res, ()=>{
    ownShot = false;
    // la liste contient maintenant mon coup : même partie que celle qu'on voit, on ne la recharge pas
    // (sinon la danse, la couronne et les confettis seraient effacés)
    const g = readGame(CAT); lastSig = (g.solo ? "solo:" : "") + g.start + ":" + g.seed + ":" + g.shots.length; game.total = g.total;
    decideBand();
    renderAll();
  });

}
function nouvellePartie(){

  insertItem(CAT, { t: "nouvelle partie", duel: "partie", seed: (Math.random() * 2 ** 31) | 0, g: REGLES.g, vent: REGLES.vent, trou: REGLES.trou, decor: REGLES.decor, at: Date.now() });

}

        <span class="invite d-invite"></span>
        <div class="reglage"><span>angle</span><button type="button" class="pas" data-for="d-angle" data-d="-1" aria-label="Moins">−</button><input class="d-angle" type="number" min="0" max="90" step="1" inputmode="numeric" aria-label="Angle"><button type="button" class="pas" data-for="d-angle" data-d="1" aria-label="Plus">+</button><span class="unite">°</span></div>
        <div class="reglage"><span>force</span><button type="button" class="pas" data-for="d-vitesse" data-d="-1" aria-label="Moins">−</button><input class="d-vitesse" type="number" min="1" max="200" step="1" inputmode="numeric" aria-label="Force"><button type="button" class="pas" data-for="d-vitesse" data-d="1" aria-label="Plus">+</button></div>
        <div class="objets"></div>
        <button type="button" class="d-lancer">Lancer</button>
        <div class="d-sous"><div class="persos" title="Votre faisan (l'autre joueur prend l'autre)"></div><button type="button" class="d-revoir">↺ Revoir</button></div>
      </div>
    <div class="chat-foot duel-foot">
      <span class="cat-grip" aria-label="Réorganiser les listes" data-tip="Réorganiser"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></span>
      <button type="button" class="chat-more" aria-label="Options du duel">…</button>
      <span class="chat-who"></span>
      <div class="chat-menu" hidden></div>
    </div>
    </div>`;
  ROOT = card;
  cv = card.querySelector(".duel-cv"); ctx = cv.getContext("2d");
  // objets et faisans à choisir
  const ob = card.querySelector(".objets");
  for(const k in OBJETS){
    const b = document.createElement("button"); b.type = "button"; b.dataset.o = k; b.title = OBJETS[k];
    const c = document.createElement("canvas"); c.width = c.height = 60; b.appendChild(c); ob.appendChild(b);
    b.addEventListener("click", ()=>{ haptic("tic"); monObjet = k; try{ localStorage.setItem("sous-le-tapis-duel-objet", k); }catch(e){} refreshUI(); });
  }
  const pe = card.querySelector(".persos");
  [0, 1].forEach(kind => {
    const b = document.createElement("button"); b.type = "button"; b.dataset.k = kind; b.setAttribute("aria-label", "Choisir ce faisan");
    const c = document.createElement("canvas"); c.width = 80; c.height = 68;
    const x = c.getContext("2d"); x.scale(2, 2); x.translate(26, 31); x.scale(0.45, 0.45); drawPheasant(x, 0, 0, 1, { kind }); b.appendChild(c); pe.appendChild(b);
    b.addEventListener("click", ()=>{ if(game.shots.length) return; haptic("tic"); persoChoix = kind; game.perso = kind === 0 ? [0, 1] : [1, 0]; refreshUI(); });
  });
  card.querySelector(".d-lancer").addEventListener("click", ()=>{ if(world && world.over) nouvellePartie(); else lancer(); });
  card.querySelector(".d-revoir").addEventListener("click", ()=> replayLast(false));
  card.querySelector(".d-go").addEventListener("click", ()=>{ haptic("tic"); $(".attente").classList.remove("on"); bandMode = null; setTimeout(()=> replayLast(true), 300); });
  card.querySelectorAll(".d-angle, .d-vitesse").forEach(i => i.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); lancer(); } }));
  card.querySelectorAll(".pas").forEach(b => {
    let t1 = null, t2 = null;
    const pas = ()=>{ const inp = card.querySelector("." + b.dataset.for); if(inp.disabled) return;
      inp.value = clamp((Number(inp.value) || 0) + Number(b.dataset.d), Number(inp.min), Number(inp.max)); };
    const stop = ()=>{ clearTimeout(t1); clearInterval(t2); t1 = t2 = null; };
    b.addEventListener("pointerdown", e => { e.preventDefault(); haptic("pas"); pas(); t1 = setTimeout(()=>{ t2 = setInterval(pas, 70); }, 380); });
    ["pointerup", "pointerleave", "pointercancel"].forEach(ev => b.addEventListener(ev, stop));
    b.addEventListener("click", e => e.preventDefault());
  });
  card.addEventListener("click", e => e.stopPropagation());   // un clic dans le jeu ne ferme rien d'autre
  // au toucher (pas de survol ni de focus sur les boutons d'iPhone) : net jusqu'à ce qu'on touche ailleurs
  card.addEventListener("pointerdown", ()=> card.classList.add("duel-touch"));
  document.addEventListener("pointerdown", e => { if(!card.contains(e.target)) card.classList.remove("duel-touch"); }, true);
  return card;
}
// le pied de la carte (poignée, « … », initiales, partage) : refait à chaque rendu, comme l'écran de chat
function foot(cat, catIdx){
  const own = iOwnList(cat.id);
  const people = [listOwnerUid(cat.id)].concat(listPeople(cat.id)).filter((u, j, a) => u && a.indexOf(u) === j);
  const ini = u => u ? personInitials(u, cat.id) : initialOf(myName());
  ROOT.querySelector(".chat-who").textContent = (people.length ? people : [null]).map(ini).join(" ");
  const more = ROOT.querySelector(".chat-more"), menu = ROOT.querySelector(".chat-menu");
  const open = chatMenuOpen === cat.id;
  menu.hidden = !open; more.setAttribute("aria-expanded", open);
  ROOT.classList.toggle("chat-open", open || editingCategoryTitle === cat.id);
  menu.innerHTML = (own
    ? `<button type="button" data-a="share"><span class="ic">+</span>Inviter</button><button type="button" data-a="share"><span class="ic">−</span>Retirer</button>`
    : `<div class="chat-menu-note">Duel ${escapeAttr(deName(personName(listOwnerUid(cat.id), cat.id)))}, en partage.</div>`)
    + `<button type="button" data-a="son"><span class="ic">♪</span>Son et vibrations : ${S.son ? "oui" : "non"}</button>`
    + (own ? `<button type="button" class="danger" data-a="del"><span class="ic">×</span>Supprimer ce duel</button>` : "");
  more.onclick = e => { e.stopPropagation(); chatMenuOpen = chatMenuOpen === cat.id ? null : cat.id; renderAll(); };
  menu.onclick = e => e.stopPropagation();
  menu.querySelectorAll("button").forEach(b => b.addEventListener("click", ()=>{
    if(b.dataset.a === "share"){ chatMenuOpen = null; editingCategoryTitle = cat.id; renderAll(); return; }
    if(b.dataset.a === "son"){ try{ localStorage.setItem("sous-le-tapis-duel-son", S.son ? "0" : "1"); }catch(e){} renderAll(); return; }
    if(b.dataset.a === "del"){
      if(!b.classList.contains("sure")){ b.classList.add("sure"); b.lastChild.textContent = "Vraiment ? La partie sera effacée"; return; }
      chatMenuOpen = null; deleteChat(cat); renderAll();
    }
  }));
  // partage : la ligne « Partagée avec » des listes, avec Annuler / Enregistrer
  const old = ROOT.querySelector(".chat-share"); if(old) old.remove();
  if(editingCategoryTitle === cat.id){
    if(!catEditSnap || catEditSnap.id !== cat.id)
      catEditSnap = { id: cat.id, color: cat.color, members: ((listInfo(cat.id) || { members:[] }).members || []).slice() };
    const box = document.createElement("div"); box.className = "chat-share";
    box.addEventListener("click", e => e.stopPropagation());
    const row = buildCatShareRow(cat); if(row) box.appendChild(row);
    const act = document.createElement("div"); act.className = "edit-actions cat-edit-actions";
    act.innerHTML = `<button type="button" class="edit-cancel">Annuler</button><button type="button" class="edit-save">Enregistrer</button>`;
    act.querySelector(".edit-save").addEventListener("click", ()=>{ editingCategoryTitle = null; catEditSnap = null; renderAll(); });
    act.querySelector(".edit-cancel").addEventListener("click", ()=>{ cancelCatEdit(); renderAll(); });
    box.appendChild(act);
    ROOT.querySelector(".duel-stage").appendChild(box);
  }
}
let running = false, cardCat = null;
function card(cat, catIdx){
  if(ROOT && cardCat !== cat.id){ ROOT = null; lastSig = null; }   // un autre duel : nouvelle carte
  if(!ROOT){ build(); cardCat = cat.id; ROOT.id = "cat-" + cat.id; }
  const focusEl = document.activeElement && ROOT.contains(document.activeElement) ? document.activeElement : null;
  foot(cat, catIdx);
  // la poignée : celle des listes (remise à chaque rendu, l'ordre a pu changer)
  const grip = ROOT.querySelector(".cat-grip"), g2 = grip.cloneNode(true); grip.replaceWith(g2);
  wireDragCard(ROOT, g2, catIdx);
  requestAnimationFrame(()=>{
    if(!ROOT || !ROOT.isConnected) return;
    cssCache.clear(); sync(cat);
    if(focusEl && focusEl.isConnected && document.activeElement !== focusEl) focusEl.focus({ preventScroll:true });
  });
  if(!running){ running = true; requestAnimationFrame(frame); }
  return ROOT;
}
function onTheme(){ cssCache.clear(); spriteCache.clear(); iconesCouleur = null; if(world && ROOT && ROOT.isConnected) renderCity(world, finale); }
return { card, onTheme, resync: ()=>{ lastSig = null; }, etat: ()=>({ world, dance, finale, busy, simulate, game }) };   // resync : relire la partie ; etat : pour les tests
};
// plusieurs duels dans la grille : chacun garde sa propre instance (sinon ils se volaient la carte)
const Duel = (()=>{
  const all = new Map();
  const of = id => { let d = all.get(id); if(!d){ d = makeDuel(); all.set(id, d); } return d; };
  return {
    card: (cat, catIdx) => of(cat.id).card(cat, catIdx),
    onTheme: () => all.forEach(d => d.onTheme()),
    resync: () => { all.forEach(d => d.resync()); renderAll(); },
    etat: () => { const d = [...all.values()].pop(); return d && d.etat(); }
  };
})();

// ---- noms, remise à zéro, démarrage ----
const n1 = document.getElementById("n1"), n2 = document.getElementById("n2");
n1.value = NOMS.uA; n2.value = NOMS.uB;
[[n1, "uA"], [n2, "uB"]].forEach(([inp, u]) => inp.addEventListener("input", ()=>{ NOMS[u] = inp.value; try{ localStorage.setItem(LKEY + "-noms", JSON.stringify(NOMS)); }catch(e){} Duel.resync(); }));
document.getElementById("raz").addEventListener("click", ()=>{ ITEMS = [{ t:"nouvelle partie", duel:"partie", seed:(Math.random() * 2 ** 31) | 0, at:Date.now() }]; saveItems(); Duel.resync(); });
if(!ITEMS.length){ ITEMS.push({ t:"nouvelle partie", duel:"partie", seed:(Math.random() * 2 ** 31) | 0, at:Date.now() }); saveItems(); }
renderAll();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ()=> Duel.onTheme());
</script>

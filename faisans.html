<!DOCTYPE html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-faisan-v2-180.png">
<link rel="apple-touch-icon" href="icon-faisan-v2-180.png">
<title>Duel de faisans</title>
<!-- Duel de faisans, à deux sur le même appareil (hors appli) : le jeu de Sous le tapis (10.64),
     sans compte ni attente — chacun lance à son tour, « Revoir » rejoue le dernier coup.
     Partie gardée dans le navigateur (localStorage « faisans-local »). -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Courier+Prime:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap');

/* ==========================================================================
   Feuille de style rangée en 8.0 : chaque retouche (7.x) est fondue dans sa
   règle d'origine, au lieu d'être empilée en fin de fichier par-dessus.
   Ordre : couleurs → page → compteur → case urgente → trèfle → listes →
   tâches → formulaires → « En cours » → bas de page → corbeille → accueil →
   tapis → glisser-déposer → infobulles → mode sombre → animations.
   ========================================================================== */

/* ---------- couleurs (clair, puis sombre deux fois : réglage du système, ou
   thème forcé par la page hôte via data-theme) ---------- */
:root{
  /* fond uni (8.39), sauge très pâle (8.40, plus claire en 8.41, plus froide en 8.42) */
  --bg:#F7FAF9;
  --bg-top:#F7FAF9;
  --bg-bottom:#ECEFEF;
  --surface:#FFFFFF;
  --surface-2:#FBF9F3;
  --ink:#2A2725;
  --ink-soft:#6B6560;
  --ink-faint:#A39C94;
  --accent:#4993A2;
  --accent-strong:#6B728E;
  --btn-ink:#4A5E6E;  /* boutons du bas : ardoise, famille de l'icône (8.41) */
  --accent-soft:#E4ECF3;
  --plume-off:var(--ink-faint);   /* 10.23 : gris (avant : tomate #E5675A) */
  /* 10.53 : papier des mémos « blanc chaud », uni, sans reflet ni liseré
     (choisi au banc ; avant : nacre #FFFFFF / #F4F7FC / #F9F5FC, reflet
     blanc plein, liseré rgba(150,160,200,.28)) */
  --gloss:rgba(255,255,255,0);
  --memo-a:#FFFFFF; --memo-b:#FFFFFF; --memo-c:#FFFFFF;   /* 10.63 : blanc comme les listes (avant : blanc chaud #FCFBF7), moins de bruit */
  --memo-line:rgba(0,0,0,0);
  --chat-me:#2F6F7C; --chat-them:var(--logo-green-strong); --chat-lip:#FFFFFF;   /* 10.57 : écran de chat */
  /* 10.19 : vert du logo (le faisan) pour le titre et la plume connectée ;
     --logo-green-strong au survol du titre */
  --logo-green:#7DB536;   /* un cran sous le vert du logo #8DC63F, trop pâle pour un petit titre */
  --logo-green-strong:#64992A;
  /* 10.19 : urgences en améthyste, cousine du mauve du logo (avant : tomate
     #DD5236 / #FBE3DA / #93301C) */
  --urgent:#9558D0;
  --urgent-soft:#ECDFF8;
  --urgent-ink:#562F96;   /* 10.25 : un rien moins rouge et plus clair (avant #4A2580) */
  /* 10.40 : fond et titre du bandeau urgent, repris par le cadre de l'accueil
     (calculés sur les couleurs ci-dessus : suivent le mode sombre) */
  --ub-bg:color-mix(in srgb, color-mix(in srgb, var(--urgent-soft) 50%, var(--accent-soft)) 70%, var(--surface));   /* 10.25 : fond pâli, tiré vers le bleu (--accent-soft) pour moins de rouge */
  --ub-title:color-mix(in srgb, var(--urgent-ink) 50%, var(--urgent-soft));   /* 10.25 : titre pâli */
  --late:#A9472A; --late-soft:#FBE7DE;   /* 10.25 : « En retard » en terre cuite */
  --relance:#C24F6E;
  --relance-soft:#F6E3E8;
  --wait:#6A9FB9;
  --wait-soft:#EEFBF4;
  --eggshell:#FAF3E3;
  --lucky-bg:#FCFBE9;   /* 10.18 : « Une petite en passant ? » en citron givré (avant : --eggshell) */
  --lucky-lemon:#E6D63C;  /* 10.18 : accents du bandeau trèfle (surbrillance, liserés, textes) ;
                            --lucky-gold reste au bouton « Nouvelle liste » du premier lancement */
  --lucky-gold:#E3B53C;
  --share-hover:#F2EA8C;
  --line:#EDE7DC;
  /* 10.33 : texte des tâches, réglable ici seulement */
  --font-task:'Work Sans', system-ui, -apple-system, sans-serif;
  --task-size:0.92rem;
  --font-memo:var(--font-task);   /* listes mémo, réglable à part (10.34 : IBM Plex Mono ; 10.38 : retour à la police des tâches) */
  --memo-size:var(--task-size);
  --row-pad:0.42rem;   /* 10.35 : retour à l'espacement d'avant 10.33, calé sur le pas des mémos (10.34 : 0.34rem ; 10.33 : 0.28rem) */
  --shadow: 0 1px 2px rgba(30,40,45,0.04), 0 8px 24px -12px rgba(30,40,45,0.12);
  --rose:#D98DA1; /* couleur fixe : un color-mix s'interpole mal dans l'animation */
  --phrase:#3F6A8C; /* bleu acier : phrase du compteur (8.4) */
  --count-ink:#1E3552; /* « tâches accomplies… » : presque noir, une pointe de bleu (8.7) */
  /* 10.17 : liste de courses en feuille de cahier — papier, lignes, marge, quantités */
  --paper:#FDFDFA;   /* 10.18 : perle très claire, un soupçon de jaune (avant #FFFDF7, crème) */
  --paper-rule:#DCE7F1;
  --paper-shadow: 0 1px 3px rgba(30,40,45,0.07), 0 10px 26px -12px rgba(30,40,45,0.2);
  --qty-ink:#CE4F8A;
}

    --bg:#14181B;
    --bg-top:#1B252B;
    --bg-bottom:#101315;
    --surface:#1C2125;

    --ink-soft:#AEB6BA;

    --plume-off:var(--ink-faint);
    --gloss:rgba(255,255,255,0);   /* 10.55 : plus de reflet (comme en clair) */
    --memo-a:#23231F; --memo-b:#23231F; --memo-c:#23231F;   /* 10.55 : papier uni, un rien chaud (avant : nacre bleutée #1F2328 / #1F2530 / #252231) */
    --chat-me:#7FC0CC; --chat-them:var(--logo-green); --chat-lip:rgba(255,255,255,0.07);   /* 10.57 */
    --memo-line:rgba(0,0,0,0);
    --logo-green:#A9D65A;
    --logo-green-strong:#C7E58A;
    --urgent:#B88AEB;
    --urgent-soft:#261D33;
    --ub-bg:color-mix(in srgb, color-mix(in srgb, var(--urgent-soft) 90%, var(--accent-soft)) 95%, var(--surface));   /* 10.40 : en sombre, fond urgent un rien plus présent */
    --urgent-ink:#DDC6FA;
    --late:#F0A385; --late-soft:#3A2620;
    --relance:#E38DA4;
    --relance-soft:#372229;
    --wait:#94C4DA;
    --wait-soft:#16292B;   /* 10.40 : teinte plus fraîche et plus effacée (avant #142C29) */
    --eggshell:#28292E;
    --lucky-bg:#28292E;
    --lucky-lemon:#DCCB52;
    --lucky-gold:#D8B145;
    --share-hover:#E9E07A;
    --line:#2E363C;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    --phrase:#9CC0DC;

    --paper:#1E2226;
    --paper-rule:#2C3742;
    --paper-shadow: 0 1px 3px rgba(0,0,0,0.35), 0 10px 26px -12px rgba(0,0,0,0.6);
    --qty-ink:#F3A2C6;
  }
}
:root[data-theme="dark"]{
  --bg:#14181B;
  --bg-top:#1B252B;
  --bg-bottom:#101315;
  --surface:#1C2125;
  --surface-2:#232A2F;

  --ink-soft:#AEB6BA;

    --chat-me:#7FC0CC; --chat-them:var(--logo-green); --chat-lip:rgba(255,255,255,0.07);   /* 10.57 */

  --logo-green:#A9D65A;
  --logo-green-strong:#C7E58A;

  --ub-bg:color-mix(in srgb, color-mix(in srgb, var(--urgent-soft) 90%, var(--accent-soft)) 95%, var(--surface));   /* 10.40 : en sombre, fond urgent un rien plus présent */
  --urgent-ink:#DDC6FA;
  --late:#F0A385; --late-soft:#3A2620;
  --relance:#E38DA4;
  --relance-soft:#372229;

  --wait-soft:#16292B;   /* 10.40 : teinte plus fraîche et plus effacée (avant #142C29) */
  --eggshell:#28292E;

/* ---------- page ---------- */
*{box-sizing:border-box;}
html{background:var(--bg);}
body{
  margin:0;
  min-height:100vh;
  /* fond : dégradé frais en haut, crème en bas */
  background:linear-gradient(180deg, var(--bg-top) 0, var(--bg) 900px, var(--bg) 100%);
  color:var(--ink);
  font-family:'Public Sans', system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent-soft); color:var(--ink);}
.wrap{
  max-width:920px;
  margin:0 auto;
  padding:2.75rem 1.5rem 6rem;
  position:relative;
  isolation:isolate;
}
/* le titre et le numéro de version restent au-dessus du tapis déroulé */
header{
  display:flex;
  flex-direction:column;
  gap:1.1rem;
  margin-top:0.35rem;
  margin-bottom:0.7rem;
  position:relative;
  z-index:41;
}
.eyebrow{
  display:block;
  text-align:right;
  /* 10.4 : reculé pour laisser la plume, dont la pointe s'aligne sur le bout
     droit de la barre de comptage ; 10.14 : en marge (et plus en padding) et
     à la largeur du texte : seul le texte déroule le tapis, plus l'espace
     autour de la plume (un doigt qui ratait la plume déroulait le tapis) */
  width:fit-content;
  margin-left:auto;
  margin-right:69px;
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.8rem;
  font-weight:600;
  letter-spacing:0.11em;
  text-transform:uppercase;
  color:var(--logo-green);
  cursor:pointer;
  transition:color .15s ease;
  -webkit-user-select:none;
  user-select:none;
}
.eyebrow:hover{ color:var(--logo-green-strong); }
.eyebrow:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:4px; }
.ap-nod{ position:relative; }
.ap-nod::after{
  content:"";
  position:absolute;
  left:0;
  right:0.11em; /* retranche l'espacement de fin : le trait s'arrête au bord du P */
  bottom:-1px;
  height:1px;
  background:currentColor;
}
/* 10.3-10.4 : plume de connexion, à droite du titre ; pointe calée sur le bout
   droit de la barre de comptage ; tomate claire (--plume-off) = déconnecté, vert du logo = connecté (10.19) */
.plume{
  position:absolute; right:14.8px; top:-6px; width:28px; height:28px;
  appearance:none; border:0; background:none; padding:0; cursor:pointer;
  color:var(--plume-off); transform-origin:50% 50%;
  filter:drop-shadow(0 0 1px color-mix(in srgb, currentColor 20%, transparent));   /* 10.19 : halo adouci (avant 1.5px, 35 %) */
  transition:color .25s ease, opacity .25s ease, transform .18s ease, filter .25s ease;
}
.plume svg{ display:block; width:100%; height:100%; }
/* 10.23 : « Hors ligne » sous la plume */
.plume-tag{
  position:absolute; right:12px; top:33px; pointer-events:none; white-space:nowrap;
  font-family:'Courier Prime', 'Courier New', monospace; font-size:0.6rem; font-weight:700;
  letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-faint);
}
.plume-tag[hidden]{ display:none; }
/* 10.14 : zone de toucher agrandie (invisible), sans déborder sur le titre */
.plume::before{ content:""; position:absolute; inset:-11px -11px -11px -10px; }
.plume.on{ color:var(--logo-green); }
.plume.waiting{ opacity:.55; }
.plume:hover{ transform:rotate(9deg); }
.plume:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:8px; }
.lucky-line[hidden], .urgent-banner[hidden], #waitingSection[hidden], .backup-nudge[hidden], .plume[hidden]{display:none;}

/* ---------- compteur « tableau de bord » (8.10) ----------
   Ligne du haut : à gauche le chiffre de la semaine, au milieu la phrase ;
   la barre court en dessous sur toute la largeur, le total en petit
   juste au-dessus de son extrémité droite (8.13 ; chiffre seul en 8.32).
   Compteur en bloc (8.37) : « 7 ACCOMPLIES » sur la 1re ligne, « CETTE
   SEMAINE » dessous, les deux de même largeur — voir fitCountBlock().
   Sur téléphone : chiffre et total côte à côte, la barre, puis la phrase. */
.progress-card{
  background:var(--surface);
  border-radius:16px;
  padding:1.3rem 1.5rem 1.4rem;
  box-shadow:var(--shadow);
  display:grid;
  grid-template-columns:auto 1fr auto;
  row-gap:1rem;
  align-items:center;
}
.progress-top{ display:contents; }
.progress-count{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-self:start; /* le bloc garde sa largeur, même dans une colonne 1fr */
}
.progress-count, .progress-total{
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.7rem;
  font-weight:700;
  letter-spacing:0.09em;
  line-height:1.35;
  text-transform:uppercase;
  white-space:pre-line;
  font-variant-numeric:tabular-nums;
  color:var(--count-ink);
}
.progress-count b{
  font-size:4.2em;
  letter-spacing:-0.03em;
  line-height:0.85;
}
/* 1re ligne à la largeur du bloc : un éventuel surplus va avant « accomplies » */
.count-line{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:0.85em;
  align-self:stretch;
}
.count-week{ margin-top:-0.1rem; line-height:1.1; }
.progress-count{ grid-column:1; grid-row:1; padding-right:1.6rem; margin-bottom:-0.28rem; /* plus près de la barre (8.38, un chouïa remonté en 9.1) */ }
.progress-count b{ color:var(--urgent); } /* 10.19 : améthyste, la teinte des urgences (avant : framboise --relance) */
.progress-total{
  grid-column:3; grid-row:1;  /* tout au bout, juste au-dessus de la barre (8.13) */
  align-self:end;
  margin-bottom:-0.72rem;
  padding-left:1.2rem;
  white-space:nowrap;
  line-height:1;
  font-size:0.68rem;
  /* 10.13 : ce qui reste à faire = la partie vide de la barre : sa couleur
     (--accent-soft), foncée juste assez pour se lire sur le blanc */
  color:color-mix(in srgb, var(--accent-soft) 40%, var(--accent-strong));
}
.progress-msg{
  grid-column:2;
  grid-row:1;
  align-self:stretch;
  display:flex;
  align-items:center;
  padding:0 1.6rem;
  border-left:1px solid var(--line);
  min-height:1.3em;
  font-family:'Public Sans', system-ui, sans-serif;
  font-size:0.95rem;
  font-weight:600;
  line-height:1.4;
  color:var(--phrase);
  text-wrap:pretty;
  transition:opacity .25s ease;
}
.bar-track{
  grid-column:1 / -1;
  grid-row:2;
  height:3px;
  background:var(--accent-soft);
  border-radius:999px;
  overflow:hidden;
}
.bar-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg, var(--accent-strong), var(--accent) 60%, color-mix(in srgb, var(--accent) 55%, #9FD8F5));
  border-radius:999px;
  transition:width .5s cubic-bezier(.4,0,.2,1);
}
@media (max-width:560px){
  .progress-card{ grid-template-columns:1fr auto; row-gap:0.9rem; }
  .progress-count{ padding-right:0; }
  .progress-total{ grid-column:2; }
  .progress-msg{ grid-column:1 / -1; grid-row:3; padding:0; border-left:none; }
}

/* ---------- case urgente ---------- */
.urgent-banner{
  margin-top:1.5rem;
  background:var(--ub-bg);
  border-radius:14px;
  padding:1rem 1.25rem;
  box-shadow:0 6px 18px -10px color-mix(in srgb, var(--urgent) 55%, transparent);
  display:flex;
  gap:0.9rem;
  align-items:flex-start;
}
.urgent-banner svg{flex:none; margin-top:-0.15rem; color:color-mix(in srgb, var(--urgent-ink) 50%, var(--urgent-soft));}   /* 10.25 : pâli comme le titre */ /* centre du picto = centre du titre (8.13) ; 10.19 : triangle, comme les boutons urgents */
.urgent-banner-title{
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.74rem;
  font-weight:700;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--ub-title);
  margin-bottom:0.55rem;   /* 10.35 : plus d'air sous le titre (avant 0.2rem) */
}
.urgent-banner-body{flex:1; min-width:0;}
/* rien d'urgent : la case reste, au calme */
.urgent-banner.calm{ align-items:center; }
.urgent-banner.calm svg{ margin-top:0; color:color-mix(in srgb, var(--urgent) 55%, var(--urgent-soft)); stroke-width:2.2; }
.urgent-banner.calm .urgent-banner-title{ margin:0; color:color-mix(in srgb, var(--urgent) 55%, var(--urgent-soft)); font-weight:700; } /* la couleur de l'urgent, éteinte (8.15) */
.urgent-list{
  list-style:none;
  margin:0;
  padding:0;
  display:flex;
  flex-direction:column;
  gap:0.15rem;   /* 10.34 : interligne d'avant rétabli dans le bandeau urgent */
}
.urgent-list li{
  display:flex;
  align-items:flex-start;
  gap:0.35rem;
  /* zone de survol élargie à gauche jusqu'au bord du rond « ! » : poignée et
     case à cocher y tiennent, le texte reste à sa place (8.30) */
  margin-left:-2rem;
  padding-left:0.3rem;
  border-radius:8px;
  position:relative;
  transition:background .12s ease;
}
/* un seul survol par ligne (7.40) ; 14 % dès que le thème n'est pas forcé en clair */
.urgent-list li{ --uhover:color-mix(in srgb, var(--urgent) 8%, var(--ub-bg)); }
:root:not([data-theme="light"]) .urgent-list li{ --uhover:color-mix(in srgb, var(--urgent) 14%, var(--ub-bg)); }
.urgent-list li:hover{ background:var(--uhover); }
.urgent-list li.dragging{opacity:0.4;}
.urgent-list .drag-handle{
  /* dans la ligne, comme dans les listes, visible au survol (8.30) */
  color:var(--urgent-ink);
  opacity:0;
  transition:opacity .15s ease;
  /* 10.44 : calée sur la 1re ligne, comme la case (centre à 0.3rem + 0.65 ×
     taille du texte), et non au milieu d'une tâche sur plusieurs lignes */
  align-self:flex-start; align-items:flex-start; line-height:18px;
  padding-top:calc(0.3rem + var(--task-size) * 0.65 - 9px);
}
.urgent-list li:hover .drag-handle{ opacity:0.5; }
.urgent-check{
  appearance:none;
  -webkit-appearance:none;
  box-sizing:border-box;
  padding:0;
  flex:none;
  margin:calc(0.3rem + var(--task-size) * 0.65 - 7px) 0 0; /* centrée sur la 1re ligne (8.30 ; 10.33 : nouvelle taille) */
  position:relative;
  width:14px;
  height:14px;
  border:1.5px solid color-mix(in srgb, var(--urgent-ink) 45%, transparent);
  border-radius:4px;
  background:var(--surface);
  cursor:pointer;
  opacity:0;
  transition:opacity .12s ease, border-color .12s ease, background .12s ease, scale .3s var(--pop-ease);
}
/* dévoilement : au survol avec une souris ; au toucher, par la classe
   « revealed » (8.38, voir la section des écrans tactiles) */
@media (hover:hover){ .urgent-list li:hover .urgent-check{ opacity:1; } }
/* 10.36 : la puce s'efface quand la case à cocher apparaît (elle est plus à gauche, alignée sur les listes) */
.urgent-bullet{ transition:opacity .12s ease; }
@media (hover:hover){ .urgent-list li:hover .urgent-bullet{ opacity:0; } }
.urgent-list li.revealed .urgent-bullet{ opacity:0; }
.urgent-check:hover{ border-color:var(--urgent-ink); background:color-mix(in srgb, var(--urgent-ink) 12%, var(--surface)); }
/* 10.33 : comme dans les listes, la coche apparaît au survol avec le petit zoom */
.urgent-check::after{
  content:"";
  position:absolute;
  left:3.5px; top:0.5px;
  width:4px; height:7.5px;
  border:solid var(--urgent-ink);
  border-width:0 1.5px 1.5px 0;
  transform:rotate(40deg);
  opacity:0;
  transition:opacity .12s ease;
}
@media (hover:hover){
  .urgent-check:hover{ scale:var(--pop-scale); }
  .urgent-check:hover::after{ opacity:1; }
}
@media (prefers-reduced-motion:reduce){ .urgent-check:hover{ scale:none; } }
.urgent-actions{
  /* 10.39 : en surimpression, comme dans les listes : le texte prend toute la
     largeur, les boutons se posent en bout de ligne sur un fondu */
  position:absolute; right:0; top:50%; transform:translateY(-50%); z-index:2;
  padding-left:1.4rem; border-radius:0 8px 8px 0;
  background:linear-gradient(90deg, transparent, var(--uhover) 1.2rem);
  display:flex;
  align-items:center;
  gap:0.1rem;
  padding-right:0.15rem;
  opacity:0;
  pointer-events:none;
  transition:opacity .12s ease;
}
@media (hover:hover){
  .urgent-list li:hover .urgent-actions,
  .urgent-list li:focus-within .urgent-actions{ opacity:1; pointer-events:auto; }
}
.urgent-actions button{ transition:color .12s ease, opacity .12s ease; }
.urgent-actions .waiting-btn{ color:color-mix(in srgb, var(--urgent-ink) 55%, transparent); }   /* au repos : dans le ton de la case */
.urgent-actions .urgent-btn.active{ background:transparent; }
/* 10.32 : au survol, mêmes couleurs et même zoom que dans les listes (règles
   générales .waiting-btn:hover / .urgent-btn:hover) */
.urgent-actions .urgent-btn.auto, .urgent-actions .urgent-btn.auto:hover{ cursor:default; background:transparent; color:var(--urgent-ink); opacity:0.7; }   /* 10.29 : triangle inerte */
.urgent-jump{
  appearance:none;
  border:none;
  background:transparent;
  flex:1;
  min-width:0;
  text-align:left;
  font-family:var(--font-task);   /* 10.33 */
  font-size:var(--task-size);
  line-height:1.3;
  color:var(--urgent-ink);   /* 10.25 : les tâches urgentes dans l'encre de l'urgence (avant : noir) */
  font-weight:500;
  padding:0.3rem 0.4rem 0.3rem 1.45rem; /* place de la puce (8.30) ; 10.36 : 1.45rem (avant 1.65rem) : texte aligné sur celui des listes */
  border-radius:8px;
  cursor:default;
  -webkit-tap-highlight-color:transparent; /* pas de voile gris au toucher (8.34) */
  position:relative;
}
[data-note-key] .urgent-jump{ cursor:pointer; }
/* puce : un rond plein dans le rouge du titre, centré sur la 1re ligne (8.29) */
.urgent-bullet{
  position:absolute;
  left:-0.17rem;   /* 10.36 : puce alignée sur les cases des listes (avant 0.45rem) */
  top:calc(0.3rem + var(--task-size) * 0.65); /* moitié de la 1re ligne : taille × 1.3 / 2 */
  transform:translateY(-50%);
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--urgent-ink); /* 10.25 : même encre que le texte (avant : améthyste à 80 %) */
  font-size:0;
}
.urgent-jump-cat{
  display:inline-block;
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.7rem;
  font-weight:600;
  letter-spacing:0.04em;
  text-transform:uppercase;
  color:var(--cat-color, var(--ink-faint)); /* le nom de la liste, en gris (8.14) ; 10.25 : dans la couleur de sa liste */
  margin:0 0.5rem;
}
/* détail de la tâche sous son titre, aligné sur le titre (8.28, plus clair en 8.29) ;
   replié derrière le sigle (8.31, voir .note-fold) */
.urgent-note{
  display:block;
  font-size:0.8rem;
  color:color-mix(in srgb, var(--ink-soft) 70%, transparent);
  padding-top:0.1rem;
  line-height:1.4;
}
.urgent-list .note-toggle{ color:color-mix(in srgb, var(--urgent-ink) 45%, transparent); background:transparent; }   /* 10.43 : pas le jaune des listes dans la case urgente */
.urgent-list .note-toggle:hover{ color:var(--urgent-ink); background:transparent; }
.urgent-list li.note-open .note-toggle{ color:var(--urgent-ink); background:var(--urgent-soft); }
/* relance arrivée (tâche en cours dont la date est là) — 10.23 : dans la
   case urgente, plus de couleur à part (avant : framboise --relance) : elle
   prend le style commun des urgences ; seul son badge « Relance » la signale.
   Dans « En cours », son titre est en améthyste, comme une tâche urgente. */
.item.item-relance .item-title{ color:var(--urgent-ink); font-weight:600; }

/* ---------- trèfle : deux petites tâches piochées chaque jour ---------- */
.lucky-line{
  margin-top:0.8rem;
  border-radius:12px;
  background:var(--lucky-bg);
  box-shadow:var(--shadow);
  padding:0.7rem 0.9rem 0.85rem;
  transition:opacity .4s ease, filter .4s ease;
}
.lucky-head{
  display:flex;
  flex-direction:row-reverse;   /* 10.45 : titre calé à droite, trèfle de ce côté ; ⟳ à gauche */
  align-items:center;
  gap:calc(0.9rem + 16.5px);   /* 10.45 : trèfle sous la plume, titre qui finit où finit « Sous le tapis » */
  margin:0 0.35rem 0.6rem 0;
}
.lucky-clover{flex:none; width:18px; height:18px; color:var(--phrase);   /* 10.25 : bleu de la phrase (avant : --wait pâli) */ overflow:visible; transform-origin:50% 48%; transition:transform .45s cubic-bezier(.34,1.4,.64,1);}
/* 8.25 : case fermée chaque matin — un gros bouton ; le trèfle sert de
   manivelle, la case se déploie et les deux tâches tournent comme une
   machine à sous avant de s'arrêter sur celles du jour. */
.lucky-line.closed{ cursor:pointer; padding-bottom:0.7rem; transition:opacity .4s ease, filter .4s ease, box-shadow .2s ease, transform .2s ease; }
.lucky-line.closed .lucky-head{ margin-bottom:0; }
.lucky-line.closed:not(.rest):hover, .lucky-line.closed:focus-visible{
  outline:none;
  box-shadow:var(--shadow), 0 0 0 3px color-mix(in srgb, var(--lucky-lemon) 40%, transparent), 0 6px 20px -4px color-mix(in srgb, var(--lucky-lemon) 70%, transparent);
  transform:translateY(-1px);
}
.lucky-line.closed:not(.rest):hover .lucky-clover, .lucky-line.closed:focus-visible .lucky-clover{ transform:rotate(-30deg); }
.lucky-line.closed:active{ transform:translateY(0); }
.lucky-clover-btn{
  appearance:none; border:none; background:transparent; padding:3px; margin:-3px;
  border-radius:50%; line-height:0; cursor:pointer; color:inherit; flex:none;
  transition:background .15s ease;
}
.lucky-clover-btn:hover{ background:color-mix(in srgb, var(--lucky-lemon) 22%, var(--surface)); }
.lucky-clover-btn:hover .lucky-clover{ transform:rotate(30deg); }
.lucky-clover-btn:focus-visible{ outline:2px solid var(--lucky-lemon); outline-offset:1px; }
.lucky-line.closing{ pointer-events:none; }
.lucky-pick.spinning{ position:relative; }
.lucky-pick.spinning .lucky-pick-text{ visibility:hidden; }
.lucky-reel{ position:absolute; overflow:hidden; pointer-events:none; }
.lucky-reel-strip{ display:block; will-change:transform, filter; }
.lucky-reel-item{
  display:flex; align-items:center; justify-content:center;
  overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
}
.lucky-reel-item > span{ min-width:0; overflow:hidden; text-overflow:ellipsis; }
.lucky-reel-item.final > span{ white-space:inherit; overflow:visible; flex:none; max-width:100%; }
.lucky-lead{
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-style:normal;
  font-size:0.74rem;
  font-weight:600;
  letter-spacing:0.07em;
  text-transform:uppercase;
  color:var(--phrase);   /* 10.25 : bleu de la phrase, comme le trèfle (avant : olive citron + encre) */
  margin-left:auto; /* pousse ⟳ à l'autre bout, même enveloppé (8.33) */
}
.lucky-reroll{
  appearance:none;
  border:none;
  background:transparent;
  color:color-mix(in srgb, var(--lucky-lemon) 55%, var(--ink));
  opacity:0.8;
  padding:4px;
  border-radius:50%;
  cursor:pointer;
  line-height:0;
  transition:opacity .15s ease, background .15s ease, transform .35s ease;
}
.lucky-reroll:hover{ opacity:1; background:color-mix(in srgb, var(--lucky-lemon) 25%, var(--surface)); }   /* 10.32 : zoom commun (avant : demi-tour) */
.lucky-opts{display:flex; align-items:center; gap:0.9rem;}
.lucky-or{
  flex:none;
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-style:normal;
  font-weight:700;
  font-size:0.75rem;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:color-mix(in srgb, var(--lucky-lemon) 55%, var(--ink));
  opacity:.7;
}
.lucky-pick{
  appearance:none;
  flex:1 1 0;
  min-width:0;
  border:1px solid transparent;
  border-radius:8px;
  background:var(--surface);
  font-family:'Public Sans', system-ui, sans-serif;
  font-style:normal;
  font-size:0.9rem;
  color:var(--ink);
  padding:0.5rem 0.9rem;
  box-shadow:0 1px 2px rgba(30,40,45,0.06);
  text-align:center;
  cursor:pointer;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  transition:box-shadow .2s ease, transform .2s ease;
}
.lucky-pick.chosen{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:0.5rem;
  cursor:default;
  border-color:var(--lucky-lemon);
  box-shadow:0 0 0 1px var(--lucky-lemon);
}
/* survol : la petite case reste blanche, elle s'illumine par l'arrière.
   (!important : le liseré citron de la proposition retenue s'efface aussi.) */
.lucky-pick:hover{
  background:var(--surface);
  border-color:transparent !important;
  box-shadow:0 0 0 3px color-mix(in srgb, var(--lucky-lemon) 35%, transparent), 0 4px 16px -2px color-mix(in srgb, var(--lucky-lemon) 70%, transparent);
  transform:translateY(-1px);
}
.lucky-pick-text{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.lucky-check{flex:none; width:15px; height:15px; margin:0; accent-color:var(--wait); cursor:pointer;}
.lucky-line.can-reset{cursor:pointer;}
.lucky-pick.dim{opacity:0.45; filter:grayscale(1);}
.lucky-pick.dim:hover{opacity:0.75;}
/* une des deux est faite : tout se grise, seul le liseré jaune reste, atténué */
.lucky-line.done{background:color-mix(in srgb, var(--surface) 45%, var(--bg));}
.lucky-line.done .lucky-head{filter:grayscale(1); opacity:0.68;}
.lucky-line.done .lucky-pick{color:var(--ink-faint);}
.lucky-line.done .lucky-pick.dim{opacity:0.4;}
.lucky-line.done .lucky-pick.dim:hover{opacity:0.4; cursor:default;}
.lucky-line.done .lucky-pick.chosen{
  border-color:color-mix(in srgb, var(--lucky-lemon) 50%, var(--line));
  box-shadow:none;
}
.lucky-line.done .lucky-check{accent-color:var(--ink-faint);}
.lucky-pick.won .lucky-pick-text{text-decoration:line-through; text-decoration-thickness:1px;}
@media (max-width:560px){
  .lucky-opts{gap:0.5rem;}
  .lucky-pick{ white-space:normal; padding:0.45rem 0.6rem; } /* sur deux lignes plutôt que coupées */
  .lucky-pick-text{ white-space:normal; }
}

/* ---------- listes ---------- */
.categories{
  margin-top:2.25rem;
  display:grid;
  grid-template-columns:minmax(0, 1fr) minmax(0, 1fr);   /* 10.20 : colonnes égales quel que soit le contenu */
  gap:1.1rem;
}
@media (max-width:720px){
  .categories{grid-template-columns:minmax(0, 1fr);}
}
/* liste : fond blanc, seul le liseré coloré à gauche */
.category{
  background:var(--surface);
  /* liseré à la couleur de la liste, adouci (8.14) ; 10.53 : remplacé par la
     barre ci-dessous — le bord de 3px reste, transparent, pour que rien ne bouge */
  border-left:3px solid transparent;
  border-radius:14px;
  padding:1.15rem 1.25rem 1.3rem;
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  gap:0.65rem;
  min-width:0;   /* 10.20 : un contenu large ne pousse plus la carte */
}
/* 10.53 : barre franche à la couleur de la liste, détachée des coins : elle
   part du titre et s'arrête deux lignes avant le bas (choisie au banc parmi
   bord plein, bande en haut, sans bord, arc du coin…). Pas sur les mémos,
   qui ont leur marge de cahier. */
.category:not(.courses)::before{
  content:""; position:absolute; left:0; top:1.05rem; bottom:2.2rem; width:3px;
  background:var(--cat-color, var(--accent));   /* bouts droits : arrondis, elle rappelait la barre de défilement des mémos */
}
.category.collapsed:not(.courses)::before{ bottom:1.05rem; }   /* repliée : la barre longe le titre */
.category.done{ opacity:0.62; }
/* 10.15 : liste de courses — hauteur bornée (--courses-max, posé par
   fitCoursesCards) ; au-delà, seule la zone des articles défile, le titre,
   la saisie et les boutons restent visibles.
   10.17 : feuille de cahier — papier, sans le liseré coloré de gauche (son
   épaisseur rendue au padding, rien ne bouge), marge verticale juste
   à gauche des ronds (--margin-x : bord gauche de la carte → marge), qui
   part du premier article (--rule-top, posé par fitCoursesCards).
   10.18 : marge à la couleur de la liste, pile entre la poignée et le rond ;
   liseré très fin à la couleur de la liste (ombre intérieure d'un
   demi-pixel : rien ne bouge) et ombre un peu plus nette, pour se détacher
   du fond ; repliée, un clic n'importe où sur la carte la déplie */
.category.courses{
  max-height:var(--courses-max, 28rem);
  --margin-x:3.19rem;
  --margin-ink:color-mix(in srgb, var(--cat-color, var(--accent)) 70%, var(--paper));
  border-left:0;
  padding-left:calc(1.25rem + 3px);
  box-shadow:inset 0 0 0 0.5px var(--memo-line),
    inset 0 1px 0 var(--gloss), var(--paper-shadow);   /* 10.23 : liseré de lumière en haut ; 10.25 : liseré neutre bleuté */
  background:
    linear-gradient(var(--gloss-a, 115deg), transparent var(--gloss-p, 18%), var(--gloss) calc(var(--gloss-p, 18%) + 9%), transparent calc(var(--gloss-p, 18%) + 26%)),
    linear-gradient(var(--gloss-a, 115deg), transparent calc(var(--gloss-p, 18%) + 34%), color-mix(in srgb, var(--gloss) 60%, transparent) calc(var(--gloss-p, 18%) + 38%), transparent calc(var(--gloss-p, 18%) + 44%)),   /* 10.25 : second reflet, fin */   /* 10.23 : papier glacé — bande de lumière en biais */
    linear-gradient(90deg, transparent var(--margin-x), var(--margin-ink) var(--margin-x),
      var(--margin-ink) calc(var(--margin-x) + 1.5px), transparent calc(var(--margin-x) + 1.5px))
      0 var(--rule-top, 0) / 100% 100% no-repeat,
    linear-gradient(160deg, var(--memo-a) 10%, var(--memo-b) 60%, var(--memo-c) 100%);   /* 10.25 : nacre légère */
}
.category.courses > ul.items{
  flex:0 1 auto; min-height:0;
  overflow-y:auto;   /* 10.39 : plus de contain : au bout du mémo, la page reprend le défilement */
  scrollbar-width:none;   /* 10.18 : barre maison .courses-scroll, toujours visible (iPhone compris) */
}
.category.courses > ul.items::-webkit-scrollbar{ display:none; }
/* 10.18 : barre de défilement toujours visible quand la liste dépasse (les
   barres du système disparaissent au repos, surtout sur iPhone) ; placée par
   placeCoursesScroll, dans la marge droite de la carte, sans capter le doigt */
.courses-scroll{
  position:absolute; right:0.5rem; width:3px; border-radius:2px;
  background:var(--paper-rule); pointer-events:none;
}
.courses-scroll[hidden]{ display:none; }
.courses-scroll > span{
  position:absolute; left:0; right:0; border-radius:2px;
  background:color-mix(in srgb, var(--cat-color, var(--accent)) 70%, var(--paper));
}
/* 10.7 : volet — la flèche en bas à droite replie la liste sur son bandeau */
.category{ position:relative; }
.cat-fold{
  position:absolute; right:0.55rem; bottom:0.3rem; width:24px; height:18px;
  display:grid; place-items:center; appearance:none; border:0; background:none; padding:0;
  border-radius:6px; cursor:pointer; color:var(--ink-faint); opacity:0.55;
  transition:opacity .15s ease, color .15s ease, background .15s ease;
}
.cat-fold:hover, .cat-fold:focus-visible{ opacity:1; color:var(--cat-color, var(--accent)); background:color-mix(in srgb, var(--cat-color, var(--accent)) 10%, transparent); }
.cat-fold:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
.cat-fold svg{ display:block; transition:transform .25s ease; }
.category.collapsed{ align-self:start; padding-bottom:2.1rem; }   /* 10.43 : plus de place pour la poignée sous le titre (avant 1.5rem) */
.category.collapsed > ul.items, .category.courses.collapsed .courses-actions{ display:none; }
/* 10.19 : repliée, une liste de courses garde sa saisie ; le reste de la carte la déplie */
.category.courses.collapsed .courses-entry{ cursor:auto; }
.category.collapsed .cat-fold svg{ transform:rotate(180deg); }
.category.collapsed .cat-order{ display:none; }   /* 10.45 : repliée, la flèche d'ordre se confondait avec celle qui rouvre */
.category.courses.collapsed{ cursor:pointer; } /* 10.18 : toute la carte repliée se déplie d'un clic */
.category.courses .cat-head{ cursor:pointer; } /* 10.19 : ouverte, un clic sur le bandeau (hors titre) la replie */
.category.courses .cat-title{ cursor:auto; }
/* 10.43 : liste repliée, tâches restantes dans une bulle à la couleur de la
   liste (comme « nouveau ») ; avant : chiffre gris seul, peu clair */
.cat-count{
  font-family:'Public Sans', system-ui, sans-serif; font-size:0.68rem; font-weight:700; flex:none;   /* 10.44 : chiffres bien centrés d'un navigateur à l'autre (ceux de Courier Prime variaient) */
  min-width:1.3rem; height:1.1rem; box-sizing:border-box; padding:0 0.45rem; border-radius:999px; line-height:1;
  display:inline-flex; align-items:center; justify-content:center;
  background:color-mix(in srgb, var(--cat-color, var(--accent)) 18%, var(--surface));
  color:color-mix(in srgb, var(--cat-color, var(--accent)) 80%, var(--ink));
}
@media (prefers-reduced-motion: reduce){ .cat-fold svg{ transition:none; } }
.cat-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:0.75rem;
}
.category:not(.courses):not(.collapsed) .cat-head{ margin-bottom:0.35rem; }   /* 10.35 : plus d'air entre le titre et les tâches */
.category.courses .cat-head{ margin-top:0.11rem; }   /* 10.36 : titre des mémos sur la même ligne que les autres titres */
.category.courses:not(.collapsed) .cat-head{ margin-bottom:0.12rem; }   /* 10.36 : 1er article sur la même ligne que la 1re tâche des listes voisines */
.cat-title-group{
  display:flex;
  align-items:center;
  gap:0.5rem;
  flex:1;
  min-width:0;
}
.cat-head-right{
  display:flex;
  align-items:center;
  gap:0.5rem;
}
/* 10.37 : bouton pleine page (flèches en diagonale), dans la famille des petits boutons à icône */
.cat-full{
  appearance:none; border:none; background:transparent; color:var(--ink-faint);
  padding:3px; line-height:0; border-radius:6px; cursor:pointer;
  opacity:0.5;   /* 10.40 : discrète comme ses voisines (flèche d'ordre, poignée) ; pleine au survol de la carte */
  transition:opacity .15s ease, background .15s ease, color .15s ease;
}
.category:hover .cat-full{ opacity:1; }
.cat-full svg{ display:block; transition:scale .3s var(--pop-ease); }
/* 10.39 : zones de toucher agrandies sans changer le dessin : rond des mémos
   (≈ 35 px, comme les cases), pleine page et flèche d'ordre (≈ 40 px de haut,
   un peu moins en largeur pour ne pas mordre sur le bouton voisin) */
.strike-dot, .cat-full, .cat-order{ position:relative; z-index:1; }   /* z-index : la zone passe au-dessus de la ligne suivante */
.strike-dot::after{ content:""; position:absolute; inset:-12px; }
.cat-full::after, .cat-order::after{ content:""; position:absolute; inset:-10px -4px; }
.haptic-wrap:has(> .strike-dot) > .haptic-tap{ inset:-12px; }   /* iPhone : la zone qui fait vibrer suit */
.cat-full:hover{ background:var(--surface-2); color:var(--ink-soft); opacity:1; }
.cat-full:hover svg{ scale:var(--pop-scale); }
.cat-full:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
@media (prefers-reduced-motion:reduce){ .cat-full:hover svg{ scale:none; } }
/* la carte ouverte : posée sur toute la hauteur, centrée, fond de page derrière */
body.has-fullpage{ overflow:hidden; }
body.has-fullpage .wrap{ isolation:auto; }   /* sinon la carte reste prise sous le fond (la page isole .wrap) */
body.has-fullpage::after{ content:""; position:fixed; inset:0; z-index:140; background:var(--bg); }
.category.fullpage{
  position:fixed; z-index:150;
  top:0; bottom:0; left:50%; transform:translateX(-50%);
  width:min(820px, 100vw); box-sizing:border-box;
  max-height:none; border-radius:0;
  padding-top:max(1.15rem, calc(env(safe-area-inset-top, 0px) + 0.75rem));
  padding-bottom:max(1.3rem, calc(env(safe-area-inset-bottom, 0px) + 0.75rem));
  padding-left:max(1.25rem, env(safe-area-inset-left, 0px));
  padding-right:max(1.25rem, env(safe-area-inset-right, 0px));
  box-shadow:0 0 0 1px var(--line), 0 20px 60px -30px rgba(30,40,45,.35);
}
.category.fullpage:not(.courses){ overflow-y:auto; -webkit-overflow-scrolling:touch; }
.category.fullpage .cat-grip{ display:none; }
.category.fullpage .cat-full{ color:var(--ink-soft); opacity:1; }   /* en pleine page, c'est le bouton de retour : bien visible */
@media (max-width:820px){ .category.fullpage{ box-shadow:none; } }


.cat-title{
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.74rem;
  font-weight:700;
  letter-spacing:0.09em;
  text-transform:uppercase;
  /* dans la couleur de la liste, un peu foncée pour rester lisible (8.36) */
  color:color-mix(in srgb, var(--cat-color, var(--accent)) 78%, var(--ink));
  cursor:text;
  border-radius:4px;
}
.cat-title:hover{
  color:var(--cat-color, var(--accent));
  background:var(--surface-2);
}
/* 10.15 : petit panier devant le titre d'une liste de courses */
.cat-basket{
  display:block; flex:none; margin-right:-0.2rem;
  color:color-mix(in srgb, var(--cat-color, var(--accent)) 78%, var(--ink));
  opacity:0.75;
}
.cat-title-input{
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.7rem;
  font-weight:600;
  letter-spacing:0.09em;
  text-transform:uppercase;
  color:var(--ink);
  background:var(--surface-2);
  border:1px solid var(--accent);
  border-radius:4px;
  padding:0.15rem 0.4rem;
  min-width:6ch;
}
.cat-title-input:focus{
  outline:2px solid var(--accent);
  outline-offset:1px;
}
/* pastilles de couleur sous le titre en cours de renommage (8.36) */
.cat-swatches{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:-0.15rem;
}
.cat-swatch{
  appearance:none;
  -webkit-appearance:none;
  width:18px;
  height:18px;
  padding:0;
  border:none;
  border-radius:5px;
  background:var(--sw);
  cursor:pointer;
  transition:transform .12s ease;
}
.cat-swatch:hover{ transform:scale(1.12); }
.cat-swatch.selected{ outline:2px solid var(--sw); outline-offset:2px; }
/* 10.2 : pastilles des personnes avec qui la liste est partagée (à côté du titre) */
.share-chips{ display:inline-flex; flex:none; }
.share-chip{
  display:inline-flex; align-items:center; justify-content:center;
  min-width:1.15rem; height:1.15rem; box-sizing:border-box; padding:0 0.2rem;   /* 10.41 : s'allonge pour deux initiales */
  border-radius:999px;
  background:color-mix(in srgb, var(--cat-color, var(--accent)) 20%, var(--surface));
  color:color-mix(in srgb, var(--cat-color, var(--accent)) 75%, var(--ink));
  box-shadow:0 0 0 2px var(--surface);
  font-size:0.62rem; font-weight:700; line-height:1;
}
.share-chip + .share-chip{ margin-left:-0.15rem; }   /* 10.41 : moins serrées, deux initiales restent lisibles */
/* 10.31 : nouveautés venues d'autres personnes */
.item{ position:relative; }
.new-tag{
  position:absolute; right:0.5rem; top:0.55rem; pointer-events:none; transition:opacity .12s ease;
  font-family:'Courier Prime', 'Courier New', Courier, monospace; font-size:0.62rem; font-weight:700; letter-spacing:0.05em; text-transform:uppercase;
  padding:0.05rem 0.4rem; border-radius:999px;
  background:color-mix(in srgb, var(--cat-color, var(--accent)) 18%, var(--surface));
  color:color-mix(in srgb, var(--cat-color, var(--accent)) 80%, var(--ink));
}
.item.is-new{ background:color-mix(in srgb, var(--cat-color, var(--accent)) 8%, var(--surface)); }   /* surlignée sur toute la largeur */
.item.is-new > .item-text{ padding-right:5.4rem; }   /* 10.45 : le texte laisse la place à « modif – AP » (plus de chevauchement) */
@media (hover:hover){ .item:hover .new-tag{ opacity:0; } }   /* laisse la place aux boutons de la ligne */
.item.revealed .new-tag, .item.editing .new-tag{ opacity:0; }
/* titre : le + suit le dernier mot ; le champ express reste à côté s'il
   tient en entier (12rem), sinon il passe à la ligne */
.cat-title-group{ flex-wrap:wrap; row-gap:0.4rem; }
.cat-title-line{ flex:0 1 auto; min-width:0; line-height:1.4; }
.cat-title-line .cat-title{ display:inline; }
.cat-title-line .add-btn{ display:inline-flex; vertical-align:middle; margin-left:0.45rem; margin-right:-1.7rem; position:relative; top:-1px; }
.cat-title-line:has(.add-btn){ margin-right:1.7rem; }
/* initiales des personnes, en bas à droite de la carte (à gauche du repli) */
.category > .share-chips{ position:absolute; right:2.3rem; bottom:0.35rem; }
.category.has-people{ padding-bottom:1.7rem; }
.share-more{ font-size:0.55rem; }
/* 10.2 : « Partagée avec » sous les couleurs, dans le renommage d'une liste */
.cat-share{ display:flex; flex-wrap:wrap; align-items:center; gap:0.35rem 0.5rem; margin-top:0.55rem; font-size:0.8rem; color:var(--ink-soft); }
.cat-share-label{ font-family:'Courier Prime', 'Courier New', Courier, monospace; font-size:0.66rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-faint); margin-right:0.15rem; }
.cat-share-person{
  appearance:none; display:inline-flex; align-items:center; gap:0.35rem;
  border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
  border-radius:999px; padding:0.2rem 0.6rem 0.2rem 0.35rem;
  font:inherit; font-size:0.8rem; cursor:pointer;
  transition:border-color .15s ease, background .15s ease, color .15s ease;
}
.cat-share-person .box{
  width:0.9rem; height:0.9rem; border-radius:4px; border:1.5px solid var(--ink-faint);
  display:inline-flex; align-items:center; justify-content:center; flex:none;
}
.cat-share-person .box svg{ width:0.65rem; height:0.65rem; display:none; }
.cat-share-person[aria-checked="true"]{ border-color:var(--cat-color, var(--accent)); color:var(--ink); background:color-mix(in srgb, var(--cat-color, var(--accent)) 10%, var(--surface)); }
.cat-share-person:disabled{ opacity:0.38; cursor:default; }   /* 10.63 : duel, l'adversaire est déjà choisi */
.cat-share-person[aria-checked="true"] .box{ background:var(--cat-color, var(--accent)); border-color:var(--cat-color, var(--accent)); color:var(--surface); }
.cat-share-person[aria-checked="true"] .box svg{ display:block; }
.cat-share-person:hover{ border-color:var(--cat-color, var(--accent)); }
.cat-share-person:disabled{ opacity:.5; cursor:default; }
.cat-share-link{ appearance:none; border:0; background:none; padding:0; font:inherit; font-size:0.8rem; color:var(--accent); cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
/* 10.15 : « Convertir en liste de courses / normale », sous « Partagée avec » */
.cat-convert{ margin-top:0.4rem; font-size:0.8rem; }
.add-btn{
  appearance:none;
  border:1px solid var(--line);
  background:var(--surface-2);
  color:var(--ink-soft);
  width:20px;
  height:20px;
  border-radius:6px;
  font-size:0.86rem;
  line-height:1;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:none;
}
.add-btn:hover{
  background:var(--accent-soft);
  color:var(--accent-strong);
  border-color:var(--accent);
}
/* ajout express (7.1) : champ discret à côté du titre */
.cat-quick-wrap{ position:relative; flex:1 0 8rem; max-width:20rem; min-width:0; display:flex; align-items:center; cursor:text; }   /* 10.31 : à côté du titre s'il tient en entier, sinon à la ligne */
.cat-quick-pen{
  position:absolute; left:0.3rem; top:50%; transform:translateY(-50%);
  color:var(--ink-faint); opacity:.55; pointer-events:none;
  transition:opacity .15s ease, color .15s ease;
}
.cat-quick-wrap:hover .cat-quick-pen{ opacity:1; color:var(--ink-soft); }
.cat-quick-wrap:focus-within .cat-quick-pen{ opacity:0; }
.cat-quick{
  flex:1; min-width:4ch; width:100%;
  font-family:inherit; font-size:0.86rem; color:var(--ink);
  background:transparent; border:none; border-bottom:1px dashed transparent; border-radius:0;
  padding:0.15rem 0.2rem 0.15rem 1.4rem; margin-left:0;   /* 10.31 : place pour le crayon, sous l'invite */
  transition:border-color .15s ease;
}
.cat-quick::placeholder{ color:var(--ink-faint); opacity:.7; }
.category:hover .cat-quick{ border-bottom-color:var(--line); }
.cat-quick:focus{ outline:none; border-bottom:1px solid var(--cat-color, var(--accent)); }
/* sens d'affichage (7.1) : ▲ la plus récente en haut, ▼ en bas */
.cat-order{
  appearance:none; border:none; background:transparent; color:var(--ink-faint);
  padding:5px 6px; border-radius:6px; cursor:pointer; line-height:0;
  display:inline-flex; align-items:center;
  opacity:0.45; /* discrète (8.6) ; pleine au survol */
  transition:color .15s ease, background .15s ease, opacity .15s ease;
}
.cat-order svg{ display:block; transition:transform .25s cubic-bezier(.34,1.56,.64,1); }
.cat-order.reversed svg{ transform:rotate(180deg); }
.cat-order:hover{ background:var(--surface-2); color:var(--ink-soft); opacity:1; }
.cat-order.custom{ color:var(--cat-color, var(--accent)); }   /* 10.38 : colorée quand le sens n'est pas celui par défaut (listes : récentes en haut ; mémos : en bas) */
.cat-grip{
  display:flex;
  align-items:center;
  padding:4px 3px;
  border-radius:6px;
  color:var(--ink-faint);
  opacity:0.5;
  cursor:grab;
  touch-action:none;
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
  transition:opacity .15s ease, background .15s ease, color .15s ease;
}
/* 10.42 : en bas à gauche de la carte, couchée, pendant de la flèche du volet
   en bas à droite (avant : en haut à droite ; 10.41 : à gauche du titre) ;
   « .category » l'emporte sur [data-tip] */
.category .cat-grip{ position:absolute; left:0.55rem; bottom:0.12rem; }
.category .cat-grip svg{ transform:rotate(90deg); }
.category:hover .cat-grip{ opacity:1; }
.cat-grip:hover{ background:var(--surface-2); color:var(--ink-soft); }
/* Volontairement distincte du × discret d'une tâche (.delete-btn) : cette
   croix supprime toute une case, pas une simple ligne — elle doit se voir
   sans avoir à survoler la carte, et ne pas se confondre avec le langage
   visuel réservé aux tâches. */
.cat-delete-btn{
  appearance:none;
  border:1px solid var(--line);
  background:var(--surface-2);
  color:var(--ink-soft);
  width:22px;
  height:22px;
  border-radius:6px;
  font-size:0.95rem;
  line-height:1;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:none;
}
.cat-delete-btn:hover{
  background:var(--urgent-soft);
  color:var(--urgent-ink);
  border-color:var(--urgent);
}
.add-category-row{
  margin-top:1.9rem;   /* 10.53 : plus d'air avant « Nouvelle liste » (avant 0.85rem) */
  display:flex;
  justify-content:center;
}
.nl-hint{ font-size:0.8rem; color:var(--ink-soft); margin:0.1rem 0 0.2rem; }   /* 10.53 */
.add-category-btn{
  appearance:none;
  /* 10.45 : citron givré du trèfle, pointillés citron, petit zoom au survol
     (avant : blanc et gris, peu engageant) */
  border:1px dashed color-mix(in srgb, var(--lucky-lemon) 70%, transparent);
  background:var(--lucky-bg);
  color:var(--phrase);
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.7rem;
  font-weight:600;
  letter-spacing:0.04em;
  text-transform:uppercase;
  padding:0.5rem 1rem;
  border-radius:999px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:0.4rem;
  transition:transform .2s var(--pop-ease), border-color .15s ease, box-shadow .2s ease;
}
.add-category-btn:hover, .add-category-btn:focus-visible{
  outline:none;
  border-style:solid;
  border-color:var(--lucky-lemon);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--lucky-lemon) 30%, transparent);
  transform:scale(1.06);
}

/* ---------- 10.63 : duel de faisans (petit jeu à deux, tour par tour) ----------
   Une liste de type "duel", posée dans la grille sur toute la largeur. Réglages
   choisis au banc du jeu (essai-jeu.html) le 6/11/2026 : ciel neutre, façades
   mauve et sauge, pignons à gradins ; un seul bleu (--objet) pour les objets et
   les boutons du jeu ; boutons « écran » (Courier Prime, ombre dure) ; les
   couleurs des joueurs (--chat-me, --chat-them) ne servent qu'à les reconnaître. */
/* au repos, discret comme l'écran de chat (--chat-dim) ; net au survol, quand on joue (toucher dedans,
   jusqu'à toucher ailleurs), pendant un vol ou la fête, et quand un coup de l'autre attend d'être vu */
.duel-stage > *{ opacity:calc(1 - 0.34); transition:opacity .35s ease; }   /* le papier reste plein, son contenu s'efface */
.duel-card:hover .duel-stage > *, .duel-card:focus-within .duel-stage > *, .duel-card.chat-open .duel-stage > *,
.duel-card.duel-live .duel-stage > *, .duel-card.duel-touch .duel-stage > *{ opacity:1; }
.duel-card{
  position:relative; min-width:0; container-type:inline-size;   /* une case de la grille, comme une liste */
  --sky-top:#F7FAF9; --sky-bottom:#E6EAEA; --sky-end-top:#EFE3FA; --sky-end-bottom:#FCF8DA;
  --cloud:rgba(255,255,255,0.9);
  --facades:#E3DBEB,#D8E2CF,#EEF0EC,#DFE5E9,#E8E1EE; --facade-shadow:rgba(30,40,45,0.10);
  --win-lit:rgba(230,214,60,0.30); --win-off:rgba(42,39,37,0.06);
  --objet:#2F6F7C;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .duel-card{
    --sky-top:#1B252B; --sky-bottom:#101315; --sky-end-top:#2A2140; --sky-end-bottom:#24231A; --cloud:rgba(255,255,255,0.05);
    --facades:#261D33,#26261C,#1E2A1C,#2B2238,#2A2A1D; --facade-shadow:rgba(0,0,0,0.45);
    --win-lit:rgba(226,200,102,0.22); --win-off:rgba(255,255,255,0.035); --objet:#7FC0CC;
  }
}
:root[data-theme="dark"] .duel-card{
  --sky-top:#1B252B; --sky-bottom:#101315; --sky-end-top:#2A2140; --sky-end-bottom:#24231A; --cloud:rgba(255,255,255,0.05);
  --facades:#261D33,#26261C,#1E2A1C,#2B2238,#2A2A1D; --facade-shadow:rgba(0,0,0,0.45);
  --win-lit:rgba(226,200,102,0.22); --win-off:rgba(255,255,255,0.035); --objet:#7FC0CC;
}
.duel-stage{ background:var(--surface); border-radius:14px; box-shadow:var(--shadow); padding:0.85rem 0.6rem 0.2rem; }   /* le papier d'une liste */
/* le jeu dans un écran creusé, comme l'écran de chat : tranche de tôle arrondie, écran au fond,
   trame LCD et ombres intérieures posées par-dessus le dessin (::after) */
.duel-screen{ position:relative; padding:2px; border-radius:18px;
  background:linear-gradient(180deg, color-mix(in srgb, var(--ink) 16%, var(--surface)) 0%, color-mix(in srgb, var(--ink) 6%, var(--surface)) 35%, var(--surface) 60%, var(--chat-lip) 100%);
  box-shadow:0 -1px 0 rgba(42,39,37,0.06), 0 1px 1px var(--chat-lip); }
.duel-screen::after{ content:""; position:absolute; inset:2px; border-radius:16px; pointer-events:none; z-index:1;
  background-image:repeating-linear-gradient(0deg, rgba(40,50,40,0.017) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgba(40,50,40,0.017) 0 1px, transparent 1px 3px);
  box-shadow:
    inset 0 6.6px 9.6px -3.6px rgba(42,39,37,0.42),
    inset 0 2px 3px rgba(42,39,37,0.18),
    inset 5.4px 0 7.8px -4.2px rgba(42,39,37,0.16),
    inset -5.4px 0 7.8px -4.2px rgba(42,39,37,0.10),
    inset 0 -5.4px 7.2px -3.6px var(--chat-lip); }
.duel-cv{ display:block; width:100%; aspect-ratio:16/9; border-radius:16px; touch-action:manipulation; }
.duel-card .attente, .duel-card .d-statut{ z-index:0; }   /* sur le plan de la ville : les ombres de l'écran passent par-dessus */
.duel-screen::after{ z-index:3; }
/* bandeaux : « En attente de … » en bas, discret ; « … a joué ! » au milieu, texte puis bouton ; immobiles une fois posés */
.duel-card .attente{
  position:absolute; left:0; right:0; bottom:0; transform:translateY(100%); opacity:0;
  display:flex; align-items:center; justify-content:center; gap:1rem; padding:0.55rem 1rem;
  background:color-mix(in srgb, var(--surface) 70%, transparent);   /* pas de backdrop-filter : trop lourd au-dessus d'un canevas animé */
  border-top:1px solid color-mix(in srgb, var(--pc) 22%, transparent); border-radius:0 0 16px 16px; margin:0 2px 2px;
  color:var(--pc); font:700 1rem 'Courier Prime', monospace; white-space:nowrap; pointer-events:none; visibility:hidden;
  transition:transform .45s cubic-bezier(.2,.8,.3,1), opacity .3s, visibility 0s .45s;
}
.duel-card .attente.on{ transform:translateY(0); opacity:1; pointer-events:auto; visibility:visible; transition:transform .45s cubic-bezier(.2,.8,.3,1), opacity .3s, visibility 0s; }
.duel-card .attente.decouverte{
  top:50%; bottom:auto; left:2px; right:2px; margin:0; transform:translateY(-50%) scaleY(0); border-radius:0; flex-direction:column; gap:0.5rem;
  background:color-mix(in srgb, var(--pc) 7%, color-mix(in srgb, var(--surface) 62%, transparent));
  border-top:2px solid color-mix(in srgb, var(--pc) 40%, transparent); border-bottom:2px solid color-mix(in srgb, var(--pc) 40%, transparent);
  font-size:1.3rem; padding:0.6rem 1rem 0.8rem;
}
.duel-card .attente.decouverte.on{ transform:translateY(-50%) scaleY(1); }
/* boutons « écran » : Courier Prime, coins presque droits, ombre dure ; ils glissent sur leur ombre à l'appui */
.duel-card .poussoir, .duel-card .d-lancer{
  --pc:var(--objet);
  font:700 1rem 'Courier Prime', monospace; color:var(--pc); background:var(--surface); cursor:pointer;
  border:2px solid var(--pc); border-radius:3px; padding:0.38rem 1.1rem; letter-spacing:0.02em; line-height:1.2;
  box-shadow:3px 3px 0 var(--pc); transform:translate(0, 0); transition:transform .06s, box-shadow .06s, background .12s;
}
.duel-card .d-lancer{ min-width:7.5em; order:2; }
.duel-card .poussoir::before{ content:"> "; }
@media (hover:hover){ .duel-card .poussoir:hover, .duel-card .d-lancer:not(:disabled):hover{ background:color-mix(in srgb, var(--pc) 9%, var(--surface)); } }
.duel-card .poussoir:active, .duel-card .d-lancer:not(:disabled):active{ transform:translate(3px, 3px); box-shadow:0 0 0 var(--pc); }
.duel-card .d-lancer:disabled{ cursor:default; color:var(--ink-faint); border-color:var(--line); box-shadow:3px 3px 0 var(--line); background:var(--surface); }
/* ligne du coup (esprit invite C:\ de l'écran de chat) */
.duel-card .coup{ display:flex; flex-wrap:wrap; align-items:center; gap:0.6rem 1.1rem; padding:0.75rem 0.5rem 0.35rem; font-family:'Courier Prime', monospace; font-size:1.05rem; }
.duel-card .invite{ font-weight:700; min-width:2.6em; }
.duel-card .reglage{ display:flex; align-items:center; gap:0.35rem; color:var(--ink-soft); }
.duel-card .coup input{ width:3.3em; font:700 1.1rem 'Courier Prime', monospace; color:var(--ink); background:transparent; border:0; border-bottom:2px solid var(--line); padding:0.1rem 0.15rem; text-align:center; outline:none; }
.duel-card .coup input:focus{ border-bottom-color:currentColor; }
.duel-card .coup input::-webkit-inner-spin-button{ opacity:0.4; }
.duel-card .pas{ display:none; width:38px; height:36px; border-radius:3px; border:2px solid var(--objet); background:var(--surface); color:var(--objet);
  font:700 1.2rem/1 'Courier Prime', monospace; padding:0; cursor:pointer; touch-action:manipulation; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  box-shadow:2px 2px 0 var(--objet); transform:translate(0, 0); transition:transform .05s, box-shadow .05s; }
.duel-card .pas:active{ transform:translate(2px, 2px); box-shadow:0 0 0 var(--objet); }
.duel-card .pas:disabled{ color:var(--ink-faint); border-color:var(--line); box-shadow:2px 2px 0 var(--line); }
.duel-card .objets, .duel-card .persos{ display:flex; gap:0.25rem; align-items:center; }
.duel-card .persos{ padding-right:0.6rem; margin-right:0.2rem; border-right:1px solid var(--line); }
.duel-card .persos.gone{ visibility:hidden; }   /* la place reste : la carte ne change pas de hauteur */
.duel-card .objets button, .duel-card .persos button{ padding:0; border:0; border-radius:10px; cursor:pointer; background:transparent; display:grid; place-items:center; transition:background .15s, box-shadow .15s; }
.duel-card .objets button{ width:38px; height:38px; }
.duel-card .persos button{ width:44px; height:38px; }
@media (hover:hover){ .duel-card .objets button:hover, .duel-card .persos button:hover{ background:color-mix(in srgb, var(--accent) 10%, transparent); } }

.duel-card .objets canvas{ width:30px; height:30px; pointer-events:none; }

.duel-card .d-revoir{ order:1; margin-left:auto; font:700 0.85rem 'Courier Prime', monospace; color:var(--ink-soft); background:transparent; border:0; border-radius:8px; padding:0.4rem 0.6rem; cursor:pointer; }

@media (hover:hover){ .duel-card .d-revoir:hover{ background:color-mix(in srgb, var(--accent) 10%, transparent); } }
/* texte d'aide : un mince bandeau dans le bas de la ville (caché quand un autre bandeau est là) */
.duel-card .d-statut{ position:absolute; left:2px; right:2px; bottom:2px; padding:0.22rem 0.6rem; border-radius:0 0 16px 16px;
  background:color-mix(in srgb, var(--surface) 72%, transparent); color:var(--ink-soft); font:0.72rem/1.3 'Courier Prime', monospace; text-align:center; pointer-events:none; }
.duel-card .d-statut:empty, .duel-card .attente.on ~ .d-statut{ display:none; }
/* sous Lancer : le choix du faisan (avant le 1er coup), puis Revoir, à la même place : la carte ne change pas de hauteur */

.duel-card .d-sous > *{ grid-area:1 / 1; }

.duel-card .persos.gone, .duel-card .d-revoir.gone{ visibility:hidden; }
/* pied dans la carte, comme les listes : poignée à gauche, « … » et initiales à droite */

@media (pointer:coarse){

}
@container (max-width:560px){   /* carte étroite (une colonne de la grille, téléphone) : poste de commande compact */

  .duel-card .invite{ display:none; }                            /* l'invite « AP> » est déjà dans le jeu, en haut */

  .duel-card .d-lancer{ grid-column:1 / -1; grid-row:2; justify-self:stretch; margin-right:3px; white-space:nowrap; min-width:0; font-size:0.9rem; padding:0.25rem 0.8rem; min-height:0; box-shadow:2px 2px 0 var(--pc); }
  .duel-card .d-lancer:disabled{ box-shadow:2px 2px 0 var(--line); }
  .duel-card .d-sous{ grid-column:1 / -1; grid-row:3; min-height:30px; margin-top:-0.15rem; }
  .duel-card .persos{ flex-direction:row; border-right:0; padding-right:0; margin-right:0; gap:0.2rem; }
  .duel-card .persos button{ width:40px; height:32px; border-radius:8px; }

  .duel-card .reglage{ display:grid; grid-template-columns:auto auto auto; column-gap:0.2rem; row-gap:0; justify-items:center; }
  .duel-card .reglage > span:first-child{ grid-column:1 / -1; font-size:0.62rem; line-height:1; letter-spacing:0.05em; }

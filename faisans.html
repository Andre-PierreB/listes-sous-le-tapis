/* ---------- 10.57 : écran de chat (petit chat partagé) ----------
   Une liste de type "chat", posée dans la grille comme une liste, mais
   dessinée comme un écran creusé dans le fond (tôle percée : tranche
   arrondie --chat-rim, écran au fond à --chat-bev), Courier Prime, invite
   « AP> » ; moi à droite (--chat-me), les autres à gauche (--chat-them).
   Discret au repos (--chat-dim), net au survol et quand on écrit.
   Réglages choisis au banc d'essai le 5/11/2026. */
.chat-card{
  position:relative; min-width:0; border-radius:14px;
  display:flex; align-items:stretch; justify-content:center;   /* 10.59 : occupe la place d'une liste, un peu en retrait */
  --chat-rim:2px; --chat-bev:6px; --chat-d:0.42; --chat-pix:0.017; --chat-sh:0.14; --chat-dim:0.34;
  --chat-scr:color-mix(in srgb, var(--ink) 5%, var(--bg));
}
.chat-box{ width:calc(100% - 1.5rem); padding-top:calc(0.35rem + 22px);   /* autant d'air au-dessus que sous l'écran (marge + poignée) */ display:flex; flex-direction:column; opacity:calc(1 - var(--chat-dim)); transition:opacity .35s ease; }
.chat-card:hover .chat-box, .chat-card:focus-within .chat-box, .chat-card.chat-open .chat-box{ opacity:1; }
@media (max-width:720px){
  .chat-box{ width:100%; }   /* une colonne (téléphone) : la largeur d'une liste */
  .chat-card .chat-log{ flex:0 1 auto; max-height:calc(10 * 1.45em); }   /* 10.61 : seul sur sa rangée, il grandit avec les messages, jusqu'à 10 lignes */
}
/* 10.60 : message non lu (d'un autre, pas encore vu sur cet appareil) :
   l'écran sort de sa discrétion, le voyant s'allume ; ligne « nouveau » */
.chat-card.unread .chat-box{ opacity:1; }
.chat-log, .chat-in{ position:relative; z-index:1; }
/* voyant sur la tôle, en haut à droite de l'écran : éteint (petit creux gris),
   il s'allume en vert du faisan et luit doucement tant qu'un message n'est pas lu */
.chat-box{ position:relative; }
.chat-led{ position:absolute; top:calc((0.35rem + 22px) / 2 - 3.5px); right:13.5px; width:7px; height:7px; border-radius:50%;
  background:color-mix(in srgb, var(--ink) 18%, var(--bg)); box-shadow:inset 0 1px 1px rgba(0,0,0,0.25), 0 1px 0 var(--chat-lip); transition:background .4s ease, box-shadow .4s ease; }
.chat-card.unread .chat-led{ background:var(--logo-green); box-shadow:0 0 4px 1px color-mix(in srgb, var(--logo-green) 70%, transparent), 0 0 10px 2px color-mix(in srgb, var(--logo-green) 35%, transparent); animation:chat-led 2.4s ease-in-out infinite; }
@keyframes chat-led{ 50%{ box-shadow:0 0 2px 0 color-mix(in srgb, var(--logo-green) 50%, transparent); filter:brightness(0.85); } }
@media (prefers-reduced-motion:reduce){ .chat-card.unread .chat-led{ animation:none; } }
@media (max-width:720px){ .chat-led{ right:25.5px; } }   /* dans l'axe du trèfle (bandeau « Une petite en passant ? »), ordinateur et téléphone */
.chat-new{ text-align:center; font-size:0.72rem; letter-spacing:0.08em; color:var(--ink-faint); margin:0.25rem 0 0.15rem; white-space:nowrap; overflow:hidden; }
.chat-card.dragging-card{ outline:2px dashed color-mix(in srgb, var(--accent) 55%, transparent); outline-offset:-2px; }
.chat-card.dragging-card > *{ visibility:hidden; }
.chat-hole{ flex:1 1 auto; display:flex; flex-direction:column; padding:var(--chat-rim); border-radius:calc(16px + var(--chat-rim));
  background:linear-gradient(180deg, color-mix(in srgb, var(--ink) 16%, var(--bg)) 0%, color-mix(in srgb, var(--ink) 6%, var(--bg)) 35%, var(--bg) 60%, var(--chat-lip) 100%);
  box-shadow:0 -1px 0 rgba(42,39,37,0.06), 0 1px 1px var(--chat-lip); }
.chat-screen{
  position:relative; flex:1 1 auto; display:flex; flex-direction:column; border-radius:16px; padding:0.65rem 1rem 0.5rem;   /* fin : peu d'air dessus et dessous */
  background-color:var(--chat-scr);
  background-image:repeating-linear-gradient(0deg, rgba(40,50,40,var(--chat-pix)) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgba(40,50,40,var(--chat-pix)) 0 1px, transparent 1px 3px);
  box-shadow:
    inset 0 calc(var(--chat-bev) * 1.1) calc(var(--chat-bev) * 1.6) calc(var(--chat-bev) * -0.6) rgba(42,39,37,var(--chat-d)),
    inset 0 2px 3px rgba(42,39,37,0.18),
    inset calc(var(--chat-bev) * 0.9) 0 calc(var(--chat-bev) * 1.3) calc(var(--chat-bev) * -0.7) rgba(42,39,37,0.16),
    inset calc(var(--chat-bev) * -0.9) 0 calc(var(--chat-bev) * 1.3) calc(var(--chat-bev) * -0.7) rgba(42,39,37,0.10),
    inset 0 calc(var(--chat-bev) * -0.9) calc(var(--chat-bev) * 1.2) calc(var(--chat-bev) * -0.6) var(--chat-lip);
  font-family:'Courier Prime', 'Courier New', Courier, monospace; font-size:0.9rem; line-height:1.45;
  cursor:text;
}
.chat-log{ position:relative; flex:1 1 0; min-height:calc(3 * 1.45em); overflow-y:auto;   /* 10.59 : 3 lignes au moins, sinon la hauteur de la rangée (les listes voisines) ; le reste défile */ scrollbar-width:none; }
.chat-log::-webkit-scrollbar{ display:none; }
.chat-log{ display:flex; flex-direction:column; }
.chat-log > *{ flex-shrink:0; }   /* rien ne s'écrase quand ça déborde : ça défile */
.chat-log > :first-child{ margin-top:auto; }   /* peu de messages : posés en bas, contre la saisie */
.chat-empty{ color:var(--ink-faint); font-size:0.8rem; }
.chat-l, .chat-in{ text-shadow:1px 1px 0 rgba(30,40,30,var(--chat-sh)); }
.chat-l{ margin:0.12rem 0; overflow-wrap:anywhere; border-radius:3px; }
.chat-l.me{ text-align:right; padding-left:18%; color:var(--chat-me); }
.chat-l.them{ text-align:left; padding-right:18%; color:var(--chat-them); }
.chat-l.mine{ cursor:pointer; }
.chat-l.mine:hover{ background:color-mix(in srgb, var(--chat-me) 6%, transparent); }
.chat-l.editing{ display:flex; align-items:baseline; justify-content:flex-end; }
.chat-m{ font-size:0.7rem; color:var(--ink-faint); white-space:nowrap; }
.chat-pr{ font-weight:700; }
.chat-edit{ font:inherit; color:inherit; flex:1; min-width:0; background:color-mix(in srgb, currentColor 7%, transparent); border:0; border-radius:3px; padding:0 0.2rem; outline:none; text-align:inherit; }
.chat-in{ display:flex; justify-content:flex-end; align-items:flex-end; min-height:1.45em; border-top:1px dashed rgba(42,39,37,0.15); margin-top:0.35rem; padding-top:0.3rem; color:var(--chat-me); overflow-wrap:anywhere; }
.chat-in.fixing::before{ content:"corriger> "; font-size:0.75rem; color:var(--ink-faint); margin-right:0.3rem; white-space:nowrap; }
.chat-cur{ flex:none; display:inline-block; width:0.6em; height:1.15em; background:currentColor; margin-left:1px; opacity:0.35; }   /* au repos : fixe et pâle */
.chat-screen:focus-within .chat-cur{ opacity:1; animation:chat-blink 1.05s steps(1) infinite; }   /* on écrit : il clignote */
/* le gros curseur ne vaut qu'en bout de texte ; dès qu'on se place ailleurs
   ou qu'on sélectionne, c'est le curseur normal du champ qui prend le relais */
.chat-in.mid .chat-cur{ visibility:hidden; }
@keyframes chat-blink{ 50%{ opacity:0; } }
.chat-field{ flex:1 1 auto; min-width:0; appearance:none; border:0; background:none; padding:0; margin:0; outline:none;
  font:inherit; line-height:inherit; color:inherit; text-align:right; text-shadow:inherit; caret-color:transparent;
  resize:none; overflow:hidden; height:1.45em; display:block; }   /* un vrai champ : sélection, flèches, effacer ; s'agrandit avec le texte (fitChatField) */
.chat-in.mid .chat-field, .chat-in.multi .chat-field{ caret-color:currentColor; }
.chat-in.multi .chat-cur{ visibility:hidden; }   /* texte sur plusieurs lignes : curseur normal */
@media (pointer:coarse){ .chat-field{ font-size:16px; } }   /* pas de zoom sur iPhone */
/* sous l'écran, posés sur le fond : poignée des listes ; « … » et initiales */
.chat-foot{ display:flex; align-items:center; gap:0.4rem; margin-top:0.35rem; padding:0 0.2rem; position:relative; }
.chat-foot .cat-grip svg{ transform:rotate(90deg); }
.chat-more{ margin-left:auto; appearance:none; border:0; background:none; padding:1px 5px 4px; border-radius:6px; font:700 0.9rem/1 'Public Sans', sans-serif; letter-spacing:1px; color:var(--ink-faint); cursor:pointer; }
.chat-more:hover, .chat-more[aria-expanded="true"]{ background:var(--surface-2); color:var(--ink-soft); }
.chat-who{ font-family:'Courier Prime', 'Courier New', Courier, monospace; font-size:0.72rem; font-weight:700; letter-spacing:0.06em; color:var(--ink-faint); opacity:0.7; }
.chat-menu{ position:absolute; right:0; top:calc(100% + 4px); z-index:60; min-width:12rem; background:var(--surface); border-radius:10px; box-shadow:0 8px 24px rgba(40,50,60,.16); padding:0.3rem; font-size:0.85rem; }
.chat-menu[hidden]{ display:none; }
.chat-menu button{ display:flex; align-items:center; gap:0.55rem; width:100%; appearance:none; border:0; background:none; font:inherit; color:var(--ink); text-align:left; padding:0.4rem 0.55rem; border-radius:6px; cursor:pointer; }
.chat-menu button:hover{ background:var(--surface-2); }
.chat-menu .ic{ width:1rem; text-align:center; color:var(--ink-soft); font-weight:600; }
.chat-menu .danger, .chat-menu .danger .ic{ color:var(--late); }
.chat-menu-note{ font-size:0.78rem; color:var(--ink-faint); padding:0.35rem 0.55rem; }
/* partage (Inviter / Retirer) : la ligne « Partagée avec » des listes, sous l'écran */
.chat-share{ margin-top:0.5rem; background:var(--surface); border-radius:12px; box-shadow:var(--shadow); padding:0.7rem 0.8rem; display:flex; flex-direction:column; gap:0.5rem; }
.chat-share .cat-share{ margin:0; }

/* ---------- tâches ---------- */
ul.items{
  list-style:none;
  margin:0;
  padding:0;
  display:flex;
  flex-direction:column;
  gap:0.1rem;   /* 10.34 (10.33 : 0.05rem ; avant : 0.15rem) */
}
.item{
  display:flex;
  align-items:flex-start;
  gap:0.65rem;
  padding:var(--row-pad) 0.3rem;   /* 10.33 : avant 0.42rem */
  border-radius:8px;
  cursor:pointer;
}
.item:hover{background:var(--surface-2);}
/* 10.38 : petit espace avant les œufs (en couvaison) et avant les cochées */
ul.items > .item.group-start{ margin-top:0.6rem; }
/* une cochée qui vient de descendre apparaît en douceur à sa nouvelle place */
.item.just-settled{ animation:none; }   /* 10.53 : la ligne glisse à sa place (glideRows) au lieu d'apparaître en fondu */
@keyframes settle{ from{ opacity:0; } to{ opacity:1; } }
@media (prefers-reduced-motion:reduce){ .item.just-settled{ animation:none; } }
/* 10.38 : l'article qu'on vient d'ajouter à un mémo, surligné puis fondu */
.courses-item.just-added{ animation:just-added 3s ease-out both; }
@keyframes just-added{
  0%, 45%{ background:color-mix(in srgb, var(--cat-color, var(--accent)) 16%, transparent); }
  100%{ background:transparent; }
}
@media (prefers-reduced-motion:reduce){ .courses-item.just-added{ animation-duration:.01s; animation-delay:2.5s; } }
/* 10.33 : dans « En cours », le survol part du fond de la case (le règlage sombre plus bas reste) */
#waitingSection .item:not(.editing):hover{ background:color-mix(in srgb, var(--wait) 8%, transparent); }
/* dévoilés au survol de la souris ou au focus clavier ; au toucher, par la
   classe « revealed » (8.39, voir la section des écrans tactiles) */
@media (hover:hover){ .item:hover .item-controls{opacity:1;} }
.item:has(:focus-visible) .item-controls{opacity:1;}
.item .drag-handle{
  opacity:0; transition:opacity .15s ease;
  /* 10.43 : calée sur la 1re ligne, comme la case, l'œuf ou le rond des mémos
     (centre à 0.15rem + 9px) : ne descend plus au milieu d'une tâche sur
     plusieurs lignes */
  align-self:flex-start; align-items:flex-start; line-height:18px; padding-top:0.15rem;
}
.item:hover .drag-handle{ opacity:1; }
.item.dragging{opacity:0.4;}
.item-text{
  flex:1;
  font-family:var(--font-task);
  font-size:var(--task-size);
  line-height:1.4;
  color:var(--ink);
  cursor:text;
}
.item-text .note{
  display:block;
  font-size:calc(var(--task-size) * 0.905);
  color:var(--ink-soft);
  padding-top:0.15rem;
  line-height:1.4;
}
/* détail replié (8.31) : la rangée de la grille passe de 0 à la hauteur du
   texte, ce qui anime le dépliage sans connaître cette hauteur */
.note-fold{
  display:grid;
  grid-template-rows:0fr;
  transition:grid-template-rows .24s cubic-bezier(0.22, 1, 0.36, 1);
}
.note-fold > *{ overflow:hidden; min-height:0; }
.note-open .note-fold{ grid-template-rows:1fr; }
/* le sigle qui signale un détail, à côté du titre */
.note-toggle{
  appearance:none;
  -webkit-appearance:none;
  border:none;
  background:transparent;
  display:inline-flex;
  align-items:center;
  vertical-align:-2px;
  margin-left:0.35rem;
  padding:3px;
  border-radius:50%;
  /* 10.43 : jaune du trèfle, foncé pour se lire, et plus grand ; 10.45 :
     toujours dans sa pastille ronde (avant : seulement au survol ou ouvert,
     d'où des fonds inégaux dans une même liste), un peu plus soutenue */
  color:color-mix(in srgb, var(--lucky-lemon) 55%, var(--ink));
  background:color-mix(in srgb, var(--lucky-lemon) 22%, var(--surface));
  cursor:pointer;
  transition:color .15s ease, background .15s ease;
}
.note-toggle svg{ display:block; }
.note-tail{ white-space:nowrap; } /* dernier mot + sigle (8.39) */
.item[data-note-key], .note-toggle{ -webkit-tap-highlight-color:transparent; }
.note-toggle:hover{ color:color-mix(in srgb, var(--lucky-lemon) 40%, var(--ink)); background:color-mix(in srgb, var(--lucky-lemon) 38%, var(--surface)); }   /* ouverte ou non, même pastille : seul le survol la fonce */
.item.is-checked .note-toggle{ opacity:0.6; }
.item input[type="checkbox"]{
  appearance:none;
  -webkit-appearance:none;
  width:18px;
  height:18px;
  flex:none;
  margin-top:0.15rem;
  border:1.5px solid var(--ink-faint);
  border-radius:5px;
  cursor:pointer;
  position:relative;
  background:var(--surface);
  transition:background .15s ease, border-color .15s ease, scale .3s var(--pop-ease);
}
/* 10.33 : la coche se montre au survol (case bleue + ✓, même petit zoom que
   les boutons à icône) ; une fois cochée, la case reste grise pour faire
   moins de bruit (avant : bleue --accent). */
.item input[type="checkbox"]::after{
  content:"";
  position:absolute;
  left:5px; top:1.5px;
  width:5px; height:9px;
  border:solid white;
  border-width:0 2px 2px 0;
  transform:rotate(40deg);
  opacity:0;
  transition:opacity .15s ease;
}
.item input[type="checkbox"]:checked{
  background:var(--ink-faint);
  border-color:var(--ink-faint);
}
/* 10.38 : tant qu'elle n'est pas descendue, la case cochée reste bleu-vert */
.item.lingering input[type="checkbox"]:checked{ background:var(--accent); border-color:var(--accent); }
.item input[type="checkbox"]:checked::after{ opacity:1; }
@media (hover:hover){
  .item input[type="checkbox"]:hover{ scale:var(--pop-scale); }
  .item input[type="checkbox"]:not(:checked):hover{ background:var(--accent); border-color:var(--accent); }
  .item input[type="checkbox"]:not(:checked):hover::after{ opacity:1; }
}
@media (prefers-reduced-motion:reduce){
  .item input[type="checkbox"]{ transition:background .15s ease, border-color .15s ease; }
  .item input[type="checkbox"]:hover{ scale:none; }
}
.item.is-checked .item-text{
  color:var(--ink-faint);
  text-decoration:line-through;
  text-decoration-color:var(--ink-faint);
  text-decoration-thickness:1px;
}
/* .who-tag et .person-tag sont en inline-block (badges à fond coloré) : un
   inline-block n'hérite jamais du trait barré de son parent (spec CSS), donc
   sans cette règle explicite la tâche a l'air "pas tout à fait finie" une
   fois cochée. On barre le badge lui-même, avec sa propre couleur. */
.item.is-checked .item-text .who-tag,
.item.is-checked .item-text .person-tag{
  text-decoration:line-through;
  text-decoration-color:currentColor;
  text-decoration-thickness:1px;
}
/* Petite animation de "coup de crayon" au moment où on coche une tâche :
   le trait se dessine de gauche à droite au lieu d'apparaître d'un coup.
   Ne joue qu'une fois, sur l'élément qui vient d'être coché (voir
   justCheckedKey en JS) — les autres re-rendus retombent sur le simple
   text-decoration ci-dessus. */
.item.just-checked.is-checked .item-text .item-title,
.item.just-checked.is-checked .item-text .who-tag,
.item.just-checked.is-checked .item-text .person-tag{
  text-decoration:none;
  background-image:linear-gradient(currentColor, currentColor);
  background-repeat:no-repeat;
  background-position:left center;
  background-size:0% 2px;
  animation:item-strike 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
.item.just-checked.is-checked .item-text .who-tag,
.item.just-checked.is-checked .item-text .person-tag{
  animation-delay:0.12s;
}
.item.just-checked.is-checked .item-text{
  animation:item-fade-in 0.4s ease forwards;
}
/* tâche urgente (marquée, ou échéance proche) */
.item.item-urgent .item-text{
  color:var(--urgent-ink);
  font-weight:600;
}
.item.item-urgent .item-text .note{ font-weight:400; }
.item.item-urgent.is-checked .item-text{
  color:var(--ink-faint);
  font-weight:400;
  text-decoration:line-through;
}
/* boutons d'une ligne : en cours, urgent, effacer */
.item-controls{
  display:flex;
  flex-direction:row;
  align-items:center;
  gap:2px;
  flex:none;
  opacity:0;               /* au repos : rien ; elles apparaissent au survol de la ligne (8.12) */
  transition:opacity .15s ease;
}
/* 10.37 : petites icônes de ligne en surimpression : plus de place réservée
   à droite, le texte prend toute la largeur ; au survol (ou au toucher), les
   icônes se posent sur un fondu de la couleur de survol, en bout de ligne. */
.item .item-controls{
  position:absolute; right:0.3rem; z-index:2;
  top:calc(var(--row-pad) - 0.1rem);
  padding-left:1.4rem;
  background:linear-gradient(90deg, transparent, var(--ctl-bg, var(--surface-2)) 1.2rem);
}
#waitingSection .item .item-controls{ --ctl-bg:color-mix(in srgb, var(--wait) 8%, var(--wait-soft)); }
.courses-item .item-controls{ --ctl-bg:color-mix(in srgb, var(--paper-rule) 30%, var(--surface)); top:auto; bottom:0.15rem; }
.waiting-btn{
  appearance:none;
  border:none;
  background:transparent;
  color:var(--ink-faint);
  font-size:0.95rem;
  line-height:1;
  padding:4px 6px;
  cursor:pointer;
  border-radius:4px;
}
.waiting-btn:hover{   /* 10.31 : aux couleurs de la case « En cours » (avant : bleu --accent) */
  background:var(--wait-soft);
  color:color-mix(in srgb, var(--wait) 75%, var(--ink));
}
#waitingSection .waiting-btn:hover{ background:color-mix(in srgb, var(--wait) 18%, var(--wait-soft)); }   /* sinon invisible sur le fond de la case */
.waiting-btn.active{
  color:var(--accent-strong);
}
.waiting-btn svg{ display:block; }
.urgent-btn, .delete-btn{
  appearance:none;
  border:none;
  background:transparent;
  color:var(--ink-faint);
  font-size:0.86rem;
  line-height:1;
  padding:4px 6px;
  cursor:pointer;
  border-radius:4px;
}
.delete-btn{ font-size:0.95rem; }
/* 10.2 : à la place de l'effacement, dans une liste partagée (tâche d'un autre) */
.delete-spacer{ display:block; flex:none; width:26px; height:1px; }
.urgent-btn svg, .delete-btn svg{ display:block; }
/* 10.32 : le survol montre ce que le clic va faire, dans le mauve de l'urgence.
   Pas urgente → « mettre urgent » : le triangle s'allume en mauve et grossit.
   Déjà urgente → « retirer d'urgent » : il s'éteint (gris, vide) et rapetisse. */
.urgent-btn:not(.active):hover{
  background:var(--urgent-soft);
  color:var(--urgent-ink);
}
.urgent-btn:not(.active):hover svg .tri{ fill:color-mix(in srgb, var(--urgent-ink) 22%, transparent); }
.urgent-btn.active:not(.auto):hover{
  background:var(--surface-2);
  color:var(--ink-faint);
}
.urgent-btn.active:not(.auto):hover svg .tri{ fill:none; }
/* 10.32 : UN SEUL petit zoom au survol pour tous les boutons à icône de
   l'appli. Propriété « scale » (et non transform) : elle s'ajoute aux
   rotations déjà posées (tri ▲▼, repli de carte) sans les écraser. Le fond
   du bouton ne grossit pas, seulement le signe (svg, ou <span class="g"> /
   <span class="x"> pour les signes en texte). */
:root{ --pop-scale:1.18; --pop-ease:cubic-bezier(.34,1.4,.64,1); }
.urgent-btn svg, .waiting-btn svg, .delete-btn svg, .delete-btn .x,
.add-btn .g, .cat-delete-btn .g, .note-toggle svg, .courses-edit-btn svg,
.cat-order svg, .cat-grip svg, .cat-fold svg, .lucky-reroll svg, .hatch-btn svg{
  transition:scale .3s var(--pop-ease), transform .25s ease;
}
.delete-btn .x, .add-btn .g, .cat-delete-btn .g{ display:inline-block; }
.urgent-btn:hover svg, .waiting-btn:hover svg, .delete-btn:hover svg, .delete-btn:hover .x,
.add-btn:hover .g, .cat-delete-btn:hover .g, .note-toggle:hover svg, .courses-edit-btn:hover svg,
.cat-order:hover svg, .cat-grip:hover svg, .cat-fold:hover svg, .lucky-reroll:hover svg, .hatch-btn:hover svg{
  scale:var(--pop-scale);
}
.urgent-btn.active:not(.auto):hover svg{ scale:0.85; }   /* retirer : il rapetisse */
.urgent-btn.auto:hover svg{ scale:none; }   /* triangle inerte de la case urgente */
@media (prefers-reduced-motion:reduce){
  .urgent-btn svg, .waiting-btn svg, .delete-btn svg, .delete-btn .x, .add-btn .g, .cat-delete-btn .g, .note-toggle svg, .courses-edit-btn svg, .cat-order svg, .cat-grip svg, .cat-fold svg, .lucky-reroll svg, .hatch-btn svg{ transition:none; }
  .urgent-btn:hover svg, .waiting-btn:hover svg, .delete-btn:hover svg, .delete-btn:hover .x, .add-btn:hover .g, .cat-delete-btn:hover .g, .note-toggle:hover svg, .courses-edit-btn:hover svg, .cat-order:hover svg, .cat-grip:hover svg, .cat-fold:hover svg, .lucky-reroll:hover svg, .hatch-btn:hover svg{ scale:none; }
}
.delete-btn:hover{   /* 10.31 : le bleu qu'avait la flèche « En cours » (avant : améthyste) */
  background:var(--accent-soft);
  color:var(--accent-strong);
}
.urgent-btn.active{
  background:var(--urgent-soft);
  color:var(--urgent-ink);
  font-weight:700;
}
.urgent-btn.active svg .tri{ fill:color-mix(in srgb, currentColor 20%, transparent); }
/* Une tâche cochée est faite : plus de sens à la marquer urgente ni « en cours ». Les boutons
   sont masqués mais gardent leur place, pour que les icônes ne bougent pas. */
.item.is-checked .urgent-btn,
.item.is-checked .waiting-btn{ visibility:hidden; pointer-events:none; }
.drag-handle{
  flex:none;
  align-self:stretch;
  display:flex;
  align-items:center;
  color:var(--ink-faint);
  font-size:0.86rem;
  letter-spacing:-2px;
  cursor:grab;
  padding:0 6px 0 2px;
  touch-action:none;
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
}
.drag-handle:active{cursor:grabbing;}
/* œuf « en couvaison » : grisé, pas de case à cocher, juste l'éclosion */
.item.is-egg .item-text{ opacity:0.45; }
.item.is-egg:hover .item-text{ opacity:0.7; }
.item.is-egg .waiting-btn{ visibility:hidden; pointer-events:none; }
.egg-dot{
  width:18px;
  height:18px;
  flex:none;
  margin:0.15rem 3px 0 4px; /* mêmes marges que la case à cocher, pour l'alignement */
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--ink-faint);
  opacity:0.8;
}
.egg-dot svg{ display:block; flex:none; }
/* 10.15 : article d'une liste de courses — rond creux à la place de la case ;
   toute la ligne raye / dé-raye. 10.16 : 14 px au lieu de 18 ; 10.17 : 11 px,
   toujours centré dans la place de la case (18 px) pour que le texte reste
   aligné */
.strike-dot{
  appearance:none;
  -webkit-appearance:none;
  width:11px;
  height:11px;
  flex:none;
  margin:calc(0.15rem + 3.5px) 6.5px 3.5px 7.5px; /* 10.18 : de l'air après la marge ; 10.36 : 7.5px (avant 11.5px) : rond et texte alignés sur les cases et le texte des listes */
  padding:0;
  border:1.5px solid var(--ink-faint);
  border-radius:50%;
  background:var(--surface);
  cursor:pointer;
  transition:border-color .15s ease;
}
.strike-dot:hover{ border-color:var(--cat-color, var(--accent)); }
.strike-dot:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.item.is-checked .strike-dot{ border-color:var(--line); }
/* 10.17 : chaque article posé sur une ligne de cahier */
.courses-item{ border-radius:0; border-bottom:1px solid var(--paper-rule); padding:calc(2 * var(--row-pad) + 0.15rem + 20px - 1.4 * var(--memo-size)) 0.3rem 0; } /* 10.18 : texte posé sur sa ligne (air au-dessus) ; 10.38 : même hauteur de ligne que les tâches, où c'est la case à cocher qui la donne (18px + 0.15rem + 3px) : 2 × row-pad + case − texte − filet 1px */
.courses-item:hover{ background:color-mix(in srgb, var(--paper-rule) 30%, transparent); } /* voile léger : la marge rouge reste visible */
.courses-item .item-text{ font-family:var(--font-memo); font-size:var(--memo-size); color:var(--ink); cursor:default; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
/* quantité : après le nom (en ligne, pour être barrée avec lui) ; 10.17 : à
   l'encre rose (le rouge reste aux urgences), bien visible, plus de badge gris */
.courses-qty{
  margin-left:0.45rem;
  font-size:0.86rem; font-weight:700; color:var(--qty-ink);
  white-space:nowrap;
}
.item.is-checked .courses-qty{ color:var(--ink-faint); }
.courses-edit-btn{
  appearance:none; border:none; background:transparent; color:var(--ink-faint);
  line-height:1; padding:4px 6px; cursor:pointer; border-radius:4px;
}
.courses-edit-btn svg{ display:block; }
.courses-edit-btn:hover{ background:var(--surface-2); color:var(--ink-soft); }
/* modifier un article : nom, puis quantité avec − / + */
.courses-item.editing{ align-items:center; }
.courses-item.editing .drag-handle, .courses-item.editing .strike-dot{ visibility:hidden; }
.courses-edit{ flex:1; min-width:0; display:flex; flex-wrap:wrap; align-items:center; gap:0.4rem; } /* 10.19 : le détail passe dessous */
.courses-edit input{
  font-family:var(--font-memo); font-size:0.95rem; line-height:1.4; color:var(--ink);
  background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
  padding:0.3rem 0.5rem; min-width:0;
}
.courses-edit input:focus{ outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent); }
.courses-edit-name{ flex:1 1 0; width:0; } /* largeur prise sur la ligne, jamais au-delà (téléphone) */
.courses-qty-edit{ flex:none; display:flex; align-items:center; gap:2px; }
.courses-edit .courses-edit-qty{ width:3.4rem; text-align:center; padding-left:0.25rem; padding-right:0.25rem; }
.courses-edit .courses-edit-note{ flex:1 0 100%; font-size:0.86rem; } /* 10.19 : détail, comme dans les autres listes */
.qty-step{
  appearance:none; flex:none; width:26px; height:26px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
  border-radius:6px; font-size:0.95rem; line-height:1; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center;
}
.qty-step:hover{ background:var(--accent-soft); color:var(--accent-strong); border-color:var(--accent); }
/* saisie en haut (alignée sur les articles), Vider les rayés en bas (10.38) */
.courses-entry{ flex:none; padding-top:0.55rem; }   /* 10.38 : la saisie sur la ligne de la 1re tâche des cartes voisines */
.courses-entry + ul.items{ margin-top:-0.7rem; }   /* 10.38 : le 1er article, une ligne sous la saisie */
.courses-foot{ flex:none; display:flex; flex-direction:column; }
.courses-add{ display:flex; align-items:flex-start; gap:0.65rem; padding:0 0.3rem; }
.courses-add .drag-handle{ visibility:hidden; }
.courses-plus{
  width:18px; height:18px; flex:none;
  margin:0.15rem 3px 0 4px; /* centré sur le rond des articles (10.38 : 4px, suit le rond recalé en 10.36) */
  display:flex; align-items:center; justify-content:center;
  color:var(--ink-faint); font-size:1.05rem; line-height:1;
}
.courses-field{ position:relative; flex:1; min-width:0; display:flex; }
.courses-input{
  flex:1; width:100%; margin:0;
  resize:none; overflow:hidden;
  font-family:var(--font-memo); font-size:var(--memo-size); line-height:1.4; color:var(--ink);
  background:transparent;
  border:none; border-bottom:1px dashed var(--line); border-radius:0;
  padding:0 0.1rem 0.15rem 0;   /* 10.38 : texte aligné sur celui des articles */
  transition:border-color .15s ease;
}
.courses-input::placeholder{ color:var(--ink-faint); opacity:.8; }
.courses-input:focus{ outline:none; border-bottom:1px solid var(--cat-color, var(--accent)); }
.courses-suggest{
  position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:30;
  display:flex; flex-direction:column;
  padding:4px;
  background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow);
}
.courses-suggest[hidden]{ display:none; }
.courses-sugg{
  appearance:none; border:0; background:transparent;
  display:flex; align-items:baseline; justify-content:space-between; gap:0.5rem;
  text-align:left; font:inherit; font-size:0.92rem; color:var(--ink);
  padding:0.4rem 0.55rem; border-radius:7px; cursor:pointer;
}
.courses-sugg:hover, .courses-sugg.active{ background:var(--surface-2); }
.courses-sugg-note{
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.62rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-faint);
}
.courses-actions{ display:flex; flex-wrap:wrap; gap:0.4rem; margin-top:0.55rem; padding:0 2rem 0 4.37rem; } /* à droite : la flèche du volet ; à gauche (10.17) : sous le texte des articles */
.courses-btn{
  appearance:none;
  border:1px solid var(--line);
  background:var(--surface-2);
  color:var(--ink-soft);
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.68rem;
  font-weight:700;
  letter-spacing:0.06em;
  text-transform:uppercase;
  min-height:26px;
  padding:0.25rem 0.75rem;
  border-radius:999px;
  cursor:pointer;
  transition:background .12s ease, border-color .12s ease, color .12s ease, opacity .12s ease;
}
.courses-btn:not(:disabled):hover{ color:var(--accent-strong); border-color:var(--accent); background:var(--accent-soft); }
.courses-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
.courses-btn:disabled{ opacity:.45; cursor:default; }
.hatch-btn{
  appearance:none;
  border:none;
  background:transparent;
  color:var(--ink-faint);
  line-height:1;
  padding:2px 4px;
  cursor:pointer;
  border-radius:4px;
  transition:background .12s ease, color .12s ease;
}
.hatch-btn svg{ display:block; }
.hatch-btn:hover{ background:var(--surface-2); color:#8A7A4E; }
.hatch-btn:hover .chick{ fill:#F4D35E; stroke:#B8901F; }
.hatch-btn:hover .beak{ stroke:#D9822B; }
.hatch-btn:hover .shell{ fill:var(--eggshell); }
/* 10.2 : initiale de qui a coché, dans une liste partagée */
.checker-tag{
  display:inline-flex; align-items:center; justify-content:center;
  width:1.2rem; height:1.2rem; margin-right:0.45rem; vertical-align:middle;
  border-radius:50%;
  background:color-mix(in srgb, var(--cat-color, var(--accent)) 18%, var(--surface));
  color:color-mix(in srgb, var(--cat-color, var(--accent)) 70%, var(--ink));
  font-size:0.66rem; font-weight:700; line-height:1;
  text-decoration:none;
}
/* badges : interlocuteur, personne (anciennes données), échéance */
.who-tag{
  display:inline-block;
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.7rem;
  font-weight:600;
  letter-spacing:0.04em;
  text-transform:uppercase;
  color:var(--ink-soft);
  background:var(--surface-2);
  border:1px solid var(--line);
  padding:0.1rem 0.45rem;
  border-radius:999px;
  margin-right:0.5rem;
  vertical-align:middle;
}
.person-tag{
  display:inline-block;
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.7rem;
  font-weight:600;
  letter-spacing:0.04em;
  text-transform:uppercase;
  color:var(--accent-strong);
  background:var(--accent-soft);
  padding:0.1rem 0.45rem;
  border-radius:999px;
  margin-right:0.45rem;
  vertical-align:middle;
}
.person-tag.tier-urgent{color:var(--urgent-ink); background:var(--urgent-soft);}
.person-tag.tier-normal{color:var(--accent-strong); background:var(--accent-soft);}
.person-tag.tier-later{color:var(--ink-faint); background:var(--surface-2);}
.due-badge{
  display:inline-block;
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.7rem;
  font-weight:600;
  letter-spacing:0.02em;
  padding:0.05rem 0.42rem;
  border-radius:999px;
  margin-left:0.45rem;
  vertical-align:middle;
  white-space:nowrap;
}
.due-badge.status-overdue, .due-badge.status-today{

}
.due-badge.status-overdue{ background:var(--late-soft); color:var(--late); }   /* 10.25 : le retard en terre cuite */

.due-badge.status-tomorrow,

.empty-note{

/* ---------- formulaires (modifier, ajouter, nouvelle liste) ---------- */
.edit-form{

  width:100%;
  padding:0.3rem 0.2rem;
}
.edit-form input[type="text"], .edit-form textarea{

  padding:0.45rem 0.6rem;
  border:1px solid var(--line);
  border-radius:8px;

.edit-form select.edit-cat{
  font-family:inherit;
  font-size:0.95rem;
  padding:0.45rem 0.6rem;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--surface-2);
  color:var(--ink);
  width:100%;
}
/* champs : bleu au survol, bleu qui reste une fois cliqué (7.26) */
.edit-form input, .edit-form select, .edit-form textarea{ transition:border-color .15s ease, opacity .15s ease; }
.edit-form input:not(:disabled):hover, .edit-form select:hover, .edit-form textarea:hover{ border-color:var(--accent); }
.edit-form input:focus, .edit-form input[type="text"]:focus, .edit-form select:focus, .edit-form textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent); }
.edit-form input:disabled{ opacity:.4; cursor:not-allowed; }
.edit-label{
  display:flex;
  flex-direction:column;
  gap:0.25rem;
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.7rem;
  font-weight:600;
  letter-spacing:0.05em;
  text-transform:uppercase;

}
.edit-label:has(input:disabled){ color:var(--ink-faint); }
.edit-label-row{
  display:flex;
  gap:0.5rem;
}
.edit-label-row .edit-label{flex:1;}
.edit-label-row .edit-label-cat{flex:1.4;}
.edit-label-row .edit-label-who{flex:1;}
.edit-label input[type="date"],
.edit-label input[type="time"]{
  font-family:'Public Sans', system-ui, sans-serif;
  text-transform:none;

  font-size:0.86rem;
  padding:0.4rem 0.55rem;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--surface-2);
  color:var(--ink);
}
.edit-clear-due{
  align-self:flex-end;
  flex:none;
  appearance:none;
  border:1px solid var(--line);
  background:var(--surface-2);
  color:var(--ink-faint);
  width:2.15rem;
  height:2.15rem;
  border-radius:8px;
  font-size:0.95rem;
  line-height:1;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.edit-clear-due:hover{
  background:var(--urgent-soft);
  color:var(--urgent-ink);
  border-color:var(--urgent);
}
.cat-edit-actions{ margin:0.5rem 0 0.2rem; justify-content:flex-end; }   /* 10.53 : bas de la modification d'une liste */
.courses-edit .edit-actions{ flex-basis:100%; margin-top:0.1rem; }
.edit-actions{
  display:flex;
  gap:0.5rem;
}
.edit-actions button{
  font-size:0.86rem;
  font-weight:600;
  padding:0.4rem 0.8rem;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink-soft);
  cursor:pointer;
}
.edit-actions .edit-save,
.edit-actions .add-save,
.edit-actions .edit-cancel,
.edit-actions .add-cancel{ transition:background .12s ease, border-color .12s ease, color .12s ease; }
.edit-actions .edit-save:hover,
.edit-actions .add-save:hover{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}
.edit-actions .edit-cancel:hover,
.edit-actions .add-cancel:hover{
  background:var(--surface-2);
  border-color:var(--ink-faint);
  color:var(--ink);
}
/* œuf et triangle à gauche ; Annuler puis le bouton qui valide, à droite (8.33) */
.edit-actions .edit-egg,
.edit-actions .edit-urgent{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0.35rem 0.5rem;
  border-color:transparent;
  background:transparent;
  color:var(--ink-faint);
  transition:color .12s ease, background .12s ease;
}
.edit-actions .edit-cancel,
.edit-actions .add-cancel{ margin-left:auto; }
.edit-actions .edit-egg::after,
.edit-actions .edit-urgent::after{ right:auto; left:0; } /* infobulle vers la droite */
.edit-actions .edit-egg .speck{ opacity:0.7; transition:opacity .12s ease; }
.edit-actions .edit-egg:hover,
.edit-actions .edit-urgent:hover{ background:var(--surface-2); color:var(--ink-soft); }
.edit-actions .edit-egg.active{ background:var(--eggshell); color:#8A7A4E; }
.edit-actions .edit-egg.active .egg{ fill:color-mix(in srgb, #E9DDB5 70%, transparent); }
.edit-actions .edit-egg.active .speck{ opacity:1; }
.edit-actions .edit-egg.active:hover{ background:color-mix(in srgb, #E9DDB5 45%, var(--surface)); }
.edit-actions .edit-urgent.active{
  background:var(--urgent-soft);
  color:var(--urgent-ink);
}
.edit-actions .edit-urgent.active:hover{ background:color-mix(in srgb, var(--urgent) 22%, var(--surface)); color:var(--urgent-ink); }
.edit-actions .edit-urgent.active svg .tri{ fill:color-mix(in srgb, currentColor 20%, transparent); }
.item.editing{cursor:default;}
.item.editing:hover{background:transparent;}
.add-form-row{cursor:default;}
.add-form-row:hover{background:transparent;}
/* un formulaire ouvert : tout le reste s'estompe */
.progress-card, .urgent-banner, .lucky-line, .category, .section-block, footer, .add-category-row{
  transition:opacity .2s ease, filter .2s ease;
}
body.has-editing .progress-card,
body.has-editing .urgent-banner,
body.has-editing .lucky-line,
body.has-editing .category,
body.has-editing .section-block,
body.has-editing footer,
body.has-editing .add-category-row{
  opacity:0.32;
  filter:grayscale(0.7);
  pointer-events:none;
}
body.has-editing .category:has(.item.editing),
body.has-editing .section-block:has(.item.editing),
body.has-editing .category:has(.add-form-row),
body.has-editing .category:has(.cat-title-input),
body.has-editing .add-category-row.active{
  opacity:1;
  filter:none;
  pointer-events:auto;
}
body.has-editing .category:has(.item.editing) ul.items > li.item:not(.editing),
body.has-editing .category:has(.add-form-row) ul.items > li.item:not(.add-form-row),
body.has-editing .section-block:has(.item.editing) ul.items > li.item:not(.editing),
body.has-editing .category:has(.cat-title-input) > *:not(.cat-head):not(.cat-swatches):not(.cat-share):not(.cat-convert):not(.cat-edit-actions),   /* 10.21 : « Convertir » reste cliquable */
body.has-editing .category:has(.cat-title-input) .cat-head .add-btn,
body.has-editing .category:has(.cat-title-input) .cat-head-right{
  opacity:0.32;
  filter:grayscale(0.7);
  pointer-events:none;
  transition:opacity .2s ease, filter .2s ease;
}

/* ---------- « En cours » et autres grandes cases ---------- */
.section-block{
  margin-top:2.25rem;
  background:var(--wait-soft);
  border-radius:16px;
  padding:1.4rem 1.5rem 1.6rem;
  box-shadow:var(--shadow);
}
.section-title{
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.74rem;
  font-weight:600;
  letter-spacing:0.09em;
  text-transform:uppercase;
  color:var(--ink-soft);   /* 10.51 : retour à --ink-soft (mauve en 10.48-10.50) */
  margin:0 0 1.1rem;
}
#waitingSection .section-title span{ white-space:nowrap; }   /* 10.50 : trop étroit, coupé après le tiret */
#waitingList .empty-note{ color:color-mix(in srgb, var(--ink-faint) 72%, var(--wait-soft)); }
/* choix de la relance (7.3) */
.relance-pop{
  position:absolute; z-index:80; width:min(270px, calc(100vw - 32px));
  background:var(--wait-soft); border:0; border-radius:12px;   /* 10.47 : plus de liseré autour (avant : bord --wait) */
  box-shadow:0 2px 6px rgba(30,40,45,0.06), 0 18px 36px -14px rgba(30,40,45,0.35);
  padding:0.7rem 0.75rem 0.75rem; font-family:'Public Sans', system-ui, sans-serif;
  animation:rp-in .14s ease;
}
.rp-title{ font-family:'Courier Prime', 'Courier New', Courier, monospace; font-size:0.7rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:color-mix(in srgb, var(--wait) 65%, var(--ink)); margin:0 0 0.55rem; }
.rp-opts{ display:flex; flex-wrap:wrap; gap:0.35rem; }
.rp-opts button{
  appearance:none; border:1px solid color-mix(in srgb, var(--wait) 30%, var(--line)); background:var(--surface); color:var(--ink);
  font-family:inherit; font-size:0.86rem; padding:0.3rem 0.65rem; border-radius:999px; cursor:pointer;
  transition:background .12s ease, border-color .12s ease, color .12s ease;
}
.rp-opts button:hover{ background:var(--wait); border-color:var(--wait); color:var(--surface); }
.rp-opts .rp-none{ color:var(--ink-soft); }
.rp-skip{
  display:block; width:100%; margin:0 0 0.7rem;
  appearance:none; border:1px solid color-mix(in srgb, var(--wait) 30%, var(--line)); background:var(--surface); color:var(--ink);
  font-family:inherit; font-size:0.86rem; font-weight:600; padding:0.4rem 0.65rem; border-radius:999px; cursor:pointer;
  transition:background .12s ease, border-color .12s ease, color .12s ease;
}
.rp-skip:hover{ background:var(--wait); border-color:var(--wait); color:var(--surface); }
/* 10.46 : rappel de relance — titre, « Aucune relance » en premier choix
   (bouton plein, sobre), puis une rangée de petits boutons abrégés et un
   calendrier en pictogramme, tous de même hauteur */
/* 10.52 : dans le code de la fenêtre de la plume : fenêtre blanche, boutons
   comme « Continuer avec Google » (accent 12 %, texte --phrase), titre centré
   comme « Retrouver ses listes partout » mais en gris ; survol comme la case à cocher d'une
   tâche : plein --accent, écriture blanche comme sa coche */
.relance-ask{
  width:auto; max-width:calc(100vw - 32px); padding:0.7rem 0.7rem 0.7rem;
  background:var(--surface);
  --rp-ink:var(--phrase);
  --rp-btn:color-mix(in srgb, var(--accent) 12%, transparent);
  --rp-btn-hover:var(--accent);
  --rp-ink-hover:#fff;
}

.relance-ask .rp-title{ font-size:0.62rem; margin:0.25rem 0.15rem 0.55rem; color:var(--ink-soft); text-align:center; }   /* gris de « Mot de passe oublié ? » */
/* tous les boutons pareils : fond légèrement teinté, sans bordure, même
   graisse ; « Aucune relance » sur toute la largeur, un rien plus haut */
.relance-ask .rp-skip{
  margin:0 0 0.25rem; border:0; border-radius:5px; height:1.6rem; padding:0 0.6rem;
  font-size:0.76rem; font-weight:400; text-align:center;
  background:var(--rp-btn); color:var(--rp-ink);
}
.rp-chips{ display:grid; grid-auto-columns:1fr; grid-auto-flow:column; gap:0.25rem; }   /* même largeur pour tous */
.rp-chip{
  appearance:none; display:inline-flex; align-items:center; justify-content:center; min-width:0;
  height:1.4rem; padding:0 0.3rem; border-radius:5px; cursor:pointer;
  border:0; background:var(--rp-btn); color:var(--rp-ink);
  font-family:inherit; font-size:0.72rem; white-space:nowrap; font-variant-numeric:tabular-nums;
  transition:background .12s ease, border-color .12s ease, color .12s ease;
}
.rp-chip:hover, .rp-chip:focus-visible, .rp-custom:focus-within,
.relance-ask .rp-skip:hover, .relance-ask .rp-skip:focus-visible{ outline:none; background:var(--rp-btn-hover); color:var(--rp-ink-hover); }
.rp-custom{ position:relative; }
.rp-custom svg{ width:12px; height:12px; }
/* le vrai champ, invisible, couvre la ligne : calendrier du système au clic
   (16px : pas de zoom automatique sur iPhone) */
.rp-custom input{ position:absolute; inset:0; width:100%; height:100%; opacity:0; font-size:16px; border:0; padding:0; margin:0; cursor:pointer; }
/* 10.1 : fenêtre de la plume (connexion), même forme, aux couleurs de l'accent */
/* 10.47 : boutons dans la forme des petites fenêtres (relance) : fond teinté
   d'accent, sans bordure, coins doux, texte --phrase ; survol un cran plus soutenu */
.sync-pop{ width:min(290px, calc(100vw - 32px)); background:var(--surface); }
.sync-pop .rp-title{ color:var(--accent); font-size:0.62rem; margin-top:0.2rem; }
.sp-google, .sync-pop .rp-opts button{
  display:flex; align-items:center; justify-content:center; width:100%; appearance:none; cursor:pointer;
  font-family:inherit; font-size:0.8rem; font-weight:400; height:1.75rem; padding:0 0.6rem;
  border-radius:6px; border:0; background:color-mix(in srgb, var(--accent) 12%, transparent); color:var(--phrase);
  transition:background .12s ease;
}
.sp-google:hover, .sp-google:focus-visible, .sync-pop .rp-opts button:hover, .sync-pop .rp-opts button:focus-visible{
  outline:none; background:color-mix(in srgb, var(--accent) 22%, transparent); color:var(--phrase);
}
.sp-or{ text-align:center; font-family:'Courier Prime', 'Courier New', Courier, monospace; font-size:0.7rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-faint); margin:0.5rem 0; }
.sp-email, .sp-pw{
  display:block; width:100%; margin:0 0 0.4rem; font-family:inherit; font-size:0.82rem; padding:0.32rem 0.55rem;
  border:1px solid color-mix(in srgb, var(--accent) 22%, var(--line)); border-radius:6px; background:var(--surface); color:var(--ink);
}
.sp-email:focus, .sp-pw:focus{ outline:none; border-color:var(--accent); }
/* 10.53 : code d'invitation, en bas de la fenêtre de connexion */
.sp-code{ margin-top:0.55rem; font-size:0.8rem; color:var(--ink-soft); text-align:center; }
.sp-code summary{ cursor:pointer; width:max-content; margin:0 auto; }
.sp-code[open] summary{ margin-bottom:0.35rem; }
.sp-code-top{ margin:0 0 0.8rem; padding-bottom:0.7rem; border-bottom:1px solid var(--line); }
.sp-codein{ font-family:'Courier Prime', 'Courier New', Courier, monospace; letter-spacing:0.05em; text-align:center; width:11rem; box-sizing:border-box; padding:0.3rem 0.4rem; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); font-size:0.9rem; }
.sp-codein:focus{ outline:none; border-color:var(--accent); }
.sp-paste{ margin-left:0.3rem; font:inherit; font-size:0.78rem; background:none; border:none; color:var(--accent); cursor:pointer; padding:0.2rem; }
.sp-codein::placeholder{ font-family:'Public Sans', system-ui, sans-serif; letter-spacing:0; font-size:0.85rem; }
@media (pointer:coarse){ .sp-codein{ font-size:16px; } }
/* 10.26 : 16 px sur tactile, sinon Safari iOS zoome au toucher du champ */
@media (pointer:coarse){ .sp-email, .sp-pw{ font-size:16px; } .rp-chip, .relance-ask .rp-skip, .sp-google, .sync-pop .rp-opts button{ height:1.95rem; } }
.sp-hint{ font-size:0.8rem; color:var(--ink-soft); margin:-0.15rem 0 0.45rem; }
/* 10.53 : afficher / masquer le mot de passe ; rappel d'adresse à confirmer */
.sp-pwwrap{ position:relative; }
.sp-pwwrap .sp-pw{ padding-right:4.6rem; }
.sp-eye{ position:absolute; right:0.35rem; top:50%; transform:translateY(calc(-50% - 0.2rem)); appearance:none; border:0; background:none; padding:0.15rem 0.3rem; font:inherit; font-size:0.75rem; color:var(--accent); cursor:pointer; }
.sp-verify{ font-size:0.8rem; color:var(--ink-soft); margin:0.2rem 0 0.5rem; }
.sp-verify button{ appearance:none; border:0; background:none; padding:0; font:inherit; font-weight:600; color:var(--accent); cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
.sp-hint:empty{ display:none; }
.sp-hint button, .sp-confirm .sp-fix{ appearance:none; border:0; background:none; padding:0; font:inherit; font-weight:600; color:var(--accent); cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
.sp-confirm{ margin-top:0.55rem; padding:0.55rem 0.6rem; border:1px solid color-mix(in srgb, var(--accent) 30%, var(--line)); border-radius:10px; font-size:0.8rem; color:var(--ink-soft); text-align:center; }
.sp-confirm[hidden]{ display:none; }
.sp-confirm .sp-addr{ display:block; margin:0.25rem 0 0.5rem; font-size:1rem; font-weight:600; color:var(--ink); word-break:break-all; }
.sp-confirm .rp-opts{ display:grid; grid-template-columns:1fr 1fr; }
.sp-confirm .rp-opts button{ padding-inline:0.3rem; }
.sp-forgot{ appearance:none; border:0; background:none; padding:0; margin-top:0.55rem; font-family:inherit; font-size:0.78rem; color:var(--ink-soft); cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
.sync-pop .rp-title{ text-align:center; }
.sync-pop .rp-opts:has(.sp-login){ display:grid; grid-template-columns:1fr 1fr; }
.sync-pop .rp-opts:has(.sp-login) button{ white-space:nowrap; padding-inline:0.3rem; }
.sync-pop .sp-forgot{ display:block; margin-inline:auto; }
body.cloud #exportBtn, body.cloud #importBtn{ display:none; }
.backup-nudge.as-link{ cursor:pointer; color:var(--accent); text-decoration:underline; text-decoration-color:color-mix(in srgb, var(--accent) 40%, transparent); text-underline-offset:3px; }
.backup-nudge.as-link:hover{ text-decoration-color:currentColor; }
.sp-backup{ display:flex; justify-content:center; align-items:center; gap:0.4rem; margin-top:0.7rem; padding-top:0.55rem; border-top:1px solid var(--line); font-size:0.74rem; color:var(--ink-faint); }
.sp-backup button{ appearance:none; border:0; background:none; padding:0; font:inherit; color:var(--ink-soft); cursor:pointer; text-decoration:underline; text-underline-offset:3px; text-decoration-color:color-mix(in srgb, currentColor 35%, transparent); }
.sp-backup button:hover{ color:var(--accent); text-decoration-color:currentColor; }
.sp-msg{ font-size:0.8rem; color:var(--urgent-ink); margin-top:0.45rem; }
.sp-msg:empty{ display:none; }
.sp-who{ font-size:0.9rem; font-weight:600; color:var(--ink); margin:-0.2rem 0 0.25rem; word-break:break-all; }
.sp-state{ font-size:0.8rem; color:var(--ink-soft); margin:0 0 0.6rem; }
/* 10.9 : diagnostic de synchro, discret, sous « Se déconnecter » */
.sp-diag{ font-family:'Courier Prime', 'Courier New', Courier, monospace; font-size:0.66rem; line-height:1.35; color:var(--ink-faint); margin-top:0.6rem; word-break:break-word; }

/* ---------- petit message flottant ---------- */
#toast{
  position:fixed;
  left:50%;
  bottom:1.75rem;
  transform:translate(-50%, 12px);
  /* 10.40 : aux couleurs de « Une petite en passant ? » (avant : pastille
     noire), plus fin et plus carré */
  background:var(--lucky-bg);
  color:var(--phrase);
  padding:0.28rem 0.85rem;
  border-radius:6px;
  font-size:0.86rem;
  font-weight:500;
  box-shadow:0 8px 24px -8px rgba(0,0,0,0.28), var(--shadow);
  opacity:0;
  pointer-events:none;
  transition:opacity .3s ease, transform .3s ease;
  /* 10.40 : sur deux lignes si besoin (sur téléphone, la phrase débordait de l'écran) */
  width:max-content; max-width:min(34rem, calc(100vw - 2rem)); box-sizing:border-box;
  text-align:center; text-wrap:balance;
  z-index:20;
}
#toast.show{
  opacity:1;
  transform:translate(-50%, 0);
  pointer-events:auto; cursor:default;   /* 10.40 : survol = pause, clic = fermer */
}
#toast.milestone{   /* message d'étape : même case, en gras */
  font-weight:700;
  padding:0.32rem 0.95rem;
  font-size:0.9rem;
}

/* ---------- bas de page : corbeille, sauvegardes, version ---------- */
footer{
  margin-top:2.5rem;
  padding-top:1.25rem;
  border-top:1px solid var(--line);
  font-size:0.86rem;
  color:var(--ink-faint);
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:1rem;
  flex-wrap:wrap;
}
.backup-bar{
  display:flex;
  gap:0.5rem;
  flex-wrap:wrap;
  align-items:center;
}
/* rappel de sauvegarde (7.43) */
.backup-nudge{ font-family:'Public Sans', system-ui, sans-serif; font-size:0.8rem; color:var(--relance); margin-right:0.35rem; }
/* boutons du bas : même forme ; seule « Sauvegarder » est en couleur */
.trash-link, .backup-btn{
  --btn:var(--btn-ink);
  appearance:none;
  display:inline-flex;
  align-items:center;
  gap:0.5rem;
  padding:0.5rem 0.95rem;
  border:none;
  border-radius:999px;
  /* fond blanc (8.41) ; liseré pour Corbeille seulement (8.42) ;
     Sauvegarder garde sa teinte, plus bas */
  background:var(--surface);
  color:var(--btn);
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.7rem;
  font-weight:600;
  letter-spacing:0.08em;
  text-transform:uppercase;
  cursor:pointer;
  transition:background .15s ease, color .15s ease, transform .15s ease;
}
.backup-btn-primary{ --btn:var(--accent); background:color-mix(in srgb, var(--accent) 15%, var(--surface)); }
.trash-link:hover, .trash-link.open, .backup-btn:hover{ background:var(--btn); color:var(--surface); transform:translateY(-1px); }
.backup-btn svg{ width:14px; height:14px; display:block; }
/* 9.0 : Restaurer aussi large que Sauvegarder — « restaurer » a deux lettres
   de moins ; police à chasse fixe, donc une lettre (1ch + espacement) de
   marge en plus de chaque côté */
#importBtn{ padding-inline:calc(0.95rem + 1ch + 0.08em); }
.trash-link{ margin-right:auto; box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--btn) 28%, transparent); }
/* 10.2 : Partage juste à droite de Corbeille, c'est lui qui pousse le reste à droite */
footer:has(#shareLink:not([hidden])) #trashLink{ margin-right:0; }
/* 10.5-10.6 : Partage en jaune citron clair au survol (texte foncé dans les deux thèmes) ;
   Restaurer reprend le survol bleu de Sauvegarder */
.share-link:hover, .share-link.open{ background:var(--share-hover); color:#2A2725; box-shadow:inset 0 0 0 1px var(--share-hover); }
#importBtn:hover{ background:var(--accent); color:var(--surface); }
.share-link svg{ width:16px; height:16px; display:block; flex:none; }
.trash-link svg{ width:15px; height:15px; display:block; flex:none; transition:transform .25s cubic-bezier(.34,1.56,.64,1); }
.trash-link svg .lid{ transform-box:fill-box; transform-origin:right bottom; transition:transform .25s cubic-bezier(.34,1.56,.64,1); }
.trash-link:hover svg .lid, .trash-link.open svg .lid{ transform:rotate(-18deg) translateY(-1px); }
.trash-link-badge{
  min-width:1.7rem;
  padding:0.18rem 0.5rem;
  border-radius:999px;
  background:color-mix(in srgb, var(--btn) 16%, transparent);
  color:inherit;
  font-variant-numeric:tabular-nums;
  font-size:0.7rem;
  letter-spacing:0.02em;
  text-align:center;
}
.trash-link:hover .trash-link-badge, .trash-link.open .trash-link-badge{ background:color-mix(in srgb, var(--surface) 25%, transparent); }
.version-tag{
  width:100%;
  text-align:right;
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.7rem;
  letter-spacing:0.08em;
  color:var(--ink-faint);
  opacity:0.7;
  position:relative;
  z-index:41;
}

/* ---------- 10.2 : panneau « Partage » (carnet, invitations) ---------- */
.share-block{ background:var(--surface); color:var(--ink-soft); margin-top:1.25rem; }
.share-head{ display:flex; justify-content:space-between; align-items:baseline; gap:1rem; }
.share-title{ font-family:'Courier Prime', 'Courier New', Courier, monospace; font-size:0.78rem; font-weight:700; letter-spacing:0.09em; text-transform:uppercase; color:var(--accent); }
.share-help{ font-size:0.86rem; color:var(--ink-soft); margin:0.45rem 0 0.8rem; max-width:60ch; }
.sh-me{ display:flex; flex-wrap:wrap; align-items:center; gap:0.4rem 0.7rem; font-size:0.8rem; color:var(--ink-faint); margin-bottom:0.9rem; }
.sh-name{ font:inherit; font-size:0.9rem; color:var(--ink); background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:0.35rem 0.6rem; width:12rem; max-width:100%; }
.sh-name:focus{ outline:none; border-color:var(--accent); }
.sh-sub{ font-family:'Courier Prime', 'Courier New', Courier, monospace; font-size:0.66rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:0.35rem; }
.sh-people{ list-style:none; margin:0 0 0.8rem; padding:0; border-top:1px solid var(--line); }
.sh-person{ display:flex; align-items:center; gap:0.6rem; padding:0.5rem 0.1rem; border-bottom:1px solid var(--line); font-size:0.9rem; }
.sh-person .share-chip{ --cat-color:var(--accent); box-shadow:none; min-width:1.5rem; height:1.5rem; font-size:0.75rem; }
.sh-pending .share-chip{ background:var(--surface-2); color:var(--ink-faint); }
.sh-pname{ color:var(--ink); font-weight:600; }
.sh-pending .sh-pname{ font-weight:400; color:var(--ink-soft); }
.sh-state{ font-size:0.78rem; color:var(--ink-faint); margin-right:auto; }
.sh-x{ appearance:none; border:none; background:transparent; color:var(--ink-faint); font-size:1rem; line-height:1; padding:4px 7px; border-radius:4px; cursor:pointer; }
.sh-x:hover{ background:var(--urgent-soft); color:var(--urgent-ink); }
.sh-copy-old{ appearance:none; border:none; background:none; padding:0; font:inherit; font-size:0.78rem; color:var(--accent); cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
.sh-empty{ font-style:italic; }
.sh-actions{ display:flex; flex-wrap:wrap; gap:0.5rem; align-items:center; }
.sh-btn{
  appearance:none; display:inline-flex; align-items:center; gap:0.4rem;
  border:1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); background:var(--surface); color:var(--accent);
  border-radius:999px; padding:0.45rem 0.95rem;
  font-family:'Courier Prime', 'Courier New', Courier, monospace; font-size:0.7rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase;
  text-decoration:none; cursor:pointer; transition:background .15s ease, color .15s ease;
}
.sh-btn-primary{ background:color-mix(in srgb, var(--accent) 15%, var(--surface)); }
.sh-btn:hover{ background:var(--accent); color:var(--surface); }
.sh-btn:disabled{ opacity:.55; cursor:default; }
.sh-edit{ appearance:none; border:0; background:none; padding:0.2rem; color:var(--ink-faint); cursor:pointer; border-radius:6px; display:inline-grid; place-items:center; }
.sh-edit:hover{ color:var(--accent); background:var(--surface-2); }
.sh-editing{ flex-wrap:wrap; gap:0.45rem; }
.sh-ini-in, .sh-name-in{ font:inherit; font-size:0.9rem; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); padding:0.3rem 0.5rem; }
.sh-ini-in{ width:2.9rem; text-align:center; text-transform:uppercase; font-family:'Courier Prime', 'Courier New', Courier, monospace; font-weight:700; }
.sh-name-in{ flex:0 1 12rem; min-width:7rem; }   /* 10.55 : à la taille d'un prénom */
.sh-ini-in:focus, .sh-name-in:focus{ outline:none; border-color:var(--accent); }
.sh-editing .edit-actions{ margin-left:auto; }
@media (pointer:coarse){ .sh-ini-in, .sh-name-in{ font-size:16px; } }
.sh-code{ font-size:0.86rem; color:var(--ink-soft); margin:-0.15rem 0 0.6rem; }
.sh-code b{ font-family:'Courier Prime', 'Courier New', Courier, monospace; font-size:1.05rem; color:var(--ink); letter-spacing:0.06em; }
.sh-code span{ font-size:0.78rem; }
.sh-gotcode{ margin-top:0.9rem; font-size:0.86rem; color:var(--ink-soft); }
.sh-gotcode summary{ cursor:pointer; width:max-content; }
.sh-gotcode .sh-actions{ margin-top:0.5rem; align-items:center; }
.sh-codein{ font-family:'Courier Prime', 'Courier New', Courier, monospace; font-size:0.95rem; letter-spacing:0.05em; color:var(--ink); background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:0.35rem 0.55rem; width:11rem; }
@media (pointer:coarse){ .sh-codein{ font-size:16px; } }
.sh-newlink{ margin-top:0.8rem; padding:0.75rem; border:1px dashed color-mix(in srgb, var(--accent) 40%, var(--line)); border-radius:12px; }
.sh-url{ width:100%; box-sizing:border-box; font-family:'Courier Prime', 'Courier New', Courier, monospace; font-size:0.78rem; color:var(--ink); background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:0.4rem 0.55rem; margin-bottom:0.55rem; }
.sh-msg{ font-size:0.8rem; color:var(--ink-soft); margin-top:0.6rem; }
.sh-msg:empty{ display:none; }

/* ---------- corbeille : archive neutre, machine à écrire (7.5) ---------- */
.trash-block{
  background:var(--surface);
  color:var(--ink-soft);
  margin-top:1.25rem;
}
/* toute la corbeille en Courier : passe avant les polices des éléments du dedans */
.trash-block, .trash-block *{ font-family:'Courier Prime', 'Courier New', Courier, monospace !important; }
.trash-head{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:1rem;
  flex-wrap:wrap;
}
.trash-total{
  font-size:1.6rem;
  font-weight:700;
  letter-spacing:0;
  color:var(--ink);
}
.trash-total small{
  font-size:0.95rem;
  font-weight:400;
  color:var(--ink-faint);
  margin-left:0.35rem;
}
.trash-close{
  appearance:none;
  border:1px solid var(--line);
  background:transparent;
  color:var(--ink-soft);
  border-radius:8px;
  font-size:0.86rem;
  font-weight:400;
  padding:0.35rem 0.75rem;
  cursor:pointer;
}
.trash-close:hover{ color:var(--ink); border-color:var(--ink-faint); }
.trash-msg{
  color:var(--ink-faint);
  font-size:0.86rem;
  font-style:normal;
  margin:0.35rem 0 0.6rem;
}
/* graphique des tâches accomplies (6.1) */
.trash-chart{ margin:0.9rem 0 0.2rem; padding:0.75rem 0.9rem 0.6rem; border:1px solid var(--line); border-radius:12px; background:transparent; }
.tc-head{ display:flex; justify-content:space-between; align-items:center; gap:0.6rem; flex-wrap:wrap; margin-bottom:0.3rem; }
.tc-switch{ display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:2px; background:var(--surface); }
.tc-switch button{ appearance:none; border:none; background:transparent; font-size:0.64rem; font-weight:400; letter-spacing:0.04em; text-transform:uppercase; color:var(--ink-faint); padding:0.28rem 0.7rem; border-radius:999px; cursor:pointer; transition:color .15s ease, background .15s ease; }
.tc-switch button:hover{ color:var(--ink-soft); }
.tc-switch button.on{ background:var(--surface-2); color:var(--ink); font-weight:700; }
.tc-stats{ font-size:0.7rem; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
.tc-stats b{ color:var(--ink); font-weight:700; }
.trash-chart svg{ display:block; width:100%; height:auto; overflow:visible; }
.tc-bar{ fill:color-mix(in srgb, var(--ink-faint) 45%, var(--surface)); }
.tc-bar.now{ fill:var(--ink-soft); }
.tc-bar.best{ fill:color-mix(in srgb, var(--ink-soft) 70%, var(--surface)); }
.tc-bar.now.best{ stroke:var(--ink); stroke-width:1; }
.tc-val{ font-size:10px; font-weight:400; fill:var(--ink-soft); }
.tc-lbl{ font-size:9.5px; font-weight:400; fill:var(--ink-faint); }
.tc-lbl.now{ fill:var(--ink); font-weight:700; }
.tc-msg{ margin:0.3rem 0 0; font-size:0.86rem; color:var(--ink-soft); }
.tc-note{ margin:0.1rem 0 0; font-size:0.7rem; color:var(--ink-faint); }
/* liste par semaine, dans une fenêtre de hauteur fixe qui défile (6.1) */
.trash-groups{
  height:300px;
  overflow-y:auto;
  overscroll-behavior:contain;
  margin-top:0.5rem;
  padding:0 0.5rem 0.4rem 0.2rem;
  border:1px solid var(--line);
  border-radius:10px;
  scrollbar-width:thin;
  scrollbar-color:color-mix(in srgb, var(--ink-faint) 55%, transparent) transparent;
}
.trash-groups:empty{ display:none; }
.trash-groups::-webkit-scrollbar{ width:8px; }
.trash-groups::-webkit-scrollbar-thumb{ background:color-mix(in srgb, var(--ink-faint) 45%, transparent); border-radius:999px; }
.trash-day{
  display:flex;
  justify-content:space-between;
  gap:1rem;
  font-size:0.7rem;
  font-weight:700;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--ink-soft);
  margin:1.2rem 0 0.35rem;
  padding-bottom:0.3rem;
  border-bottom:1px solid var(--line);
}
.trash-groups .trash-day{
  position:sticky; top:0; z-index:1;
  background:var(--surface);
  font-size:0.64rem;
  margin:0.6rem 0 0.2rem;
  padding:0.35rem 0.1rem 0.25rem;
}
.trash-groups .trash-day:first-child{ margin-top:0; }
.trash-groups ul.items{
  display:grid;
  grid-template-columns:1fr 1fr;
  column-gap:1.2rem;
  row-gap:0;
}
@media (max-width:560px){ .trash-groups ul.items{ grid-template-columns:1fr; } }
.trash-item{
  display:flex;
  align-items:flex-start;
  gap:0.6rem;
  padding:0.38rem 0.3rem;
  border-radius:8px;
}
.trash-item:hover{ background:var(--surface-2); }
.trash-item:hover .item-controls{ opacity:1; }
.trash-tick{ color:var(--ink-faint); font-weight:400; flex:none; width:18px; text-align:center; }
.trash-item .item-text{ flex:1; color:var(--ink-soft); }
.trash-groups .trash-item{ padding:0.16rem 0.3rem; gap:0.4rem; font-size:0.7rem; line-height:1.35; min-width:0; }
.trash-groups .trash-item .item-text{ font-size:0.78rem; line-height:1.35; min-width:0; overflow-wrap:anywhere; }
.trash-groups .trash-item .note{ font-size:0.7rem; }
.trash-groups .who-tag{ font-size:0.64rem; padding:0.05rem 0.35rem; background:transparent; border-color:var(--line); color:var(--ink-faint); font-weight:400; }
.trash-groups .trash-tick{ width:14px; }
.trash-date{ flex:none; font-size:0.7rem; color:var(--ink-faint); padding-left:0.4rem; align-self:baseline; }

/* ---------- accueil sans liste (7.8 → 7.16) ---------- */
body.no-list #trashLink, body.no-list #shareLink, body.no-list .backup-bar, body.no-list #trashPanel, body.no-list #sharePanel{ display:none !important; }
body.no-list footer{ border-top-color:transparent; }
body.no-list .version-tag{ display:none; }
/* 10.40 : pas de compteur tant qu'il n'y a rien à compter (body.no-tasks),
   ni « Hors ligne » sur l'accueil vide quand le réseau est là : un nouveau
   venu n'a encore jamais été connecté */
body.no-tasks .progress-card{ display:none; }
body.no-list .plume-tag.logged-out{ display:none; }
/* 10.40 : sur l'accueil vide, une phrase dans un cadre de compteur (sans
   compteur), et « Se connecter » sous la plume tant qu'on ne l'est pas ; le
   titre garde la place de cette mention, qui ne touche donc pas le cadre */
.welcome-card{ display:none; }
body.no-list .welcome-card{
  display:block;
  background:var(--ub-bg); border-radius:16px; box-shadow:var(--shadow);   /* couleurs du bandeau urgent */
  padding:1.05rem 2.2rem 1.1rem;
}
.welcome-msg{
  margin:0; text-align:center;   /* une ligne si possible, sinon coupée entre ses deux moitiés */
  font-family:'Public Sans', system-ui, sans-serif; font-size:0.95rem; font-weight:600;
  line-height:1.4; color:color-mix(in srgb, var(--ub-title) 80%, var(--urgent-ink));   /* titre du bandeau urgent, un chouïa plus lisible */
}
.welcome-msg span{ white-space:nowrap; }
body.no-tasks header{ margin-bottom:2.6rem; }   /* sans compteur : la mention sous la plume (~44px sous le haut du titre) ne touche pas la carte suivante */
body.no-list header{ margin-bottom:1.9rem; }   /* accueil : mention remontée contre la plume */
body.no-list .plume-tag{ top:25px; }
.plume-login{ display:none; }
body.cloud.no-list.signed-out .plume-login{
  display:block; position:absolute; right:12px; top:25px;
  appearance:none; border:none; background:transparent; padding:0; cursor:pointer;
  font-family:'Courier Prime', 'Courier New', monospace; font-size:0.6rem; font-weight:700;
  letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-faint);   /* gris, comme « Hors ligne » */
  text-decoration:underline; text-decoration-color:transparent; text-underline-offset:3px;
  transition:color .15s ease, text-decoration-color .15s ease;
}
body.cloud.no-list.signed-out .plume-login::before{ content:""; position:absolute; inset:-8px -6px; }   /* zone de toucher */
.plume-login:hover, .plume-login:focus-visible{ outline:none; color:var(--ink-soft); text-decoration-color:currentColor; }
body.no-list .add-category-row{
  flex-direction:column;
  align-items:center;
  gap:0.55rem;   /* 10.40 : lien collé au bouton (avant 1.15rem) */
  transition:margin-top .55s cubic-bezier(.22,1,.36,1);
}
/* bouton d'accueil (7.9) — 10.30 : aux couleurs de « Une petite en passant ? » */
.add-category-btn.onboarding{
  flex-direction:column;
  gap:0.35rem;
  padding:1.6rem 2.6rem;
  border:1.5px dashed color-mix(in srgb, var(--lucky-lemon) 80%, transparent);
  border-radius:14px;
  background:var(--lucky-bg);
  color:var(--phrase);
  box-shadow:var(--shadow);
  text-transform:none;
  letter-spacing:0;
  transition:background .15s ease, border-color .15s ease, box-shadow .2s ease, transform .2s ease;
}
.add-category-btn.onboarding:hover, .add-category-btn.onboarding:focus-visible{
  border-style:dashed;
  outline:none;
  background:var(--lucky-bg);
  border-color:var(--lucky-lemon);
  box-shadow:var(--shadow), 0 0 0 3px color-mix(in srgb, var(--lucky-lemon) 40%, transparent), 0 6px 20px -4px color-mix(in srgb, var(--lucky-lemon) 70%, transparent);
  transform:translateY(-1px);
}
.add-category-btn.onboarding:active{ transform:translateY(0); }
.onboarding-plus{
  display:flex;
  align-items:center;
  justify-content:center;
  width:34px;
  height:34px;
  border-radius:50%;
  border:1.5px dashed var(--lucky-lemon);
  background:transparent;
  color:color-mix(in srgb, var(--lucky-lemon) 55%, var(--ink));
  line-height:0;
  box-sizing:border-box;
  margin-bottom:0.3rem;
  transition:border-color .15s ease, background .15s ease, transform .2s ease;
}
.onboarding-plus svg{ display:block; flex:none; }   /* 10.30 : + dessiné, toujours au centre du rond (le caractère « + » ne l'était pas) */
.add-category-btn.onboarding:hover .onboarding-plus, .add-category-btn.onboarding:focus-visible .onboarding-plus{
  border-style:solid;
  background:var(--lucky-lemon);
  color:var(--ink);
  transform:scale(1.08);
}
.onboarding-title{
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-weight:600;
  font-size:0.95rem;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--phrase);
}
.onboarding-sub{
  font-family:'Public Sans', system-ui, sans-serif;
  font-size:0.86rem;
  font-weight:500;
  color:color-mix(in srgb, var(--phrase) 70%, var(--ink-soft));
}
.onboarding-restore{
  appearance:none; border:none; background:transparent; cursor:pointer;
  font-family:'Public Sans', system-ui, sans-serif; font-size:0.8rem; color:var(--ink-faint);
  transition:color .15s ease;
}
.onboarding-restore span{ text-decoration:underline; text-decoration-color:transparent; text-underline-offset:3px; transition:text-decoration-color .15s ease; }
.onboarding-restore:hover{ color:var(--ink-soft); }
.onboarding-restore:hover span{ text-decoration-color:currentColor; }
.onboarding-restore small{ display:block; margin-top:0.1rem; font-size:0.78em; color:var(--ink-faint); }   /* 10.31 */
/* carte « nouvelle liste » : nom et type (7.22 ; 10.40 : plus de première tâche) */
.new-list-card{
  width:min(440px, 100%);
  background:var(--surface); border-radius:14px; box-shadow:var(--shadow);
  border-left:3px solid var(--accent);
  padding:0.85rem 1rem 0.9rem;
  animation:nl-fade .3s ease;
}
.new-list-card .edit-form{ padding:0; gap:0.5rem; }
/* 10.15 : interrupteur « Liste de courses » (10.40 : la fenêtre ne garde que
   le nom et cet interrupteur) */
.nl-courses{
  position:relative; align-self:flex-start;
  display:inline-flex; align-items:center; gap:0.5rem;
  padding:0.15rem 0; font-size:0.86rem; color:var(--ink-soft);
  cursor:pointer; -webkit-tap-highlight-color:transparent;
}
.nl-courses input{ position:absolute; opacity:0; width:1px; height:1px; margin:0; pointer-events:none; }
.nl-switch{ position:relative; flex:none; width:30px; height:18px; border-radius:999px; background:var(--line); transition:background .15s ease; }
.nl-switch::after{
  content:""; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%;
  background:var(--surface); box-shadow:0 1px 2px rgba(0,0,0,.18);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1);
}
.nl-courses input:checked + .nl-switch{ background:var(--accent); }
.nl-courses input:checked + .nl-switch::after{ transform:translateX(12px); }
.nl-row{ display:flex; align-items:center; flex-wrap:wrap; gap:0.5rem; }   /* 10.58 : l'interrupteur à gauche, Annuler / Créer à droite */
.nl-row .edit-actions{ margin-left:auto; }
.nl-chat{ align-self:flex-start; margin-top:0.35rem; display:inline-flex; align-items:center; gap:0.5rem; appearance:none; border:0; background:none; padding:0.15rem 0; font:inherit; font-size:0.86rem; color:var(--ink-soft); cursor:pointer; }   /* 10.57 : sous l'interrupteur, même allure */
.nl-chat .add-btn{ pointer-events:none; }
.nl-chat:hover{ color:var(--ink); }
.nl-chat:not(.nl-duel){ margin-top:0.7rem; }   /* 10.63 : écran de chat et duel groupés, à l'écart de la création d'une liste */
.nl-chat.nl-duel{ margin-top:-0.3rem; }
.nl-chat:hover .add-btn{ color:var(--ink); border-color:color-mix(in srgb, var(--ink-soft) 40%, var(--line)); }
.nl-courses input:focus-visible + .nl-switch{ outline:2px solid var(--accent); outline-offset:2px; }
.nl-courses:has(input:checked){ color:var(--ink); }
/* sur l'accueil : pointillés roses, champs jaunes */
body.no-list .new-list-card{
  border:1.5px dashed var(--rose); border-radius:14px;
  animation:nl-fade .35s ease, nl-border 1.1s ease;
}
body.no-list .new-list-card input:not(:disabled):hover{ border-color:color-mix(in srgb, var(--lucky-lemon) 75%, var(--line)); }
body.no-list .new-list-card input:focus, body.no-list .new-list-card input[type="text"]:focus{ outline:2px solid var(--lucky-lemon); outline-offset:1px; border-color:var(--lucky-lemon); }
body.no-list .new-list-card .add-save:hover{ background:var(--rose); border-color:var(--rose); color:#fff; }

/* ---------- tapis : filigrane de l'accueil, et tapis qui se déroule (5.22) ---------- */
.tapis-watermark{
  position:absolute; z-index:-1; pointer-events:none;
  background-size:100% 100%; background-repeat:no-repeat;
  opacity:0.16; filter:saturate(0.7);
  animation:wm-in .8s ease;
}
.tapis-watermark.leaving{ transition:opacity .7s ease, transform .7s ease; opacity:0 !important; transform:scale(1.015); }
.tapis-box{ position:absolute; z-index:40; display:none; cursor:pointer; }
body.tapis-out .plume-tag, body.tapis-out .plume-login{ visibility:hidden; }   /* 10.40 : « Hors ligne » ne se lit plus à travers le tapis */
.tapis-box canvas{ display:block; }
.tapis-roll{
  position:absolute; z-index:42; display:none; pointer-events:none; border-radius:999px;
  background:
    repeating-linear-gradient(90deg, rgba(90,80,55,.08) 0 1px, transparent 1px 3px),
    linear-gradient(180deg, #FBF8EF 0%, #EFEADC 50%, #D9D3C0 100%);
  border:1px solid #D0C9B5;
}

/* ---------- glisser-déposer : listes (5.17) et tâches (7.1) ---------- */
body.dragging-lists, body.dragging-lists *{ cursor:grabbing !important; user-select:none; }
.category.dragging-card{
  background:transparent;
  box-shadow:none;
  outline:2px dashed color-mix(in srgb, var(--cat-color, var(--accent)) 55%, transparent);
  outline-offset:-2px;
}
.category.dragging-card > *{ visibility:hidden; }
.card-ghost{
  position:fixed !important;
  margin:0 !important;
  z-index:1000;
  pointer-events:none;
  opacity:0.92;
  box-shadow:0 2px 0 color-mix(in srgb, var(--cat-color, var(--accent)) 30%, transparent),
             0 22px 40px -14px rgba(30,40,45,0.4);
  transform-origin:center;
  will-change:transform;
}
.card-ghost .cat-grip[data-tip]::after{ display:none; }
.item.dragging-row{
  background:transparent;
  outline:1.5px dashed color-mix(in srgb, var(--cat-color, var(--accent)) 55%, transparent);
  outline-offset:-2px;
}

  // une partie = une touche : celui qui touche l'autre gagne (se toucher soi-même fait gagner l'autre)
  w.over = true; w.winner = res.end.victim === shot.p ? 1 - shot.p : shot.p; w.fallen = res.end.victim;
  w.craters.push({ x:res.end.x, y:res.end.y, r:R().trou * 1.6, shape: coeur ? "coeur" : undefined });

}
function worldAfter(n){

}

let cv = null, ctx = null;
const city = document.createElement("canvas"), cctx = city.getContext("2d");
let DPR = 1;
function sizeCanvas(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  for(const c of [cv, city]){ c.width = W * DPR; c.height = H * DPR; }
}

function facade(i){ const f = css("--facades").split(","); return f[i % f.length].trim(); }

function lerpHex(a, b, t){
  const p = h => [1,3,5].map(i => parseInt(h.slice(i, i + 2), 16));
  const A = p(a), B = p(b);
  return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, "0")).join("");
}
function renderCity(w, lights = 0){   // lights : 0 → 1, toutes les fenêtres s'allument à la fin de la partie
  cctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cctx.globalCompositeOperation = "source-over";
  cctx.clearRect(0, 0, W, H);
  const lit = css("--win-lit"), off = css("--win-off");
  for(const b of w.city.bs){
    // silhouette (façade + toit), posée comme une carte de l'appli : ombre douce
    cctx.beginPath();
    if(b.roof === "steps"){
      const n = 3, sh = 13; cctx.moveTo(b.x, H); cctx.lineTo(b.x, b.top);
      for(let s = 1; s <= n; s++){ const ww = b.w * (1 - s / (n + 1.4)), x0 = b.x + (b.w - ww) / 2;
        cctx.lineTo(x0, b.top - (s - 1) * sh); cctx.lineTo(x0, b.top - s * sh); }
      for(let s = n; s >= 1; s--){ const ww = b.w * (1 - s / (n + 1.4)), x1 = b.x + (b.w + ww) / 2;
        cctx.lineTo(x1, b.top - s * sh); cctx.lineTo(x1, b.top - (s - 1) * sh); }
      cctx.lineTo(b.x + b.w, b.top); cctx.lineTo(b.x + b.w, H);
    }else if(b.roof === "point"){
      cctx.moveTo(b.x, H); cctx.lineTo(b.x, b.top); cctx.lineTo(b.x + b.w / 2, b.top - b.w * 0.42);
      cctx.lineTo(b.x + b.w, b.top); cctx.lineTo(b.x + b.w, H);
    }else cctx.rect(b.x, b.top, b.w, H - b.top);
    cctx.closePath();
    cctx.save();
    cctx.shadowColor = css("--facade-shadow"); cctx.shadowBlur = 14; cctx.shadowOffsetY = 2;
    cctx.fillStyle = facade(b.c); cctx.fill();
    cctx.restore();
    // fenêtres
    const r = rng(b.wseed);
    const cols = Math.max(1, Math.floor((b.w - 14) / 15)), rows = Math.floor((H - b.top - 20) / 21);
    const gx = (b.w - cols * 15 + 6) / 2;
    for(let j = 0; j < rows; j++) for(let i = 0; i < cols; i++){
      cctx.fillStyle = r() < 0.32 + 0.68 * lights ? lit : off;
      roundRect(cctx, b.x + gx + i * 15, b.top + 14 + j * 21, 8, 11, 1.5); cctx.fill();
    }
  }
  // trous
  cctx.globalCompositeOperation = "destination-out";
  cctx.fillStyle = "#000";   // opaque : sinon le trou prend la transparence de la dernière fenêtre (trous à moitié faits)
  for(const c of w.craters){ craterPath(cctx, c); cctx.fill(); }
  cctx.globalCompositeOperation = "source-atop";
  for(const c of w.craters){
    if(c.shape === "coeur"){   // bord roussi rose autour du cœur
      cctx.lineJoin = "round";
      for(const [lw, a] of [[12, 0.07], [6, 0.14], [2.5, 0.25]]){ cctx.strokeStyle = `rgba(150,40,70,${a})`; cctx.lineWidth = lw; craterPath(cctx, c, 0.5); cctx.stroke(); }
      continue;
    }
    const g = cctx.createRadialGradient(c.x, c.y, c.r, c.x, c.y, c.r + 9);
    g.addColorStop(0, "rgba(40,25,15,0.38)"); g.addColorStop(0.35, "rgba(40,25,15,0.16)"); g.addColorStop(1, "rgba(40,25,15,0)");
    cctx.fillStyle = g; cctx.beginPath(); cctx.arc(c.x, c.y, c.r + 9, 0, 7); cctx.fill();
  }
  cctx.globalCompositeOperation = "source-over";
}
function roundRect(c, x, y, w, h, r){
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

    for(const t of [0.25, 0.5, 0.75]){ const yy = -21 - 12 * t; c.beginPath(); c.moveTo(8 + 6 * t - 3, yy + 1); c.lineTo(8 + 6 * t + 3, yy - 1); c.stroke(); } }
  // tête
  c.fillStyle = P.head; c.beginPath(); c.arc(14, -35, 5.5, 0, 7); c.fill();

  c.fillStyle = P.face; c.beginPath(); c.ellipse(16, -35, P.ring ? 3.1 : 2.4, P.ring ? 3.7 : 2.8, 0, 0, 7); c.fill();

  c.fillStyle = "#FFFFFF"; c.beginPath(); c.arc(16.2, -36, 1.2, 0, 7); c.fill();

// faisan de face (danse du vainqueur), pieds en (0, 0) ; wingL / wingR : 1 = levée, -1 = baissée

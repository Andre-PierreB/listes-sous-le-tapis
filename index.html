// 7.24 : l'heure n'a de sens qu'avec une échéance
function linkTimeToDate(dateInp, timeInp){
  if(!dateInp || !timeInp) return ()=>{};
  const sync = ()=>{
    const off = !dateInp.value;
    if(off) timeInp.value = "";
    timeInp.disabled = off;
  };
  dateInp.addEventListener("input", sync);
  dateInp.addEventListener("change", sync);
  sync();
  return sync;
}

// Tout texte saisi (titre, note, nom…) passe par ici avant d'entrer dans le
// HTML : un « < » dans une tâche s'affiche tel quel au lieu d'être lu comme
// une balise (et une sauvegarde reçue de quelqu'un ne peut rien exécuter).
function escapeAttr(s){
  return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function getEffectiveItems(cat){
  return cat.items.concat(customItems[cat.id] || []);
}

function getEffective(key, base){
  const o = overrides[key] || {};
  const waiting = o.waiting !== undefined ? !!o.waiting : !!base.waiting;
  let due = o.due !== undefined ? o.due : (base.due || "");
  let relance = o.relance !== undefined ? o.relance : base.relance;
  if(waiting && relance === undefined){
    // ancien format (≤ 7.5) : la date de relance vivait dans « due »
    relance = due;
    due = o.dueBeforeWaiting !== undefined ? o.dueBeforeWaiting : "";
  }
  return {
    t: o.t !== undefined ? o.t : base.t,
    note: o.note !== undefined ? o.note : base.note,
    urgent: o.urgent !== undefined ? !!o.urgent : !!base.urgent,
    due,                       // échéance (masquée tant que la tâche est en cours)
    relance: waiting ? (relance || "") : "", // relance (n'existe qu'en cours)
    who: o.who !== undefined ? o.who : (base.who || ""),
    waiting,
    egg: o.egg !== undefined ? !!o.egg : !!base.egg,
    person: base.person,
    tier: base.tier,
  };
}

function todayISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function addDaysISO(iso, n){
  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function splitDue(due){
  if(!due) return {date:"", time:""};
  const [date, time] = due.split("T");
  return {date: date || "", time: time || ""};
}

function periodOfDay(time){
  if(!time) return "";
  const hh = parseInt(time.split(":")[0], 10);
  if(hh < 12) return "matin";
  if(hh < 18) return "aprèm";
  return "soir";
}

function dueStatus(due){
  if(!due) return null;
  const {date} = splitDue(due);
  const today = todayISO();
  if(date < today) return "overdue";
  if(date === today) return "today";
  if(date === addDaysISO(today, 1)) return "tomorrow";
  return "future";
}

// Seuil d'urgence par l'échéance (5.11) : J-2, veille, jour J ou retard.
// Le badge garde son libellé habituel (« Mercredi », « Demain »…).
const DUE_URGENT_DAYS = 2;
function isDueUrgent(due){
  if(!due) return false;
  const {date} = splitDue(due);
  return date <= addDaysISO(todayISO(), DUE_URGENT_DAYS);
}

// « Relance » (5.21) : une tâche en cours dont la date est arrivée (jour J
// ou dépassée). Rien n'est modifié dans les données : c'est un état calculé.
// Elle revient alors dans la case urgente et dans le compteur, avec sa
// couleur propre ; la sortir d'« En cours » à la main lui ôte ce statut.
function isRelance(eff){
  return !!(eff && eff.waiting && eff.relance && splitDue(eff.relance).date <= todayISO());
}

const WEEKDAYS_FR = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];

function weekdayNameFR(dateISO){
  const d = new Date(dateISO + "T00:00:00");
  return WEEKDAYS_FR[d.getDay()];
}

function formatDueLabel(due, isRdv){
  const status = dueStatus(due);
  const {date, time} = splitDue(due);
  const [y,m,d] = date.split("-");
  const short = `${parseInt(d,10)}/${parseInt(m,10)}`;
  const timeSuffix = time ? ` ${periodOfDay(time)}` : "";
  let label;
  if(status === "overdue") label = "En retard — " + short + timeSuffix;
  else if(status === "today") label = "Aujourd'hui" + timeSuffix;
  else if(status === "tomorrow") label = "Demain" + timeSuffix;
  else{
    const daysDiff = Math.round((new Date(date + "T00:00:00") - new Date(todayISO() + "T00:00:00")) / 86400000);
    if(daysDiff >= 0 && daysDiff <= 6){
      const wd = weekdayNameFR(date);
      label = wd.charAt(0).toUpperCase() + wd.slice(1) + timeSuffix;
    }else{
      label = "Éch. " + short + timeSuffix;
    }
  }
  return isRdv ? "RDV " + label.charAt(0).toLowerCase() + label.slice(1) : label;
}

function isRdvTitle(t){
  return /^rdv\b/i.test(String(t || "").trim());
}

function isDeleted(key){
  return !!(overrides[key] && overrides[key].deleted);
}

// Le glisser-déposer manuel est prioritaire : on ne repartitionne que
// coché/non-coché, sans jamais retrier par échéance — l'ordre manuel
// (déjà appliqué en amont via getCatOrder/getWaitingOrder) est respecté tel quel.
function sortByUrgencyThenChecked(rows){
  const unchecked = rows.filter(r => !state[r.key]);
  const checked = rows.filter(r => state[r.key]);
  return unchecked.concat(checked);
}

function getTotalItems(){
  // Le total inclut les tâches "en attente" : elles restent dans le décompte
  // et comptent comme faites (voir getDoneCount). Envoyer une tâche "dans leur
  // camp", c'est avoir fait sa part — elle ne disparaît donc plus du compteur.
  return DATA.reduce((n,c)=>{
    const items = getEffectiveItems(c);
    let count = 0;
    items.forEach((base,i)=>{
      const key = itemKey(c.id,i);
      if(isDeleted(key)) return;
      if(getEffective(key, base).egg && !state[key]) return; // en couvaison : hors compteur
      count++;
    });
    return n + count;
  }, 0);
}

function getWeekDoneCount(){
  const monday = mondayOf(todayISO());
  checkedAt = loadJSONKey(CHECKED_AT_KEY, {});
  let n = 0;
  DATA.forEach(cat=>{
    getEffectiveItems(cat).forEach((base,i)=>{
      const key = itemKey(cat.id,i);
      if(isDeleted(key) || !state[key]) return;
      if((checkedAt[key] || "") >= monday) n++;
    });
  });
  // + celles cochées cette semaine puis déjà parties à la corbeille
  loadJSONKey(TRASH_KEY, []).forEach(e=>{
    if(e && e.kind !== "deleted" && (e.doneOn || "") >= monday) n++;
  });
  // + les envois dans « En cours » de la semaine (8.1)
  waitLog().forEach(e=>{ if(e && (e.on || "") >= monday) n++; });
  return n;
}

function getDoneCount(){
  // Une tâche est "faite" si elle est cochée OU si elle est "en attente"
  // (dans leur camp). Renvoyer une tâche dans sa liste la retire donc du
  // décompte — c'est automatiquement réversible.
  let count = 0;
  DATA.forEach(cat=>{
    const items = getEffectiveItems(cat);
    items.forEach((base,i)=>{
      const key = itemKey(cat.id,i);
      if(isDeleted(key)) return;
      const eff = getEffective(key, base);
      if(eff.egg && !state[key]) return;
      if((eff.waiting && !isRelance(eff)) || state[key]) count++;
    });
  });
  return count;
}

function getCatOrder(cat){
  const items = getEffectiveItems(cat);
  const n = items.length;
  const existing = order[cat.id] || [];
  const seen = new Set();
  const kept = [];
  existing.forEach(i=>{
    if(i < n && !seen.has(i)){ kept.push(i); seen.add(i); }
  });
  for(let i=0;i<n;i++){
    if(!seen.has(i)) kept.push(i);
  }
  order[cat.id] = kept;
  return order[cat.id];
}

function hasAnyList(){
  return getCategoryOrder().some(i => DATA[i] && !isCategoryDeleted(DATA[i].id));
}

function getCategoryOrder(){
  // Comme pour l'ordre des tâches d'une catégorie (getCatOrder) : on garde
  // les positions déjà connues et on ajoute les nouvelles à la fin, plutôt
  // que de tout réinitialiser dès que le nombre de catégories change — sinon
  // ajouter une catégorie remettrait tout l'ordre existant à zéro.
  const n = DATA.length;
  const existing = order.__categories__ || [];
  const seen = new Set();
  const kept = [];
  existing.forEach(i=>{
    if(typeof i === "number" && i >= 0 && i < n && !seen.has(i)){
      kept.push(i);
      seen.add(i);
    }
  });
  for(let i=0;i<n;i++){
    if(!seen.has(i)) kept.push(i);
  }
  order.__categories__ = kept;
  return order.__categories__;
}

function urgentEntryRank(entry){
  const rank = { overdue:0, today:1, tomorrow:2 };
  return entry.status && rank[entry.status] !== undefined ? rank[entry.status] : 3;
}

function compareUrgentEntries(a, b){
  const ra = urgentEntryRank(a), rb = urgentEntryRank(b);
  if(ra !== rb) return ra - rb;
  if(a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1;
  if(a.due && !b.due) return -1;
  if(!a.due && b.due) return 1;
  return 0;
}

// Toute entrée déjà connue garde exactement sa position manuelle
// (glisser-déposer), sans jamais être retriée ensuite. Une entrée qui
// vient d'apparaître arrive tout en haut de la liste (avant toutes les
// entrées déjà connues), triée avec les autres nouveautés du même
// passage selon leur urgence/échéance.
function getUrgentOrder(entries){
  const byKey = new Map(entries.map(e => [e.key, e]));
  // L'ordre de la case urgente est relu sur le disque et réenregistré : avant
  // la 5.9 il ne vivait qu'en mémoire et se perdait dès qu'une autre action
  // relisait l'ordre (ajout, déplacement…), si bien qu'une nouvelle tâche
  // urgente atterrissait n'importe où au lieu d'en haut.
  const disk = loadOrder();
  const existing = disk.__urgent__ || order.__urgent__ || [];
  // 5.10 : une tâche déjà présente dans la case qui ARRIVE à l'échéance
  // (veille, jour J ou retard) remonte une fois en tête, comme une nouvelle.
  // __urgentDue__ retient celles déjà remontées pour ne pas les remonter à
  // chaque rendu. Premier passage : on note l'existant sans rien bouger.
  const isDueNow = e => isDueUrgent(e.due);
  const firstRun = !Array.isArray(disk.__urgentDue__);
  const promoted = new Set(firstRun ? [] : disk.__urgentDue__);
  const dueNow = entries.filter(isDueNow).map(e => e.key);
  const toPromote = firstRun ? new Set() : new Set(dueNow.filter(k => !promoted.has(k)));
  const seen = new Set();
  const kept = [];
  existing.forEach(k=>{
    if(byKey.has(k) && !seen.has(k) && !toPromote.has(k)){ kept.push(k); seen.add(k); }
  });
  const fresh = [];
  entries.forEach(e=>{
    if(seen.has(e.key)) return;
    fresh.push(e);
    seen.add(e.key);
  });
  fresh.sort(compareUrgentEntries);
  const result = fresh.map(e => e.key).concat(kept);
  order.__urgent__ = result;
  order.__urgentDue__ = dueNow;
  const changed = JSON.stringify(disk.__urgent__ || []) !== JSON.stringify(result)
    || JSON.stringify(disk.__urgentDue__ || null) !== JSON.stringify(dueNow);
  if(changed){
    disk.__urgent__ = result;
    disk.__urgentDue__ = dueNow;
    saveOrder(disk);
  }
  return result;
}

// Même principe que getUrgentOrder, mais pour la section « En cours ».
function getWaitingOrder(rows){
  // 5.18 : ordre enregistré (comme la case urgente) ; une tâche qui arrive
  // en cours se place en haut, les autres gardent leur place manuelle.
  const byKey = new Map(rows.map(r => [r.key, r.eff]));
  const disk = loadOrder();
  const existing = disk.__waiting__ || order.__waiting__ || [];
  const seen = new Set();
  const kept = [];
  existing.forEach(k=>{
    if(byKey.has(k) && !seen.has(k)){ kept.push(k); seen.add(k); }
  });
  const fresh = rows.filter(r => !seen.has(r.key)).map(r => r.key);
  const result = fresh.concat(kept);
  order.__waiting__ = result;
  if(JSON.stringify(disk.__waiting__ || []) !== JSON.stringify(result)){
    disk.__waiting__ = result;
    saveOrder(disk);
  }
  return result;
}

function collectUrgentItems(){
  const out = [];
  DATA.forEach(cat=>{
    const items = getEffectiveItems(cat);
    items.forEach((base,i)=>{
      const key = itemKey(cat.id, i);
      if(isDeleted(key)) return;
      if(state[key]) return;
      const eff = getEffective(key, base);
      if(eff.egg) return;
      const relance = isRelance(eff);
      if(eff.waiting && !relance) return;
      const shown = eff.waiting ? eff.relance : eff.due; // en cours : seule la relance compte
      const status = dueStatus(shown);
      const dueUrgent = !eff.waiting && isDueUrgent(eff.due);
      if(relance || eff.urgent || dueUrgent){
        out.push({ key, catId: cat.id, catTitle: cat.title, text: eff.t, due: shown, status, isRdv: isRdvTitle(eff.t), manual: !!eff.urgent, relance });
      }
    });
  });
  const manualOrder = getUrgentOrder(out);
  out.sort((a,b)=> manualOrder.indexOf(a.key) - manualOrder.indexOf(b.key));
  return out;
}

// ---------- glisser-déposer avec prévisualisation en direct ----------
let dragState = null; // { el, value, dragMode, cat }

function flipMove(parent, moveFn){ flipMoveMulti([parent], moveFn); }
function flipMoveMulti(parents, moveFn){
  const children = [];
  new Set(parents).forEach(p=>{ if(p) children.push(...p.children); });
  const firstRects = new Map();
  children.forEach(el => firstRects.set(el, el.getBoundingClientRect()));
  moveFn();
  children.forEach(el=>{
    const firstRect = firstRects.get(el);
    if(!firstRect || !el.isConnected) return;
    const lastRect = el.getBoundingClientRect();
    const dy = firstRect.top - lastRect.top;
    const dx = firstRect.left - lastRect.left; // 0 pour les lignes ; utile pour la grille des listes
    if(Math.abs(dy) < 0.5 && Math.abs(dx) < 0.5) return;
    el.style.transition = "none";
    el.style.transform = `translate(${dx}px, ${dy}px)`;
    void el.offsetHeight; // force reflow avant de relâcher la transition
    requestAnimationFrame(()=>{
      el.style.transition = "transform 240ms cubic-bezier(0.22, 1, 0.36, 1)";
      el.style.transform = "";
    });
  });
}

// Glisser-déposer via Pointer Events (souris ET tactile unifiés) : l'API
// HTML5 drag-and-drop native ne se déclenche pas au doigt sur iOS/Android,
// donc on déplace la ligne nous-mêmes en suivant le pointeur.
//
// La capture du pointeur est posée sur <html> (un nœud stable qui ne bouge
// jamais), PAS sur la poignée elle-même : la poignée est réinsérée ailleurs
// dans le DOM à chaque fois que la ligne change de position pendant le
// glissement, et poser la capture sur un élément qu'on déplace ainsi peut la
// rendre instable selon les navigateurs — la capture pouvait alors se perdre
// après le tout premier déplacement, ce qui limitait le geste à une seule
// ligne à la fois et cassait la fluidité de l'animation. Avec la capture
// fixée sur <html>, un seul jeu d'écouteurs globaux (posés une fois plus bas)
// suit tout le geste, quel que soit le nombre de lignes franchies.
function wireDragRow(li, value, dragMode, cat){
  li.dataset.dragId = value;
  li.dataset.dragMode = dragMode;
  const grip = li.querySelector(".drag-handle");

  grip.addEventListener("pointerdown", (e)=>{
    if(e.pointerType === "mouse" && e.button !== 0) return;
    if(dragState || editingKey || addingCat || addingCategory || editingCategoryTitle) return;
    e.preventDefault();
    try{ document.documentElement.setPointerCapture(e.pointerId); }catch(err){}
    if(dragMode === "category"){
      // 7.1 : comme pour les listes, un fantôme suit le pointeur et la ligne
      // devient l'emplacement en pointillés, qui peut changer de liste.
      const r = li.getBoundingClientRect();
      const ghost = li.cloneNode(true);
      ghost.classList.remove("just-checked");
      ghost.classList.add("row-ghost");
      ghost.querySelectorAll("[id]").forEach(n => n.removeAttribute("id"));
      ghost.style.width = r.width + "px";
      ghost.style.height = r.height + "px";
      ghost.style.left = r.left + "px";
      ghost.style.top = r.top + "px";
      document.body.appendChild(ghost);
      dragState = { el: li, value, dragMode, cat, pointerId: e.pointerId,
        ghost, startX: e.clientX, startY: e.clientY, ghostLeft: r.left, ghostTop: r.top };
      li.classList.add("dragging-row");
      document.body.classList.add("dragging-lists");
      return;
    }
    dragState = { el: li, value, dragMode, cat, pointerId: e.pointerId };
    li.classList.add("dragging");
  });
}

// Le déplacement réel (mesure + réinsertion + animation FLIP) est coalescé
// sur requestAnimationFrame : des pointermove peuvent arriver plusieurs fois
// par frame, et enchaîner plusieurs réinsertions/animations dans la même
// frame les fait se marcher dessus (transform pas encore retombé à zéro
// quand la mesure suivante démarre) — d'où une animation saccadée. Un seul
// passage par frame, avec la position la plus récente, règle les deux soucis.
let dragMovePos = null;
let dragMoveScheduled = false;

function scheduleDragPointerMove(x, y){
  dragMovePos = { x, y };
  if(dragMoveScheduled) return;
  dragMoveScheduled = true;
  requestAnimationFrame(()=>{
    dragMoveScheduled = false;
    if(!dragState || !dragMovePos) return;
    handleDragPointerMove(dragMovePos.x, dragMovePos.y);
  });
}

// Glisser une liste entière (5.16) : même mécanique que pour les tâches
// (capture du pointeur, réinsertion + animation FLIP), mais sur les cartes,
// en deux dimensions (grille). Seul l'ordre des cartes change à l'arrivée,
// jamais leur contenu.
function wireDragCard(card, grip, catIdx){
  card.dataset.dragId = String(catIdx);
  card.dataset.dragMode = "lists";
  if(!grip) return;
  grip.addEventListener("pointerdown", (e)=>{
    if(e.pointerType === "mouse" && e.button !== 0) return;
    if(editingKey || addingCat || editingCategoryTitle || dragState) return;
    e.preventDefault();
    try{ document.documentElement.setPointerCapture(e.pointerId); }catch(err){}
    // 5.17 : un « fantôme » de la carte suit le pointeur, et la carte
    // elle-même devient l'emplacement en pointillés qui se déplace dans la
    // grille (c'est lui qui « aimante » la place d'arrivée).
    const r = card.getBoundingClientRect();
    const ghost = card.cloneNode(true);
    ghost.removeAttribute("id");
    ghost.querySelectorAll("[id]").forEach(n => n.removeAttribute("id"));
    ghost.classList.add("card-ghost");
    ghost.style.width = r.width + "px";
    ghost.style.height = r.height + "px";
    ghost.style.left = r.left + "px";
    ghost.style.top = r.top + "px";
    document.body.appendChild(ghost);
    dragState = { el: card, value: String(catIdx), dragMode: "lists", cat: null, pointerId: e.pointerId,
      ghost, startX: e.clientX, startY: e.clientY, ghostLeft: r.left, ghostTop: r.top, w: r.width, h: r.height };
    card.classList.add("dragging-card");
    document.body.classList.add("dragging-lists");
  });
}

// Grille des listes : on cherche la carte dont le centre est le plus proche
// du centre du fantôme, et l'emplacement va s'y loger dès que le fantôme en
// est assez près — avant que la carte soit exactement dessus (effet aimant).
// Position « de mise en page » d'une carte, sans l'animation en cours :
// mesurer pendant une transition donnerait une carte encore à son ancienne
// place, et l'emplacement ferait des allers-retours.
function layoutRect(c){
  const op = c.offsetParent;
  const pr = op ? op.getBoundingClientRect() : { left:0, top:0 };
  const left = pr.left + (op ? op.clientLeft : 0) + c.offsetLeft;
  const top = pr.top + (op ? op.clientTop : 0) + c.offsetTop;
  return { left, top, width:c.offsetWidth, height:c.offsetHeight };
}
function handleListDragMove(x, y){
  const d = dragState;
  const dx = x - d.startX, dy = y - d.startY;
  d.ghost.style.transform = `translate(${dx}px, ${dy}px) rotate(-1deg) scale(1.02)`;
  const gx = d.ghostLeft + dx + d.w / 2, gy = d.ghostTop + dy + d.h / 2;
  // petit défilement automatique près des bords de la fenêtre
  if(y < 50) window.scrollBy(0, -14); else if(y > window.innerHeight - 50) window.scrollBy(0, 14);
  const parent = d.el.parentElement;
  const cards = Array.from(parent.children).filter(n => n.dataset && n.dataset.dragMode === "lists");
  let best = null, bestDist = Infinity;
  cards.forEach(c=>{
    const r = layoutRect(c);
    const dist = Math.hypot(gx - (r.left + r.width/2), gy - (r.top + r.height/2));
    if(dist < bestDist){ bestDist = dist; best = c; }
  });
  if(!best || best === d.el) return;
  const r = layoutRect(best);
  if(bestDist > Math.max(r.width, r.height) * 0.7) return; // trop loin : pas encore aimanté
  const idxBest = cards.indexOf(best), idxEl = cards.indexOf(d.el);
  flipMove(parent, ()=>{
    parent.insertBefore(d.el, idxEl < idxBest ? best.nextSibling : best);
  });
}

function handleRowDragMove(x, y){
  const d = dragState;
  d.ghost.style.transform = `translate(${x - d.startX}px, ${y - d.startY}px) rotate(-0.6deg)`;
  if(y < 50) window.scrollBy(0, -14); else if(y > window.innerHeight - 50) window.scrollBy(0, 14);
  const target = document.elementFromPoint(x, y);
  if(!target) return;
  const card = target.closest(".category");
  if(!card) return;
  const ul = card.querySelector("ul.items");
  if(!ul) return;
  const rows = Array.from(ul.children).filter(n => n.dataset && n.dataset.dragMode === "category" && n !== d.el);
  let before = null;
  for(const r of rows){
    const lr = layoutRect(r);
    if(y < lr.top + lr.height / 2){ before = r; break; }
  }
  const ref = before || (rows.length ? rows[rows.length - 1].nextSibling : null);
  if(d.el.parentElement === ul && (d.el === ref || d.el.nextSibling === ref)) return;
  flipMoveMulti([d.el.parentElement, ul], ()=>{ ul.insertBefore(d.el, ref); });
}

function endDragGesture(){
  if(!dragState || dragState.dropping) return;
  if(dragState.ghost){
    // le fantôme vient se poser dans son emplacement, puis on enregistre
    const d = dragState;
    d.dropping = true;
    const r = layoutRect(d.el);
    d.ghost.style.transition = "transform 200ms cubic-bezier(0.22, 1, 0.36, 1), opacity 200ms ease";
    d.ghost.style.transform = `translate(${r.left - d.ghostLeft}px, ${r.top - d.ghostTop}px)`;
    setTimeout(()=>{
      d.ghost.remove();
      d.el.classList.remove("dragging-card", "dragging-row");
      document.body.classList.remove("dragging-lists");
      commitDragOrder();
    }, 200);
    return;
  }
  dragState.el.classList.remove("dragging", "dragging-card");
  document.body.classList.remove("dragging-lists");
  commitDragOrder();
}

function cancelDragGesture(){
  if(!dragState) return;
  if(dragState.ghost) dragState.ghost.remove();
  dragState.el.classList.remove("dragging", "dragging-card", "dragging-row");
  document.body.classList.remove("dragging-lists");
  dragState = null;
  renderAll();
}

function handleDragPointerMove(x, y){
  if(!dragState || dragState.dropping) return;
  if(dragState.ghost){ if(dragState.dragMode === "lists") handleListDragMove(x, y); else handleRowDragMove(x, y); return; }
  const target = document.elementFromPoint(x, y);
  if(!target) return;
  const li = dragState.dragMode === "lists"
    ? target.closest('[data-drag-mode="lists"]')
    : target.closest("[data-drag-id]");
  if(!li || li.dataset.dragMode !== dragState.dragMode) return;
  const parent = li.parentElement;
  if(dragState.el.parentElement !== parent) return;
  if(dragState.el === li) return;
  const rect = li.getBoundingClientRect();
  let after = (y - rect.top) > rect.height / 2;
  if(dragState.dragMode === "lists"){
    // grille : sur une même rangée, c'est la position gauche/droite qui compte
    const elRect = dragState.el.getBoundingClientRect();
    const sameRow = Math.abs(elRect.top - rect.top) < 8;
    if(sameRow) after = (x - rect.left) > rect.width / 2;
  }
  const alreadyThere = after ? (li.nextSibling === dragState.el) : (li.previousSibling === dragState.el);
  if(alreadyThere) return;
  flipMove(parent, ()=>{
    parent.insertBefore(dragState.el, after ? li.nextSibling : li);
  });
}

function commitDragOrder(){
  if(!dragState) return;
  // Copie fraîche de l'ordre avant d'écrire, pour ne pas écraser un
  // réordonnancement fait entre-temps dans une autre catégorie (même
  // logique que pour les cases à cocher : voir plus haut).
  order = loadOrder();
  const { el, value, dragMode, cat } = dragState;
  if(dragMode === "lists"){
    // Ordre visible des cartes, reporté dans l'ordre complet (les listes
    // supprimées gardent leur place, on n'y touche pas).
    const domOrder = Array.from(el.parentElement.children)
      .filter(node => node.dataset && node.dataset.dragMode === "lists")
      .map(node => parseInt(node.dataset.dragId, 10));
    const visible = new Set(domOrder);
    const full = getCategoryOrder().slice();
    let j = 0;
    order.__categories__ = full.map(i => visible.has(i) ? domOrder[j++] : i);
  }else if(dragMode === "category"){
    // 7.1 : ordre relu dans le DOM (affiché), puis retraduit en ordre
    // enregistré (voir applyCatDisplayOrder) ; si la ligne a atterri dans une
    // autre liste, la tâche y est d'abord recopiée.
    const destCard = el.closest(".category");
    const destCat = destCard ? DATA.find(c => "cat-" + c.id === destCard.id) : null;
    const domRows = Array.from(el.parentElement.children)
      .filter(node => node.dataset && node.dataset.dragMode === "category");
    if(!destCat || destCat.id === cat.id){
      applyCatDisplayOrder(cat, domRows.map(node => parseInt(node.dataset.dragId, 10)));
    }else{
      const newIdx = moveItemToCategory(cat, parseInt(value, 10), destCat);
      if(newIdx !== null){
        applyCatDisplayOrder(destCat, domRows.map(node => node === el ? newIdx : parseInt(node.dataset.dragId, 10)));
        actionToast("moveCat");
      }
    }
  }else{
    // Urgents et « En cours » : on reconstruit l'ordre complet directement
    // depuis le DOM (l'ordre visible juste après le glissement), au lieu
    // d'insérer une seule valeur dans le tableau stocké. Ce dernier pouvait
    // être incomplet — il n'enregistrait que les lignes déjà déplacées une
    // fois — si bien que déplacer une ligne renvoyait les autres à leur tri
    // automatique et le déplacement « sautait ». C'était ça, le bug.
    const orderKey = dragMode === "waiting" ? "__waiting__" : "__urgent__";
    order[orderKey] = Array.from(el.parentElement.children)
      .filter(node => node.dataset && node.dataset.dragId && node.dataset.dragMode === dragMode)
      .map(node => node.dataset.dragId);
  }
  saveOrder(order);
  dragState = null;
  renderAll();
}

function renderUrgentBanner(){
  const el = document.getElementById("urgentBanner");
  const list = collectUrgentItems();
  el.classList.toggle("calm", list.length === 0);
  if(list.length === 0){
    const hasList = hasAnyList();
    el.hidden = !hasList;
    el.innerHTML = hasList ? `
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.6 2.5L16 9.5"/></svg>
      <div class="urgent-banner-body"><div class="urgent-banner-title">Rien d'urgent pour l'instant</div></div>` : "";
    return;
  }
  el.hidden = false;
  el.innerHTML = `
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <div class="urgent-banner-body">
      <div class="urgent-banner-title">${list.length === 1 ? "1 point urgent" : list.length + " points urgents"}</div>
      <ul class="urgent-list"></ul>
    </div>
  `;
  const ul = el.querySelector(".urgent-list");
  list.forEach(entry=>{
    const li = document.createElement("li");

          : `<button type="button" class="waiting-btn" aria-label="Classé, suivi en cours" data-tip="Classé, suivi en cours">&#8618;</button>`}
        ${entry.manual ? `<button type="button" class="urgent-btn active" aria-label="Ne plus marquer urgent" data-tip="Ne plus marquer urgent">${triangleSvg(15)}</button>` : ""}

    `;
    li.querySelector(".urgent-jump").addEventListener("click", ()=>{
      const cardEl = document.getElementById("cat-" + entry.catId);
      if(cardEl) cardEl.scrollIntoView({behavior:"smooth", block:"center"});

    li.querySelector(".urgent-check").addEventListener("click", (e)=>{
      e.stopPropagation();
      setDone(entry.key, true); // raccourci : cocher directement depuis la case urgente
    });
    if(entry.relance){
      li.querySelector(".urgent-actions .back-btn").addEventListener("click", (e)=>{ e.stopPropagation(); askBringBack(e.currentTarget, entry.key); });
      const pb = li.querySelector(".urgent-actions .postpone-btn");
      pb.addEventListener("click", (e)=>{ e.stopPropagation(); askRelance(pb, entry.key); });
    }else{
      const wb = li.querySelector(".urgent-actions .waiting-btn");
      wb.addEventListener("click", (e)=>{ e.stopPropagation(); askRelance(wb, entry.key); });
    }
    const unUrgent = li.querySelector(".urgent-actions .urgent-btn");
    if(unUrgent) unUrgent.addEventListener("click", (e)=>{
      e.stopPropagation();

      overrides[entry.key].urgent = false;
      saveOverrides(overrides);
      currentProgressMsg = null;
      renderAll();
    });
    wireDragRow(li, entry.key, "urgent", null);
    ul.appendChild(li);
  });
}

// ---------- trèfle : deux petites tâches proposées chaque jour ----------
// Rien n'est stocké : le choix est recalculé à partir de la date du jour.
// Chaque tâche reçoit une note tirée d'un hachage (date + identifiant) ; les
// deux meilleures gagnent, avec un avantage aux plus anciennes de chaque case.
// La note d'une tâche ne dépend que d'elle : en cocher une ne change pas
// l'autre, la suivante prend simplement sa place.
// Écartées : urgentes, échéance proche, RDV, « en cours », cochées.
const LUCKY_LEAD = "Une petite en douceur sur le pouce ?";
function hashStr(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
// Le tirage du jour est mémorisé (clé à part, sans lien avec les tâches
// elles-mêmes) : une proposition cochée reste affichée, grisée, au lieu
// d'être remplacée — c'est le petit trophée de la journée.
const LUCKY_KEY = "fauconnerie-v2-lucky";
function drawLuckyKeys(reroll, exclude){
  const today = todayISO();
  const salt = reroll ? today + "#" + reroll : today;
  const skip = new Set(exclude || []);
  const pool = [];
  getCategoryOrder().forEach(catIdx=>{
    const cat = DATA[catIdx];
    if(!cat || isCategoryDeleted(cat.id)) return;
    const items = getEffectiveItems(cat);
    const n = items.length;
    items.forEach((base, i)=>{
      const key = itemKey(cat.id, i);
      if(isDeleted(key) || state[key]) return;
      const eff = getEffective(key, base);
      if(eff.waiting || eff.urgent || eff.egg || isRdvTitle(eff.t)) return;
      if(isDueUrgent(eff.due)) return;
      const age = n > 1 ? i / (n - 1) : 0; // 0 = la plus ancienne de sa case
      const score = (hashStr(salt + "|" + key) / 4294967296) * (0.5 + age);
      pool.push({ key, score, skip: skip.has(key) });
    });
  });
  pool.sort((a,b)=> a.score - b.score);
  // nouveau tirage : on évite les deux d'avant, sauf s'il n'y a pas assez de tâches
  const fresh = pool.filter(p => !p.skip);
  const pick = fresh.length >= 2 ? fresh : fresh.concat(pool.filter(p => p.skip));
  return pick.slice(0, 2).map(p => p.key);
}
function rerollLucky(){
  const saved = loadJSONKey(LUCKY_KEY, null);
  const today = todayISO();
  const prev = (saved && saved.date === today && Array.isArray(saved.keys)) ? saved.keys : [];
  const reroll = ((saved && saved.date === today && saved.reroll) || 0) + 1;
  const keys = drawLuckyKeys(reroll, prev);
  saveJSONKey(LUCKY_KEY, { date: today, keys, reroll, chosen: null });
  renderLuckyLine();
  noteUndoPoint();
}
function luckyEntry(key){
  const sep = key.lastIndexOf(":");
  const cat = DATA.find(c => c.id === key.slice(0, sep));
  const idx = parseInt(key.slice(sep + 1), 10);
  if(!cat || isCategoryDeleted(cat.id) || isDeleted(key)) return null;
  const base = getEffectiveItems(cat)[idx];
  if(!base) return null;
  const eff = getEffective(key, base);
  return { key, cat, text: eff.t, done: !!state[key] };
}
// Une proposition encore valable ? (existe toujours, et n'est pas devenue
// urgente, en cours, en couvaison, un RDV ou proche de l'échéance)
function luckyStillEligible(key){
  const sep = key.lastIndexOf(":");
  const cat = DATA.find(c => c.id === key.slice(0, sep));
  if(!cat || isCategoryDeleted(cat.id) || isDeleted(key)) return false;
  const base = getEffectiveItems(cat)[parseInt(key.slice(sep + 1), 10)];
  if(!base) return false;
  const eff = getEffective(key, base);
  return !(eff.waiting || eff.urgent || eff.egg || isRdvTitle(eff.t) || isDueUrgent(eff.due));
}
function collectLuckyPicks(){
  const today = todayISO();
  const saved = loadJSONKey(LUCKY_KEY, null);
  if(saved && saved.date === today && Array.isArray(saved.keys)){
    // 5.16 : avant, si une des deux tâches du jour disparaissait (effacée,
    // déplacée de case, purgée, passée urgente…), le trèfle restait boiteux
    // avec une seule proposition jusqu'au lendemain. On complète désormais.
    let keys = saved.keys.filter(k => luckyEntry(k) && (state[k] || luckyStillEligible(k)));
    const dayDone = keys.some(k => state[k]);
    if(!dayDone && keys.length < 2){
      const extra = drawLuckyKeys(saved.reroll || 0, keys).filter(k => !keys.includes(k));
      keys = keys.concat(extra).slice(0, 2);
    }
    if(JSON.stringify(keys) !== JSON.stringify(saved.keys)){
      saved.keys = keys;
      if(saved.chosen && !keys.includes(saved.chosen)) saved.chosen = null;
      saveJSONKey(LUCKY_KEY, saved);
    }
    if(keys.length) return keys.map(luckyEntry).filter(Boolean);
  }
  const keys = drawLuckyKeys();
  saveJSONKey(LUCKY_KEY, { date: today, keys });
  return keys.map(luckyEntry).filter(Boolean);
}
function getLuckyChosen(){
  const saved = loadJSONKey(LUCKY_KEY, null);
  return saved && saved.date === todayISO() ? (saved.chosen || null) : null;
}
function setLuckyChosen(key){
  const saved = loadJSONKey(LUCKY_KEY, null);
  if(!saved || saved.date !== todayISO()) return;
  saved.chosen = key;
  saveJSONKey(LUCKY_KEY, saved);
}
let luckyWasShown = null; // null : premier affichage de la page, sans animation
function renderLuckyLine(){
  const el = document.getElementById("luckyLine");
  if(!el) return;
  // 7.16 : pas de case douceur tant qu'il y a moins de 3 tâches dans les listes
  let liveCount = 0;
  DATA.forEach(cat=>{
    if(isCategoryDeleted(cat.id)) return;
    getEffectiveItems(cat).forEach((base, i)=>{
      const k = itemKey(cat.id, i);
      if(!isDeleted(k) && !getEffective(k, base).waiting) liveCount++;
    });
  });
  if(liveCount < 3){
    const saved = loadJSONKey(LUCKY_KEY, null);
    if(saved && saved.date === todayISO() && !(saved.keys || []).some(k => state[k])){
      try{ localStorage.removeItem(LUCKY_KEY); }catch(e){} // tirage refait à la 3e tâche
    }
    el.hidden = true; el.innerHTML = ""; luckyWasShown = false; return;
  }
  const picks = collectLuckyPicks();
  if(!picks.length){ el.hidden = true; el.innerHTML = ""; luckyWasShown = false; return; }
  if(!luckyWasShown && luckyWasShown !== null){
    el.classList.remove("pop-in"); void el.offsetWidth; el.classList.add("pop-in");
  }
  luckyWasShown = true;
  el.hidden = false;
  const done = picks.some(p => p.done);
  el.classList.toggle("done", done);
  const leaf = `<path d="M16 15.2C12.6 13.4 8.7 10.6 8.9 7.1 9.1 4.3 12.4 3.2 14.5 5.1 15.2 5.7 15.7 6.4 16 7.2 16.3 6.4 16.8 5.7 17.5 5.1 19.6 3.2 22.9 4.3 23.1 7.1 23.3 10.6 19.4 13.4 16 15.2Z"/>`;
  const half = `<path d="M16 15.2C12.6 13.4 8.7 10.6 8.9 7.1 9.1 4.3 12.4 3.2 14.5 5.1 15.2 5.7 15.7 6.4 16 7.2Z"/>`;
  const rot = [45, 135, 225, 315];
  const clover = `<svg class="lucky-clover" viewBox="0 0 32 33" aria-hidden="true">
    <path d="M16 17C16.4 22 17.8 26.6 21 31.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    <g fill="currentColor" stroke="var(--surface)" stroke-width="0.8" stroke-linejoin="round">
      ${rot.map(r=>`<g transform="rotate(${r} 16 16)">${leaf}</g>`).join("")}
    </g>
    <g fill="#fff" opacity="0.12">
      ${rot.map(r=>`<g transform="rotate(${r} 16 16)">${half}</g>`).join("")}
    </g>
    <g fill="none" stroke="#fff" stroke-width="0.6" stroke-linecap="round" opacity="0.25">
      ${rot.map(r=>`<path transform="rotate(${r} 16 16)" d="M16 14V8.6"/>`).join("")}
    </g>
  </svg>`;
  // la tâche retenue : celle qui est faite, sinon celle qu'on a choisie d'un clic
  const donePick = picks.find(p => p.done);
  const chosenKey = getLuckyChosen();
  const winner = donePick ? donePick.key : (picks.some(p => p.key === chosenKey) ? chosenKey : null);
  el.innerHTML =
    `<div class="lucky-head">${clover}<span class="lucky-lead">${done ? "Trèfle du jour fait !" : LUCKY_LEAD}</span>` +
    (done ? "" : `<button type="button" class="lucky-reroll" aria-label="Deux autres propositions"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 3.5V8h4.5"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20.5V16h-4.5"/></svg></button>`) +
    `</div>` +
    `<div class="lucky-opts">` +
    picks.map((p, i) => {
      const or = (i && !winner) ? `<span class="lucky-or">ou</span>` : "";
      const title = escapeAttr(p.cat.title);
      if(p.key === winner){
        return or + `<div class="lucky-pick chosen${p.done ? " won" : ""}" data-key="${escapeAttr(p.key)}" title="${title}">` +
          `<input type="checkbox" class="lucky-check" aria-label="Cocher la tâche"${p.done ? " checked" : ""}>` +
          `<span class="lucky-pick-text">${escapeAttr(p.text)}</span></div>`;
      }
      return or + `<button type="button" class="lucky-pick${winner ? " dim" : ""}" data-key="${escapeAttr(p.key)}" title="${title}"${done ? " disabled" : ""}>` +
        `<span class="lucky-pick-text">${escapeAttr(p.text)}</span></button>`;
    }).join("") +
    `</div>`;
  el.querySelectorAll("button.lucky-pick").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      setLuckyChosen(btn.dataset.key);
      renderLuckyLine();
      noteUndoPoint();
    });
  });
  // clic dans le fond de la case (hors des deux tâches) : on annule le choix
  // et on revient au départ, avec le « ou » — seulement tant que rien n'est coché
  el.onclick = (e)=>{
    if(done || !winner || e.target.closest(".lucky-pick, .lucky-reroll")) return;
    setLuckyChosen(null);
    renderLuckyLine();
    noteUndoPoint();
  };
  el.classList.toggle("can-reset", !done && !!winner);
  const reroll = el.querySelector(".lucky-reroll");
  if(reroll) reroll.addEventListener("click", (e)=>{ e.stopPropagation(); rerollLucky(); });
  const check = el.querySelector(".lucky-check");
  if(check){
    check.addEventListener("change", (e)=>{
      e.stopPropagation();
      setDone(check.closest(".lucky-pick").dataset.key, check.checked);
    });
  }
}

// Icônes dessinées à plusieurs endroits : l'œuf (couvaison) et le triangle (urgent).
const eggSvg = size => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="egg" d="M12 2.8c-3.7 0-6.6 5.6-6.6 10.6A6.6 6.6 0 0 0 12 21.2a6.6 6.6 0 0 0 6.6-7.8C18.6 8.4 15.7 2.8 12 2.8z"/><circle class="speck" cx="10" cy="11" r=".8" fill="currentColor" stroke="none"/><circle class="speck" cx="14" cy="14.5" r=".8" fill="currentColor" stroke="none"/><circle class="speck" cx="10.8" cy="16.6" r=".6" fill="currentColor" stroke="none"/></svg>`;
const triangleSvg = size => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="tri" d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5"/><path d="M12 17.4v.2"/></svg>`;
const EGG_TIP = { on:"En couvaison — cliquer pour retirer", off:"Mettre en couvaison" };
const URGENT_TIP = { on:"Urgent — cliquer pour retirer", off:"Marquer comme urgent" };
// L'œuf et le triangle en bas à droite des formulaires (création, modification, nouvelle liste).
function formToggles(egg, urgent){
  return `<button type="button" class="edit-egg${egg ? " active" : ""}" aria-pressed="${egg ? "true" : "false"}" aria-label="En couvaison" data-tip="${egg ? EGG_TIP.on : EGG_TIP.off}">${eggSvg(16)}</button>
          <button type="button" class="edit-urgent${urgent ? " active" : ""}" aria-pressed="${urgent ? "true" : "false"}" aria-label="Urgent" data-tip="${urgent ? URGENT_TIP.on : URGENT_TIP.off}">${triangleSvg(16)}</button>`;
}

// Triangle « urgent » dans les formulaires de création / modification :
// un simple interrupteur, lu au moment d'enregistrer.
function wireEditUrgent(li){
  // Triangle « urgent » et œuf « en couvaison » : deux interrupteurs qui
  // s'excluent (allumer l'un éteint l'autre), lus au moment d'enregistrer.
  const make = (sel, tipOn, tipOff)=>{
    const b = li.querySelector(sel);
    const st = { b, on: b.classList.contains("active") };
    st.set = (v)=>{
      st.on = v;
      b.classList.toggle("active", v);
      b.setAttribute("aria-pressed", v ? "true" : "false");
      b.dataset.tip = v ? tipOn : tipOff;
    };
    return st;
  };
  const urg = make(".edit-urgent", URGENT_TIP.on, URGENT_TIP.off);
  const egg = make(".edit-egg", EGG_TIP.on, EGG_TIP.off);
  urg.b.addEventListener("click", (e)=>{ e.preventDefault(); urg.set(!urg.on); if(urg.on) egg.set(false); });
  egg.b.addEventListener("click", (e)=>{ e.preventDefault(); egg.set(!egg.on); if(egg.on) urg.set(false); });
  // 7.25 : le clic garde le curseur dans le champ en cours, et Entrée sur
  // un des deux boutons enregistre au lieu de re-basculer le bouton.
  [urg.b, egg.b].forEach(b=>{
    b.addEventListener("mousedown", e=> e.preventDefault());
    b.addEventListener("keydown", e=>{
      if(e.key !== "Enter") return;
      e.preventDefault(); e.stopPropagation();
      const saveBtn = li.querySelector(".edit-save, .add-save, .nl-save");
      if(saveBtn) saveBtn.click();
    });
  });
  return { value: ()=> urg.on, egg: ()=> egg.on };
}

function buildItemLi(cat, idx, base, key, opts){
  opts = opts || {};
  const showOrigin = !!opts.showOrigin;
  const dragMode = opts.dragMode || "category";
  const eff = getEffective(key, base);
  const li = document.createElement("li");

  if(editingKey === key){
    const dueParts = splitDue(eff.waiting ? eff.relance : eff.due);
    const catOptions = DATA.filter(c => !isCategoryDeleted(c.id) || c.id === cat.id)
      .map(c => `<option value="${escapeAttr(c.id)}" ${c.id === cat.id ? "selected" : ""}>${escapeAttr(c.title)}</option>`).join("");
    li.className = "item editing";
    li.innerHTML = `
      <div class="edit-form">
        <input type="text" class="edit-title" value="${escapeAttr(eff.t)}" placeholder="Titre">
        <input type="text" class="edit-note" value="${escapeAttr(eff.note || "")}" placeholder="Détail (optionnel)">
        <div class="edit-label-row">
          <label class="edit-label edit-label-cat">Catégorie
            <select class="edit-cat">${catOptions}</select>
          </label>
          <label class="edit-label edit-label-who">Interlocuteur (optionnel)
            <input type="text" class="edit-who" value="${escapeAttr(eff.who || "")}" placeholder="Nom">
          </label>
        </div>
        <div class="edit-label-row">
          <label class="edit-label">${eff.waiting ? "Relance le" : "Échéance"}
            <input type="date" class="edit-due" value="${escapeAttr(dueParts.date)}">
          </label>
          <label class="edit-label">Heure
            <input type="time" class="edit-due-time" value="${escapeAttr(dueParts.time)}">
          </label>
          <button type="button" class="edit-clear-due" aria-label="Effacer la date et l'heure" title="Effacer la date et l'heure">&times;</button>
        </div>
        <div class="edit-actions">
          <button type="button" class="edit-save">Enregistrer</button>
          <button type="button" class="edit-cancel">Annuler</button>
          ${formToggles(eff.egg, eff.urgent)}
        </div>
      </div>
    `;
    const titleInput = li.querySelector(".edit-title");
    const urgentToggle = wireEditUrgent(li);
    const noteInput = li.querySelector(".edit-note");
    const catSelect = li.querySelector(".edit-cat");
    const dueInput = li.querySelector(".edit-due");
    const dueTimeInput = li.querySelector(".edit-due-time");
    const syncTime = linkTimeToDate(li.querySelector(".edit-due"), dueTimeInput);
    const whoInput = li.querySelector(".edit-who");
    li.querySelector(".edit-clear-due").addEventListener("click", ()=>{
      dueInput.value = "";
      dueTimeInput.value = "";
      syncTime();
      dueInput.focus();
    });
    const save = ()=>{
      try{
        const newTitle = titleInput.value.trim() || base.t;
        const newNote = noteInput.value.trim();
        const newDue = dueInput.value ? (dueTimeInput.value ? dueInput.value + "T" + dueTimeInput.value : dueInput.value) : "";
        const newWho = whoInput.value.trim();
        const targetCatId = catSelect.value;
        if(targetCatId && targetCatId !== cat.id){
          // Changement de catégorie : la tâche change de "case", mais on
          // garde tout ce qui la définit (titre, note, échéance,
          // interlocuteur, urgence, en-attente) — seule sa place change.
          const targetCat = DATA.find(c => c.id === targetCatId);
          if(targetCat){
            customItems = loadCustom();
            order = loadOrder();
            const movedItem = {t:newTitle};
            if(newNote) movedItem.note = newNote;
            const keptDue = eff.waiting ? eff.due : newDue;
            if(keptDue) movedItem.due = keptDue;
            if(eff.waiting) movedItem.relance = newDue;
            if(newWho) movedItem.who = newWho;
            if(urgentToggle.value()) movedItem.urgent = true;
            if(urgentToggle.egg()) movedItem.egg = true;
            if(eff.waiting) movedItem.waiting = true;
            const freshItems = getEffectiveItems(targetCat);
            const newIdx = freshItems.length;
            customItems[targetCat.id] = customItems[targetCat.id] || [];
            customItems[targetCat.id].push(movedItem);
            saveCustom(customItems);
            const ord = getCatOrder(targetCat);
            if(urgentToggle.egg()) ord.push(newIdx); else ord.unshift(newIdx);
            saveOrder(order);
            // La coche cochée doit suivre la tâche déplacée.
            if(state[key]){
              const newKey = itemKey(targetCat.id, newIdx);
              state = loadState();
              state[newKey] = true;
              saveState(state);
              checkedAt = loadJSONKey(CHECKED_AT_KEY, {});
              checkedAt[newKey] = checkedAt[key] || todayISO();
              delete checkedAt[key];
              saveJSONKey(CHECKED_AT_KEY, checkedAt);
            }
            overrides = loadOverrides();
            overrides[key] = overrides[key] || {};
            overrides[key].deleted = true;
            saveOverrides(overrides);
          }
        }else{
          overrides = loadOverrides();
          overrides[key] = overrides[key] || {};
          overrides[key].t = newTitle;
          overrides[key].note = newNote;
          if(eff.waiting){
            overrides[key].due = eff.due || "";   // échéance intacte, masquée
            overrides[key].relance = newDue;
            delete overrides[key].dueBeforeWaiting;
          }else{
            overrides[key].due = newDue;
          }
          overrides[key].who = newWho;
          overrides[key].urgent = urgentToggle.value();
          const becameEgg = urgentToggle.egg() && !eff.egg;
          overrides[key].egg = urgentToggle.egg();
          saveOverrides(overrides);
          if(becameEgg){
            // mise en couvaison : la tâche file en queue de sa liste
            order = loadOrder();
            const arr = getCatOrder(cat).slice();
            const pos = arr.indexOf(idx);
            if(pos > -1){ arr.splice(pos, 1); arr.push(idx); order[cat.id] = arr; saveOrder(order); }
          }
        }
      }catch(err){
        // Même en cas de souci d'enregistrement/synchro, on ne laisse jamais
        // le formulaire bloqué : la modification reste en mémoire et l'écran
        // se referme normalement.
        console.error("[edit] échec de l'enregistrement", err);
      }
      editingKey = null;
      renderAll();
    };
    li.querySelector(".edit-save").addEventListener("click", save);
    li.querySelector(".edit-cancel").addEventListener("click", ()=>{ editingKey = null; renderAll(); });
    [titleInput, noteInput, catSelect, dueInput, dueTimeInput, whoInput].forEach(inp=>{
      inp.addEventListener("keydown", e=>{
        if(e.key === "Enter"){ e.preventDefault(); save(); }
        if(e.key === "Escape"){ editingKey = null; renderAll(); }
      });
    });
    return { el: li, focus: ()=>{ titleInput.focus(); titleInput.select(); } };
  }

  const checked = !!state[key];
  // Une échéance proche (en retard, aujourd'hui, demain) rend la tâche
  // urgente au même titre qu'un marquage manuel — c'est déjà ce qui la fait
  // apparaître dans le bandeau urgent tout en haut (voir collectUrgentItems),
  // donc elle doit avoir le même style ici, dans sa case, pour rester cohérente.
  const dueStatusNow = (eff.due && !checked && !eff.waiting) ? dueStatus(eff.due) : null;
  const isDueUrgentNow = !!dueStatusNow && isDueUrgent(eff.due);
  // « En cours » : l'échéance ne rend plus urgent (on attend les autres) ;
  // seul un marquage manuel donne l'aspect urgent.
  const isUrgent = !eff.egg && (eff.urgent || (!eff.waiting && isDueUrgentNow));
  // N'anime que la tâche qu'on vient tout juste de cocher (voir justCheckedKey),
  // et une seule fois : les re-rendus suivants retombent sur le trait fixe.
  const justChecked = checked && key === justCheckedKey;
  li.className = "item" + (isRelance(eff) && !checked ? " item-relance" : "") + (isUrgent ? " item-urgent" : "") + (eff.egg && !checked ? " is-egg" : "") + (justChecked ? " just-checked" : "") + (checked ? " is-checked" : "");
  li.dataset.key = key;
  const personTag = eff.person ? `<span class="person-tag${eff.tier ? " tier-" + escapeAttr(eff.tier) : ""}">${escapeAttr(eff.person)}</span>` : "";
  const originTag = showOrigin ? `<span class="urgent-jump-cat">${escapeAttr(cat.title)}</span>` : "";
  const whoTag = eff.who ? `<span class="who-tag">${escapeAttr(eff.who)}</span>` : "";
  const dragHandleHtml = `<span class="drag-handle" aria-label="Glisser pour réordonner" title="Glisser pour déplacer">&#8942;&#8942;</span>`;
  const waitingBtnTitle = eff.waiting ? `Faire revenir dans ${escapeAttr(cat.title)}` : "Classé, suivi en cours";
  const waitingBtnIcon = eff.waiting ? "&#8617;" : "&#8618;";
  const isRdv = isRdvTitle(eff.t);
  // une fois cochée, la tâche est faite : plus de sens à afficher un badge d'échéance (encore moins "en retard")
  const dueBadgeHtml = checked ? ""
    : eff.waiting
      ? (eff.relance ? `<span class="due-badge status-${isRelance(eff) ? "relance" : "future"}">Relance ${shortDateFR(splitDue(eff.relance).date)}</span>` : "")
      : (eff.due ? `<span class="due-badge status-${isRdv ? "rdv" : dueStatusNow}">${formatDueLabel(eff.due, isRdv)}</span>` : "");
  const isEgg = eff.egg && !checked; // en couvaison : pas de case, pas d'urgence, juste l'éclosion
  li.innerHTML = `
    ${dragHandleHtml}
    ${isEgg ? `<span class="egg-dot" title="En couvaison">${eggSvg(20)}</span>` : `<input type="checkbox" ${checked ? "checked" : ""} aria-label="${escapeAttr(eff.t)}">`}
    <span class="item-text">${whoTag}${personTag}<span class="item-title">${escapeAttr(eff.t)}</span>${originTag}${dueBadgeHtml}${eff.note ? `<span class="note">${escapeAttr(eff.note)}</span>` : ""}</span>
    <span class="item-controls">
      <button type="button" class="waiting-btn${eff.waiting ? " active" : ""}" ${checked ? 'disabled tabindex="-1" aria-hidden="true"' : ""} aria-label="${waitingBtnTitle}" data-tip="${waitingBtnTitle}">${waitingBtnIcon}</button>
      ${isEgg ? `<button type="button" class="hatch-btn" aria-label="Faire éclore" data-tip="Faire éclore"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle class="chick" cx="12" cy="8.2" r="3.6"/><path class="beak" d="M15.5 8.1l2 .7-2 .7"/><circle cx="13.1" cy="7.3" r=".55" fill="currentColor" stroke="none"/><path class="shell" d="M5.2 13.6c0 4.3 3 7.6 6.8 7.6s6.8-3.3 6.8-7.6l-2.3 1.5-2.2-1.7-2.3 1.7-2.3-1.7-2.2 1.7z"/></svg></button>` : `<button type="button" class="urgent-btn${eff.urgent ? " active" : ""}" ${checked ? 'disabled tabindex="-1" aria-hidden="true"' : ""} aria-label="${eff.urgent ? "Ne plus marquer urgent" : "Marquer comme urgent"}" data-tip="${eff.urgent ? "Ne plus marquer urgent" : "Marquer comme urgent"}">${triangleSvg(15)}</button>`}
      ${checked
        ? `<button type="button" class="delete-btn" aria-label="Mettre à la corbeille des tâches accomplies" data-tip="Mettre à la corbeille"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>`
        : `<button type="button" class="delete-btn" aria-label="Effacer la tâche" data-tip="Effacer la tâche">&times;</button>`}
    </span>
  `;
  const checkbox = li.querySelector("input");
  if(checkbox) checkbox.addEventListener("change", ()=> setDone(key, checkbox.checked));
  li.querySelector(".item-text").addEventListener("dblclick", ()=>{
    editingKey = key;
    renderAll();
  });
  wireDragRow(li, dragMode === "waiting" ? key : String(idx), dragMode, cat);
  const hatchBtn = li.querySelector(".hatch-btn");
  if(hatchBtn) hatchBtn.addEventListener("click",(e)=>{
    e.stopPropagation();
    overrides = loadOverrides();
    overrides[key] = overrides[key] || {};
    overrides[key].egg = false;
    saveOverrides(overrides);
    actionToast("hatch");
    currentProgressMsg = null;
    renderAll();
  });
  const urgentBtnEl = li.querySelector(".urgent-btn");
  if(urgentBtnEl) urgentBtnEl.addEventListener("click",(e)=>{
    e.stopPropagation();
    overrides = loadOverrides(); // toujours repartir d'une copie fraîche, voir le commentaire sur la case à cocher
    overrides[key] = overrides[key] || {};
    const nowUrgent = !eff.urgent;
    overrides[key].urgent = nowUrgent;
    if(nowUrgent) overrides[key].egg = false; // urgent et en couvaison s'excluent
    saveOverrides(overrides);
    // 8.7 : marquer urgent ne déplace plus la tâche dans sa liste : elle
    // reste où elle est (elle apparaît en plus dans la case urgente).
    actionToast(nowUrgent ? "urgentOn" : "urgentOff");
    renderAll();
  });
  li.querySelector(".delete-btn").addEventListener("click",(e)=>{
    e.stopPropagation();
    // Tâche cochée (poubelle) : elle part dans la corbeille des tâches
    // accomplies. Tâche pas encore faite (croix) : elle est simplement effacée.
    state = loadState();
    checkedAt = loadJSONKey(CHECKED_AT_KEY, {});
    trash = loadJSONKey(TRASH_KEY, []);
    if(!Array.isArray(trash)) trash = [];
    const wasDone = !!state[key];
    if(wasDone) trash.push({
      t: eff.t, note: eff.note || "", who: eff.who || "", due: eff.due || "",
      catId: cat.id, catTitle: cat.title,
      doneOn: wasDone ? (checkedAt[key] || "") : "",
      purgedOn: todayISO(), kind: wasDone ? "done" : "deleted",
    });
    if(wasDone) saveJSONKey(TRASH_KEY, trash);
    if(checkedAt[key]){ delete checkedAt[key]; saveJSONKey(CHECKED_AT_KEY, checkedAt); }
    overrides = loadOverrides();
    overrides[key] = overrides[key] || {};
    overrides[key].deleted = true;
    saveOverrides(overrides);
    actionToast(wasDone ? "trash" : "erase");
    renderAll();
  });
  const waitBtn = li.querySelector(".waiting-btn");
  waitBtn.addEventListener("click",(e)=>{
    e.stopPropagation();
    if(eff.waiting) askBringBack(waitBtn, key);
    else askRelance(waitBtn, key);
  });
  return { el: li, focus: null };
}

function renderWaitingSection(){
  const ul = document.getElementById("waitingList");
  if(!ul) return;
  ul.innerHTML = "";
  const rows = [];
  DATA.forEach(cat=>{
    const items = getEffectiveItems(cat);
    items.forEach((base,i)=>{
      const key = itemKey(cat.id, i);
      if(isDeleted(key)) return;
      const eff = getEffective(key, base);
      if(!eff.waiting) return;
      rows.push({cat, idx:i, base, key, eff});
    });
  });
  if(rows.length === 0){
    const li = document.createElement("li");
    li.className = "empty-note";
    li.textContent = "Encore rien ici";
    ul.appendChild(li);
    return;
  }
  const manualOrder = getWaitingOrder(rows);
  rows.sort((a,b)=> manualOrder.indexOf(a.key) - manualOrder.indexOf(b.key));
  // marquées urgentes à la main : en haut de la case (sans aller dans la case urgente)
  const top = r => r.eff.urgent || isRelance(r.eff);
  const urgentFirst = rows.filter(top).concat(rows.filter(r => !top(r)));
  sortByUrgencyThenChecked(urgentFirst).forEach(row=>{
    const built = buildItemLi(row.cat, row.idx, row.base, row.key, {
      showOrigin:true,
      dragMode:"waiting",
    });
    ul.appendChild(built.el);
    if(built.focus) built.focus();
  });
}

// Tout ce qui se redessine, dans l'ordre.
const RENDERERS = [render, renderWaitingSection, renderAddCategoryRow, updateProgress, renderTrash, renderBackupNudge];
function renderAll(){
  try{ maybeRollover(); }catch(err){ console.error("[semaine]", err); }
  try{
    document.body.classList.toggle("has-editing", !!editingKey || !!addingCat || !!addingCategory || !!editingCategoryTitle);
    RENDERERS.forEach(fn => fn());
  }catch(err){
    // Filet de sécurité : une erreur de rendu (ex : donnée mal formée dans
    // une sauvegarde) ne doit jamais laisser un formulaire (édition, ajout…)
    // bloqué à l'écran sans réaction possible.
    console.error("[render] échec du rendu, réinitialisation des états en cours", err);
    editingKey = null;
    addingCat = null;
    addingCategory = false;
    editingCategoryTitle = null;
    try{
      document.body.classList.remove("has-editing");
      RENDERERS.forEach(fn => fn());
    }catch(err2){
      console.error("[render] échec du filet de sécurité", err2);
    }
  }
  try{ noteUndoPoint(); }catch(err){ console.error("[annuler]", err); }
}

        ${renamingThisCat ? "" : `<label class="cat-quick-wrap" title="Ajouter une tâche"><svg class="cat-quick-pen" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/><path d="M14.5 5.5l3 3"/></svg><input type="text" class="cat-quick" aria-label="Ajouter une tâche à ${escapeAttr(cat.title)}" enterkeyhint="done" autocomplete="off"></label>`}
      </span>
      <span class="cat-head-right">
        <button type="button" class="cat-order${reversed ? " reversed" : ""}" aria-label="${reversed ? "Plus récente en bas — inverser" : "Plus récente en haut — inverser"}" data-tip="${reversed ? "Plus récente en bas" : "Plus récente en haut"}"><svg viewBox="0 0 10 10" width="9" height="9" aria-hidden="true"><path d="M5 1.8 9 8.2H1z" fill="currentColor"/></svg></button>

        ${canDeleteCat ? `<button type="button" class="cat-delete-btn" aria-label="Supprimer cette case vide" title="Supprimer cette case vide">&times;</button>` : ""}

    if(quickInp){
      quickInp.addEventListener("click", e=> e.stopPropagation());
      quickInp.addEventListener("keydown", e=>{

          if(!quickInp.value.trim()) return;
          try{ if(addQuickTask(cat, quickInp.value)) actionToast("add"); }
          catch(err){ console.error("[ajout express] échec", err); }
          quickInp.value = "";
          refocusQuickCat = cat.id;

        if(e.key === "Escape"){ quickInp.value = ""; quickInp.blur(); }

    });
    if(canDeleteCat){
      head.querySelector(".cat-delete-btn").addEventListener("click", (e)=>{
        e.stopPropagation();
        deleteCategory(cat.id);
        renderAll();
      });
    }
    if(renamingThisCat){
      const titleInput = head.querySelector(".cat-title-input");
      const saveTitle = ()=>{
        renameCategory(cat.id, titleInput.value);
        editingCategoryTitle = null;
        renderAll();
      };
      titleInput.addEventListener("click", e=> e.stopPropagation());
      titleInput.addEventListener("keydown", e=>{
        if(e.key === "Enter"){ e.preventDefault(); saveTitle(); }
        if(e.key === "Escape"){ editingCategoryTitle = null; renderAll(); }
      });
      titleInput.focus();
      titleInput.select();
    }else{
      head.querySelector(".cat-title").addEventListener("dblclick", (e)=>{

      const titleInput = li.querySelector(".add-title");

      const noteInput = li.querySelector(".add-note");
      const dueInput = li.querySelector(".add-due");
      const dueTimeInput = li.querySelector(".add-due-time");
      linkTimeToDate(li.querySelector(".add-due"), dueTimeInput);
      const save = ()=>{
        const t = titleInput.value.trim();
        if(!t) return;
        const note = noteInput.value.trim();
        const due = dueInput.value ? (dueTimeInput.value ? dueInput.value + "T" + dueTimeInput.value : dueInput.value) : "";
        const newItem = {t};
        if(note) newItem.note = note;
        if(due) newItem.due = due;
        if(urgentToggle.value()) newItem.urgent = true;
        if(urgentToggle.egg()) newItem.egg = true;
        try{
          insertItem(cat, newItem);
          actionToast("add");
        }catch(err){
          console.error("[ajout] échec de l'enregistrement", err);
        }
        addingCat = null;
        renderAll();
      };
      li.querySelector(".add-save").addEventListener("click", save);
      li.querySelector(".add-cancel").addEventListener("click", ()=>{ addingCat = null; renderAll(); });
      [titleInput, noteInput, dueInput, dueTimeInput].forEach(inp=>{

        });

      if(reversed) ul.appendChild(li); else ul.insertBefore(li, ul.firstChild);
      requestAnimationFrame(()=> titleInput.focus());

    card.appendChild(ul);

  refocusQuickCat = null;

  if(waitingSection) waitingSection.hidden = !hasAnyList();
}

let trashOpen = false;
let trashMsg = null;
const TRASH_MESSAGES = [
  "Un ossuaire de victoires, classé avec la minutie d'un archiviste communal.",
  "Ici reposent des tâches accomplies. Le faisan n'a pas été convié aux funérailles.",
  "Le reliquaire des choses faites : chaque ligne vaut une petite canonisation.",

  "Tableau de chasse homologué, sans un seul faisan dedans. Ou presque.",
  "Le cimetière le plus joyeux de la commune : rien que des affaires classées.",
  "Inventaire après décès de tout ce qui ne traîne plus. Le notaire est ravi.",
];
function formatTrashWeek(monday){
  if(!monday) return "Accomplies avant la corbeille (non datées)";
  const [y,m,d] = monday.split("-");
  const thisMonday = mondayOf(todayISO());
  if(monday === thisMonday) return "Cette semaine";
  if(monday === addDaysISO(thisMonday, -7)) return "Semaine dernière";
  return "Semaine du " + parseInt(d,10) + "/" + parseInt(m,10) + "/" + y;
}
function restoreFromTrash(idx){
  trash = loadJSONKey(TRASH_KEY, []);
  const entry = trash[idx];
  if(!entry) return false;
  let cat = DATA.find(c => c.id === entry.catId);
  if(cat && isCategoryDeleted(cat.id)){
    deletedCategoryIds = loadDeletedCategoryIds().filter(id => id !== cat.id);
    saveDeletedCategoryIds(deletedCategoryIds);
  }
  if(!cat) cat = addCategory(entry.catTitle || "Récupérées");
  if(!cat) return false;
  const item = { t: entry.t || "(sans titre)" };
  if(entry.note) item.note = entry.note;
  if(entry.who) item.who = entry.who;
  if(entry.due) item.due = entry.due;
  const newKey = itemKey(cat.id, insertItem(cat, item));
  state = loadState();
  if(state[newKey]){ delete state[newKey]; saveState(state); }
  // On retire l'entrée de la corbeille seulement une fois la tâche remise.
  trash.splice(idx, 1);
  saveJSONKey(TRASH_KEY, trash);
  return true;
}
// ---------- 6.1 : graphique des tâches accomplies (corbeille) ----------
// Rien de nouveau n'est stocké sur les tâches : on relit les dates de coche
// déjà enregistrées (corbeille + tâches cochées pas encore purgées). Seul le
// choix du switch Jour / Semaine / Mois est mémorisé, sous une clé à part.
const TRASH_CHART_KEY = "fauconnerie-v2-trashchart";
const TC_MODES = { jour:"Jour", semaine:"Semaine", mois:"Mois" };
const MONTHS_FR_SHORT = ["janv","févr","mars","avr","mai","juin","juil","août","sept","oct","nov","déc"];
function getTrashChartMode(){
  try{ const m = localStorage.getItem(TRASH_CHART_KEY); return TC_MODES[m] ? m : "semaine"; }catch(e){ return "semaine"; }
}
function setTrashChartMode(m){ try{ localStorage.setItem(TRASH_CHART_KEY, m); }catch(e){} }
function collectDoneDates(){
  const dates = []; let undated = 0;
  const tr = loadJSONKey(TRASH_KEY, []);
  (Array.isArray(tr) ? tr : []).forEach(e=>{
    if(!e || e.kind === "deleted") return;
    if(e.doneOn) dates.push(e.doneOn); else undated++;
  });
  const st = loadState(), ca = loadJSONKey(CHECKED_AT_KEY, {});
  DATA.forEach(cat=>{
    getEffectiveItems(cat).forEach((base, i)=>{
      const key = itemKey(cat.id, i);
      if(isDeleted(key) || !st[key]) return;
      if(ca[key]) dates.push(ca[key]); else undated++;
    });
  });
  waitLog().forEach(e=>{ if(e && e.on) dates.push(e.on); }); // envois en cours (8.1)
  return { dates, undated };
}
function trashChartBuckets(mode, dates){
  const today = todayISO();
  const keyOf = mode === "jour" ? (d => d) : mode === "semaine" ? mondayOf : (d => d.slice(0, 7));
  const counts = {};
  dates.forEach(d=>{ const k = keyOf(d); counts[k] = (counts[k] || 0) + 1; });
  const buckets = [];
  if(mode === "jour"){
    for(let i = 13; i >= 0; i--){
      const d = addDaysISO(today, -i);
      buckets.push({ key:d, label:String(parseInt(d.slice(8), 10)), sub:weekdayNameFR(d).charAt(0).toUpperCase() });
    }
  }else if(mode === "semaine"){
    const m0 = mondayOf(today);
    for(let i = 11; i >= 0; i--){
      const d = addDaysISO(m0, -7*i);
      buckets.push({ key:d, label:parseInt(d.slice(8), 10) + "/" + parseInt(d.slice(5, 7), 10), sub:"" });
    }
  }else{
    let y = +today.slice(0, 4), m = +today.slice(5, 7);
    for(let i = 0; i < 12; i++){
      buckets.unshift({ key:y + "-" + String(m).padStart(2, "0"), label:MONTHS_FR_SHORT[m-1], sub:(m === 1 ? String(y) : "") });
      m--; if(m === 0){ m = 12; y--; }
    }
  }
  buckets.forEach(b => b.v = counts[b.key] || 0);
  const curKey = buckets[buckets.length - 1].key;
  let record = 0, recordPrev = 0;
  Object.keys(counts).forEach(k=>{
    record = Math.max(record, counts[k]);
    if(k !== curKey) recordPrev = Math.max(recordPrev, counts[k]);
  });
  return { buckets, record, recordPrev };
}
function doneStreak(dates){
  const set = new Set(dates);
  let d = todayISO();
  if(!set.has(d)) d = addDaysISO(d, -1); // la journée n'est pas finie : la série tient encore
  let n = 0;
  while(set.has(d)){ n++; d = addDaysISO(d, -1); }
  return n;
}
function trashChartMessage(mode, cur, prev, recordPrev){
  const W = { jour:["aujourd'hui","hier"], semaine:["cette semaine","la semaine dernière"], mois:["ce mois-ci","le mois passé"] }[mode];
  const Cap = W[0].charAt(0).toUpperCase() + W[0].slice(1);
  if(cur > 0 && cur > recordPrev && recordPrev > 0) return "Record battu " + W[0] + " ! Le bourgmestre fait déjà poser une plaque.";
  if(cur > 0 && cur === recordPrev) return "Record égalé " + W[0] + ". Une de plus et il tombe.";
  if(cur > prev) return Cap + ", déjà " + (cur - prev) + " de plus que " + W[1] + ". Le faisan fulmine.";
  if(cur === prev && cur > 0) return "À égalité avec " + W[1] + ". Une de plus et tu passes devant.";
  if(cur < prev) return (cur > 0 ? "Plus que " : "Encore ") + (prev - cur) + " pour égaler " + W[1] + ".";
  return "Une seule tâche et la barre décolle.";
}
function renderTrashChart(el){
  if(!el) return;
  const mode = getTrashChartMode();
  const { dates, undated } = collectDoneDates();
  const { buckets, record, recordPrev } = trashChartBuckets(mode, dates);
  const n = buckets.length, cur = buckets[n-1].v, prev = buckets[n-2].v;
  const streak = doneStreak(dates);
  const words = { jour:["auj.","hier"], semaine:["cette sem.","sem. dernière"], mois:["ce mois","mois passé"] }[mode];
  el.innerHTML = `
    <div class="tc-head">
      <div class="tc-switch" role="group" aria-label="Période du graphique">
        ${Object.keys(TC_MODES).map(m => `<button type="button" data-mode="${m}" class="${m === mode ? "on" : ""}" aria-pressed="${m === mode}">${TC_MODES[m]}</button>`).join("")}
      </div>
      <span class="tc-stats"><b>${cur}</b> ${words[0]} · ${prev} ${words[1]} · record ${record}${streak >= 2 ? " · série " + streak + " j" : ""}</span>
    </div>
    <div class="tc-svg"></div>
    <p class="tc-msg">${escapeAttr(trashChartMessage(mode, cur, prev, recordPrev))}</p>
    ${undated ? `<p class="tc-note">+ ${undated} ${undated > 1 ? "tâches accomplies sans date, hors graphique" : "tâche accomplie sans date, hors graphique"}</p>` : ""}
  `;
  const holder = el.querySelector(".tc-svg");
  const W = Math.max(260, Math.round(holder.clientWidth || 560));
  const hasSub = buckets.some(b => b.sub);
  const H = hasSub ? 140 : 128, padX = 2, top = 16, base = H - (hasSub ? 32 : 20);
  const slot = (W - 2*padX) / n, bw = Math.min(34, slot * 0.62);
  const maxV = Math.max(1, ...buckets.map(b => b.v));
  let g = `<line x1="0" x2="${W}" y1="${base + 0.5}" y2="${base + 0.5}" stroke="var(--line)"/>`;
  buckets.forEach((b, i)=>{
    const cx = padX + slot*(i + 0.5), isNow = i === n - 1;
    const h = b.v ? Math.max(3, (base - top) * b.v / maxV) : 0;
    const x = (cx - bw/2).toFixed(1);
    if(h){
      const cls = "tc-bar" + (isNow ? " now" : "") + (b.v === record ? " best" : "");
      g += `<rect class="${cls}" x="${x}" y="${(base - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3"><title>${b.v} accomplie${b.v > 1 ? "s" : ""}</title></rect>`;
      g += `<text class="tc-val" x="${cx.toFixed(1)}" y="${(base - h - 4).toFixed(1)}" text-anchor="middle">${b.v}</text>`;
    }else{
      g += `<rect class="tc-bar empty" x="${x}" y="${base - 2}" width="${bw.toFixed(1)}" height="2" rx="1"/>`;
    }
    // écran étroit : une étiquette sur deux (en gardant toujours la période en cours)
    const showLbl = slot >= 32 || (n - 1 - i) % 2 === 0;
    if(showLbl) g += `<text class="tc-lbl${isNow ? " now" : ""}" x="${cx.toFixed(1)}" y="${base + 13}" text-anchor="middle">${b.label}</text>`;
    if(b.sub) g += `<text class="tc-lbl${isNow ? " now" : ""}" x="${cx.toFixed(1)}" y="${base + 25}" text-anchor="middle">${b.sub}</text>`;
  });
  holder.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Tâches accomplies par ${TC_MODES[mode].toLowerCase()}">${g}</svg>`;
  el.querySelectorAll(".tc-switch button").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      setTrashChartMode(btn.dataset.mode);
      renderTrashChart(el); // seul le graphique se redessine : la liste garde sa position
    });
  });
}
function renderTrash(){
  const link = document.getElementById("trashLink");
  const panel = document.getElementById("trashPanel");
  if(!link || !panel) return;
  trash = loadJSONKey(TRASH_KEY, []);
  if(!Array.isArray(trash)) trash = [];
  const isDoneEntry = e => !e || e.kind !== "deleted";
  const doneTotal = trash.filter(isDoneEntry).length;
  link.classList.toggle("open", trashOpen);
  link.title = doneTotal + (doneTotal > 1 ? " tâches accomplies, classées par jour" : " tâche accomplie, classée par jour");
  link.setAttribute("aria-label", "Corbeille des tâches accomplies : " + doneTotal);
  link.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="lid"><path d="M3 6h18"/><path d="M9 6V4h6v2"/></g><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/></svg><span>Corbeille</span><span class="trash-link-badge">${doneTotal}</span>`;
  panel.hidden = !trashOpen;
  if(!trashOpen){ panel.innerHTML = ""; return; }
  if(!trashMsg) trashMsg = TRASH_MESSAGES[Math.floor(Math.random()*TRASH_MESSAGES.length)];
  const n = doneTotal;
  panel.innerHTML = `
    <div class="trash-head">
      <div class="trash-total">${n}<small>${n > 1 ? "tâches accomplies au compteur" : "tâche accomplie au compteur"}</small></div>
      <button type="button" class="trash-close">Fermer</button>
    </div>
    <p class="trash-msg">${n ? escapeAttr(trashMsg) : trash.length ? "Rien d'accompli au compteur pour l'instant. Première récolte lundi." : "Corbeille vide pour l'instant. Première récolte lundi : les tâches cochées avant ce jour-là y descendront d'elles-mêmes."}</p>
    <div class="trash-chart"></div>
    <div class="trash-groups"></div>
  `;
  panel.querySelector(".trash-close").addEventListener("click", ()=>{ trashOpen = false; renderAll(); });
  try{ renderTrashChart(panel.querySelector(".trash-chart")); }catch(err){ console.error("[graphique corbeille]", err); }
  const groups = new Map();
  trash.forEach((entry, idx)=>{
    const day = !isDoneEntry(entry) ? "__deleted__" : ((entry && entry.doneOn) ? mondayOf(entry.doneOn) : "");
    if(!groups.has(day)) groups.set(day, []);
    groups.get(day).push({ entry, idx });
  });
  const days = Array.from(groups.keys()).sort((a,b)=>{
    if(a === b) return 0;
    if(a === "__deleted__") return 1;   // supprimées sans être faites : tout en bas
    if(b === "__deleted__") return -1;
    if(!a) return 1;   // puis les non datées
    if(!b) return -1;
    return a < b ? 1 : -1; // le plus récent en haut
  });
  const wrap = panel.querySelector(".trash-groups");
  days.forEach(day=>{
    const rows = groups.get(day).sort((x,y)=>
      String(y.entry.doneOn||"").localeCompare(String(x.entry.doneOn||"")) ||
      String(x.entry.t||"").localeCompare(String(y.entry.t||""), "fr"));
    const head = document.createElement("div");
    head.className = "trash-day";
    head.innerHTML = `<span>${escapeAttr(day === "__deleted__" ? "Effacées sans avoir été faites (hors compteur)" : formatTrashWeek(day))}</span><span>${rows.length}</span>`;
    wrap.appendChild(head);
    const ul = document.createElement("ul");
    ul.className = "items";
    rows.forEach(({entry, idx})=>{
      const li = document.createElement("li");
      li.className = "trash-item";
      const who = entry.who ? `<span class="who-tag">${escapeAttr(entry.who)}</span>` : "";
      li.innerHTML = `
        <span class="trash-tick" aria-hidden="true">${isDoneEntry(entry) ? "&#10003;" : "&ndash;"}</span>
        <span class="item-text">${who}${escapeAttr(entry.t || "")}${entry.note ? `<span class="note">${escapeAttr(entry.note)}</span>` : ""}</span><span class="trash-date">${entry.doneOn ? shortDateFR(entry.doneOn) : ""}</span>
        <span class="item-controls"><button type="button" class="waiting-btn" aria-label="Remettre dans la liste" data-tip="Remettre dans la liste">&#8617;</button><button type="button" class="delete-btn" aria-label="Supprimer de la corbeille" data-tip="Supprimer de la corbeille">&times;</button></span>
      `;
      li.querySelector(".waiting-btn").addEventListener("click", (e)=>{
        e.stopPropagation();
        if(restoreFromTrash(idx)) actionToast("restore");
        renderAll();
      });
      li.querySelector(".delete-btn").addEventListener("click", (e)=>{
        e.stopPropagation();
        trash = loadJSONKey(TRASH_KEY, []);
        if(trash[idx]){ trash.splice(idx, 1); saveJSONKey(TRASH_KEY, trash); actionToast("trashDelete"); }
        renderAll();
      });
      ul.appendChild(li);
    });
    wrap.appendChild(ul);
  });
}

function pctFromState(){
  const total = getTotalItems();
  const done = getDoneCount();
  return total ? (done/total)*100 : 0;
}

// Cocher (ou décocher) une tâche, d'où que vienne le geste : la case de la
// liste, la case urgente ou le trèfle. On repart toujours d'une copie
// fraîche de ce qui est vraiment sur le disque : si un autre onglet a
// sauvegardé entre-temps, on ne l'écrase pas avec une copie périmée (c'est
// ce qui faisait jadis « réapparaître » une tâche pourtant cochée).
function setDone(key, checked){
  state = loadState();
  const prevPct = pctFromState();
  state[key] = checked;
  saveState(state);
  markChecked(key, checked);
  currentProgressMsg = null;
  if(checked){
    justCheckedKey = key;
    const newPct = pctFromState();
    const crossed = MILESTONES.find(m => prevPct < m.p && newPct >= m.p);
    celebrate(crossed ? crossed.msg : undefined);
  }
  renderAll();
  justCheckedKey = null;
}

  {p:25, msg:"25% — bien lancé, continue sur cette lancée."},

function updateProgress(){
  const total = getTotalItems();
  const done = getDoneCount();
  // Compteur affiché : tâches cochées depuis lundi (repart de zéro chaque
  // semaine). La barre et les messages gardent le calcul faites / total.
  const weekDone = getWeekDoneCount();
  document.getElementById("doneCount").textContent = weekDone;
  document.getElementById("doneLabel").textContent = (weekDone > 1 ? "tâches accomplies" : "tâche accomplie") + "\ncette semaine";

  document.getElementById("totalCount").innerHTML = `Total <b>${total}</b>`;
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById("barFill").style.width = pct + "%";

  if(pct === 0){
    // pioche un message de départ si on n'en a pas déjà un de ce lot
    if(!START_MESSAGES.includes(currentProgressMsg))
      currentProgressMsg = START_MESSAGES[Math.floor(Math.random()*START_MESSAGES.length)];
  }else if(pct >= 100){
    if(!DONE_MESSAGES.includes(currentProgressMsg))
      currentProgressMsg = DONE_MESSAGES[Math.floor(Math.random()*DONE_MESSAGES.length)];
  }else if(!currentProgressMsg){
    currentProgressMsg = pickAmbientMessage();
  }
  document.getElementById("progressMsg").textContent = currentProgressMsg;
}

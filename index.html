    dans le navigateur de chacun (localStorage) : chaque personne a sa liste.

  RÈGLES DE LA MAISON
  - Ne jamais abîmer l'appli ni perdre d'anciennes tâches : toutes les
    données vivent dans localStorage (clés « fauconnerie-v2-… »), on ne
    renomme ni ne supprime une clé existante. Le préfixe « fauconnerie » est

    partout ailleurs (depuis la 8.19) ; ne pas réintroduire ce nom à l'écran.
  - Fichier autonome : un seul .html, rien d'autre que les polices Google
    en externe.
  - Ton des messages : humour, faisan, folklore plutôt belge ; rien de
    trop perso (l'appli peut être partagée).
  - Tout texte saisi (titre, note, nom…) passe par escapeAttr() avant
    d'entrer dans le HTML.

  RANGEMENT (depuis la 8.0)
  - CSS : un seul endroit par élément, dans l'ordre de la page (couleurs →
    compteur → case urgente → trèfle → listes → tâches → formulaires → « En
    cours » → bas de page → corbeille → accueil → tapis → glisser-déposer →
    infobulles → mode sombre → animations). Pour retoucher un élément, on
    MODIFIE SA RÈGLE là où elle est ; on n'ajoute pas de bloc « 7.x » en fin
    de feuille qui l'écrase (c'est ce qui avait été démêlé en 8.0).
  - Mode sombre : les couleurs sont des variables (--bg, --ink…) redéfinies
    deux fois (réglage du système, thème forcé par data-theme) ; les rares
    retouches propres au sombre sont regroupées dans la section du même nom.
  - JS : un seul chemin pour chaque geste — setDone() (cocher, d'où que ce
    soit), insertItem() (ajouter une tâche à une liste), reloadAllFromStorage()
    (tout relire), hasAnyList(), formToggles() / eggSvg() / triangleSvg()
    (œuf et triangle des formulaires), openPopAt() (petites fenêtres).
  - Annuler (⌘Z / Ctrl+Z) : après chaque renderAll(), noteUndoPoint() compare
    les clés du stockage (UNDO_KEYS) à leur état précédent. Toute nouvelle
    clé de données doit donc entrer dans BACKUP_KEYS pour être annulable et
    sauvegardée.

    (toujours visibles sur écran tactile). Trèfle : plus d'air (propositions
    plus hautes et plus espacées, léger relief, « ou » en petites capitales).
  - 8.13 : « Total x » (sans deux-points) au-dessus du bout de la barre, plus
    discret (gris) ; barre de nouveau sur toute la largeur. Case urgente : le
    rond « ! » centré sur la hauteur du titre.
  - 8.14 : couleurs calmées : liseré des listes à leur couleur mais adouci ;
    badges en deux familles (rouge pour retard / aujourd'hui / relance,
    contour gris pour le reste, RDV compris) ; noms de liste en gris dans la
    case urgente et « En cours ».
  - 8.15 : « Rien d'urgent pour l'instant » (et son rond) dans le rouge de
    l'urgent, éteint, au lieu du blanc devenu illisible ; idem en sombre.
  - 8.16 : (abandonnée) le rouge éteint de « Rien d'urgent pour l'instant »
    plus soutenu (78 % au lieu de 55 %) — non gardé, on reste à 55 %.
  - 8.17 : mise en ligne (GitHub Pages) avec une icône pour l'écran
    d'accueil (apple-touch-icon) : une tête de faisan vectorielle en gros plan, façon gravure (d'après un dessin à l'encre) ;
    source : icon-faisan.svg. Sauvegarder sur iPhone / iPad : la feuille
    de partage du système s'ouvre (Enregistrer dans Fichiers, iCloud,
    AirDrop, Mail…) au lieu d'un téléchargement peu visible ; ailleurs, rien
    ne change. Aucune clé de stockage ajoutée ni modifiée.
  - 8.18 : installable comme une appli sur ordinateur (Chrome / Edge :
    « Installer » ; Safari Mac : Fichier > Ajouter au Dock) avec l'icône
    faisan : fichier manifest.webmanifest + icônes 192 et 512. Rien d'autre.
  - 8.19 : l'appli s'appelle « Sous le tapis » partout (onglet, en-tête,
    nom de l'icône installée, sauvegardes) ; plus aucune trace visible de
    « Fauconnerie ». Clés de stockage inchangées, anciennes sauvegardes
    toujours importables.
  - 8.20 : icône d'ordinateur (Chrome sur Mac) sans plaque blanche autour :
    icônes icon-faisan-mac-192/512.png déjà découpées à la forme macOS
    (coins arrondis, marge transparente), plus d'icône « maskable » dans le
    manifest — c'est elle que Chrome posait sur un fond blanc. L'icône
    iPhone (icon-faisan-180.png) ne change pas.
  - 8.21 : sur Android, l'appli charge manifest-android.webmanifest, avec
    l'icône pleine (icon-faisan-plein-192/512.png, « any » et « maskable »)
    qu'Android découpe à sa forme ; ordinateur : manifest.webmanifest
    (icône macOS). Rien d'autre.
-->
<title>Sous le tapis</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap');

/* ==========================================================================
   Feuille de style rangée en 8.0 : chaque retouche (7.x) est fondue dans sa
   règle d'origine, au lieu d'être empilée en fin de fichier par-dessus.
   Ordre : couleurs → page → compteur → case urgente → trèfle → listes →
   tâches → formulaires → « En cours » → bas de page → corbeille → accueil →
   tapis → glisser-déposer → infobulles → mode sombre → animations.
   ========================================================================== */

/* ---------- couleurs (clair, puis sombre deux fois : réglage du système, ou
   thème forcé par la page hôte via data-theme) ---------- */
:root{
  --bg:#F8F6EF;
  --bg-top:#F3F8FA;
  --bg-bottom:#ECEFEF;
  --surface:#FFFFFF;
  --surface-2:#FBF9F3;
  --ink:#2A2725;
  --ink-soft:#6B6560;
  --ink-faint:#A39C94;
  --accent:#4993A2;
  --accent-strong:#6B728E;
  --accent-soft:#E4ECF3;
  --urgent:#DD5236;
  --urgent-soft:#FBE3DA;
  --urgent-ink:#93301C;
  --relance:#C24F6E;
  --relance-soft:#F6E3E8;
  --wait:#6A9FB9;
  --wait-soft:#EEFBF4;
  --eggshell:#FAF3E3;
  --lucky-gold:#E3B53C;
  --line:#EDE7DC;
  --shadow: 0 1px 2px rgba(30,40,45,0.04), 0 8px 24px -12px rgba(30,40,45,0.12);
  --rose:#D98DA1; /* couleur fixe : un color-mix s'interpole mal dans l'animation */
  --phrase:#3F6A8C; /* bleu acier : phrase du compteur (8.4) */
  --count-ink:#1E3552; /* « tâches accomplies… » : presque noir, une pointe de bleu (8.7) */
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181B;
    --bg-top:#1B252B;
    --bg-bottom:#101315;
    --surface:#1C2125;
    --surface-2:#232A2F;
    --ink:#EDF0F1;
    --ink-soft:#AEB6BA;
    --ink-faint:#78838A;
    --accent:#7DBFCB;
    --accent-strong:#A8AFCB;
    --accent-soft:#1C2B30;
    --urgent:#F07B8E;
    --urgent-soft:#2C1D24;
    --urgent-ink:#FFB8C4;
    --relance:#E38DA4;
    --relance-soft:#372229;
    --wait:#94C4DA;
    --wait-soft:#142C29;
    --eggshell:#28292E;
    --lucky-gold:#D8B145;
    --line:#2E363C;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    --phrase:#9CC0DC;
    --count-ink:#D5E3F3;
  }
}
:root[data-theme="dark"]{
  --bg:#14181B;
  --bg-top:#1B252B;
  --bg-bottom:#101315;
  --surface:#1C2125;
  --surface-2:#232A2F;
  --ink:#EDF0F1;
  --ink-soft:#AEB6BA;
  --ink-faint:#78838A;
  --accent:#7DBFCB;
  --accent-strong:#A8AFCB;
  --accent-soft:#1C2B30;
  --urgent:#F07B8E;
  --urgent-soft:#2C1D24;
  --urgent-ink:#FFB8C4;
  --relance:#E38DA4;
  --relance-soft:#372229;
  --wait:#94C4DA;
  --wait-soft:#142C29;
  --eggshell:#28292E;
  --lucky-gold:#D8B145;
  --line:#2E363C;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  --phrase:#9CC0DC;
  --count-ink:#D5E3F3;
}

/* ---------- page ---------- */
*{box-sizing:border-box;}
html{background:var(--bg);}
body{
  margin:0;
  min-height:100vh;
  /* fond : dégradé frais en haut, crème en bas */
  background:linear-gradient(180deg, var(--bg-top) 0, var(--bg) 900px, var(--bg) 100%);
  color:var(--ink);
  font-family:'Public Sans', system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent-soft); color:var(--ink);}
.wrap{
  max-width:920px;
  margin:0 auto;
  padding:2.75rem 1.5rem 6rem;
  position:relative;
  isolation:isolate;
}
/* le titre et le numéro de version restent au-dessus du tapis déroulé */
header{
  display:flex;
  flex-direction:column;
  gap:1.1rem;
  margin-top:0.35rem;
  margin-bottom:0.7rem;
  position:relative;
  z-index:41;
}
.eyebrow{
  display:block;
  text-align:right;
  padding-right:1.5rem; /* aligné sur le bord droit du texte de la carte */
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.8rem;
  font-weight:600;
  letter-spacing:0.11em;
  text-transform:uppercase;
  color:var(--accent);
  cursor:pointer;
  transition:color .15s ease;
  -webkit-user-select:none;
  user-select:none;
}
.eyebrow:hover{ color:var(--accent-strong); }
.eyebrow:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:4px; }
.ap-nod{ position:relative; }
.ap-nod::after{
  content:"";
  position:absolute;
  left:0;
  right:0.11em; /* retranche l'espacement de fin : le trait s'arrête au bord du P */
  bottom:-1px;
  height:1px;
  background:currentColor;
}
.lucky-line[hidden], .urgent-banner[hidden], #waitingSection[hidden], .backup-nudge[hidden]{display:none;}

/* ---------- compteur « tableau de bord » (8.10) ----------
   Ligne du haut : à gauche le chiffre de la semaine, au milieu la phrase ;
   la barre court en dessous sur toute la largeur, « Total x » en petit
   juste au-dessus de son extrémité droite (8.13).
   Sur téléphone : chiffre et total côte à côte, la barre, puis la phrase. */
.progress-card{
  background:var(--surface);
  border-radius:16px;
  padding:1.3rem 1.5rem 1.4rem;
  box-shadow:var(--shadow);
  display:grid;
  grid-template-columns:auto 1fr auto;
  row-gap:1rem;
  align-items:center;
}
.progress-top{ display:contents; }
.progress-count{
  display:flex;
  flex-direction:column;
}
.progress-count, .progress-total{
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.7rem;
  font-weight:700;
  letter-spacing:0.09em;
  line-height:1.35;
  text-transform:uppercase;
  white-space:pre-line;
  font-variant-numeric:tabular-nums;
  color:var(--count-ink);
}
.progress-count b{
  font-size:4.2em;
  letter-spacing:-0.03em;
  line-height:0.85;
  margin-bottom:0.35rem;
}
.progress-count{ grid-column:1; grid-row:1; padding-right:1.6rem; }
.progress-count b{ color:var(--relance); }
.progress-total{
  grid-column:3; grid-row:1;  /* tout au bout, juste au-dessus de la barre (8.13) */
  align-self:end;
  margin-bottom:-0.5rem;
  padding-left:1.2rem;
  white-space:nowrap;
  line-height:1;
  color:var(--ink-soft);
}
.progress-total b{ font-size:1.15em; }
.progress-msg{
  grid-column:2;
  grid-row:1;
  align-self:stretch;
  display:flex;
  align-items:center;
  padding:0 1.6rem;
  border-left:1px solid var(--line);
  min-height:1.3em;
  font-family:'Public Sans', system-ui, sans-serif;
  font-size:0.95rem;
  font-weight:600;
  line-height:1.4;
  color:var(--phrase);
  text-wrap:pretty;
  transition:opacity .25s ease;
}
.bar-track{
  grid-column:1 / -1;
  grid-row:2;
  height:3px;
  background:var(--accent-soft);
  border-radius:999px;
  overflow:hidden;
}
.bar-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg, var(--accent-strong), var(--accent) 60%, color-mix(in srgb, var(--accent) 55%, #9FD8F5));
  border-radius:999px;
  transition:width .5s cubic-bezier(.4,0,.2,1);
}
@media (max-width:560px){
  .progress-card{ grid-template-columns:1fr auto; row-gap:0.9rem; }
  .progress-count{ padding-right:0; }
  .progress-total{ grid-column:2; }
  .progress-msg{ grid-column:1 / -1; grid-row:3; padding:0; border-left:none; }
}

/* ---------- case urgente ---------- */
.urgent-banner{
  margin-top:1.5rem;
  background:var(--urgent-soft);
  border-radius:14px;
  padding:1rem 1.25rem;
  box-shadow:0 6px 18px -10px color-mix(in srgb, var(--urgent) 55%, transparent);
  display:flex;
  gap:0.9rem;
  align-items:flex-start;
}
.urgent-banner svg{flex:none; margin-top:-0.15rem; color:var(--urgent);} /* centre du rond = centre du titre (8.13) */
.urgent-banner-title{
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.74rem;
  font-weight:700;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--urgent);
  margin-bottom:0.2rem;
}
.urgent-banner-body{flex:1; min-width:0;}
/* rien d'urgent : la case reste, au calme */
.urgent-banner.calm{ align-items:center; }
.urgent-banner.calm svg{ margin-top:0; color:color-mix(in srgb, var(--urgent) 55%, var(--urgent-soft)); stroke-width:2.2; }
.urgent-banner.calm .urgent-banner-title{ margin:0; color:color-mix(in srgb, var(--urgent) 55%, var(--urgent-soft)); font-weight:700; } /* le rouge de l'urgent, éteint (8.15) */
.urgent-list{
  list-style:none;
  margin:0;
  padding:0;
  display:flex;
  flex-direction:column;
  gap:0.15rem;
}
.urgent-list li{
  display:flex;
  align-items:center;
  gap:0.2rem;
  border-radius:8px;
  position:relative;
  transition:background .12s ease;
}
/* un seul survol par ligne (7.40) ; 14 % dès que le thème n'est pas forcé en clair */
.urgent-list li:hover{ background:color-mix(in srgb, var(--urgent) 8%, transparent); }
:root:not([data-theme="light"]) .urgent-list li:hover{ background:color-mix(in srgb, var(--urgent) 14%, transparent); }
.urgent-list li.dragging{opacity:0.4;}
.urgent-list .drag-handle{ color:var(--urgent-ink); opacity:0.5; }
.urgent-check{
  appearance:none;
  -webkit-appearance:none;
  box-sizing:border-box;
  padding:0;
  margin:0;
  position:absolute;
  left:-1.15rem;
  top:50%;
  transform:translateY(-50%);
  width:14px;
  height:14px;
  border:1.5px solid color-mix(in srgb, var(--urgent-ink) 45%, transparent);
  border-radius:4px;
  background:var(--surface);
  cursor:pointer;
  opacity:0;
  transition:opacity .12s ease, border-color .12s ease, background .12s ease;
}
.urgent-list li:hover .urgent-check{ opacity:1; }
.urgent-check:hover{ border-color:var(--urgent-ink); background:color-mix(in srgb, var(--urgent-ink) 12%, var(--surface)); }
.urgent-actions{
  margin-left:auto;
  flex:none;
  display:flex;
  align-items:center;
  gap:0.1rem;
  padding-right:0.15rem;
  opacity:0;
  pointer-events:none;
  transition:opacity .12s ease;
}
.urgent-list li:hover .urgent-actions,
.urgent-list li:focus-within .urgent-actions{ opacity:1; pointer-events:auto; }
.urgent-actions button{ transition:color .12s ease, opacity .12s ease; }
.urgent-actions .waiting-btn,
.urgent-actions .waiting-btn:hover,
.urgent-actions .urgent-btn.active,
.urgent-actions .urgent-btn.active:hover{ background:transparent; }
.urgent-actions .waiting-btn{ color:color-mix(in srgb, var(--urgent-ink) 55%, transparent); }
.urgent-actions .waiting-btn:hover{ color:var(--urgent-ink); }
.urgent-actions .urgent-btn.active{ opacity:0.7; }
.urgent-actions .urgent-btn.active:hover{ opacity:1; }
.urgent-jump{
  appearance:none;
  border:none;
  background:transparent;
  width:100%;
  text-align:left;
  font-family:inherit;
  font-size:0.95rem;
  color:var(--ink);
  padding:0.3rem 0.4rem;
  border-radius:8px;
  cursor:pointer;
}
.urgent-bullet{
  display:inline-block;
  margin-right:0.4em;
  color:var(--urgent-ink);
  opacity:0.65;
}
.urgent-jump-cat{
  display:inline-block;
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.7rem;
  font-weight:600;
  letter-spacing:0.04em;
  text-transform:uppercase;
  color:var(--ink-faint); /* le nom de la liste, en gris (8.14) */
  margin:0 0.5rem;
}
/* relance arrivée (tâche en cours dont la date est là) */
.urgent-list li.is-relance .urgent-jump,
.urgent-list li.is-relance .urgent-bullet{ color:var(--relance); }
.item.item-relance .item-title{ color:var(--relance); font-weight:600; }

/* ---------- trèfle : deux petites tâches piochées chaque jour ---------- */
.lucky-line{
  margin-top:0.8rem;
  border-radius:12px;
  background:var(--eggshell);
  box-shadow:var(--shadow);
  padding:0.7rem 0.9rem 0.85rem;
  transition:opacity .4s ease, filter .4s ease;
}
.lucky-head{
  display:flex;
  align-items:center;
  gap:0.9rem;               /* même écart icône/titre que la case urgente */
  margin:0 0 0.6rem 0.35rem; /* 0.9 + 0.35 = 1.25rem : trèfle à l'aplomb du « ! » */
}
.lucky-clover{flex:none; width:18px; height:18px; color:color-mix(in srgb, var(--wait) 70%, var(--surface)); overflow:visible;}
.lucky-lead{
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-style:normal;
  font-size:0.74rem;
  font-weight:600;
  letter-spacing:0.07em;
  text-transform:uppercase;
  color:color-mix(in srgb, var(--lucky-gold) 55%, var(--ink));
}
.lucky-reroll{
  appearance:none;
  margin-left:auto;
  border:none;
  background:transparent;
  color:color-mix(in srgb, var(--lucky-gold) 55%, var(--ink));
  opacity:0.8;
  padding:4px;
  border-radius:50%;
  cursor:pointer;
  line-height:0;
  transition:opacity .15s ease, background .15s ease, transform .35s ease;
}
.lucky-reroll:hover{ opacity:1; background:color-mix(in srgb, var(--lucky-gold) 25%, var(--surface)); transform:rotate(180deg); }
.lucky-opts{display:flex; align-items:center; gap:0.9rem;}
.lucky-or{
  flex:none;
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-style:normal;
  font-weight:700;
  font-size:0.75rem;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:color-mix(in srgb, var(--lucky-gold) 55%, var(--ink));
  opacity:.7;
}
.lucky-pick{
  appearance:none;
  flex:1 1 0;
  min-width:0;
  border:1px solid transparent;
  border-radius:8px;
  background:var(--surface);
  font-family:'Public Sans', system-ui, sans-serif;
  font-style:normal;
  font-size:0.9rem;
  color:var(--ink);
  padding:0.5rem 0.9rem;
  box-shadow:0 1px 2px rgba(30,40,45,0.06);
  text-align:center;
  cursor:pointer;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  transition:box-shadow .2s ease, transform .2s ease;
}
.lucky-pick.chosen{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:0.5rem;
  cursor:default;
  border-color:var(--lucky-gold);
  box-shadow:0 0 0 1px var(--lucky-gold);
}
/* survol : la petite case reste blanche, elle s'illumine par l'arrière.
   (!important : le liseré doré de la proposition retenue s'efface aussi.) */
.lucky-pick:hover{
  background:var(--surface);
  border-color:transparent !important;
  box-shadow:0 0 0 3px color-mix(in srgb, var(--lucky-gold) 35%, transparent), 0 4px 16px -2px color-mix(in srgb, var(--lucky-gold) 70%, transparent);
  transform:translateY(-1px);
}
.lucky-pick-text{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.lucky-check{flex:none; width:15px; height:15px; margin:0; accent-color:var(--wait); cursor:pointer;}
.lucky-line.can-reset{cursor:pointer;}
.lucky-pick.dim{opacity:0.45; filter:grayscale(1);}
.lucky-pick.dim:hover{opacity:0.75;}
/* une des deux est faite : tout se grise, seul le liseré jaune reste, atténué */
.lucky-line.done{background:color-mix(in srgb, var(--surface) 45%, var(--bg));}
.lucky-line.done .lucky-head{filter:grayscale(1); opacity:0.68;}
.lucky-line.done .lucky-pick{color:var(--ink-faint);}
.lucky-line.done .lucky-pick.dim{opacity:0.4;}
.lucky-line.done .lucky-pick.dim:hover{opacity:0.4; cursor:default;}
.lucky-line.done .lucky-pick.chosen{
  border-color:color-mix(in srgb, var(--lucky-gold) 50%, var(--line));
  box-shadow:none;
}
.lucky-line.done .lucky-check{accent-color:var(--ink-faint);}
.lucky-pick.won .lucky-pick-text{text-decoration:line-through; text-decoration-thickness:1px;}
@media (max-width:560px){
  .lucky-opts{gap:0.5rem;}
  .lucky-pick{ white-space:normal; padding:0.45rem 0.6rem; } /* sur deux lignes plutôt que coupées */
  .lucky-pick-text{ white-space:normal; }
}

/* ---------- listes ---------- */
.categories{
  margin-top:2.25rem;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:1.1rem;
}
@media (max-width:720px){
  .categories{grid-template-columns:1fr;}
}
/* liste : fond blanc, seul le liseré coloré à gauche */
.category{
  background:var(--surface);
  /* liseré à la couleur de la liste, adouci (8.14) */
  border-left:3px solid color-mix(in srgb, var(--cat-color, var(--accent)) 40%, var(--surface));
  border-radius:14px;
  padding:1.15rem 1.25rem 1.3rem;
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  gap:0.65rem;
}
.category.done{ opacity:0.62; }
.cat-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:0.75rem;
}
.cat-title-group{
  display:flex;
  align-items:center;
  gap:0.5rem;
  flex:1;
  min-width:0;
}
.cat-head-right{
  display:flex;
  align-items:center;
  gap:0.5rem;
}
.cat-title{
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.74rem;
  font-weight:600;
  letter-spacing:0.09em;
  text-transform:uppercase;
  color:var(--ink-soft);
  cursor:text;
  border-radius:4px;
}
.cat-title:hover{
  color:var(--ink);
  background:var(--surface-2);
}
.cat-title-input{
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.7rem;
  font-weight:600;
  letter-spacing:0.09em;
  text-transform:uppercase;
  color:var(--ink);
  background:var(--surface-2);
  border:1px solid var(--accent);
  border-radius:4px;
  padding:0.15rem 0.4rem;
  min-width:6ch;
}
.cat-title-input:focus{
  outline:2px solid var(--accent);
  outline-offset:1px;
}
.add-btn{
  appearance:none;
  border:1px solid var(--line);
  background:var(--surface-2);
  color:var(--ink-soft);
  width:20px;
  height:20px;
  border-radius:6px;
  font-size:0.86rem;
  line-height:1;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:none;
}
.add-btn:hover{
  background:var(--accent-soft);
  color:var(--accent-strong);
  border-color:var(--accent);
}
/* ajout express (7.1) : champ discret à côté du titre */
.cat-quick-wrap{ position:relative; flex:1; min-width:4ch; display:flex; align-items:center; cursor:text; }
.cat-quick-pen{
  position:absolute; left:0.3rem; top:50%; transform:translateY(-50%);
  color:var(--ink-faint); opacity:.55; pointer-events:none;
  transition:opacity .15s ease, color .15s ease;
}
.cat-quick-wrap:hover .cat-quick-pen{ opacity:1; color:var(--ink-soft); }
.cat-quick-wrap:focus-within .cat-quick-pen{ opacity:0; }
.cat-quick{
  flex:1; min-width:4ch; width:100%;
  font-family:inherit; font-size:0.86rem; color:var(--ink);
  background:transparent; border:none; border-bottom:1px dashed transparent; border-radius:0;
  padding:0.15rem 0.2rem; margin-left:0.1rem;
  transition:border-color .15s ease;
}
.cat-quick::placeholder{ color:var(--ink-faint); opacity:.7; }
.category:hover .cat-quick{ border-bottom-color:var(--line); }
.cat-quick:focus{ outline:none; border-bottom:1px solid var(--cat-color, var(--accent)); }
/* sens d'affichage (7.1) : ▲ la plus récente en haut, ▼ en bas */
.cat-order{
  appearance:none; border:none; background:transparent; color:var(--ink-faint);
  padding:5px 6px; border-radius:6px; cursor:pointer; line-height:0;
  display:inline-flex; align-items:center;
  opacity:0.45; /* discrète (8.6) ; pleine au survol */
  transition:color .15s ease, background .15s ease, opacity .15s ease;
}
.cat-order svg{ display:block; transition:transform .25s cubic-bezier(.34,1.56,.64,1); }
.cat-order.reversed svg{ transform:rotate(180deg); }
.cat-order:hover{ background:var(--surface-2); color:var(--ink-soft); opacity:1; }
.cat-order.reversed{ color:var(--cat-color, var(--accent)); }
.cat-grip{
  display:flex;
  align-items:center;
  padding:4px 3px;
  border-radius:6px;
  color:var(--ink-faint);
  opacity:0.5;
  cursor:grab;
  touch-action:none;
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
  transition:opacity .15s ease, background .15s ease, color .15s ease;
}
.category:hover .cat-grip{ opacity:1; }
.cat-grip:hover{ background:var(--surface-2); color:var(--ink-soft); }
/* Volontairement distincte du × discret d'une tâche (.delete-btn) : cette
   croix supprime toute une case, pas une simple ligne — elle doit se voir
   sans avoir à survoler la carte, et ne pas se confondre avec le langage
   visuel réservé aux tâches. */
.cat-delete-btn{
  appearance:none;
  border:1px solid var(--line);
  background:var(--surface-2);
  color:var(--ink-soft);
  width:22px;
  height:22px;
  border-radius:6px;
  font-size:0.95rem;
  line-height:1;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:none;
}
.cat-delete-btn:hover{
  background:var(--urgent-soft);
  color:var(--urgent-ink);
  border-color:var(--urgent);
}
.add-category-row{
  margin-top:0.85rem;
  display:flex;
  justify-content:center;
}
.add-category-btn{
  appearance:none;
  border:1px dashed var(--line);
  background:transparent;
  color:var(--ink-faint);
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.7rem;
  font-weight:600;
  letter-spacing:0.04em;
  text-transform:uppercase;
  padding:0.5rem 1rem;
  border-radius:999px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:0.4rem;
}
.add-category-btn:hover{
  color:var(--accent-strong);
  border-color:var(--accent);
  background:var(--accent-soft);
}

/* ---------- tâches ---------- */
ul.items{
  list-style:none;
  margin:0;
  padding:0;
  display:flex;
  flex-direction:column;
  gap:0.15rem;
}
.item{
  display:flex;
  align-items:flex-start;
  gap:0.65rem;
  padding:0.42rem 0.3rem;
  border-radius:8px;
  cursor:pointer;
}
.item:hover{background:var(--surface-2);}
.item:hover .item-controls, .item:focus-within .item-controls{opacity:1;}
.item .drag-handle{ opacity:0; transition:opacity .15s ease; }
.item:hover .drag-handle{ opacity:1; }
.item.dragging{opacity:0.4;}
.item-text{
  flex:1;
  font-size:0.95rem;
  line-height:1.4;
  color:var(--ink);
  cursor:text;
}
.item-text .note{
  display:block;
  font-size:0.86rem;
  color:var(--ink-soft);
  margin-top:0.15rem;
  line-height:1.4;
}
.item input[type="checkbox"]{
  appearance:none;
  -webkit-appearance:none;
  width:18px;
  height:18px;
  flex:none;
  margin-top:0.15rem;
  border:1.5px solid var(--ink-faint);
  border-radius:5px;
  cursor:pointer;
  position:relative;
  background:var(--surface);
  transition:background .15s ease, border-color .15s ease;
}
.item input[type="checkbox"]:checked{
  background:var(--accent);
  border-color:var(--accent);
}
.item input[type="checkbox"]:checked::after{
  content:"";
  position:absolute;
  left:5px; top:1.5px;
  width:5px; height:9px;
  border:solid white;
  border-width:0 2px 2px 0;
  transform:rotate(40deg);
}
.item input:checked ~ .item-text{
  color:var(--ink-faint);
  text-decoration:line-through;
  text-decoration-color:var(--ink-faint);
  text-decoration-thickness:1px;
}
/* .who-tag et .person-tag sont en inline-block (badges à fond coloré) : un
   inline-block n'hérite jamais du trait barré de son parent (spec CSS), donc
   sans cette règle explicite la tâche a l'air "pas tout à fait finie" une
   fois cochée. On barre le badge lui-même, avec sa propre couleur. */
.item input:checked ~ .item-text .who-tag,
.item input:checked ~ .item-text .person-tag{
  text-decoration:line-through;
  text-decoration-color:currentColor;
  text-decoration-thickness:1px;
}
/* Petite animation de "coup de crayon" au moment où on coche une tâche :
   le trait se dessine de gauche à droite au lieu d'apparaître d'un coup.
   Ne joue qu'une fois, sur l'élément qui vient d'être coché (voir
   justCheckedKey en JS) — les autres re-rendus retombent sur le simple
   text-decoration ci-dessus. */
.item.just-checked input:checked ~ .item-text .item-title,
.item.just-checked input:checked ~ .item-text .who-tag,
.item.just-checked input:checked ~ .item-text .person-tag{
  text-decoration:none;
  background-image:linear-gradient(currentColor, currentColor);
  background-repeat:no-repeat;
  background-position:left center;
  background-size:0% 2px;
  animation:item-strike 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
.item.just-checked input:checked ~ .item-text .who-tag,
.item.just-checked input:checked ~ .item-text .person-tag{
  animation-delay:0.12s;
}
.item.just-checked input:checked ~ .item-text{
  animation:item-fade-in 0.4s ease forwards;
}
/* tâche urgente (marquée, ou échéance proche) */
.item.item-urgent .item-text{
  color:var(--urgent-ink);
  font-weight:600;
}
.item.item-urgent .item-text .note{ font-weight:400; }
.item.item-urgent input:checked ~ .item-text{
  color:var(--ink-faint);
  font-weight:400;
  text-decoration:line-through;
}
/* boutons d'une ligne : en cours, urgent, effacer */
.item-controls{
  display:flex;
  flex-direction:row;
  align-items:center;
  gap:2px;
  flex:none;
  opacity:0;               /* au repos : rien ; elles apparaissent au survol de la ligne (8.12) */
  transition:opacity .15s ease;
}
.waiting-btn{
  appearance:none;
  border:none;
  background:transparent;
  color:var(--ink-faint);
  font-size:0.95rem;
  line-height:1;
  padding:4px 6px;
  cursor:pointer;
  border-radius:4px;
}
.waiting-btn:hover{
  background:var(--accent-soft);
  color:var(--accent-strong);
}
.waiting-btn.active{
  color:var(--accent-strong);
}
.urgent-btn, .delete-btn{
  appearance:none;
  border:none;
  background:transparent;
  color:var(--ink-faint);
  font-size:0.86rem;
  line-height:1;
  padding:4px 6px;
  cursor:pointer;
  border-radius:4px;
}
.delete-btn{ font-size:0.95rem; }
.urgent-btn svg, .delete-btn svg{ display:block; }
.urgent-btn:hover{
  background:var(--surface-2);
  color:var(--ink-soft);
}
.delete-btn:hover{
  background:var(--urgent-soft);
  color:var(--urgent-ink);
}
.urgent-btn.active{
  background:var(--urgent-soft);
  color:var(--urgent-ink);
  font-weight:700;
}
.urgent-btn.active svg .tri{ fill:color-mix(in srgb, currentColor 20%, transparent); }
/* Une tâche cochée est faite : plus de sens à la marquer urgente ni « en cours ». Les boutons
   sont masqués mais gardent leur place, pour que les icônes ne bougent pas. */
.item.is-checked .urgent-btn,
.item.is-checked .waiting-btn{ visibility:hidden; pointer-events:none; }
.drag-handle{
  flex:none;
  align-self:stretch;
  display:flex;
  align-items:center;
  color:var(--ink-faint);
  font-size:0.86rem;
  letter-spacing:-2px;
  cursor:grab;
  padding:0 6px 0 2px;
  touch-action:none;
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
}
.drag-handle:active{cursor:grabbing;}
/* œuf « en couvaison » : grisé, pas de case à cocher, juste l'éclosion */
.item.is-egg .item-text{ opacity:0.45; }
.item.is-egg:hover .item-text{ opacity:0.7; }
.item.is-egg .waiting-btn{ visibility:hidden; pointer-events:none; }
.egg-dot{
  width:18px;
  height:18px;
  flex:none;
  margin:0.15rem 3px 0 4px; /* mêmes marges que la case à cocher, pour l'alignement */
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--ink-faint);
  opacity:0.8;
}
.egg-dot svg{ display:block; flex:none; }
.hatch-btn{
  appearance:none;
  border:none;
  background:transparent;
  color:var(--ink-faint);
  line-height:1;
  padding:2px 4px;
  cursor:pointer;
  border-radius:4px;
  transition:background .12s ease, color .12s ease;
}
.hatch-btn svg{ display:block; }
.hatch-btn:hover{ background:var(--surface-2); color:#8A7A4E; }
.hatch-btn:hover .chick{ fill:#F4D35E; stroke:#B8901F; }
.hatch-btn:hover .beak{ stroke:#D9822B; }
.hatch-btn:hover .shell{ fill:var(--eggshell); }
/* badges : interlocuteur, personne (anciennes données), échéance */
.who-tag{
  display:inline-block;
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.7rem;
  font-weight:600;
  letter-spacing:0.04em;
  text-transform:uppercase;
  color:var(--ink-soft);
  background:var(--surface-2);
  border:1px solid var(--line);
  padding:0.1rem 0.45rem;
  border-radius:999px;
  margin-right:0.5rem;
  vertical-align:middle;
}
.person-tag{
  display:inline-block;
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.7rem;
  font-weight:600;
  letter-spacing:0.04em;
  text-transform:uppercase;
  color:var(--accent-strong);
  background:var(--accent-soft);
  padding:0.1rem 0.45rem;
  border-radius:999px;
  margin-right:0.45rem;
  vertical-align:middle;
}
.person-tag.tier-urgent{color:var(--urgent-ink); background:var(--urgent-soft);}
.person-tag.tier-normal{color:var(--accent-strong); background:var(--accent-soft);}
.person-tag.tier-later{color:var(--ink-faint); background:var(--surface-2);}
.due-badge{
  display:inline-block;
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.7rem;
  font-weight:600;
  letter-spacing:0.02em;
  padding:0.05rem 0.42rem;
  border-radius:999px;
  margin-left:0.45rem;
  vertical-align:middle;
  white-space:nowrap;
}
.due-badge.status-overdue, .due-badge.status-today{
  background:var(--urgent-soft);
  color:var(--urgent-ink);
}
/* deux familles seulement (8.14) : rouge pour ce qui presse (ci-dessus, et
   la relance), simple contour gris pour le reste */
.due-badge.status-tomorrow,
.due-badge.status-future,
.due-badge.status-rdv{
  background:transparent;
  color:var(--ink-soft);
  border:1px solid var(--line);
}
.due-badge.status-relance{ background:var(--relance-soft); color:var(--relance); }
.empty-note{
  font-size:0.86rem;
  color:var(--ink-faint);
  padding:0.4rem;
}

/* ---------- formulaires (modifier, ajouter, nouvelle liste) ---------- */
.edit-form{
  display:flex;
  flex-direction:column;
  gap:0.4rem;
  width:100%;
  padding:0.3rem 0.2rem;
}
.edit-form input[type="text"]{
  font-family:inherit;
  font-size:0.95rem;
  padding:0.45rem 0.6rem;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--surface-2);
  color:var(--ink);
}
.edit-form select.edit-cat{
  font-family:inherit;
  font-size:0.95rem;
  padding:0.45rem 0.6rem;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--surface-2);
  color:var(--ink);
  width:100%;
}
/* champs : bleu au survol, bleu qui reste une fois cliqué (7.26) */
.edit-form input, .edit-form select{ transition:border-color .15s ease, opacity .15s ease; }
.edit-form input:not(:disabled):hover, .edit-form select:hover{ border-color:var(--accent); }
.edit-form input:focus, .edit-form input[type="text"]:focus, .edit-form select:focus{ outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent); }
.edit-form input:disabled{ opacity:.4; cursor:not-allowed; }
.edit-label{
  display:flex;
  flex-direction:column;
  gap:0.25rem;
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.7rem;
  font-weight:600;
  letter-spacing:0.05em;
  text-transform:uppercase;
  color:var(--ink-soft);
}
.edit-label:has(input:disabled){ color:var(--ink-faint); }
.edit-label-row{
  display:flex;
  gap:0.5rem;
}
.edit-label-row .edit-label{flex:1;}
.edit-label-row .edit-label-cat{flex:1.4;}
.edit-label-row .edit-label-who{flex:1;}
.edit-label input[type="date"],
.edit-label input[type="time"]{
  font-family:'Public Sans', system-ui, sans-serif;
  text-transform:none;
  letter-spacing:normal;
  font-size:0.86rem;
  padding:0.4rem 0.55rem;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--surface-2);
  color:var(--ink);
}
.edit-clear-due{
  align-self:flex-end;
  flex:none;
  appearance:none;
  border:1px solid var(--line);
  background:var(--surface-2);
  color:var(--ink-faint);
  width:2.15rem;
  height:2.15rem;
  border-radius:8px;
  font-size:0.95rem;
  line-height:1;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.edit-clear-due:hover{
  background:var(--urgent-soft);
  color:var(--urgent-ink);
  border-color:var(--urgent);
}
.edit-actions{
  display:flex;
  gap:0.5rem;
}
.edit-actions button{
  font-size:0.86rem;
  font-weight:600;
  padding:0.4rem 0.8rem;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink-soft);
  cursor:pointer;
}
.edit-actions .edit-save,
.edit-actions .add-save,
.edit-actions .edit-cancel,
.edit-actions .add-cancel{ transition:background .12s ease, border-color .12s ease, color .12s ease; }
.edit-actions .edit-save:hover,
.edit-actions .add-save:hover{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}
.edit-actions .edit-cancel:hover,
.edit-actions .add-cancel:hover{
  background:var(--surface-2);
  border-color:var(--ink-faint);
  color:var(--ink);
}
/* œuf et triangle, en bas à droite (toujours dans cet ordre) */
.edit-actions .edit-egg,
.edit-actions .edit-urgent{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0.35rem 0.5rem;
  border-color:transparent;
  background:transparent;
  color:var(--ink-faint);
  transition:color .12s ease, background .12s ease;
}
.edit-actions .edit-egg{ margin-left:auto; }
.edit-actions .edit-egg .speck{ opacity:0.7; transition:opacity .12s ease; }
.edit-actions .edit-egg:hover,
.edit-actions .edit-urgent:hover{ background:var(--surface-2); color:var(--ink-soft); }
.edit-actions .edit-egg.active{ background:var(--eggshell); color:#8A7A4E; }
.edit-actions .edit-egg.active .egg{ fill:color-mix(in srgb, #E9DDB5 70%, transparent); }
.edit-actions .edit-egg.active .speck{ opacity:1; }
.edit-actions .edit-egg.active:hover{ background:color-mix(in srgb, #E9DDB5 45%, var(--surface)); }
.edit-actions .edit-urgent.active{
  background:var(--urgent-soft);
  color:var(--urgent-ink);
}
.edit-actions .edit-urgent.active:hover{ background:color-mix(in srgb, var(--urgent) 22%, var(--surface)); color:var(--urgent-ink); }
.edit-actions .edit-urgent.active svg .tri{ fill:color-mix(in srgb, currentColor 20%, transparent); }
.item.editing{cursor:default;}
.item.editing:hover{background:transparent;}
.add-form-row{cursor:default;}
.add-form-row:hover{background:transparent;}
/* un formulaire ouvert : tout le reste s'estompe */
.progress-card, .urgent-banner, .lucky-line, .category, .section-block, footer, .add-category-row{
  transition:opacity .2s ease, filter .2s ease;
}
body.has-editing .progress-card,
body.has-editing .urgent-banner,
body.has-editing .lucky-line,
body.has-editing .category,
body.has-editing .section-block,
body.has-editing footer,
body.has-editing .add-category-row{
  opacity:0.32;
  filter:grayscale(0.7);
  pointer-events:none;
}
body.has-editing .category:has(.item.editing),
body.has-editing .section-block:has(.item.editing),
body.has-editing .category:has(.add-form-row),
body.has-editing .category:has(.cat-title-input),
body.has-editing .add-category-row.active{
  opacity:1;
  filter:none;
  pointer-events:auto;
}
body.has-editing .category:has(.item.editing) ul.items > li.item:not(.editing),
body.has-editing .category:has(.add-form-row) ul.items > li.item:not(.add-form-row),
body.has-editing .section-block:has(.item.editing) ul.items > li.item:not(.editing){
  opacity:0.32;
  filter:grayscale(0.7);
  pointer-events:none;
  transition:opacity .2s ease, filter .2s ease;
}

/* ---------- « En cours » et autres grandes cases ---------- */
.section-block{
  margin-top:2.25rem;
  background:var(--wait-soft);
  border-radius:16px;
  padding:1.4rem 1.5rem 1.6rem;
  box-shadow:var(--shadow);
}
.section-title{
  font-family:'Courier Prime', 'Courier New', Courier, monospace;
  font-size:0.74rem;
  font-weight:600;
  letter-spacing:0.09em;
  text-transform:uppercase;
  color:var(--ink-soft);
  margin:0 0 1.1rem;
}
#waitingList .empty-note{ color:color-mix(in srgb, var(--ink-faint) 72%, var(--wait-soft)); }
/* choix de la relance (7.3) */
.relance-pop{
  position:absolute; z-index:80; width:min(270px, calc(100vw - 32px));
  background:var(--wait-soft); border:1px solid color-mix(in srgb, var(--wait) 35%, var(--line)); border-radius:12px;
  box-shadow:0 2px 6px rgba(30,40,45,0.06), 0 18px 36px -14px rgba(30,40,45,0.35);
  padding:0.7rem 0.75rem 0.75rem; font-family:'Public Sans', system-ui, sans-serif;
  animation:rp-in .14s ease;
}
.rp-title{ font-family:'Courier Prime', 'Courier New', Courier, monospace; font-size:0.7rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:color-mix(in srgb, var(--wait) 65%, var(--ink)); margin:0 0 0.55rem; }
.rp-opts{ display:flex; flex-wrap:wrap; gap:0.35rem; }
.rp-opts button, .rp-ok{

<script>

// Catégories ajoutées via le petit "+" en bas de la liste des cases : elles
// sont persistées à part, puis fusionnées dans DATA dès le chargement pour
// que tout le reste du code (qui ne connaît que DATA) les traite exactement
// comme les catégories d'origine, sans rien avoir à changer ailleurs.
const CUSTOM_CATS_KEY = "fauconnerie-v2-customcats";
function loadCustomCategories(){
  try{
    const raw = localStorage.getItem(CUSTOM_CATS_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveCustomCategories(list){
  try{ localStorage.setItem(CUSTOM_CATS_KEY, JSON.stringify(list)); }catch(e){}
}
let customCategories = loadCustomCategories();
function mergeCustomCategories(){
  customCategories.forEach(c=>{
    if(c && c.id && !DATA.some(d=>d.id === c.id)){
      DATA.push({ id:c.id, title:c.title, color:c.color, items: [] });
    }
  });
}
mergeCustomCategories();

// Renommer une case : comme pour le titre d'une tâche, un simple "override"
// persisté à part et réappliqué au chargement — la catégorie, qu'elle soit
// d'origine ou ajoutée par l'utilisateur, n'a pas besoin d'un traitement
// différent.
const CAT_TITLE_OVERRIDES_KEY = "fauconnerie-v2-cattitles";

  try{

}

function applyCatTitleOverrides(){
  Object.keys(catTitleOverrides).forEach(id=>{
    const c = DATA.find(d => d.id === id);
    if(c) c.title = catTitleOverrides[id];
  });
}
applyCatTitleOverrides();

const NEW_CATEGORY_PALETTE = ["#4993A2","#D9A63A","#5E9C86","#C24F6E","#D9774A","#6A9FB9","#B06A92","#8A7DB8","#8C9A4C","#6B728E"];

// enregistrée, mais on l'affiche dans la nouvelle gamme, case pour case.
// Rien n'est réécrit dans les données.
const OLD_CATEGORY_PALETTE = ["#4B7BA6","#7A5C3E","#5C8A6B","#9C5A8C","#A87F3F","#3F7A7A","#8A5A5A","#5A6B8A","#6B7A3F","#7A3F5C"];
function displayCatColor(col){
  const c = String(col || "").toUpperCase();
  if(NEW_CATEGORY_PALETTE.includes(c)) return c;
  const i = OLD_CATEGORY_PALETTE.indexOf(c);
  if(i > -1) return NEW_CATEGORY_PALETTE[i];
  let h = 0; for(const ch of c) h = (h*31 + ch.charCodeAt(0)) >>> 0;
  return NEW_CATEGORY_PALETTE[h % NEW_CATEGORY_PALETTE.length];
}
function nextCategoryColor(){
  const used = new Set(DATA.map(c=>displayCatColor(c.color)));
  const free = NEW_CATEGORY_PALETTE.find(c=>!used.has(c));
  return free || NEW_CATEGORY_PALETTE[DATA.length % NEW_CATEGORY_PALETTE.length];
}
function slugifyCategoryTitle(title){
  const base = title.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  return base || "categorie";
}
function addCategory(title){
  const t = title.trim();
  if(!t) return null;
  // Copie fraîche avant tout (même logique que pour les tâches) : on
  // fusionne d'abord ce qu'un autre onglet aurait déjà ajouté, pour ne
  // jamais créer deux catégories avec le même identifiant.
  customCategories = loadCustomCategories();
  mergeCustomCategories();
  let id = slugifyCategoryTitle(t);
  const existingIds = new Set(DATA.map(c=>c.id));
  if(existingIds.has(id)){
    let n = 2;
    while(existingIds.has(id + "-" + n)) n++;
    id = id + "-" + n;
  }
  const newCat = { id, title:t, color: nextCategoryColor(), items: [] };
  DATA.push(newCat);
  customCategories.push({ id:newCat.id, title:newCat.title, color:newCat.color });
  saveCustomCategories(customCategories);
  return newCat;
}

  }catch(e){ return []; }

function saveDeletedCategoryIds(list){
  try{ localStorage.setItem(DELETED_CATS_KEY, JSON.stringify(list)); }catch(e){}
}
let deletedCategoryIds = loadDeletedCategoryIds();
function isCategoryDeleted(catId){
  return deletedCategoryIds.includes(catId);
}
function isCategoryEmpty(cat){
  const items = getEffectiveItems(cat);
  return items.every((base,i)=> isDeleted(itemKey(cat.id, i)));
}
function deleteCategory(catId){
  // On relit tout juste avant, et on revérifie que la case est bien toujours
  // vide au moment précis de la suppression (pas seulement quand le bouton
  // a été dessiné) — la meilleure protection contre une suppression par
  // mégarde reste de toute façon qu'une case avec ne fût-ce qu'une tâche
  // dedans n'a jamais ce bouton.
  overrides = loadOverrides();
  customItems = loadCustom();
  const cat = DATA.find(c => c.id === catId);
  if(!cat || !isCategoryEmpty(cat)) return false;
  deletedCategoryIds = loadDeletedCategoryIds();
  if(!deletedCategoryIds.includes(catId)) deletedCategoryIds.push(catId);
  saveDeletedCategoryIds(deletedCategoryIds);
  return true;
}

function renameCategory(catId, newTitle){
  const t = newTitle.trim();
  if(!t) return false;
  catTitleOverrides = loadCatTitleOverrides();
  catTitleOverrides[catId] = t;
  saveCatTitleOverrides(catTitleOverrides);
  const c = DATA.find(d => d.id === catId);
  if(c) c.title = t;
  return true;
}

// ---- Corbeille hebdomadaire ----
// Chaque lundi (à la première ouverture de la semaine), les tâches cochées
// AVANT ce lundi quittent la liste et partent dans la corbeille. Rien n'est
// jamais effacé : une tâche purgée est simplement masquée dans la liste
// (même mécanisme que la suppression) et recopiée en entier dans la
// corbeille, d'où elle peut être remise dans sa case d'un clic.
// La date de chaque coche est notée à part (CHECKED_AT_KEY). Les tâches
// cochées avant cette version n'ont pas de date : elles sont gardées telles
// quelles et rangées dans la corbeille sous « non datées ».
const CHECKED_AT_KEY = "fauconnerie-v2-checkedat";
const TRASH_KEY = "fauconnerie-v2-trash";
const LAST_PURGE_KEY = "fauconnerie-v2-lastpurge";
// 8.1 : chaque envoi dans « En cours » est noté (date) et compte comme une
// tâche accomplie dans le compteur de la semaine et le graphique — un aller-
// retour liste → en cours → liste → en cours compte donc deux fois. Le
// report d'une relance (tâche déjà en cours) ne compte pas.
const WAIT_LOG_KEY = "fauconnerie-v2-waitlog";
function waitLog(){ const l = loadJSONKey(WAIT_LOG_KEY, []); return Array.isArray(l) ? l : []; }
function loadJSONKey(k, fallback){
  try{
    const raw = localStorage.getItem(k);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
function saveJSONKey(k, v){
  try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){}
}
let checkedAt = loadJSONKey(CHECKED_AT_KEY, {});
let trash = loadJSONKey(TRASH_KEY, []);
if(!Array.isArray(trash)) trash = [];
function markChecked(key, isChecked){
  checkedAt = loadJSONKey(CHECKED_AT_KEY, {});
  if(isChecked) checkedAt[key] = todayISO();
  else delete checkedAt[key];
  saveJSONKey(CHECKED_AT_KEY, checkedAt);
}
function mondayOf(iso){
  const d = new Date(iso + "T00:00:00");
  return addDaysISO(iso, -((d.getDay() + 6) % 7));
}
// Renvoie le nombre de tâches envoyées à la corbeille (0 la plupart du temps).
// Tâches cochées (n'importe quelle case, « en cours » compris) avant ce lundi
// → corbeille. `onlyWaiting` sert au rattrapage unique ci-dessous.
function purgeCheckedBefore(thisMonday, onlyWaiting){
  state = loadState();
  overrides = loadOverrides();
  customItems = loadCustom();
  checkedAt = loadJSONKey(CHECKED_AT_KEY, {});
  trash = loadJSONKey(TRASH_KEY, []);
  if(!Array.isArray(trash)) trash = [];
  const today = todayISO();
  const purgedKeys = [];
  DATA.forEach(cat=>{
    getEffectiveItems(cat).forEach((base, i)=>{
      const key = itemKey(cat.id, i);
      if(isDeleted(key) || !state[key]) return;
      const eff = getEffective(key, base);
      if(onlyWaiting && !eff.waiting) return;
      const doneOn = checkedAt[key] || "";
      if(doneOn && doneOn >= thisMonday) return; // cochée cette semaine : elle reste
      trash.push({
        t: eff.t, note: eff.note || "", who: eff.who || "", due: eff.due || "",
        catId: cat.id, catTitle: cat.title, doneOn, purgedOn: today, kind: "done",
      });
      purgedKeys.push(key);
    });
  });
  if(!purgedKeys.length) return 0;
  // La corbeille est écrite AVANT de masquer les tâches : en cas de pépin
  // au milieu, on risque au pire un doublon, jamais une perte.
  saveJSONKey(TRASH_KEY, trash);
  purgedKeys.forEach(key=>{
    overrides[key] = overrides[key] || {};
    overrides[key].deleted = true;
    delete checkedAt[key];
  });
  saveOverrides(overrides);
  saveJSONKey(CHECKED_AT_KEY, checkedAt);
  return purgedKeys.length;
}
// Rattrapage, une seule fois : jusqu'à la v5.3, la purge du lundi oubliait
// les tâches cochées de la case « en cours ». On les envoie à la corbeille
// selon la même règle (cochées avant ce lundi).
const WAITING_PURGE_FIX_KEY = "fauconnerie-v2-purge-waiting-fix";
function runWaitingPurgeFix(){
  let done = null;
  try{ done = localStorage.getItem(WAITING_PURGE_FIX_KEY); }catch(e){ return 0; }
  if(done) return 0;
  let last = null;
  try{ last = localStorage.getItem(LAST_PURGE_KEY); }catch(e){}
  // Pas encore de purge du tout : rien à rattraper, la purge normale s'en chargera.
  const n = last ? purgeCheckedBefore(mondayOf(todayISO()), true) : 0;
  try{ localStorage.setItem(WAITING_PURGE_FIX_KEY, todayISO()); }catch(e){}
  return n;
}
function runWeeklyPurge(){
  const thisMonday = mondayOf(todayISO());
  let last = null;
  try{ last = localStorage.getItem(LAST_PURGE_KEY); }catch(e){ return 0; }
  if(!last){
    // Toute première ouverture de cette version : on ne purge rien, on
    // note juste la semaine en cours. La première purge aura lieu lundi.
    try{ localStorage.setItem(LAST_PURGE_KEY, thisMonday); }catch(e){}
    return 0;
  }
  if(last >= thisMonday) return runWaitingPurgeFix();
  const n = purgeCheckedBefore(thisMonday, false);
  try{ localStorage.setItem(LAST_PURGE_KEY, thisMonday); }catch(e){}
  try{ localStorage.setItem(WAITING_PURGE_FIX_KEY, todayISO()); }catch(e){}
  return n;
}

// ---- 7.1 : ordre d'affichage inversé par liste ----
// Simple préférence d'affichage : ▲ (par défaut) = la plus récente en haut,
// ▼ = la plus récente en bas. L'ordre enregistré n'est jamais retourné : on
// l'affiche à l'envers et on retraduit au moment d'un glisser-déposer.
// Les œufs restent en queue dans les deux sens.
const CAT_REVERSE_KEY = "fauconnerie-v2-catreverse";
function isCatReversed(catId){ return !!loadJSONKey(CAT_REVERSE_KEY, {})[catId]; }
function toggleCatReversed(catId){
  const o = loadJSONKey(CAT_REVERSE_KEY, {});
  if(o[catId]) delete o[catId]; else o[catId] = true;
  saveJSONKey(CAT_REVERSE_KEY, o);
}
function isEggIdx(cat, i){
  const items = getEffectiveItems(cat);
  const k = itemKey(cat.id, i);
  return !!items[i] && getEffective(k, items[i]).egg && !state[k];
}
// ordre enregistré → ordre affiché (lignes)
function catDisplayRows(cat, rows){
  if(!isCatReversed(cat.id)) return rows;
  const egg = r => isEggIdx(cat, r.idx);
  return rows.filter(r => !egg(r)).reverse().concat(rows.filter(egg));
}
// ordre affiché (index) → ordre enregistré, reporté dans l'ordre complet
// (tâches masquées, en cours ou effacées gardent leur place)
function applyCatDisplayOrder(cat, displayIdxs){
  let stored = displayIdxs;
  if(isCatReversed(cat.id)){
    const egg = i => isEggIdx(cat, i);
    stored = displayIdxs.filter(i => !egg(i)).reverse().concat(displayIdxs.filter(egg));
  }
  const set = new Set(stored);
  const full = getCatOrder(cat).slice();
  let j = 0;
  order[cat.id] = full.map(i => set.has(i) ? stored[j++] : i);
}
// Ajoute une tâche à une liste : en tête de l'ordre enregistré, ou en queue
// si elle est en couvaison. Copie fraîche avant tout, et index recalculé à
// partir d'elle : un ajout fait entre-temps dans un autre onglet ne peut pas
// atterrir sur le même index. Renvoie l'index de la nouvelle tâche.
function insertItem(cat, item){
  customItems = loadCustom();
  order = loadOrder();
  const newIdx = getEffectiveItems(cat).length;
  customItems[cat.id] = customItems[cat.id] || [];
  customItems[cat.id].push(item);
  saveCustom(customItems);
  const ord = getCatOrder(cat);
  const pos = ord.indexOf(newIdx);
  if(pos > -1) ord.splice(pos, 1);
  if(item.egg) ord.push(newIdx); else ord.unshift(newIdx);
  saveOrder(order);
  return newIdx;
}
// Ajout express (champ à côté du titre d'une liste) : titre seul, en tête.
function addQuickTask(cat, title){
  const t = String(title || "").trim();
  if(!t) return false;
  insertItem(cat, { t });
  return true;
}
// Glisser une tâche dans une autre liste : même principe que le changement
// de catégorie du formulaire — la tâche est recopiée en entier (avec sa
// coche) dans la nouvelle liste AVANT d'être masquée dans l'ancienne.
function moveItemToCategory(cat, idx, destCat){
  const key = itemKey(cat.id, idx);
  const base = getEffectiveItems(cat)[idx];
  if(!base || !destCat) return null;
  overrides = loadOverrides();
  customItems = loadCustom();
  state = loadState();
  const eff = getEffective(key, base);
  const moved = { t: eff.t };
  if(eff.note) moved.note = eff.note;
  if(eff.due) moved.due = eff.due;
  if(eff.who) moved.who = eff.who;
  if(eff.urgent) moved.urgent = true;
  if(eff.egg) moved.egg = true;
  if(eff.person) moved.person = eff.person;
  if(eff.tier) moved.tier = eff.tier;
  const newIdx = getEffectiveItems(destCat).length;
  customItems[destCat.id] = customItems[destCat.id] || [];
  customItems[destCat.id].push(moved);
  saveCustom(customItems);
  if(state[key]){
    const newKey = itemKey(destCat.id, newIdx);
    state[newKey] = true;
    saveState(state);
    checkedAt = loadJSONKey(CHECKED_AT_KEY, {});
    checkedAt[newKey] = checkedAt[key] || todayISO();
    delete checkedAt[key];
    saveJSONKey(CHECKED_AT_KEY, checkedAt);
  }
  overrides = loadOverrides();
  overrides[key] = overrides[key] || {};
  overrides[key].deleted = true;
  saveOverrides(overrides);
  return newIdx;
}
// ---- 7.3 : envoi « en cours » avec relance ----
function effByKey(key){
  const sep = key.lastIndexOf(":");
  const cat = DATA.find(c => c.id === key.slice(0, sep));
  if(!cat) return null;
  const base = getEffectiveItems(cat)[parseInt(key.slice(sep + 1), 10)];
  return base ? getEffective(key, base) : null;
}
// relanceDue : "AAAA-MM-JJ" ou "" (pas de relance). L'échéance d'origine est
// mise de côté pour revenir quand la tâche rentre dans sa liste.
function sendToWaiting(key, relanceDue){
  overrides = loadOverrides();
  const o = overrides[key] = overrides[key] || {};
  const eff = effByKey(key);
  const wasWaiting = !!(eff && eff.waiting);
  if(eff) o.due = eff.due || "";   // échéance gardée telle quelle (masquée en cours)
  delete o.dueBeforeWaiting;
  o.waiting = true;
  o.relance = relanceDue || "";
  saveOverrides(overrides);
  if(!wasWaiting) saveJSONKey(WAIT_LOG_KEY, waitLog().concat([{ key, on: todayISO() }]));
  actionToast(wasWaiting ? "relancePush" : "waitingOn");
  currentProgressMsg = null;
  renderAll();
}
// Retour dans la liste : si la tâche avait une échéance, on demande quoi en
// faire (garder / effacer / nouvelle date) ; sinon retour direct.
function askBringBack(anchor, key){
  const eff = effByKey(key);
  if(!eff || !eff.due){ bringBackFromWaiting(key); return; }
  closeRelancePop();
  const today = todayISO();
  const d = splitDue(eff.due).date;
  const pop = document.createElement("div");
  pop.className = "relance-pop";
  pop.setAttribute("role", "dialog");
  pop.innerHTML = `
    <div class="rp-title">L'échéance du ${shortDateFR(d)}${d < today ? " (dépassée)" : ""} ?</div>
    <div class="rp-opts"><button type="button" data-a="keep">La garder</button><button type="button" data-a="erase" class="rp-none">L'effacer</button></div>
    <div class="rp-date"><input type="date" min="${today}" aria-label="Nouvelle échéance"><button type="button" class="rp-ok">OK</button></div>
  `;
  const done = v => { closeRelancePop(); bringBackFromWaiting(key, v); };
  pop.querySelector('[data-a="keep"]').addEventListener("click", e => { e.stopPropagation(); done(undefined); });
  pop.querySelector('[data-a="erase"]').addEventListener("click", e => { e.stopPropagation(); done(""); });
  const inp = pop.querySelector(".rp-date input");
  pop.querySelector(".rp-ok").addEventListener("click", e => { e.stopPropagation(); if(inp.value) done(inp.value); });
  inp.addEventListener("keydown", e => { if(e.key === "Enter" && inp.value){ e.preventDefault(); done(inp.value); } });
  openPopAt(pop, anchor);
}
// Pose une petite fenêtre (relance, retour) sous son bouton, ou au-dessus
// s'il n'y a pas la place, sans jamais déborder de l'écran.
function openPopAt(pop, anchor){
  pop.addEventListener("click", e => e.stopPropagation());
  document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect();
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  const left = Math.max(16, Math.min(r.right - pw, document.documentElement.clientWidth - pw - 16));
  let top = r.bottom + 6;
  if(top + ph > window.innerHeight - 8 && r.top - ph - 6 > 8) top = r.top - ph - 6;
  pop.style.left = (left + window.scrollX) + "px";
  pop.style.top = (top + window.scrollY) + "px";
  relancePop = pop;
  document.addEventListener("pointerdown", relanceOutside, true);
  document.addEventListener("keydown", relanceEsc, true);
}
// newDue : undefined = garder l'échéance, "" = l'effacer, date = la remplacer
function bringBackFromWaiting(key, newDue){
  overrides = loadOverrides();
  const o = overrides[key] = overrides[key] || {};
  const eff = effByKey(key);
  if(eff) o.due = newDue !== undefined ? newDue : (eff.due || "");
  delete o.dueBeforeWaiting;
  o.waiting = false;
  o.relance = "";                  // la relance disparaît
  saveOverrides(overrides);
  actionToast("waitingOff");
  currentProgressMsg = null;
  renderAll();
}
function addMonthISO(iso){
  const d = new Date(iso + "T00:00:00"), day = d.getDate();
  d.setMonth(d.getMonth() + 1);
  if(d.getDate() !== day) d.setDate(0);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function shortDateFR(iso){ const [y,m,d] = iso.split("-"); return parseInt(d,10) + "/" + parseInt(m,10); }
let relancePop = null;
function relanceOutside(e){ if(relancePop && !relancePop.contains(e.target)) closeRelancePop(); }
function relanceEsc(e){ if(e.key === "Escape" && relancePop){ e.stopPropagation(); closeRelancePop(); } }
function closeRelancePop(){
  if(!relancePop) return;
  relancePop.remove(); relancePop = null;
  document.removeEventListener("pointerdown", relanceOutside, true);
  document.removeEventListener("keydown", relanceEsc, true);
}
function askRelance(anchor, key){
  closeRelancePop();
  const eff = effByKey(key);
  if(!eff) return;
  const today = todayISO();
  const postpone = !!eff.waiting;
  const opts = [
    [addDaysISO(today, 7), "1 sem."],
    [addDaysISO(today, 14), "2 sem."],
    [addMonthISO(today), "1 mois"],
  ];
  const dueDate = eff.due ? splitDue(eff.due).date : "";
  if(!postpone && dueDate > today) opts.push([dueDate, "Garder le " + shortDateFR(dueDate)]);
  const pop = document.createElement("div");
  pop.className = "relance-pop";
  pop.setAttribute("role", "dialog");
  // 8.2 : « Pas de relance » tout en haut, en un clic ; une date choisie dans
  // le calendrier est prise directement (plus de bouton OK).
  pop.innerHTML = `
    <button type="button" class="rp-skip" data-v="">Pas de relance</button>
    <div class="rp-title">${postpone ? "Ou la reporter ?" : "Ou un petit rappel de relance ?"}</div>
    <div class="rp-opts">${opts.map(([v,l]) => `<button type="button" data-v="${v}">${l}</button>`).join("")}</div>
    <div class="rp-date"><input type="date" min="${today}" aria-label="Date de relance précise"></div>
  `;
  const choose = v => { closeRelancePop(); sendToWaiting(key, v); };
  pop.querySelectorAll(".rp-skip, .rp-opts button").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); choose(b.dataset.v); }));
  const dateInp = pop.querySelector(".rp-date input");
  // une date complète et à venir : prise tout de suite (pendant la frappe au
  // clavier, l'année incomplète donne une date passée, qu'on ignore)
  dateInp.addEventListener("change", ()=>{ if(dateInp.value && dateInp.value >= today) choose(dateInp.value); });
  dateInp.addEventListener("keydown", e => { if(e.key === "Enter" && dateInp.value){ e.preventDefault(); choose(dateInp.value); } });
  openPopAt(pop, anchor);
}

// ---- 7.3 : passage à la nouvelle semaine, même onglet ouvert ----
// Avant, le compteur repartait à zéro à minuit le lundi, mais la purge
// n'avait lieu qu'au rechargement ou au retour sur l'onglet.
let weekSeen = null, daySeen = null;
function maybeRollover(){
  const today = todayISO(), monday = mondayOf(today);
  if(weekSeen === null){ weekSeen = monday; daySeen = today; return false; }
  if(monday === weekSeen && today === daySeen) return false;
  if(hasActiveEdit()) return false; // on réessaiera au prochain passage
  if(monday !== weekSeen){
    try{ runWeeklyPurge(); }catch(err){ console.error("[corbeille] purge du lundi", err); }
    currentProgressMsg = null;
  }
  weekSeen = monday; daySeen = today;
  return true;
}

function isQuickTyping(){
  const a = document.activeElement;
  return !!(a && a.classList && a.classList.contains("cat-quick") && a.value);
}
let refocusQuickCat = null;

// ---- Sauvegarde / restauration du contenu (export / import) ----
// La synchro multi-appareils (capacité "db" de Claude) a été retirée :
// cette liste vit désormais entièrement en local, dans ce navigateur. Le
// bouton "Sauvegarder" ci-dessous écrit un fichier .json contenant toutes
// tes tâches ; "Restaurer" relit un tel fichier. C'est le filet de sécurité
// qui remplace la synchro : tant que tu as une sauvegarde à jour, tu ne peux
// rien perdre, même si le chemin du fichier change.

// Vrai tant qu'un formulaire (édition, ajout, glisser-déposer...) est ouvert :
// on ne rafraîchit jamais l'affichage par-dessus une saisie en cours.
function hasActiveEdit(){
  return !!editingKey || !!addingCat || !!addingCategory || !!editingCategoryTitle || !!dragState || isQuickTyping() || !!relancePop;
}

// ---- 7.43 : rappel de sauvegarde, au rythme de la purge du lundi ----
// La date de la dernière sauvegarde est notée à part (hors des fichiers de
// sauvegarde eux-mêmes). Un lundi, si rien n'a été sauvegardé depuis le
// lundi de la semaine d'avant, une petite ligne apparaît à côté du bouton
// « Sauvegarder », jusqu'à la prochaine sauvegarde. Jamais en cours de semaine.
const LAST_BACKUP_KEY = "fauconnerie-v2-lastbackup";
const BACKUP_WATCH_KEY = "fauconnerie-v2-backupwatch"; // 1re ouverture avec ce rappel
function noteBackupDone(){
  try{ localStorage.setItem(LAST_BACKUP_KEY, todayISO()); }catch(e){}
  renderBackupNudge();
}
function backupNudgeText(){
  let last = null, watch = null;
  try{ last = localStorage.getItem(LAST_BACKUP_KEY); watch = localStorage.getItem(BACKUP_WATCH_KEY); }catch(e){ return ""; }
  if(!last && !watch){
    try{ localStorage.setItem(BACKUP_WATCH_KEY, todayISO()); }catch(e){}
    return "";
  }
  const ref = last || watch;
  if(ref >= addDaysISO(mondayOf(todayISO()), -7)) return "";
  if(!last) return "Pas encore de sauvegarde";
  const days = Math.round((new Date(todayISO() + "T00:00:00") - new Date(last + "T00:00:00")) / 86400000);
  return "Dernière sauvegarde il y a " + days + " jours";
}
function renderBackupNudge(){
  const el = document.getElementById("backupNudge");
  if(!el) return;
  const text = hasAnyList() ? backupNudgeText() : "";
  el.textContent = text;
  el.hidden = !text;
}

// Toutes les clés du navigateur où vivent tes tâches et leur agencement.
const BACKUP_KEYS = [STORAGE_KEY, ORDER_KEY, OVERRIDES_KEY, CUSTOM_KEY, CUSTOM_CATS_KEY, DELETED_CATS_KEY, CAT_TITLE_OVERRIDES_KEY, CHECKED_AT_KEY, TRASH_KEY, LAST_PURGE_KEY, CAT_REVERSE_KEY, WAIT_LOG_KEY];

// Construit une "photo" autonome de la liste : chaque tâche avec tous ses
// champs (titre, note, échéance, personne, urgent, en cours, cochée), dans
// l'ordre d'affichage. Cette photo ne dépend PAS de la base "en dur" du
// fichier : elle peut donc être reconstruite dans n'importe quelle version,
// même à base vide. C'est ce qui rend les sauvegardes vraiment transportables.
function buildSnapshot(){
  const snap = { format:2, exportedAt:new Date().toISOString(), categories:[] };
  getCategoryOrder().forEach(catIdx=>{
    const cat = DATA[catIdx];
    if(!cat || isCategoryDeleted(cat.id)) return;
    const items = getEffectiveItems(cat);
    const catOut = { id:cat.id, title:cat.title, color:cat.color, reversed:isCatReversed(cat.id), items:[] };
    getCatOrder(cat).forEach(idx=>{
      const base = items[idx];
      if(!base) return;
      const key = itemKey(cat.id, idx);
      if(isDeleted(key)) return;
      const eff = getEffective(key, base);
      catOut.items.push({
        t: eff.t, note: eff.note || "", urgent: !!eff.urgent, waiting: !!eff.waiting,
        due: eff.due || "", relance: eff.relance || "", who: eff.who || "", person: eff.person || "",
        tier: eff.tier || "", egg: !!eff.egg, done: !!state[key],
        doneOn: state[key] ? (checkedAt[key] || "") : "",
      });
    });
    snap.categories.push(catOut);
  });
  snap.trash = loadJSONKey(TRASH_KEY, []);
  try{ snap.lastPurge = localStorage.getItem(LAST_PURGE_KEY) || ""; }catch(e){ snap.lastPurge = ""; }
  snap.waitLog = waitLog();
  return snap;
}

// Mémorise le dernier fichier de sauvegarde (son handle) pour rouvrir son
// dossier la fois suivante. L'option "id" de showSaveFilePicker ne persiste
// pas toujours en file://, alors on garde le handle nous-mêmes.
function idbOpen(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open("fauconnerie-fs", 1);
    r.onupgradeneeded = ()=> r.result.createObjectStore("handles");
    r.onsuccess = ()=> res(r.result);
    r.onerror = ()=> rej(r.error);
  });
}
async function idbSetHandle(h){
  const db = await idbOpen();
  await new Promise((res,rej)=>{
    const tx = db.transaction("handles","readwrite");
    tx.objectStore("handles").put(h, "lastBackup");
    tx.oncomplete = res; tx.onerror = ()=> rej(tx.error);
  });
  db.close();
}
async function idbGetHandle(){
  const db = await idbOpen();
  const h = await new Promise((res,rej)=>{
    const tx = db.transaction("handles","readonly");
    const rq = tx.objectStore("handles").get("lastBackup");
    rq.onsuccess = ()=> res(rq.result || null);
    rq.onerror = ()=> rej(rq.error);
  });
  db.close();
  return h;
}

async function exportData(){
  const dump = { app:"sous-le-tapis", version:1, exportedAt:new Date().toISOString(), data:{} };
  BACKUP_KEYS.forEach(k=>{
    const raw = localStorage.getItem(k);
    if(raw !== null) dump.data[k] = raw;
  });
  dump.snapshot = buildSnapshot(); // photo autonome, relisible partout
  const text = JSON.stringify(dump, null, 2);
  const stamp = new Date().toISOString().slice(0,10);
  const suggestedName = "sous-le-tapis-sauvegarde-" + stamp + ".json";

  // Chrome / Edge : vraie fenêtre « Enregistrer sous » où tu choisis le
  // dossier. L'option id fait que le navigateur rouvre le même dossier la
  // fois suivante. Les navigateurs qui ne connaissent pas cette API
  // (Firefox, Safari) retombent sur le téléchargement classique plus bas.
  if(window.showSaveFilePicker){
    try{
      const opts = {
        id: "fauconnerie-v2-backup",
        suggestedName,
        types: [{ description:"Sauvegarde Sous le tapis (JSON)", accept:{ "application/json":[".json"] } }],
      };
      // Point de départ = dossier du dernier enregistrement, s'il est connu.
      try{ const last = await idbGetHandle(); if(last) opts.startIn = last; }catch(e){}
      const handle = await window.showSaveFilePicker(opts);
      const writable = await handle.createWritable();
      await writable.write(text);
      await writable.close();
      try{ await idbSetHandle(handle); }catch(e){}
      noteBackupDone();
      celebrate("Sauvegarde enregistrée");
      return;
    }catch(err){
      if(err && err.name === "AbortError") return; // fenêtre fermée volontairement : on ne fait rien
      // toute autre erreur : on retombe sur le téléchargement classique ci-dessous
    }
  }

  // 8.17 : iPhone / iPad — la feuille de partage permet de ranger le fichier
  // dans Fichiers ou iCloud (ou de l'envoyer par AirDrop / Mail), là où un
  // téléchargement classique finit dans un coin peu visible.
  const isTouchApple = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
    (/Macintosh/.test(navigator.userAgent) && (navigator.maxTouchPoints || 0) > 1);
  if(isTouchApple && navigator.share && window.File && navigator.canShare){
    try{
      const file = new File([text], suggestedName, {type:"application/json"});
      if(navigator.canShare({ files:[file] })){
        await navigator.share({ files:[file], title:"Sauvegarde — Sous le tapis" });
        noteBackupDone();
        celebrate("Sauvegarde enregistrée");
        return;
      }
    }catch(err){
      if(err && err.name === "AbortError") return; // feuille fermée : rien n'est noté
      // toute autre erreur : téléchargement classique ci-dessous
    }
  }

  const blob = new Blob([text], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = suggestedName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
  noteBackupDone();
  celebrate("Sauvegarde enregistrée");
}

function importSnapshot(snap){
  const cats=[], custom={}, newState={}, ord={}, catIdxList=[], newCheckedAt={}, reversed={};
  // 7.43 : les sauvegardes d'avant ne notaient pas le sens des listes ; on
  // ne touche alors pas à celui de ce navigateur.
  const hasReversed = (snap.categories||[]).some(c => c && c.reversed !== undefined);
  (snap.categories||[]).forEach((c, ci)=>{
    if(!c || !c.id) return;
    cats.push({ id:c.id, title:c.title || "(sans titre)", color:c.color || "#7a8a80" });
    if(c.reversed) reversed[c.id] = true;
    const arr=[], idxOrder=[];
    (c.items||[]).forEach((it, idx)=>{
      const item={ t:(it && it.t) || "" };
      if(it.note) item.note=it.note;
      if(it.urgent) item.urgent=true;
      if(it.waiting) item.waiting=true;
      if(it.due) item.due=it.due;
      if(it.waiting && it.relance !== undefined) item.relance=it.relance;
      if(it.who) item.who=it.who;
      if(it.person) item.person=it.person;
      if(it.tier) item.tier=it.tier;
      if(it.egg) item.egg=true;
      arr.push(item);
      if(it.done) newState[c.id+":"+idx]=true;
      if(it.done && it.doneOn) newCheckedAt[c.id+":"+idx]=it.doneOn;
      idxOrder.push(idx);
    });
    custom[c.id]=arr;
    ord[c.id]=idxOrder;
    catIdxList.push(ci);
  });
  ord["__categories__"]=catIdxList;
  try{
    localStorage.setItem(CUSTOM_CATS_KEY, JSON.stringify(cats));
    localStorage.setItem(CUSTOM_KEY, JSON.stringify(custom));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(newState));
    localStorage.setItem(ORDER_KEY, JSON.stringify(ord));
    localStorage.setItem(OVERRIDES_KEY, JSON.stringify({}));
    localStorage.setItem(DELETED_CATS_KEY, JSON.stringify([]));
    localStorage.setItem(CAT_TITLE_OVERRIDES_KEY, JSON.stringify({}));
    localStorage.setItem(CHECKED_AT_KEY, JSON.stringify(newCheckedAt));
    // Une sauvegarde plus ancienne, sans corbeille, ne vide pas celle qui existe.
    if(Array.isArray(snap.trash)) localStorage.setItem(TRASH_KEY, JSON.stringify(snap.trash));
    if(snap.lastPurge) localStorage.setItem(LAST_PURGE_KEY, snap.lastPurge);
    if(Array.isArray(snap.waitLog)) localStorage.setItem(WAIT_LOG_KEY, JSON.stringify(snap.waitLog));
    if(hasReversed) localStorage.setItem(CAT_REVERSE_KEY, JSON.stringify(reversed));
  }catch(e){}
  DATA.length = 0; // la liste est entièrement remplacée
  reloadAllFromStorage();
  renderAll();
}

function importData(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    let dump;
    try{ dump = JSON.parse(reader.result); }
    catch(err){ alert("Ce fichier n'est pas une sauvegarde lisible."); return; }
    // Sauvegarde autonome (photo) : reconstruit toute la liste, quelle que soit
    // la version d'origine. C'est le chemin normal ici.
    if(dump && dump.snapshot && Array.isArray(dump.snapshot.categories)){
      if(!confirm("Importer cette sauvegarde ? Elle remplacera la liste actuelle de ce fichier.")) return;
      importSnapshot(dump.snapshot);
      celebrate("Sauvegarde importée");
      return;
    }
    const data = (dump && dump.data && typeof dump.data === "object") ? dump.data : dump;
    if(!data || typeof data !== "object"){ alert("Ce fichier ne contient pas de sauvegarde reconnaissable."); return; }
    const hasSomething = BACKUP_KEYS.some(k => typeof data[k] === "string");
    if(!hasSomething){ alert("Ce fichier ne ressemble pas à une sauvegarde de cette liste."); return; }
    const ok = confirm("Importer cette sauvegarde ? Elle remplacera les tâches actuellement affichées dans ce navigateur.");
    if(!ok) return;
    BACKUP_KEYS.forEach(k=>{
      if(typeof data[k] === "string"){
        try{ localStorage.setItem(k, data[k]); }catch(e){}
      }
    });
    reloadAllFromStorage(); // on recharge tout depuis ce qu'on vient d'écrire
    renderAll();
    celebrate("Sauvegarde importée");
  };
  reader.readAsText(file);
}

// ---- 7.8 : tapis en filigrane sur l'accueil sans liste ----
let watermarkEl = null, watermarkKey = "";
function updateWatermark(show){
  try{
    const wrap = document.querySelector(".wrap");
    const row = document.getElementById("addCategoryRow");
    const ref = document.querySelector(".progress-card");
    if(!show || !wrap || !row || !ref || typeof TAPIS === "undefined"){
      if(row) row.style.marginTop = "";
      if(watermarkEl){
        const el = watermarkEl; watermarkEl = null; watermarkKey = "";
        el.classList.add("leaving");                 // fondu de sortie
        setTimeout(()=> el.remove(), 750);
      }
      return;
    }
    // largeur des cases, de sous la case compteur jusqu'au bas de la fenêtre
    const wr = wrap.getBoundingClientRect(), rr = ref.getBoundingClientRect();
    const width = rr.width;
    const VW = width >= 600 ? 560 : 400, scale = width / VW;
    const top = rr.bottom - wr.top + 18;
    const height = Math.max(240, window.innerHeight - rr.bottom - 18 - 12);
    const VH = Math.round(height / scale);
    // le bouton d'accueil se pose au centre du tapis (sur le médaillon)
    // … et le champ du nom, plus haut, comme un commencement
    // (marge mesurée au même instant que la position, pour rester juste
    // même pendant le glissement en cours)
    const btn = row.querySelector(".onboarding") || row;
    const brr = btn.getBoundingClientRect();
    const aim = 0.5; // bouton et champ du nom : même centre
    const baseM = 0.85 * parseFloat(getComputedStyle(document.documentElement).fontSize);
    const curM = parseFloat(getComputedStyle(row).marginTop) || baseM;
    const naturalCenter = brr.top - (curM - baseM) + brr.height / 2;
    const shift = Math.max(0, (rr.bottom + 18 + height * aim) - naturalCenter);
    row.style.marginTop = Math.round(baseM + shift) + "px";
    if(!watermarkEl){
      watermarkEl = document.createElement("div");
      watermarkEl.className = "tapis-watermark";
      watermarkEl.setAttribute("aria-hidden", "true");
      wrap.insertBefore(watermarkEl, wrap.firstChild);
    }
    watermarkEl.style.left = (rr.left - wr.left) + "px";
    watermarkEl.style.top = top + "px";
    watermarkEl.style.width = width + "px";
    watermarkEl.style.height = height + "px";
    const key = VW + "x" + VH;
    if(key !== watermarkKey){
      watermarkKey = key;
      const svg = TAPIS.build(VW, VH);
      const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
      const old = watermarkEl.dataset.url;
      watermarkEl.style.backgroundImage = `url("${url}")`;
      watermarkEl.dataset.url = url;
      if(old) setTimeout(()=> URL.revokeObjectURL(old), 1000);
    }
  }catch(err){ console.error("[filigrane]", err); }
}

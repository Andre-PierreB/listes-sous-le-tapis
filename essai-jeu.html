<!DOCTYPE html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banc d'essai — duel de faisans</title>
<link rel="icon" href="icon-faisan-v2-180.png">
<!--
  BANC D'ESSAI DU JEU (essai-jeu.html) — Sous le tapis, à côté de la 10.60
  À lire avant de reprendre (y compris par Claude dans une nouvelle conversation) :

  - Jeu à deux en tour par tour inspiré de GORILLA.BAS (angle, vitesse, vent,
    décor qui se troue), version originale : deux faisans sur les toits d'une
    ville à pignons, objets au choix (stylo plume, roue de vélo, réveil, cœur —
    le réveil est à l'essai, pour comparer avec le stylo).
    Aucun dessin repris de l'original.
  - Page autonome, PAS branchée à l'appli ni à Firebase : la partie est gardée
    dans ce navigateur (localStorage « sltapis-essai-jeu »), on joue à deux sur
    le même écran ; « Tour par tour » simule le passage de l'un à l'autre :
    après son coup, bandeau « En attente de … » sur toute la largeur, en bas
    (glisse, deux notes, puis immobile) ; « H arrive » (banc
    seulement) simule son arrivée : il voit « … a joué ! » (bandeau pleine
    largeur au milieu) et le bouton-poussoir « Voir son coup » rejoue le coup (pas de commentaire : on reste simple). En ouvrant la page : « … a joué ! »
    tant que le dernier coup n'a pas été découvert (game.decouvert ; dans
    l'appli, par personne ; sur le banc : recharger la page) — y compris un coup gagnant : le perdant découvre
    la victoire de l'autre en révélant le coup, jamais la couronne d'emblée.
  - Partie = { seed, regles, shots:[{ p, a, v, o, at }], objets } : tout le
    reste (ville, vent, trous, vainqueur) se recalcule en rejouant les coups
    (worldAfter). Découvrir le coup de l'autre : en arrivant, son dernier
    coup est rejoué (après le bandeau d'attente), et « Revoir le coup de … » le
    rejoue à tout moment (replayLast). Ville et collisions sont calculées (rectangles, triangles,
    cercles des trous), jamais lues dans les pixels : le même coup donne le
    même résultat sur tous les appareils. C'est ce qui permettra de ranger
    une partie dans une liste partagée comme les messages de l'écran de chat
    (10.57) : un coup = une tâche { t:"45 60 roue", by, at }.
  - Prénoms entiers pour la victoire, l'attente et les messages (nom) ;
    initiales pour l'invite « AP> ».
  - Couleurs du décor : ciel neutre pendant la partie (le ciel de fête de
    la fin doit trancher) ; propositions au choix (PALETTES, réglage pal),
    appliquées en mode clair par applyPalette ; le sombre garde les siennes.
  - Réglages du banc dans l'adresse (?g=…&vent=…&trou=…&decor=…&pal=…
    &trace=…&son=…&tpt=…) ; bouton « Copier le lien des réglages ».
    Changer une règle recommence la partie (même graine).
  - Deux faisans (PLUMES : 0 au collier blanc, 1 à huppe dorée), sans nom :
    chacun prend le prénom de son joueur. Celui qui lance la partie choisit le
    sien avant le premier coup (game.perso, persoOf) ; l'autre prend l'autre. Fin de partie : cri
    « kôk-kôk », petite fanfare originale et danse du vainqueur, une aile en
    haut / une en bas, inversées à chaque temps, de face (drawPheasantFront),
    petits bonds et plumes qui volent (DANCE_BEAT, DANCE_BEATS).
    Explosion : boule de feu, onde de choc, morceaux de façade, fumée,
    secousse de l'écran, bord du trou roussi. Coups précédents des deux
    joueurs affichés d'office ; résultat de chaque coup dans le panneau.
  - Couleurs : celles de l'appli (variables reprises de index.html, clair et
    sombre). Décor : façades mauve et sauge éteints (--facades) posées avec
    l'ombre des cartes, ciel neutre = fond de page ; joueurs aux
    couleurs de l'écran de chat (--chat-me, --chat-them).
  - Une partie = une touche (pas de manches ni de score) ; bouton « Nouvelle
    partie ». Objets : stylo plume (éclate en lettres ; griffonnage « scratch-scratch » en rythme),
    roue de vélo (rayons et bouts de pneu qui volent ; clic-clic de
    roue libre qui ralentit, puis « dring dring ! » en rythme), réveil (rouages, ressorts et chiffres ;
    sonnerie par paquets de plus en plus aigus, « boïng » du ressort), cœur (éclate en bisous, « smack »). Fin de partie : couronne sur
    le vainqueur, ciel qui vire au mauve et au citron, toutes les fenêtres
    qui s'allument, confettis (finale).
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Courier+Prime:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap');

/* ---------- couleurs (celles de l'appli) ---------- */
:root{
  --bg-top:#F7FAF9; --bg-bottom:#ECEFEF;
  --surface:#FFFFFF;
  --ink:#2A2725; --ink-soft:#6B6560; --ink-faint:#A39C94;
  --accent:#4993A2; --accent-soft:#E4ECF3;
  --btn-ink:#4A5E6E;
  --logo-green:#7DB536; --logo-green-strong:#64992A;
  --chat-me:#2F6F7C; --chat-them:var(--logo-green-strong);
  --urgent:#9558D0;
  --rose:#D98DA1;
  --lucky-bg:#FCFBE9; --lucky-lemon:#E6D63C;
  --line:#EDE7DC;
  --shadow: 0 1px 2px rgba(30,40,45,0.04), 0 8px 24px -12px rgba(30,40,45,0.12);
  /* propres au jeu */
  /* décor : façades mauve et sauge éteints, ciel neutre = fond de page (réglés par applyPalette en clair) */
  --sky-top:#F7FAF9; --sky-bottom:#E6EAEA;
  --sky-end-top:#EFE3FA; --sky-end-bottom:#FCF8DA;   /* fin de partie : ciel de fête */
  --cloud:rgba(255,255,255,0.9);
  --facades:#E3DBEB,#D8E2CF,#EEF0EC,#DFE5E9,#E8E1EE;
  --facade-shadow:rgba(30,40,45,0.10);
  --win-lit:rgba(230,214,60,0.20); --win-off:rgba(42,39,37,0.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg-top:#1B252B; --bg-bottom:#101315;
    --surface:#1C2125;
    --ink:#EDF0F1; --ink-soft:#AEB6BA; --ink-faint:#78838A;
    --accent:#7DBFCB; --accent-soft:#1C2B30;
    --btn-ink:#AFC0CC;
    --logo-green:#A9D65A; --logo-green-strong:#C7E58A;
    --chat-me:#7FC0CC; --chat-them:var(--logo-green);
    --line:#2A3238;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    --sky-top:#1B252B; --sky-bottom:#101315;
    --sky-end-top:#2A2140; --sky-end-bottom:#24231A;
    --cloud:rgba(255,255,255,0.05);
    --facades:#261D33,#26261C,#1E2A1C,#2B2238,#2A2A1D;
    --facade-shadow:rgba(0,0,0,0.45);
    --win-lit:rgba(226,200,102,0.22); --win-off:rgba(255,255,255,0.035);
  }
}

/* ---------- page ---------- */
*{ box-sizing:border-box; }
body{
  margin:0; min-height:100vh; color:var(--ink);
  background:linear-gradient(180deg, var(--bg-top), var(--bg-bottom)) fixed;
  font-family:'Public Sans', system-ui, -apple-system, sans-serif;
}
.wrap{ max-width:1240px; margin:0 auto; padding:1.4rem 1rem 3rem; }
.kicker{
  font:700 0.72rem 'Courier Prime', monospace; letter-spacing:0.08em;
  text-transform:uppercase; color:var(--ink-soft);
}
h1{ margin:0.15rem 0 1rem; font-size:1.35rem; font-weight:700; color:var(--logo-green); }
.layout{ display:grid; grid-template-columns:minmax(0,1fr) 16rem; gap:1.2rem; align-items:start; }
@media (max-width:900px){ .layout{ grid-template-columns:1fr; } }

/* ---------- scène ---------- */
.stage{ background:var(--surface); border-radius:18px; box-shadow:var(--shadow); padding:0.6rem; }
.screen{ position:relative; }
canvas#jeu{ display:block; width:100%; aspect-ratio:16/9; border-radius:12px; touch-action:manipulation; }
/* bandeaux du tour par tour : toute la largeur du jeu, immobiles une fois posés (rien qui bouge en attente)
   — « En attente de … » en bas, discret ; « … a joué ! » au milieu, avec le bouton-poussoir pour révéler le coup */
.attente{
  position:absolute; left:0; right:0; bottom:0; transform:translateY(100%); opacity:0;
  display:flex; align-items:center; justify-content:center; gap:1rem; padding:0.55rem 1rem;
  background:color-mix(in srgb, var(--surface) 95%, transparent);   /* pas de backdrop-filter : trop lourd au-dessus d'un canevas animé */
  border-top:1px solid color-mix(in srgb, var(--pc) 30%, var(--line)); border-radius:0 0 12px 12px;
  color:var(--pc); font:700 1rem 'Courier Prime', monospace; white-space:nowrap; pointer-events:none; visibility:hidden;
  transition:transform .45s cubic-bezier(.2,.8,.3,1), opacity .3s, visibility 0s .45s;
}
.attente.on{ transform:translateY(0); opacity:1; pointer-events:auto; visibility:visible; transition:transform .45s cubic-bezier(.2,.8,.3,1), opacity .3s, visibility 0s; }
.attente .btn{ font-size:0.78rem; padding:0.3rem 0.8rem; min-height:0; }
.attente.decouverte{
  top:50%; bottom:auto; transform:translateY(-50%) scaleY(0); border-radius:0; flex-direction:column;   /* texte, puis le bouton dessous */
  background:color-mix(in srgb, var(--pc) 9%, color-mix(in srgb, var(--surface) 96%, transparent));
  border-top:2px solid color-mix(in srgb, var(--pc) 40%, transparent); border-bottom:2px solid color-mix(in srgb, var(--pc) 40%, transparent);
  font-size:1.3rem;
}
.attente.decouverte.on{ transform:translateY(-50%) scaleY(1); }
/* bouton-poussoir : une vraie touche, avec sa tranche, qui s'enfonce quand on appuie */
/* boutons « écran » : esprit informatique vintage (invite C:\ de l'écran de chat) — Courier Prime, coins presque
   droits, ombre portée dure sans flou ; le bouton glisse sur son ombre quand on appuie */
.poussoir, #lancer{
  font:700 1rem 'Courier Prime', monospace; color:var(--pc); background:var(--surface); cursor:pointer;
  border:2px solid var(--pc); border-radius:3px; padding:0.38rem 1.1rem; letter-spacing:0.02em; line-height:1.2;
  box-shadow:3px 3px 0 var(--pc); transform:translate(0, 0); transition:transform .06s, box-shadow .06s, background .12s;
}
#lancer{ --pc:var(--pcolor); min-width:7.5em; }
.poussoir::before{ content:"> "; }
@media (hover:hover){ .poussoir:hover, #lancer:not(:disabled):hover{ background:color-mix(in srgb, var(--pc) 9%, var(--surface)); } }
.poussoir:active, #lancer:not(:disabled):active{ transform:translate(3px, 3px); box-shadow:0 0 0 var(--pc); }
#lancer:disabled{ opacity:1; cursor:default; color:var(--ink-faint); border-color:var(--line); box-shadow:3px 3px 0 var(--line); background:var(--surface); }
@media (pointer:coarse){ .attente .btn{ min-height:40px; } .poussoir, #lancer{ min-height:44px; } }
@media (max-width:560px){
  .attente{ gap:0.6rem; padding:0.35rem 0.6rem; font-size:0.8rem; }
  .attente .btn{ font-size:0.72rem; padding:0 0.6rem; min-height:34px; }
  .attente.decouverte{ font-size:0.95rem; padding:0.55rem 0.5rem 0.75rem; gap:0.5rem; }
  .poussoir{ font-size:0.9rem; padding:0.3rem 0.9rem; }
}

/* ---------- ligne du coup (esprit invite C:\ de l'écran de chat) ---------- */
.coup{
  display:flex; flex-wrap:wrap; align-items:center; gap:0.6rem 1.1rem;
  padding:0.75rem 0.5rem 0.35rem; font-family:'Courier Prime', monospace; font-size:1.05rem;
}
.invite{ font-weight:700; min-width:2.6em; }
.coup .reglage{ display:flex; align-items:center; gap:0.35rem; color:var(--ink-soft); }
.coup input{
  width:3.3em; font:700 1.1rem 'Courier Prime', monospace; color:var(--ink);
  background:transparent; border:0; border-bottom:2px solid var(--line);
  padding:0.1rem 0.15rem; text-align:center; outline:none;
}
.coup input:focus{ border-bottom-color:currentColor; }
.coup input::-webkit-inner-spin-button{ opacity:0.4; }
/* boutons − / + : seulement au doigt (à la souris, les petites flèches du champ suffisent) ; appui long = ça défile */
.pas{ display:none; width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
  font:600 1.15rem/1 'Public Sans', sans-serif; padding:0; cursor:pointer; touch-action:manipulation; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
.pas:active{ background:color-mix(in srgb, var(--pcolor) 14%, var(--surface)); color:var(--pcolor); }
@media (pointer:coarse){
  .pas{ display:inline-grid; place-items:center; }
  .coup input{ -moz-appearance:textfield; }
  .coup input::-webkit-inner-spin-button, .coup input::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
}
.objets{ display:flex; gap:0.25rem; }
.objets button{
  width:34px; height:34px; padding:0; border:0; border-radius:10px; cursor:pointer;
  background:transparent; display:grid; place-items:center;
  transition:background .15s, box-shadow .15s;
}
.objets button:hover{ background:color-mix(in srgb, var(--accent) 10%, transparent); }
.objets button.on{ box-shadow:inset 0 0 0 2px var(--pcolor); }
.objets canvas{ width:30px; height:30px; pointer-events:none; }
.persos{ display:flex; gap:0.25rem; align-items:center; padding-right:0.6rem; margin-right:0.2rem; border-right:1px solid var(--line); }
.persos[hidden]{ display:none; }
.persos button{ width:44px; height:38px; padding:0; border:0; border-radius:10px; cursor:pointer; background:transparent; display:grid; place-items:center; transition:background .15s, box-shadow .15s; }
@media (hover:hover){ .persos button:hover{ background:color-mix(in srgb, var(--accent) 10%, transparent); } }
.persos button.on{ box-shadow:inset 0 0 0 2px var(--pcolor); }
.persos canvas{ width:40px; height:34px; pointer-events:none; }
@media (pointer:coarse){ .persos button{ width:50px; height:46px; } }
.btn{
  font:600 0.92rem 'Public Sans', sans-serif; color:var(--btn-ink);
  background:var(--surface); border:1px solid var(--line); border-radius:10px;
  padding:0.45rem 1.1rem; cursor:pointer; transition:background .15s, color .15s, border-color .15s;
}
@media (hover:hover){ .btn:hover{ background:color-mix(in srgb, var(--logo-green) 16%, var(--surface)); border-color:color-mix(in srgb, var(--logo-green) 40%, var(--line)); } }
.btn:disabled{ opacity:0.45; cursor:default; background:var(--surface); }
.coup #revoir{ margin-left:auto; font-family:'Courier Prime', monospace; font-weight:700; }
.btn.ghost{ background:transparent; border-color:transparent; color:var(--ink-soft); }
.btn.ghost:hover{ background:color-mix(in srgb, var(--accent) 10%, transparent); border-color:transparent; }
/* tailles de boutons : souris (compact) / doigt (44 px au moins, iPhone) */
@media (pointer:fine){
  .objets button{ width:38px; height:38px; }
}
@media (pointer:coarse){
  .objets button{ width:46px; height:46px; border-radius:12px; }
  .objets canvas{ width:34px; height:34px; }
  .btn{ min-height:46px; padding:0 1.4rem; font-size:1rem; }
  .coup input{ min-height:42px; width:3.6em; }
  .banc .btn{ min-height:44px; }
  .sw{ min-height:40px; }
}
@media (max-width:560px){
  .coup{ display:grid; grid-template-columns:auto 1fr; gap:0.6rem 0.8rem; padding:0.8rem 0.3rem 0.4rem; }
  .coup .invite{ grid-row:1 / 3; align-self:center; }
  .coup .reglage{ grid-column:2; gap:0.5rem; }
  .coup .reglage > span:first-child{ min-width:4.3em; }
  .coup .persos{ grid-column:1 / -1; border-right:0; padding-right:0; }
  .coup .objets{ grid-column:1 / -1; }
  .coup #lancer{ grid-column:1 / -1; justify-self:stretch; margin-right:3px; }
  .coup #revoir{ grid-column:1 / -1; justify-self:center; margin-left:0; white-space:nowrap; padding:0 0.4rem; }
}
.statut{ min-height:1.3em; padding:0 0.5rem 0.3rem; font-size:0.85rem; color:var(--ink-soft); }

/* ---------- panneau du banc ---------- */
.banc{
  background:var(--surface); border-radius:14px; box-shadow:var(--shadow);
  padding:0.9rem; font-size:0.85rem;
}
.banc h2{ margin:0 0 0.6rem; }
.reg{ margin:0.55rem 0; }
.reg .lab{ display:flex; justify-content:space-between; color:var(--ink-soft); margin-bottom:0.15rem; }
.reg .lab b{ font:700 0.85rem 'Courier Prime', monospace; color:var(--ink); }
.reg input[type=range]{ width:100%; accent-color:var(--accent); }
.reg select{ width:100%; font:inherit; padding:0.25rem; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink); }
.sw{ display:flex; align-items:center; gap:0.45rem; margin:0.4rem 0; cursor:pointer; color:var(--ink); }
.sw input{ accent-color:var(--accent); }
.banc .btn{ display:block; width:100%; margin-top:0.45rem; font-size:0.82rem; padding:0.4rem; }
.note{ font-size:0.72rem; color:var(--ink-faint); margin-top:0.3rem; }
.trace{
  margin-top:0.8rem; border-top:1px solid var(--line); padding-top:0.6rem;
}
.trace pre{
  margin:0.35rem 0 0; font:0.74rem/1.45 'Courier Prime', monospace; color:var(--ink-soft);
  max-height:12rem; overflow:auto; white-space:pre-wrap;
}
</style>

<div class="wrap">
  <div class="kicker">Banc d'essai · Sous le tapis</div>
  <h1>Duel de faisans</h1>
  <div class="layout">
    <div class="stage">
      <div class="screen">
        <canvas id="jeu"></canvas>
        <div class="attente" id="attente">
          <span id="attenteQui"></span>
          <button type="button" class="btn ghost" id="attenteGo"></button>
        </div>
      </div>
      <div class="coup" id="coup">
        <span class="invite" id="invite"></span>
        <div class="reglage"><span>angle</span><button type="button" class="pas" data-for="angle" data-d="-1" aria-label="Moins">−</button><input id="angle" type="number" min="0" max="90" step="1" inputmode="numeric"><button type="button" class="pas" data-for="angle" data-d="1" aria-label="Plus">+</button><span class="unite">°</span></div>
        <div class="reglage"><span>vitesse</span><button type="button" class="pas" data-for="vitesse" data-d="-1" aria-label="Moins">−</button><input id="vitesse" type="number" min="1" max="200" step="1" inputmode="numeric"><button type="button" class="pas" data-for="vitesse" data-d="1" aria-label="Plus">+</button></div>
        <div class="persos" id="persos" title="Votre faisan (l'autre joueur prend l'autre)"></div>
        <div class="objets" id="objets"></div>
        <button type="button" class="btn ghost" id="revoir">Revoir</button>
        <button type="button" id="lancer">Lancer</button>
      </div>
      <div class="statut" id="statut"></div>
    </div>

    <aside class="banc" id="banc">
      <h2 class="kicker">Réglages du banc</h2>
      <div class="reg"><div class="lab">Gravité <b data-v="g"></b></div><input type="range" data-k="g" min="200" max="600" step="20"></div>
      <div class="reg"><div class="lab">Vent maximal <b data-v="vent"></b></div><input type="range" data-k="vent" min="0" max="15" step="1"></div>
      <div class="reg"><div class="lab">Taille des trous <b data-v="trou"></b></div><input type="range" data-k="trou" min="10" max="44" step="2"></div>
      <div class="reg"><div class="lab">Décor</div>
        <select data-k="decor">
          <option value="mixte">Pignons, pointes et toits plats</option>
          <option value="pignons">Pignons à gradins</option>
          <option value="plats">Toits plats</option>
        </select>
      </div>
      <div class="reg"><div class="lab">Couleurs</div>
        <select data-k="pal">
          <option value="sauge">Ciel neutre, façades mauve et sauge</option>
          <option value="blocs">Blocs blancs de l'appli</option>
          <option value="pastels">Pastels (version précédente)</option>
        </select>
      </div>
      <label class="sw"><input type="checkbox" data-k="trace"> Trace du coup précédent</label>
      <label class="sw"><input type="checkbox" data-k="son"> Sons</label>
      <label class="sw"><input type="checkbox" data-k="tpt"> Tour par tour (passer l'écran)</label>
      <div class="note">Changer une règle recommence la partie.</div>
      <button type="button" class="btn" id="nouvelle">Nouvelle partie</button>
      <button type="button" class="btn" id="annuler">Annuler le dernier coup</button>
      <button type="button" class="btn" id="copier">Copier le lien des réglages</button>
      <div class="trace">
        <div class="kicker">Ce que garderait la liste partagée</div>
        <pre id="etat"></pre>
      </div>
    </aside>
  </div>
</div>

<script>
"use strict";
// =====================================================================
//  Réglages (adresse) et constantes
// =====================================================================
const W = 960, H = 540;
const DEF = { g:360, vent:10, trou:22, decor:"mixte", pal:"sauge", trace:1, son:1, tpt:1 };
const RULE_KEYS = ["g","vent","trou","decor"];
const S = (()=>{
  const q = new URLSearchParams(location.search), s = { ...DEF };
  for(const k in DEF) if(q.has(k)) s[k] = typeof DEF[k] === "number" ? Number(q.get(k)) : q.get(k);
  return s;
})();
const PLAYERS = [ { ini:"AP", nom:"André-Pierre", color:"--chat-me" }, { ini:"H", nom:"Hiske", color:"--chat-them" } ];
const de = n => (/^[aeiouyéèêâîôû]/i.test(n) ? "d'" : "de ") + n;   // « d'André-Pierre », « de Hiske »
const OBJETS = { stylo:"Stylo plume", roue:"Roue de vélo", reveil:"Réveil", coeur:"Cœur" };
const OBJ_SIZE = { stylo: 1.15, roue: 1, reveil: 1.1, coeur: 1 };   // taille en vol
const OBJETS_ART = { stylo:"un stylo plume", roue:"une roue de vélo", reveil:"un réveil", coeur:"un cœur" };

const STORE_KEY = "sltapis-essai-jeu";
const DT = 1/240;                 // pas de calcul fixe : même résultat partout
const SPEED = 6, WIND = 6;        // vitesse saisie → px/s ; vent affiché → px/s²


// =====================================================================
//  Hasard reproductible
// =====================================================================
function rng(seed){
  let a = seed >>> 0;
  return ()=>{ a = (a + 0x6D2B79F5) >>> 0; let t = a;
    t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

let game = null;
game = load() || newGame();
function newGame(seed){
  return { seed: seed ?? (Math.random() * 2**31 | 0),
           regles: Object.fromEntries(RULE_KEYS.map(k => [k, S[k]])),
           shots: [], perso: [0, 1], objets: (game && game.objets) || ["roue", "coeur"] };
}
function load(){
  try{ const g = JSON.parse(localStorage.getItem(STORE_KEY));
    if(g && RULE_KEYS.every(k => g.regles[k] === S[k])){
      g.objets = (g.objets || []).map((o, i) => o in OBJETS ? o : ["roue", "coeur"][i]);
      if(g.shots.every(s => s.o in OBJETS)) return g; } }catch(e){}
  return null;
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(game)); }catch(e){} renderEtat(); }
const R = () => game.regles;

function makeCity(seed, round){
  const r = rng(seed * 7 + round * 7919 + 1);
  const bs = []; let x = 0, lastC = -1;
  while(x < W){
    let w = Math.round(58 + r() * 52);
    if(W - x < 120) w = W - x;
    const h = Math.round(130 + r() * 230);
    let c; do c = Math.floor(r() * 5); while(c === lastC); lastC = c;   // 5 teintes de façade (--facades)
    const d = R().decor, t = r();
    const roof = d === "plats" ? "flat" : d === "pignons" ? (t < 0.85 ? "steps" : "flat")
               : (t < 0.4 ? "steps" : t < 0.65 ? "point" : "flat");
    bs.push({ x, w, top: H - h, c, roof, wseed: Math.floor(r() * 1e9) });
    x += w;
  }
  const n = bs.length;
  const i0 = 1 + Math.floor(r() * 2), i1 = n - 2 - Math.floor(r() * 2);
  for(const i of [i0, i1]){ bs[i].roof = "flat"; bs[i].top = Math.max(bs[i].top, H - 300); }
  const ph = [i0, i1].map(i => ({ x: bs[i].x + bs[i].w / 2, y: bs[i].top }));
  // formes de collision
  const shapes = [];
  for(const b of bs){
    shapes.push({ k:"rect", x:b.x, y:b.top, w:b.w, h:H - b.top });
    if(b.roof === "steps"){
      const n = 3, sh = 13;
      for(let s = 1; s <= n; s++){ const ww = b.w * (1 - s / (n + 1.4));
        shapes.push({ k:"rect", x:b.x + (b.w - ww) / 2, y:b.top - s * sh, w:ww, h:sh }); }
    }else if(b.roof === "point"){
      shapes.push({ k:"tri", x:b.x, w:b.w, base:b.top, apex:b.top - b.w * 0.42 });
    }
  }
  return { bs, ph, shapes };
}
function freshWorld(){
  const city = makeCity(game.seed, 0);
  const r = rng(game.seed * 31 + 17);
  const wind = Math.round((r() * 2 - 1) * R().vent);
  return { city, ph: city.ph, craters: [], wind, over: false, lastPath: [null, null] };
}
// cœur unité (polygone) : sert à la fois à dessiner le trou et à savoir si un point est dedans
const HEART = Array.from({ length: 48 }, (_, i) => { const t = i / 48 * Math.PI * 2;
  return [16 * Math.sin(t) ** 3 / 16, -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 16 + 0.15]; });
function inHeart(px, py){   // point déjà ramené à l'unité
  let inside = false;
  for(let i = 0, j = HEART.length - 1; i < HEART.length; j = i++){
    const [xi, yi] = HEART[i], [xj, yj] = HEART[j];
    if((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
const inCrater = (c, x, y) => c.shape === "coeur" ? inHeart((x - c.x) / c.r, (y - c.y) / c.r) : (x - c.x) ** 2 + (y - c.y) ** 2 < c.r * c.r;
function craterPath(c2, c, grow = 0){
  c2.beginPath();
  if(c.shape === "coeur"){ const k = c.r + grow; HEART.forEach(([hx, hy], i) => i ? c2.lineTo(c.x + hx * k, c.y + hy * k) : c2.moveTo(c.x + hx * k, c.y + hy * k)); c2.closePath(); }
  else c2.arc(c.x, c.y, c.r + grow, 0, 7);
}
function solid(w, x, y){
  let inside = false;
  for(const s of w.city.shapes){
    if(s.k === "rect"){ if(x >= s.x && x <= s.x + s.w && y >= s.y && y <= s.y + s.h){ inside = true; break; } }
    else if(y <= s.base && x >= s.x && x <= s.x + s.w){
      const half = s.w / 2, lim = s.apex + Math.abs(x - (s.x + half)) / half * (s.base - s.apex);
      if(y >= lim){ inside = true; break; }
    }
  }
  if(!inside) return false;
  for(const c of w.craters) if(inCrater(c, x, y)) return false;
  return true;
}
// un coup : trajectoire complète, calculée d'avance
function simulate(w, shot){
  const P = w.ph[shot.p], dir = shot.p === 0 ? 1 : -1;
  const a = shot.a * Math.PI / 180, v = shot.v * SPEED;
  let x = P.x + dir * 8, y = P.y - 40, vx = Math.cos(a) * v * dir, vy = -Math.sin(a) * v;
  const ax = w.wind * WIND, g = R().g, path = [x, y];
  for(let i = 1; i < 240 * 25; i++){
    vx += ax * DT; vy += g * DT; x += vx * DT; y += vy * DT;
    if(i % 4 === 0) path.push(x, y);                         // un point par image (60 /s)
    for(let k = 0; k < 2; k++){
      if(k === shot.p && i < 60) continue;
      const q = w.ph[k];
      if(Math.abs(x - q.x) < 18 && y > q.y - 42 && y < q.y + 2){ path.push(x, y); return { path, end:{ kind:"hit", x, y, victim:k } }; }
    }
    if(x < -80 || x > W + 80 || y > H + 10){ path.push(x, y); return { path, end:{ kind:"miss", x, y } }; }
    if(y > 0 && solid(w, x, y)){ path.push(x, y); return { path, end:{ kind:"city", x, y } }; }
  }
  return { path, end:{ kind:"miss", x, y } };
}
function applyResult(w, shot, res){
  w.lastPath[shot.p] = res.path;
  const coeur = shot.o === "coeur";   // le cœur laisse un trou en forme de cœur
  if(res.end.kind === "city") w.craters.push({ x:res.end.x, y:res.end.y, r:R().trou * (coeur ? 1.35 : 1), shape: coeur ? "coeur" : undefined });
  if(res.end.kind !== "hit") return w;
  // une partie = une touche : celui qui touche l'autre gagne (se toucher soi-même fait gagner l'autre)
  w.over = true; w.winner = res.end.victim === shot.p ? 1 - shot.p : shot.p; w.fallen = res.end.victim;
  w.craters.push({ x:res.end.x, y:res.end.y, r:R().trou * 1.6, shape: coeur ? "coeur" : undefined });
  return w;
}
function worldAfter(n){
  let w = freshWorld();
  for(let i = 0; i < n; i++) w = applyResult(w, game.shots[i], simulate(w, game.shots[i]));
  return w;
}
const persoOf = k => (game.perso || [0, 1])[k];   // 0 : faisan au collier blanc, 1 : faisan à huppe dorée
const turn = () => game.shots.length ? 1 - game.shots[game.shots.length - 1].p : 0;
function lastShotOf(p){ for(let i = game.shots.length - 1 - (hideLast ? 1 : 0); i >= 0; i--) if(game.shots[i].p === p) return game.shots[i]; return null; }

const cv = $("#jeu"), ctx = cv.getContext("2d");
const city = document.createElement("canvas"), cctx = city.getContext("2d");
let DPR = 1;
function sizeCanvas(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  for(const c of [cv, city]){ c.width = W * DPR; c.height = H * DPR; }
}

function facade(i){ const f = css("--facades").split(","); return f[i % f.length].trim(); }

function lerpHex(a, b, t){
  const p = h => [1,3,5].map(i => parseInt(h.slice(i, i + 2), 16));
  const A = p(a), B = p(b);
  return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, "0")).join("");
}
function renderCity(w, lights = 0){   // lights : 0 → 1, toutes les fenêtres s'allument à la fin de la partie
  cctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cctx.globalCompositeOperation = "source-over";
  cctx.clearRect(0, 0, W, H);
  const lit = css("--win-lit"), off = css("--win-off");
  for(const b of w.city.bs){
    // silhouette (façade + toit), posée comme une carte de l'appli : ombre douce
    cctx.beginPath();
    if(b.roof === "steps"){
      const n = 3, sh = 13; cctx.moveTo(b.x, H); cctx.lineTo(b.x, b.top);
      for(let s = 1; s <= n; s++){ const ww = b.w * (1 - s / (n + 1.4)), x0 = b.x + (b.w - ww) / 2;
        cctx.lineTo(x0, b.top - (s - 1) * sh); cctx.lineTo(x0, b.top - s * sh); }
      for(let s = n; s >= 1; s--){ const ww = b.w * (1 - s / (n + 1.4)), x1 = b.x + (b.w + ww) / 2;
        cctx.lineTo(x1, b.top - s * sh); cctx.lineTo(x1, b.top - (s - 1) * sh); }
      cctx.lineTo(b.x + b.w, b.top); cctx.lineTo(b.x + b.w, H);
    }else if(b.roof === "point"){
      cctx.moveTo(b.x, H); cctx.lineTo(b.x, b.top); cctx.lineTo(b.x + b.w / 2, b.top - b.w * 0.42);
      cctx.lineTo(b.x + b.w, b.top); cctx.lineTo(b.x + b.w, H);
    }else cctx.rect(b.x, b.top, b.w, H - b.top);
    cctx.closePath();
    cctx.save();
    cctx.shadowColor = css("--facade-shadow"); cctx.shadowBlur = 14; cctx.shadowOffsetY = 2;
    cctx.fillStyle = facade(b.c); cctx.fill();
    cctx.restore();
    // fenêtres
    const r = rng(b.wseed);
    const cols = Math.max(1, Math.floor((b.w - 14) / 15)), rows = Math.floor((H - b.top - 20) / 21);
    const gx = (b.w - cols * 15 + 6) / 2;
    for(let j = 0; j < rows; j++) for(let i = 0; i < cols; i++){
      cctx.fillStyle = r() < 0.32 + 0.68 * lights ? lit : off;
      roundRect(cctx, b.x + gx + i * 15, b.top + 14 + j * 21, 8, 11, 1.5); cctx.fill();
    }
  }
  // trous
  cctx.globalCompositeOperation = "destination-out";
  cctx.fillStyle = "#000";   // opaque : sinon le trou prend la transparence de la dernière fenêtre (trous à moitié faits)
  for(const c of w.craters){ craterPath(cctx, c); cctx.fill(); }
  cctx.globalCompositeOperation = "source-atop";
  for(const c of w.craters){
    if(c.shape === "coeur"){   // bord roussi rose autour du cœur
      cctx.lineJoin = "round";
      for(const [lw, a] of [[12, 0.07], [6, 0.14], [2.5, 0.25]]){ cctx.strokeStyle = `rgba(150,40,70,${a})`; cctx.lineWidth = lw; craterPath(cctx, c, 0.5); cctx.stroke(); }
      continue;
    }
    const g = cctx.createRadialGradient(c.x, c.y, c.r, c.x, c.y, c.r + 9);
    g.addColorStop(0, "rgba(40,25,15,0.38)"); g.addColorStop(0.35, "rgba(40,25,15,0.16)"); g.addColorStop(1, "rgba(40,25,15,0)");
    cctx.fillStyle = g; cctx.beginPath(); cctx.arc(c.x, c.y, c.r + 9, 0, 7); cctx.fill();
  }
  cctx.globalCompositeOperation = "source-over";
}
function roundRect(c, x, y, w, h, r){
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

// faisans dessinés ici (tournés vers la droite si dir = 1), pieds en (0, 0)
// kind 0 : faisan au collier blanc ; kind 1 : faisan à huppe dorée (attribués par game.perso)
const PLUMES = [
  { tail:"#C9954A", bar:"#6B4A2A", body:"#B4612F", dots:"rgba(255,230,190,0.55)", wing:"#9A6A39", wingFar:"#7E5530",
    neck:"#1F5B57", head:"#24504F", face:"#D23B36", ring:"#FFFFFF" },
  { tail:"#C9A066", bar:"#5A4630", body:"#C8352C", dots:"rgba(255,200,120,0.55)", wing:"#3D5A9E", wingFar:"#2E4579",
    neck:"#E8892E", head:"#EBC23E", face:"#F3D98A", ring:null }
];
function drawPheasant(c, x, y, dir, o = {}){
  const P = PLUMES[o.kind || 0];
  c.save(); c.translate(x, y); c.scale(dir * 1.15, 1.15);
  if(o.rot) c.rotate(o.rot);
  c.globalAlpha = o.alpha ?? 1;
  const wing = (val, col) => {        // val : 1 = levée, -1 = baissée
    const L = 9.5 + Math.max(0, val) * 3.5;   // levée, l'aile se déploie
    c.save(); c.translate(-1, -21); c.rotate(val * 1.45);
    c.fillStyle = col; c.beginPath(); c.ellipse(-L / 2 - 0.5, 0.5, L, 4.8, -0.1, 0, 7); c.fill();
    c.strokeStyle = "rgba(40,25,10,0.3)"; c.lineWidth = 0.9;
    c.beginPath(); c.moveTo(-12, 1.5); c.lineTo(0, 0); c.moveTo(-11, 3.4); c.lineTo(-1, 2.4); c.stroke();
    c.restore();
  };
  // queue
  c.fillStyle = P.tail;
  c.beginPath(); c.moveTo(-7, -21); c.lineTo(-47, -35); c.lineTo(-48, -31); c.lineTo(-7, -14); c.fill();
  c.strokeStyle = P.bar; c.lineWidth = 1.1;
  for(let i = 0; i < 5; i++){ const t = 0.2 + i * 0.16, px = -7 - 40 * t, py = -17.5 - 15 * t;
    c.beginPath(); c.moveTo(px, py - 3.2 + t * 1.5); c.lineTo(px - 1.2, py + 3 - t * 1.2); c.stroke(); }
  // aile de l'autre côté (ne se voit que levée)
  if(o.wingFar != null) wing(o.wingFar, P.wingFar);
  // pattes
  c.strokeStyle = "#8C8178"; c.lineWidth = 1.6; c.lineCap = "round";
  c.beginPath(); c.moveTo(-2, -10); c.lineTo(-3, 0); c.moveTo(4, -10); c.lineTo(5.5, 0); c.stroke();
  // corps
  c.fillStyle = P.body;
  c.beginPath(); c.ellipse(0, -17, 14, 9.5, -0.15, 0, 7); c.fill();
  c.fillStyle = P.dots;
  for(const [a, b] of [[-6,-19],[-1,-14],[4,-18],[-4,-13],[7,-14]]){ c.beginPath(); c.arc(a, b, 1, 0, 7); c.fill(); }
  // aile de ce côté
  wing(o.wing || 0, P.wing);
  // cou (cape barrée pour le doré, collier blanc pour le commun)
  c.strokeStyle = P.neck; c.lineWidth = 7; c.lineCap = "round";
  c.beginPath(); c.moveTo(8, -21); c.quadraticCurveTo(13, -27, 13, -33); c.stroke();
  if(P.ring){ c.strokeStyle = P.ring; c.lineWidth = 1.6; c.beginPath(); c.ellipse(10.5, -24.5, 3.6, 1.4, -0.6, 0, 7); c.stroke(); }
  else{ c.strokeStyle = "rgba(40,20,10,0.55)"; c.lineWidth = 0.9;
    for(const t of [0.25, 0.5, 0.75]){ const yy = -21 - 12 * t; c.beginPath(); c.moveTo(8 + 6 * t - 3, yy + 1); c.lineTo(8 + 6 * t + 3, yy - 1); c.stroke(); } }
  // tête
  c.fillStyle = P.head; c.beginPath(); c.arc(14, -35, 5.5, 0, 7); c.fill();
  if(P.ring){ c.beginPath(); c.moveTo(10.5, -38.5); c.lineTo(9, -43); c.lineTo(13, -40); c.fill(); }
  else{ c.beginPath(); c.moveTo(16, -39.5); c.quadraticCurveTo(8, -44, 3, -36); c.quadraticCurveTo(9, -38, 11, -34); c.fill(); }   // huppe dorée
  c.fillStyle = P.face; c.beginPath(); c.ellipse(16, -35, P.ring ? 3.1 : 2.4, P.ring ? 3.7 : 2.8, 0, 0, 7); c.fill();
  c.fillStyle = "#E8D7A8"; c.beginPath(); c.moveTo(18.8, -36.3); c.lineTo(23.5, -34.6); c.lineTo(18.8, -33.4); c.fill();
  c.fillStyle = "#FFFFFF"; c.beginPath(); c.arc(16.2, -36, 1.2, 0, 7); c.fill();
  c.fillStyle = "#1A1A1A"; c.beginPath(); c.arc(16.5, -36, 0.6, 0, 7); c.fill();
  c.restore();
}

// faisan de face (danse du vainqueur), pieds en (0, 0) ; wingL / wingR : 1 = levée, -1 = baissée
function drawPheasantFront(c, x, y, o = {}){
  const P = PLUMES[o.kind || 0];
  c.save(); c.translate(x, y); c.scale(1.15, 1.15);
  // ailes (derrière le corps quand elles sont baissées, bien visibles levées)
  const wing = (side, val) => {
    c.save(); c.translate(side * 8.5, -24); c.scale(side, 1); c.rotate(val > 0 ? -0.15 - val * 1.25 : 0.25 - val * 0.85);   // levée : presque à la verticale ; baissée : le long du corps
    c.fillStyle = P.wing; c.beginPath(); c.ellipse(7, 0, 9.5, 4.2, 0, 0, 7); c.fill();
    c.strokeStyle = "rgba(40,25,10,0.3)"; c.lineWidth = 0.8;
    c.beginPath(); c.moveTo(3, 1.2); c.lineTo(15, 1.6); c.moveTo(4, -1); c.lineTo(14, -0.6); c.stroke();
    c.restore();
  };
  wing(-1, o.wingL ?? -1); wing(1, o.wingR ?? -1);
  // pattes
  c.strokeStyle = "#8C8178"; c.lineWidth = 1.6;
  c.beginPath(); c.moveTo(-4, -9); c.lineTo(-5, 0); c.moveTo(4, -9); c.lineTo(5, 0);
  c.moveTo(-5, 0); c.lineTo(-8, 0.5); c.moveTo(5, 0); c.lineTo(8, 0.5); c.stroke();
  // corps et poitrine
  c.fillStyle = P.body; c.beginPath(); c.ellipse(0, -19, 10.5, 12.5, 0, 0, 7); c.fill();
  c.fillStyle = P.dots;
  for(const [a, b] of [[-4,-21],[3,-23],[0,-16],[-5,-14],[5,-15],[1,-27]]){ c.beginPath(); c.arc(a, b, 1, 0, 7); c.fill(); }
  // cou
  c.fillStyle = P.neck; c.beginPath(); c.ellipse(0, -32, 5, 6.5, 0, 0, 7); c.fill();
  if(P.ring){ c.strokeStyle = P.ring; c.lineWidth = 1.6; c.beginPath(); c.ellipse(0, -28.5, 4.6, 1.5, 0, 0, 7); c.stroke(); }
  else{ c.strokeStyle = "rgba(40,20,10,0.5)"; c.lineWidth = 0.9;
    for(const yy of [-34, -31, -28]){ c.beginPath(); c.moveTo(-4, yy); c.quadraticCurveTo(0, yy + 1.6, 4, yy); c.stroke(); } }
  // tête
  c.fillStyle = P.head;
  if(P.ring){ c.beginPath(); c.moveTo(-4, -42); c.lineTo(-6.5, -47.5); c.lineTo(-1.5, -44); c.moveTo(4, -42); c.lineTo(6.5, -47.5); c.lineTo(1.5, -44); c.fill(); }
  else{ c.beginPath(); c.moveTo(-4.5, -42); c.quadraticCurveTo(0, -51, 4.5, -42); c.fill(); }   // huppe
  c.beginPath(); c.arc(0, -39.5, 6, 0, 7); c.fill();
  c.fillStyle = P.face;
  for(const sx of [-1, 1]){ c.beginPath(); c.ellipse(sx * 3.3, -39.5, P.ring ? 2.6 : 2, P.ring ? 3.4 : 2.4, 0, 0, 7); c.fill(); }
  for(const sx of [-1, 1]){
    c.fillStyle = "#FFFFFF"; c.beginPath(); c.arc(sx * 3.1, -40.5, 1.2, 0, 7); c.fill();
    c.fillStyle = "#1A1A1A"; c.beginPath(); c.arc(sx * 3.1, -40.3, 0.6, 0, 7); c.fill();
  }

// objets lancés, dessinés autour de (0, 0), à peu près 30 px de long
function heartPath(c, k = 1){
  c.beginPath(); c.moveTo(0, 10 * k);
  c.bezierCurveTo(-5 * k, 6 * k, -14 * k, 0, -13 * k, -6.5 * k);
  c.bezierCurveTo(-12 * k, -13 * k, -3 * k, -14 * k, 0, -7 * k);
  c.bezierCurveTo(3 * k, -14 * k, 12 * k, -13 * k, 13 * k, -6.5 * k);
  c.bezierCurveTo(14 * k, 0, 5 * k, 6 * k, 0, 10 * k);
  c.closePath();
}
function drawObjet(c, type, x, y, rot = 0, sc = 1){
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(sc, sc);
  c.lineJoin = "round"; c.lineCap = "round";
  if(type === "roue"){
    // roue de vélo : pneu, jante, rayons croisés, moyeu, valve
    c.strokeStyle = "#9AA3A8"; c.lineWidth = 0.45;
    for(let i = 0; i < 16; i++){ const a0 = i / 16 * Math.PI * 2, a1 = a0 + (i % 2 ? 0.5 : -0.5);
      c.beginPath(); c.moveTo(Math.cos(a0) * 1.6, Math.sin(a0) * 1.6); c.lineTo(Math.cos(a1) * 10, Math.sin(a1) * 10); c.stroke(); }
    c.strokeStyle = "#C3CACE"; c.lineWidth = 1.3; c.beginPath(); c.arc(0, 0, 10.2, 0, 7); c.stroke();     // jante
    c.strokeStyle = "#3A3836"; c.lineWidth = 2.6; c.beginPath(); c.arc(0, 0, 12, 0, 7); c.stroke();       // pneu
    c.strokeStyle = "rgba(255,255,255,0.25)"; c.lineWidth = 0.7; c.beginPath(); c.arc(0, 0, 12.4, 3.6, 4.6); c.stroke();
    c.fillStyle = "#7B8389"; c.beginPath(); c.arc(0, 0, 2, 0, 7); c.fill();                               // moyeu
    c.fillStyle = "#C3CACE"; c.beginPath(); c.arc(0, 0, 0.8, 0, 7); c.fill();
    c.fillStyle = "#8C8178"; c.fillRect(-0.6, -10.4, 1.2, 2.2);                                           // valve
  }else if(type === "coeur"){
    const g = c.createRadialGradient(-4, -6, 1, 0, 0, 15);
    g.addColorStop(0, "#F6C6D2"); g.addColorStop(0.45, "#E592A8"); g.addColorStop(1, "#C24F6E");
    c.fillStyle = g; heartPath(c); c.fill();
    c.strokeStyle = "rgba(150,40,70,0.35)"; c.lineWidth = 0.8; heartPath(c); c.stroke();
    c.fillStyle = "rgba(255,255,255,0.7)"; c.beginPath(); c.ellipse(-6.5, -7, 3, 1.7, -0.6, 0, 7); c.fill();
    c.beginPath(); c.arc(-2.8, -9.6, 0.9, 0, 7); c.fill();
  }else if(type === "stylo"){
    // stylo plume : ce qui le fait reconnaître, c'est la grosse plume dorée, fendue, avec son petit trou
    c.rotate(-0.75);
    const g = c.createLinearGradient(0, -3, 0, 3);
    g.addColorStop(0, "#8A63C2"); g.addColorStop(0.45, "#562F96"); g.addColorStop(1, "#3B1F6A");
    c.fillStyle = g; roundRect(c, -16, -3, 15, 6, 3); c.fill();                                   // corps
    c.fillStyle = "#D9B44A"; c.fillRect(-4.2, -3.1, 1.4, 6.2);                                        // bague
    c.fillRect(-14, -4.6, 9, 1.3); c.beginPath(); c.arc(-5, -4, 1, 0, 7); c.fill();                  // agrafe
    c.fillStyle = "#2A2725"; c.beginPath(); c.moveTo(-1, -2.6); c.lineTo(2.5, -2.1); c.lineTo(2.5, 2.1); c.lineTo(-1, 2.6); c.closePath(); c.fill();   // section
    const n = c.createLinearGradient(0, -4.5, 0, 4.5); n.addColorStop(0, "#F3D877"); n.addColorStop(1, "#C99A2E");
    c.fillStyle = n; c.beginPath(); c.moveTo(2.2, -3.6);                                               // plume en fer de lance
    c.bezierCurveTo(7, -4.6, 12, -2.6, 16.5, 0); c.bezierCurveTo(12, 2.6, 7, 4.6, 2.2, 3.6); c.closePath(); c.fill();
    c.strokeStyle = "#7A5A10"; c.lineWidth = 0.7; c.beginPath(); c.moveTo(8.6, 0); c.lineTo(16.5, 0); c.stroke();   // fente
    c.fillStyle = "#7A5A10"; c.beginPath(); c.arc(8, 0, 1, 0, 7); c.fill();                           // trou
    c.strokeStyle = "rgba(255,255,255,0.5)"; c.lineWidth = 0.8;
    c.beginPath(); c.moveTo(-13.5, -1.6); c.lineTo(-6, -1.6); c.moveTo(4, -2.2); c.quadraticCurveTo(8, -2.6, 11, -1.4); c.stroke();
  }else if(type === "reveil"){
    // réveil matin : deux cloches, marteau, cadran blanc à aiguilles, petits pieds

    c.beginPath(); c.moveTo(-5, 6.5); c.lineTo(-7.5, 10); c.moveTo(5, 6.5); c.lineTo(7.5, 10); c.stroke();   // pieds
    c.beginPath(); c.moveTo(0, -9.5); c.lineTo(0, -12.5); c.stroke();                                         // marteau
    c.fillStyle = "#5E5650"; c.beginPath(); c.arc(0, -12.8, 1.2, 0, 7); c.fill();
    for(const sx of [-1, 1]){                                                                               // cloches en dôme, posées sur le boîtier

      c.fillStyle = bg; c.beginPath(); c.arc(0, 0, 4, Math.PI, 0); c.closePath(); c.fill();
      c.fillStyle = "#B08425"; c.fillRect(-4.3, -0.4, 8.6, 1.2);                                               // bord de la cloche
      c.fillStyle = "#8C6A16"; c.beginPath(); c.arc(0, -4.3, 0.9, 0, 7); c.fill();                            // petit bouton
      c.restore();
    }
    const bd = c.createRadialGradient(-3, -3, 1, 0, 0, 10); bd.addColorStop(0, "#E07A92"); bd.addColorStop(1, "#B0405C");
    c.fillStyle = bd; c.beginPath(); c.arc(0, 0, 9, 0, 7); c.fill();                                          // boîtier
    c.fillStyle = "#FFFDF7"; c.beginPath(); c.arc(0, 0, 6.6, 0, 7); c.fill();                                 // cadran
    c.fillStyle = "#6B6560"; for(let i = 0; i < 4; i++){ const a = i * Math.PI / 2; c.fillRect(Math.cos(a) * 5.4 - 0.5, Math.sin(a) * 5.4 - 0.5, 1, 1); }
    c.strokeStyle = "#2A2725"; c.lineWidth = 1; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -4.4); c.moveTo(0, 0); c.lineTo(3.2, 1.4); c.stroke();   // aiguilles
    c.fillStyle = "#C24F6E"; c.beginPath(); c.arc(0, 0, 0.9, 0, 7); c.fill();
    c.fillStyle = "rgba(255,255,255,0.45)"; c.beginPath(); c.ellipse(-4.4, -5.6, 2.2, 1.1, -0.7, 0, 7); c.fill();
  }
  c.restore();
}
// couronne du vainqueur
function drawCrown(c, x, y, s = 1){

  c.fillStyle = "#FFF6D0"; for(const [a, b] of [[-7.5,-7],[0,-9.5],[7.5,-7]]){ c.beginPath(); c.arc(a, b, 1, 0, 7); c.fill(); }
  c.restore();
}

function burst(type, x, y, big){

  }
  // morceaux de façade (couleur de la maison touchée) et fenêtres

  if(b && y > b.top - 50){

function drawParticle(p){
  ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, p.life)); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(p.s, p.s);
  ctx.fillStyle = p.color;
  switch(p.kind){
    case "smoke": ctx.globalAlpha *= 0.11; ctx.fillStyle = css("--ink-faint"); ctx.beginPath(); ctx.arc(0, 0, 1, 0, 7); ctx.fill(); break;
    case "chunk": ctx.fillRect(-2.2, -1.6, 4.4, 3.2); break;
    case "spoke": ctx.strokeStyle = p.color; ctx.lineWidth = 0.7; ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(5, 0); ctx.stroke(); break;
    case "rubber": ctx.beginPath(); ctx.ellipse(0, 0, 2.6, 1.1, 0, 0, 7); ctx.fill(); break;
    case "lips":   // petite bouche en bisou
      ctx.beginPath(); ctx.moveTo(-4, 0); ctx.quadraticCurveTo(-2, -2.6, 0, -1.1); ctx.quadraticCurveTo(2, -2.6, 4, 0);
      ctx.quadraticCurveTo(0, 3.4, -4, 0); ctx.fill();
      ctx.strokeStyle = "rgba(120,20,50,0.5)"; ctx.lineWidth = 0.5; ctx.beginPath(); ctx.moveTo(-3.4, 0); ctx.quadraticCurveTo(0, 0.8, 3.4, 0); ctx.stroke(); break;
    case "miniheart": ctx.beginPath(); ctx.moveTo(0, 2.4); ctx.bezierCurveTo(-4, -0.4, -2.6, -4, 0, -1.8); ctx.bezierCurveTo(2.6, -4, 4, -0.4, 0, 2.4); ctx.fill(); break;
    case "letter": ctx.font = "italic 700 11px Georgia, 'Times New Roman', serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(p.ch, 0, 0); break;
    case "gear": ctx.beginPath(); for(let i = 0; i < 16; i++){ const r = i % 2 ? 2.2 : 3.2, a = i / 16 * Math.PI * 2; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
                 ctx.closePath(); ctx.fill(); ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.beginPath(); ctx.arc(0, 0, 0.8, 0, 7); ctx.fill(); break;
    case "spring": ctx.strokeStyle = p.color; ctx.lineWidth = 0.7; ctx.beginPath(); ctx.moveTo(-4, 0);
                   for(let i = 0; i < 8; i++) ctx.lineTo(-3 + i, i % 2 ? -1.6 : 1.6); ctx.lineTo(5, 0); ctx.stroke(); break;
    case "digit": ctx.font = "700 8px 'Courier Prime', monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(p.ch, 0, 0); break;
    case "ink": ctx.beginPath(); ctx.arc(0, 0, 1.6, 0, 7); ctx.arc(1.8, 1, 0.8, 0, 7); ctx.fill(); break;
    case "confetti": ctx.fillRect(-2.4, -1.2, 4.8, 2.4); break;
    case "feather": ctx.beginPath(); ctx.ellipse(0, 0, 5, 1.6, 0, 0, 7); ctx.fill(); break;
    default: ctx.fillRect(-1.3, -1.3, 2.6, 2.6);
  }
  ctx.restore();
}

let cvW = W;   // largeur affichée du canevas, lue une fois par image
// temps réel : l'animation avance selon l'horloge, pas d'un pas fixe par image —
// si le navigateur ne tient que 30 images/s (économie d'énergie…), rien ne passe au ralenti
let lastNow = 0, pathAcc = 0, dt = 1 / 60;
function frame(now){
  dt = lastNow ? Math.min(0.05, (now - lastNow) / 1000) : 1 / 60; lastNow = now;
  const k60 = dt * 60;   // nombre d'« images à 60/s » écoulées
  cssCache.clear(); cvW = cv.clientWidth || W;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if(shake > 0.3){ ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake); shake *= 0.86 ** k60; } else shake = 0;
  // ciel
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  // fin de partie : le ciel vire au mauve et au citron, les fenêtres s'allument, confettis
  if(world.over){
    const before = Math.floor(finale * 10); finale = Math.min(1, finale + dt / 2.2);
    if(Math.floor(finale * 10) !== before) renderCity(world, finale);
    if(dance && dance.t > 0 && dance.t < 3.5 && Math.random() < 0.55 * k60) particles.push({ x: Math.random() * W, y: -6, vx: (Math.random() - 0.5) * 30 + world.wind * 2,
      vy: 20 + Math.random() * 40, life: 3, decay: 0.45, kind: "confetti", color: ["#9558D0","#E6D63C","#7DB536","#D98DA1"][Math.floor(Math.random() * 4)],
      rot: Math.random() * 6, vr: (Math.random() - 0.5) * 8, s: 0.8 + Math.random() * 0.6, sway: Math.random() * 6 });
  }else finale = 0;
  sky.addColorStop(0, lerpHex(css("--sky-top"), css("--sky-end-top"), finale));
  sky.addColorStop(1, lerpHex(css("--sky-bottom"), css("--sky-end-bottom"), finale));
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  // nuages poussés par le vent
  ctx.fillStyle = css("--cloud");
  for(const cl of clouds){
    cl.x += (world.wind * 0.09 + 0.05) * cl.s * k60; if(cl.x > W + 80) cl.x = -80; if(cl.x < -80) cl.x = W + 80;
    ctx.beginPath();
    for(const [dx, dy, r] of [[0,0,16],[18,-6,20],[38,0,15],[20,5,15]]) { ctx.moveTo(cl.x + dx * cl.s + r * cl.s, cl.y + dy * cl.s); ctx.arc(cl.x + dx * cl.s, cl.y + dy * cl.s, r * cl.s, 0, 7); }
    ctx.fill();
  }
  ctx.drawImage(city, 0, 0, W, H);
  // trace du coup précédent du joueur dont c'est le tour
  // coups précédents des deux joueurs (manche en cours) : le sien plus marqué
  if(S.trace && !world.over) for(let k = 0; k < 2; k++){
    const pth = world.lastPath[k];
    if(!pth || (anim && anim.shot.p === k)) continue;
    ctx.fillStyle = css(PLAYERS[k].color); ctx.globalAlpha = turn() === k ? 0.42 : 0.2;
    for(let i = 0; i < pth.length; i += 6){ ctx.beginPath(); ctx.arc(pth[i], pth[i + 1], turn() === k ? 1.6 : 1.2, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  // faisans
  for(let k = 0; k < 2; k++){
    if(tumble && tumble.k === k) continue;
    if(world.over && world.fallen === k && !tumble) continue;
    wingT[k] = Math.max(0, wingT[k] - dt * 2.5);
    let hop = 0;
    if(world.over && world.winner === k){
      // le vainqueur se met de face et danse : une aile en haut, l'autre en bas,
      // inversées à chaque temps, petits bonds, plumes qui volent
      const f = { kind: persoOf(k), wingL: -1, wingR: -1, crown: true };
      if(dance){
        dance.t += dt;
        const beat = Math.floor(dance.t / DANCE_BEAT), ph = dance.t / DANCE_BEAT - beat;
        if(dance.t >= 0 && beat < DANCE_BEATS){
          const up = beat % 2 === 0; f.wingL = up ? 1 : -0.7; f.wingR = up ? -0.7 : 1;
          hop = Math.sin(ph * Math.PI) * 8;
          if(beat !== dance.beat){ dance.beat = beat; puffFeathers(world.ph[k].x, world.ph[k].y - 26, persoOf(k), 3); }
        }
      }
      drawPheasantFront(ctx, world.ph[k].x, world.ph[k].y - hop, f);
    }else drawPheasant(ctx, world.ph[k].x, world.ph[k].y, k === 0 ? 1 : -1, { kind: persoOf(k), wing: Math.sin(Math.min(1, wingT[k]) * Math.PI) });
    // initiales au-dessus, couleurs de l'écran de chat
    ctx.font = `700 ${F(13)}px 'Courier Prime', monospace`; ctx.textAlign = "center";
    ctx.fillStyle = css(PLAYERS[k].color); ctx.globalAlpha = turn() === k && !world.over ? 1 : 0.55;
    const champion = world.over && world.winner === k;
    ctx.fillText(champion ? PLAYERS[k].nom : PLAYERS[k].ini, world.ph[k].x, world.ph[k].y - (champion ? 80 : 64) - hop); ctx.globalAlpha = 1;
  }
  if(tumble){
    tumble.t += dt; tumble.vy += 500 * dt; tumble.x += tumble.vx * dt; tumble.y += tumble.vy * dt; tumble.rot += tumble.vr * dt;
    drawPheasant(ctx, tumble.x, tumble.y, tumble.dir, { kind: persoOf(tumble.k), rot: tumble.rot, alpha: Math.max(0, 1 - tumble.t / 1.3) });
  }
  // objet en vol
  if(anim){
    pathAcc += k60; const steps = Math.floor(pathAcc); pathAcc -= steps;   // un point de trajectoire = 1/60 s
    for(let s = 0; s < steps && anim; s++){
      anim.i += 2;
      if(anim.i >= anim.res.path.length - 2){ endShot(); break; }
    }
    if(anim){
      const p = anim.res.path;
      ctx.fillStyle = css(PLAYERS[anim.shot.p].color); ctx.globalAlpha = 0.35;
      for(let i = Math.max(0, anim.i - 40); i < anim.i; i += 6){ ctx.beginPath(); ctx.arc(p[i], p[i + 1], 1.2, 0, 7); ctx.fill(); }
      ctx.globalAlpha = 1;
      const x = p[anim.i], y = p[anim.i + 1];
      if(y < -8){   // au-dessus de l'écran : petit repère
        ctx.fillStyle = css(PLAYERS[anim.shot.p].color);
        ctx.beginPath(); ctx.moveTo(x, 4); ctx.lineTo(x - 5, 12); ctx.lineTo(x + 5, 12); ctx.fill();
      }else{
        drawObjet(ctx, anim.shot.o, x, y, anim.i * 0.09 * (anim.shot.p ? -1 : 1), OBJ_SIZE[anim.shot.o]);
        if(anim.shot.o === "stylo" && anim.i % 8 === 0) particles.push({ x, y, vx: 0, vy: 10, life: 0.8, decay: 0.9, kind: "ink", color: "#562F96", rot: 0, vr: 0, s: 0.6 });   // gouttes d'encre
      }
    }
  }
  // éclats
  for(const f of flashes){ f.t += dt * 2.2;
    const k = Math.min(1, f.t * 4), fade = Math.max(0, 1 - f.t);
    // boule de feu : blanc au cœur, citron, orangé, puis rien
    const R0 = f.r * (0.5 + 0.9 * k);
    const gr = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, R0);
    gr.addColorStop(0, `rgba(255,255,245,${0.95 * fade})`);
    gr.addColorStop(0.35, `rgba(246,226,90,${0.85 * fade})`);
    gr.addColorStop(0.7, `rgba(233,137,60,${0.55 * fade})`);
    gr.addColorStop(1, "rgba(233,137,60,0)");
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(f.x, f.y, R0, 0, 7); ctx.fill();
    // onde de choc
    ctx.strokeStyle = css("--lucky-lemon"); ctx.globalAlpha = fade * 0.9; ctx.lineWidth = 4 * fade + 1;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.8 + f.t * 2.2), 0, 7); ctx.stroke(); ctx.globalAlpha = 1; }
  flashes = flashes.filter(f => f.t < 1);
  for(const p of particles){
    if(p.kind === "feather"){ p.vy = Math.min(p.vy + 120 * dt, 45); p.vx *= 0.97 ** k60; p.x += Math.sin(p.life * 8 + p.sway) * 0.6 * k60; }
    else if(p.float){ p.vy += 90 * dt; p.vx *= 0.985 ** k60; p.vy *= 0.985 ** k60; }
    else if(p.kind === "confetti"){ p.vy = Math.min(p.vy + 60 * dt, 70); p.x += Math.sin(p.life * 9 + p.sway) * 0.7 * k60; }
    else if(p.kind === "smoke"){ p.s += 0.35 * k60; p.vx *= 0.97 ** k60; p.vy *= 0.98 ** k60; }
    else p.vy += 420 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= p.decay * dt;
    drawParticle(p);
  }
  particles = particles.filter(p => p.life > 0 && p.y < H + 30);
  hud();
  requestAnimationFrame(frame);
}

const F = px => Math.round(px * Math.max(1, 700 / cvW));   // texte du canevas lisible sur téléphone
function hud(){
  ctx.textBaseline = "alphabetic";
  // dernier coup de chacun (pas de score : une partie = une touche)
  for(let k = 0; k < 2; k++){
    const x = k ? W - 22 : 22, ls = lastShotOf(k); ctx.textAlign = k ? "right" : "left";
    ctx.font = `700 ${F(15)}px 'Courier Prime', monospace`; ctx.fillStyle = css(PLAYERS[k].color);
    ctx.fillText(ls ? `${PLAYERS[k].ini}> ${ls.a}° · ${ls.v}` : `${PLAYERS[k].ini}>`, x, 14 + F(18));
  }
  // vent
  ctx.textAlign = "center"; ctx.font = `700 ${F(12)}px 'Courier Prime', monospace`; ctx.fillStyle = css("--ink-soft");
  ctx.fillText(world.wind ? `vent ${Math.abs(world.wind)}` : "pas de vent", W / 2, 12 + F(14));
  if(world.wind){
    const len = (10 + Math.abs(world.wind) * 6) * F(10) / 10, d = Math.sign(world.wind), ay = 24 + F(14);
    ctx.strokeStyle = css("--accent"); ctx.fillStyle = css("--accent"); ctx.lineWidth = 2.5; ctx.lineCap = "round";
    ctx.lineWidth = 2.5 * F(10) / 10;
    ctx.beginPath(); ctx.moveTo(W / 2 - d * len / 2, ay); ctx.lineTo(W / 2 + d * len / 2, ay); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W / 2 + d * (len / 2 + 6), ay); ctx.lineTo(W / 2 + d * len / 2 - d, ay - 5); ctx.lineTo(W / 2 + d * len / 2 - d, ay + 5); ctx.fill();
  }
  // bandeau de fin
  if(banner){
    banner.t += dt; const a = Math.min(1, banner.t * 3, (banner.d - banner.t) * 2);
    if(a <= 0 && banner.t > banner.d) banner = null;
    else{ ctx.globalAlpha = Math.max(0, a); ctx.font = `700 ${F(30)}px 'Courier Prime', monospace`;
      const by = H * 0.38;
      ctx.lineJoin = "round"; ctx.strokeStyle = css("--surface"); ctx.lineWidth = 6;
      ctx.strokeText(banner.text, W / 2, by);
      ctx.fillStyle = banner.color || css("--ink"); ctx.fillText(banner.text, W / 2, by);
      if(banner.sub){ ctx.font = `${F(15)}px 'Courier Prime', monospace`; ctx.lineWidth = 4;
        ctx.strokeText(banner.sub, W / 2, H * 0.38 + F(26));
        ctx.fillStyle = css("--ink-soft"); ctx.fillText(banner.sub, W / 2, H * 0.38 + F(26)); }
      ctx.globalAlpha = 1; }
  }
}

// =====================================================================
//  Jouer un coup
// =====================================================================
function play(shot, res, done){
  busy = true; refreshUI();
  wingT[shot.p] = 1;
  anim = { shot, res, i: 0, done };
  sound("lancer");
}
function endShot(){
  const { shot, res, done } = anim; anim = null;
  const e = res.end;
  if(e.kind === "miss"){
    sound("rate");
    setTimeout(()=>{ world = applyResult(world, shot, res); finish(done); }, 350);
    return;
  }
  burst(shot.o, e.x, e.y, e.kind === "hit");
  sound("boum"); sound({ roue:"roulibre", coeur:"bisous", stylo:"plume", reveil:"reveil" }[shot.o]);
  if(e.kind === "city"){
    world = applyResult(world, shot, res); renderCity(world);
    setTimeout(()=> finish(done), 450);
    return;
  }
  // un faisan touché
  const v = e.victim, q = world.ph[v];
  feathers(q.x, q.y, persoOf(v));
  tumble = { k: v, x: q.x, y: q.y, vx: (v ? 1 : -1) * 90, vy: -220, rot: 0, vr: (v ? 1 : -1) * 7, dir: v ? -1 : 1, t: 0 };
  const winner = v === shot.p ? 1 - shot.p : shot.p;
  const before = world;
  const crater = { x:e.x, y:e.y, r:R().trou * 1.6, shape: shot.o === "coeur" ? "coeur" : undefined };
  before.craters.push(crater); renderCity(before); before.craters.pop();
  setTimeout(()=>{
    tumble = null;
    world = applyResult(before, shot, res);
    renderCity(world);
    if(world.over){
      dance = { k: winner, t: -0.25, beat: -1 }; sound("cri"); setTimeout(()=> sound("musique"), 650);
      banner = { text: `${PLAYERS[winner].nom} gagne !`, sub: v === shot.p ? `${PLAYERS[v].nom} s'est eu tout seul` : "", color: css(PLAYERS[winner].color), t: 0, d: 5 };
    }
    finish(done);
  }, 1500);
}
function finish(done){
  busy = false;
  if(done) done();
  refreshUI();
}

function lancer(){
  if(busy || world.over) return;
  const p = turn();
  const a = clamp(Math.round(Number($("#angle").value)), 0, 90);
  const v = clamp(Math.round(Number($("#vitesse").value)), 1, 200);
  if(!isFinite(a) || !isFinite(v)) return;
  const shot = { p, a, v, o: game.objets[p], at: Date.now() };
  const res = simulate(world, shot);
  game.shots.push(shot); save();
  play(shot, res, ()=>{
    if(S.tpt && !world.over) showAttente();   // après une victoire, pas d'attente : la partie est finie de ce côté
  });
}
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

// tour par tour : bandeau « En attente de … » jusqu'à ce que l'autre arrive ; il voit alors le coup qu'on vient de jouer
// deux temps : 1) celui qui vient de jouer voit « En attente de … » ;
// 2) l'autre, en arrivant, voit « … a joué ! » et découvre le coup quand il veut (« Voir son coup »)
function showBand(mode){
  bandMode = mode;
  const p = turn(), last = game.shots[game.shots.length - 1], who = mode === "attente" ? p : last.p;
  $("#attenteQui").textContent = mode === "attente" ? `En attente ${de(PLAYERS[p].nom)}…` : `${PLAYERS[last.p].nom} a joué !`;
  $("#attente").style.setProperty("--pc", css(PLAYERS[who].color));
  $("#attente").classList.toggle("decouverte", mode === "decouverte");
  $("#attenteGo").className = mode === "attente" ? "btn ghost" : "poussoir";
  $("#attenteGo").textContent = mode === "attente" ? `${PLAYERS[p].nom} arrive` : "Voir son coup";
  $("#attenteGo").title = mode === "attente" ? "Banc d'essai : simule le passage de l'autre joueur" : "";
  if(mode === "decouverte"){   // la surprise reste entière : le décor revient d'un cran, le coup n'est pas encore montré
    hideLast = true; world = worldAfter(game.shots.length - 1); renderCity(world); banner = null; dance = null;
  }
  $("#attente").classList.add("on"); sound("attente"); refreshUI();
}
const showAttente = () => showBand("attente");
// rejouer le dernier coup : le monde revient d'un cran, le coup repart, tout se retrouve à l'identique
function replayLast(decouverte){
  const n = game.shots.length;
  if(!n || busy) return;
  dance = null; banner = null; hideLast = false;
  world = worldAfter(n - 1); renderCity(world);
  const shot = game.shots[n - 1], res = simulate(world, shot);
  if(decouverte === true){ game.decouvert = n; save(); }
  play(shot, res, null);
}
$("#attenteGo").addEventListener("click", ()=>{
  $("#attente").classList.remove("on");
  if(!game.shots.length){ refreshUI(); return; }
  if(bandMode === "attente") setTimeout(()=> showBand("decouverte"), 650);   // banc : l'autre ouvre la partie
  else setTimeout(()=> replayLast(true), 350);
});
$("#revoir").addEventListener("click", ()=> replayLast(false));
document.querySelectorAll(".pas").forEach(b => {
  let t1 = null, t2 = null;
  const pas = ()=>{ const inp = $("#" + b.dataset.for); if(inp.disabled) return;
    inp.value = clamp((Number(inp.value) || 0) + Number(b.dataset.d), Number(inp.min), Number(inp.max)); };
  const stop = ()=>{ clearTimeout(t1); clearInterval(t2); t1 = t2 = null; };
  b.addEventListener("pointerdown", e => { e.preventDefault(); pas(); t1 = setTimeout(()=>{ t2 = setInterval(pas, 70); }, 380); });
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev => b.addEventListener(ev, stop));
  b.addEventListener("click", e => e.preventDefault());   // pas de double pas, et le libellé ne vole pas le clic
});

function buildObjets(){
  const box = $("#objets"); box.innerHTML = "";
  for(const k in OBJETS){
    const b = document.createElement("button"); b.type = "button"; b.dataset.o = k; b.title = OBJETS[k];
    const c = document.createElement("canvas"); c.width = c.height = 60;
    const x = c.getContext("2d"); x.scale(2, 2); drawObjet(x, k, 15, 15.5, 0, OBJ_SIZE[k] * 0.78);
    b.appendChild(c); box.appendChild(b);
    b.addEventListener("click", ()=>{ game.objets[turn()] = k; save(); refreshUI(); });
  }
}
function buildPersos(){
  const box = $("#persos"); box.innerHTML = "";
  [0, 1].forEach(kind => {   // pas de nom : chaque faisan prend le prénom de son joueur
    const b = document.createElement("button"); b.type = "button"; b.dataset.k = kind; b.setAttribute("aria-label", "Choisir ce faisan");
    const c = document.createElement("canvas"); c.width = 80; c.height = 68;
    const x = c.getContext("2d"); x.scale(2, 2); x.translate(26, 31); x.scale(0.45, 0.45); drawPheasant(x, 0, 0, 1, { kind }); b.appendChild(c); box.appendChild(b);
    b.addEventListener("click", ()=>{ if(game.shots.length) return; game.perso = kind === 0 ? [0, 1] : [1, 0]; save(); refreshUI(); });
  });
}
function refreshUI(){
  const p = turn(), col = css(PLAYERS[p].color), attente = $("#attente").classList.contains("on");
  $("#invite").textContent = world.over ? "" : PLAYERS[p].ini + ">";
  $("#coup").style.setProperty("--pcolor", col);
  $("#invite").style.color = col;
  for(const id of ["#angle", "#vitesse"]) $(id).style.color = col;
  document.querySelectorAll(".objets button").forEach(b => b.classList.toggle("on", b.dataset.o === game.objets[p]));
  $("#persos").hidden = game.shots.length > 0 || busy;   // seulement avant le premier coup, pour celui qui lance la partie
  document.querySelectorAll(".persos button").forEach(b => b.classList.toggle("on", Number(b.dataset.k) === persoOf(0)));
  const lock = busy || attente;
  $("#angle").disabled = $("#vitesse").disabled = lock || world.over;
  document.querySelectorAll(".pas").forEach(b => b.disabled = lock || world.over);
  if(world.over){
    $("#lancer").textContent = "Nouvelle partie"; $("#lancer").disabled = busy;
    $("#statut").textContent = `${PLAYERS[world.winner].nom} gagne.`;
  }else{
    $("#lancer").textContent = "Lancer"; $("#lancer").disabled = lock;
    $("#statut").textContent = busy ? "" : attente ? "" : `À ${PLAYERS[p].nom} de lancer ${OBJETS_ART[game.objets[p]]}.`;
  }
  $("#annuler").disabled = busy || !game.shots.length;
  const last = game.shots[game.shots.length - 1];
  $("#revoir").hidden = !last || attente;
  $("#revoir").disabled = busy;
  if(last) $("#revoir").textContent = `Revoir le coup ${de(PLAYERS[last.p].nom)}`;
  if(!busy && !attente && !world.over){
    const ls = lastShotOf(p);
    $("#angle").value = ls ? ls.a : 45; $("#vitesse").value = ls ? ls.v : 60;
  }
}
function renderEtat(){
  const lines = [`graine ${game.seed} · règles ${RULE_KEYS.map(k => k + "=" + game.regles[k]).join(" ")}`];
  let w = freshWorld();
  const LAB = { city: "trou", miss: "raté", hit: "touché" };
  game.shots.forEach((s, i) => {
    const res = simulate(w, s); w = applyResult(w, s, res);
    lines.push(`${String(i + 1).padStart(2)}. ${PLAYERS[s.p].ini.padEnd(2)}> ${s.a} ${s.v} ${s.o}  · ${LAB[res.end.kind]}${res.end.kind === "city" ? ` (${Math.round(res.end.x)}, ${Math.round(res.end.y)})` : ""}`);
  });
  if(!game.shots.length) lines.push("(aucun coup)");
  $("#etat").textContent = lines.join("\n");
}

// sons (synthétisés, sans fichier)
let AC = null;
function noise(len){
  const buf = AC.createBuffer(1, Math.max(1, AC.sampleRate * len | 0), AC.sampleRate), d = buf.getChannelData(0);
  for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource(); src.buffer = buf; return src;
}
function env(t, a, peak, dur){ const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); return g; }
function sound(kind){
  if(!S.son) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === "suspended") AC.resume();
    const t = AC.currentTime, out = AC.createGain(); out.gain.value = 0.22; out.connect(AC.destination);
    if(kind === "lancer" || kind === "rate"){
      const len = kind === "lancer" ? 0.35 : 0.25, src = noise(len);
      const f = AC.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 1.2;
      f.frequency.setValueAtTime(kind === "lancer" ? 500 : 900, t); f.frequency.exponentialRampToValueAtTime(kind === "lancer" ? 1800 : 300, t + len);
      const g = env(t, 0.05, 0.8, len); src.connect(f); f.connect(g); g.connect(out); src.start(t);
    }else if(kind === "boum"){
      // grondement (bruit qui s'assourdit) + coup sourd
      const n = noise(0.7), lp = AC.createBiquadFilter(); lp.type = "lowpass";
      lp.frequency.setValueAtTime(1600, t); lp.frequency.exponentialRampToValueAtTime(120, t + 0.6);
      const gn = env(t, 0.005, 1.4, 0.7); n.connect(lp); lp.connect(gn); gn.connect(out); n.start(t);
      const o = AC.createOscillator(), g = env(t, 0.005, 1.2, 0.45);
      o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.4);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.5);
    }else if(kind === "reveil"){
      // réveil qui sonne par paquets « drrrin… drrrin… drrrrrin ! » (le marteau entre deux cloches),
      // chaque paquet un peu plus aigu et plus long, puis le ressort qui lâche : « boïng »
      let d = 0.03;
      [[0.22, 1], [0.22, 1.06], [0.36, 1.12]].forEach(([len, up]) => {
        for(let x = 0; x < len; x += 0.024){
          const o = AC.createOscillator(); o.type = "triangle"; o.frequency.value = (Math.round(x / 0.024) % 2 ? 1650 : 1980) * up;
          const g = env(t + d + x, 0.002, 0.26, 0.04); o.connect(g); g.connect(out); o.start(t + d + x); o.stop(t + d + x + 0.05);
        }
        d += len + 0.11;
      });
      const o = AC.createOscillator(); o.type = "sine"; const lfo = AC.createOscillator(), lg = AC.createGain();
      lfo.frequency.value = 18; lg.gain.value = 70; lfo.connect(lg); lg.connect(o.frequency);
      o.frequency.setValueAtTime(420, t + d); o.frequency.exponentialRampToValueAtTime(160, t + d + 0.5);
      const gb = env(t + d, 0.005, 0.45, 0.55); o.connect(gb); gb.connect(out); o.start(t + d); o.stop(t + d + 0.6); lfo.start(t + d); lfo.stop(t + d + 0.6);
    }else if(kind === "attente"){
      // le bandeau arrive : deux notes douces
      for(const [d, f] of [[0, 660], [0.11, 990]]){
        const o = AC.createOscillator(); o.type = "sine"; o.frequency.value = f;
        const g = env(t + d, 0.01, 0.35, 0.5); o.connect(g); g.connect(out); o.start(t + d); o.stop(t + d + 0.55);
      }
    }else if(kind === "bisous"){
      // « smack » : petit claquement puis glissé qui monte, trois fois
      for(const d of [0.04, 0.2, 0.33]){
        const n = noise(0.03), bp = AC.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 2400; bp.Q.value = 1.5;
        const gn = env(t + d, 0.002, 0.9, 0.035); n.connect(bp); bp.connect(gn); gn.connect(out); n.start(t + d);
        const o = AC.createOscillator(); o.type = "sine";
        o.frequency.setValueAtTime(520, t + d); o.frequency.exponentialRampToValueAtTime(1500, t + d + 0.09);
        const g = env(t + d, 0.004, 0.45, 0.11); o.connect(g); g.connect(out); o.start(t + d); o.stop(t + d + 0.13);
      }
    }else if(kind === "plume"){
      // stylo qui griffonne : « scratch-scratch, scratch-scratch, scratch-scratch-scratch »
      // chaque trait = un frottement court au grain irrégulier ; l'aller un peu plus aigu que le retour
      const sr = AC.sampleRate;
      const trait = (d, len, f, amp) => {
        const buf = AC.createBuffer(1, sr * len | 0, sr), dd = buf.getChannelData(0); let gr = 0;
        for(let i = 0; i < dd.length; i++){ gr += (Math.random() - 0.5) * 0.7; gr *= 0.9;
          dd[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / dd.length) ** 0.5 * (0.6 + gr); }
        const src = AC.createBufferSource(); src.buffer = buf;
        const bp = AC.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = f; bp.Q.value = 2.5;
        const g = AC.createGain(); g.gain.value = amp; src.connect(bp); bp.connect(g); g.connect(out); src.start(t + d);
      };
      [[0.03, 4200], [0.10, 3300], [0.27, 4400], [0.34, 3400], [0.51, 4600], [0.565, 3600], [0.62, 4800]]
        .forEach(([d, f], i) => trait(d, i === 6 ? 0.075 : 0.055, f + Math.random() * 300, 1.1));
    }else if(kind === "roulibre"){
      // roue de vélo : la roue libre cliquette en ralentissant… puis « dring dring ! » qui tombe en rythme
      let d = 0.03, gap = 0.034;
      for(let i = 0; i < 12; i++){
        const n = noise(0.012), bp = AC.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 3400 + (i % 2) * 700; bp.Q.value = 5;
        const g = env(t + d, 0.001, 0.8 - i * 0.03, 0.02); n.connect(bp); bp.connect(g); g.connect(out); n.start(t + d);
        d += gap; gap *= 1.12;
      }
      const timbre = (dd, amp, len) => {
        for(const [ratio, a] of [[1, 1], [2.76, 0.55], [5.4, 0.28], [8.9, 0.12]]){
          const o = AC.createOscillator(); o.type = "sine"; o.frequency.value = 2150 * ratio;
          const g = env(t + dd, 0.002, amp * a, len / ratio ** 0.4); o.connect(g); g.connect(out); o.start(t + dd); o.stop(t + dd + len + 0.05);
        }
      };
      const d1 = d + 0.12, d2 = d1 + 0.3;   // un temps de silence, puis dring… dring !
      for(const st of [d1, d2]) for(let i = 0; i < 6; i++) timbre(st + i * 0.034, i === 5 ? 0.32 : 0.2, i === 5 ? 0.55 : 0.09);
    }else if(kind === "cri"){
      // « kôk-kôk » du faisan : deux appels rauques, puis un battement d'ailes
      for(const [d, f0] of [[0, 1050], [0.2, 980]]){
        const o = AC.createOscillator(); o.type = "sawtooth";
        o.frequency.setValueAtTime(f0, t + d); o.frequency.exponentialRampToValueAtTime(f0 * 0.62, t + d + 0.14);
        const bp = AC.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 1400; bp.Q.value = 2.5;
        const g = env(t + d, 0.01, 1.1, 0.16); o.connect(bp); bp.connect(g); g.connect(out); o.start(t + d); o.stop(t + d + 0.2);
      }
      for(let i = 0; i < 6; i++){
        const n = noise(0.05), hp = AC.createBiquadFilter(); hp.type = "bandpass"; hp.frequency.value = 600; hp.Q.value = 0.8;
        const g = env(t + 0.42 + i * 0.055, 0.004, 0.5, 0.05); n.connect(hp); hp.connect(g); g.connect(out); n.start(t + 0.42 + i * 0.055);
      }
    }else if(kind === "musique"){
      // petite fanfare (air original), deux notes par temps de la danse
      const st = DANCE_BEAT / 2, M = [0,4,7,12, 7,4,7,12, 9,5,9,14, 12,null,7,null, 5,9,12,9, 4,7,12,7, 2,7,11,14, 12,null,null,null];
      M.forEach((m, i) => { if(m == null) return;
        const o = AC.createOscillator(); o.type = "square"; o.frequency.value = 523.25 * 2 ** (m / 12);
        const lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2400;
        const g = env(t + i * st, 0.008, 0.35, st * 0.9); o.connect(lp); lp.connect(g); g.connect(out);
        o.start(t + i * st); o.stop(t + i * st + st);
        if(i % 4 === 0){ const b = AC.createOscillator(); b.type = "triangle"; b.frequency.value = 130.81 * 2 ** ((m % 12) / 12);
          const gb = env(t + i * st, 0.01, 0.5, st * 3.5); b.connect(gb); gb.connect(out); b.start(t + i * st); b.stop(t + i * st + st * 4); }
      });
    }
  }catch(e){}
}

// départ
sizeCanvas(); renderCity(world); buildObjets(); buildPersos(); renderEtat(); refreshUI();
DARK.addEventListener("change", ()=>{ applyPalette(); renderCity(world, world.over ? finale : 0); buildObjets(); refreshUI(); });
window.addEventListener("resize", ()=>{ const d = Math.min(2, window.devicePixelRatio || 1); if(d !== DPR){ sizeCanvas(); renderCity(world, world.over ? finale : 0); } });
if(document.fonts) document.fonts.ready.then(()=> refreshUI());
// en ouvrant la page : si le dernier coup n'a pas encore été découvert (même gagnant), « … a joué ! »
// d'abord — le perdant ne voit pas le faisan couronné avant d'avoir révélé le coup
if(S.tpt && game.shots.length && game.decouvert !== game.shots.length) showBand("decouverte");
requestAnimationFrame(frame);
